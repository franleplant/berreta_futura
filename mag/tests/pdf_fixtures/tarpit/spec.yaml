  - at: "p2 line 1, this approach offers significant"
    pypdf: "o\\u21b5ers: the ff ligature decoded as U+21B5 DOWNWARDS ARROW WITH CORNER LEFTWARDS"
    poppler: "o\\u21b5ers, the same wrong character"
    truth: "offers. Both extractors AGREE and both are WRONG: the font's ff glyph sits at a code whose MacRoman meaning neither maps back to ff, and agreement here is not evidence of correctness"
  - at: "p3 top, . . . and the Economist devoted a whole article"
    pypdf: "extracted intact"
    poppler: "extracted intact but Amer-\\nican welded to American"
    truth: "the paragraph as printed. tools/pdf2md.py then DROPS it entirely, because its paragraph filter discards any paragraph containing '. . .', which is how pypdf spells the leading ellipsis: a wrapper defect, not a pypdf one, and it silently deletes source text"
  - at: "p3, particularly the ef-|fects"
    pypdf: "ef-\\nfects, the ff ligature split by the hyphenation, decoded as plain letters"
    poppler: "effects, hyphen deleted"
    truth: "ef- at the line end, fects on the next line"
