synopsis: 'Anthropic is opening a research preview of the Model Hardware Standard (MHS), a shared specification that lets AI agents like Claude safely discover, communicate with, and operate lab and manufacturing hardware such as microscopes, liquid handlers, and robotic arms, developed with HHMI Janelia and tested with partners including Genentech, University of Washington, Carnegie Mellon, QuEra, and Tetsuwan Scientific.'
