[package]
name = "mag"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mag"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
regex = "1"
sha2 = "0.10"
hex = "0.4"
scraper = "0.27.0"
url = "2.5.8"
ego-tree = "0.11"
unicode-normalization = "0.1"
lopdf = "0.45.0"
flate2 = "1.1.10"
pulldown-cmark = { version = "0.13", default-features = false }
ttf-parser = "0.25"
rustybuzz = "0.20"
png = "0.18"
zune-jpeg = "0.5"
zune-core = "0.5"
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-library = "=0.15.1"
typst-pdf = "=0.15.1"
typst-syntax = "=0.15.1"
resvg = "=0.47.0"
usvg = "=0.47.0"
tiny-skia = "=0.12.0"
base64 = "0.22"
pdf_encoding = "0.4"
fancy-regex = "0.16"
toml = "0.8"
qrcodegen = "1.8"
image-webp = "0.2.4"

[lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"

[dev-dependencies]
lopdf = "0.45.0"
rqrr = "0.11"
serde_json = "1"
serde_yaml = "0.9"
