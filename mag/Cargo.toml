[package]
name = "mag"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mag"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
regex = "1"
sha2 = "0.10"
hex = "0.4"
scraper = "0.27.0"
url = "2.5.8"
ego-tree = "0.11"
unicode-normalization = "0.1"
lopdf = "0.45.0"
flate2 = "1.1.10"

[lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"

[dev-dependencies]
lopdf = "0.45.0"
serde_json = "1"
serde_yaml = "0.9"
