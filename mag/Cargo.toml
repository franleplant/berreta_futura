[package]
name = "mag"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mag"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
regex = "1"
sha2 = "0.10"
hex = "0.4"
