[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[project]
name = "magazine-compiler"
version = "0.1.0"
description = "A deterministic, private-first compiler for faithful source anthologies."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Private project"}
dependencies = [
  "PyYAML>=6.0",
  "reportlab>=4.2",
  "pypdf>=5.0",
  "pillow>=12.0",
  "resvg>=0.2.0",
  "affine>=2.4.0",
]

[project.scripts]
mag = "magazine.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = true
required-version = ">=0.8.0"

[tool.uv.build-backend]
module-name = "magazine"

[tool.hatch.build.targets.wheel]
packages = ["src/magazine"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
