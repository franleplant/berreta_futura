synopsis: 'Anthropic describes how Claude, working largely autonomously over 64 hours, designed 318,484 protein candidates against five scorpion neurotoxins, and how lab testing of 211 selected designs by Adaptyv Bio and Twist Bioscience found 17 single-toxin binders, with no neutralization yet confirmed.'
