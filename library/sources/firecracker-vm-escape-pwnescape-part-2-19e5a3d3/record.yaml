synopsis: 'PWN.AI walks through a guest-to-host Firecracker microVM escape: from inside the guest it resolves the live VMM in host memory, redirects a vCPU thread''s return from KVM, and runs code of its choosing as root on the host, then restores the thread so the VM keeps running.'
