synopsis: 'The author argues that engineers should use swarms of coding agents by being ambitious, keeping setups simple, using cloud agents, prompting with specific phrases, and restructuring codebases (no comments, no agent-written unit tests, deterministic simulation tests, no CI) to remove friction for swarms.'
