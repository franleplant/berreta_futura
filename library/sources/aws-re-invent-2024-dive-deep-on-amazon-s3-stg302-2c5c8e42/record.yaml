synopsis: 'In this AWS re:Invent 2024 talk, two S3 engineers explain how S3''s scale improves customer outcomes through workload aggregation across millions of drives, shuffle sharding, the power of two random choices, and erasure coding, which together give decorrelated, fault-tolerant, high-throughput storage and let the team deploy new hardware and software faster.'
