synopsis: 'Anthropic and Diode Computers report that Claude Fable 5.2 designed three electronic devices (a speakerphone, a voice-assistant hub, and a handheld virtual pet) from specification through PCB layout, enclosure, and firmware, and that Diode''s prototypes worked without circuit fixes.'
