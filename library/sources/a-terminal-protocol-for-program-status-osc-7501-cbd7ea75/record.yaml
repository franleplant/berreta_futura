synopsis: 'Mitchell Hashimoto introduces OSC 7501, a generic terminal escape sequence that lets programs report their own state (idle, working, blocked, done, error) to the terminal, arguing it replaces the fragile screen-scraping heuristics and out-of-band APIs that agentic inboxes use today.'
