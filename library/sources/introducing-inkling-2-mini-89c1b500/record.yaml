synopsis: 'Thinking Machines Lab releases Inkling 2 Mini, a 26.4B-parameter looped Mixture-of-Experts model with open weights that runs on laptops, and reports that looping improves reasoning without a meaningful reduction in chain-of-thought monitorability at this scale.'
