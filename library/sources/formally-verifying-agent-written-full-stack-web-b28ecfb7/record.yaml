synopsis: 'Microsoft Research introduces PDD Kit, a Proof-Driven Development toolkit that turns developer intent into a formal Verus spec, proves agent-written Rust code meets it for every input, tests the trusted boundary, and demonstrates this by verifying the login logic of a full-stack Pet Store web app.'
