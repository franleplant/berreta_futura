synopsis: 'Two Amazon engineers replaced Claude Sonnet 4.6 with the Strands Decider E4B decision model for labeling internal tickets, matching its quality at about 98% lower cost and 78% lower latency, using a three-way AppConfig switch to run both models side by side before cutting over.'
