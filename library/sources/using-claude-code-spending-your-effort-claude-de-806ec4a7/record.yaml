synopsis: 'The author explains that effort in Claude Code modulates how much verification, edge-case testing and independent judgement the model applies, and uses his own build experiments and Terminal-Bench 3.0 results on Opus 5.5 and Fable 5.1 to recommend which effort level to use for which kind of task.'
