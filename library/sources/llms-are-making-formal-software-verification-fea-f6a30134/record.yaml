id: llms-are-making-formal-software-verification-fea-f6a30134
title: 'LLMs are making formal software verification feasible at a much larger scale'
author: 'Keane Lucas, Aengus Lynch, Luna Tong, Luke Champine, Zygi Straznickas, Dino Distefano, Harshikaa Agrawal, Evyatar Ben Asher, Ava Howell, Sami Jawhar, Chris Rohlf, Nickolai Zeldovich, Nicholas Carlini, Rajashree Agrawal, Jason Gross'
url: https://www.anthropic.com/research/formal-verification
captured_at: '2026-10-27T01:22:43Z'
published_at: '2026-10-22'
tags: []
synopsis: 'Anthropic and Theorem report that Claude produced machine-checked formal proofs of no-crash properties for 239 fuzz-test entry points across 123 open-source libraries at the RISC-V assembly level, found long-hidden bugs along the way, and argue that falling proof costs and proof reuse will make formal verification broadly practical, while noting the limits of what such proofs cover.'
