synopsis: 'Anthropic and Theorem report that Claude proved no-crash properties at the RISC-V assembly level for 239 fuzz-test entry points across 123 open-source libraries, found many long-hidden bugs along the way, and argue LLM-driven formal verification will become practical for most production software.'
