synopsis: 'This guide explains how to configure a Workflow to sleep for a relative period or until a fixed date, how to configure step retries (limit, delay, backoff, timeout), how to force a Workflow instance to fail immediately with NonRetryableError, how to register rollback handlers for saga-style compensation, and how to catch Workflow errors with try...catch.'
