synopsis: 'celld is an open-source daemon that runs Cloudflare Workers applications, including Durable Objects, KV, Queues, D1, R2, and Workflows, on your own machines, storing long-term state in an S3-compatible, Google Cloud Storage, or Azure Blob Storage bucket without a consensus service.'
