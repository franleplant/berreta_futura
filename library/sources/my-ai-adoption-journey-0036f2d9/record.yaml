synopsis: 'Mitchell Hashimoto describes the six-step personal journey by which he moved from skepticism toward AI coding agents to routinely using them, covering dropping chatbots for agents, reproducing his own work to build intuition, running end-of-day agents, delegating high-confidence tasks, engineering the harness, and aiming to always have an agent running.'
