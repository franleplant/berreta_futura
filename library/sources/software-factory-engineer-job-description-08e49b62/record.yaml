synopsis: 'Itamar Friedman presents a job description for a Software Factory Engineer, a role that designs, builds, and operates an autonomous L4 software factory covering orchestration, context engineering, independent verification, autonomy boundaries, production feedback, and economics, followed by an appendix arguing why this is becoming a distinct discipline.'
