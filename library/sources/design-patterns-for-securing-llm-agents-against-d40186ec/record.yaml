synopsis: 'The article reviews a paper proposing six design patterns (Action-Selector, Plan-Then-Execute, LLM Map-Reduce, Dual LLM, Code-Then-Execute, and Context-Minimization) that constrain LLM agents to mitigate prompt injection risks by limiting their ability to perform arbitrary tasks.'
