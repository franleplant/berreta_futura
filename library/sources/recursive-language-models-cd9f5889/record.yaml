synopsis: 'The authors propose Recursive Language Models, an inference strategy in which a language model works over its input context as a variable in a Python REPL and recursively calls itself or other LMs, and they report that RLM(GPT-5-mini) outperforms GPT-5 on OOLONG and that RLM(GPT-5) holds up on BrowseComp-Plus with up to 1000 documents.'
