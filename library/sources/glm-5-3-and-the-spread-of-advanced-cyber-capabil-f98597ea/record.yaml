synopsis: 'Anthropic''s Frontier Red Team reports that the open-weight GLM-5.3 can build end-to-end cyber exploits at rates close to Claude Mythos Preview and that its safeguards can be bypassed 64% to 100% of the time with simple techniques that did not work on safeguarded Claude models.'
