synopsis: 'Anthropic describes new defenses against distillation attacks on Claude (controlling where reasoning can go, a two-stage classifier, and penalties for repeated attempts) that it says cut the reasoning tokens distillers extract by 10 to 100 times, along with their trade-offs and a call for all developers and platforms to act.'
