synopsis: 'In an interview with Ezra Klein, Bill Gates argues that A.I. has already crossed dangerous cyber and bio thresholds, calls for mandatory safeguards and monitoring, warns of large-scale job displacement and proposes taxing A.I. labor and reserving some jobs for humans, while stressing A.I.''s benefits for health, agriculture and education in low-income countries.'
