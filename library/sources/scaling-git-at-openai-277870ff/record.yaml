synopsis: 'OpenAI describes Pando, a Git-compatible backend it built with Codex in 10 weeks that scales concurrent pushes by ordering updates per branch and serves fetches from reused, compacted packfiles, cutting median push latency and delivering nearly a petabyte of Git data per day.'
