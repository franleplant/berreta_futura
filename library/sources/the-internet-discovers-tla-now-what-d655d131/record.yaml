synopsis: 'Following Boris Cherny''s viral TLA+ tweet, the article explains what TLA+ is and is not, how models can be taken into proof systems like Verus, and previews Reasonable''s pipeline that turned TLA+ specification/property pairs into machine-checked Verus proofs.'
