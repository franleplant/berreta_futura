synopsis: 'Anthropic researchers present FlashProve, an open-source zkSNARK-based prototype that proves Llama 4 Maverick inference at about 110 tokens/second on a single H100 with roughly 19 MB proofs, backed by Lean-verified security statements, and discuss its applications, prior work, and limitations.'
