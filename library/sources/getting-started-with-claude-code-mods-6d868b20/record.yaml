synopsis: 'Addy Osmani explains how Claude Code mods, small scripts bundled as plugins that hook session events to observe, rewrite or answer them, can be built by describing them to Claude, using the Token Weather, Blast Radius and Replay Theater examples, and how to publish, install and safely use them.'
