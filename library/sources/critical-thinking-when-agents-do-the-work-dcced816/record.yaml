synopsis: 'Addy Osmani argues that as agentic workflows make outputs fast and mostly correct, engineers must deliberately build in critical thinking by forming hypotheses first, defining verification up front, reviewing what agents decided, writing clear prompts, and keeping accountability for what ships.'
