synopsis: 'celld has no membership protocol or consensus service; the shared object-storage bucket holds cell ownership records, node leases, and replicated state, and RPO=0 is earned by a bucket proof with one node or a fleet proof with two or more, relying on conditional writes, read-after-write consistency, and exact ranged reads that a startup probe verifies.'
