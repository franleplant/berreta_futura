synopsis: 'Cloudflare explains why its Meerkat consensus service uses the leader-optional QuePaxa algorithm instead of Raft or Paxos, since leader-based protocols stall under destructive interference and fault-detection errors on volatile global networks, and walks through QuePaxa''s four-phase protocol.'
