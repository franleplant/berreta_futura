synopsis: 'Cloudflare cut the average cost of its AI code review from $2.43 to $0.77 and the median review time from 4m 09s to 1m 32s by sharing cached prompt prefixes, reducing LLM calls, and tuning models and effort levels, while checking that review quality largely held.'
