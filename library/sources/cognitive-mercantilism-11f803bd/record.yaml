synopsis: 'Drawing on Joyce Appleby''s history of capitalism, Venkatesh Rao argues that AI panic parallels early modern mercantilism and Malthusianism, and that abundant AI may trigger a "cognitive industrious revolution" in which expanding demand for intelligence, from humans and AIs alike, creates new opportunity rather than useless minds.'
