tags: []
synopsis: 'The authors show that GPT-6 Astra can read neural network weights to infer what a network does, fix a failing network by editing its weights, and write small game-playing networks from scratch, including a weight edit that raises Qwen3.5-0.8B''s MATH-500 score from 7.9% to 48.1%.'
