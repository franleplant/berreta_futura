synopsis: 'The article describes how Anthropic redesigned its test impact analysis service from a single-process architecture to a stateless, horizontally scalable one after a 25x increase in CI jobs over six months caused repeated capacity failures, with three temporary patches (a bigger machine, sharding, and daily restarts) lasting progressively less time before a full redesign using an in-memory data store solved the problem.'
