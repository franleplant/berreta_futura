synopsis: 'OpenAI''s Chief Scientist argues that AI is beginning to exceed human intelligence in transformative ways, that current alignment and chain-of-thought monitoring techniques are becoming less reliable as models grow more capable, and that responsible pacing of recursive self-improvement will require stronger technical safeguards, defensive systems, and international coordination.'
