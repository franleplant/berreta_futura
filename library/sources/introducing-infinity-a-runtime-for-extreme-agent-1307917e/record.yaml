synopsis: 'AWS and UC Berkeley''s Hydro project release Infinity, an open source agent runtime that suspends agents at tool calls like stackless coroutines, so about 75,000 agents fit in 8 GB, agents can run on serverless platforms, and asynchronous events and agent-to-agent messages are delivered as synthetic tool calls.'
