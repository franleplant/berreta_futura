synopsis: 'WarpStream''s co-founder argues that Kafka''s inter-zone replication costs and operational burden are a poor fit for the cloud, and presents WarpStream, a stateless, S3-native, Kafka-protocol-compatible system that trades higher latency for 5-10x lower cost.'
