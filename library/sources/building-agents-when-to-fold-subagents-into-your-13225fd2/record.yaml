synopsis: 'Anthropic''s Applied AI team argues that many enterprise agents benefit from folding routers, planners, and domain subagents into a single main agent loop that uses skills and tools with progressive disclosure, and describes when to keep subagents, how to migrate in stages guided by evals, and how several teams can contribute to one agent.'
