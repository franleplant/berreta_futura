synopsis: 'Anthropic''s Applied AI team argues that many enterprise multi-agent designs work better, cheaper, and faster when subagents are folded into a single agent loop that uses skills, tool search, and progressive disclosure, and describes how to migrate in stages with task-completion evals.'
