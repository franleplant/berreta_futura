title: 'Harness Learning Enables Generalizable Test-Time Adaptation'
author: 'Alvin Zhang, Xuecheng Liu, Zixuan Wang, Fahim Tajwar, Daman Arora, Ruslan Salakhutdinov, Daniel Khashabi, Yuda Song, Andrea Zanette'
url: https://arxiv.org/pdf/2609.35738
captured_at: '2026-10-14T17:32:55Z'
