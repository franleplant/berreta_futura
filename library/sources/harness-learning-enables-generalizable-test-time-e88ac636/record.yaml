tags: []
synopsis: 'The paper introduces harness learning, in which a proposer model is trained with reinforcement learning to revise a frozen solver''s executable harness from execution feedback, and shows on Reasoning Gym and multi-hop QA that this adaptation ability transfers to unseen tasks and continues improving harnesses over successive rounds.'
