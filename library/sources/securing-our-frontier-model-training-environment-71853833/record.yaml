synopsis: 'OpenAI describes how it hardened its frontier-model training environments with offline-only training, layered isolation and cloud perimeters, and how high-compute red-teaming by model agents found sandbox escapes, paths to the internet and covert cross-sandbox channels that were then fixed before training resumed on October 1.'
