title: 'How AI agents shape experts’ judgment calls'
author: 'Amaç Herdağdelen, Hailey Joren, Alex Tamkin'
url: https://www.anthropic.com/research/agents-judgment-calls
captured_at: '2026-10-29T20:47:00Z'
published_at: '2026-10-27'
tags: []
synopsis: 'In a randomized study of 50 professional analysts doing a farming-cooperative analysis with Claude Code, analysts followed their agent''s secretly assigned lean on 86% of analytical decisions, repeated its arguments without crediting it, and still often called the recommendation their own.'
