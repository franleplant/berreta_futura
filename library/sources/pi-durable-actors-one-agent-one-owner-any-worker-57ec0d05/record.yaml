synopsis: 'The author argues that agents are actors, and shows that running Pi Durable harnesses inside Rivet actors on a two-node local cluster handles placement, agent-to-agent calls, durable reminders, and recovery from a killed node, with a scheduled heartbeat needed for automatic recovery.'
