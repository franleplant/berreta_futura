synopsis: 'Tommy He describes tufazip, a 12-layer, 163M-parameter Transformer compressor that took #2 on the Large Text Compression Benchmark by compressing enwik9 to 105,388,353 bytes, including offline trained weights and decoder, using online learning plus a compact offline prior.'
