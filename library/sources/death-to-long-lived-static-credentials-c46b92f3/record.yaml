synopsis: 'Vercel argues that long-lived static credentials should give way to short-lived OIDC-based authentication, describes its OIDC, Vercel Connect, and OIDC UI tooling, and sets Marketplace deadlines of November 30, 2026 and January 2027 for vendors to support secure authentication.'
