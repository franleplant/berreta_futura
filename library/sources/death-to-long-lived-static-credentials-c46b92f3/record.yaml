tags: []
synopsis: 'Vercel''s CTO argues that long-lived static credentials should be replaced by short-lived OIDC-based authentication, describes Vercel''s tooling (OIDC federation, Vercel Connect, OIDC UI) for making that practical, and announces Marketplace deadlines of November 30, 2026 for a "Not secure" label and January 2027 for delisting vendors without secure auth.'
