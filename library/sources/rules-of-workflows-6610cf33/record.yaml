synopsis: 'This page documents best practices ("Rules of Workflows") for writing resilient and correct Cloudflare Workflows, covering idempotency, step granularity, state handling, side effects, event immutability, deterministic step naming, Promise.race/any usage, unique instance IDs, awaiting steps, conditional logic, batching invocations, timeout limits, and step return value size limits.'
