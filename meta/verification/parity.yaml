normalization:
  strip_pdf_keys:
    pdf_info:
      - CreationDate
      - ModDate
      - File size
      - trailer ID
      - Producer dates
    json_leaves:
      preflight.json:
        - leaf: .cover_art.path
          only_if_both_values_contain: /mag-engine-render-stage-
        - leaf: .figures[*].path
          only_if_both_values_contain: /mag-engine-render-stage-
      render-critic.json:
        - leaf: .visual_review.booklet_sha256
        - leaf: .visual_review.reader_sha256
    derived_from_pdf_bytes_never_compared:
      - SHA256SUMS
      - package.zip
      - web-output.zip
  whitespace:
    unicode: NFC
    prose: collapse whitespace runs to one space
    code_blocks: internal whitespace preserved
  hyphen_rejoin:
    rejoin: words split by a line-end hyphenate character
    strip: soft hyphens
  merge_rewrite_rules:
    authored_by: WP-0.2c
    measured: replace_outer_pages on the 010 reader (pages 1 and 56 re-attached
      as cover stand-ins, explicit output path) leaves every inner page
      display-list equal and raster zero-diff at 300 dpi, max channel delta 0;
      pypdf rewrite noise on inner pages is nil, so no rule exists
    entries: []
  font_name_map:
    authored_by: WP-0.2b
    method: alias from the weasyprint-a5.css font-family mapped through its
      declared TTF; face is that file's PostScript name (name id 6), the name
      the typst leg embeds from the same file; each pair proven by the shared
      file digest below; typst-side names provisional until a typst PDF exists
    cover_faces_note: Helvetica, Inter-Regular aliases and Archivo appear only
      on cover pages 1 and n, outside the compared domain until WP-5.4g
    entries:
      Magazine-Serif:
        face: SourceSerif4SmText-Regular
        file: src/magazine/assets/fonts/source-serif-4/SourceSerif4SmText-Regular.ttf
