tiers:
  s:
    box_tolerance_pt: 0.05
    clauses:
      - page_count
      - boxes
      - text
      - code_blocks
      - color
      - navigation
      - critic
  g:
    g1_pt: 2.0
    g2_pt: 0.5
  v:
    dpi: 300
    channel_delta: 24
    v1_page_fraction: 0.01
    v2_page_fraction: 0.001
  e:
    coordinate_quantum_pt: 0.01
    link_rect_quantum_pt: 0.5
    raster_bound:
      authored_by: WP-0.2d
      status: blocked
      measured_max_channel_delta: 241
      measurement: the oracle leg re-emitted through pypdf with every coordinate
        operand of m/l/c/v/y/re/cm/Td/TD/Tm perturbed uniformly within half the
        0.01 pt quantum (24452 operands, seed 0), rasterized against the original
        at 300 dpi over the interior domain
      control: the same rewrite at amplitude 0 is display-list equal and raster
        zero-diff (max channel delta 0), so the rewrite itself contributes nothing
      decomposition: text-positioning operands alone (Td/TD/Tm) already reach 241,
        as do path operands alone; figures sit on pages 12, 37 and 42 while the
        241 appears on nearly every page, so image resampling is not the cause
      cause: FreeType grid-fits glyph outlines at 300 dpi, so a sub-quantum shift
        can move a stem a whole pixel and flip that pixel between paper (255) and
        body ink (14), a delta of 241
      rasterizer_variants: pdftoppm -aa no still reaches 241; -freetype no reaches
        0 only because it fails to build any embedded font and renders no text
      why_no_value: recording 241 would leave the Tier E raster guard passing every
        differing pixel below 242/255, which contradicts the plan's raster zero-diff
        gate; protocol rule 4 reserves threshold changes to a plan revision, so the
        key carries no value and the comparator keeps reporting not_evaluated
      wp_0_2f:
        status: blocked
        still_no_value: no candidate configuration reaches the required
          ceiling >= 2x floor, so the key stays valueless and the Tier E raster
          clause keeps reporting not_evaluated
        candidates_measured: pdftoppm at 300 dpi; pdftocairo at 300 dpi; pdftoppm
          supersampled 2x and 4x with box downsampling; mutool draw 1.26.4 at
          300 dpi, with -A 8, and supersampled 2x, 4x and 8x
        best_candidate: mutool draw 1.26.4 supersampled 8x (2400 dpi) and box
          downsampled to 300 dpi
        floor_drift_term: 30.125 at the best candidate, from WP-1.6's measured
          intra-line drift of 0.000173 pt per glyph over all 69071 glyphs,
          display-list equal
        ceiling_quietest: 30.125 for a compensating 0.02 pt kern and 60.250 for
          0.05 pt, so the ratio is 1.00 against the quietest fixture and exactly
          2.00 only if nothing quieter than 0.05 pt must be caught
        floor_linear_matrix_term: not constructible as a display-list-equal
          fixture here (the display list quantizes device space while the fixture
          perturbs operand space, and the oracle leg composes a 4/3 px-to-pt scale
          into Tm), but revision 13 puts the admitted displacement at 0.1625 pt at
          body measure, whose magnitude is bracketed by the 0.2 pt kern fixture at
          151.641; that term alone exceeds every ceiling measured
        finer_quantum_does_not_help: perturbing text origins within 0.001 pt
          buckets still reaches 122 under mutool, because origin snapping means any
          nonzero shift can cross a rounding boundary for some glyph; path operands
          do degrade proportionally (21 at 0.01 pt, 9 at 0.001 pt)
        affordability: a full 54-page interior comparison at 2400 dpi is roughly
          9 to 15 minutes of rasterization per run, against about 82 s today
        blocking_fix: WP-0.2g's tightening of the linear text-matrix quantum, after
          which the floor is re-derived; the re-derivation should perturb in device
          space through the Rust tracer rather than through pypdf on raw operands
tools:
  measured_at: WP-0.1
  os: macOS 26.6.2
  python: 3.12.11
  uv: 0.8.17
  weasyprint: 69.0
  pydyf: 0.12.1
  pyphen: 0.17.2
  pypdf: 6.14.2
  pygments: 2.21.0
  pillow: 12.3.0
  poppler: 25.08.0
  rustc: 1.96.0
  display_tracer: lopdf-0.45.0
  display_tracer_note: WP-0.2b chose a Rust content-stream interpreter
    (mag/src/parity/streams.rs on the lopdf crate) over mutool, which is not
    installed; the crate pin is asserted at mag parity startup
  typst_crates:
    recorded_by: WP-2.0a
    proven_by: WP-1.4
    typst: =0.15.1
    typst-layout: =0.15.1
    typst-library: =0.15.1
    typst-pdf: =0.15.1
    typst-syntax: =0.15.1
    note: the five exact direct dependencies in mag/Cargo.toml. typst-layout
      and typst-syntax are not optional (PagedDocument, PagedIntrospector and
      Page live in the former; the main FileId needs the latter's RootedPath,
      VirtualRoot and VirtualPath); comemo is not needed as a direct
      dependency. MSRV 1.92 against rustc 1.96.0, no edition bump. Adding them
      takes mag/Cargo.lock from 203 to 397 packages.
fault_suite:
  authored_by: WP-0.2d
  asserted_by: mag/tests/parity_faults.rs under cargo test
  clause_vocabulary:
    - page_count
    - boxes
    - text
    - color
    - navigation
    - display_list
    - raster_guard
    - raster_dimensions
    - v1
    - v2
  fixture_route: the test builds both legs itself with lopdf (six A5 pages, one
    Type1 font with ToUnicode, an image XObject, a GoTo link, a stroked path) so
    the suite needs no renderer and survives the Python decommission; the same
    eight faults were also seeded the plan's way, by rendering scratch copies of
    edition 010's staged inputs and CSS in a throwaway worktree, and those
    verdicts are recorded in the WP-0.2d evidence file
  expected_detections:
    swapped_words:
      intended_check: text
      must_flag: [color, display_list, text]
    line_moved_005:
      intended_check: display_list
      must_flag: [display_list]
    line_moved_03:
      intended_check: display_list
      must_flag: [display_list]
    figure_shifted_page:
      intended_check: display_list
      must_flag: [display_list, v1, v2]
    recolor_30px:
      intended_check: display_list
      must_flag: [display_list, v1, v2]
    body_ink_pure_black:
      intended_check: color
      must_flag: [color, display_list]
    dropped_link_annotation:
      intended_check: navigation
      must_flag: [display_list, navigation]
    mediabox_off_05:
      intended_check: boxes
      must_flag: [boxes, display_list, raster_dimensions]
critic_metric_tolerances:
  authored_by: WP-0.2d
  consumed_by: WP-5.3a and WP-5.3b, which never author tolerances
  integer_metrics: exact equality
  float_relative_epsilon: 1.0e-6
  near_threshold_window: 1.0e-5
  measured_on: edition 010 render-critic.json, 1450 integer leaves and 631 float
    leaves over 56 pages
  decision_thresholds:
    ink_ratio: SPARSE_INK_RATIO 0.004
    rgb_mae: OPENER_CROP_FIDELITY_MAX_RGB_MAE 8.0
    frame_edge_delta_inches: OPENER_CROP_FRAME_MAX_EDGE_DELTA_INCHES 0.01
    height_points: VOID_MIN_HEIGHT_POINTS 96.0
    width_fraction: VOID_MIN_WIDTH_FRACTION 0.9
    trailing_gap_points: VOID_TRAILING_TOLERANCE_POINTS 16.0
    live_fraction: TAIL_GAP_MIN_LIVE_FRACTION 0.35
    height_vs_declared: TAIL_BAND_HEIGHT_TOLERANCE_POINTS 12.0
    gap_symmetry: TAIL_BAND_SYMMETRY_TOLERANCE_POINTS 32.0
    band_adjacency: TAIL_BAND_ADJACENCY_TOLERANCE_POINTS 8.0
    opener_offset_points: OPENER_OFFSET_POINTS 4.1 within OPENER_OFFSET_TOLERANCE_PIXELS 2.0
  near_threshold_fixtures_required:
    - metric: pages[39].largest_void.height_points
      value: 96.0
      constant: VOID_MIN_HEIGHT_POINTS
      threshold: 96.0
      relative_margin: 0.0
      decision: void height_points >= VOID_MIN_HEIGHT_POINTS
      note: sits exactly on the boundary, so one ulp of evaluation-order slack
        flips the void from reported to unreported; WP-5.3b carries a fixture
  nearest_other_margins:
    - metric: largest_void.height_points 92.0 and 100.0 vs 96.0, relative 0.0417
    - metric: largest_void.width_fraction 0.939 vs 0.9, relative 0.0433
    - metric: tail band height vs declared, relative 0.694
    - metric: minimum non-zero ink_ratio 0.046483 vs 0.004, relative 10.6
hyphenation:
  authored_by: WP-1.5
  decision: option b, hyphenation off during parity, re-enabled natively by WP-4.3
  decided_in: plan revision 9, from WP-1.3's measurement
  scope: ':lang(en) only; Spanish editions keep hyphenation'
  mechanism: src/magazine/assets/weasyprint-a5.css, an html:lang(en) rule mirroring
    the prose selector list and setting hyphens manual; the prose rule above it is
    untouched
  typst_leg: WP-2.2a disables hyphenation for the same language
  measured_on_010_en:
    page_count: 56 before and after
    article_pages: identical before and after, every span unmoved
    cap_violations_introduced: 0
    pre_existing_cap_violation: dario-amodei-we-must-pace-the-frontier 13 pages against
      cap 10, present before and after, unrelated to this switch
    hyphen_ended_lines: 142 before, 16 after, a delta of 126 matching WP-1.3's
      measured soft-hyphen breaks
    max_consecutive_hyphen_ended_lines: 2 after, so no ladder
  scoping_proof:
    method: a scratch es translation of 010 rendered with --langs en,es before and
      after the switch, built in a throwaway worktree, no tracked file touched
    es_pdftotext_dumps: byte-identical before and after
    es_page_count: 56 before and after
    es_hyphen_ended_lines: 162 before and after
    es_max_consecutive_hyphen_ended_lines: 4, so Spanish still hyphenates and still
      ladders, which is the point of the scope
  revert: WP-4.3 deletes the rule and its comment; nothing else depends on it
