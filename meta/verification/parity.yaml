tiers:
  s:
    box_tolerance_pt: 0.05
    rotation_comparison: exact
    rotation_note: >
      /Rotate is compared exactly rather than within box_tolerance_pt, because
      it is an enumerated quarter-turn and not a length. Parsed from the same
      pdfinfo -box call as the boxes, so it costs no extra invocation. A 180
      degree difference leaves every box identical, so no other clause would
      catch it now that rasters are meters (WP-0.2g).
    clauses:
      - page_count
      - boxes
      - text
      - code_blocks
      - color
      - navigation
      - critic
  g:
    g1_pt: 2.0
    g2_pt: 0.5
  v:
    dpi: 300
    channel_delta: 24
    v1_page_fraction: 0.01
    v2_page_fraction: 0.001
  e:
    coordinate_quantum_pt: 0.01
    link_rect_quantum_pt: 0.5
    glyph_positions:
      authored_by: WP-0.2i
      status: derived
      offset_quantum_pt: 9.1552734375e-05
      offset_quantum_rule: exactly one eighth of a Pango tick, so a tick is an
        INTEGER number of quanta. This is required for correctness, not taste.
        Offsets are rounded per leg before differencing, so the recorded
        difference is round(x + d) - round(x); when d is constant but not an
        integer number of quanta that expression alternates between floor(d/q)
        and ceil(d/q) as the fractional part of x varies, turning a FLAT region
        of the true difference into a sawtooth and breaking monotonicity. With
        d an exact multiple of q the identity round(x + Nq) = round(x) + N holds
        and a flat records as flat. The first submission used 0.0001 pt, in
        which a tick is 7.324 quanta, and was rejected for exactly this
      drift_bound_pt_per_glyph: 0.000732421875
      bound_rule: the device-space offset of glyph k from its show origin may
        differ between legs by at most k * drift_bound_pt_per_glyph, a function
        of position in line rather than a flat number; k resets per show
      mechanism: WeasyPrint advances by an integer count of 1/1024 px (Pango),
        Typst sums exact font units, so the legitimate difference at glyph k is
        bounded by k quantisation steps of 1/1024 px = 0.000732421875 pt.
        Derived from the mechanism, never fitted to an observation
      shape_rule: a legitimate difference accumulates, so the per-axis
        difference sequence must be one-signed and monotone non-decreasing in
        magnitude; a compensating kern produces a bump returning toward zero and
        fails on shape whatever its magnitude, which is what makes the ceiling
        independent of fault size and what the raster guard could never achieve.
        No tolerance is applied to the monotonicity test, because a tolerance would
        let the rejected sawtooth pass and would also dissolve the property that
        gives the ceiling its size-independence
      floor:
        fixture: stairdrift
        representative_of: the real phenomenon. WeasyPrint advances in WHOLE
          ticks, so at WP-1.6's measured 0.000173 pt per glyph a tick lands
          every ~4.2 glyphs and roughly three glyphs in four are FLAT. The
          fixture injects d(k) = tick * round(k * 0.000173 / tick) across all
          1,488 shows
        glyphs: 68800
        shows: 1488
        worst_ratio_of_bound: 0.25
        result: pass
      floor_controls:
        drift: a LINEAR RAMP at the same 0.000173 pt per glyph, no flats, ratio
          0.25, pass. It was the original floor and it is NOT representative, because a
          ramp never goes flat, so it cannot exhibit the sawtooth that the
          quantum defect produced, which is why it passed while the gate was
          broken
        smoothdrift: a linear ramp at 0.0005 pt per glyph, no flats, ratio
          0.625, pass. Higher ratio than stairdrift and still passes, which
          isolates the variable, which is flatness rather than magnitude
      ceiling:
        by_magnitude: compensating kern 0.02 pt gives ratio 10.2500; 0.005 pt
          gives 2.5625; both exceed the bound and fail on magnitude alone
        by_shape: compensating kern 0.001 pt gives ratio 0.5625 and 0.0001 pt
          gives 0.0625, both far below the bound, and both FAIL on shape alone.
          Five further adversarial variants built by WP-0.2i's verifier to look
          monotone (advstep, advmid, advtail02, advtail_small, advtail_late) all
          fail, four of them on shape alone at ratios 0.5625 to 0.6406. The
          shape constraint has no lower magnitude limit, so the ceiling does not
          depend on how large the fault is
      margin:
        rule: bound must be at least 2x the realized legitimate drift
        measured: 1 / 0.25 = 4.00x
        met: true
      control: the same pypdf rewrite with no edits is glyph-equal (ratio 0.0)
      f32_dependency: NONE. lopdf parses Object::Real as f32, but num() converts
        once via f64::from and tx, starts and qo are all f64, so f32 terms enter
        as RELATIVE SCALE errors proportional to the value. They add a monotone
        ramp rather than per-step noise, which is why drift and smoothdrift show
        zero violations across 68,800 glyphs. Against the bound the effect is
        ~0.13% at k=1 and ~0.08% at k=70, so WP-0.2j is not a prerequisite
      supersedes: the Tier E raster guard, which WP-0.2f proved impossible at
        any resolution because every rasterizer snaps text-object origins
    raster_bound:
      status: withdrawn
      gates: nothing
      authored_by: nobody
      measurements_recorded_by: WP-0.2d, then WP-0.2f
      withdrawal: >
        The Tier E raster guard this key fed was withdrawn in revision 15, and
        WP-0.2f, which revision 9 made this key's owner, was withdrawn WHOLLY in
        revision 39. Nobody authors this key now. Everything below is a
        historical record of what was measured, kept so the measurements are not
        repeated; it decides nothing. The comparator reports the Tier E raster
        clause not_evaluated whether this key is present, valueless or absent:
        WP-0.2g made the absence legal, because requiring a key that nobody owns
        would fail the run with a misleading "missing" error the moment someone
        tidied it away. Do not add a `value` here to revive the guard. Rule 4
        reserves threshold changes to a plan revision, revision 39 superseded
        the guard with per-glyph positions, and revision 15 recorded that a
        raster guard is impossible at any resolution because every rasterizer
        snaps text-object origins to the device grid.
      measured_max_channel_delta: 241
      measurement: the oracle leg re-emitted through pypdf with every coordinate
        operand of m/l/c/v/y/re/cm/Td/TD/Tm perturbed uniformly within half the
        0.01 pt quantum (24452 operands, seed 0), rasterized against the original
        at 300 dpi over the interior domain
      control: the same rewrite at amplitude 0 is display-list equal and raster
        zero-diff (max channel delta 0), so the rewrite itself contributes nothing
      decomposition: text-positioning operands alone (Td/TD/Tm) already reach 241,
        as do path operands alone; figures sit on pages 12, 37 and 42 while the
        241 appears on nearly every page, so image resampling is not the cause
      cause: FreeType grid-fits glyph outlines at 300 dpi, so a sub-quantum shift
        can move a stem a whole pixel and flip that pixel between paper (255) and
        body ink (14), a delta of 241
      rasterizer_variants: pdftoppm -aa no still reaches 241; -freetype no reaches
        0 only because it fails to build any embedded font and renders no text
      why_no_value: recording 241 would leave the Tier E raster guard passing every
        differing pixel below 242/255, which contradicts the plan's raster zero-diff
        gate; protocol rule 4 reserves threshold changes to a plan revision, so the
        key carries no value and the comparator keeps reporting not_evaluated
      wp_0_2f:
        status: blocked
        still_no_value: no candidate configuration reaches the required
          ceiling >= 2x floor, so the key stays valueless and the Tier E raster
          clause keeps reporting not_evaluated
        candidates_measured: pdftoppm at 300 dpi; pdftocairo at 300 dpi; pdftoppm
          supersampled 2x and 4x with box downsampling; mutool draw 1.26.4 at
          300 dpi, with -A 8, and supersampled 2x, 4x and 8x
        best_candidate: mutool draw 1.26.4 supersampled 8x (2400 dpi) and box
          downsampled to 300 dpi
        floor_drift_term: 30.125 at the best candidate, from WP-1.6's measured
          intra-line drift of 0.000173 pt per glyph over all 69071 glyphs,
          display-list equal
        ceiling_quietest: 30.125 for a compensating 0.02 pt kern and 60.250 for
          0.05 pt, so the ratio is 1.00 against the quietest fixture and exactly
          2.00 only if nothing quieter than 0.05 pt must be caught
        floor_linear_matrix_term: not constructible as a display-list-equal
          fixture here (the display list quantizes device space while the fixture
          perturbs operand space, and the oracle leg composes a 4/3 px-to-pt scale
          into Tm), but revision 13 puts the admitted displacement at 0.1625 pt at
          body measure, whose magnitude is bracketed by the 0.2 pt kern fixture at
          151.641; that term alone exceeds every ceiling measured
        finer_quantum_does_not_help: perturbing text origins within 0.001 pt
          buckets still reaches 122 under mutool, because origin snapping means any
          nonzero shift can cross a rounding boundary for some glyph; path operands
          do degrade proportionally (21 at 0.01 pt, 9 at 0.001 pt)
        affordability: a full 54-page interior comparison at 2400 dpi is roughly
          9 to 15 minutes of rasterization per run, against about 82 s today
        blocking_fix: WP-0.2g's tightening of the linear text-matrix quantum, after
          which the floor is re-derived; the re-derivation should perturb in device
          space through the Rust tracer rather than through pypdf on raw operands
tools:
  measured_at: WP-0.1
  os: macOS 26.6.2
  python: 3.12.11
  uv: 0.8.17
  weasyprint: 69.0
  pydyf: 0.12.1
  pyphen: 0.17.2
  pypdf: 6.14.2
  pygments: 2.21.0
  pillow: 12.3.0
  poppler: 25.08.0
  rustc: 1.96.0
  display_tracer: lopdf-0.45.0
  display_tracer_note: WP-0.2b chose a Rust content-stream interpreter
    (mag/src/parity/streams.rs on the lopdf crate) over mutool, which is not
    installed; the crate pin is asserted at mag parity startup
  typst_crates:
    recorded_by: WP-2.0a
    proven_by: WP-1.4
    typst: =0.15.1
    typst-layout: =0.15.1
    typst-library: =0.15.1
    typst-pdf: =0.15.1
    typst-syntax: =0.15.1
    note: the five exact direct dependencies in mag/Cargo.toml. typst-layout
      and typst-syntax are not optional (PagedDocument, PagedIntrospector and
      Page live in the former; the main FileId needs the latter's RootedPath,
      VirtualRoot and VirtualPath); comemo is not needed as a direct
      dependency. MSRV 1.92 against rustc 1.96.0, no edition bump. Adding them
      takes mag/Cargo.lock from 203 to 397 packages.
fault_suite:
  authored_by: WP-0.2d
  asserted_by: mag/tests/parity_faults.rs under cargo test
  clause_vocabulary:
    - page_count
    - boxes
    - text
    - color
    - navigation
    - display_list
    - glyph_positions
    - raster_guard
    - raster_dimensions
    - v1
    - v2
  fixture_route: the test builds both legs itself with lopdf (six A5 pages, one
    Type1 font with ToUnicode, an image XObject, a GoTo link, a stroked path) so
    the suite needs no renderer and survives the Python decommission; the same
    eight faults were also seeded the plan's way, by rendering scratch copies of
    edition 010's staged inputs and CSS in a throwaway worktree, and those
    verdicts are recorded in the WP-0.2d evidence file
  expected_detections:
    swapped_words:
      intended_check: text
      must_flag: [color, display_list, text]
    line_moved_005:
      intended_check: display_list
      must_flag: [display_list]
    line_moved_03:
      intended_check: display_list
      must_flag: [display_list]
    figure_shifted_page:
      intended_check: display_list
      must_flag: [display_list, v1, v2]
    recolor_30px:
      intended_check: display_list
      must_flag: [display_list, v1, v2]
    body_ink_pure_black:
      intended_check: color
      must_flag: [color, display_list]
    dropped_link_annotation:
      intended_check: navigation
      must_flag: [display_list, navigation]
    mediabox_off_05:
      intended_check: boxes
      must_flag: [boxes, display_list, raster_dimensions]
critic_metric_tolerances:
  authored_by: WP-0.2d
  consumed_by: WP-5.3a and WP-5.3b, which never author tolerances
  integer_metrics: exact equality
  float_relative_epsilon: 1.0e-6
  near_threshold_window: 1.0e-5
  measured_on: edition 010 render-critic.json, 1450 integer leaves and 631 float
    leaves over 56 pages
  decision_thresholds:
    ink_ratio: SPARSE_INK_RATIO 0.004
    rgb_mae: OPENER_CROP_FIDELITY_MAX_RGB_MAE 8.0
    frame_edge_delta_inches: OPENER_CROP_FRAME_MAX_EDGE_DELTA_INCHES 0.01
    height_points: VOID_MIN_HEIGHT_POINTS 96.0
    width_fraction: VOID_MIN_WIDTH_FRACTION 0.9
    trailing_gap_points: VOID_TRAILING_TOLERANCE_POINTS 16.0
    live_fraction: TAIL_GAP_MIN_LIVE_FRACTION 0.35
    height_vs_declared: TAIL_BAND_HEIGHT_TOLERANCE_POINTS 12.0
    gap_symmetry: TAIL_BAND_SYMMETRY_TOLERANCE_POINTS 32.0
    band_adjacency: TAIL_BAND_ADJACENCY_TOLERANCE_POINTS 8.0
    opener_offset_points: OPENER_OFFSET_POINTS 4.1 within OPENER_OFFSET_TOLERANCE_PIXELS 2.0
  near_threshold_fixtures_required:
    - metric: pages[39].largest_void.height_points
      value: 96.0
      constant: VOID_MIN_HEIGHT_POINTS
      threshold: 96.0
      relative_margin: 0.0
      decision: void height_points >= VOID_MIN_HEIGHT_POINTS
      note: sits exactly on the boundary, so one ulp of evaluation-order slack
        flips the void from reported to unreported; WP-5.3b carries a fixture
  nearest_other_margins:
    - metric: largest_void.height_points 92.0 and 100.0 vs 96.0, relative 0.0417
    - metric: largest_void.width_fraction 0.939 vs 0.9, relative 0.0433
    - metric: tail band height vs declared, relative 0.694
    - metric: minimum non-zero ink_ratio 0.046483 vs 0.004, relative 10.6
hyphenation:
  authored_by: WP-1.5
  decision: option b, hyphenation off during parity, re-enabled natively by WP-4.3
  decided_in: plan revision 9, from WP-1.3's measurement
  scope: ':lang(en) only; Spanish editions keep hyphenation'
  mechanism: src/magazine/assets/weasyprint-a5.css, an html:lang(en) rule mirroring
    the prose selector list and setting hyphens manual; the prose rule above it is
    untouched
  typst_leg: WP-2.2a disables hyphenation for the same language
  measured_on_010_en:
    page_count: 56 before and after
    article_pages: identical before and after, every span unmoved
    cap_violations_introduced: 0
    pre_existing_cap_violation: dario-amodei-we-must-pace-the-frontier 13 pages against
      cap 10, present before and after, unrelated to this switch
    hyphen_ended_lines: 142 before, 16 after, a delta of 126 matching WP-1.3's
      measured soft-hyphen breaks
    max_consecutive_hyphen_ended_lines: 2 after, so no ladder
  scoping_proof:
    method: a scratch es translation of 010 rendered with --langs en,es before and
      after the switch, built in a throwaway worktree, no tracked file touched
    es_pdftotext_dumps: byte-identical before and after
    es_page_count: 56 before and after
    es_hyphen_ended_lines: 162 before and after
    es_max_consecutive_hyphen_ended_lines: 4, so Spanish still hyphenates and still
      ladders, which is the point of the scope
  revert: WP-4.3 deletes the rule and its comment; nothing else depends on it
page_sets:
  authored_by: WP-2.0b
  evaluated: per run from the oracle leg's en/edition-manifest.json, never stored as
    page-number values, so a content change reshapes the sets instead of invalidating
    them (protocol rule 9)
  domain: the interior domain, reader.pdf pages 2..n-1
  rules:
    furniture:
      description: every interior page
      derivation: every page in the compared domain
    openers:
      description: article opener pages
      derivation: the set of layout.toc values
      coverage_note: layout.toc maps an article id to its opener page; the contents
        page itself is not a manifest field, so this rule reaches article openers only
        and a contents page is scored under body until a manifest field names it
        (recorded under protocol rule 10 rather than left implied)
    placement:
      description: pages carrying a figure, plate or printed tail ornament
      derivation: the set of layout.figures[*].page, plus for every layout.tail_arts
        entry whose printed is true the last page of its article, computed as
        layout.toc[article] + layout.article_pages[article] - 1
    body:
      description: prose pages with no placement and no opener
      derivation: furniture minus openers minus placement
    code:
      description: pages where a staged fenced run's or a resolved extract's first
        line lands
      derivation: for each fenced run in a staged manuscript, the first interior page
        whose normalized extracted text contains that run's first line
      coverage_note: empty for edition 010, which carries neither fenced code blocks
        nor extracts, so this rule is non-discriminating on the current corpus and
        WP-3.3 gates on its own fixture edition instead (protocol rule 10)
