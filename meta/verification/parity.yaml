normalization:
  strip_pdf_keys:
    pdf_info:
      - CreationDate
      - ModDate
      - File size
      - trailer ID
      - Producer dates
    json_leaves:
      preflight.json:
        - leaf: .cover_art.path
          only_if_both_values_contain: /mag-engine-render-stage-
        - leaf: .figures[*].path
          only_if_both_values_contain: /mag-engine-render-stage-
      render-critic.json:
        - leaf: .visual_review.booklet_sha256
        - leaf: .visual_review.reader_sha256
    derived_from_pdf_bytes_never_compared:
      - SHA256SUMS
      - package.zip
      - web-output.zip
  whitespace:
    unicode: NFC
    prose: collapse whitespace runs to one space
    code_blocks: internal whitespace preserved
  hyphen_rejoin:
    rejoin: words split by a line-end hyphenate character
    strip: soft hyphens
  color_space_map:
    authored_by: unassigned
    note: plan gap flagged by WP-0.1 critique, no WP Owns names this key (WP-0.2b owns font_name_map only)
    entries: {}
  merge_rewrite_rules:
    authored_by: WP-0.2c
    entries: {}
  font_name_map:
    authored_by: WP-0.2b
    entries: {}
tiers:
  s:
    box_tolerance_pt: 0.05
    clauses:
      - page_count
      - boxes
      - text
      - code_blocks
      - color
      - navigation
      - critic
  g:
    g1_pt: 2.0
    g2_pt: 0.5
  v:
    dpi: 300
    channel_delta: 24
    v1_page_fraction: 0.01
    v2_page_fraction: 0.001
  e:
    coordinate_quantum_pt: 0.01
    link_rect_quantum_pt: 0.5
    raster_bound:
      authored_by: WP-0.2d
tools:
  measured_at: WP-0.1
  os: macOS 26.6.2
  python: 3.12.11
  uv: 0.8.17
  weasyprint: 69.0
  pydyf: 0.12.1
  pyphen: 0.17.2
  pypdf: 6.14.2
  pygments: 2.21.0
  pillow: 12.3.0
  poppler: 25.08.0
  rustc: 1.96.0
  mutool:
    pending: WP-0.2b tracer decision
  typst_crates:
    pending: WP-1.4 pin, recorded by WP-2.0a
