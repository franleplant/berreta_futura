briefs:
- id: story-led-boy-and-robot-cast-sheet
  purpose: cast-sheet
  prompt: 'An original character model sheet for a print magazine''s recurring illustrated cast, entirely wordless: no letters, numerals, labels, captions, arrows, or watermarks anywhere. Visual language: Original family-friendly children''s science-comedy manga with simple charcoal contours, rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone, quiet print grain, and one playful visual idea per illustration. The recurring cast is exactly Pedro and Maro as defined under cast, and nobody else. Use broad period and production cues only. Never reproduce a franchise character, costume, face, silhouette, composition, or gadget. Palette: Scene-led gentle historical magazine color at low to medium saturation: softened cyan and cobalt, brick coral, muted green, dusty lavender, small warm-ochre accents, warm off-white breathing room, and charcoal ink. The setting chooses the background. Never impose one yellow paper field. Show every cast member together on one plain warm off-white sheet at their true relative sizes: for each member a front view, a side view, and a back view in a neutral standing pose, plus a small row of three expressions, arranged in clean rows with generous spacing. No scene, no background objects, no panel borders. Cast: Pedro, a school-age boy: black tousled hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions, or extra limbs. Avoid: Direct copies of Doraemon, Nobita, or any recognizable franchise character; Blue robotic cats, signature franchise gadgets, copied costumes, or copied faces; Uniform yellow, mustard, beige, sepia, cream-paper, or bright cyan backgrounds; Extra humans, extra robots, or robot-faced background appliances; Decorative montages, contact sheets, or filler patterns; Dense technical realism, steampunk clutter, or excessive crosshatching; Modern glossy anime rendering, painterly concept art, neon cyberpunk, or photorealism; Decorative pseudo-writing, interface glyphs, captions, labels, or speech balloons.'
  cast_references:
  - art-directions/references/story-led-boy-and-robot-cast.png
