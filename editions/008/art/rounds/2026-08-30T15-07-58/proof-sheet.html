<details><summary>prompt</summary><pre>Original family-friendly children's science-comedy manga illustration, entirely wordless. Simple charcoal contours, rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone, slight pigment variation, subtle paper tooth, and quiet print grain. One playful visual idea only. Square composition, at least 1000 x 1000 pixels, with the essential action held well inside the frame so it survives a square crop and stays legible at A5 print size.

Scene: a long classroom sand table in a schoolroom, seen from a low three-quarter angle so the tabletop sits near the viewer's eye. On the sand stand three miniature cities built of small wooden blocks. The nearest is a flattened mound of toppled blocks, half sunk into the sand. The middle one is a taller ruin caught mid-collapse, its upper courses sliding sideways in a small drift of sand. The far one is new, only four courses high, straight and clean, and still being built. Pedro kneels at the right of the sand table and sets one fresh block on the top course of the new city, arms steady, tongue at the corner of the mouth in concentration. Maro stands at the table edge below the new city and braces its base with both mitten hands, face screen tilted up to watch the block land. Flopaz crouches at the left over the two ruins, lifting one salvaged block out of the sand and holding it up while looking across at the new tower, calm and measuring. A shallow tray of spare blocks sits at Flopaz's knee. Late-afternoon light comes through a tall window at the left and rakes across the sand, so the ruins cast long shadows and the new city catches the warm edge.

Palette: scene-led gentle historical magazine color at low to medium saturation. Softened cobalt and cyan in the window light and Maro's panels, brick coral in the block cities, muted green on the tabletop felt and the tray, dusty lavender in the sand shadows, small warm-ochre accents in the raking light, warm off-white breathing room, charcoal ink for contours. At least three distinct non-neutral colors. Print-friendly contrast, strong silhouettes.

Constraints: only Pedro, Maro, and Flopaz appear, each with a real part in the scene; no other people, no other robots, no robot-faced appliances. Single unified illustration, not a multi-panel sequence. Avoid: any resemblance to Doraemon, Nobita, or any recognizable franchise character; blue robotic cats, franchise gadgets, copied costumes or faces; uniform yellow, mustard, beige, sepia, cream-paper, or bright cyan background fields; decorative montages, contact sheets, or filler patterns; dense technical realism, steampunk clutter, or heavy crosshatching; modern glossy anime rendering, painterly concept art, neon cyberpunk, or photorealism; any decorative pseudo-writing, interface glyphs, captions, labels, numerals, or speech balloons.

Recurring cast — draw exactly as specified, never redesign: Pedro, a school-age boy: black tousled hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions, or extra limbs. Flopaz, a school-age girl, Pedro's height: chestnut-brown hair in one low side ponytail with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top; white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails, never a hat, never glasses.</pre></details>
