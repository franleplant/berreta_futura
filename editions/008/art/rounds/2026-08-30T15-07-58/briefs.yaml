- id: civilizations-opener-the-third-city
  purpose: opener
  article_id: the-rise-and-fall-of-agent-civilizations
  prompt: |-
    Original family-friendly children's science-comedy manga illustration, entirely wordless. Simple charcoal contours, rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone, slight pigment variation, subtle paper tooth, and quiet print grain. One playful visual idea only. Square composition, at least 1000 x 1000 pixels, with the essential action held well inside the frame so it survives a square crop and stays legible at A5 print size.

    Scene: a long classroom sand table in a schoolroom, seen from a low three-quarter angle so the tabletop sits near the viewer's eye. On the sand stand three miniature cities built of small wooden blocks. The nearest is a flattened mound of toppled blocks, half sunk into the sand. The middle one is a taller ruin caught mid-collapse, its upper courses sliding sideways in a small drift of sand. The far one is new, only four courses high, straight and clean, and still being built. Pedro kneels at the right of the sand table and sets one fresh block on the top course of the new city, arms steady, tongue at the corner of the mouth in concentration. Maro stands at the table edge below the new city and braces its base with both mitten hands, face screen tilted up to watch the block land. Flopaz crouches at the left over the two ruins, lifting one salvaged block out of the sand and holding it up while looking across at the new tower, calm and measuring. A shallow tray of spare blocks sits at Flopaz's knee. Late-afternoon light comes through a tall window at the left and rakes across the sand, so the ruins cast long shadows and the new city catches the warm edge.

    Palette: scene-led gentle historical magazine color at low to medium saturation. Softened cobalt and cyan in the window light and Maro's panels, brick coral in the block cities, muted green on the tabletop felt and the tray, dusty lavender in the sand shadows, small warm-ochre accents in the raking light, warm off-white breathing room, charcoal ink for contours. At least three distinct non-neutral colors. Print-friendly contrast, strong silhouettes.

    Constraints: only Pedro, Maro, and Flopaz appear, each with a real part in the scene; no other people, no other robots, no robot-faced appliances. Single unified illustration, not a multi-panel sequence. Avoid: any resemblance to Doraemon, Nobita, or any recognizable franchise character; blue robotic cats, franchise gadgets, copied costumes or faces; uniform yellow, mustard, beige, sepia, cream-paper, or bright cyan background fields; decorative montages, contact sheets, or filler patterns; dense technical realism, steampunk clutter, or heavy crosshatching; modern glossy anime rendering, painterly concept art, neon cyberpunk, or photorealism; any decorative pseudo-writing, interface glyphs, captions, labels, numerals, or speech balloons.

    Recurring cast — draw exactly as specified, never redesign: Pedro, a school-age boy: black tousled hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions, or extra limbs. Flopaz, a school-age girl, Pedro's height: chestnut-brown hair in one low side ponytail with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top; white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails, never a hat, never glasses.
  subject: Two block-built miniature cities have fallen on a classroom sand table and a third is going up out of their salvaged pieces.
  composition: Low three-quarter view along the sand table, ruins reading large in the near left where Flopaz lifts a salvaged block, the rising third city and Pedro's hand with the fresh block at the far right, Maro bracing its base at the table edge, raking window light crossing all three cities.
  alt_text: On a classroom sand table, Pedro sets a block on a small rising city while Maro braces its base and Flopaz lifts a salvaged block from the ruins of two collapsed cities.
  credit: Illustration generated for this edition in the Story-Led Boy and Robot art direction.
  cast_references:
  - art-directions/references/story-led-boy-and-robot-cast.png
- id: civilizations-tail-carrying-the-blocks-home
  purpose: tail
  article_id: the-rise-and-fall-of-agent-civilizations
  prompt: |-
    Original family-friendly children's science-comedy manga illustration, entirely wordless. Simple charcoal contours, rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone, slight pigment variation, subtle paper tooth, and quiet print grain. One playful visual idea only. Wide short strip composed for a 3:1 landscape frame, with every essential action inside the middle band and safe horizontal crop; the outer left and right thirds carry only quiet setting.

    Scene: a schoolyard courtyard at dusk after the building has emptied. Along the ground run the swept-flat chalk outlines of three cities that are no longer there, the chalk smudged and fading toward the left edge. In the centre of the strip Pedro and Flopaz, reading a couple of years older than usual and dressed for a cool evening in soft knits and light jackets rather than their usual clothes, walk slowly to the right carrying a shallow crate of wooden blocks between them, one handle each. Maro walks just ahead of them at the centre of the frame with a single block held up in both mitten hands, face screen turned back over the shoulder joint toward the two of them, as if checking they are still coming. Their three long shadows stretch left across the fading chalk. At the far right of the strip, a doorway is open and lit warm. Rendering may be a little more painterly and softer-lit than usual for this quiet evening register, while the drawing stays economical.

    Palette: scene-led gentle historical magazine color at low to medium saturation. Dusty lavender and softened cobalt in the dusk courtyard, muted green along a low hedge, brick coral in the crate of blocks, small warm-ochre accents in the lit doorway and on the figures' edges, warm off-white in the chalk lines and breathing room, charcoal ink for contours. At least three distinct non-neutral colors. Print-friendly contrast and strong silhouettes that stay legible at A5 print size.

    Constraints: only Pedro, Maro, and Flopaz appear, each with a real part in the scene; no other people, no other robots, no robot-faced appliances. Single unified strip, not a multi-panel sequence. Avoid: any resemblance to Doraemon, Nobita, or any recognizable franchise character; blue robotic cats, franchise gadgets, copied costumes or faces; uniform yellow, mustard, beige, sepia, cream-paper, or bright cyan background fields; decorative montages, contact sheets, or filler patterns; dense technical realism, steampunk clutter, or heavy crosshatching; modern glossy anime rendering, painterly concept art, neon cyberpunk, or photorealism; any decorative pseudo-writing, interface glyphs, captions, labels, numerals, or speech balloons.

    Recurring cast — identities below are canon: Pedro, a school-age boy: black tousled hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions, or extra limbs. Flopaz, a school-age girl, Pedro's height: chestnut-brown hair in one low side ponytail with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top; white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails, never a hat, never glasses.

    This slot is licensed to vary presentation, overriding the fixed outfits above where they conflict: Tails may drift toward the edition's quieter register: more painterly rendering, softer light, Pedro and Flopaz reading a few years older, wardrobe following the hour and season instead of the canon outfits. Identity anchors hold: Pedro's black tousled hair, round glasses and face; Maro's black screen face with two curved white eyes, rounded silhouette and antenna; Flopaz's chestnut side ponytail and bangs.
  subject: The cities are gone and only the blocks are carried home, so the next one can be built from them.
  composition: Wide 3:1 dusk courtyard with faded chalk city outlines running out to the left edge, the three of them walking rightward through the middle band carrying a crate of blocks, Maro leading with one block and glancing back, a warm lit doorway waiting at the right.
  alt_text: At dusk, Pedro and Flopaz carry a crate of wooden blocks across a courtyard of faded chalk city outlines while Maro walks ahead holding one block and looking back at them.
  credit: Illustration generated for this edition in the Story-Led Boy and Robot art direction.
  cast_references:
  - art-directions/references/story-led-boy-and-robot-cast.png
