- id: cover-synthetic-till-roll
  purpose: cover
  prompt: 'Editorial cover plate, square, in the Sachplakat single-object poster register: one object, drawn enormous, flat, and unmistakable, in the tradition of early twentieth century single-object advertising posters. The proposition, in one sentence: the bill for all this thinking arrives as a single unstoppable ribbon of paper. The verb is ERUPTS: a colossal till-roll paper tape bursts out of a machine slot at the top left and pours down and across the plate, caught at the instant of maximum violence, not settled afterwards. Three large forms only: the black paper ribbon, which is as thick as a girder and folds twice in hard geometric switchbacks; the vermilion machine lip it tears from, cropped by the top edge; and the narrow white-hot slot inside that lip. The ribbon bleeds off the left, bottom, and right edges of the plate, so the square crops it with confidence and the multitude of paper is implied by three folds rather than drawn. Scale shock and frame invasion carry the composition; the whole mass drives down one steep diagonal. Ink discipline: a generous flat chrome yellow ground, near black as the form ink for the ribbon, vermilion as the second ink, and exactly one luminous accent, the white-hot slot, which is the single thing the eye finds first at thumbnail size. Print-flat color throughout: hard edges, confident fills, one or two controlled tonal steps on the big folds for depth, no gradients, no wash softness, no all-over grain. How the plate sits in the fixed frame: it reads as a flat chrome yellow square held against a warm off-white page, with its vermilion picking up the red-orange of the masthead above and the spine band at the right edge. No black or near-black ground, no mid-tone ground, no textured wallpaper ground. Absolutely no typography of any kind: no lettering, numerals, pseudo-writing, logo, watermark, or caption anywhere in the artwork. No circuit-board motifs, network graphs, neon cyberpunk, or AI-futurist cliches. No swarms, confetti, particle clouds, grids of repeated small elements, or scattered debris. No centered object floating on an empty field with a drop shadow. No characters, no narrative scene. Square PNG, at least 1000 by 1000 pixels, nothing important at the extreme edges, legible as a silhouette at thumbnail size.'
- id: cover-art-directed-relocked-beam
  purpose: cover
  prompt: 'A large-format studio photograph, square, made on a real optical bench with real hardware and real light. Read the edition this way: the night shift went on without us, and by morning the beam was locked again. The verb is SPLITS. Shoot dead-on macro at bench level, close enough that the front mount is out of arm''s reach of the frame, and catch the instant a hot red-orange laser line strikes the face of a cube beamsplitter and breaks into two lines travelling at ninety degrees. Materials must convince: black anodized aluminium mirror mounts with knurled adjustment screws, brushed steel posts, a bone-white bench surface with visible machined tapping holes, a faint bloom of real dust suspended in the beam path. Five large forms: the incoming beam, the splitter cube, the two outgoing beams, and the nearest mount, which is oversized in the frame and bleeds off the bottom and left edges. The composition drives along one hard diagonal; nothing in it is horizontal or vertical except the posts that the diagonal cuts across. Light: one raking hard source from the right, deep specular highlights on the anodized metal, and exactly one luminous accent, the white-hot flare where the beam enters the glass, which owns the frame in one beat. The ground is the bone-white bench, pale and generous, so the plate breathes with the page rather than dissolving into it; the red-orange of the beam is the plate''s handshake with the masthead accent and the spine band, and the anodized black is the second ink. No dark, dusky, mid-tone, or near-black field anywhere: keep dark to the forms, never to the ground. Hard-edged, high-contrast silhouette overall so the square plate reads unmistakably as an object placed on a warm off-white page. Absolutely no typography of any kind in the artwork: no lettering, numerals, dial markings that read as writing, logo, watermark, or caption. No circuit motifs, network graphs, neon cyberpunk, or AI-futurist styling. No humans, no hands, no characters. No swarms or particle clouds. Square PNG, at least 1000 by 1000 pixels, nothing important at the extreme edges.'
- id: cover-wildcard-scale-tips
  purpose: cover
  prompt: 'Improbable proposition, executed as a hand-cut layered paper relief and photographed under a single raking light, square. The idea in one sentence: one token outweighs the building it runs. The verb is TIPS, drawn at the instant the balance passes the point of no return, beam already steep and both pans in motion. Build it from cut card in four physical layers so real shadow falls between them: a colossal balance beam crossing the plate on a steep diagonal and bleeding off the left and right edges; the fulcrum post rising from the bottom edge; the near pan, tiny, carrying one disc; the far pan, vast, carrying a whole apartment block cut in silhouette with its cornices and chimneys intact; and the block''s cast shadow, which on second read is the largest shape in the picture. Six forms, no more, nothing smaller than a fingernail at print size. The pan with the single disc is the one that has gone down. Figure and ground trade places: read the negative space between beam, block, and shadow as a second composition. Inks: a saturated cobalt ground that stays unmistakably a color in print, near black for the cut-paper forms with their cut edges catching a thin vermilion under-layer, and exactly one luminous accent, the white-hot disc in the low pan, which the eye must reach in a single beat. Hard cut edges, flat card surfaces, honest paper thickness, real directional shadow: material conviction, not digital smoothness. How the plate sits in the fixed frame: a saturated cobalt square with hard black forms, pinned against a warm off-white page, its vermilion cut edges shaking hands with the red-orange masthead accent and the spine band. No black, near-black, or mid-tone ground. Absolutely no typography of any kind in the artwork: no lettering, numerals, currency symbols, pseudo-writing, logo, watermark, or caption. No circuit motifs, network graphs, neon cyberpunk, or AI-futurist cliches. No swarms, confetti, particle clouds, grids of repeated small elements, or scattered debris. No characters, no narrative staging, no centered object on an empty field with a drop shadow. Square PNG, at least 1000 by 1000 pixels, nothing important at the extreme edges.'
- id: warp-opener-the-card-that-edits-the-card
  purpose: opener
  article_id: how-warp-builds-self-improving-agents-on-claude
  prompt: |-
    Original family-friendly children's science-comedy manga illustration, square, entirely wordless. Scene: a small daylit workshop. Maro stands square-on at a low coral-red workbench, both mitten hands on a half-built wooden toy cart, working from a stiff card propped upright on a wire stand in front of it; the card carries only a simple drawn diagram of the cart, no writing of any kind. Pedro leans in from the left on his toes, one hand steadying the bench, the other clipping a small paper tag to the top of the propped card with a wooden clothespin, his face bright with the pleasure of having spotted the problem. Flopaz stands at a card rack on the right, calm and unhurried, lifting a second card that repeats the same diagram with the wheel drawn in its corrected position, and sliding it into the stand to replace the first. Above all three a taut wire crosses the scene, hung with clothespinned cards that curve back toward the bench, so the eye travels around the loop and returns to the propped card. One playful idea only: the instructions are being rewritten by the work they produced. Style: simple charcoal contours, rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone, quiet print grain. Palette, chosen by the setting and kept at low to medium saturation: coral bench, muted green pegboard wall, cobalt tool crate and cobalt shadow, small warm-ochre accents in the wood shavings and lamplight, dusty lavender in the far corner, warm off-white breathing room, charcoal ink; at least three distinct non-neutral colors, and never one flat yellow paper field. Strong silhouettes and expressions that stay legible at A5 print size, print-friendly contrast, slight pigment variation and subtle paper tooth. Single scene, not a multi-panel sequence. Broad period and production cues only. Avoid: any resemblance to Doraemon, Nobita, or any recognizable franchise character; blue robotic cats, franchise gadgets, copied costumes or copied faces; uniform yellow, mustard, beige, sepia, cream-paper or bright cyan backgrounds; any extra humans, extra robots, or robot-faced background appliances; decorative montages, contact sheets, or filler patterns; dense technical realism, steampunk clutter, or excessive crosshatching; modern glossy anime rendering, painterly concept art, neon cyberpunk, or photorealism; decorative pseudo-writing, interface glyphs, captions, labels, or speech balloons.

    Recurring cast — draw exactly as specified, never redesign: Pedro, a school-age boy: black tousled hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions, or extra limbs. Flopaz, a school-age girl, Pedro's height: chestnut-brown hair in one low side ponytail with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top; white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails, never a hat, never glasses.
  subject: Maro works from a propped instruction card while Pedro clips a note of feedback to it and Flopaz slots in the corrected card that the note produced.
  composition: Square workshop scene built around a low coral workbench, the propped card at the optical center, Pedro leaning in from the left, Maro square-on at the bench, Flopaz at the card rack on the right, with a wire of clipped cards curving overhead to close the loop.
