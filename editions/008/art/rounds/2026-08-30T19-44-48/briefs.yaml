briefs:
- id: cover-synthetic-the-ticket-punch
  purpose: cover
  prompt: |
    Editorial cover plate for a magazine, square, synthetic branch, printed as a two-plate
    risograph with deliberate misregistration: two flat spot inks laid down slightly out of
    register so every form carries a thin halo of the wrong colour along one side, visible paper
    tooth, honest roller mottle, no photographic rendering anywhere. The reading of this edition
    in one sentence: nothing passes for free, and every single pass is punched. The verb is
    BITES, frozen at the instant the die shears the ticket through, the chad still travelling and
    the jaws not yet closed. Viewpoint is dead on and edge on to the jaws, macro, no eye level
    middle distance. Five forms and no more, counted: the upper jaw of a colossal conductor's
    ticket punch, driving down from the top edge; the lower jaw with its round die, rising from
    the bottom edge; the long flat band of ticket card running the full width of the plate like a
    causeway; the punched hole itself, blown clean through the card; and the single chad flicking
    away from it. Scale shock carries the composition, since the jaws are the size of a lifting
    bridge and the ticket is the road under it, and frame invasion doubles it, since both jaws
    bleed off the top and bottom edges and the card runs off the left and the right. Figure and
    ground trade places on the second read: the hole is the subject, the machine is only what
    surrounds it. Inks: a generous flat saturated magenta ground; ultramarine as the form ink for
    jaws, die, and card; the misregistered overlap of the two reading as a deep ink blue black;
    and exactly one luminous accent, the punched hole, bare bone white paper with hard white
    light blasting through it, which the eye must find in a single beat at thumbnail size. Print
    flat throughout: hard edges, confident fills, at most two tonal steps on the big jaws, no
    gradients, no wash softness, no all over grain standing in for colour. How the plate sits in
    the fixed cover frame: a saturated magenta square held against a warm off white page, its
    ultramarine forms keeping a hard high contrast silhouette so the plate reads as an object on
    the page and never as a dull rectangle, with the black masthead above and the red orange
    spine band at the right edge left entirely to the layout. No black, near black, or mid tone
    ground anywhere; dark belongs to the forms only. Absolutely no typography of any kind in the
    artwork: no lettering, numerals, ticket printing, fare marks, pseudo writing, logo,
    watermark, or caption. No circuit motifs, network graphs, neon cyberpunk, or AI futurist
    cliches. No swarms, confetti, particle clouds, grids of repeated small elements, or scattered
    debris. No characters, no narrative staging, no centred object floating on an empty field
    with a drop shadow. Square PNG, 2048 by 2048 pixels, nothing important at the extreme edges,
    unmistakable as a silhouette at thumbnail size.
- id: cover-art-directed-the-counterweight
  purpose: cover
  prompt: |
    Paint this one: an oil painting on panel, square, art directed branch, worked alla prima with
    a loaded brush and real facture, thick opaque strokes in the lights, thin scumbles in the
    shadows, brush marks left standing, rendered with full depth in modelled form, cast shadow,
    hanging dust, and atmosphere. Read the edition this way, in one sentence: the work only rises
    because something very heavy is falling on the other end of the rope. The verb is PLUNGES,
    caught with the mass at full speed and the cable singing, never at rest. Radical viewpoint:
    worm's eye from the floor of a narrow lime washed hoistway, looking straight up, so the
    counterweight is coming down at the viewer and the shaft opens far above onto a wedge of hard
    daylight. Five large forms, counted: the cast iron counterweight, colossal, oversized for its
    shaft, cropped by the top edge and by the left as it drives down; the taut greased steel
    cable running the full height of the plate; the pair of timber guide rails converging away
    from the viewer; a verdigris bracket bolted into the plaster; and the wedge of open daylight
    at the top of the shaft. Thrust is the weapon: the whole composition drives along one steep
    diagonal and nothing horizontal or vertical carries the energy. Four to six hues and no ink
    discipline: sunlit lime whitewash on the plaster, iron blue black in the mass, warm ochre in
    the daylight and where it lands, verdigris green on the bracket, and rust orange bleeding
    from the bolt heads, with cool grey in the shadowed plaster. Light comes from that one high
    source, hard and raking, so the plaster is brilliant, the ironwork is nearly black against
    it, and real motes hang in the beam. The ground is the sunlit whitewashed plaster, pale and
    generous, so the plate breathes with the page while the near black mass holds a hard, high
    contrast silhouette that cannot dissolve into it. How the plate sits in the fixed cover
    frame: a pale bone square with one enormous dark form in it, laid on a warm off white page
    under the black masthead, with all typography left to the layout. No dark field, no dusk, no
    mid tone haze, no textured wallpaper behind the forms: dark stays inside the objects.
    Absolutely no typography of any kind in the artwork: no lettering, numerals, load plates,
    maker's marks, chalked writing on the plaster, pseudo writing, logo, watermark, or caption.
    No humans, no hands, no faces, no characters, no narrative staging. No circuit motifs,
    network graphs, neon cyberpunk, or AI futurist styling. No swarms, particle clouds, or
    scattered debris. No centred object on an empty field with a drop shadow. Square PNG, 2048 by
    2048 pixels, nothing important at the extreme edges.
- id: cover-wildcard-the-chain-runs-out
  purpose: cover
  prompt: |
    Photograph the impossible, square, wildcard branch: an award winning large format press
    photograph, shot cinematically at 1 over 8000 of a second from a small boat at sea level, in
    hard tropical noon sun, with true photographic depth of field, real motion blur only in the
    spray, and physically believable materials throughout. The idea in one sentence: the anchor
    chain is paying out faster than anything can stop it, and it has already begun to glow. The
    verb is TEARS. Catch the microsecond a chain link comes ripping out of a ship's hawse pipe at
    such speed that the steel is running orange hot and the seawater on the hull flashes straight
    to steam. Six forms, counted: the black steel hull face, cropped hard by the top and right
    edges, with honest weld seams, rivet lines, chipped paint, and streaked rust; the round mouth
    of the hawse pipe; the chain itself, massive links as thick as a man's chest, driving down
    one steep diagonal to the water; the single white hot link at the pipe mouth; the exploding
    burst of white spray and steam where the chain enters the sea; and the open water below.
    Weapons: radical viewpoint, since the camera is down at wave height looking up the hull, and
    frame invasion, since hull and chain both bleed off the plate's edges and the square crops
    them without apology. Colour is full continuous photographic colour, no ink discipline: high
    key saturated cyan teal water filling the lower plate, bleached bright sky above, black steel
    in the hull, orange and cherry heat in the running links, white in the steam, with real
    specular glints on the wet metal. Exactly one thing is luminous and owns the frame in a
    single beat: the white hot link at the pipe mouth. Keep the whole plate bright and saturated,
    never dusk, never overcast, never grey, never hazy: the water stays unmistakably a colour in
    print and the hull stays unmistakably near black against it, so the plate holds a hard edged,
    high contrast silhouette. How the plate sits in the fixed cover frame: a brilliant teal and
    black square pinned to a warm off white page, its hot orange answering the red orange accent
    of the masthead and the spine band, with every piece of typography left to the layout.
    Absolutely no typography anywhere in the artwork: no ship name, port of registry, draft
    marks, numerals, stencilling, pseudo writing, logo, watermark, or caption; crop any hull
    lettering out of frame entirely. No humans, no hands, no faces, no birds. No swarms, particle
    clouds, confetti, or scattered debris. No circuit motifs, network graphs, neon cyberpunk, or
    AI futurist styling. No flat graphic or vector treatment: this one is a photograph and must
    read as one. Square PNG, 2048 by 2048 pixels, nothing important at the extreme edges, and an
    unmistakable silhouette at thumbnail size.
