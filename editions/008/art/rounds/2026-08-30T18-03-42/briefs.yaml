- id: cover-synthetic-the-shovel
  purpose: cover
  prompt: |-
    Editorial cover plate, square, cut and printed in the linocut register: gouged blacks, visible blade
    chatter at the edges of every form, ink pressed hard into laid paper, the whole thing carved by a
    hand that meant it. The proposition, in one sentence: the thinking runs on fuel, and someone is still
    shovelling. The verb is HURLS, caught at the instant the load leaves the blade, never at rest and
    never afterwards. Worm's eye view from the furnace floor. Five forms and no more: a colossal shovel
    blade driving up from the lower left on a steep diagonal, as big as a barn door; the forearm and
    shaft behind it, cropped away by the bottom edge; three coins the size of dinner plates arcing off
    the blade in a single tight curve, so that a fortune is implied by three and never drawn as a swarm;
    the furnace door plate cropped hard by the right edge; and the narrow slot of the mouth inside it.
    Weapons: scale shock, since the blade dwarfs the door it feeds, and frame invasion, since the shovel
    bleeds off the bottom and left while the furnace bleeds off the right. Inks: a generous flat emerald
    ground; near black as the form ink for shovel, arm, and door; vermilion for the door plate and the
    hot ring around its opening; and exactly one luminous accent, the white hot slot of the mouth, which
    the eye must find in a single beat at thumbnail size. Print flat throughout: hard gouged edges,
    confident fills, at most two tonal steps on the big forms, no gradients, no wash softness, no
    all over grain standing in for color. How the plate sits in the fixed frame: a saturated emerald
    square laid on a warm off white page, its vermilion door shaking hands with the red orange masthead
    accent above and the spine band at the right edge. No black, near black, or mid tone ground anywhere;
    dark belongs to the forms only. Absolutely no typography of any kind in the artwork: no lettering,
    numerals, currency marks, pseudo writing, logo, watermark, or caption. No circuit motifs, network
    graphs, neon cyberpunk, or AI futurist cliches. No swarms, confetti, particle clouds, grids of
    repeated small elements, or scattered debris. No characters, no narrative staging, no centered object
    on an empty field with a drop shadow. Square PNG, 2048 by 2048 pixels, nothing important at the
    extreme edges, unmistakable as a silhouette at thumbnail size.
- id: cover-art-directed-the-impression
  purpose: cover
  prompt: |-
    Make this on a real machine and photograph it: a large format studio photograph, square, of a working
    cast iron letterpress at the instant of impression. Read the edition this way: nothing is free, and
    the charge lands with every single impression. The verb is SLAMS. Camera dead on and low, at the
    height of the paper itself, close enough that the platen fills the frame's left half and the sheet
    runs out toward the viewer. Materials have to convince: cast iron with worn paint and honest casting
    seams, a brass gripper finger, a steel rail scuffed bright by years of travel, tacky vermilion ink
    standing in a wet ridge on the roller and catching a hard specular streak, one sheet of bone laid
    paper with visible tooth and a deckled edge. Five large forms only: the closing platen, the sheet
    caught mid strike and buckling very slightly, the inked roller above it, the gripper, and the black
    shadow the platen throws across the bed. The platen bleeds off the top and left edges of the plate;
    the sheet runs off the bottom. One raking hard light from the upper right. The single luminous accent
    is the white hot highlight riding the wet ink ridge, and the eye must reach it first. The ground is
    the bone white sheet, pale and generous, so the plate breathes with the page instead of dissolving
    into it; vermilion ink is the handshake with the masthead accent and the spine band; the iron is the
    second, form only ink. No dark field, no dusk, no mid tone haze anywhere behind the forms: dark stays
    in the objects. Overall a hard edged, high contrast silhouette that reads unmistakably as an object
    placed on a warm off white page. Absolutely no typography in the artwork: no lettering, numerals,
    type formes showing readable characters, maker's plates, pseudo writing, logo, watermark, or caption;
    any type in the bed must be cropped out of frame entirely. No circuit motifs, network graphs, neon
    cyberpunk, or AI futurist styling. No humans, no faces, no characters. No swarms or particle clouds.
    Square PNG, 2048 by 2048 pixels, nothing important at the extreme edges.
- id: cover-wildcard-the-anvil-and-the-crown
  purpose: cover
  prompt: |-
    One improbable idea, painted flat in gouache with hard poster edges: a pool of liquid light, and an
    anvil dropped into it. Square plate. The idea in a sentence: the bill does not drift down, it lands.
    The verb is PUNCHES, frozen at the microsecond of impact, the crown of the splash still climbing and
    not one drop yet falling back. Viewpoint is radical and dead on at the surface, so low that the pool
    is a knife thin horizontal and the viewer is about to be hit. Six forms: the colossal black anvil,
    angled and driving down, cropped by the top and right edges so the square catches only its working
    body; the white hot crown thrown up around it, a ring of thick fat spikes, no fine spray, no
    droplet clouds; the taut surface line of the pool running the width of the plate; the anvil's own
    reflection breaking apart beneath it; the single ripple ridge racing outward; and the dark trough
    the crown is torn from. Read the negative space between the crown's spikes as a second composition:
    it is the shape of a struck bell. Inks: a saturated cobalt ground that stays unmistakably a color in
    print; near black for the anvil and the reflection; vermilion burning in the trough where the metal
    enters; and exactly one luminous accent, the bone white crown, the hottest thing in the frame and the
    first thing the eye finds. Flat committed fills, hard edges, at most two tonal steps, no gradients,
    no airbrush glow, no grain. How the plate sits in the fixed frame: a saturated cobalt square pinned
    to a warm off white page, its vermilion trough answering the red orange masthead accent and the spine
    band at the right edge. No black, near black, or mid tone ground; dark is for the forms only.
    Absolutely no typography of any kind: no lettering, numerals, pseudo writing, logo, watermark, or
    caption. No circuit motifs, network graphs, neon cyberpunk, or AI futurist cliches. No swarms,
    confetti, particle clouds, grids of repeated small elements, or scattered debris. No characters, no
    narrative staging, no centered object on an empty field with a drop shadow. Square PNG, 2048 by 2048
    pixels, nothing important at the extreme edges, and an unmistakable silhouette at thumbnail size.
- id: warp-opener-the-run-that-fixes-its-track
  purpose: opener
  article_id: how-warp-builds-self-improving-agents-on-claude
  prompt: |-
    Original family friendly children's science comedy manga illustration, entirely wordless, in
    LANDSCAPE format at 1760 by 1024 pixels, aspect 1.71 to 1. Compose for the wide frame: keep every
    head, hand, and essential prop well inside it with clear headroom above the heads, because nothing
    outside the frame prints, and keep the whole picture legible at A5 size. Scene: a sunlit workshop
    floor with a long wooden marble run set on trestles, running the full width of the frame from a high
    release block at the left down through three grooved timber levels to a tin cup waiting on a stool at
    the right. Maro stands at the left with one mitten hand on the release gate, letting a marble go, its
    screen face following the marble down the run. Pedro crouches in the middle of the frame under the
    second level, exactly beneath the place where the last marble flew off the track, chalking a small
    plain cross on the floorboards, delighted at having found the spot; the cross is a simple mark, never
    a letter or a number. Flopaz stands calmly at the right where the track meets the cup, holding the
    marble that missed in one hand while her other hand tilts a hinged section of track to a kinder angle
    so the next one will drop home. One playful idea only: the track is being reshaped by the run it just
    made. Style: simple charcoal contours, rounded readable expressions, economical watercolor washes,
    minimal hatching, restrained halftone, slight pigment variation, subtle paper tooth, quiet print
    grain. Palette, chosen by the setting and kept at low to medium saturation: muted green pegboard wall,
    warm ochre timber of the run and the floorboards, brick coral stool and toolbox, cobalt shadow under
    the trestles, dusty lavender in the far corner, softened cyan glass in the marbles, warm off white
    breathing room, charcoal ink; at least three distinct non neutral colors, and never one flat yellow
    paper field. Strong silhouettes and expressions that stay legible at A5 print size, print friendly
    contrast. A single unified scene, not a multi panel sequence. Only Pedro, Maro, and Flopaz appear,
    each with a real part in the action. Broad period and production cues only. Avoid: any resemblance to
    Doraemon, Nobita, or any recognizable franchise character; blue robotic cats, franchise gadgets,
    copied costumes or copied faces; uniform yellow, mustard, beige, sepia, cream paper, or bright cyan
    background fields; any extra humans, extra robots, or robot faced background appliances; decorative
    montages, contact sheets, or filler patterns; dense technical realism, steampunk clutter, or heavy
    crosshatching; modern glossy anime rendering, painterly concept art, neon cyberpunk, or photorealism;
    any decorative pseudo writing, interface glyphs, captions, labels, numerals, or speech balloons.

    Recurring cast — draw exactly as specified, never redesign: Pedro, a school-age boy: black tousled hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions, or extra limbs. Flopaz, a school-age girl, Pedro's height: chestnut-brown hair in one low side ponytail with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top; white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails, never a hat, never glasses.
  subject: The agent's own run is what rewrites its instructions, drawn as a marble run whose track is corrected from the path the last marble took.
  composition: A long wooden marble run crosses the wide frame from a high release at the left to a cup at the right, with Maro releasing at one end, Pedro chalking the miss beneath the middle, and Flopaz tilting the track piece at the other.
  alt_text: Maro releases a marble at the left of a long wooden marble run while Pedro chalks a cross on the floor where the last one flew off and Flopaz tilts the track section that will send the next one into the cup.
  credit: Illustration generated for this edition in the Story-Led Boy and Robot art direction.
  cast_references:
  - art-directions/references/story-led-boy-and-robot-cast.png
