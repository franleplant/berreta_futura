- id: civilizations-opener-the-flame-handed-on
  purpose: opener
  article_id: the-rise-and-fall-of-agent-civilizations
  prompt: |-
    Original family friendly children's science comedy manga illustration, entirely wordless, in
    LANDSCAPE format at 1760 by 1024 pixels, aspect 1.71 to 1. Compose for the wide frame: keep every
    head, hand, and essential prop well inside it with headroom above the heads, because nothing outside
    the frame prints, and keep the picture legible at A5 size. Scene: a long dark timber table crossing a
    dim room at night, with an open window at the far left letting in a cool draught. Three plain
    candlesticks stand along the table: at the left a cold burnt out stub sunk in a hard pool of spilled
    wax; at the centre left a bent, guttering candle almost gone, its small flame leaning hard away from
    the window; at the right a tall fresh candle, unlit. Flopaz stands at the right holding the fresh
    candle steady in both hands, tilted to accept the flame, calm and completely still. Pedro carries the
    flame across the middle of the frame on a long wooden splint held in cupped hands, elbows tucked in,
    eyes fixed on the little light, walking as if the whole room depended on it. Maro walks beside him on
    the window side, holding a glass chimney up in both mitten hands as a shield against the draught, its
    screen face turned to the flame. Warm light pools on the three faces and falls away into the cool
