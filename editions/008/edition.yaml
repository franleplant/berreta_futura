    source_id: running-a-software-factory-efficiently-at-uber-s-36ff06c6
    path: media/005.jpg
    credit: 'Diagram by Uber Engineering; source: Running a Software Factory Efficiently at Uber Scale.'
    caption: Total spend decomposed into six terms that multiply; the middle three are where the optimization
