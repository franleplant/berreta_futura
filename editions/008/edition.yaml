  - id: pareto-frontier
    source_id: running-a-software-factory-efficiently-at-uber-s-36ff06c6
    path: media/006.jpg
    credit: 'Chart by Uber Engineering; source: Running a Software Factory Efficiently at Uber Scale.'
    caption: Every model configuration tested for uReview, cost per review against F1; the dashed line is the
      Pareto frontier.
    alt_text: A scatter plot of ten model configurations by cost per review and F1 score with a dashed Pareto
      frontier.
    anchor: Price per token
    layout: compact_band
  - id: graph-grounding
    source_id: running-a-software-factory-efficiently-at-uber-s-36ff06c6
    path: media/011.jpg
    credit: 'Diagram by Uber Engineering; source: Running a Software Factory Efficiently at Uber Scale.'
