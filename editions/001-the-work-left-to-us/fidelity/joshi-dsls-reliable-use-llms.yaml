- id: synthesis-1
  kind: p
  status: modified
  source: 'LLMs generate code incredibly fast, but to ensure they generate exactly what is intended, they
    need clear boundaries. Abstractions and Domain-Specific Languages (DSLs) provide a strong harness
    that guides LLMs right from the start. The example of Tickloom - a domain model and DSL for illustrating
    distributed system behavior - shows how we can use an LLM as a partner to iteratively build a DSL
    and as a natural language interface to use it. Such a DSL can act as the key source of truth for software
    systems in the world of LLMs.


    Modern LLMs possess an incredible capability. They can generate large amounts of code, and sometimes
    entire systems, from just a high-level natural language description. An important assumption here
    is that the ''intent'' of what needs to be built is well articulated, using precise words that LLMs
    can map to coding building blocks. However, there are two important points worth noting: the limits
    of upfront specification, and how design is discovered through implementation.


    The Limits of Upfront Specification


    Building large systems involves a great many small design decisions, and these cannot all be known
    in advance or driven entirely from a high-level spec. A specification is at best a starting hypothesis:
    the real constraints, trade-offs, and edge cases are discovered iteratively, as we proceed with the
    implementation. We discussed this at length in an earlier article, where we called it Upfront Specification
    Impossibility. The point is not that specs are worthless, but that the first one is a hypothesis to
    be revised, never a finished blueprint.


    The natural response is to iterate: refine the spec, generate code, review what comes back, and feed
    what we learn into the next round. That loop works well when each round produces a small, reviewable
    change.


    Design Is Discovered Through Implementation


    Reviewing code, particularly while we are still discovering the design, is not the same as writing
    it. While reviewing the generated code, we review through the chunks validating if it maps to our
    intent and looking for possible pitfalls. But reviewing rarely forces us to wrestle with the design
    decisions. Writing code, by contrast, forces us to think through concrete decisions—such as where
    a responsibility belongs or what boundaries should be exposed so the design can be extended further.
    It is in making those decisions that a design most fully reveals itself.


    The programming language and paradigm we code in shapes the design insight we get. A functional design
    approach or an object-oriented design approach reveals different aspects of the design, along with
    idioms and patterns that are natural to the paradigm.


    So where do LLMs fit in? I see LLMs playing two roles. They are a great help while we shape the design
    and its vocabulary, acting as brainstorming partners to help us explore the design space and discover
    the right abstractions. Once the vocabulary is established, LLMs work as an excellent natural language
    interface to it.


    Domain Abstractions and DSLs


    A useful way to frame this is through Domain Driven Design. Its core insight is building a shared
    conceptual model of the domain in code, and then using that model - which DDD calls a Ubiquitous Language
    - both to evolve the codebase and to give the team a vocabulary to think and communicate in. Often,
    it is highly effective to build a domain specific language on top of that model: a constrained syntax
    for expressing the domain''s concepts and operations. Seen this way, most development is the process
    of building a domain model and using it to evolve the system. The LLM plays two distinct roles depending
    on whether the domain model already exists. In this article, I will focus on how Domain-Specific Languages
    (DSLs) work with LLMs.


    Why DSLs work so well with LLMs


    It is a common experience that DSLs work well with LLMs. PlantUML, Mermaid, and Graphviz are domain
    specific languages for visual modeling; SQL is a DSL for querying databases; Kubernetes YAML is a
    DSL for describing cloud infrastructure. These are not general-purpose programming languages — they
    are deliberately constrained, designed to express a narrow set of concepts in one domain. And it is
    no surprise that LLMs are remarkably good at generating Mermaid diagrams, SQL queries, or Kubernetes
    manifests from a plain English description.


    My observation is that DSLs make LLMs more reliable because they respond so well to a few in-context
    examples. A general-purpose language like Java offers lots of valid ways to express the same intent.
    A DSL strips the variation away. Giving the model a few examples is enough to reliably generate the
    correct syntax. It''s worth noting that frontline models are already heavily exposed to PlantUML or
    Java fluent interfaces during training, so they aren''t starting from scratch. It will be curious
    to see how smaller, more constrained models perform when tasked with a truly novel DSL.


    For an agent — an LLM running in an autonomous generate-and-check loop rather than a single shot generation
    — there is one more benefit. A DSL almost always ships with a deterministic validator: a parser, a
    JSON schema, a type checker, or a compiler. The agent can generate a candidate, run it past the validator,
    and repair it from the error, all without a human in the loop. Crucially, the errors are phrased at
    the level of the domain — “you cannot select an action before choosing a client” — rather than as
    a stack trace buried deep in generated code. DSL''s toolset itself acts as an excellent harness. We
    will see it concretely in the Tickloom examples below, where the DSL''s grammar is enforced by the
    host language''s compiler and the resulting runs are checked automatically.


    It is important to note that this is not a one-size-fits-all solution. The advantage holds while the
    DSL stays small and constrained enough that a few in-context examples can convey its usage. There
    is also a real upfront cost in designing and maintaining the language and its semantic model. The
    payoff is therefore concentrated in well-factored, genuinely constrained DSLs backed by a validator.


    Example: Using LLMs to generate diagram rich powerpoint presentations'
  edited: 'LLMs can generate code at extraordinary speed, but speed does not guarantee that the result
    expresses the intended design. I argue that abstractions and domain-specific languages
    provide a constrained harness: they help people discover a design with an LLM, then give the model
    a narrow, testable vocabulary through which to use that design reliably.


    A specification is a starting hypothesis


    Large systems contain many small decisions that cannot all be settled in an upfront specification.
    Constraints, tradeoffs, and edge cases appear during implementation. A useful specification is therefore
    a hypothesis to revise, not a finished blueprint. The productive loop is small and iterative: refine
    the intent, generate a reviewable change, inspect what it reveals, and feed that learning into the
    next round.


    Reviewing generated code is not equivalent to writing it. Review can confirm that a chunk resembles
    the stated intent, yet still avoid the decisions that expose a design: where a responsibility belongs,
    which boundary should be public, or how an extension should fit. Programming languages and paradigms
    also shape what designers notice. Functional and object-oriented implementations surface different
    concepts and pressures.


    I give the LLM two roles. During design, it is a brainstorming partner used to explore vocabulary
    and possible abstractions. Once that vocabulary is established, it becomes a natural-language interface
    to a constrained system.


    Why constrained languages help


    Domain-driven design builds a shared model and a ubiquitous language that a team can use in both code
    and conversation. A DSL adds a deliberately limited syntax for expressing the model''s concepts and
    operations. Familiar examples include SQL, Mermaid, PlantUML, Graphviz, and Kubernetes YAML. They
    are effective with LLMs precisely because they reduce the number of valid ways to express an intent.


    A general-purpose language such as Java permits many architectures and idioms. A small DSL removes
    much of that variation, so a few in-context examples can often communicate its complete surface. For
    an agent operating in a generate-and-check loop, the language usually brings another crucial component:
    a deterministic validator such as a parser, schema, type checker, or compiler. The agent can propose
    a candidate, receive a domain-level error, and repair it without asking a person to interpret a stack
    trace from a large generated system.


    The claim has limits. The language must remain small enough to demonstrate with a few examples, and
    its semantic model must embody sound design decisions. Designing and maintaining a DSL has a real
    upfront cost. The payoff is strongest for a well-factored, genuinely constrained domain backed by
    deterministic validation.'
