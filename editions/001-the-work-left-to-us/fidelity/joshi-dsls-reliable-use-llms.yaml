- id: synthesis-3
  kind: p
  status: modified
  source: 'A pattern emerges from the examples discussed above: in every one of them the LLM was useful
    in two quite different ways.


    The first phase is designing the abstraction or DSL itself. Here the LLM is best treated as a brainstorming
    partner rather than a code generator. As argued at the start of this article, the design decisions
    that make up a semantic model cannot all be specified upfront — we discover the constraints, trade-offs,
    and edge cases as we implement them. So this phase is inherently iterative and feedback-driven: you
    propose a structure, try it against a real case, see where it turns out awkward, and feed what you
    learned back into the next round. The LLM speeds that loop up — it sketches alternatives, critiques
    a design, ports an idea from one language to another — but you stay firmly in the driver''s seat,
    because these are exactly the decisions you need to understand and own. The structures that make a
    DSL pleasant to use, like progressive interfaces that make an illegal scenario fail to compile or
    a semantic model kept separate from the builder that produces it, are the kind of thing you converge
    on by iterating, not by writing a specification and generating code.


    The second phase begins once the abstraction or DSL is in place. Now what the LLM does changes: it
    becomes a natural-language interface to what you have built. The prompts in this article are examples
    — “implement a quorum store as a Tickloom Replica”, “write a scenario reproducing the DDIA §10.6 read”,
    “create a slide YAML for this diagram”. In each case the English description maps almost directly
    onto the vocabulary you defined, and the LLM is a dependable generator precisely because the abstraction
    supplies both the context that grounds the prompt and the harness that checks the result.


    The DSL as the Source of Truth


    There is a growing trend of treating prompts as the primary source of truth. A well-designed DSL fundamentally
    changes this dynamic. One of the key advantages I observe of working with DSLs is that the generated
    program itself often becomes the artifact that humans maintain. Because a DSL is dense, expressive,
    and largely free of incidental boilerplate, it captures the essential intent of the solution in a
    form that remains readable long after generation. If an LLM generates a Tickloom failure scenario
    from a natural language request, the resulting scenario is already expressed in the vocabulary of
    the domain. If the scenario needs to change next month, there is no need to recover the original prompt
    and regenerate everything. The DSL has enough context for LLM to know the intent and work with it.
    The enduring asset is not the prompt, but the DSL and the semantic model.


    Acknowledgments


    I would like to thank Martin Fowler and Rebecca Parsons for their valuable feedback and suggestions.'
  edited: 'Two phases, one source of truth


    In the first phase, the LLM helps shape an abstraction or DSL. This work remains iterative because
    implementation reveals missing concepts and awkward boundaries. The model can suggest alternatives
    and accelerate experiments, but people still choose the semantic model and accept responsibility for
    it.


    In the second phase, the established language becomes the stable interface. The model translates intent
    into its vocabulary; deterministic tooling parses, validates, compiles, and tests the result. Reliability
    comes less from a better prompt than from reducing the degrees of freedom and making incorrect outputs
    cheaply detectable.


    This changes what counts as the source of truth. A prose prompt is ambiguous, difficult to compose,
    and weak as a durable software artifact. A DSL records domain decisions in a form that can be versioned,
    validated, diffed, and executed. Prompts become convenient requests against that model rather than
    the model itself. In an LLM-heavy workflow, the lasting asset is the carefully designed abstraction
    and its validator: the part of the system that says what outputs are possible, what they mean, and
    how anyone can know they are correct.'
