- id: synthesis-2
  kind: p
  status: modified
  source: "LLMs make it really easy to build custom tools. While teaching distributed systems, I frequently\
    \ need to create presentations which mostly have diagrams explaining distributed operations in a cluster.\
    \ UML Sequence diagrams have been great for that but showing a full sequence diagram while explaining\
    \ the flow of messages through the cluster is not very useful. I needed a tool to show a sequence\
    \ diagram step by step in a powerpoint presentation. With the help of LLMs I was able to build a tool\
    \ which processes a YAML describing the presentation structure with references to the PlantUML diagrams\
    \ and generates a powerpoint presentation. The PlantUML diagrams are marked with steps, and the tool\
    \ generates a separate slide for each step. This made it really easy to create diagram-rich presentations.\n\
    \nGenerate a PlantUML sequence diagram showing a cluster of three nodes athens, byzantium and cyrene.\
    \ Put a box to mark the cluster. Actor Alice sends a message “title”, “After Dawn” to athens, Athens\
    \ sends message to itself. Put a note to show state 'title: After Dawn'. Athens sends message to byzantium\
    \ which fails. Athens sends to cyrene. Put a note placed to the right of cyrene. athens then checks\
    \ with isQuorumReached and returning a synchronous Success arrow back to Alice. Put a '[step] marker\
    \ after each message.\n\nThis prompt generates the following PlantUML code with step markers:\n\n\
    @startuml\nactor Alice\n\nbox \"Cluster\" #lightblue\nparticipant athens\nparticipant byzantium\n\
    participant cyrene\nend box\n\n'[step]\nAlice -> athens: \"title\", \"After Dawn\"\n\n'[step]\nathens\
    \ -> athens: save()\n\nnote right of athens\n  state:\n  title: After Dawn\nend note\n\n'[step]\n\
    athens -[#red]x byzantium: \"title\", \"After Dawn\"\n\n'[step]\nathens -> cyrene: \"title\", \"After\
    \ Dawn\"\n\nnote right of cyrene\n  state:\n  title: After Dawn\nend note\n\n'[step]\nathens -> athens:\
    \ isQuorumReached()\n\n'[step]\nathens --> Alice: Success\n\n@enduml\n\nI used it to create a series\
    \ of slides in a powerpoint presentation. For doing that, I developed a small YAML specification to\
    \ describe the presentation structure and the diagrams to be used in each slide. This allowed me to\
    \ use LLMs to create presentations describing complex distributed systems concepts, without having\
    \ to manually create animations on the slides. An example prompt to generate a slide YAML spec is\
    \ as simple as following.\n\nCreate a slide YAML referring to the diagram 'quorum-write' with a title\
    \ 'Quorum Write Example'\n\nThis generates a slide spec YAML like following:\n\n- slide:\n       \
    \       title: \"Quorum Write Example\"\n              diagram: \"quorum-write\"\n\nIt's important\
    \ to note that even if the prompt is saying create a slide YAML, it's not any random YAML spec. Because\
    \ the tool to generate the powerpoint presentation and the YAML specification understood by the tool\
    \ is used as a context in the prompt, the LLM is able to generate the correct YAML spec which can\
    \ be directly used by the tool to generate the powerpoint presentation.\n\nThe full YAML spec can\
    \ be viewed at this Github repo\n\nNotice that the LLM played two different parts in this single example.\
    \ First it was a co-designer — helping shape the step-marked PlantUML extension and the slide YAML\
    \ on top of existing PlantUML tooling. Then, once that small DSL existed, it became the natural-language\
    \ interface that turns an English request into a valid spec. We will come back to this division of\
    \ labour at the end of the article.\n\nBuilding the Semantic Model\n\nThe example we covered in the\
    \ previous section was straightforward. The YAML was used as a carrier syntax, and I process its parsed\
    \ syntax tree directly, effectively using the syntax tree itself as my Semantic Model (though this\
    \ couples the syntax to the execution semantics). But in more complex domains, like distributed systems,\
    \ we need more complex semantic models to represent the concepts in the domain and the design decisions\
    \ we have made in the codebase. Let's look at an example based on a small framework I built to quickly\
    \ build and test distributed systems.\n\nExample: Tickloom — a semantic model for distributed systems\n\
    \nImplementing distributed systems such as quorum-based key-value stores or consensus protocols like\
    \ Raft and Paxos is a daunting task. Even if implementation is guided incrementally through prompts,\
    \ specifications, or carefully constructed .md skill files, the asynchronous runtimes still expose\
    \ an overwhelming space of possible implementation decisions. Threading models, networking patterns,\
    \ storage coordination, retry behavior, and timing semantics all remain entangled within the generated\
    \ code. The problem is not merely code generation complexity, but verification complexity. The resulting\
    \ state space created by all possible interleavings across thread scheduling, network delays, process\
    \ pauses, and clock skew becomes so large that systematically reviewing and validating correctness\
    \ across all interacting behaviors is nearly impossible. This is the reason we see that Jepsen tests\
    \ find bugs even in the most battle-tested distributed systems.\n\nThis is exactly where a semantic\
    \ model is beneficial. Tickloom is a small framework I built to construct and test distributed algorithms.\
    \ Its abstractions are not a generic runtime; they are a set of design decisions about how a distributed\
    \ process behaves. Every node runs in a single-threaded tick loop: each call to tick() advances a\
    \ logical clock by one and processes pending work in a fixed, deterministic order (network, then message\
    \ bus, then process, then storage). Time is measured in ticks, not milliseconds. Messages are plain\
    \ Java records. Coordination across replicas is expressed through a Replica base class that already\
    \ knows about peers, broadcasts, and quorums.\n\nThreading, timing, network delivery are no longer\
    \ open questions to be re-decided in every prompt. What remains for the algorithm author is the actual\
    \ protocol logic. A quorum replica, for instance, is just a set of message handlers expressed in the\
    \ framework's vocabulary.\n\nBecause the framework supplies the vocabulary — Replica, quorumRequest\
    \ , countResponseIf, MessageType, Handler — a prompt can stay at the level of the protocol rather\
    \ than the plumbing:\n\nUsing the Tickloom Replica abstraction, implement a quorum-based key-value\
    \ store. A client GET should collect values from a majority and return the one with the highest timestamp\
    \ (last-writer-wins). Apply a write locally only if its timestamp is newer than the stored one.\n\n\
    This high level description produces code like following:\n\n@Override\nprotected Map<MessageType,\
    \ Handler> initialiseHandlers() {\n    return Map.of(\n            LWWMessageType.CLIENT_SET_REQUEST,\
    \ this::handleClientSetRequest,\n            LWWMessageType.CLIENT_GET_REQUEST, this::handleClientGetRequest,\n\
    \            LWWMessageType.INTERNAL_SET_REQUEST, this::handleInternalSetRequest,\n            LWWMessageType.INTERNAL_GET_REQUEST,\
    \ this::handleInternalGetRequest,\n            LWWMessageType.INTERNAL_SET_RESPONSE, this::handleInternalSetResponse,\n\
    \            LWWMessageType.INTERNAL_GET_RESPONSE, this::handleInternalGetResponse\n    );\n}\n\n\
    private void handleClientGetRequest(Message message) {\n    var req = deserializePayload(message.payload(),\
    \ ClientGetRequest.class);\n    var internalReq = new InternalGetRequest(req.key());\n\n    this.<InternalGetResponse>quorumRequest(LWWMessageType.INTERNAL_GET_REQUEST,\
    \ internalReq)\n            .countResponseIf(r -> true) // any response is fine, just need a majority\n\
    \            .send()\n            .whenComplete((responses, error) -> {\n                if (error\
    \ != null) {\n                    send(createMessage(message.source(),\n                         \
    \              message.correlationId(),\n                                       new ClientGetResponse(req.key(),\
    \ null, false),\n                                       LWWMessageType.CLIENT_GET_RESPONSE));\n  \
    \                  return;\n                }\n\n                byte[] highestValue = null;\n   \
    \             long highestTimestamp = -1;\n\n                for (InternalGetResponse r : responses.values())\
    \ {\n                    if (r.value() != null && r.timestamp() > highestTimestamp) {\n          \
    \              highestTimestamp = r.timestamp();\n                        highestValue = r.value();\n\
    \                    }\n                }\n\n                boolean found = highestValue != null;\n\
    \                send(createMessage(message.source(),\n                                   message.correlationId(),\n\
    \                                   new ClientGetResponse(req.key(), highestValue, found),\n     \
    \                              LWWMessageType.CLIENT_GET_RESPONSE));\n            });\n}\n\nsource\n\
    \nThe semantic model itself acts as a context. The prompt names concepts that exist as concrete types\
    \ in the codebase, so the LLM is not inventing a threading model or a networking layer — it is filling\
    \ in protocol logic against a fixed, well-understood substrate.\n\nEven good abstractions help — without\
    \ a DSL\n\nA DSL is one end of the spectrum, and it is not easy to build. Before reaching for a language\
    \ of your own it is worth noticing that a clean set of abstractions is already a lighter version of\
    \ the same idea — and, just as the framework supplied the vocabulary for the quorum store above, a\
    \ library's named types and methods are themselves a vocabulary the model can be grounded in. Tickloom's\
    \ semantic model is really just four such seams — Process/Replica for compute and message handling,\
    \ Network for communication, Storage for persistence, and a logical Clock for time — and that decomposition\
    \ does most of the work with no new syntax at all.\n\nThis is why abstractions, not just DSLs, pair\
    \ well with LLMs. A prompt to “implement Raft as a Tickloom Replica” has limited state space to explore.\
    \ The existing QuorumReplica can be used in context as a worked example.\n\nExample: Building a DSL\
    \ for testing distributed system scenarios\n\nImplementing the algorithm is one thing; exercising\
    \ it is another. The subtle bugs in distributed systems live in specific orderings: a write that replicates\
    \ to one node before a reader's quorum shifts, a partition that heals at just the wrong moment, two\
    \ coordinators whose clocks have drifted apart. Writing such a scenario directly against the testkit\
    \ involves juggling futures, and manual tick() loops. Here is a clock-skew scenario written that way:\n\
    \nCluster cluster = new Cluster()\n        .withProcessIds(Arrays.asList(ATHENS, BYZANTIUM, CYRENE))\n\
    \        .useSimulatedNetwork()\n        .build(QuorumReplica::new);\n\ncluster.start();\n\ntry {\n\
    \    cluster.tickUntil(cluster::areAllNodesInitialized);\n\n    cluster.setTimeForProcess(ATHENS,\
    \ 1000L);\n    cluster.setTimeForProcess(BYZANTIUM, 2000L);\n\n    QuorumReplicaClient alice = cluster.newClientConnectedTo(ALICE,\
    \ ATHENS, QuorumReplicaClient::new);\n    QuorumReplicaClient bob = cluster.newClientConnectedTo(BOB,\
    \ BYZANTIUM, QuorumReplicaClient::new);\n    QuorumReplicaClient reader = cluster.newClientConnectedTo(READER,\
    \ ATHENS, QuorumReplicaClient::new);\n\n    TickCompletableFuture<SetResponse> bobWrite = bob.set(KEY.getBytes(StandardCharsets.UTF_8),\
    \ \"B\".getBytes(StandardCharsets.UTF_8));\n    cluster.tickUntilComplete(bobWrite);\n\n    TickCompletableFuture<SetResponse>\
    \ aliceWrite = alice.set(KEY.getBytes(StandardCharsets.UTF_8), \"A\".getBytes(StandardCharsets.UTF_8));\n\
    \    cluster.tickUntilComplete(aliceWrite);\n\n    TickCompletableFuture<GetResponse> read = reader.get(KEY.getBytes(StandardCharsets.UTF_8));\n\
    \    cluster.tickUntilComplete(read);\n\n    assertEquals(\"B\", new String(read.getResult().value(),\
    \ StandardCharsets.UTF_8));\n} finally {\n    cluster.close();\n}\n\nsource\n\nThe intent — “Bob writes\
    \ through Byzantium, Alice writes through Athens, a reader sees Bob's value because Byzantium's clock\
    \ was ahead” — is buried under mechanics. This is also a hard to verify code: there are dozens of\
    \ incidental decisions (when to tick, how to encode bytes, which factory overload to call) for an\
    \ LLM to get subtly wrong, and a reviewer must check every one of them.\n\nSo on top of the semantic\
    \ model I built an internal DSL whose vocabulary is the vocabulary of the scenario itself — servers,\
    \ clients, who is connected to whom, what each client does, and which faults are in effect while it\
    \ does it. The same scenario becomes:\n\nScenario<QuorumReplicaClient> scenario =\n              \
    \          QuorumStepBuilder.scenario(\"LWW lost update via server clock skew\")\n               \
    \         .servers(ATHENS, BYZANTIUM, CYRENE)\n                        .clients(ALICE, BOB, READER)\n\
    \                        .client(ALICE).connectedTo(ATHENS)\n                        .client(BOB).connectedTo(BYZANTIUM)\n\
    \                        .given(g -> g.serverTimeAt(ATHENS, 1_000L)\n                            \
    \         .serverTimeAt(BYZANTIUM, 2_000L))\n                        .steps(s -> {\n             \
    \               s.client(BOB).writes(KEY, \"B\").expectSuccess();\n                            s.client(ALICE).writes(KEY,\
    \ \"A\").expectSuccess();\n\n                            s.client(READER).reads(KEY)\n           \
    \                         .expectResponse(v -> \"B\".equals(v));\n                        });\n\n\
    source\n\nThe DSL is a thin, declarative surface that compiles down to a pure intermediate representation\
    \ — a Scenario made of Steps, where each step carries an Action (a read or write) and optional ClusterEvents\
    \ (faults like partitions and message delays). Faults read as English too: partition(BYZANTIUM).from(CYRENE),\
    \ reconnect(BYZANTIUM), delay(INTERNAL_SET_REQUEST).from(ATHENS).to(BYZANTIUM, CYRENE).byTicks(100).\
    \ The grammar is enforced by the type system through progressive interfaces — you cannot declare a\
    \ step before the topology, or an action before selecting a client — so whole classes of malformed\
    \ scenarios simply do not compile. Because the DSL is an internal DSL built in Java, the host compiler\
    \ validates the grammar for free, and a malformed generation comes back as a compile error pinned\
    \ to exactly the illegal step rather than a runtime surprise.\n\nOnce the DSL exists, a natural language\
    \ description of a failure scenario maps almost directly onto it. A prompt like:\n\nUsing the Tickloom\
    \ scenario DSL, write a scenario reproducing the DDIA §10.6 non-linearizable quorum read. A writer\
    \ connected to Athens sets the key, then updates it while replication from Athens to the other replicas\
    \ is delayed. Alice, reading through Byzantium, is forced onto a quorum that includes Athens and sees\
    \ the new value; Bob, reading later through a quorum of Byzantium and Cyrene, still sees the old value.\n\
    \nyields a scenario that stays entirely within the DSL's constrained vocabulary:\n\nScenario<QuorumReplicaClient>\
    \ scenario =\n        QuorumStepBuilder.scenario(\"Non-linearizable quorum read\")\n             \
    \   .servers(ATHENS, BYZANTIUM, CYRENE)\n                .clients(WRITER, ALICE, BOB)\n          \
    \      .client(WRITER).connectedTo(ATHENS)\n                .client(ALICE).connectedTo(BYZANTIUM)\n\
    \                .client(BOB).connectedTo(BYZANTIUM)\n                .steps(s -> {\n            \
    \        // Writer sets the key to VOLD initially and it replicates fully\n                    s.client(WRITER).writes(KEY,\
    \ VOLD).expectSuccess();\n\n                    // Writer updates to VNEW, but replication from Athens\
    \ is delayed\n                    s.client(WRITER).writes(KEY, VNEW)\n                           \
    \ .whileClusterEvent(delay(QuorumMessageTypes.INTERNAL_SET_REQUEST)\n                            \
    \        .from(ATHENS).to(BYZANTIUM, CYRENE).byTicks(100))\n                            .expectSuccess();\n\
    \n                    // Alice reads through Byzantium. Force quorum to include Athens by partitioning\
    \ Cyrene.\n                    // She will read VNEW from Athens.\n                    s.client(ALICE).reads(KEY)\n\
    \                            .whileClusterEvent(partition(BYZANTIUM).from(CYRENE))\n             \
    \               .expectResponse(v -> VNEW.equals(v));\n\n                    // Bob reads later through\
    \ Byzantium. Force quorum to include Cyrene (and exclude Athens).\n                    // The delayed\
    \ VNEW replication hasn't arrived at Cyrene, so Bob reads VOLD.\n                    s.client(BOB).reads(KEY)\n\
    \                            .whileClusterEvent(reconnect(BYZANTIUM))\n                          \
    \  .whileClusterEvent(partition(BYZANTIUM).from(ATHENS))\n                            .expectResponse(v\
    \ -> VOLD.equals(v));\n                });\n\nScenarioResult result = scenario.run();\n\nsource\n\n\
    Because the surface is so small — and the space of valid code it can generate is so much smaller than\
    \ the space of valid Java programs — the LLM has very little room to hallucinate, and a reviewer can\
    \ read the result as a description of an experiment rather than as code to be audited line by line.\
    \ Even if LLM hallucinates, the internal DSL will fail to compile allowing LLM to correct the errors\
    \ made.\n\nTwo phases working with LLMs"
  edited: 'From diagrams to a semantic model


    I first built a presentation tool for teaching distributed systems. I needed to turn PlantUML
    sequence diagrams into step-by-step PowerPoint slides. A compact YAML format names a diagram, a title,
    and the steps to reveal. With the tool and a few examples in context, an LLM can translate an English
    request into the exact YAML the generator accepts.


    This example already contains the two roles. The LLM helps design the step markers and slide vocabulary;
    after the format exists, it converts natural language into a valid specification. The YAML is not
    useful because models are generally good at producing indentation. It is useful because a program
    defines exactly what the fields mean and rejects everything outside that contract.


    More complex domains require a semantic model distinct from their surface syntax. Distributed systems
    are a demanding example because threads, clocks, network delays, storage, retries, and failure interleavings
    create an enormous design and verification space. Asking a model to generate an entire system leaves
    all those decisions open in every prompt.


    My Tickloom framework closes much of that space. Nodes run a single-threaded tick loop. Each
    tick advances a logical clock and processes work in a fixed order. Messages are records. A Replica
    abstraction already understands peers, broadcasts, and quorums. Process, Network, Storage, and Clock
    define the main seams. With threading, time, and delivery fixed, a prompt can focus on protocol logic
    instead of inventing infrastructure.


    For example, a request for a last-writer-wins quorum store can name Tickloom concepts such as Replica,
    quorumRequest, countResponseIf, MessageType, and Handler. Those names refer to concrete types and
    behavior in the codebase. The semantic model becomes executable context: the LLM fills in a bounded
    protocol against a substrate the team already understands.


    A DSL for failure scenarios


    Implementing a distributed algorithm is only half the problem. Bugs emerge in particular event orderings:
    a partition heals at the wrong moment, clocks drift, or a read quorum overlaps a write quorum in an
    unexpected way. A direct test must coordinate futures and manual tick loops, obscuring the scenario''s
    intent.


    Tickloom therefore adds an internal scenario DSL. Its vocabulary describes servers, clients, writes,
    reads, partitions, time changes, ticks, and assertions. The declarative surface compiles to a pure
    intermediate representation made of steps; a separate interpreter executes those steps against a cluster.
    Construction, representation, and execution remain separate.


    Once this language exists, a natural-language failure description maps closely to valid scenario code.
    The space of possible outputs is far smaller than the space of arbitrary Java programs. The host compiler
    checks the syntax, the scenario builder checks the domain rules, and the deterministic simulation
    checks the resulting behavior. Error messages remain at the level of the scenario, which makes repair
    useful to both the model and the human reviewer.


    The deeper point is that a custom syntax is not always necessary. Clean abstractions already form
    a vocabulary that can ground a model. A DSL is the more constrained end of that spectrum. Teams should
    first ask whether named types, narrow interfaces, examples, and validators provide enough structure
    before paying the cost of a new language.'
