- id: synthesis-2
  kind: p
  status: modified
  source: 'I''ve argued that so far, our framework is very consistent with the evidence. Now let''s talk
    about the possibility that everything I''ve said so far will be obviated because some kind of takeoff
    or singularity will be achieved, and at *that* point there will be nothing left for us to do.


    Slide 27: Slide 27


    Many companies have said, including these two, that they are racing towards recursive self-improvement.
    And they are serious companies — I take them seriously.


    Slide 28: If RSI is achieved, what are the consequences?


    Suppose, some time in the next year, recursive self-improvement is achieved. What are the consequences?
    The slide shows the usual view in the AI community. Note that AGI a famously slippery term. There
    are two main groups of definitions. One is that AGI will be humanlike in a range of cognitive dimensions,
    and the other is that it will be capable of performing a range of economically valuable tasks.


    My claim is that this view — that treats AGI and ASI as near-automatic consequences of RSI — is a
    little bit silly. These are four different dimensions of progress. None of these dimensions implies
    any of the others.


    I''ll talk about the details on the next few slides, but one small bit of intuition for now. One of
    the things that''s associated with superintelligence is that it will cure cancer and other diseas.
    But we know that the hard part of developing medical treatments is clinical trials that often require
    thousands of people and 10-15 years. That''s an example of the fact that the bottlenecks to superintelligence
    are external. It is not something that you can solve in the lab through purely computational processes.
    So the idea that recursive self-improvement will automatically lead to superintelligence, like many
    commentators assume — clearly there is something missing in terms of the causal chain.


    Slide 29: AGI discourse suffers from the Hawaii problem


    Early on in the history of AI, these were all distant goals, so it was okay that we didn''t clearly
    distinguish between different dimensions of progress. But now it''s becoming a real problem — it''s
    leading to confused discourse.


    As an analogy, suppose we are early explorers and we hope to go to Hawaii one day. It''s okay that
    we have one single term for this group of islands. But as our ship gets closer, we''d better be able
    to talk about these islands with different words. Otherwise, we''re going to confuse ourselves about
    where we are and where we''re going.


    Helen Toner, among others, has made similar points.


    Slide 30: Four dimensions of advanced AI


    Now let''s discuss each of the four dimensions in detail, starting with Recursive Self-Improvement.


    Slide 31: Recursive Self-Improvement


    Suppose a company claims they have built RSI — they have built an AI system which built its own successor.
    What does that actually mean?


    On the one hand, maybe it means an LLM spit out a whole bunch of ideas for how to tweak the architecture
    or the data pipeline or whatever else, and they automatically tested it and kept the improvements
    that worked. That''s just glorified hyperparameter search. We''ve had systems like AutoML for a long
    time — I looked it up, and even Schmidhuber has published about this a long time ago. We''re not calling
    that superintelligence. So that''s one end of the spectrum.


    It''s very different from the other extreme, where you can imagine the company actually manages to
    replace the creativity and intelligence of the human AI researchers — not just one researcher, and
    not just researchers working at the company, but the entire worldwide community of hundreds of thousands
    of people whose innovations are all going into improving AI systems. So when people are talking about
    RSI, it''s not clear which of these they mean.


    The reason for my prediction is simple: AI is still in a state where it is much better at verifiable
    tasks than non-verifiable tasks. Some dimensions of AI performance, like speed and efficiency, are
    verifiable, and it is possible that they could be greatly improved through near-term RSI.


    However, creativity, among other dimensions of intelligence, is the epitome of an unverifiable task.


    We don''t even know clearly how to test AI creativity. We don''t understand human creativity well
    enough from a cognitive science and neuroscience perspective to be able to have clear tests for it.


    Slide 32: Four dimensions of advanced AI


    Let''s go a bit deeper into AI creativity as an illustration of the barriers to humanlike AI.


    Slide 33: The AI creativity paradox


    This [quip](https://x.com/dwarkesh_sp/status/1727004083113128327) from podcaster Dwarkesh Patel is
    a good illustration of how AI creativity lags human creativity. There might be a few counterexamples,
    especially in narrow domains like Erdos problems. But think about famous "Eureka moments" — finding
    surprising connections between seemingly unrelated fields or problems — that we associate with great
    feats of human scientific invention and creativity. LLMs seem to be nowhere close to that.


    To understand why, I spent a good amount of time immersed in the cognitive science literature. I won''t
    go into the details, but seems like there are two literatures looking at this in slightly different
    ways that haven''t really been talking to each other, for reasons I don''t fully understand. Based
    on what I''ve been reading, I want to present some hypotheses about AI creativity.


    Slide 34: Some hypotheses about AI creativity


    Representation quality is absolutely fundamental to cognition. Think about deep learning — what a
    big leap that was in the quality of representations behind perception. So I do think AI has more or
    less caught up in representation quality when it comes to *perception*, but it has not caught up when
    it comes to representations that we use as humans for *creativity and reasoning*.


    François Chollet in particular has talked about the fact that human representations that underpin
    our creativity seem to exhibit a kind of extreme compositionality, where everything is built up from
    a few "[atoms of meaning](https://singjupost.com/francois-chollet-how-we-get-to-agi-transcript/)".
    Many seeming limitations of human working memory and information processing actually turn out to be
    strengths, because they force us to come up with these extremely efficient representations.


    Because LLMs are much better than humans in certain dimensions — like memorizing and retrieving stored
    patterns that might enable creativity — we''re not able to elicit these important real limitations
    in studies that try to compare human and LLM creativity.


    Furthermore, we humans can do something beautiful when we''re creatively thinking about a problem:
    we improve our representations related to the problem in real time — at inference time, if you will.
    That enables us to sleep on it, improve our representations, and come back the next day much more
    efficient at solving that particular problem. I''m sure we''ve all experienced this. But it is something
    that today''s AI systems are not able to do.


    I assumed naively that the continual learning people would be all over this, but when I started looking
    into that literature, it appears to me that that''s not the case. Continual learning is mostly focused
    on preventing catastrophic forgetting, as opposed to improving things over time. And furthermore,
    it is more focused on facts, skills, etc., as opposed to the quality of the underlying representations.


    So putting all this together, and considering the fact that creativity is only one of many barriers
    to humanlike AI, I do think there is still a very long way to go. That said, I want to express some
    humility here. These are all just hypotheses. I think we need empirical verification.


    Slide 35: Can we empirically test AI ability to do humanlike AI research?


    Speaking of empirical measurement, we have an ongoing project testing AI''s ability to do humanlike
    AI research.


    We give AI agents a budget of a few thousand dollars and a machine learning research problem — a problem
    that researchers have already worked on and written a paper about, but not yet made public on arXiv.
    This combines two properties: it gives us a team of human judges who''ve thought deeply about this
    problem for months and can therefore judge the AI output, but their thinking is not yet online, so
    it prevents AI cheating or contamination.


    Many others have done auto-research experiments, but we''re trying to do some things differently —
    in particular, picking somewhat open-ended problems, so that we can actually test the ability of AI
    agents at exercising judgment and creativity. We hope to release detailed findings very soon.


    Slide 36: We call this “open-world evaluation”


    This builds on a foundation that we call [open-world evaluation](https://arxiv.org/abs/2605.20520).
    We''ve completed one open-world evaluation of getting agents to [build and upload an app](https://cruxevals.com/crux-1)
    to the Apple App Store — that''s not about recursive self-improvement, but it tests a different kind
    of thing. We have assembled a great team, with people from many universities, a couple of companies,
    as well as the UK AI Security Institute.


    And by the way, we are [hiring](https://cruxevals.com/careers/senior-researcher-july-2026) a researcher
    to lead some of our future open-world evaluations. If you''re interested, go check out our website.


    Slide 37: Four dimensions of advanced AI


    Now let''s turn to the third of the four dimensions.


    Slide 38: Economically transformative AI


    Some people say that AGI is already here. Well, this is one way to interpret that claim, and I happen
    to agree with it.


    This might seem surprising given the skepticism of rapid economic impacts that I expressed in Part
    1. But this is actually not only consistent, but in fact a restatement of Part 1. My point there was
    that the barriers are downstream, and therefore model improvements won''t rapidly change the economy.
    But by the very same token, because the barriers are downstream, even without model improvements,
    those barriers are gradually going to get addressed. Yes, it might take a couple of decades, but we
    will definitely get there.


    Slide 39: What are the remaining barriers?


    There are many barriers: reliability (already discussed); integrating AI models into various existing
    systems; tacit knowledge from domains like medicine or law or various other professions that need
    to be made available to the models; regulation that often straight up prohibits today''s AI systems
    from being used in productive ways — in many cases there are good reasons for that regulation, but
    it will need to be modified in order to be able to enable adoption.


    The key point is that these are not things that will be solved in the lab. These are not things that
    are going to be addressed by the next model release on Tuesday. They will be addressed gradually,
    through gradual adoption, over a period of decades.


    From a geopolitics or strategic perspective, some people advocate a race to AGI, arguing that, similar
    to a Manhattan Project, the country that gets to some capability milestone first is the one that is
    going to reap economic rewards. I strongly disagree.


    There is no particular capability milestone that will unlock all of this economic potential. The economic
    potential is already there. It really depends on all these downstream actions that we take. It is
    not gated by capability.


    Slide 40: Four dimensions of advanced AI


    Okay. Now let me talk about the last of these dimensions, namely superintelligence.


    Slide 41: Three claims about superintelligence


    I gave the example of medical trials earlier. Another example: Do you think that we will get superintelligence
    that can predict the weather precisely a year into the future? We know that that is basically a mathematical
    impossibility because of the theory of chaos in nonlinear dynamical systems. Our position is that
    a surprising number of tasks are similar to weather prediction, in that there are inherent limits
    and we are pretty much already at those limits.


    Even for tasks where we''re not at that limit, the idea that there is going to be AI superintelligence
    that''s going to obviate humans relies on a fundamental misunderstanding of human intelligence. I
    claim that in the vast majority of tasks, our performance is not limited by our biology — it is rather
    limited by our learning and tools.


    If you imagine someone from the ancient past time traveling to our world, we''re superintelligent
    compared to that person. And it''s not because our biology is better, but because they don''t have
    the benefit of all the learning that we''ve been through and all the tools, especially digital tools,
    that we''re able to use in order to be productive at whatever it is that we do.


    And AI is one such tool. So what that means in our framework is that improvements in AI are actually
    improving human intelligence, not just AI intelligence. So we have a race between the performance
    of AI-augmented humans on the one hand and the performance of AI systems acting alone on the other
    hand. I think we can ensure that we are the superintelligences of the future and we win that race,
    as opposed to allowing AI systems to act alone in ways that would threaten our future and control.


    Many people are pessimistic about this. They bring up thought experiments such as AI running and owning
    companies in the future. Their view is that if the AI system is not aligned, terrible things might
    happen — the AI could turn into a [paperclip maximizer](https://en.wikipedia.org/wiki/Instrumental_convergence#Paperclip_maximizer)
    or do other catastrophic stuff. Our perspective is very different. If you''re imagining a future where
    AI is actually owning and running companies and hiring and firing people, that''s already dystopian.
    It doesn''t matter if that AI is aligned or not. The consequences for human dignity. democratic governance,
    etc. are already catastrophic.


    So if your view on safety is to treat this as an inevitable future and just to hope for "alignment"
    to solve that problem — pardon me for being a little bit blunt here — it feels to me that you''re
    against safety, not for safety. I think it will take a lot of hard work to ensure that we don''t irresponsibly
    deploy AI systems in this kind of fashion. But I do think we can get there. And that''s the reason
    I''ve spent a lot of my career advising policymakers. We''re going to need policy and we''re going
    to need politics, and it''s going to be hard, but let''s not give up that fight before it even starts.


    Slide 42: Putting it all together: Four dimensions of advanced AI


    For example, RSI is achievable in the lab, but it won''t immediately put people out of work. On the
    other hand, economically transformative AI is going to happen, but it''s not because of the next model
    release — it''s because of things that will gradually happen over the next couple of decades.


    Connecting back to the title of this talk: there''s no world in which something that an AI company
    will decide to do in a lab will put us all out of work. Yes, there are risks to be worried about.
    Yes, things are going to change. But we have agency over how AI gets deployed, and that process will
    unfold over decades. Again, this is not guaranteed, but this is the future that I want to work towards,
    and this is the reason why I''m cautiously optimistic.


    Slide 43: Outline of this talk


    Let me take the last fifteen minutes to talk about the flip side. I do think a lot of things are going
    to change. What are some of them?'
  edited: 'Four different claims about advanced AI


    I take recursive self-improvement seriously but reject the tendency to collapse several distinct ideas
    into one inevitable sequence. I separate four dimensions: recursive self-improvement,
    humanlike general intelligence, economically transformative AI, and superintelligence. Progress on
    one does not automatically establish the others.


    Recursive self-improvement is difficult to define and verify. A model producing a successor is not
    enough; developers still design scaffolding, curate data, run evaluations, and decide whether a result
    is an improvement. AI is strongest where outcomes are cheaply verifiable, while creative research
    requires new representations, judgment, and open-ended problem selection. A system can optimize benchmarked
    engineering without becoming a fully autonomous scientific community.


    This motivates open-world evaluation: give agents budgets, research problems, and realistic freedom,
    then evaluate the quality and novelty of their work rather than only their ability to reach a preselected
    answer. I treat creativity as one of several barriers to humanlike AI, not as a mystical
    human monopoly. LLMs possess unusual strengths, but human creativity also relies on representations,
    learning from sparse experience, and searching for the right problem formulation.


    Economically transformative AI can exist without humanlike intelligence. Current systems are already
    affecting research, software, and organizational decisions. But realizing their full economic potential
    still requires reliable systems, new applications, complementary infrastructure, legal and policy
    changes, worker training, and institutional redesign. There is no single capability milestone that
    unlocks all of those changes at once.


    Claims about superintelligence also need care. In many domains the binding limit is not intelligence:
    medical discovery may wait on trials, astronomy on instruments, and engineering on physical construction.
    Modern humans already appear superintelligent relative to the ancient world mainly because we inherit
    accumulated tools, institutions, and knowledge. AI may enlarge that collective capability, but an
    isolated system is not the same thing as an autonomous economy that can lawfully own resources, hire
    people, and act without human authorization.'
