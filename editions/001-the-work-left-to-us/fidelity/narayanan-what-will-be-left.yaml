- id: synthesis-1
  kind: p
  status: modified
  source: 'Slide 1: What will be left for us to work on? Arvind Narayanan Professor of Computer Science
    Co-author of AI as Normal Technology


    Now is a time of great excitement in AI, but it''s also a time of great anxiety in the AI community.
    I want to address that anxiety head on. How do we prepare for a future where AI will become capable
    of doing more and more of the work that we do today?


    Slide 2: Where I’m coming from


    I lead a team at Princeton University trying to advance the [science of AI agent evaluation](https://sage.cs.princeton.edu/).
    We try to go beyond the usual claims of “Look, capability is going up on benchmarks!” Those claims
    tend to be misinterpreted by the broader public as implying that agents are soon about to take all
    our jobs.


    Maybe that will happen. But in our work we try to understand the factors beyond capability that matter
    for real-world deployment, and bring that understanding into evaluations.


    The work that I''m better known for is the essay I co-authored with Sayash Kapoor called [AI as Normal
    Technology](https://knightcolumbia.org/content/ai-as-normal-technology). It''s a way to think about
    the medium-term future of AI and how to adapt to it — and in turn how to adapt it to the needs of
    society and the economy.


    Slide 3: Slide 3


    So we''ve been going around writing these essays about how lawyers should adapt, or maybe how journalists
    should adapt. But perhaps ironically, the question of how to adapt has been hitting our community
    first. Whether it''s software engineering or AI research itself, AI capabilities in these areas are
    of course advancing very rapidly.


    Our response to this moment matters beyond this community. The whole world is watching. If we simply
    roll over and accept that a lot of our work will be done by AI in the future, instead of setting clear
    boundaries, I think it will lead to an even stronger political backlash against AI than what we are
    seeing today. So I think this question is not just for us but it''s for the whole world.


    Slide 4: A battle of two narratives


    From the beginning of AI, historically there have been these two battling narratives. In the past,
    the distinction was academic and philosophical, but now it has become an acutely practical question.
    Each one of us has to decide which camp we''re in, or where on this spectrum we''re in, because the
    practical consequences of believing in one versus the other are very, very different.


    If you think this is a technology which in a few years is going to be able to replace everything we
    do today, then perhaps the correct response is to build wealth as quickly as possible before our skills
    become irrelevant. And this is the path that many have chosen in Silicon Valley. You may have heard
    of the "[permanent underclass](https://www.nytimes.com/2026/04/30/opinion/ai-labor-work-force-silicon-valley.html)"
    meme.


    On the other hand, if you believe, as I do, that this is a technology that will greatly amplify our
    potential, then now is the best time to build skills — especially the skills that are going to be
    complementary to what AI is doing and is going to be able to do — as well as to build all the things
    around it, such as agency and taste and judgment.


    If you choose the first path, and it turns out that AI actually ends up being an amplifying technology
    as opposed to a replacing technology, then I would argue that over the next few years you''ve perhaps
    lost the best time in history to build these skills that will give us superpowers. That''s why we
    all need to think about this question, even if we won''t all land in the same place.


    Slide 5: What is “AI as Normal Technology”?


    *AI as Normal Technology* is the intellectual framework for my talk today. When we say AI is normal,
    we don''t mean that it''s just like a hammer or a toothbrush, some kind of mundane technology.


    We acknowledge prominently in the essay that this is a transformative technology on the scale of the
    industrial revolution. We''re not AI skeptics.


    This is not a slogan. It''s a framework — sort of a causal model how AI capabilities impact the economy
    and society. It''s a 15,000-word essay and we''re turning it into a book. And I mention that because
    people often hear the word normal and they assume they know what we mean, but that leads to misunderstandings.


    Slide 6: Outline of this talk


    First, I''ll argue that this framework is correct and useful as a way to think about AI''s impacts,
    unless and until there is some future discontinuity — such as through recursive self-improvement —
    that leads to future impacts looking very different from past impacts.


    Second, I will talk about why, even though we should take recursive self-improvement seriously, I''m
    not particularly losing sleep over it.


    Third and finally, I want to be clear that I''m not saying that jobs of the future will be just like
    jobs of the present. A lot of adaptation will be needed. So I want to give some preliminary thinking
    on how I think our roles are going to change and how we can best adapt to the changes.


    Slide 8: Applying diffusion-of-innovations theory to AI


    Powerful technologies of the past, like electricity, have been thoroughly studied, and we have good
    frameworks to understand how technological progress leads to economic impacts.


    **Invention:** discovering the principles of electromagnetism, AC versus DC, etc.


    **Innovation:** People don''t use "electricity" directly. We use electrical appliances. Those had
    to be invented, so that is a kind of downstream innovation — that''s the second phase of the framework.


    **Diffusion:** This refers to the gradual process by which people start adopting innovations.


    In our essay we apply this framework to AI and flesh it out into a four-part framework.


    Slide 9: Applying diffusion-of-innovations theory to AI


    Here''s the basic picture, illustrated with software engineering as an example.

    **Methods/capabilities:** Models are rapidly improving.

    **Products/applications:** We don''t use LLMs directly. The reason they''ve been so influential in
    all of our work is because of coding agents. These are products that take those latent capabilities
    and turn them into something useful and usable for workers.

    **Early adoption:** At first people were mostly trying vibe coding, and now we know that that''s not
    really the best way to develop production software — so now we have more sophisticated ways of doing
    agentic engineering.

    **Adaptation:** (or structural transformation) — the fourth and slowest phase. Much of my talk today
    is going to be about that. I claim that this stage takes decades. It has not really started yet, even
    in a field like software engineering, which is a relative early adopter of coding agents.


    We don''t know what the adaptation phase will look like — we can only speculate. Permit me to speculate
    for a minute. If it''s going to be the case that coding agents are going to be able to create ten-million-line
    code bases in the future that are not full of bugs and security vulnerabilities, then it won''t make
    a lot of sense for us to create one piece of software that billions of people should use. It''ll make
    a lot more sense for software to be tailored to the needs of each individual or team. And that''s
    what I mean by extreme personalization.


    It''s not merely a technological change — that''s also a change for the industry. For instance: do
    we even need software companies anymore? Maybe software development will massively shift in-house,
    into the companies and teams that are actually using the software. Again, this is speculation, but
    the point is that it is this kind of organizational change, human change — that''s very slow, that
    takes decades — that will allow us to take advantage of the full potential of AI, whether it''s in
    software engineering or in any other field. So that''s one of the central insights of the essay. When
    we look at past technologies, this kind of change tends to be very slow.


    Slide 10: What does transformation look like? Historical analogy: electrification of factories


    Before electricity, factories used to look like the picture on the left. A massive steam engine generated
    power and it was moved throughout the factory by mechanical gears and belts. So when electricity came
    along, factory owners tried to replace those steam boilers with electric generators. They thought
    it would be much more efficient. But this idea of a drop-in replacement did not work. We keep hearing
    that term in the context of AI agents today — that they will be drop-in replacements for human workers.
    That did not work in the case of electricity.


    What actually worked, and what took 40 years to develop, is to recognize that electricity is a very
    different technology. It''s portable, so you can move the power to wherever you need it. That lets
    you reorganize the entire layout of the factory around the logic of the assembly line. And that required
    changing the way that workers are trained, hired, and fired, new labor laws, and so forth. So that''s
    the kind of organizational adaptation that it took in order to reap the benefits of electricity in
    factories.


    Our claim is that this is the kind of process that we will go through for AI. A couple of decades
    from now, we will have fundamentally reorganized work. We don''t know what that''s going to look like,
    and that is the challenge in front of all of us. And that''s not just a job for the AI companies to
    do, much like it wasn''t the job of the electric utility to figure out how factories should be reorganized.
    In our view, this is the slowest of the four stages through which AI leads to economic impacts. Today,
    this process has not really gotten started.


    Slide 11: Data from Anthropic (March 2026)


    Why is there a huge gap between what people in various occupations could be using AI for and what
    they''re actually using it for? One reason could be that people are slow to adopt technology, and
    that''s certainly part of our framework.


    But we wondered if maybe the people who are deploying AI and are not having much success at it know
    something about the practical limitations of AI that the AI industry doesn''t. Let''s have a bit more
    humility about the relationship between capabilities and deployment.


    Slide 12: The #1 concern about AI


    Given that the #1 concern people cite is reliability, we wanted to try to measure whether reliability,
    distinct from capability, is a barrier to the practical usefulness of AI agents.


    Slide 13: Our reliability metric is a composite of:


    We looked at 10-12 reliability metrics and clustered them into four dimensions.

    **Consistency:** Suppose we hear that an AI agent has a 70% accuracy. Does this mean it works on 70%
    of the tasks, but on the ones that it does, it does so every time? That''s great for deployment —
    you can deploy it on that subset of the tasks. Or does it mean that on any given task it might unpredictably
    fail with a 30% probability? That''s pretty useless from a deployment perspective. Perhaps shockingly,
    none of the agent benchmarks that we looked into make a distinction between these two. Both of these
    are represented as 70% accuracy.

    **Robustness:** We looked at robustness: what happens when the environment changes a little bit?

    **Calibration:** Can the agent look back at its transcript and tell if it performed the task correctly?

    **Operational safety:** When it does fail, is it recoverable, or is it something like deleting the
    production database?


    For a human worker, if we think of someone as being competent at a job, it''s all of these things,
    not just accuracy. But it turns out we were measuring agents only on accuracy.


    Slide 14: AI agents: the capability-reliability gap


    We measured capability and reliability using two complementary benchmarks, for models from these 3
    frontier AI companies that were released over the last 24 months or so.


    This is a period during which accuracy or capability shot up dramatically (left).


    But reliability (right) only increased by five or ten percentage points.


    Slide 15: Key implication


    There are a bunch of implications but let me highlight one. Right now the industry is not treating
    automation and collaboration agents differently. If you run an agent in headless mode, I guess that
    becomes an automation agent. That is not a good way to look at it, because properties like reliability
    that are very important for automation agents can actually be a hindrance for a collaboration agent
    that you might be using to improve your creative writing or something like that. For that kind of
    agent, you *don''t* want it to behave like a robot that does the same thing every time. You want it
    to be creative and explore different possibilities and be unpredictable.


    Scaffolds and even the post-training of models should be different based on whether it is supposed
    to be driving a collaboration agent or an automation agent.


    Slide 16: Prediction: collaboration agents will continue to be more successful than automation agents.


    My hope is that reliability will continue to improve and automation will become easier over time.
    But for now I think collaboration agents will continue to be much more successful. Many companies
    that hastily rushed to automate business processes using agents are recognizing the limits and costs,
    and even legal liabilities — like when an agent deletes production data.


    For the time being, you can have only two out of these three properties in agents: **general-purpose**
    (a language model based agent that can be instructed to do different tasks rather than purpose-built
    for a task like traditional software); deployed in **high-stakes** scenarios, and **automated**.


    This is one of the reasons that I think that for now, AI remains much more of a collaboration technology
    than a technology that automates workers away.


    Slide 17: Why labor impacts are gradual — And not necessarily negative


    Let''s take software engineering as a case study. It''s a good leading indicator because coding agents
    have been particularly rapidly adopted.


    Slide 18: Fact check: Is AI replacing software engineers?


    You might think: okay, we can''t completely automate away software engineering. But if agents make
    software engineers ten times more productive, then we need ten times fewer software engineers. Isn''t
    that an obvious consequence?


    Well, that is completely contradicted by the data. We looked at this in a follow-up essay. In every
    case we looked at, the company was under financial pressure, and it turns out to be more convenient
    to blame AI for the layoffs instead.


    Slide 19: Writing code was never the bottleneck


    Why is AI not replacing software engineers so far? We''ve known for a while — this is a paper from
    2019 — that writing code is not really the bottleneck.


    Slide 20: Slide 20


    Over the last year, as software engineers started adopting coding agents and started to recognize
    that it doesn''t seem to be cutting down on the amount of their work, there have been many blog posts
    rediscovering the fact that writing code is not a bottleneck. Here is a small sample.


    So what actually is the bottleneck?


    Slide 21: The decide-execute-deliver sandwich


    This framework is our answer to the question.


    **The decide layer:** understanding customer requirements, developing the specification, planning,
    etc. That is not getting compressed by AI.


    **The execute layer:** the actual coding and debugging. This is getting compressed, but it was only
    maybe one-third of the work to begin with.


    **The deliver layer:** Understanding your code deeply enough to be accountable for what you release;
    carrying out integration into customer systems, maintenance, testing, etc. This layer is not getting
    compressed either.


    In fact, the first and third layers are arguably expanding as AI compresses the middle layer — and
    I''ll come back to that point.


    Slide 22: A useful metaphor: A crane operator


    I think it is already the case in software engineering, and will increasingly be the case in many
    professions, that we can think of knowledge workers as similar to a crane operator or a forklift operator.
    The machine greatly amplifies the human potential to do physical work — it''s doing all the heavy
    lifting, but the person still remains in control. And I think this is what is happening with cognitive
    work. Machines are going to increasingly do the cognitive heavy lifting, but the person still remains
    in control.


    **The entire job gets reconceptualized** as being about operating the machine, understanding the machine,
    and controlling the machine, as opposed to doing the cognitive work ourselves.


    Slide 23: Change is constant in software engineering


    All this might seem like a dramatic change, but in a sense it is only a continuation of what has been
    happening over and over and over in software engineering. Starting from the days of machine code,
    we''ve had many waves of technology, each of which gives us nearly an order of magnitude increase
    in productivity. And far from decreasing the demand for software engineers, during the time that we''ve
    climbed up this ladder, the amount of software engineering employment has increased by a factor of
    something like 10,000. And that''s simply because the amount of code that there is to write has gone
    up by orders and orders of magnitude.


    Slide 24: The “lump of labor” fallacy


    Economists have found this repeatedly. You might have heard the term Jevons'' paradox; I like the
    term "lump-of-labor fallacy".


    ATMs made it economically feasible for banks to open lots of regional branches. And those branches
    still needed human tellers to handle the things ATMs couldn''t. So, paradoxically, employment actually
    grew.


    Slide 25: Other notable examples


    Geoff Hinton made the famous prediction a decade ago that radiologists would be basically extinct
    in five years. But it turns out radiology employment has in fact grown. And it''s not because radiologists
    are rejecting AI. They are actually enthusiastically adopting it. One reason for job growth is that
    when a task gets faster and cheaper to perform, there''s more demand for it.


    We''ve written a paper looking at how lawyers should adapt. There''s a lot in there, but one simple
    point is that AI has made it a lot easier to file lawsuits. And this means more work for lawyers.
    We might be unhappy about this if we don''t like living in a litigious society, but from the point
    of view of employment for lawyers, this is great news.


    Translation is a more extreme example which kind of blows my mind. AI was almost at human parity nearly
    a decade ago. Yet the employment of human translators has remained more or less stable, and is projected
    to remain stable over the next decade. There are many reasons for that, but one reason is that there''s
    really no ceiling to the amount of things you can translate and the number of different languages
    you can translate them into.


    Slide 26: Outline of this talk'
  edited: 'Amplification or replacement


    AI inspires both excitement and anxiety because its systems can do more of the work we do today. I
    want to address that anxiety head on. How should we prepare for a future where AI becomes capable of
    doing more and more of our work? Our response depends on which of two narratives we accept. If AI will
    soon replace nearly everything humans do, the rational move may be to accumulate wealth before existing
    skills lose their value. If AI will instead amplify human potential, this is an unusually valuable
    time to build the skills, agency, taste, and judgment that complement it. Choosing the replacement
    story too early risks wasting the best period in which to learn how to use a powerful new tool.


    AI as Normal Technology is the intellectual framework for this argument. "Normal" does not mean mundane or unimportant:
    AI may be as transformative as the industrial revolution. It means that, absent a genuine discontinuity,
    its economic effects still arrive through recognizable social processes rather than directly from
    a capability benchmark.


    The framework separates four stages. Methods and capabilities improve; products turn those capabilities
    into usable applications; people and organizations adopt those products; and, slowest of all, institutions
    and work adapt around them. Coding agents illustrate the sequence. Better models became usable products,
    developers learned practices more disciplined than casual "vibe coding," and organizations are only
    beginning to ask what software work should become. The last stage may take decades.


    Electrification offers the historical analogy. Replacing a steam engine with an electric motor did
    not transform a factory. The larger gains came when factories were reorganized around distributed
    power and assembly lines, which also changed training, management, and labor law. The electric utility
    could not decide how every factory should operate. Likewise, AI companies cannot perform the organizational
    adaptation needed in every profession.


    Capability is not deployment


    The gap between a model''s benchmark performance and its practical usefulness is central. My research
    group studies reliability through consistency, robustness, calibration, and operational safety.
    A system advertised as 70 percent accurate may reliably solve a known 70 percent of tasks, or it may
    unpredictably fail 30 percent of the time on every task. Those are radically different deployment
    prospects, yet ordinary accuracy scores blur them.


    Across recent frontier models, capability rose much faster than reliability. This matters because
    automation agents and collaboration agents need different properties. An automated agent operating
    in a high-stakes environment must behave consistently, recognize failure, and fail safely. A collaborator
    used for writing or exploration may benefit from variation and surprise. Treating a headless version
    of the same agent as an automation system ignores that distinction.


    For now, general purpose, high stakes, and fully automated form an unstable triangle:
    systems can usually offer only two. Collaboration is therefore advancing faster than dependable automation.
    Model capability alone does not remove integration costs, legal liability, recovery procedures, or
    the need for human control.


    Why faster work does not imply fewer workers


    Software engineering is an early test. Even if agents greatly accelerate coding, writing code was
    never the whole job. I divide the work into a decide-execute-deliver sandwich. Understanding
    requirements, choosing a specification, and planning occupy the decide layer. Coding and debugging
    form the execute layer. Integration, testing, maintenance, and accountability form the deliver layer.
    AI compresses the middle, but the outer layers remain and may expand as more code becomes possible.


    The worker increasingly resembles a crane operator: the machine performs the heavy lifting, while
    the person directs it, understands its limits, and remains responsible for the result. The job is
    reconceived around operating and controlling the machine, not simply around manually performing each
    cognitive step.


    History gives reasons not to infer employment from task productivity. Successive programming abstractions
    made individual programmers dramatically more productive while demand for software grew by orders
    of magnitude. ATMs made branches cheaper to operate and, for a period, increased demand for tellers
    who handled the remaining work. Radiology employment grew after predictions that image recognition
    would eliminate the profession. Translation work persisted even after machine translation approached
    human parity because lower costs expanded the volume and range of material worth translating. None
    of these examples guarantees benign outcomes, but they show why "ten times more productive" does not
    mechanically mean "ten times fewer workers."'
