  source: 'Slide 44: General observation: Purely technical skills get devalued


    Technical skills tend to be verifiable tasks, and AI will continue to get better at them.


    Over twenty years ago, there started to be a stark difference in the labor demand for programming
    jobs versus software engineering jobs. Programming jobs are conceived narrowly around the technical
    skills of coding and debugging. Software engineering jobs are responsible for all three layers of
    the decide, execute, deliver sandwich that I talked about — figuring out what even needs to be built,
    understanding customers, that sort of thing. It requires domain knowledge, judgment, and more.


    I predict that this will happen in more and more fields over time.


    Slide 45: Effort shifts from building to evaluation


    A recurring pattern I''ve observed — effort shifts from building systems to evaluating systems. As
    I''ve mentioned, I lead a team working on AI agent evaluation. LLMs and agents are general purpose.
    So each time capability goes up, it creates demand for evaluation in a legal setting or a journalistic
    setting or whatever other setting, and that''s not work that is scalable.


    Slide 46: AI agent evaluation has become a distinct discipline


    Not only is AI agent evaluation resistant to automation — it has become sufficiently specialized that
    the set of people and teams working on evaluation is starting to diverge from the set of people and
    teams building and pushing the state of the art in AI agents. This new community is developing a new
    set of best practices around what it means to rigorously evaluate agents, and we have a forthcoming
    paper that is going to look at that in some detail.


    Slide 47: Evaluation is how we “steer the ship”


    Here''s an a metaphor to help explain the shift I see in our community. Imagine that in the past most
    boats were rowboats, and the work of the humans was in physically moving the boat. There was no separate
    specialized role around steering the boat: when you''re rowing the boat, you''re also figuring out
    which way to row the boat.


    But what happened when the physical work of moving of the ship could be delegated to the engines?
    The human jobs didn''t go away. In fact, they became much more specialized. Modern ships have very
    complicated control panels, and they might have dozens of different specialized roles that are focused
    on where the ship should go and how it should get there.


    I would argue that we''re seeing a similar shift in AI/ML. In the past, most of our work was on building
    — we didn''t need separate roles for evaluation. That has changed now. We''re still in the early stages
    of this process, but I think over time more and more of the building, because it''s a verifiable task,
    will be able to be done by AI, whereas it''s the evaluation — figuring out where we should go as a
    community, figuring out what are the desirable properties in AI systems — that is very resistant to
    automation. So a greater fraction of the community''s attention will have to focus on evaluation over
    time, compared to where it is today.


    In rowing, physical strength was valorized, and today we might be sad about the fact that sailors
    don''t need to be strong and it''s all a bunch of nerds. Similarly, today in the AI community, there''s
    still great value in deep technical understanding of models and systems, and that is considered the
    coolest thing; the most important thing; that''s the thing that commands a lot of value. But I think
    in the future that will become less important than exercising judgment and all of these fuzzy things
    that have a lower status in the AI community today. That''s a mental shift that we''re maybe not quite
    prepared for. Many of us will be sad about it, and that''s okay.


    Slide 48: How much of conferences such as ICML should be about evaluation?


    One practical consequence of this shift: consider a conference like this one. What fraction of the
    conference should be dedicated to evaluation papers?


    I don''t know, but I think maybe a lot more than it is today. Maybe around half — I''m just throwing
    a number out there — which is orders of magnitude more than it is today. At the very least we need
    a dedicated track. We don''t have a dedicated track. NeurIPS does have one, and it has been growing
    in popularity over time, and I think that is a good thing.


    And I would go further and argue that thoughtful evaluation of AI systems is a form of alignment.
    It''s not aligning the AI system itself, but it''s aligning the community as a whole — thinking about
    where we''re currently going and where we want to go, and trying to align those two to each other.
    And without enough emphasis on evaluation, my worry is that the community — going back to the ship
    metaphor — will behave like a rudderless ship: very powerful, but where we don''t collectively have
    control over what kind of AI we want to develop.


    Slide 49: How we evaluate research itself must change


    I had a small role in this cool position paper. A one-sentence version of the argument: we need to
    move beyond benchmarks being the be-all and end-all of what AI research is considered valuable.


    What benchmarks give us is efficiency. We don''t have to spend years peer-reviewing papers — if it
    beats the state of the art, we know it''s probably a good paper. But unfortunately, it has narrowed
    the collective vision of the community. We''re searching under streetlights — we are searching the
    kinds of things that are easy to search in a benchmark-driven evaluation regime. We need to move beyond
    that. That means evaluating how good a paper is will become much more costly. Sadly, that is a cost
    that we will have to pay. Right now the community is trying to rush in the opposite direction.


    Slide 50: Automating peer review is a trap


    There is a big temptation towards automating peer review. And with all due respect, I think this is
    a trap. If we automate peer review, we essentially give up control over the direction of progress
    to AI systems themselves. That seems like a fundamental misallocation of effort.


    If we automate the mundane parts, human time can be freed up to think more deeply about the parts
    that require judgment.


    Slide 51: How will AI change science?


    Generalizing from AI research to scientific research as a whole, we have an essay that argues that
    visions of "automating science" rely on a fundamental misunderstanding — as if the point of science
    is mere problem solving, and that if we can use AI to get directly from the problem to the solution,
    we will have automated and accelerated science.


    In our view, human understanding is not some friction to be automated away. It is rather essential.
    It is central to the very purposes behind why we do science. And if we lose human understanding, we
    lose all of these things that flow from it.


    So my prediction is that if we are going to have increased use of AI agents in science, there will
    be new tools and new roles that are specialized towards looking at those AI solutions and backing
    out the human understanding from those solutions. Because it is essential to preserve human understanding.


    Slide 52: What about companies? Evals as the new IP


    Many people in the corporate world are saying that evals are the new IP. Without going into the details,
    it is very much the same phenomenon playing out once again — effort shifting from purely building
    to a mix of building and evaluation of systems.


    *(Note: in [this post](https://substack.com/@aisnakeoil/note/c-287365888) I explain the idea of cross-functional
    eval teams to keep companies from fooling themselves.)*


    Slide 53: How effort shifts from building to evaluation


    If there''s only one thing you take away from this talk, it should probably be this slide. What I''ve
    shown throughout the talk is that in many different areas, because the verifiable tasks can be handled
    by AI, some or much of the effort shifts from building to evaluation.


    Effort shifts from "rowing the boat" to "steering the ship, navigating the ship, and figuring out
    where we even want to go".


    I think this is a powerful metaphor that will allow us to predict how human roles will shift over
    the next decade or two.


    Slide 54: Personal reflections on adapting to AI


    In the last few minutes, let me give you some personal reflections on how I''ve been struggling through
    this challenge — the fact that AI capabilities are rapidly improving — in my own research workflows,
    as I''m sure many of you are. I think everyone should choose their own path, but hopefully there are
    some interesting ideas here for you to consider.


    By floor I mean what AI can do on its own. By ceiling I mean what AI allows us to do by augmenting
    our capabilities — the ability to take on new and ambitious projects that were not possible before
    AI. But the ceiling is not going up automatically. It is only if we work on pushing the ceiling up.


    I find that I''m spending something like 10 hours per week just learning and experimenting with new
    workflows, as well as learning new topics. So one way to think about it is that AI enables big productivity
    improvements, and I''ve been trying to take that time saved and "reinvest" it into long-term growth
    and picking up new and complementary skills.


    I''ve learned that if I don''t feel exhausted at the end of the day, I''ve done something wrong. I''ve
    offloaded too much to AI. I''ve sacrificed too much of my long-term growth in the pursuit of short-term
    productivity.


    Growth and productivity are two legs of a three-legged stool that we need to learn how to balance.
    And the third leg of that stool is staying in control.


    Here are two heuristics that I''ve tried to use in order to do that. The first is resisting the black-box
    temptation. Companies want us to use agents as black boxes — just prompt it and it will go off and
    do its thing. I think that''s a [trap](https://substack.com/@aisnakeoil/note/c-259452894). I think
    that''s very dangerous, and it will lead us to gradually give up control over time.


    Second, and related, is what I call the [dependence spiral](https://substack.com/@aisnakeoil/note/c-274974582).
    It''s very tempting to use AI for tasks that I am myself not yet an expert at, because learning new
    things is of course very hard. But that leads to my losing whatever little skills I have in that task.
    It''s much better in the long run if I first put in the time to master the task myself before I use
    AI to augment my productivity.


    Slide 55: The vision: co-superintelligence


    None of this is easy, but if we get this right, the vision is tantalizing and empowering.


    Computers have often been called bicycles for the mind. I think AI can be more than that. I think
    AI can be a crane for the mind, if you will indulge my metaphor, in the sense that it can amplify
    our potential to previously unimaginable heights. Getting there can seem daunting. It has an incredible
    learning curve. I feel like I''m on a treadmill all the time, but I''m very excited about it. I think
    it''s a fun challenge, and I think it''s worth fighting this fight. Compared to five years ago, in
    a way, I feel ... maybe superintelligent is not the right word, but I feel like I have superpowers,
    given the extent to which AI allows me to take on new ambitious things that were not possible before,
    and push myself harder than was possible before.


    And I think we can ensure that this remains the case even as AI capabilities advance, for the foreseeable
    future. It might be that in some distant future this becomes impossible to do, but it is very premature
    to give up the fight now. I certainly plan to continue this fight, and I hope to work towards this
    vision of co-superintelligence, and I hope you will join me. That is my closing thought.'
  edited: 'The work shifts toward evaluation


    The practical conclusion is not that future jobs will look like present jobs. Purely technical, readily
    verifiable skills are likely to lose value. Effort shifts from producing an artifact toward deciding
    what should be built, evaluating what was produced, and taking responsibility for its consequences.


    AI evaluation is already becoming a discipline of its own. If AI performs more of the rowing, we must
    spend more effort steering the ship. In research, that means
    deciding which questions matter, whether evidence supports a claim, and whether a system behaves safely
    outside a benchmark. Automating peer review is a trap if it accelerates scoring while eroding the
    human understanding needed to judge significance and originality. The mundane parts can be automated
    only to create more room for serious judgment, not to eliminate it.


    The same shift appears in companies, where evaluations increasingly become proprietary knowledge.
    When model access is widely available, advantage comes from knowing what successful performance means
    in a particular domain and from maintaining the tests, data, and operational controls that measure
    it.


    My personal rule is to distinguish AI''s floor from its ceiling. The floor is what it can
    do alone; the ceiling is what a person can do with it. Competing against the floor encourages black-box
    use and eventual displacement. Raising the ceiling requires learning, experimentation, verification,
    and enough understanding to remain accountable. The aim is not a passive hope that machines align
    themselves, but co-superintelligence: people and AI systems increasing what individuals and institutions
    can accomplish while humans continue to choose the ends and govern the means.'
