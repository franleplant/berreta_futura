schema_version: 2
direction:
  name: Story-Led Boy and Robot, Gentle Print Color
  status: prototype
  scope: edition-004-only
  visual_language: >-
    Original family-friendly children's science-comedy manga with the warmth,
    economy, and visual clarity of late-20th-century magazine work. Use simple
    confident charcoal-black contours, rounded shapes, large readable
    expressions, economical watercolor washes, minimal hatching, restrained
    halftone, and one playful visual idea per illustration. Keep slight pigment
    variation, paper tooth, and quiet print grain visible. The recurring cast is
    exactly one curious school-age boy and one compact non-animal helper robot.
    Preserve their defining shapes and colors across the edition while changing
    pose, action, props, and setting to serve each article. Use broad medium and
    production cues only. Never reproduce a franchise character, costume, face,
    silhouette, composition, or signature gadget.
  color_strategy: >-
    Favor gentle historical magazine-color production over bright digital color.
    Keep saturation low to medium, values mostly in the middle range, and
    contrast sufficient for A5 reproduction. The background is chosen for each
    scene and may be warm off-white, pale blue-gray, a cool pale tint, a simple
    room, an outdoor setting, or another article-relevant environment. It must
    read as part of the scene, not as one publication-wide paper color. Warm
    ochre and yellow are local accents only. Never impose a yellow, beige,
    parchment, or bright cyan field across the image.
  palette:
    softened_cyan: "#6EA9B4"
    softened_cobalt: "#356F9E"
    brick_coral: "#C5654F"
    warm_ochre: "#BE9654"
    muted_green: "#789B73"
    dusty_lavender: "#8877A0"
    warm_off_white: "#F1E8D8"
    pale_blue_gray: "#D6E2E2"
    charcoal_ink: "#293238"
  palette_notes:
  - Swatches are working targets, not mandatory flat fills.
  - Watercolor variation may move hue and value slightly around each target.
  - Do not use every swatch in every illustration.
  - Prefer one scene-led dominant tint, two supporting colors, and one small warm accent.
  - Preserve legibility with charcoal contours and warm off-white breathing room.
  surface:
    medium: economical flat watercolor washes under ink
    paper: subtle fibrous tooth, visible but not distressed
    print: fine restrained grain with a few imperfect color-edge overlaps
    avoid: heavy noise, sepia aging, dirty paper, faux damage, or glossy digital highlights
  research_basis:
  - source: Shogakukan eComic Store
    url: https://e-comi.shogakukan.co.jp/books/091495740000d0000000
    note: >-
      The Color Works description foregrounds faithful reproduction of color
      created for school magazines in the 1970s and 1980s.
  - source: Kawasaki City Fujiko F Fujio Museum official blog
    url: https://fujiko-museum.com/blog/?p=37971/
    note: >-
      The May 9, 2026 post explicitly calls attention to watercolor and gentle
      color in a 1971 original.
  - source: Doraemon Channel
    url: https://dora-world.com/contents/3744
    note: >-
      The 50th-anniversary booklet curates 64 pages of color illustrations made
      for six school magazines, including covers, articles, and supplements.
  research_guardrail: >-
    These official sources inform color production qualities only. Do not use
    their characters, compositions, costumes, faces, silhouettes, or gadgets as
    image inputs or things to reproduce.
  character_references:
  - editions/004-unreleased/prototypes/assets/mcp-opener-boy-robot-color-v2.png
  - editions/004-unreleased/prototypes/assets/factory-systems-boy-robot-color-v1.png
  constraints:
  - Entirely wordless editorial storytelling
  - Exactly one recurring boy and one recurring robot in every authored illustration
  - Boy has black tousled hair, round glasses, a blue-green top, shorts, and brick-red sneakers
  - Robot is waist-high to the boy with an off-white rounded rectangular body, softened cobalt side panels, black face screen, two friendly curved white eyes, one short antenna, mitten-like hands, and a coral tool pouch
  - One clear funny situation or visual proposition tied to the article
  - Strong simple silhouettes and expressions that remain legible at A5 size
  - Essential article-tail action remains inside the safe horizontal crop
  - Multi-panel structure is used only when an ordered sequence is the article's central idea
  - Background color and setting are selected from the article subject, not inherited from a publication default
  - Use at least three distinct non-neutral colors unless the article gives a clear reason for restraint
  - Print-friendly contrast with simple charcoal contours, minimal hatching, and restrained halftone
  - Slight pigment variation, subtle paper tooth, and quiet print grain survive at final size
  avoid:
  - Direct copies of Doraemon, Nobita, or any recognizable franchise character
  - Blue robotic cats, cat ears, whiskers, bell collars, round cat bodies, belly pockets, copied costumes, copied faces, or signature franchise gadgets
  - Uniform yellow, mustard, beige, sepia, cream-paper, parchment, or aged-paper backgrounds
  - Electric cyan, neon color, high-chroma primary fills, or a bright blue full-field background
  - Extra humans, extra robots, robot-faced appliances, or background mascots that weaken cast continuity
  - Dense technical realism, crowded machinery, steampunk clutter, or excessive crosshatching
  - Modern glossy anime rendering, painterly concept art, photorealism, or generic corporate vector art
  - Decorative pseudo-writing, captions, labels, interface text, logos, speech balloons, or watermarks
prototype_variants:
- id: mcp-opener-boy-robot-muted-watercolor-v1
  path: editions/004-unreleased/prototypes/assets/mcp-opener-boy-robot-muted-watercolor-v1.png
  generation_mode: built-in-imagegen
  role: color-treatment prototype
  generation_prompt: |-
    Use case: illustration-story
    Asset type: landscape A5 magazine article-opening illustration, color-treatment prototype only
    Input images: Image 1 is the primary character and MCP-scene continuity reference; Image 2 is a supporting reference for the same original recurring boy and robot. Generate a new image. Do not alter or overwrite the inputs.
    Primary request: Recreate the simple funny MCP connection scene with exactly the same original boy and non-animal helper robot, but replace the bright digital palette with the gentle color-production qualities of a late-1970s to early-1980s children's science-comedy magazine illustration. This is an original work and must not copy any existing franchise character, composition, costume, silhouette, face, or gadget.
    Scene/backdrop: The boy and robot test a compact connector box that routes three thick colored cables to three simple endpoint panels representing a document, a data cylinder, and a wrench. Keep the room or workshop background scene-led and pale, not a uniform yellow or beige field.
    Subject: Exactly one curious school-age boy with black tousled hair, round glasses, blue-green sweater, tan shorts, and brick-red sneakers. Exactly one waist-high non-animal helper robot with an off-white rounded rectangular body, softened cobalt side panels, black face screen, two friendly curved white eyes, one short antenna, mitten-like hands, and a coral tool pouch. Preserve these defining shapes, proportions, expressions, and colors closely from the references.
    Style/medium: Simple, playful, family-friendly children's manga illustration with confident black ink contours, rounded readable expressions, economical shapes, flat watercolor washes, slight pigment variation, subtle paper tooth, fine restrained print grain, a few imperfect overlaps at color edges, minimal hatching, and no glossy digital anime finish.
    Composition/framing: Landscape 3:2, strong simple silhouettes, clear at A5, action centered safely for a horizontal crop, endpoints readable as icons without text. One playful visual idea: the robot proudly operates the connector while the boy points at a surprising successful route.
    Lighting/mood: Gentle daylight, cheerful and curious, soft contrast.
    Color palette: Lower saturation and medium value range. Softened cyan and cobalt blue, brick and coral red, warm ochre used only in small accents, muted leaf green, dusty lavender, warm off-white, and charcoal-black ink. Avoid electric cyan, neon colors, high-chroma primary fills, glossy highlights, and a bright blue full-field background.
    Materials/textures: Light watercolor granulation, subtle fibrous paper tooth and quiet vintage print grain throughout, clean enough for contemporary reproduction.
    Text: none.
    Constraints: Exactly one boy and one robot. Keep the robot non-animal. Wordless editorial storytelling. No extra humans, robots, mascots, faces on appliances, decorative writing, labels, interface text, speech balloons, logos, or watermarks. Background must arise from the workshop scene and must not read as yellow paper.
    Avoid: Any recognizable copyrighted franchise character or signature gadget; blue robotic cats; cat ears; whiskers; bell collars; round cat bodies; belly pockets; copied costumes; copied faces; uniform yellow, mustard, beige, sepia, cream-paper, parchment, or aged-paper backgrounds; modern glossy anime rendering; painterly concept art; photorealism; steampunk clutter; dense machinery.
