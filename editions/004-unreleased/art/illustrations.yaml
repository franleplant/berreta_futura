schema_version: 1
direction:
  name: Playful Systems Manga
  visual_language: >-
    Original retro Japanese children's science-comedy manga energy with
    friendly rounded figures, large readable expressions, confident black
    contours, whimsical machines, sparse hatching, restrained halftone, warm
    cream stock, and slightly imperfect print registration. The recurring cast
    is a curious young engineer with round glasses and a compact helper robot
    with a rounded rectangular body, small antenna, and tool satchel. Use broad
    period cues only. Never reproduce a franchise character, costume, face, or
    signature gadget.
  palette: >-
    Warm cream paper with black drawing and relaxed flat spot accents in deep
    violet, vermilion orange, powder blue, and occasional muted secondary
    colors.
  constraints:
  - Entirely wordless editorial storytelling
  - Original rounded characters and friendly gadgets with no franchise likeness
  - Strong silhouettes and expressions that remain legible at A5 size
  - Print-friendly contrast with sparse hatching and restrained halftone
  - Slightly imperfect spot-color registration and visible warm paper texture
  - Article tails keep every essential action inside the safe horizontal crop
  - Multi-panel structure is reserved for an asset brief that explicitly requires a functional sequence
  avoid:
  - Direct copies of Doraemon, Nobita, or any recognizable franchise character
  - Blue robotic cats, signature franchise gadgets, copied costumes, or copied faces
  - Decorative montages, contact sheets, or filler patterns
  - Dense technical realism, steampunk clutter, or excessive crosshatching
  - Modern glossy anime rendering, painterly concept art, neon cyberpunk, or photorealism
  - Decorative pseudo-writing, interface glyphs, captions, labels, or speech balloons
assets:
- id: factory-systems-problem
  role: article_tail
  article_id: factory-systems-problem
  art_path: editions/004-unreleased/art/article-tails/factory-systems-problem.png
  subject: >-
    The engineer and helper robot inspect a software factory whose small model
    module rides inside a much larger system of sandboxing, source control,
    reproducible builds, delivery gates, identity controls, and human approval.
  composition: >-
    One wide self-contained factory cutaway with the essential characters,
    conveyor, bounded agent process, and control gates inside the safe central
    crop. The machinery remains legible as one deterministic system.
  alt_text: >-
    A manga engineer and helper robot inspect a layered software factory with a
    conveyor, sandbox, build machinery, identity vault, and human approval lever.
  credit: Original illustration by the editors with Codex image generation.
- id: mcp-four-vignettes
  role: article_tail
  article_id: mcp-in-a-nutshell
  art_path: editions/004-unreleased/art/article-tails/mcp-four-vignettes.png
  subject: >-
    Four left-to-right vignettes explain MCP as host, separate clients and
    bounded servers, tool discovery, then a call and structured return through
    a human approval gate.
  composition: >-
    Four equal vertical panels in Western reading order. All essential action,
    arrows, and icons remain inside the central horizontal half so a shallow
    article-tail crop preserves the full explanation.
  alt_text: >-
    Four manga vignettes show an application connecting through separate
    clients to bounded servers, discovering tools, and receiving an approved
    structured result.
  credit: Original illustration by the editors with Codex image generation.
- id: closing-signal-gates
  role: closing_plate
  plate_index: 1
  art_path: editions/004-unreleased/art/closing-signal-gates-manga.png
  subject: >-
    The engineer and helper robot guide a bright signal parcel through shield,
    inspection, and human approval gates.
  composition: >-
    A vertical conveyor rises through three large readable gates with the
    recurring characters entering at the lower edge and the useful signal
    emerging at the top.
  alt_text: >-
    A manga scene shows a bright signal passing through security, inspection,
    and human approval gates.
  credit: Original illustration by the editors with Codex image generation.
- id: closing-memory-rings
  role: closing_plate
  plate_index: 2
  art_path: editions/004-unreleased/art/closing-memory-rings-manga.png
  subject: >-
    The characters compare a compact glowing memory ribbon with a retrieval
    cabinet that fetches one precise resource.
  composition: >-
    A balanced vertical choice places the memory spool at left, the retrieval
    cabinet at right, and the engineer between them connecting the result to a
    small host.
  alt_text: >-
    A manga scene contrasts a compact memory ribbon with a cabinet retrieving a
    precise resource.
  credit: Original illustration by the editors with Codex image generation.
- id: closing-useful-boundary
  role: closing_plate
  plate_index: 3
  art_path: editions/004-unreleased/art/closing-protocol-exchange-manga.png
  subject: >-
    Separate clients connect one host to document, database, and workshop
    servers while boundaries prevent an unsafe tangle.
  composition: >-
    A playful vertical cutaway keeps the host and characters below three
    bounded server rooms, with separate cables and an approval lever at the
    sensitive doorway.
  alt_text: >-
    A manga cutaway shows separate clients connecting a host to three bounded
    servers with a human approval control.
  credit: Original illustration by the editors with Codex image generation.
