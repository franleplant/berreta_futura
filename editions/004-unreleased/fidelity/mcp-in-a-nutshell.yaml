- id: synthesis-021
  kind: p
  status: modified
  source: Statelessness and discovery MCP is a stateless protocol. Every request carries the protocol
    version and the capabilities relevant to that request in its _meta field, so the server can process
    each request on its own. Clients should also identify themselves in the same field unless configured
    not to. Servers advertise their supported versions and capabilities through the mandatory server/discover
    request, which clients may send before any other request. Detailed information can be found in the
    specification, and the example showcases the per-request metadata and the discovery sequence.
  edited: First, the client asks the server what protocol versions and capabilities it supports through
    server/discover. Every request identifies the protocol version and relevant capabilities in _meta,
    so the server can process it without hidden connection state.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
