  edited: >-
    The target is an almost-lights-out factory. The best practice right now is
    to build the abstractions and pieces we need. That entails solving non-agent
    topics: sandboxing, monorepos, reproducible builds, CI/CD, identity and
    secret management, and smashing corporate friction in the realm of
    developer experience for agents.
  reason: Resolved the numbered cross-references, expanded shorthand, and regularized the list without changing its substance.
