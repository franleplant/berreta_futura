- id: factories-001
  kind: h2
  status: modified
  source: '[1] software factories are super real'
  edited: Software factories are super real
  reason: Promoted the opening claim to a section heading and removed its inline cross-reference.
- id: factories-002
  kind: p
  status: modified
  source: >-
    but we need to be realistic. the factory aspects haven’t been cracked yet,
    the [3] innovators are toying around with discovering practices and pieces.
  edited: >-
    Software factories are real, but we need to be realistic. The factory
    itself isn’t cracked; innovators are still discovering practices and pieces.
  reason: Tightened the repeated heading phrase and regularized capitalization and punctuation without changing the claim.
- id: factories-003
  kind: p
  status: modified
  source: >-
    if someone is selling you a factory rn and they aren’t in the super small
    cohort (ie. they are likely startups created in last six months!) or circa
    <10 people in the who’s-who, who have been trying (and realistically
    failing) over the last two years. they are selling bullshit. it isn’t
    cracked but it’s a puzzle that’s being solved daily.
  edited: >-
    If someone is selling you a factory now and they aren’t in the small cohort
    of startups created in the last six months, or among the roughly ten people
    who have tried and realistically failed for two years, they are selling
    bullshit. It isn’t cracked, but the puzzle is being solved daily.
  reason: Expanded abbreviations and tightened the cohort comparison while preserving its size, time span, and point of view.
- id: factories-004
  kind: p
  status: modified
  source: >-
    the best practices right now are to build abstractions/pieces needed which
    entails solving [2] non-agent topics. [1] almost lights out. [2] sandboxing,
    monorepo, reproducible builds, ci/cd, identity/secret management, smashing
    corporate friction in the realm of devex for agents.
  edited: >-
    The target is an almost-lights-out factory. Best practice now is to build
    the needed abstractions and pieces by solving non-agent topics: sandboxes,
    monorepos, reproducible builds, CI/CD, identity and secret management, and
    corporate friction in developer experience for agents.
  reason: Resolved the numbered cross-references, expanded shorthand, and tightened the list without dropping a named practice.
- id: factories-005
  kind: p
  status: modified
  source: >-
    [3] at home, in your homelab, you should be cracking on this problem space
    in your free time if you want a super fast promotion and red carpet service
    at your next interview. highest roi you can have right now is learning the
    entire damn stack, automating it and showing it at your next interview/doing
    a recorded talk at a meetup.
  edited: >-
    In your free time, crack on this problem in your homelab for a fast
    promotion and red-carpet treatment at your next interview. The highest ROI
    now is learning the entire damn stack, automating it, and showing the work
    at an interview or in a recorded meetup talk.
  reason: Resolved the inline cross-reference and tightened the career advice while preserving its timing, homelab, emphasis, promotion, interview, stack, automation, and recorded-talk details.
