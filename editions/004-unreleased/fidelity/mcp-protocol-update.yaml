- id: synthesis-001
  kind: p
  status: modified
  source: 'Home / Posts The 2026-07-28 MCP Specification Release Candidate The release candidate for the
    next Model Context Protocol (MCP) specification is now available: a stateless protocol core, the Extensions
    framework, Tasks, MCP Apps, authorization hardening, and a formal deprecation policy. May 21, 2026
    · 9 min · David Soria Parra (Lead Maintainer), Den Delimarsky (Lead Maintainer) Table of Contents
    The release candidate for MCP is now available. It is the largest revision of 2026-07-28'
  edited: The release candidate for the July 28, 2026 Model Context Protocol specification is the largest
    revision since launch. It introduces a stateless core, first-class extensions, long-running Tasks,
    MCP Apps, authorization hardening, a formal deprecation policy, and full JSON Schema for tools.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-002
  kind: p
  status: modified
  source: A remote MCP server that previously needed sticky sessions, a shared session store, and deep
    packet inspection at the gateway can now run behind a plain round-robin load balancer, route traffic
    on an Mcp-Method header, and let clients cache responses for as long as the tools/list
  edited: The practical effect is operational. A remote MCP server that once required sticky sessions
    and a shared session store can run behind an ordinary round-robin load balancer. Gateways can route
    requests from headers. Clients can cache list responses for an explicit period.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-003
  kind: h2
  status: modified
  source: A Stateless Protocol The headline change is that MCP is now stateless at the protocol layer.
    Six Specification Enhancement Proposals (SEPs) work together to get there, completing the plan we
    laid out in The Future of MCP Transports in December. BEFORE AFTER 2025-11-25 2026-07-28
  edited: A stateless protocol
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-004
  kind: p
  status: modified
  source: The protocol version, client info, and client capabilities that used to be exchanged once at
    connection time now travel in_meta on every request, and a new server/discover method lets clients
    fetch server capabilities when they need them up front.
  edited: In the 2025 specification, a Streamable HTTP client initialized a session, received an Mcp-Session-Id,
    and attached that identifier to later requests. The session pinned traffic to the server instance
    that created it or required shared state across instances.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-005
  kind: p
  status: modified
  source: The handshake and session are gone The initialize / initialized handshake is removed (SEP-2575).
  edited: In the new protocol, a tool call is self-contained. The protocol version, client information,
    and relevant capabilities travel in _meta on each request. The initialization handshake and protocol-level
    session are gone.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-006
  kind: p
  status: modified
  source: The Mcp-Session-Id header and the protocol-level session that came with it are also removed
    (SEP-2567). With both gone, any MCP request can land on any server instance, and the sticky routing
    and shared session stores that horizontal deployments needed before are no longer required at the
    protocol layer.
  edited: Clients can call server/discover when they need the server's versions and capabilities before
    making another request. Any request can land on any compatible server instance.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-007
  kind: p
  status: modified
  source: 'Stateless protocol, stateful applications Removing the protocol-level session does not mean
    your application has to be stateless. Servers that need to carry state across calls can do what HTTP
    APIs have always done: mint an explicit handle (a basket_id ,a browser_id ) from a tool and have the
    model pass it back as an ordinary argument on later calls.'
  edited: This does not require applications to forget state. A tool can create an explicit handle such
    as basket_id or browser_id, return it to the model, and accept it as an ordinary argument on the next
    call.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-008
  kind: p
  status: modified
  source: The model can compose handles across tools, reason about them, and hand them off between steps
    in ways that externally managed session state, hidden in transport metadata, never really allowed.
  edited: Explicit handles are often more useful than transport metadata. The model can see them, compose
    them across tools, reason about ownership, and pass them between steps. State remains possible, but
    it becomes application data instead of an invisible property of a connection.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-009
  kind: h2
  status: modified
  source: 2243) so load balancers, gateways, and rate-limiters can route on the operation without inspecting
    the body.
  edited: Server requests without a permanent channel
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-010
  kind: p
  status: modified
  source: In practice, we’ve found this pattern (the model threading an identifier from one tool call
    to the next) to be more than just a workable substitute for session state. It’s often a more powerful
    one. The explicit-handle pattern simply makes the state visible to the model rather than hidden away.
    Server-to-client requests, restructured A stateless protocol still needs a way for servers to ask
    the client for something mid-call, such as an elicitation prompt. Earlier spec versions recommended
    this; it’s now required.
  edited: Servers still need to request information from the client during a tool call. An operation may
    require confirmation, credentials, or another user choice.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-011
  kind: p
  status: modified
  source: The protocol no longer manages that state for you, but it doesn’t prevent you from managing
    it yourself. Two SEPs rebuild that flow so it works without a persistent connection. Server-initiated
    requests may now only be issued while the server is actively processing a client request (SEP-2260).
    A user is never prompted out of nowhere, and every elicitation traces back to something they (or their
    agent) started.
  edited: The new rule is that a server can initiate such a request only while processing a client request.
    A user should never receive an unrelated prompt from a dormant server.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-012
  kind: p
  status: modified
  source: 'Multi Round-Trip Requests (SEP-2322) change how those prompts are delivered. Instead of holding
    a Server-Sent Events (SSE) stream open, the server returns an InputRequiredResult : { "resultType":
    "input_required", "inputRequests": { "confirm": { "type": "elicitation", "message": "Delete 3 files?",
    "schema": { "type": "boolean" } } }, "requestState": "eyJzdGVwIjoxLCJmaWxlcyI6WyJhIiwiYiIsImMiXX0="
    }'
  edited: Multi Round-Trip Requests replace the assumption of one persistent stream. The server returns
    an input_required result containing one or more input requests and an opaque requestState. The client
    gathers answers, repeats the original operation with inputResponses, and echoes the state.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-013
  kind: p
  status: modified
  source: The client gathers the answers and re-issues the original call with inputResponses and the echoed
    requestState . Any server instance can pick that retry up because everything it needs is in the payload.
  edited: Any server instance can process the retry because the payload carries everything required to
    continue.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-014
  kind: h2
  status: modified
  source: Routable, cacheable, traceable Three smaller changes make the resulting traffic easier to operate.
  edited: Routable, cacheable, traceable
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
