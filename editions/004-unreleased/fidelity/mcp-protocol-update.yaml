- id: synthesis-033
  kind: p
  status: modified
  source: 'Tool inputSchema and outputSchema are lifted to full JSON Schema 2020-12 (SEP- 2106). Input
    schemas keep the type: "object" root constraint but now allow composition ( oneOf , anyOf , allOf
    ), conditionals, and references ( , $ref $defs ). Output schemas are unrestricted, and structuredContent
    can now be any JSON value rather than only an object. Implementations must not auto-dereference external
    $ref'
  edited: Tool schemas now use full JSON Schema 2020-12. Servers and clients can express richer validation
    rules, but they should treat schemas as untrusted input, bound recursion and validation time, and
    avoid automatically resolving remote references.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-034
  kind: p
  status: modified
  source: URIs and should bound schema depth and validation time. Separately, the error code for a missing
    resource changes from the MCP-custom -32002 to the JSON-RPC standard -32602 Invalid Params (SEP-2164).
    If your client matches on the literal -32002 value, update it.
  edited: A missing resource now uses the standard JSON-RPC method-not-found family rather than the MCP-specific
    -32002 value. Implementations that match the literal old code need to change.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
