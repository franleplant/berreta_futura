- id: synthesis-015
  kind: p
  status: modified
  source: Servers reject requests where the headers and body disagree.
  edited: Streamable HTTP now requires Mcp-Method and Mcp-Name headers. A load balancer can route and
    rate-limit tools/call for search without parsing the JSON-RPC body. Servers reject a request when
    headers and body disagree.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-016
  kind: p
  status: modified
  source: Clients know exactly how long a tools/listresponse is fresh and whether it’s safe to share across
    users, and a long-lived SSE stream is no longer the only way to learn that a list changed.
  edited: List and resource-read results can declare ttlMs and cacheScope. A client knows how long a tools/list
    response remains fresh and whether it can be shared across users. Servers no longer need a long-lived
    event stream merely to keep every catalog current.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-017
  kind: p
  status: modified
  source: List and resource read results now carry ttlMs and cacheScope (SEP-2549), modeled on HTTP Cache-Control
    . W3C Trace Context propagation in _meta is now documented (SEP-414), locking down the traceparent
    , tracestate , and baggage key names so distributed traces correlate across SDKs and gateways. Several
    SDKs and tools were already doing this; with the key names fixed in the spec, a trace that starts
    in a host application can follow a tool call through the client SDK, the MCP server, and whatever
    the server calls downstream, and show up as a single span tree in an OpenTelemetry-compatible backend.
  edited: Trace context moves through standard traceparent, tracestate, and baggage headers. One tool
    call can appear inside the same OpenTelemetry trace as the host action and downstream service calls.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-018
  kind: p
  status: modified
  source: The Streamable HTTP transport now requires and Mcp-Method headers (SEP- Mcp-Name
  edited: These changes make MCP traffic legible to existing HTTP infrastructure rather than demanding
    protocol-specific gateways.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-019
  kind: h2
  status: modified
  source: 'Extensions Become First-Class Extensions existed in the 2025-11-25 release but had no formal
    process behind them. SEP-2133 adds that: extensions are identified by reverse-DNS IDs, negotiated
    through an extensions map on client and server capabilities, live in their own ext-*repositories with
    delegated maintainers, and version independently of the specification. A new Extensions Track in the
    SEP process gives them a path from experimental to official. This release includes two official extensions.'
  edited: Extensions move independently
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-020
  kind: p
  status: modified
  source: Three governance SEPs in this release are designed so that future revisions can evolve the protocol
    without breaking core capabilities. The Extensions framework means new capabilities can ship as opt-in
    extensions and stabilize there before, if ever, moving into the specification. And a Standards Track
    SEP can no longer reach Final status until a matching scenario lands in the conformance suite (SEP-2484),
    which is the same suite the new SDK tier system scores official SDKs against. The stateless rework
    in this release is the kind of foundational change that needed a clean break. With it landed, and
    with deprecation windows and extensions as the standard tools going forward, our expectation is that
    implementers targeting 2026-07-28 will be able to adopt future revisions without rewriting their transport
    or lifecycle code.
  edited: The core protocol is smaller because optional capabilities can evolve as extensions with delegated
    maintainers and independent versions.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-021
  kind: p
  status: modified
  source: 'MCP Apps: server-rendered user interfaces MCP Apps (SEP-1865) lets servers ship interactive
    HTML interfaces that hosts render in a sandboxed iframe. Tools declare their UI templates ahead of
    time so hosts can prefetch, cache, and security-review them before anything runs. The rendered UI
    talks back to the host over the same JSON-RPC base protocol used everywhere else in MCP, so every
    UI- initiated action goes through the same audit and consent path as a direct tool call.'
  edited: MCP Apps is an official extension for server-rendered interfaces. A server can return an interactive
    UI where plain text or structured data is not enough.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-022
  kind: p
  status: modified
  source: 'Tasks graduates to an extension Tasks shipped as an experimental core feature in 2025-11-25
    . Production use surfaced enough redesign that the right home for it is an extension rather than the
    specification. The Tasks extension reshapes the lifecycle around the stateless model: a server can
    answer tools/call with a task handle, and the client drives it with tasks/get , tasks/update , and
    tasks/cancel . Task creation is server-directed: the client advertises the extension and the server
    decides when a call should run as a task. tasks/list is removed because it can’t be scoped safely
    without sessions. Anyone who shipped against the 2025-11-25 experimental Tasks API will need to migrate
    to the new lifecycle.'
  edited: Tasks also graduates into an extension. It supports long-running work that can be polled and
    retrieved after the initiating request. The earlier core task lifecycle is removed because it could
    not be scoped safely without sessions.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-023
  kind: p
  status: modified
  source: The practical effect on a production deployment is immediate.
  edited: The separation lets the core remain stable while UI and asynchronous-work patterns evolve faster.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
