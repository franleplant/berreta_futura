- id: synthesis-025
  kind: p
  status: modified
  source: Six SEPs harden the authorization specification to align more closely with how OAuth 2.0 and
    OpenID Connect are deployed in practice. Clients must now validate the iss parameter on authorization
    responses per RFC 9207 (SEP-2468). This is a low-cost mitigation for a class of mix-up attack that
    is more prevalent in MCP’s single-client, many-server deployment pattern. In a future version, clients
    will be expected to reject responses that omit , so authorization servers iss
  edited: The authorization revisions align MCP more closely with real OAuth and OpenID Connect deployments.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-026
  kind: p
  status: modified
  source: Clients bind registered credentials to the issuing authorization server’s issuer and re-register
    when a resource migrates between authorization servers (SEP-2352).
  edited: Resource indicators become stricter so tokens are issued for the intended server. Authorization-server
    metadata must identify the issuer consistently. Client registration can use standards-based mechanisms
    instead of assuming every server operates its own custom registry.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-027
  kind: p
  status: modified
  source: should begin supplying it now if they don’t already. Clients now declare their OpenID Connect
    application_type during Dynamic Client Registration (SEP-837), avoiding the common case where an authorization
    server defaults a desktop or CLI client to "web" and rejects its localhost redirect URI. The spec
    also documents how to request refresh tokens from OpenID Connect-style authorization servers (SEP-2207),
    and clarifies scope accumulation during step-up (SEP-2350) and the .well-known discovery suffix (SEP-2351).
  edited: The specification also handles resources that migrate between authorization servers and documents
    how clients should request refresh tokens from OpenID Connect-style providers.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
