title: Los sistemas alrededor del modelo
subtitle: Protocolos, evaluaciones, arquitecturas y el trabajo operativo que convierte la capacidad de los modelos
  en sistemas confiables
cover:
  headline: Los sistemas alrededor del modelo
  deck: Seis informes sobre la maquinaria que hace útil, comprensible y segura a la inteligencia
  back_text: El modelo es solo un componente. La confiabilidad vive en el protocolo, la evidencia, el ciclo de
    retroalimentación, la arquitectura y el criterio que los conecta.
