  figures:
  - id: figure-1
    source_id: scaling-git-at-openai-277870ff
    path: media/001.png
    caption: The branch refs/heads/main points to commit C2, whose parent is C1.
    alt_text: The branch refs/heads/main points to commit C2, whose parent is C1. C1 points to root tree T1, where parser.py refers to blob B1. C2 points to root tree T2, where parser.py refers to blob B2. In both root trees, docs/ refers to the same tree, T3. Its README.md entry points to blob B3, and usage.md points to blob B4.
    anchor: How Git moves history
    layout: evidence_band
  - id: figure-2
    source_id: scaling-git-at-openai-277870ff
    path: media/002.png
    caption: Two versions of parser.py appear under $GIT_DIR/objects .
    alt_text: Two versions of parser.py appear under $GIT_DIR/objects . As loose objects, blob A contains parse(), and blob B contains both parse() and parse_file(). The packfile stores A in full and represents B as instructions to copy all of A and append parse_file(). The accompanying *.idx file locates both blobs in the packfile by object ID.
    anchor: How Git moves history
    layout: evidence_band
  - id: figure-3
    source_id: scaling-git-at-openai-277870ff
    path: media/003.png
    caption: On the left, three successive trunk packs contain commits A, B and C; D and E; and F.
    alt_text: On the left, three successive trunk packs contain commits A, B and C; D and E; and F. On the right, trunk and topic diverge at C. Trunk advances to G, while topic advances through D, E, and F. The latest topic pack contains D, E, and F. A dashed outline marks D and E as also present in the earlier topic pack. The blue arrow marks the new pack’s dependency on trunk at G. F’s Git parent is E.
    anchor: 'Pushes: showing fewer cards'
    layout: evidence_band
