craft:
  result: approved
  findings: []
  scores:
    voice: 4
    sentence_variety: 4
    economy: 4
  notes: |
    This piece is technically sound and clearly voiced. The writer uses concrete examples
    (VS Code, Sentry, Tasks extension) to ground abstract protocol concepts, and moves
    logically from architecture through primitives to extensibility. Sentence variety is
    good—the intentional Local/Remote server parallel adds clarity without becoming
    monotonous. The voice remains present and personal throughout ("acting as the host,"
    "which is the point of drawing the lines") rather than drifting into the abstraction
    stack or balanced-clause register. No dead words, no jargon left undefined, no
    repetitive shapes. The closing pulls back from the Tasks example to state the
    extensibility principle explicitly—which adds clarity and perspective rather than
    mere restatement.
