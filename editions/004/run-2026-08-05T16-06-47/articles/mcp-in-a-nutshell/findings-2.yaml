  notes: "Checked every checkable assertion in the manuscript against the pinned extraction: \nall protocol versions, method names, field names, transport types, authentication \nmechanisms, core and client primitives, examples, and technical details match the \nsource. Verified that qualifications and hedges (protocols are \"typically\" used in \ncertain ways, no guarantees on notification delivery, discovery is optional) survive \nthrough to the manuscript. The manuscript's elaborations—explaining why the protocol \nis designed the way it is, synthesizing the rationale for layer separation—stay within \nthe source's own stated purposes and do not introduce unsupported theses. No invented \nclaims, fabricated quotes, or omitted counterarguments.\n"
mechanics:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: Primitives | Sampling let a server | 1
    category: agreement
    disposition: fix
    note: |
      "Sampling" is a singular noun and requires the singular verb form "lets", not the plural "let".
    suggestion: Sampling lets a server request a completion from the client's own model through `sampling/createMessage`, so a server author could get LLM access without shipping an LLM SDK; new servers are expected to call a model provider's API directly instead.
  - severity: major
    article: mcp-in-a-nutshell
    locator: Primitives | Logging let a server | 1
    category: agreement
    disposition: fix
    note: |
      "Logging" is a singular noun and requires the singular verb form "lets", not the plural "let".
    suggestion: Logging lets a server send debug messages to the client; new servers should write to stderr over stdio or use OpenTelemetry.
  - severity: major
    article: mcp-in-a-nutshell
    locator: Primitives | Cache this list | 1
    category: capitalisation
    disposition: fix
    note: |
      The imperative phrase after the colon should be lowercase to match the piece's consistent style. Compare: "Tools are executable functions: a database query..." and "nothing is hardcoded..."
    suggestion: cache this list for five minutes before asking again
  - severity: major
    article: mcp-in-a-nutshell
    locator: Primitives | The server acknowledges | 1
    category: capitalisation
    disposition: fix
    note: |
      After a semicolon joining independent clauses within a single sentence, the second clause should not begin with a capital letter.
    suggestion: the server acknowledges with whichever subset it actually supports
  scores:
    grammar: 2
    typography: 3
    consistency: 2
  notes: |
    Two subject-verb agreement errors where singular feature names take the plural verb form "let" instead of "lets". Two capitalization errors: an imperative phrase capitalized after a colon (inconsistent with other colons in the piece), and a dependent clause capitalized after a semicolon within a single sentence.
