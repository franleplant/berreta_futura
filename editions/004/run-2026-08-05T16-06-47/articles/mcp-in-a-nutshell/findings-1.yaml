  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | context exchange—it does not dictate | 1'
    category: typography
    disposition: fix
    note: |
      The em dash character (U+2014) is banned. Replace with a semicolon, period, comma,
      colon, or parentheses.
    suggestion: context exchange; it does not dictate
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | naming which event types it wants; the server acknowledges | 1'
    category: capitalisation
    disposition: fix
    note: |
      Independent clauses following a semicolon should be capitalized, consistent with
      the piece's established convention of capital openings throughout.
    suggestion: it wants; The server acknowledges with whichever subset...
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | the response itself: cache this list | 1'
    category: capitalisation
    disposition: fix
    note: |
      Imperative clauses after a colon should be capitalized.
    suggestion: 'the response itself: Cache this list for five minutes...'
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | one dedicated line to the filesystem process, another to Sentry''s server | 1'
    category: grammar
    disposition: fix
    note: |
      List items must be parallel in structure. "Another to Sentry's server" omits the
      noun phrase "dedicated line" that appears in "one dedicated line to the filesystem
      process."
    suggestion: another dedicated line to Sentry's server running on Sentry's own infrastructure
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | cache this list for five minutes, and a cacheScope field states | 1'
    category: grammar
    disposition: fix
    note: |
      Parallel coordinate clauses must maintain the same grammatical form. This mixes
      an imperative clause ("cache this list") with a declarative clause ("a cacheScope
      field states"). Restructure to keep both parallel.
    suggestion: cache this list for five minutes before asking again, and note the cacheScope field that states who may reuse it
  scores:
    grammar: 2
    typography: 2
    consistency: 4
  notes: |
    Four major issues require changes: one banned em dash, two capitalisation errors
    following punctuation (semicolon and colon), and two broken parallelism errors in
    grammatical structure affecting clarity.
