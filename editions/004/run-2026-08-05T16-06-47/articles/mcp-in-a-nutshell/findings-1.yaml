craft:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: 'Primitives | Tools are executable functions: a database query, a file write, an API call. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Three consecutive definition sentences follow the shape "[Noun] are [description]: [list/examples]" — Tools, Resources, and Prompts. The structure serves clarity, but monotony across three sentences is a reading defect. Remedy: vary one definition's structure, restructure the section, or accept the pattern for organizational clarity. Editor's call.
  scores:
    voice: 4
    sentence_variety: 3
    economy: 4
  notes: |
    Clear, concrete technical exposition with human voice throughout. The piece successfully explains a complex protocol through example and logical development, maintaining the sense of a person explaining rather than a system documenting. One structural repetition in the definitions section is the only reading defect.
