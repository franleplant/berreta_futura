craft:
  result: approved
  findings: []
  notes: |
    This is a forensic account of an intrusion written by investigators who lived it, and it maintains that voice—precise, curious, concrete, warm—throughout. The piece avoids assistant idiom entirely, varies its sentence shapes across more than thirty paragraphs without repetition, and uses technical jargon accurately in context where competent engineers would understand. The opening is immediate and the closing reframes rather than restates.
