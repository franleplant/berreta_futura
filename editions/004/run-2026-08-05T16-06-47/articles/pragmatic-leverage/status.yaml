- lens: mechanics
  severity: major
  article: pragmatic-leverage
  locator: The tradeoff between planning depth and expected rework | ~50%, the chance you have to rework it | 1
  category: punctuation
  disposition: editor_decision
  note: |
    Two independent clauses are joined by a comma: "your chance of getting a
    fully-mergeable result is ~50%" and "the chance you have to rework it is
    50%." This is a comma splice and requires either a conjunction, semicolon,
    colon, or separate sentences. Assuming this is verbatim from the source
    (faithful_edit mode), the editor determines the remedy.
  suggestion: 'Let''s assume if you yolo a two-sentence prompt into your factory: your chance of getting a fully-mergeable result is ~50%; the chance you have to rework it is 50%.'
