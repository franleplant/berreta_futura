  suggestion: 'Add a transition before the second section: ''But how much planning is enough? That depends on a tradeoff...'''
- lens: shape
  severity: major
  article: pragmatic-leverage
  locator: The tradeoff between planning depth and expected rework | Good luck. | 1
  repair_from: The tradeoff between planning depth and expected rework | This is what we mean by leverage, and it requires being pragmatic. | 1
  category: ending
  disposition: fix
  note: |
    The piece ends with a dismissal rather than a landing. After discussing multi-phase
    planning and steering, "Good luck" leaves the reader hanging instead of reinforcing
    how pragmatic planning delivers the promised 2-3x improvement.
  suggestion: Extend the final thought to connect pragmatic planning back to the leverage benefit promised at the start.
- lens: craft
  severity: major
  article: pragmatic-leverage
  locator: The tradeoff between planning depth and expected rework | This is what we mean by leverage, and it requires being pragmatic. | 1
  category: weak_close
  disposition: editor_decision
  note: |
    The final section restates the thesis without advancing it. "This is what we mean by leverage, and it requires being pragmatic" simply re-announces what the reader has just finished understanding through fourteen preceding sentences. The long sentence that follows elaborates the application ("If you're doing multiple phases of planning, zooming in from 50kft view all the way to the 10kft view...") but adds no new perspective beyond what was already demonstrated. "Good luck." offers nothing—no clarity, curiosity, or sense of earned perspective. Against the Final Editing Test, the closing does not leave the reader with more clarity, perspective, or curiosity; it retreads ground. The remedy is an editor's: cut the restatement entirely and either end on a line that grounds the planning principle in the reader's own decision-making, or remove the final section entirely.
