worth:
  result: approved
  findings: []
  notes: |
    Delivers on its promise: a reader gets Horthy's argument about pragmatic
    leverage in AI-assisted delivery—the tradeoff between planning depth and
    rework pain, and where steering at each phase actually pays—in a permanent,
    legible format instead of hunting a scattered X thread.
evidence:
  result: approved
  findings: []
  scores:
    claim_support: 5
    qualification_survival: 5
    quote_accuracy: 5
    attribution: 5
  notes: |
    Verified all factual claims (25-50% statistic, time savings, percentage probabilities, principal engineer scenario details, the pain formula) against the source extraction. All qualifications and hedges are preserved. No gaps between manuscript assertions and source support.
mechanics:
  result: changes_required
  findings:
  - severity: major
    article: pragmatic-leverage
    locator: Seeking leverage | aligning/planning, code-review/rework, and testing/verifying the solution | 1
    category: grammar
    disposition: editor_decision
    note: |
      The list is not parallel in form. The first two items lack explicit objects,
      while the third includes "the solution" as an object. All three should be
      structured the same way grammatically.
    suggestion: aligning/planning the solution, code-review/rework of the solution, and testing/verifying the solution
  - severity: major
    article: pragmatic-leverage
    locator: The tradeoff between planning depth and expected rework | Lets assume if you yolo | 1
    category: spelling
    disposition: editor_decision
    note: |
      Missing apostrophe. "Lets" is the third-person singular verb form; the
      contraction of "let us" is "let's".
    suggestion: Let's assume if you yolo a two-sentence prompt into your factory
  - severity: major
    article: pragmatic-leverage
    locator: The tradeoff between planning depth and expected rework | Now lets say you are | 1
    category: spelling
    disposition: editor_decision
    note: |
      Missing apostrophe in contraction. Should be "let's".
    suggestion: Now let's say you are a principal engineer with 10 years of experience
  - severity: major
    article: pragmatic-leverage
    locator: The tradeoff between planning depth and expected rework | its possible you may need | 1
    category: spelling
    disposition: editor_decision
    note: |
      Wrong form. "Its" is possessive; "it's" is the contraction of "it is".
    suggestion: it's possible you may need to end it where you are
  - severity: major
    article: pragmatic-leverage
    locator: The tradeoff between planning depth and expected rework | leverage - and it requires | 1
    category: typography
    disposition: editor_decision
    note: |
      The em dash character (U+2014) or its space-hyphen-space representation
      is banned. Use a period, comma, colon, semicolon, or parentheses instead.
    suggestion: This is what we mean by leverage, and it requires being pragmatic
  - severity: major
    article: pragmatic-leverage
    locator: The tradeoff between planning depth and expected rework | good luck | 1
    category: capitalisation
    disposition: editor_decision
    note: |
      Lowercase sentence opening. Every other sentence in this piece opens with
      a capital letter. This violates the established convention.
    suggestion: Good luck.
  - severity: major
    article: pragmatic-leverage
    locator: The tradeoff between planning depth and expected rework | For this example I'm gonna blur | 1
    category: markup
    disposition: fix
    note: |
      Editorial apparatus (an explanatory note about simplification) is embedded
      in the article prose. The magazine does not print editorial explanations
      inside article text.
    suggestion: Remove the note or relocate it outside the article prose
  - severity: minor
    article: pragmatic-leverage
    locator: The tradeoff between planning depth and expected rework | 50kft view | 1
    category: typography
    disposition: editor_decision
    note: |
      Standard formatting for number plus unit abbreviation includes a space:
      "50 kft" rather than "50kft".
    suggestion: 50 kft view
  - severity: minor
    article: pragmatic-leverage
    locator: The tradeoff between planning depth and expected rework | 10kft view | 1
    category: typography
    disposition: editor_decision
    note: |
      Standard formatting for number plus unit abbreviation includes a space:
      "10 kft" rather than "10kft".
    suggestion: 10 kft view
  - severity: minor
    article: pragmatic-leverage
    locator: The tradeoff between planning depth and expected rework | 2-3x faster | 1
    category: typography
    disposition: editor_decision
    note: |
      The multiplication symbol in the formula uses × (U+00D7), but the range
      here uses the letter x. These should be consistent throughout the piece.
    suggestion: 2–3× faster
  scores:
    grammar: 1
    typography: 2
    consistency: 2
  notes: |
    The piece contains errors across multiple categories. Significant findings include
    broken list parallelism, three separate spelling and contraction errors, a capitalization
    inconsistency, a banned em dash, embedded editorial apparatus that violates
    magazine form policy, and minor formatting inconsistencies. Most errors appear
    in the author's source material requiring editorial decision; the embedded editorial
    note requires removal or relocation.
shape:
  result: changes_required
  findings:
  - severity: minor
    article: pragmatic-leverage
    locator: '- | This one is a bit of an addendum / side-quest to the recent Why Software Factories Fail series | 1'
    category: opening
    disposition: fix
    note: |
      The piece opens with source-level metadata about its relation to other work,
      not the argument itself. The actual opening—"Even before AI, only 25-50% of the
      time to ship a feature was writing the code itself"—is strong and earns the
      second paragraph. This preamble should be removed; it breaks the magazine
      reader's entry into the piece.
  - severity: minor
    article: pragmatic-leverage
    locator: Seeking leverage | Seeking leverage | 1
    category: heading_not_a_claim
    disposition: fix
    note: |
      The heading names a topic rather than the section's argument. The section makes
      a case—leverage comes from planning and alignment, not from AI-assisted coding
      alone—that a claim-based heading would signal more clearly.
  scores:
    order: 4
    coherence: 4
    opening: 2
    ending: 4
  notes: |
    The argument moves cleanly from time allocation through the planning-rework
    tradeoff to pragmatic steering across abstraction levels. The structure and logic
    are sound. Opening is damaged by source metadata; once removed, this piece lands
    well.
craft:
  result: changes_required
  findings:
  - severity: major
    article: pragmatic-leverage
    category: repeated_shape
    locator: Seeking leverage | If you're only using AI to write the code, then you're taking | 1
    disposition: editor_decision
    note: |
      Five sentences begin with "If you..." opening conditional scenarios: "If you're only using AI to write the code, then you're taking the 2-4 hours of coding time down to 10-20 minutes" and "If you use AI to help you plan and align, then you actually get closer to 2-3x faster" in the opening, then "If you draw this out, there's an inverse relationship between effort invested up front and expected pain," "If you've done some work at the 'Product' level and have not answered all the open questions yet, its possible you may need to end it where you are and zoom down a level to the technical details to understand what's feasible," and "If you're doing multiple phases of planning, zooming in from 50kft view all the way to the 10kft view, you want to do a little bit of steering at each phase to ensure you are eliminating as much expected pain as possible" in the Tradeoff section. The reader notices the cadence. Since this is the author's voice, remedies are editorial: cut or reorganize some occurrences, or reconsider the piece.
  - severity: major
    article: pragmatic-leverage
    category: weak_close
    locator: '- | good luck | 1'
    disposition: editor_decision
    note: |
      "good luck." fails the Final Editing Test for a closing sentence: it leaves the reader with no clarity, perspective, or curiosity. It's a sign-off, not a close that earns its place. The closing line has a structural job—to provide synthesis or launch the reader into fresh ground—independent of authorial voice. This one abdicates that responsibility entirely.
  - severity: minor
    article: pragmatic-leverage
    category: weak_opening_sentence
    locator: '- | This one is a bit of an addendum / side-quest | 1'
    disposition: editor_decision
    note: |
      The opening announces the piece rather than beginning it: "This one is a bit of an addendum / side-quest to the recent Why Software Factories Fail series." This is metadata about publication, not the piece. The first sentence could start the actual argument instead.
  scores:
    voice: 3
    sentence_variety: 2
    economy: 3
  notes: |
    The piece has authorial voice and a sharp argument, but momentum stalls in the middle from a noticeable pattern of five conditional openings, and the weak bookends—announcing the piece instead of starting it, signing off instead of closing—undermine the conversational authority elsewhere. The core pragmatism works; the sentence-level execution needs tightening.
