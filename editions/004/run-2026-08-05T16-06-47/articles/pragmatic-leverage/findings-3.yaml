mechanics:
  result: changes_required
  findings:
  - severity: major
    article: pragmatic-leverage
    locator: The tradeoff between planning depth and expected rework | ~50%, the chance you have to rework it | 1
    category: punctuation
    disposition: editor_decision
    note: |
      Two independent clauses are joined by a comma: "your chance of getting a
      fully-mergeable result is ~50%" and "the chance you have to rework it is
      50%." This is a comma splice and requires either a conjunction, semicolon,
      colon, or separate sentences. Assuming this is verbatim from the source
      (faithful_edit mode), the editor determines the remedy.
    suggestion: 'Let''s assume if you yolo a two-sentence prompt into your factory: your chance of getting a fully-mergeable result is ~50%; the chance you have to rework it is 50%.'
  - severity: minor
    article: pragmatic-leverage
    locator: Seeking leverage | 2-4 hours of coding time | 1
    category: typography
    disposition: fix
    note: |
      Ranges must use en dashes (–) instead of hyphens (-). Four instances
      in this piece: "2-4 hours", "10-20 minutes", "25-50%", and "2-3x faster".
      Apply en dashes consistently throughout.
  scores:
    grammar: 2
    typography: 3
    consistency: 4
  notes: |
    One comma splice disrupts the grammatical flow in the tradeoff section, and
    four ranges use hyphens where en dashes are required by the magazine's
    typography standard. No other errors detected; capitalisation, headings, and
    labelling are correct.
shape:
  result: changes_required
  findings:
  - severity: minor
    article: pragmatic-leverage
    locator: '- | This one is a bit of an addendum / side-quest to the recent Why Software Factories Fail series. | 1'
    repair_from: Seeking leverage | Even before AI, only 25-50% of the time to ship a feature was writing the code itself. | 1
    category: opening
    disposition: fix
    note: |
      The first paragraph provides contextual meta-information about publication rather
      than starting at the point of interest. The piece would be stronger opening directly
      with the 25-50% observation, which earns the sections that follow.
    suggestion: Start with the leverage opportunity rather than publication context.
  - severity: major
    article: pragmatic-leverage
    locator: Seeking leverage | But if you use AI to help you plan and align, then you actually get closer to 2-3x faster. | 1
    repair_from: The tradeoff between planning depth and expected rework | Let's assume if you yolo a two-sentence prompt into your factory | 1
    category: missing_transition
    disposition: fix
    note: |
      The jump from establishing planning's payoff to analyzing the planning-depth spectrum
      lacks a bridge. The reader must infer that the second section answers "but how much
      planning is optimal?" without being told the connection.
    suggestion: 'Add a transition before the second section: ''But how much planning is enough? That depends on a tradeoff...'''
  - severity: minor
    article: pragmatic-leverage
    locator: The tradeoff between planning depth and expected rework | The tradeoff between planning depth and expected rework | 1
    repair_from: The tradeoff between planning depth and expected rework | The tradeoff between planning depth and expected rework | 1
    category: heading_not_a_claim
    disposition: fix
    note: |
      The heading names the topic (a tradeoff exists) rather than the section's argument
      (you must find the pragmatic middle between planning investment and rework pain).
    suggestion: 'Reframe as a claim: ''Finding the Pragmatic Middle'' or ''When to Stop Planning.'''
  - severity: major
    article: pragmatic-leverage
    locator: The tradeoff between planning depth and expected rework | Good luck. | 1
    repair_from: The tradeoff between planning depth and expected rework | This is what we mean by leverage, and it requires being pragmatic. | 1
    category: ending
    disposition: fix
    note: |
      The piece ends with a dismissal rather than a landing. After discussing multi-phase
      planning and steering, "Good luck" leaves the reader hanging instead of reinforcing
      how pragmatic planning delivers the promised 2-3x improvement.
    suggestion: Extend the final thought to connect pragmatic planning back to the leverage benefit promised at the start.
  scores:
    order: 3
    coherence: 3
    opening: 2
    ending: 2
  notes: |
    The piece's core argument about pragmatic planning depth is sound, but structural
    choices—a throat-clearing opening, a missing transition between sections, and an
    abrupt ending—prevent it from holding together in one read. The fixes are editorial
    and moderate; they would sharpen how the piece earns its claims.
craft:
  result: changes_required
  findings:
  - severity: major
    article: pragmatic-leverage
    locator: The tradeoff between planning depth and expected rework | This is what we mean by leverage, and it requires being pragmatic. | 1
    category: weak_close
    disposition: editor_decision
    note: |
      The final section restates the thesis without advancing it. "This is what we mean by leverage, and it requires being pragmatic" simply re-announces what the reader has just finished understanding through fourteen preceding sentences. The long sentence that follows elaborates the application ("If you're doing multiple phases of planning, zooming in from 50kft view all the way to the 10kft view...") but adds no new perspective beyond what was already demonstrated. "Good luck." offers nothing—no clarity, curiosity, or sense of earned perspective. Against the Final Editing Test, the closing does not leave the reader with more clarity, perspective, or curiosity; it retreads ground. The remedy is an editor's: cut the restatement entirely and either end on a line that grounds the planning principle in the reader's own decision-making, or remove the final section entirely.
  scores:
    voice: 3
    sentence_variety: 3
    economy: 2
  notes: |
    The piece demonstrates the leverage principle convincingly through the middle section, with clear examples and a grounded tradeoff. The closing undoes this momentum by restating the main idea without earning the repetition, then dismissing. A reader could finish without any new framework or perspective shift—only confirmation of what they already understood.
