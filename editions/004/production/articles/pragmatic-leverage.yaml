  notes: "## Why this is a reprint\n\nAccess. The source is an X article behind authentication: `record.yaml`\
    \ records the\nextraction as \"Transcription from the authenticated rendered X article\". A reader\n\
    without an X session, or reading on paper, cannot open it. That is the whole\njustification and it\
    \ is the only one available; this piece buys no time, because\nit runs at Dex's length by design.\n\
    \n## The one line the final pass demands\n\nA reader gains Dex's argument, complete and in his own\
    \ words, from a page they\ncannot otherwise open, with the two diagrams he drew set beside the paragraphs\n\
    they belong to.\n\n## What was removed\n\nChrome only, four items:\n\n1. The `dex / @dexhorthy` handle\
    \ block at the top of the X page. The byline and\n   author note live in the `edition.yaml` row.\n\
    2. The `# Pragmatic Leverage in the Software Factory` H1. The title is set by the\n   illustrated\
    \ opener; the format forbids an H1 here.\n3. The bold `**note**` label in front of the \"I'm gonna\
    \ blur\" paragraph. See the\n   next section: this is the one deletion that matters.\n4. Nothing else.\
    \ No paragraph of Dex's argument was cut, no sentence reordered.\n\n## The apparatus ban, and what\
    \ it cost the last version\n\nThe owner's complaint about the previously shipped draft\n(`editions/004/articles/pragmatic-leverage.md`,\n\
    516 words) was \"soooo robotic and long for what Dex is trying to say\". The robotic\npart was not\
    \ Dex. It was a 40-word `**Editor's note.**` about publishing logistics\nand a glossary of \"factory\"\
    \ and \"levels\", sitting between the reader and the first\nreal sentence, plus a second `**Author's\
    \ note.**` label invented inside the body.\n\nBoth are gone and neither may come back. The rule now\
    \ is flat: no editor's note, no\nauthor's note, no bracketed gloss, no labeled aside, nothing.\n\n\
    **The context the editor's note carried is now carried by Dex.** That note existed\nbecause the previous\
    \ draft had deleted Dex's own first paragraph, which says the\nsame thing better and in his voice:\
    \ that this is an addendum to the series, that it\ndid not fit the main post, and that *Why Software\
    \ Factories Fail part 2: Turning the\nlights back on* is where it is referenced. Restoring his paragraph\
    \ as the opener\nretires the note without losing anything the note was for. The only piece of the\
    \ old\nnote not recovered is its gloss of \"factory\" and \"levels\", and that is deliberate:\nDex's\
    \ own text teaches both in use (\"yolo a two-sentence prompt into your factory\",\n\"zoom down a level\
    \ to the technical details\", \"50kft view all the way to the 10kft\nview\"), and a reader survives\
    \ meeting a term in a sentence that shows it working.\n\nThe `**note**` label came off the \"I'm gonna\
    \ blur\" paragraph for the same reason. The\nparagraph is Dex's and stays verbatim; only the label\
    \ goes. Unlabeled, it reads as\nwhat it is, a caveat in the middle of his own argument, which is how\
    \ it would read\nif he had said it out loud.\n\nOpener check: `mag fit` reports 3 of 7 typeset lines,\
    \ 235 characters. Comfortable, and\nthe whole thought fits, so no continuation was needed in the second\
    \ paragraph.\n\n## Fidelity repairs, itemized, so the next reviser can audit them fast\n\nThe audit\
    \ of the shipped version found two fabrications and one softened number. Every\nchange below is typographic\
    \ or grammatical; none touches a value, and no link exists\nanywhere in this manuscript.\n\n- **Every\
    \ number reproduced exactly**: 25–50%, 2–4 hours, 10–20 minutes, 2–3x, ~50%,\n  50%, 10 years, 100\
    \ repos, 10%, 50%, 6 hours, 80%, 10 minutes, 50kft, 10kft. Note\n  particularly the **10% chance**\
    \ of having to redo something significant. The\n  originally shipped edition-004 version\n  (`editions/004-the-systems-around-the-model/articles/pragmatic-leverage.md`,\
    \ line 21)\n  turned it into \"a meaningful chance\", which is the softened number the audit found.\n\
    \  It is the number the 80/20 argument rests on: it is what an afternoon of hand-written\n  spec buys\
    \ against the ~50% a two-sentence prompt buys. If it goes vague the section\n  has no shape. Do not\
