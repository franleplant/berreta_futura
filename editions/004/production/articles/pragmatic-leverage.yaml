    \ and the piece sits beside `factory-systems-problem`; the term arrives in a\n   sentence that shows\
    \ what you do with one.\n\n## Length\n\n480 body words, against a ceiling of 7 A5 pages that would\
    \ allow something like 1,100.\nLength is an output here, not a target: `faithful_edit` runs at the\
    \ source's length and\nthe source is a short post. Dex's own body is 482 words; this is 480 of them,\
    \ which is\nthe floor for this mode.\n\nThe arithmetic against the previous draft is worth writing\
    \ down, because the raw\ndelta looks small and is not. On `wc -w` of the whole file the shipped version\
