    of editor's-note and author's-note apparatus came out, and 40 words of Dex's own\ndeleted opening\
    \ paragraph went back in. The piece is not 23 words tighter, it is 65\nwords less robotic and 40 words\
    \ more Dex, and the second number is the one the owner\nwas complaining about without saying so.\n\
    \nThere is no room to go shorter without cutting Dex's argument, which this mode forbids,\nand no\
    \ reason to go longer. If a later round is asked to cut further, the honest answer\nis that the mode\
