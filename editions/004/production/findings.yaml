  note: 'The owner read this piece in print and rejected its capitalization directly, quoting a sentence
    that opens with a lowercase ''the'' and saying it should be ''The'', then adding that there are a
    lot of these dumb capitalization problems. Sentence-initial capitals are required in the printed magazine.
    Huntley''s lowercase is his register on X, where it reads as speed; set on an A5 page under a display
    title and a byline it reads as broken typesetting, and the owner is the one reading the page. Capitalize
    the first word of every sentence, and leave everything else of his intact: his diction, his profanity,
    his sign-offs, his handles, his line breaks. Do not solve this by making the piece uniformly lowercase,
    which is the current draft''s approach and is not what was asked for.'
  suggestion: Capitalize sentence-initial words throughout the body while preserving every other characteristic
    of the author's prose.
