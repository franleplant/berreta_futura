    article: factory-systems-problem
    locator: '- | Software factories are super real, but we need to be realistic. | 1'
    repair_from: '- | Software factories are super real, but we need to be realistic. | 1'
    category: no_position
    disposition: fix
    note: |
      The manuscript joins three posts into a readable through-line, but its claims and ordering remain the sources' own; it offers no editorial judgment, cut it defends, or distinct claim for this magazine.
    suggestion: Add a brief framing sentence that states the piece's own judgment about why the systems thesis and deterministic orchestration recommendation belong together.
  omissions:
  - fact: The source posts' platform-native formatting, including lowercase presentation and emphasis markers.
    reader_loses: No substantive idea, caveat, identifier, or operational detail; these marks do not carry meaning for a print reader.
    verdict: defensible
  retentions:
  - passage: The opening paragraph's inventory of sandboxing, monorepos, reproducible builds, CI/CD, identity and secret management, and agent-focused DevEx.
    costs: A substantial paragraph, but it supplies the concrete systems scope behind the thesis.
    verdict: earns_place
  - passage: The paragraph stressing that factories are not a token or LLM problem.
    costs: A short restatement that makes the central thesis unmistakable.
    verdict: earns_place
  - passage: The n8n/service-bus paragraph naming MassTransit, NServiceBus, WCF, and Temporal.
    costs: A full paragraph, but it turns the abstract systems argument into an actionable architectural recommendation.
    verdict: earns_place
  notes: Changes required because the piece synthesizes the sources effectively but does not yet make an editorial position of its own.
