craft:
  result: changes_required
  findings:
  - severity: minor
    article: factory-systems-problem
    locator: '- | Software factories are super real, but we need to be realistic. | 1'
    category: weak_opening_sentence
    disposition: fix
    note: |
      The opening repeats "real" and "realistic" while announcing the subject instead of beginning with the argument.
    suggestion: |
      Open with the concrete claim that factory reliability has not yet been solved.
  - severity: major
    article: factory-systems-problem
    locator: '- | Taken together, these posts make one case: factory reliability depends on deterministic systems around the model, so orchestration belongs in the architecture discussion. | 1'
    category: no_voice
    disposition: fix
    note: |
      This added synthesis switches from the author's blunt, specific voice to polished abstraction: "make one case," "depends on deterministic systems," and "belongs in the architecture discussion" could have been written by any system.
    suggestion: |
      Replace this summary with a concrete statement tied to the factory and service-bus examples.
  - severity: major
    article: factory-systems-problem
    locator: '- | The practical takeaway is to keep the factory’s infrastructure deterministic and let agents run inside it as processes. | 1'
    category: weak_close
    disposition: fix
    note: |
      The final sentence restates the preceding editorial synthesis rather than leaving a sharper implication or question.
    suggestion: |
      End on the operational warning about keeping the service bus deterministic.
  - severity: minor
    article: factory-systems-problem
    locator: '- | The best practices right now are to build the abstractions and pieces needed for sandboxing, monorepos, reproducible builds, CI/CD, identity and secret management, and smashing corporate friction in the realm of DevEx for agents. | 1'
    category: jargon
    disposition: fix
    note: |
      "DevEx" appears without definition, and the surrounding abstraction makes the sentence harder to parse for an engineer outside this subfield.
    suggestion: |
      Spell out "developer experience" on first use and tie it to one observable factory practice.
  notes: |
    I heard a forceful, idiosyncratic voice in the sourced passages, interrupted by two polished editorial summaries that flatten the ending.
