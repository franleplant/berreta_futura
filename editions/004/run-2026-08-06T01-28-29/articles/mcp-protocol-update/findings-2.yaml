    The piece presents a coherent progression from stateless transport through extensions, compatibility changes, and a controlled breaking release.
craft:
  result: changes_required
  findings:
  - severity: minor
    article: mcp-protocol-update
    locator: Extensions leave the basement | Extensions leave the basement | 1
    category: dead_words
    disposition: fix
    note: |
      The heading's basement metaphor is not developed beyond the heading and does not name the concrete change: extensions now have a formal process, repositories, versioning, and maintainers.
    suggestion: |
      Replace it with a heading that names the formalization of extensions.
  - severity: minor
    article: mcp-protocol-update
    locator: Security and compatibility | Six authorization SEPs bring MCP closer to deployed OAuth 2.0 and OpenID Connect practice. | 1
    category: jargon
    disposition: author_decision
    note: |
      "SEP" is used as a protocol-specific acronym before the piece explains what it means, leaving an engineer outside the MCP subfield to infer it.
    suggestion: |
      Expand "SEP" on first use or add a brief definition.
  notes: |
    I heard a precise, confident technical voice throughout, with two small places where the prose asks the reader to supply context or accept a decorative metaphor.
