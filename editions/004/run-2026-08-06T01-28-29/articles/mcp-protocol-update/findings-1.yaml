craft:
  result: changes_required
  findings:
  - severity: major
    article: mcp-protocol-update
    locator: A controlled break | The release candidate was locked on May 21, 2026. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Three consecutive sentences use ownerless passive constructions: "The release candidate was locked on May 21, 2026," "The final specification is scheduled for July 28," and "Tier 1 SDKs are expected to support it during that window." The bureaucratic rhythm briefly replaces the otherwise direct voice; revise or cut the passage.
  - severity: minor
    article: mcp-protocol-update
    locator: Security and compatibility | Six authorization SEPs bring MCP closer to deployed OAuth 2.0 and OpenID Connect practice. | 1
    category: jargon
    disposition: fix
    note: |
      "SEPs" is used before it is defined, leaving readers outside the MCP community to infer the acronym. Define it at first mention.
  notes: I heard a confident, operationally grounded account whose voice holds until a brief bureaucratic cluster near the end and one unexplained acronym interrupts the flow.
