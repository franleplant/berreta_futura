  article: mcp-protocol-update
  locator: The session disappears | Protocol version, client information, and capabilities now travel in `_meta` on each request. | 1
  repair_from: The session disappears | Protocol version, client information, and capabilities now travel in `_meta` on each request. | 1
  category: lost_essential_fact
  disposition: fix
  note: |
    The source's stateless request still carries the required `MCP-Protocol-Version`
    header; only client information and capabilities move into `_meta`. As written,
    the sentence misstates where protocol version is transmitted and makes the
    transport description misleading.
  suggestion: Separate the protocol-version header from the client information and capabilities carried in `_meta`.
