worth:
  result: approved
  findings: []
  omissions:
  - fact: 'The broader MCP project scope: specification, SDKs, development tools, and reference server implementations.'
    reader_loses: Little for this conceptual explainer; implementation resources remain outside the article's purpose.
    verdict: defensible
  - fact: Concrete examples involving Claude Code, Claude Desktop, Sentry, and filesystem servers.
    reader_loses: Named ecosystem examples, but not the host/client/server distinction.
    verdict: defensible
  - fact: HTTP authentication options such as bearer tokens, API keys, custom headers, and the OAuth recommendation.
    reader_loses: Specific security implementation guidance.
    verdict: defensible
  - fact: 'Client primitives: elicitation, deprecated sampling and logging, and the Tasks extension.'
    reader_loses: Advanced server-to-client interaction and extension vocabulary beyond the article's tool/data focus.
    verdict: defensible
  - fact: Pagination cursors, result caching fields, TTL, and cache scope for tools/list.
    reader_loses: Implementation details for large or cacheable tool registries.
    verdict: defensible
  - fact: The exact discovery error name and the complete JSON request and response fields.
    reader_loses: Copy-ready protocol examples and precise error vocabulary.
    verdict: defensible
  - fact: The subscription acknowledgment method and the server's filtering of unsupported notification types.
    reader_loses: Detailed subscription-handshake behavior.
    verdict: defensible
  - fact: Notification benefits such as efficiency, consistency, dynamic environments, and extension to other primitives.
    reader_loses: Some explicit justification for the update mechanism, though its purpose and limitations remain clear.
    verdict: defensible
  retentions:
  - passage: An AI application needs a weather answer.
    costs: A short illustrative setup that makes the protocol flow concrete and supplies the article's recurring example.
    verdict: earns_place
  - passage: Picture Visual Studio Code as the host.
    costs: A concrete anchor for the otherwise abstract participant model.
    verdict: earns_place
  - passage: The important boundary is deliberate.
    costs: A concise statement of MCP's scope that prevents readers from attributing model orchestration behavior to the protocol.
    verdict: earns_place
  - passage: The result is a small, inspectable contract.
    costs: A brief closing synthesis that turns the preceding mechanics into a memorable takeaway.
    verdict: earns_place
  notes: |
    This piece gives the reader a single weather-server narrative that makes host/client/server boundaries, stateless per-request metadata, primitive discovery, and opt-in updates legible in one compact explanation.
