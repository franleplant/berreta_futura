    locator: '- | The arithmetic comparison is startling. | 1'
    category: dead_words
    disposition: fix
    note: |
      This announces the reader's reaction instead of letting the parameter comparison create it. Remove the sentence or replace it with the concrete consequence of the comparison.
    suggestion: Cut the sentence and move directly to the question of what happens when the cache cannot keep growing.
  - severity: minor
    article: from-gpt2-to-kimi3
    locator: Folding history into a fixed state | There is a trade-off. | 1
    category: dead_words
    disposition: fix
    note: |
      This is a portentous two-word abstraction that merely labels the concrete interference problem explained in the next sentences.
    suggestion: Delete it and let the following explanation state the trade-off directly.
  - severity: minor
    article: from-gpt2-to-kimi3
    locator: KimiK3 uses several kinds of memory | The experts use SiTU rather than the usual SiLU path. | 1
    category: jargon
    disposition: fix
    note: |
      SiTU is named but never defined; comparing it with SiLU does not tell a competent engineer outside this subfield what operation changed.
