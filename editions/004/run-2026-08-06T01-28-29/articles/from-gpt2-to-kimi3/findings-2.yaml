mechanics:
  result: changes_required
  findings:
  - severity: major
    article: from-gpt2-to-kimi3
    locator: KimiK3 uses several kinds of memory | Without a fused kernel, the new activation is almost three times slower, while operating in a compressed latent space nearly halves the expert forward-pass FLOPs. | 1
    category: grammar
    disposition: fix
    note: |
      The "while operating" clause grammatically makes "the new activation" the subject of "nearly halves," producing an unintended or unclear attachment. The sentence is editors' prose in faithful_synthesis.
    suggestion: Without a fused kernel, the new activation is almost three times slower; operating in a compressed latent space, however, nearly halves the expert forward-pass FLOPs.
  notes: |
    One grammatical attachment error requires correction; capitalization, punctuation, typography, headings, and number formatting are otherwise clean.
