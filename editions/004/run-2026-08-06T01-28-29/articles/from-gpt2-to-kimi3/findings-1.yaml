craft:
  result: changes_required
  findings:
  - severity: major
    article: from-gpt2-to-kimi3
    locator: KimiK3 uses several kinds of memory | KDA supplies constant-state recurrent memory. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Three consecutive sentences use the same compact subject-verb-object shape:
      "KDA supplies constant-state recurrent memory."
      "Periodic MLA layers retain full softmax retrieval over the token context, recovering information that a fixed state must eventually discard."
      "Gated MLA controls how much of each retrieved feature enters the residual stream."
      The paragraph reads like a component inventory rather than a person explaining the mechanism.
  - severity: minor
    article: from-gpt2-to-kimi3
    locator: Folding history into a fixed state | The gain exposes the cost. | 1
    category: dead_words
    disposition: fix
    note: |
      This portentous short sentence names a cost without identifying it; the next
      sentence does the actual explanatory work.
  - severity: minor
    article: from-gpt2-to-kimi3
    locator: KimiK3 uses several kinds of memory | The experts use SiTU rather than the usual SiLU path. | 1
    category: jargon
    disposition: fix
    note: |
      "SiTU" is an unexplained subfield term. A competent engineer outside this
      area cannot infer what the activation is or why the distinction matters.
  notes: I heard a strong, concrete technical voice that briefly hardened into component-list cadence and a few compressed labels.
