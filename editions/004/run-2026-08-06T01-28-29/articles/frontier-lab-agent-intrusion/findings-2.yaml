craft:
  result: changes_required
  findings:
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: The asymmetry | Isolate evaluations. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      The closing paragraph stacks four imperative fragments in the same shape:
      "Isolate evaluations." "Narrow trust boundaries." "Block metadata access."
      "Use short-lived, scoped credentials." The checklist cadence makes the
      ending sound like an operational system rather than a person concluding
      an argument.
    suggestion: Cut or combine at least two of the imperatives so the ending returns to prose.
  notes: |
    I heard a precise, human forensic voice throughout, but the final checklist compresses its conclusion into a repeated command pattern.
