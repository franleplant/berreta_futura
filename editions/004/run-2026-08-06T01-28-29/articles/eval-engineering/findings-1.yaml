shape:
  result: changes_required
  findings:
  - severity: major
    article: eval-engineering
    locator: '- | A travel agent answered a simple trip question with an exchange rate, a weekly temperature, and museum hours. | 1'
    repair_from: '- | A travel agent answered a simple trip question with an exchange rate, a weekly temperature, and museum hours. | 1'
    category: running_example
    disposition: fix
    note: |
      The travel-agent incident establishes the piece, but the later sections move through unrelated PRs, traces, and company examples without returning to it. The argument therefore accumulates examples instead of letting one case carry the operational steps.
    suggestion: Carry the travel-agent trace through test design, routing, and gating, or replace it with one case that can demonstrate each step.
  - severity: major
    article: eval-engineering
    locator: The afternoon that compounds | The teams that move first will pull 25 traces, build one eval, and add another whenever something breaks. | 1
    repair_from: 'Let failures choose the tests | A practical starting set has 25 complete traces, chosen so good and bad behavior sit close together: a normal successful request, one the user confirmed, one the user corrected or rephrased, one with a failed or repeated tool call, and one with an external timeout or rate limit. | 1'
    category: duplication
    disposition: fix
    note: |
      The recommendation to begin with 25 traces appears in the failure-driven test section and is repeated in the closing paragraph. The repeated number and instruction make the ending restate an earlier step.
    suggestion: Keep the detailed 25-trace prescription in the test-building section and end with the broader compounding lesson.
  - severity: minor
    article: eval-engineering
    locator: 'The afternoon that compounds | Begin with three measurements for a tool-using agent: faithfulness to returned data, tool-parameter accuracy, and response quality. | 1'
    repair_from: 'The afternoon that compounds | Begin with three measurements for a tool-using agent: faithfulness to returned data, tool-parameter accuracy, and response quality. | 1'
    category: heading_not_a_claim
    disposition: fix
    note: |
      This heading is atmospheric rather than argumentative. The section's claim is that teams should start with a deliberately bounded eval suite and five common failure edges.
    suggestion: Rename the section to state its claim, such as 'Start with five failure-edge evals.'
  notes: I verified that the piece's main progression from incident to evaluation loop, routing, test construction, gating, and implementation is recoverable, but the running example, repeated 25-trace instruction, and final section heading weaken its structure.
craft:
  result: changes_required
  findings:
  - severity: blocking
    article: eval-engineering
    locator: The judge needs rules too. | Use a model from another family when possible, because a model tends to recognize and grade its own style kindly. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      The paragraph becomes a six-sentence run of bare imperatives: "Use a model from another family when possible"; "Write one observable pass condition rather than a bundle of proxy scores"; "Let ordinary code check objective facts such as whether a test passed, a file exists, or state changed"; "Do not reward response length, keywords, citation counts, exact phrasing, or similarity to a reference"; "Pin the judge's version and log it"; and "Optimize against a judge long enough and the agent learns to look right rather than be right." The repeated command shape makes the prose sound like a checklist instead of a person making an argument.
    suggestion: Break the run by combining the rules into prose and retaining only the most consequential imperative.
  - severity: minor
    article: eval-engineering
    locator: 'Make the verdict move the run | The useful verdicts are routing decisions: low context recall rejects a handoff; bad tool use retries or swaps a node; hallucination quarantines a branch; a schema failure blocks an edge; a compliance risk routes to human review; verified completion terminates the run. | 1'
    category: jargon
    disposition: fix
    note: |
      "Context recall" is a specialized evaluation term that is not defined before it drives a routing decision. A competent engineer outside this subfield may not know whether it means retrieval coverage, prompt context, or something else.
    suggestion: Define context recall briefly at first use or replace it with the observable failure it measures.
  notes: I heard a confident, mechanism-first voice that is strongest in its concrete examples, but the judge-rules paragraph collapses into checklist prose and leaves one evaluation term unexplained.
