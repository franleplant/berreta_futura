craft:
  result: changes_required
  findings:
  - severity: minor
    article: pragmatic-leverage
    locator: Steer as you zoom in | Planning has levels. | 1
    category: dead_words
    disposition: fix
    note: |
      This portentous two-word sentence states an abstraction without giving the reader anything to see; the following sentence does the useful work.
    suggestion: |
      Cut it and begin with the concrete movement between planning levels.
  - severity: minor
    article: pragmatic-leverage
    locator: Pragmatic Leverage in the Software Factory | software factory | 1
    category: jargon
    disposition: fix
    note: |
      "Software factory" is central but undefined, and an engineer outside this subfield may not know whether it means a team, workflow, or tool.
    suggestion: |
      Define the term on first use or replace it with the concrete process being described.
  - severity: minor
    article: pragmatic-leverage
    locator: '- | Planning with AI can therefore produce something closer to a two- or threefold gain. | 1'
    category: dead_words
    disposition: fix
    note: |
      "Therefore" and "something closer to" add hedging and abstraction without sharpening the estimate.
    suggestion: |
      State the estimated gain directly, with uncertainty expressed once.
  notes: |
    I heard a clear, practical argument whose cadence briefly turns generic when it names abstractions instead of showing the work.
