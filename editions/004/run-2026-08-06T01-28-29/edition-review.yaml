notes: |
  This issue argues that dependable AI systems require explicit memory, evaluation gates, and routable state, and it mostly holds together. Changes are required because two pieces do not feed the editorial, one commission is weak, the MCP pair is redundant, and one piece is a strong voice and mode outlier.
