craft:
  result: changes_required
  findings:
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: The chain inside | We had no admission policy rejecting privileged or `hostPath` pods, and the CSI storage driver's cluster role allowed pod creation across the cluster. | 1
    category: jargon
    disposition: fix
    note: |
      `hostPath` and the CSI storage driver's cluster role are specialized terms
      that the piece does not define.
    suggestion: Define `hostPath` and the CSI driver at first use.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: The chain inside | Mutating cloud calls were denied. | 1
    category: passive
    disposition: fix
    note: |
      The sentence omits who or what denied the calls, leaving the security
      boundary less precise than the surrounding account.
    suggestion: Name the policy or control that denied the calls.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: The chain inside | The dangerous build-script pivot was blocked, and repository and image reviews found no unauthorized change that shipped. | 1
    category: passive
    disposition: fix
    note: |
      "Was blocked" hides the actor responsible for the most consequential
      defensive outcome in this sentence.
    suggestion: Identify the control or reviewer that blocked the pivot.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: What changed | HDF5 external references are no longer processed as local reads, and template expressions in data fields are no longer evaluated. | 1
    category: passive
    disposition: fix
    note: |
      The remediation is stated without naming the component now enforcing it,
      making the change sound procedural rather than operational.
    suggestion: Name the service or validation layer that now rejects both paths.
  scores:
    voice: 4
    sentence_variety: 4
    economy: 4
  notes: |
    I heard a precise, human forensic voice that sustains tension through concrete
    mechanisms and a restrained joke; the main craft losses are a few unnamed
    defensive actors and specialized infrastructure terms left unexplained.
