craft:
  result: changes_required
  findings:
  - severity: blocking
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | If you're only using AI to write the code, then you're taking the 2-4 hours of coding time down to 10-20 minutes, but you haven't accelerated anything else here. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      A conditional if-clause recurs six times: "If you're only using AI to write the code, then you're taking the 2-4 hours of coding time down to 10-20 minutes, but you haven't accelerated anything else here"; "But if you use AI to help you plan and align, then you actually get closer to 2-3x faster"; "Let's assume that if you yolo a two-sentence prompt into your factory, your chance of getting a fully-mergeable result is ~50%"; "What you don't want to do is spend 6 hours planning a task for which you could have eliminated 80% of the expected pain in the first 10 minutes"; "if you've done some work at the 'Product' level and have not answered all the open questions yet, it's possible you may need to end it where you are"; and "If the model is 50% likely to get a button style wrong, but the fix is one cheap prompt, then our combined 'expected pain' is low." The pattern becomes audible before the argument develops. Cut or recast two of these conditional sentences.
  - severity: minor
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | For this example I'm gonna blur | 1
    category: dead_words
    disposition: fix
    note: |
      "Obviously" is an empty intensifier in "but obviously they're two separate variables."
    suggestion: Remove "obviously."
  scores:
    voice: 4
    sentence_variety: 2
    economy: 3
  notes: |
    The piece sounds like a technically experienced person until its repeated conditional sentences make the prose feel patterned and procedural.
