worth:
  result: approved
  findings: []
  omissions:
  - fact: The source's standalone @dexhorthy handle
    reader_loses: The author's social identifier, though the manuscript retains the author's name.
    verdict: defensible
  retentions:
  - passage: This one is a bit of an addendum / side-quest...
    costs: A short preamble, but it explains the post's standalone status and connection to the series.
    verdict: earns_place
  - passage: Even before AI, only 25-50%...
    costs: The quantitative premise that planning, review, and verification dominate coding time.
    verdict: earns_place
  - passage: If you're only using AI to write...
    costs: The distinction between accelerating coding and accelerating delivery.
    verdict: earns_place
  - passage: But if you use AI to help...
    costs: The central claim that planning and alignment produce roughly 2-3x speed.
    verdict: earns_place
  - passage: Lets assume if you yolo...
    costs: The baseline 50% rework model.
    verdict: earns_place
  - passage: Now lets say you are a principal engineer...
    costs: The contrast between detailed planning and residual significant rework.
    verdict: earns_place
  - passage: 'And at the far end: write every line...'
    costs: The endpoint showing why removing agent contribution drives rework toward zero.
    verdict: earns_place
  - passage: For this example I'm gonna blur...
    costs: The caveat distinguishing probability of change from the pain of change.
    verdict: earns_place
  - passage: expected pain = P(you'll have to change it)...
    costs: The operational equation that defines expected pain.
    verdict: earns_place
  - passage: If you draw this out...
    costs: The inverse relationship between upfront effort and expected pain.
    verdict: earns_place
  - passage: What you don't want to do...
    costs: The concrete six-hour versus ten-minute planning tradeoff.
    verdict: earns_place
  - passage: You need to do this without overindexing...
    costs: The guidance to zoom from product questions into technical feasibility when needed.
    verdict: earns_place
  - passage: This is what we mean by leverage...
    costs: The practical steering rule for multi-phase planning.
    verdict: earns_place
  - passage: good luck.
    costs: A negligible sign-off with no substantive burden.
    verdict: earns_place
  notes: 'This faithful edit gives readers a durable, legible version of an ephemeral X post while preserving its concrete leverage model: the 25-50% coding share, the 2-4-hour to 10-20-minute comparison, the expected-pain equation, and the product-to-technical planning example. The manuscript follows the source''s sequence by design, and every substantive passage earns its place.'
