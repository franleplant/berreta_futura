worth:
  result: approved
  findings: []
  omissions:
  - fact: 'The opening framing that this was an addendum or side-quest to a recent series, published standalone because it did not fit cleanly, and briefly referenced in ''Why Software Factories Fail part 2: Turning the lights back on.'''
    reader_loses: Some publication context and a pointer to related work, but not the argument or its practical guidance.
    verdict: defensible
  - fact: The source's author handle, '@dexhorthy.'
    reader_loses: Nothing substantive; the manuscript supplies the byline separately.
    verdict: defensible
  - fact: The source's explicit '**note**' label before the expected-pain caveat.
    reader_loses: Only a label; the caveat and its example remain.
    verdict: defensible
  retentions:
  - passage: Even before AI, only 25-50% of the time to ship a feature...
    costs: Space spent establishing the central distinction between coding speed and the planning, review, and verification work that determines delivery speed.
    verdict: earns_place
  - passage: Let's assume that if you yolo a two-sentence prompt...
    costs: Space spent on the concrete probability ladder from a loose prompt to detailed planning to writing every line.
    verdict: earns_place
  - passage: expected pain = P(you'll have to change it) × how painful the change is
    costs: Space spent on the piece's key operational model for deciding how much up-front effort is worthwhile.
    verdict: earns_place
  - passage: You need to do this without overindexing on questions...
    costs: Space spent on the practical steering rule for zooming from product questions into technical details only as needed.
    verdict: earns_place
  - passage: Good luck.
    costs: A sign-off that adds no information; its space could be removed without loss.
    verdict: cut
  notes: |
    Approved because the manuscript makes the ephemeral X article's argument directly readable while preserving its concrete percentages, expected-pain equation, planning trade-off, and pragmatic zooming guidance. The omissions are contextual or presentational, and the retained passages carry the source's full practical substance; only the closing sign-off could be cut. As a faithful edit, preserving the source's order is appropriate, and the piece retains a clear position: leverage comes from steering planning and alignment, not merely generating code.
