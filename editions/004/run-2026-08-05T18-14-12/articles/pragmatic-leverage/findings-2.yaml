craft:
  result: changes_required
  findings:
  - severity: major
    article: pragmatic-leverage
    locator: Seeking leverage | If you're only using AI to write the code, then you're taking the 2-4 hours of coding time down to 10-20 minutes, but you haven't accelerated anything else here. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Five conditional constructions make the piece's reasoning sound patterned:
      "If you're only using AI...", "But if you use AI...", "Let's assume that if
      you yolo...", "If you draw this out...", "if you've done some work...", and
      "If you're doing multiple phases...". The author's idiom is protected, but
      this monotony is an editorial problem; cut or recast at least two of these
      sentences.
  scores:
    voice: 4
    sentence_variety: 2
    economy: 4
  notes: |-
    I heard a clear, practical person throughout, but the repeated conditional
    sentence shape begins carrying the argument more visibly than the prose does.
