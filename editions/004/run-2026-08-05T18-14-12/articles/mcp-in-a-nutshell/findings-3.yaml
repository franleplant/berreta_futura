shape:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | When a server''s tools change, the client can refresh its registry and notify an active conversation of the new capabilities. | 1'
    repair_from: '- | The client then sends `tools/list` again and refreshes its registry. | 1'
    category: duplication
    disposition: fix
    note: |
      The notification section already explains that a tool-list change triggers a
      fresh `tools/list` call and registry refresh; the ending repeats that
      explanation before adding the conversation update.
    suggestion: Keep the detailed refresh mechanics in the notifications section and make the ending land on the application's continuing responsibility.
  scores:
    order: 4
    coherence: 4
    opening: 4
    ending: 3
  notes: |
    I verified that the piece moves coherently from MCP's exchange model through primitives, architecture, transport, discovery, notifications, and client-side extensions, with a duplicated registry-refresh explanation weakening the close.
craft:
  result: changes_required
  findings:
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | MCP primitives are the most important concepts within MCP. | 1'
    category: dead_words
    disposition: fix
    note: |
      "Most important concepts" is an unsupported superlative and repeats MCP without helping the reader. Cut the sentence and begin with "Servers can expose tools, resources, and prompts."
    suggestion: Cut the sentence.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | The application is the MCP host. | 1'
    category: dead_words
    disposition: fix
    note: |
      This definite-article equation has the flat, glossary-like sound of the specification register.
    suggestion: Fold the definition into the following sentence so the role is introduced through its action.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | MCP has two layers. | 1'
    category: no_voice
    disposition: fix
    note: |
      The paragraph beginning here shifts into an even specification inventory of layers, message formats, and transports; the explanatory person disappears behind the taxonomy.
    suggestion: Recast the paragraph around the concrete difference between a message and the channel carrying it.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | The data layer defines JSON-RPC 2.0 messages, version and capability discovery, and the primitives clients and servers can offer. | 1'
    category: jargon
    disposition: fix
    note: |
      JSON-RPC 2.0, Streamable HTTP, Server-Sent Events, and OpenTelemetry appear without definitions that an engineer outside this subfield could use.
    suggestion: Define each necessary term at first use and remove peripheral terms that the explanation does not need.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | The protocol keeps that exchange current; the application still decides what the model does with it. | 1'
    category: weak_close
    disposition: fix
    note: |
      The closing sentence restates the notification mechanism and the application's role instead of leaving the reader with a new implication or question.
    suggestion: End on a consequence of keeping capabilities current rather than repeating the division of responsibilities.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | The protocol keeps that exchange current; the application still decides what the model does with it. | 1'
    category: dead_words
    disposition: fix
    note: |
      The balanced semicolon clause sounds like a packaged insight and adds little beyond the preceding sentences.
    suggestion: Replace it with one specific consequence or delete it.
  scores:
    voice: 3
    sentence_variety: 3
    economy: 3
  notes: |
    The piece is clearest when it shows a concrete client, server, and tool exchange, but it turns glossary-flat in the layers paragraph and closes by repeating its central division of labor.
