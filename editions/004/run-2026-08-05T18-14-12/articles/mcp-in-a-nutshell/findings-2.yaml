craft:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | Tools are executable functions for actions such as file operations, API calls, or database queries. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Three consecutive primitive definitions use the same definitional sentence shape: "Tools are executable functions...", "Resources provide contextual data...", and "Prompts are reusable templates...". The pattern becomes audible before the explanation moves on; vary or cut one of the definitions.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | MCP primitives are the most important concepts within MCP. | 1'
    category: dead_words
    disposition: fix
    note: |
      "The most important concepts" is an inflated, self-announcing lead-in that adds no information before the primitives are named.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | Streamable HTTP supports remote communication, HTTP authentication, and optional Server-Sent Events. | 1'
    category: jargon
    disposition: fix
    note: |
      "Streamable HTTP" and "Server-Sent Events" are named without enough explanation for an engineer outside this subfield to know what role each plays.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | New implementations should call language-model providers directly for completions and send logs to standard error or OpenTelemetry. | 1'
    category: jargon
    disposition: fix
    note: |
      "OpenTelemetry" is an unexplained tool name introduced in an otherwise accessible explanation.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | MCP gives an application a standard exchange for discovering and invoking context and actions, while leaving the application’s use of the model and that context as its own design problem. | 1'
    category: weak_close
    disposition: fix
    note: |
      The final sentence restates the opening claim that MCP standardizes discovery and action routing, then repeats the application's design responsibility without leaving a new implication or question.
  scores:
    voice: 4
    sentence_variety: 3
    economy: 4
  notes: This is a clear, technically grounded explainer, but its primitive definitions form an audible run and its ending circles back to the introduction instead of extending the reader's understanding.
