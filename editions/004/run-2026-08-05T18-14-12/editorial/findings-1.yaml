  findings:
  - severity: major
    article: the-shape-of-speed
    locator: '- | The agent made 17,600 actions, most failed, but one chain crossed Kubernetes and source control. | 1'
    category: punctuation
    disposition: fix
    note: |
      The sentence contains a comma splice between "17,600 actions" and "most failed." Separate the clauses or make the second an integrated phrase.
    suggestion: The agent made 17,600 actions; most failed, but one chain crossed Kubernetes and source control.
  scores:
    grammar: 4
    typography: 5
    consistency: 5
  notes: |
    Changes required because one sentence joins independent clauses with a comma splice; the remaining mechanics are clean.
shape:
  result: changes_required
  findings:
  - severity: major
    article: editorial
    locator: '- | In the intrusion, a shared connector and a stolen signing key converted context into cluster-admin access. | 1'
    repair_from: '- | A dataset file pointed its bytes at /proc/self/environ; a conversion worker opened it and returned secrets. | 1'
    category: running_example
    disposition: fix
    note: |
      The opening presents several incidents, then paragraph three refers to "the intrusion" as though one running case had been established. The reader must decide which event carries the argument, weakening continuity between the security example and the concluding principle.
    suggestion: Choose one incident as the running example and carry it consistently through the piece.
  scores:
    order: 4
    coherence: 3
    opening: 3
    ending: 4
  notes: |
    The piece moves from security incidents to software speed, MCP context, permissions, and a concluding principle, but its examples do not form one continuous case.
craft:
  result: changes_required
  findings:
  - severity: major
    article: editorial
    locator: '- | Cutting coding from hours to minutes helps less than steering the work before it starts. | 1'
    repair_from: '- | Cutting coding from hours to minutes helps less than steering the work before it starts. | 1'
    category: repeated_shape
    disposition: fix
    note: |
      Three balanced or contrastive sentence shapes cluster across the second and
      third paragraphs: "Cutting coding from hours to minutes helps less than
      steering the work before it starts"; "MCP lets servers list tools,
      resources, and prompts, while the host gathers them into a registry and
      routes the model's call"; and "Fresh listings and separate connections keep
      a client aligned with what a server can do, yet broad permissions turn
      alignment into reach." Recast at least one as a plain declarative sentence
      and split another to restore variety.
    suggestion: Recast the first sentence as a direct claim with a named actor and a different rhythm.
  - severity: major
    article: editorial
    locator: '- | The same machine-speed habit appears in ordinary software work. | 1'
    category: no_voice
    disposition: fix
    note: |
      The voice thins out here: "machine-speed habit" and "ordinary software work"
      are abstract labels, and the sentence could have been produced by any
      technical briefing. The concrete incident in the opening gives way to a
      system-like register.
    suggestion: Replace the abstraction with a concrete developer action or consequence.
  - severity: minor
    article: editorial
    locator: '- | A good plan lowers expected rework. | 1'
    category: dead_words
    disposition: fix
    note: |
      This is a portentous, ownerless maxim: it states a general truth without
      showing whose plan changes what work or how.
    suggestion: Name the planner and the specific rework the plan prevents.
  - severity: minor
    article: editorial
    locator: '- | Speed then has a shape. | 1'
    category: dead_words
    disposition: fix
    note: |
      The short sentence sounds like a polished insight but adds no mechanism or
      concrete meaning beyond the title.
    suggestion: Replace it with the operational consequence of keeping an agent's path observable.
  - severity: minor
    article: editorial
    locator: '- | Give an agent enough to act, keep the path current, and make each step leave evidence someone can inspect. | 1'
    category: passive
    disposition: fix
    note: |
      The ownerless imperative gives instructions without naming who is
      responsible for granting access, maintaining context, or collecting the
      evidence.
    suggestion: Name the responsible team or operator as the actor.
  - severity: minor
    article: editorial
    locator: '- | A connected AI application does the same with context: MCP lets servers list tools, resources, and prompts, while the host gathers them into a registry and routes the model''s call. | 1'
    category: jargon
    disposition: fix
    note: |
      "MCP," "host," and "registry" arrive as specialized terms without a
      plain-language definition for an engineer outside this subfield.
    suggestion: Define MCP on first use and gloss "host" and "registry" in the same sentence.
  - severity: minor
    article: editorial
    locator: '- | In the intrusion, a shared connector and a stolen signing key converted context into cluster-admin access. | 1'
    category: jargon
    disposition: fix
    note: |
      "Cluster-admin" is Kubernetes-specific jargon, and the sentence assumes the
      reader knows what level of authority it grants.
    suggestion: Add a brief gloss describing cluster-admin as control over the whole Kubernetes cluster.
  scores:
    voice: 3
    sentence_variety: 3
    economy: 3
  notes: |
    The piece begins with a human-scale breach but shifts into an abstract,
    briefing-like register where balanced clauses and undefined infrastructure
    terms carry too much of the explanation.
