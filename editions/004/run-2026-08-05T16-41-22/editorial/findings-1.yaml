  scores:
    order: 5
    coherence: 5
    opening: 5
    ending: 5
  notes: |
    The piece argues that a single principle—gates respond to request shape, not intent—manifests consistently across distinct incidents and remains unresolved. The opening establishes this principle through a compelling incident (models refusing to read breach logs), the second paragraph traces it backward to an earlier precedent (classifiers switched off for benchmarking) and names the design flaw explicitly, and the ending reveals that subsequent fixes treated symptoms rather than the root gate. The running example of the intent-blind gate carries throughout all three paragraphs, and the structure moves logically from concrete incident to pattern to unresolved problem. No duplications, orphan referents, or missing transitions.
