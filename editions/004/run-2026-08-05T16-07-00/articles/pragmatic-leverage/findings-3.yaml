worth:
  result: approved
  findings: []
  notes: |
    This is a faithful_edit of an X thread, an ephemeral source. The manuscript
    preserves Dex Horthy's complete framework for allocating planning effort in
    AI-assisted software delivery—specifically, that leverage comes from planning
    and alignment rather than faster code generation, and how to steer through
    multiple planning phases to minimize expected rework. Republishing an ephemeral
    thread gives readers permanent, discoverable reference to this operational
    thinking within the magazine, something the original thread cannot provide.
