    sentence_variety: 4
    economy: 4
  notes: |
    Conversational voice maintained throughout. The piece thinks operationally—showing where
    leverage actually lives (planning, not code-writing) and how to measure progress (expected
    pain, not effort spent). Concrete examples ground abstract reasoning, and the author stays
    pragmatic rather than prescriptive about method.
