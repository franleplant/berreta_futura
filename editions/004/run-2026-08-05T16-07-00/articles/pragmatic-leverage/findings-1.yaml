shape:
  result: changes_required
  findings:
  - severity: blocking
    article: pragmatic-leverage
    locator: '- | Apply your lens exactly as specified | 1'
    category: opening
    disposition: fix
    note: |
      The manuscript ends with: "Apply your lens exactly as specified. End your reply with the yaml findings block..." This is the shape-review prompt instruction itself, not content. It must be removed entirely.
    suggestion: Delete the final line entirely.
  - severity: major
    article: pragmatic-leverage
    locator: '- | This one is a bit of an addendum / side-quest to the recent Why Software Factories Fail series | 1'
    repair_from: '- | This one is a bit of an addendum | 1'
    category: furniture_placement
    disposition: fix
    note: |
      The editorial framing paragraph precedes the actual opening and prevents the piece from starting at its point of interest. The reader encounters context about the series it belongs to before encountering the piece's central claim. The real opening ("Even before AI, only 25-50%...") is buried below this preamble.
    suggestion: 'Move this paragraph to an editor''s note or preface. Let the piece open directly: ''Even before AI, only 25-50% of the time to ship a feature was writing the code itself.'''
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | Lets assume if you yolo a two-sentence prompt into your factory | 1
    repair_from: Seeking Leverage | But if you use AI to help you plan and align, then you actually get closer to 2-3x faster | 1
    category: missing_transition
    disposition: fix
    note: |
      Section 1 claims "2-3x faster" with planning. Section 2 opens with a probability model but never states it will prove or illustrate that claim. The reader cannot see how 50% rework with a yolo prompt, 10% with a spec, and the expected pain formula actually deliver 2-3x speedup.
    suggestion: 'After ''you actually get closer to 2-3x faster,'' add: ''This speedup comes from reducing costly rework. Here''s the math.'''
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | **note** For this example I'm gonna blur | 1
    repair_from: The 80/20 rule in AI coding leverage | Lets assume if you yolo a two-sentence prompt into your factory | 1
    category: running_example
    disposition: fix
    note: |
      The note block interrupts the probability model mid-example. The blockquote about blurring variables and the expected pain formula break the running example into pieces, forcing the reader to reconstruct it mentally. The example cannot carry the section when interrupted mid-stride.
    suggestion: 'Integrate this explanation into prose before the model: ''For simplicity, I''ll blur "chance of change" weighted by pain into one number—expected pain = P(change) × pain. Here''s what the curve looks like.'''
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | If you draw this out, there's an inverse relationship between effort invested up front and expected pain | 1
    repair_from: Seeking Leverage | But if you use AI to help you plan and align, then you actually get closer to 2-3x faster | 1
    category: argument_order
    disposition: fix
    note: |
      The 2-3x speedup claim from section 1 is never translated into the probability framework. After laying out the model, the piece pivots to "What you don't want to do is spend 6 hours planning" with reference to "80% of expected pain," but it never shows how the probabilities in the model produce 2-3x speedup or how the 80% threshold was derived.
    suggestion: 'After the 2-3x claim, bridge to the model: ''This speedup comes from eliminating the right portion of rework pain without over-investing upfront.'''
  - severity: major
    article: pragmatic-leverage
    locator: '- | You need to do this without overindexing on questions you won''t be able to answer without going down a level | 1'
    repair_from: '- | You need to do this without overindexing | 1'
    category: orphan_referent
    disposition: fix
    note: |
      "Overindexing" is used without definition and the sentence is difficult to parse ("without overindexing on questions you won't be able to answer without going down a level" is a double negative). The example about Product vs. Technical levels doesn't clearly show what overindexing means or how to avoid it. This concept is central to the closing guidance but remains opaque.
    suggestion: 'Define it plainly: ''Don''t try to answer every question at your current level. If you''re planning at the product level and hit open questions about feasibility, zoom down to the technical level to understand what''s possible, then return to product planning.'''
  - severity: minor
    article: pragmatic-leverage
    locator: Seeking Leverage | Seeking Leverage | 1
    category: heading_not_a_claim
    disposition: fix
    note: |
      The heading names the topic rather than the claim. The section argues that leverage comes from applying AI to planning, not just coding, and that this delivers 2-3x speedup.
    suggestion: 'Reframe as: ''Leverage lives in planning, not coding'' or ''Planning, not code-writing, is where AI multiplies your speed.'''
  - severity: minor
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | The 80/20 rule in AI coding leverage | 1
    category: heading_not_a_claim
    disposition: fix
    note: |
      The heading is descriptive but not claim-based. The section argues that upfront planning reduces rework pain with diminishing returns.
    suggestion: 'Reframe as: ''The diminishing returns of planning'' or ''How much planning is enough?'''
  - severity: minor
    article: pragmatic-leverage
    locator: '- | good luck | 1'
    category: ending
    disposition: fix
    note: |
      The piece ends with a sign-off rather than a landing. The closing should revisit the central insight, not trail off into encouragement.
    suggestion: 'Replace with a conclusion that lands the piece: ''That''s pragmatic leverage: steer at each level of planning, eliminate expected pain without over-investing upfront.'' Or remove the sign-off entirely.'
  scores:
    order: 2
    coherence: 2
    opening: 1
    ending: 2
  notes: |
    The piece attempts to argue that leverage in AI-assisted work comes from planning, not coding, and that the right amount of planning trades upfront effort against expected rework pain. The core claim (2-3x speedup) is well-stated but never reconciled with the probability model that follows. The opening is buried under editorial framing, the probability example is interrupted mid-stride by a note, and the closing guidance uses undefined jargon. These structural defects prevent the argument from working as a coherent whole in one read. The piece also contains editorial instruction text at its end that must be removed.
craft:
  result: changes_required
  findings:
  - severity: blocking
    article: pragmatic-leverage
    locator: Seeking Leverage | If you're only using AI to write the code | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Six conditional frames dominate the piece: "If you're only using AI to write the code, then you're taking" (Seeking Leverage); "But if you use AI to help you plan and align, then you actually get closer" (Seeking Leverage); "If the model is 50% likely to get a button style wrong, but the fix is one cheap prompt, then our combined 'expected pain' is low" (The 80/20 rule); "If you draw this out, there's an inverse relationship" (The 80/20 rule); "if you've done some work at the 'Product' level and have not answered all the open questions yet, its possible you may need to end it where you are" (The 80/20 rule); "If you're doing multiple phases of planning, zooming in from 50kft view all the way to the 10kft view, you want to do a little bit of steering" (The 80/20 rule). In roughly 550 words, this is the same concentration the magazine flagged in Edition 004 at blocking severity. The remedy is an editor's: cut two of them, restructure the piece shorter, or decide it does not belong in this form.
  scores:
    voice: 4
    sentence_variety: 2
    economy: 3
  notes: |
    This piece reads like a person working through operational judgment—clear examples, probabilistic reasoning, warm direct address—but the conditional frame repeats so often that the reader hears the structural pattern before the argument.
