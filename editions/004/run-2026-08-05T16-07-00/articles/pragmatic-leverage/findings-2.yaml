craft:
  result: changes_required
  findings:
  - severity: blocking
    article: pragmatic-leverage
    locator: Seeking leverage | If you're only using AI to write the code | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Six if-conditional sentence openings in ~500 words: "If you're only using AI to write," "But if you use AI," "if you yolo," "If the model is 50%," "if you've done some work," and "If you're doing multiple phases." The shape carries the argument across the entire piece, reducing the reader's attention from the reasoning to the pattern. The remedy is an editor's decision: revise several conditionals to different structures, condense sections, or reconsider scope.
  scores:
    voice: 4
    sentence_variety: 2
    economy: 4
  notes: |
    Voice and characterization are strong—asides like "yolo" and the closing shrug deliver authorial personality. The writing is economical and jargon-free. The cost is sentence shape: the same conditional structure carries too much of the argument, and by the piece's middle the reader is pattern-matching rather than following reasoning.
