  findings: []
  notes: |
    The forensic account preserves the complete attack chain—escape, two
    exploitation vectors, lateral movement escalation, and defensive lessons—
    while presenting it in clearer narrative structure than the source. Editorial
    judgment is sound: the novel evasion techniques (socket monkeypatching, mesh
    enrollment, object graph traversal) receive full code treatment, while basic
    exploit mechanics (C code, Jinja2 payloads) are explained in prose
    sufficient for understanding but not replication. The cutting does not
    prevent understanding the core message and grounds the issue's theme
    effectively.
