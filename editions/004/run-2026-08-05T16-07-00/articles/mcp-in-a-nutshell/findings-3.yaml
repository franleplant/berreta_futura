craft:
  result: changes_required
  findings:
  - severity: blocking
    article: mcp-in-a-nutshell
    locator: '- | The data layer is the inner layer | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Seven instances of definitional equations concentrate through the explanation
      section: "The data layer is the inner layer", "This is the actual shape of
      every exchange", "The transport layer is the outer layer", "The data layer is
      also stateless", "Tools are functions the AI application can call to do
      something", "Resources are data the application can read", "Prompts are
      templates for structuring a conversation with the model". The pattern reads
      like a system naming categories rather than a person explaining. This is a
      reading defect whoever caused it, and the remedy is editorial: condense these
      definitions into a unified section, restructure to distribute the pattern
      across paragraphs, or reconsider whether all seven are necessary.
  scores:
    voice: 3
    sentence_variety: 1
    economy: 3
  notes: |
    The piece explains a technical protocol with clarity and concrete examples, but
    the concentration of definitional equations exhausts the reader with category
    naming before the practical illustration lands.
