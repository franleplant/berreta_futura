craft:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: 'MCP in a Nutshell | That is the whole protocol: a shape for asking what is on offer, and a shape for taking it. | 1'
    category: weak_close
    disposition: editor_decision
    note: |
      The closing line restates the protocol pattern demonstrated in the example
      just above it, leaving the reader with no new clarity, perspective, or
      curiosity. The remedy is an editor's: tighten the ending or let the example
      carry the final thought.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: MCP in a Nutshell | A remote server, reached over Streamable HTTP, typically serves many clients at once | 1
    category: jargon
    disposition: fix
    suggestion: |
      Either expand "Streamable HTTP" to its full name if it is a specific MCP
      transport variant, or use "HTTP" alone. If "Streamable" carries technical
      meaning, define it for readers outside the protocol community.
    note: |
      "Streamable HTTP" is not standard terminology. Since HTTP natively supports
      streaming, the phrase is either imprecise or specialized; either way, it
      needs clarification.
  scores:
    voice: 5
    sentence_variety: 4
    economy: 4
  notes: |
    A clear, well-grounded explanation of a complex protocol with consistent voice
    and strong concrete imagery. The writing stays observational and concrete
    throughout. One structural closing issue and one terminology clarification needed.
