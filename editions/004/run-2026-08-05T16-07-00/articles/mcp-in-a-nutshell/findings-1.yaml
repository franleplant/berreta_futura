    typography: 4
    consistency: 5
  notes: |
    One em dash found where the protocol prohibits it; otherwise clean.
shape:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | What a server actually offers comes down to three primitives | 1'
    repair_from: '- | Each has its own discovery method, `tools/list` or `resources/list`, and tools alone add an execution method, `tools/call` | 1'
    category: running_example
    disposition: fix
    note: |
      Three server primitives are introduced (tools, resources, prompts), and the text claims "a client that lists all three learns the shape of the whole server in one round trip." Yet discovery methods are named only for tools (`tools/list`) and resources (`resources/list`). Prompts appear in the database illustration but never receive a discovery method, are never called in action, and are absent from the final protocol exchange. The running example covers only two of the three primitives despite introducing all three.
    suggestion: Add the prompts discovery method to the primitives explanation (likely `prompts/list` or similar), and incorporate a prompts example into the final exchange to show how clients discover and use all three primitive types symmetrically.
  scores:
    order: 4
    coherence: 3
    opening: 5
    ending: 4
  notes: |
    The piece builds a clear, progressive understanding of MCP's architecture and protocol layers, but the treatment of prompts is incomplete—introduced as a first-class primitive but neither demonstrated nor explained in terms of discovery and interaction, unlike tools and resources.
craft:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | Under that host/client/server shape sit two layers | 1'
    category: no_voice
    disposition: editor_decision
    note: |
      The piece opens with an engaged, concrete voice ("Open Visual Studio Code,
      connect it to the Sentry MCP server, and something quietly assembles") but
      loses it in the data/transport layer explanation, becoming grammatical,
      even, and specification-like—"The data layer is the inner one: a JSON-RPC
      message format that defines discovery, tools, resources, prompts, and
      notifications, the actual shape of every exchange." The voice returns by
      "Put the pieces together" and the worked example. A reader would notice the
      shift from a person explaining to technical documentation. Remedy is an
      editor choice: deepen the voice in technical sections with concrete
      language or worked examples, restructure, or accept the shift as necessary
      for clarity.
  scores:
    voice: 2
    sentence_variety: 3
    economy: 3
  notes: |
    The piece reads as human explanation in the opening and closing, but the
    middle technical explanation becomes mechanical. The content is clear but the
    register shift is perceptible.
