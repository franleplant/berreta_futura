shape:
  result: changes_required
  findings:
  - severity: major
    article: editorial
    locator: '- | On Monday, an engineering team starts with one failed trace. | 1'
    repair_from: '- | A production eval turns a quiet invention after an empty tool result into a permanent test. | 1'
    category: running_example
    disposition: fix
    note: |
      The opening establishes an autonomous-agent incident, but the next paragraph
      cycles through several abstract examples before introducing a separate
      engineering-team scenario. The piece's concrete thread therefore resets
      instead of carrying the argument forward.
    suggestion: Carry the node-root incident through the reconstruction and testing process, or clearly signal the Monday scenario as a deliberate contrast.
  notes: |
    I verified that the opening earns the thesis and the ending lands, but the
    concrete example shifts midway and weakens the piece's continuity.
craft:
  result: changes_required
  findings:
  - severity: major
    article: editorial
    locator: The Memory That Makes Speed Safe | A production eval turns a quiet invention after an empty tool result into a permanent test. | 1
    category: repeated_shape
    disposition: fix
    note: |
      Four consecutive sentences use the same plain declarative shape: "A production eval turns...", "A predictable workflow keeps...", "An explicit handle lets...", and "Even a model's internal state needs...". The pattern becomes audible before the examples accumulate.
    suggestion: Recast or combine at least two of these four sentences so the paragraph varies its sentence movement.
  - severity: minor
    article: editorial
    locator: The Memory That Makes Speed Safe | That is the shape of speed without memory. | 1
    category: dead_words
    disposition: fix
    note: |
      This is a definite-article equation built from abstractions rather than a sentence that advances the example. It announces an interpretation the following sentences immediately supply.
    suggestion: Cut this sentence and begin the paragraph with "An agent can try more paths than a person."
  - severity: minor
    article: editorial
    locator: The Memory That Makes Speed Safe | Named state lets another process carry the relationship, while a predictable service bus leaves the path open to inspection. | 1
    category: jargon
    disposition: fix
    note: |
      "Service bus" arrives without definition, and the sentence asks the term to carry an abstract claim about inspectability. A competent engineer outside this subfield may not know which mechanism is meant.
    suggestion: Replace "service bus" with a concrete description of the handoff mechanism that keeps the path inspectable.
  notes: |
    I heard a strong concrete opening and a sharp final line, but the middle shifts into repeated declarative constructions and compressed systems language.
