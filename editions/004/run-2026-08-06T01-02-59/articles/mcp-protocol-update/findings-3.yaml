shape:
  result: changes_required
  findings:
  - severity: major
    article: mcp-protocol-update
    locator: Authorization and schemas move closer to practice | Tool schemas now use full JSON Schema 2020-12. | 1
    repair_from: Authorization and schemas move closer to practice | Removal requires a separate SEP. | 1
    category: missing_transition
    disposition: fix
    note: |
      The section jumps from the deprecation lifecycle to schema validation without
      signaling the change in subject, making the section read as a catalog of
      unrelated changes.
    suggestion: Add a transition that marks the move from lifecycle policy to schema-validation changes, or separate the topics into distinct sections.
  - severity: major
    article: mcp-protocol-update
    locator: Extensions get a place to grow | This release includes MCP Apps. | 1
    repair_from: '- | A remote MCP server that once needed sticky sessions, a shared session store, and deep packet inspection at the gateway can now sit behind a plain round-robin load balancer. | 1'
    category: running_example
    disposition: fix
    note: |
      The opening server scenario disappears after the first section, while later
      sections introduce MCP Apps, Tasks, authorization deployments, deprecations,
      and schemas as separate examples. The argument therefore becomes a list of
      features rather than one case carried through the revision.
    suggestion: Carry the opening server scenario through the extensions, authorization, and governance changes, using at most one contrasting example.
  notes: |
    I verified that the piece has a recoverable overall progression and a landing
    ending, but its middle section needs a clearer subject transition and its
    examples do not form a sustained through-line.
craft:
  result: changes_required
  findings:
  - severity: minor
    article: mcp-protocol-update
    locator: Extensions get a place to grow | SEP-2133 gives them reverse-DNS identifiers, capability negotiation, independent versions, delegated maintainers, and an Extensions Track that can move an experiment toward official status. | 1
    category: jargon
    disposition: fix
    note: |
      "SEP-2133" is an unexplained internal proposal identifier. A competent engineer outside the MCP subfield cannot infer what it denotes from the sentence.
  - severity: minor
    article: mcp-protocol-update
    locator: Authorization and schemas move closer to practice | The authorization specification now requires clients to validate the `iss` parameter in authorization responses, a mitigation for mix-up attacks that matter in MCP’s single-client, many-server deployments. | 1
    category: jargon
    disposition: fix
    note: |
      The sentence introduces the `iss` parameter and "mix-up attacks" without defining either term, making the security change opaque to readers outside this protocol niche.
  notes: |
    I heard a confident, technically grounded account from maintainers, with a clear human voice throughout; two specialized security and governance terms arrive before the piece gives readers enough footing to understand them.
