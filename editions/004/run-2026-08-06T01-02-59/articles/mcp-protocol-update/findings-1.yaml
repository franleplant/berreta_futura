evidence:
  result: changes_required
  findings:
  - severity: major
    article: mcp-protocol-update
    locator: Authorization and schemas move closer to practice | For structured observability, stdio transports should use OpenTelemetry rather than logging. | 1
    category: qualification_loss
    disposition: fix
    note: |
      The source distinguishes two replacements: stderr for stdio transports and OpenTelemetry for structured observability. The manuscript drops that distinction and broadly presents OpenTelemetry as the replacement for stdio logging, changing the scope of the guidance.
  notes: |
    Checked every manuscript assertion and furniture item against the pinned extraction; claims outside that extraction could not be checked.
