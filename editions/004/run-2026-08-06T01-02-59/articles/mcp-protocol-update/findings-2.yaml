mechanics:
  result: changes_required
  findings:
  - severity: major
    article: mcp-protocol-update
    locator: Extensions get a place to grow | Tasks leave the experimental core and become an extension. | 1
    category: agreement
    disposition: fix
    note: |
      "Tasks" is plural, but it is paired with the singular complement "an extension." This is an agreement error in the editors' synthesis.
    suggestion: The Tasks feature leaves the experimental core and becomes an extension.
  notes: One subject-complement agreement error requires correction; capitalization, punctuation, typography, headings, and formatting are otherwise clean.
shape:
  result: changes_required
  findings:
  - severity: major
    article: mcp-protocol-update
    locator: A protocol that can change without breaking every deployment | If you maintain an SDK or client, the immediate work is to run the candidate against real workloads before July 28 and ship support during that window. | 1
    repair_from: A protocol that can change without breaking every deployment | The ten-week window before the July 28 final release is for SDK maintainers and client implementers to test real workloads; Tier 1 SDKs are expected to support the changes during it. | 1
    category: duplication
    disposition: fix
    note: |
      The closing section repeats the same testing and Tier 1 support instruction twice. The earlier occurrence says maintainers should test real workloads during the ten-week window and that Tier 1 SDKs are expected to support the changes; the final paragraph repeats running the candidate against real workloads, shipping support, and the Tier 1 expectation.
    suggestion: Keep the timing and Tier 1 expectation in one paragraph, then use the ending for a single concise action.
  notes: |
    The piece moves coherently from stateless transport through extensions, authorization and schemas, governance, and an implementation call to action; the closing guidance is duplicated.
craft:
