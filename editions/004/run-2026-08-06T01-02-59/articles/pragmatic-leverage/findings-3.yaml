craft:
  result: changes_required
  findings:
  - severity: minor
    article: pragmatic-leverage
    locator: Seeking leverage | You need to do this without overindexing on questions you won't be able to answer without going down a level. | 1
    category: dead_words
    disposition: fix
    note: |
      "Overindexing" is corporate abstraction, and "going down a level" compounds it with an unexplained spatial metaphor. The sentence sounds like process language rather than this author's otherwise direct account.
  - severity: minor
    article: pragmatic-leverage
    locator: Seeking leverage | There's no perfect process for this. | 1
    category: dead_words
    disposition: fix
    note: |
      This is a generic reassurance that adds no operational guidance. The surrounding paragraph already demonstrates the uncertainty; this sentence merely names it.
  notes: |
    I heard a strong, conversational voice with useful quantitative examples, but two process-language sentences briefly flatten that voice into abstraction.
