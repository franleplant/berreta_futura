shape:
  result: changes_required
  findings:
  - severity: major
    article: eval-engineering
    locator: The small suite that stays alive | The travel agent's 32.3% faithfulness score is why the first measurement belongs there. | 1
    repair_from: '- | Across 100 real sessions, its answers scored 83.9% for quality and 32.3% for faithfulness to the tools. | 1'
    category: duplication
    disposition: fix
    note: |
      The 32.3% faithfulness figure appears in both the opening and the final
      section. The later repetition does not add a new structural function.
    suggestion: Keep the 32.3% figure in the opening and remove the later restatement.
  - severity: major
    article: eval-engineering
    locator: Build the examiner you already have | A blind test of 100 production traces from a voice agent showed a different path. | 1
    repair_from: '- | A software travel agent gave a clean answer: an exchange rate to one decimal place, the week''s temperature, and a museum''s opening hours. | 1'
    category: running_example
    disposition: editor_decision
    note: |
      The travel-agent failure establishes the piece, but subsequent sections
      introduce separate voice-agent, coding-agent, autonomous-fleet, and
      broken-product cases. The argument remains intelligible, but no concrete
      case carries the reader through the full sequence.
    suggestion: Choose the travel-agent trace as the throughline and recast later benchmarks as explicit contrasts.
  notes: |
    I verified that the piece progresses from a motivating failure through eval construction, judge discipline, test creation, review gating, and suite maintenance, but repeats one metric and disperses its examples.
craft:
  result: changes_required
  findings:
  - severity: blocking
    article: eval-engineering
    locator: Keep the judge honest | Use a judge from another model family when possible. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      The piece repeatedly switches into imperative instructions, enough that the reader starts hearing a manual rather than a person thinking through the argument. Instances include: "Use a judge from another model family when possible."; "Write the rubric as one observable condition: \"Pass iff [the successful outcome].\""; "Give it one primary verdict rather than a bundle of proxy scores."; "Let ordinary code handle objective checks"; "Let the judge handle semantic calls."; "Do not reward the shape of an answer through length, keywords, citation counts, exact phrasing, tool-call counts, or similarity to a reference."; "Reward the outcome the agent was meant to produce."; "Pin the judge and log its version."; "Optimize against a judge long enough and the agent learns to look right rather than be right."; "Start with 25 complete traces"; "For each trace, record what the user asked and what the agent did, what worked, who caused the failure, and what capability an eval should preserve or improve."; "Test the verifier with one clearly correct result and one plausible but wrong result before trusting it."; "Also check that the environment does not reveal the answer before the agent reaches the tool."; "Ask the agent to map the repository, read the traces, propose candidates, and recommend one before implementation."; "Run this loop repeatedly and each incident becomes a test instead of a recurring surprise."; "Run the gate in shadow mode for at least four hours of real traffic."; "Set a 2% disagreement threshold between automated and human verdicts."; "Sample 1% to 5% of traces instead of capturing everything."; "Keep the gate closed on risky work and open on the boring 80%."; "Start with three measurements for a tool-using agent"; "Choose the dataset type deliberately."; "Keep 300 to 800 cases on holdout, with 500 running in under five minutes."; "Install one skill, pull 25 traces, build one eval, and add another whenever something breaks."
  - severity: minor
    article: eval-engineering
    locator: The small suite that stays alive | `RAG` tests retrieval. | 1
    category: jargon
    disposition: fix
    note: |
      "RAG" is not expanded or defined, so a competent engineer outside this subfield may not know what dataset type it names.
  notes: I heard a vivid, confident technical essay that gradually turns into a long sequence of commands, with one unexplained acronym interrupting an otherwise legible argument.
