    article: eval-engineering
    locator: The missing return arrow | That wiring changes the economics. The model is rented. The examiner is yours. Every failure you feed it can remain in the system as a test, while the examiner costs almost nothing to run. | 1
    repair_from: The missing return arrow | That wiring changes the economics. The model is rented. The examiner is yours. Every failure you feed it can remain in the system as a test, while the examiner costs almost nothing to run. | 1
