worth:
  result: approved
  findings: []
  omissions:
  - fact: The production company's observation that changing only the evals, with no model, prompt, or human changes, moved scores across every dimension—and that evals should have been present on day one rather than month nine.
    reader_loses: A concrete demonstration that evaluation engineering itself can improve an agent, not merely measure it.
    verdict: defensible
  - fact: The named vendor dates, installation commands, plugin syntax, evalkit phase commands, and eval folder layout.
    reader_loses: Setup instructions and implementation scaffolding, but none is practical or necessary to use from the printed piece.
    verdict: defensible
  - fact: The author's X and Telegram promotion and the post's engagement metadata.
    reader_loses: No substantive idea or operational guidance.
    verdict: defensible
  retentions:
  - passage: The travel agent's invented exchange rate, temperature, and museum hours, followed by the 83.9% quality and 32.3% faithfulness scores.
    costs: The opening space, but it gives the central failure and makes the need for evals immediately legible.
    verdict: earns_place
  - passage: The thermometer and thermostat analogy and the return-arrow explanation.
    costs: Several paragraphs of exposition, but they define the article's core distinction between measurement and feedback.
    verdict: earns_place
  - passage: The six verdict-to-routing rules.
    costs: A compact list, but it converts the thesis into concrete system behavior.
    verdict: earns_place
  - passage: The five starter evals and the 300-to-800-case sizing guidance.
    costs: A substantial closing section, but it leaves the reader with an actionable first suite.
    verdict: earns_place
  - passage: The final three-line discipline and 'Install one skill. Pull 25 traces. Build one eval' close.
    costs: A recap at the end, but it compresses the operating method into a memorable prescription.
    verdict: earns_place
  notes: 'Approved because the piece turns the source''s sprawling build into a coherent operating recipe: make eval verdicts change the next graph edge, mine 25 real traces into hidden tests, and use evidence to decide which agent work reaches a human.'
evidence:
