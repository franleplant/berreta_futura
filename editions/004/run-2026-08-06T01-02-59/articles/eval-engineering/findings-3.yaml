shape:
  result: approved
  findings: []
  notes: |-
    The piece opens with a concrete failure, develops evaluation engineering through
    examiner construction, judging discipline, test formation, review routing, and
    suite design, and lands with a practical starting point. The travel-agent
    example recurs usefully, headings state section arguments, and the furniture is
    placed coherently.
craft:
  result: changes_required
  findings:
  - severity: major
    article: eval-engineering
    locator: The small suite that stays alive | A `final_response` case scores only the answer. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Four consecutive taxonomy sentences use the same "A [dataset] case [verb]..." construction: "A `final_response` case scores only the answer"; "A `single_step` case isolates one decision"; "A `trajectory` case follows the whole path through tools and handoffs"; and "A retrieval-focused, or `RAG`, case tests whether the agent found the right material before it answered." The catalogue makes the prose sound generated rather than sequenced by a person.
  - severity: minor
    article: eval-engineering
    locator: 'Build the examiner you already have | One conclusion followed plainly: similar results were available from the coding agent itself. | 1'
    category: dead_words
    disposition: fix
    note: |
      "One conclusion followed plainly" is throat-clearing abstraction plus an empty intensifier; the concrete claim after the colon does the work.
  - severity: minor
    article: eval-engineering
    locator: Build the examiner you already have | A score that never changes behavior is analytics. An eval that changes the next edge is engineering. | 1
    category: dead_words
    disposition: fix
    note: |
      The balanced "X is Y / X is Y" equation turns a useful mechanism into a slogan, a register the house rules identify as robotic.
  notes: |
    I heard a confident, concrete systems essay whose voice thins when it shifts into taxonomy and compressed slogans.
