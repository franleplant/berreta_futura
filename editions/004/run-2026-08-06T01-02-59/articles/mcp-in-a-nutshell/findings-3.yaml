evidence:
  result: changes_required
  findings:
  - severity: minor
    article: mcp-in-a-nutshell
    locator: From discovery to action | That choice matters when a federation of servers offers more functions than a model can usefully inspect in one pass. | 1
    category: invented_claim
    disposition: fix
    note: |
      The source supports progressive discovery for clients federating many servers, but does not claim that a model cannot usefully inspect all offered functions in one pass. This adds an unsupported rationale.
  notes: |
    I checked every assertion and furniture element against the pinned architecture extraction; I could not verify claims from any source outside that extraction.
