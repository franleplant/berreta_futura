craft:
  result: changes_required
  findings:
  - severity: minor
    article: factory-systems-problem
    locator: '- | Software factories are super real but we need to be realistic. | 1'
    category: weak_opening_sentence
    disposition: fix
    note: |
      The opening announces a general stance twice ("super real" and "realistic") before giving the reader a concrete problem or observation.
  - severity: major
    article: factory-systems-problem
    locator: ' | The best practices right now are to build abstractions/pieces needed which entails solving non-agent topics. | 1'
    category: dead_words
    disposition: fix
    note: |
      This sentence stacks abstractions ("best practices," "abstractions/pieces," and "non-agent topics"), then the paragraph trails into the fragment list "Almost lights out. Sandboxing, monorepo, reproducible builds, ci/cd, identity/secret management, smashing corporate friction in the realm of devex for agents." The reader gets labels instead of a sequence of concrete actions.
  - severity: major
    article: factory-systems-problem
    locator: ' | Look up anything in the @dotnet space such as mass transit, nservicebus, wcf if you wanna steal ideas for prompting. | 1'
    category: repeated_shape
    disposition: fix
    note: |
      Three consecutive reader-directed imperatives use the same command shape: "Look up anything in the @dotnet space such as mass transit, nservicebus, wcf if you wanna steal ideas for prompting." "Use it and have a job invoke an agent as a process." "Don’t make the entire service bus non-deterministic." The commands are rhetorically forceful, but the repeated construction becomes audible as a pattern.
  notes: |
    I heard a vivid, opinionated voice, but the piece repeatedly replaces concrete sequence with compressed labels and then shifts into a run of commands, while the opening spends its first sentence announcing its stance.
