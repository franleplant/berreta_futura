worth:
  result: approved
  findings: []
  omissions:
  - fact: The source's word 'abstractions' in its recommendation to build abstractions/pieces.
    reader_loses: A slight emphasis on the architectural layer of the work, though the manuscript preserves the underlying recommendation to build the needed pieces.
    verdict: defensible
  retentions:
  - passage: 'First hot take:'
    costs: A brief framing label that separates the opening argument from the later service-bus argument.
    verdict: earns_place
  - passage: Blog post time.
    costs: A short rhetorical aside that adds no idea.
    verdict: cut
  - passage: The n8n critique and the examples of MassTransit, NServiceBus, WCF, and Temporal.
    costs: Several paragraphs, but they make the deterministic-service-bus recommendation concrete.
    verdict: earns_place
  notes: |
    The piece gives readers a single systems-level argument connecting the factory puzzle, its non-agent infrastructure work, and deterministic service-bus architecture. It is a faithful, useful condensation, with only a minor rhetorical aside that could be removed.
evidence:
  result: changes_required
  findings:
  - severity: major
    article: factory-systems-problem
    locator: '- | Keeping the service bus deterministic and invoking the agent as a process is the systems-engineering work factories still have to solve. | 1'
    category: unreached_conclusion
    disposition: fix
    note: |
      The sources support keeping the service bus deterministic and invoking an agent as a process, but they do not state that this is work factories still have to solve. The manuscript adds that conclusion.
  notes: |
    I checked every factual assertion, attribution, quotation, and conclusion against the three pinned extractions; there were no decks, captions, glossaries, or cheat sheets beyond the title and body, and nothing outside those extractions was checkable.
mechanics:
  result: changes_required
  findings:
  - severity: major
    article: factory-systems-problem
    locator: '- | The Factory Is a Systems Problem | 1'
    category: heading_form
    disposition: fix
    note: |
      The article heading is in title case. Headings are sentence case.
    suggestion: The factory is a systems problem
  - severity: major
    article: factory-systems-problem
    locator: '- | The factory aspects haven’t been cracked yet, the innovators are toying around with discovering practices and pieces. | 1'
    category: punctuation
    disposition: fix
    note: |
      Two independent clauses are joined by a comma, creating a comma splice.
    suggestion: The factory aspects haven’t been cracked yet; the innovators are toying around with discovering practices and pieces.
  - severity: major
    article: factory-systems-problem
    locator: '- | If someone is selling you a factory rn and they aren’t in the super small cohort (i.e. they are likely startups created in the last six months!) or circa <10 people in the who’s-who, who have been trying (and realistically failing) over the last two years. | 1'
    category: grammar
    disposition: fix
    note: |
      The sentence begins with an if-clause but has no main clause before the period.
    suggestion: If someone is selling you a factory rn and they aren’t in the super small cohort (...) or circa <10 people in the who’s-who, who have been trying (and realistically failing) over the last two years, they are selling bullshit.
  - severity: major
    article: factory-systems-problem
    locator: '- | Highest ROI you can have right now is learning the entire damn stack, automating it and showing it at your next interview/doing a recorded talk at a meetup. | 1'
    category: grammar
    disposition: fix
    note: |
      The singular count noun phrase needs a determiner.
    suggestion: The highest ROI you can have right now is learning the entire damn stack, automating it and showing it at your next interview/doing a recorded talk at a meetup.
  - severity: major
    article: factory-systems-problem
    locator: '- | who have never worked in corporate in their life | 1'
