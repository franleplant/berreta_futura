shape:
  result: changes_required
  findings:
  - severity: major
    article: factory-systems-problem
    locator: '- | Here is the second hot take, since the first hot take seems to have landed. | 1'
    repair_from: '- | Here is the second hot take, since the first hot take seems to have landed. | 1'
    category: orphan_referent
    disposition: fix
    note: |
      The sentence refers to the first hot take having landed with an audience,
      but the piece contains no audience response or evidence of reception.
      That external reference briefly pulls the reader outside the argument.
    suggestion: Introduce the n8n point directly without referring to how the first hot take was received.
  notes: |
    I verified that the piece moves coherently from the factory thesis to its systems-engineering implications and lands on deterministic service buses; one audience-reception reference is structurally unsupported.
craft:
  result: changes_required
  findings:
  - severity: major
    article: factory-systems-problem
    locator: '- | First hot take: software factories are super real but we need to be realistic. | 1'
    category: weak_opening_sentence
    disposition: fix
    note: |
      The opener announces a "hot take" and spends its first sentence on the vague pair "super real" and "realistic" before giving the reader a concrete claim.
    suggestion: |
      Open with the systems-engineering claim about what factories have not yet solved.
  - severity: major
    article: factory-systems-problem
    locator: '- | The @dotnet space offers mass transit, nservicebus, and wcf if you wanna steal ideas for prompting. | 1'
    category: jargon
    disposition: fix
    note: |
      The argument depends on service-bus architecture, but the sentence introduces MassTransit, NServiceBus, and WCF without explaining what role they play for readers outside this subfield.
    suggestion: |
      Define the service-bus pattern before naming implementation examples.
  - severity: minor
    article: factory-systems-problem
    locator: '- | We are almost at lights-out. | 1'
    category: dead_words
    disposition: fix
    note: |
      This portentous short sentence announces imminent completion without showing what remains or why the reader should believe the work is nearly done.
    suggestion: |
      Replace it with the specific remaining systems work or cut it.
  notes: I heard a vivid, combative voice whose strongest passages make the factory thesis concrete, but the opening announcement, unexplained service-bus vocabulary, and one portentous sentence briefly loosen that grip.
