    category: repeated_shape
    disposition: editor_decision
    note: |
      Six conditional "If..." constructions create the dominant rhythm: "If you're only using AI...", "But if you use AI...", "Let's assume if you yolo...", "If you draw this out...", "if you've done some work...", and "If you're doing multiple phases...". The pattern becomes audible before the argument develops; cut or combine at least two of these passages.
