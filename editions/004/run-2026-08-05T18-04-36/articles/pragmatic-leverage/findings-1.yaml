craft:
  result: changes_required
  findings:
  - severity: blocking
    article: pragmatic-leverage
    locator: Seeking Leverage | If you're only using AI to write the code, then you're taking the 2–4 hours of coding time down to 10–20 minutes, but you haven't accelerated anything else here. | 1
    repair_from: Seeking Leverage | If you're only using AI to write the code, then you're taking the 2–4 hours of coding time down to 10–20 minutes, but you haven't accelerated anything else here. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Six conditional constructions make the sentence pattern audible: "If you're only using AI to write the code, then you're taking the 2–4 hours of coding time down to 10–20 minutes, but you haven't accelerated anything else here"; "But if you use AI to help you plan and align, then you actually get closer to 2–3× faster"; "Lets assume if you yolo a two-sentence prompt into your factory, your chance of getting a fully-mergeable result is ~50%, the chance you have to rework it is 50%"; "If the model is 50% likely to get a button style wrong, but the fix is one cheap prompt, then our combined 'expected pain' is low"; "if you've done some work at the 'Product' level and have not answered all the open questions yet, its possible you may need to end it where you are and zoom down a level to the technical details to understand what's feasible"; and "If you're doing multiple phases of planning, zooming in from 50kft view all the way to the 10kft view, you want to do a little bit of steering at each phase". The author's construction is the defect, so cut or substantially vary several of these sentences.
  - severity: minor
    article: pragmatic-leverage
    locator: Seeking Leverage | This is what we mean by leverage - and it requires being pragmatic. | 1
    category: dead_words
    disposition: fix
    note: |
      This balanced, abstract definition sounds like a summary of the preceding discussion rather than a sentence that advances it.
  - severity: minor
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | If you're doing multiple phases of planning, zooming in from 50kft view all the way to the 10kft view, you want to do a little bit of steering at each phase to ensure you are eliminating as much expected pain as possible. | 1
    category: dead_words
    disposition: fix
    note: |
      The stacked level/zoom/altitude metaphors decorate the planning advice without making the mechanism clearer; keep the concrete steering idea and remove the spatial layering.
  scores:
    voice: 4
    sentence_variety: 1
    economy: 3
  notes: |
    I heard a candid, practical voice, but the repeated conditional sentence frame becomes the piece's dominant sound before its final paragraph.
