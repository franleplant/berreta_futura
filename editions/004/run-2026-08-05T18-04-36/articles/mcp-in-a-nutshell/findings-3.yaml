    article: mcp-in-a-nutshell
    locator: '- | Remote messages use HTTP POST, with optional Server-Sent Events for streaming. | 1'
    category: qualification_loss
    disposition: fix
    note: |
      The source limits HTTP POST to client-to-server messages; server-to-client
      streaming uses optional Server-Sent Events. The manuscript's broader
      wording makes all remote messages sound like HTTP POST messages.
