craft:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | The host coordinates clients. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Three consecutive subject-verb-object sentences — "The host coordinates clients.", "A server provides context.", and "A client obtains it for the host." — make the explanation sound schematic. Cut one sentence or combine the relationship into a less repetitive construction.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | Start with discovery. | 1'
    category: passive
    disposition: fix
    note: |
      The ownerless imperative gives the paragraph a procedural, system-generated voice. Name the actor and action, such as having the client begin discovery by sending the request.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | New implementations should call language-model providers directly for sampling and should write logs to standard error or use OpenTelemetry. | 1'
    category: jargon
    disposition: fix
    note: |
      "OpenTelemetry" is unexplained infrastructure terminology for readers outside observability work. Define it briefly as a telemetry standard or remove the named product.
  scores:
    voice: 4
    sentence_variety: 3
    economy: 4
  notes: |
    I heard a clear, useful technical explainer whose voice briefly turns schematic in the discovery instructions and the compact host-server-client triad.
