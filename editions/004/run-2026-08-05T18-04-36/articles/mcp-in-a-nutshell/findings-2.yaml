craft:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: The useful part of the data layer is its primitives. | A tool is an executable function, such as a file operation, API call, or database query. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Three consecutive definition sentences use the same "A X is Y" shape:
      "A tool is an executable function", "A resource supplies context", and
      "A prompt is a reusable interaction template." The pattern makes the
      explanation sound assembled rather than written. Recast or cut one of
      these definitions.
    suggestion: Vary the sentence openings so the three primitives do not arrive as a definition list in prose.
  - severity: major
    article: mcp-in-a-nutshell
    locator: MCP defines the protocol for exchanging context. | MCP defines the protocol for exchanging context. | 1
    category: no_voice
    disposition: fix
    note: |
      The voice disappears at the second paragraph: the prose becomes evenly
      abstract, impersonal, and system-generated through the protocol-layer
      explanation. It remains grammatical and clear, but no longer sounds like
      one curious person guiding the reader.
    suggestion: Ground this passage in a concrete interaction or consequence before returning to the abstractions.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: The useful part of the data layer is its primitives. | The useful part of the data layer is its primitives. | 1
    category: dead_words
    disposition: fix
    note: |
      "The useful part" is an abstract throat-clearing judgment, and "its
      primitives" introduces terminology before showing what the primitives do.
      The sentence adds little beyond announcing the next paragraph.
    suggestion: Remove this sentence and begin directly with the tool, resource, and prompt examples.
  - severity: major
    article: mcp-in-a-nutshell
    locator: MCP defines the protocol for exchanging context. | Local servers commonly use standard input and output. Remote servers commonly use Streamable HTTP, which supports ordinary HTTP authentication such as bearer tokens and API keys. | 1
    category: jargon
    disposition: fix
    note: |
      "Streamable HTTP", "_meta", JSON-RPC 2.0, bearer tokens, OAuth, cursors,
      elicitation, and OpenTelemetry are terms a competent engineer outside
      this subfield may not know; several are used without an operational
      gloss.
    suggestion: Define the unfamiliar transport and message terms at first use, or remove the implementation details that the explainer does not need.
  - severity: major
    article: mcp-in-a-nutshell
    locator: These boundaries let an application replace or add servers without changing the message format the model receives. | Each action still has a named tool, a declared input schema, and a connection whose responsibility remains visible. | 1
    category: weak_close
    disposition: fix
    note: |
      The final sentence restates the article's earlier tool/schema/connection
      inventory instead of leaving the reader with a new implication or useful
      question.
    suggestion: End on the practical consequence for someone choosing, replacing, or debugging an MCP server.
  scores:
    voice: 2
    sentence_variety: 2
    economy: 3
  notes: |
    I heard a clear technical explainer whose middle turns into an impersonal
    protocol inventory and whose ending repeats that inventory.
