  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | For example, a request has JSON-RPC version `2.0`, request ID `3`, method `tools/call`, and parameters containing | 1'
    repair_from: '- | Imagine a database server. | 1'
    category: running_example
