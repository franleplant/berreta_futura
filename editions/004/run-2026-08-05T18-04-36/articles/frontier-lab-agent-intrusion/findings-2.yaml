      This sentence stacks several Kubernetes-specific terms without explaining what
      the CSI driver's permissions, TokenRequest API, or SelfSubjectRulesReview do.
    suggestion: |
      Translate each term into its function in the intrusion, adding the technical
      name only where it helps the reader.
