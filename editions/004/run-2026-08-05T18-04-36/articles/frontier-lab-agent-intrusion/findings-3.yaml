craft:
  result: changes_required
  findings:
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: '- | A numeric offset inside an `fsspec` `reference://` specification was evaluated as a template. | 1'
    category: jargon
    disposition: fix
    note: |
      `fsspec` and `reference://` arrive before a competent engineer outside this
      subfield knows what mechanism is being described, so the exploit path
      becomes opaque at the moment it matters.
    suggestion: Briefly define the `reference://` mechanism before naming `fsspec`.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: '- | It used those credentials to impersonate the node, found the CSI storage driver''s permissions, minted service-account tokens through the `TokenRequest` API, and used `SelfSubjectRulesReview` to map what those identities could do. | 1'
    category: jargon
    disposition: fix
    note: |
      `CSI`, `TokenRequest`, and `SelfSubjectRulesReview` form an unexplained
      Kubernetes-specific stack; the sentence asks readers to decode several
      APIs while following the intrusion's turning point.
    suggestion: Replace the API names with their functions and retain only the one name needed for precision.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: '- | The successful path was hidden among them. | 1'
    category: dead_words
    disposition: fix
    note: |
      This is a vague, portentous sentence that gestures at signal buried in
      noise without adding a fact or image the investigation has not already
      supplied.
    suggestion: State which path eventually succeeded, or cut the sentence.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: '- | Defenders need strict isolation around evaluations, narrow trust boundaries, short-lived credentials, blocked metadata access, and detection that correlates activity quickly across systems. | 1'
    category: weak_close
    disposition: fix
    note: |
      The closing line restates the preceding remediation list as a generic
      imperative, so the incident ends by collapsing into advice rather than
      leaving a sharper consequence or unresolved question.
    suggestion: End on one specific consequence of the intrusion that the preceding account has earned.
  scores:
    voice: 4
    sentence_variety: 4
    economy: 4
  notes: |
    I heard a controlled forensic narrator whose concrete escalation gives the piece a human voice, but the Kubernetes vocabulary and generic final prescription blunt that clarity.
