shape:
  result: changes_required
  findings:
  - severity: blocking
    article: pragmatic-leverage
    locator: Seeking leverage | Good luck. | 1
    repair_from: Seeking leverage | The payoff from planning is largest at the start. | 1
    category: ending
    disposition: fix
    note: |
      The argument establishes a useful principle about reducing expected pain,
      then ends with a sign-off instead of synthesizing how the planning phases
      apply that principle. The piece stops rather than landing.
    suggestion: End by explicitly tying phased planning and zooming to reducing expected pain.
  - severity: minor
    article: pragmatic-leverage
    locator: Seeking leverage | If you use AI to help plan and align, you can get closer to 2–3x faster. | 1
    repair_from: Seeking leverage | If you use AI to help plan and align, you can get closer to 2–3x faster. | 1
    category: heading_not_a_claim
    disposition: fix
    note: |
      The heading names the topic of leverage but not the section's argument:
      planning effort should be calibrated to the expected pain of rework.
    suggestion: Rename the heading to state that planning effort should track expected pain.
  notes: |
    I verified that the piece's progression from delivery-time context through planning leverage, expected pain, and phased steering is coherent, but its closing and section heading need structural adjustment.
craft:
  result: changes_required
  findings:
  - severity: minor
    article: pragmatic-leverage
    locator: Seeking leverage | There is no perfect process. | 1
    category: dead_words
    disposition: fix
    note: |
      This sentence is a generic reassurance after the concrete planning advice. It adds no mechanism or judgment and sounds like a stock disclaimer.
    suggestion: |
      Remove the sentence so the paragraph ends on the more useful point about zooming into technical details.
  - severity: minor
    article: pragmatic-leverage
    locator: Seeking leverage | When planning happens in multiple phases, zooming in from the 50kft view to the 10kft view, do a little steering at each phase. | 1
    category: jargon
    disposition: fix
    note: |
      "50kft view" and "10kft view" are unexplained shorthand. A competent engineer outside this subfield may not know that they mean higher-level product planning and lower-level technical planning.
    suggestion: |
      Name the two planning levels directly, or define the shorthand at first use.
  notes: |
    I heard a confident, conversational practitioner explaining where AI leverage actually comes from, with concrete probabilities and a useful expected-pain model. Two small patches of generic reassurance and unexplained shorthand interrupt that otherwise human voice.
