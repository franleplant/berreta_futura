craft:
  result: changes_required
  findings:
  - severity: major
    article: pragmatic-leverage
    locator: Seeking leverage | There is an inverse relationship between effort invested up front and expected pain. | 1
    category: dead_words
    disposition: fix
    note: |
      The prose turns abstract and system-like here: “inverse relationship,” “practical question,” and “uncertainty warrants” describe the point without the concrete operational texture used earlier.
  - severity: minor
    article: pragmatic-leverage
    locator: Seeking leverage | You also need to avoid overindexing on questions you cannot answer without going down a level. | 1
    category: jargon
    disposition: fix
    note: |
      “Overindexing” is unexplained management jargon; a competent engineer outside this subfield may not know what action it describes.
  - severity: minor
    article: pragmatic-leverage
    locator: Seeking leverage | When planning happens in multiple phases, zooming in from the 50kft view to the 10kft view, do a little steering at each phase. | 1
    category: jargon
    disposition: fix
    note: |
      “50kft view” and “10kft view” are insider shorthand introduced without definition, making the sentence sound like process vocabulary rather than someone explaining the mechanism.
  notes: I heard a concrete, useful voice at the start, then a drift into abstract process language near the middle and end.
