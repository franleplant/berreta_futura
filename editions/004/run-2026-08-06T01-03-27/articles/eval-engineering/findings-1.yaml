craft:
  result: changes_required
  findings:
  - severity: major
    article: eval-engineering
    locator: Make the score steer the run | Use a model from another family when possible, because a model grading its own family may share its blind spots. | 1
    category: repeated_shape
    disposition: fix
    note: |
      Five consecutive ownerless imperatives create the same sentence shape: "Use a model...", "Write one observable pass condition...", "Let the judge handle...", "Do not reward...", and "Pin the judge's version...". The advice becomes a checklist before the paragraph has finished.
    suggestion: Break the run with a concrete example or combine the instructions into fewer, more varied sentences.
  - severity: major
    article: eval-engineering
    locator: Make the score steer the run | Use a model from another family when possible, because a model grading its own family may share its blind spots. | 1
    category: passive
    disposition: fix
    note: |
      The paragraph repeatedly addresses an unnamed operator through imperatives, leaving the actor implicit: "Use...", "Write...", "Let...", "Do not reward...", and "Pin...". The guidance would be clearer if it named who performs these actions.
    suggestion: Name the responsible team or role once, then vary the sentence subjects.
  - severity: minor
    article: eval-engineering
    locator: The return arrow | Within four weeks, LangChain, Galileo, AWS, and Arize had shipped their evaluation expertise as skills for coding agents. | 1
    category: dead_words
    disposition: fix
    note: |
      "The category was unbundling into the terminal many teams already had open" uses corporate abstraction ("category", "unbundling") instead of describing the concrete shift already established by the named companies.
    suggestion: Replace the abstraction with a direct description of evaluation features moving into the coding tools teams already use.
  - severity: minor
    article: eval-engineering
    locator: Make the score steer the run | Low context recall can reject a handoff. | 1
    category: jargon
    disposition: fix
    note: |
      "Context recall" is a specialized evaluation term that is never defined, so a competent engineer outside this subfield may not know what failure it measures.
    suggestion: Define context recall briefly at first use, in terms of whether the agent retrieved the information needed for the handoff.
  notes: I hear a confident, tactile voice that occasionally turns into a checklist of abstractions and specialist terms.
