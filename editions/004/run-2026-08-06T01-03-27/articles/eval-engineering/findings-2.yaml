worth:
  result: approved
  findings: []
  omissions:
  - fact: The opening comparison that identical model access widened the gap between teams more than the gap between models.
    reader_loses: Some framing for why the harness, rather than model access, is the competitive advantage.
    verdict: defensible
  - fact: The exact installation commands, plugin commands, repository URLs, and evalkit phase commands.
    reader_loses: Copy-paste setup instructions, which are impractical in a print piece and available in the source.
    verdict: defensible
  - fact: The explicit evals/<task-id> Harbor folder layout and the report command's promise of code-location-specific recommendations.
    reader_loses: Implementation scaffolding and one tooling convenience, not a load-bearing idea.
    verdict: defensible
  - fact: The source's vendor-specific launch dates and the explicit open-skills compatibility list (Codex, Cursor, Windsurf, and Goose).
    reader_loses: Exact chronology and platform names, while the manuscript preserves the category-unbundling point.
    verdict: defensible
  - fact: The author's X and Telegram promotion, post timestamp, view count, and reply excerpts.
    reader_loses: Platform ephemera unrelated to the argument.
    verdict: defensible
  retentions:
  - passage: The travel-agent anecdote and the 83.9% quality versus 32.3% faithfulness figures.
    costs: The opening space, which earns its place by making the hidden failure and need for evaluation immediately concrete.
    verdict: earns_place
  - passage: The thermometer-versus-thermostat analogy and the return-arrow explanation.
    costs: Several paragraphs of explanation, but they supply the manuscript's governing distinction between analytics and engineering.
    verdict: earns_place
  - passage: The blind-test benchmark figures and the account of evaluation vendors moving into coding-agent skills.
    costs: A substantial section, justified by evidence that the proposed workflow is both viable and newly accessible.
    verdict: earns_place
  - passage: The 25-trace sampling template and attribution guidance.
    costs: Detailed instructional space that gives the reader a reproducible starting method.
    verdict: earns_place
  - passage: The merge-gate signals, autonomy figures, and warning about 38 green tests alongside a broken product.
    costs: The longest section, but it connects evaluation to operational consequences and supplies an essential failure caveat.
    verdict: earns_place
  - passage: The first-afternoon checklist of three measurements, dataset choices, suite size, and five starter evals.
    costs: A dense closing section, justified because it converts the thesis into an actionable minimum program.
    verdict: earns_place
  notes: |
    This piece gives the reader a usable progression from measuring agent behavior, through routing verdicts and turning incidents into tests, to evidence-based autonomous merges; the source supplies those ideas but not this compressed, action-oriented sequence.
evidence:
  result: changes_required
  findings:
  - severity: major
    article: eval-engineering
    locator: '- | The gap matters because a better model would not have fixed it. | 1'
    category: invented_claim
    disposition: fix
    note: |
      The source says, "A better model would not have caught this." It does not claim that a better model could not have fixed the underlying travel-agent failure. The manuscript changes detection of the problem into inability to fix it.
  - severity: major
    article: eval-engineering
    locator: The return arrow | A judge that improves with every failure you feed it becomes more valuable each week, while the model remains a rental. | 1
    category: invented_claim
    disposition: fix
    note: |
      The source says the examiner becomes more valuable because every failure fed into it stays there permanently. It does not say that the judge itself improves with every failure.
  notes: |
    I checked every assertion, number, name, attribution, quotation, and furniture element against the pinned extraction; there were no external sources or additional manuscript materials available to check.
mechanics:
  result: changes_required
  findings:
  - severity: major
    article: eval-engineering
    locator: Let evidence decide what merges | Across leading agents, about three quarters of merged work needs no human edit, revert rates remain in the low single digits, and Guardrails rejects one pull request in five before review. | 1
    category: punctuation
    disposition: fix
    note: |
      The comma after "edit" joins two independent clauses and creates a comma splice. This is editors' prose in a faithful synthesis, so the editors must repair it.
    suggestion: Replace the comma after 'edit' with a semicolon or a period.
  - severity: minor
    article: eval-engineering
    locator: The first afternoon | Hold out 300 to 800 cases, with about 500 running in under five minutes. | 1
    category: typography
    disposition: fix
    note: |
      The range is written with "to", but the standing convention requires ranges to use en dashes.
    suggestion: Hold out 300–800 cases, with about 500 running in under five minutes.
  - severity: minor
    article: eval-engineering
    locator: Let evidence decide what merges | Sample 1% to 5% of traces instead of capturing everything. | 1
    category: typography
    disposition: fix
    note: |
      The percentage range is written with "to", but the standing convention requires ranges to use en dashes.
    suggestion: Sample 1%–5% of traces instead of capturing everything.
  notes: |
    Changes required because one comma splice and two ranges violate the mechanics rules; capitalization, grammar, spelling, headings, and markup are otherwise clean.
shape:
  result: changes_required
  findings:
  - severity: minor
    article: eval-engineering
    locator: 'The first afternoon | For a tool-using agent, begin with three measurements: faithfulness to tool results, tool-parameter accuracy, and response quality. | 1'
    repair_from: 'The first afternoon | For a tool-using agent, begin with three measurements: faithfulness to tool results, tool-parameter accuracy, and response quality. | 1'
    category: heading_not_a_claim
    disposition: fix
    note: |
      The section is a concrete starter plan, but its heading names a time
      window rather than the argument the section makes. The reader can follow
      the content, yet the heading does not help them scan for its purpose.
    suggestion: Rename the heading to state the first-afternoon measurement and testing plan.
  notes: |
    I verified that the piece progresses from the trust problem to feedback-loop
    design, failure-derived tests, merge gates, and a practical starting plan,
    with a strong opening and landing; only the final section heading needs a
    clearer argumentative claim.
craft:
  result: changes_required
  findings:
  - severity: blocking
    article: eval-engineering
    locator: Make the score steer the run | Low context recall can reject a handoff. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Six consecutive "[subject] can [verb]" sentences make the mechanism sound enumerated rather than observed:
      "Low context recall can reject a handoff."
      "Bad tool use can trigger a retry or swap a node."
      "A hallucination can quarantine a branch."
      "A schema failure can block an edge."
      "A compliance risk can route to human review."
      "Verified completion can terminate the run."
      The construction is the author's own, so the remedy is editorial: vary or compress the sequence.
  notes: |
    I heard a confident, mechanically vivid explanation whose voice holds until one routing paragraph becomes a repeated sentence pattern. Changes are required because that six-sentence run makes the prose sound generated at the point where it should feel most operational.
