worth:
  result: approved
  findings: []
  omissions:
  - fact: The source's opening comparison between a $200 monthly model and a company with 1,000 engineers renting the same brain
    reader_loses: Some of the economic setup for why the harness, rather than the model, creates the advantage.
    verdict: defensible
  - fact: The exact installation commands, plugin commands, evalkit phase list, and evals/ directory layout
    reader_loses: Copy-paste setup instructions, which are not useful in a print piece and remain available in the source.
    verdict: defensible
  - fact: The source's vendor launch dates, AWS Apache 2.0 detail, and social-follow prompts
    reader_loses: Timing and promotional context, not part of the operating argument.
    verdict: defensible
  - fact: The source's final three-line recap and its repeated contrast between Friday output-scrolling and wiring the thermostat
    reader_loses: A redundant closing summary; the manuscript already states the same principles and call to action.
    verdict: defensible
  retentions:
  - passage: The travel-agent anecdote and the 83.9% quality versus 32.3% faithfulness figures
    costs: Opening space, but it makes the central failure concrete and motivates the rest of the piece.
    verdict: earns_place
  - passage: The thermometer-and-thermostat analogy and the return-arrow explanation
    costs: Several paragraphs of framing, but they define the distinction between analytics and engineering that organizes the article.
    verdict: earns_place
  - passage: The blind-test results and the four-week vendor unbundling
    costs: A substantial evidence section, but it establishes that the proposed workflow is practical and newly accessible.
    verdict: earns_place
  - passage: The 25-trace sampling template and verifier/environment safeguards
    costs: Detailed instructional space, but it turns the thesis into a repeatable method.
    verdict: earns_place
  - passage: The autonomous-merge examples and the warning about 38 green tests beside a broken product
    costs: A long section, but it supplies both the payoff and the essential specification-versus-score caveat.
    verdict: earns_place
  - passage: The first-afternoon checklist of three measurements, dataset choices, suite size, and five starter evals
    costs: The closing third of the piece, but it gives the reader an immediately usable starting plan.
    verdict: earns_place
  notes: |
    Approval: the manuscript gives the reader a coherent return-arrow argument and an actionable progression from production traces to steering evals, permanent tests, and constrained autonomous merges that the source's thread presents less efficiently.
evidence:
  result: changes_required
  findings:
  - severity: blocking
    article: eval-engineering
    locator: '- | That layer separates an impressive demo from a product someone can trust. | 1'
    category: invented_claim
    disposition: fix
    note: |
      The source says the layer separates an AI that impresses people from an AI that gets paid. It does not claim that the layer produces a product someone can trust.
  notes: |
    I checked every assertion, quotation, number, heading, and conclusion against the pinned extraction; external claims and sources were not available for checking.
