shape:
  result: changes_required
  findings:
  - severity: minor
    article: eval-engineering
    locator: 'The first afternoon | For a tool-using agent, begin with three measurements: faithfulness to tool results, tool-parameter accuracy, and response quality. | 1'
    repair_from: 'The first afternoon | For a tool-using agent, begin with three measurements: faithfulness to tool results, tool-parameter accuracy, and response quality. | 1'
    category: heading_not_a_claim
    disposition: fix
    note: |
      The section gives a concrete starting plan for building an evaluation
      suite, but its heading names a time period rather than the section's
      argument.
    suggestion: Rename the heading to state the section's claim, such as 'Start with five evals in one afternoon.'
  notes: |
    I verified that the piece's argument progresses coherently from the need for
    evaluation, through steering and testing, to merge gates and practical setup,
    with a clear ending; only the final heading fails to name its section's claim.
craft:
  result: changes_required
  findings:
  - severity: blocking
    article: eval-engineering
    locator: Turn failures into tests | Do not treat the recorded answer as truth. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Twelve bare imperative sentences spread through the piece create a repeated instructional shape: "Do not treat the recorded answer as truth"; "Test the verifier with one clearly correct and one plausible but wrong result before trusting it"; "Check that the environment does not reveal the answer before the agent reaches the tool"; "Simulate anything that costs money or writes to production"; "Run the loop repeatedly and an incident becomes a permanent check"; "Start in shadow mode for at least four hours of real traffic"; "Set a 2% deviation threshold between automated and human verdicts"; "Sample 1% to 5% of traces instead of capturing everything"; "Keep the gate closed on risky work and open on the boring 80%"; "Choose the dataset deliberately"; "Hold out 300 to 800 cases"; and "Install one skill, pull 25 traces, build one eval, and add another whenever something breaks." The pattern becomes audible as a checklist rather than a person reasoning sentence by sentence. Because this is faithful synthesis, the remedy is editorial: cut or consolidate several commands.
  - severity: minor
    article: eval-engineering
    locator: Make the score steer the run | Low context recall rejects a handoff; bad tool use triggers a retry or swaps a node; a hallucination quarantines a branch; a schema failure blocks an edge; a compliance risk routes to human review; verified completion terminates the run. | 1
    category: jargon
    disposition: fix
    note: |
      "Context recall" is a specialized evaluation term that is not defined for a competent engineer outside this subfield, so the routing example asks the reader to supply its meaning.
  notes: |
    The piece has a strong, specific voice and a useful rental/examiner metaphor, but its many bare imperatives eventually turn the argument into a checklist, and one evaluation metric arrives without definition.
