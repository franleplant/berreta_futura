craft:
  result: changes_required
  findings:
  - severity: minor
    article: mcp-protocol-update
    locator: Deprecation becomes a schedule | A Standards Track SEP cannot reach Final status until a matching scenario appears in the conformance suite, the same suite used to score official SDK tiers. | 1
    category: jargon
    disposition: fix
    note: |
      "SEP" is not defined, leaving a competent engineer outside the MCP community to infer the acronym.
  - severity: minor
    article: mcp-protocol-update
    locator: Deprecation becomes a schedule | For implementers targeting `2026-07-28`, the expectation is that future revisions, using extensions and deprecation windows, can be adopted without rewriting transport or lifecycle code. | 1
    category: passive
    disposition: fix
    note: |
      "The expectation is that" and "can be adopted" hide the actor and turn the closing argument into abstract, ownerless prose.
  notes: |
    I heard a confident, technically fluent maintainer voice throughout, with two localized moments where unexplained terminology and abstract passive phrasing interrupt the otherwise direct account.
