craft:
  result: changes_required
  findings:
  - severity: blocking
    article: mcp-in-a-nutshell
    locator: Three participants, two places | The host is the AI application, such as Claude Code, Claude Desktop, or Visual Studio Code. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Six consecutive subject-plus-declarative-verb sentences make the explanation sound mechanically enumerated:
      "The host is the AI application, such as Claude Code, Claude Desktop, or Visual Studio Code."
      "It coordinates one or more clients."
      "Each client maintains a connection to one server and obtains context for the host to use."
      "A local server commonly uses standard input and output to communicate with one client on the same machine."
      "A remote server uses Streamable HTTP and may serve many clients."
      ""Local" and "remote" describe where the program runs, not a different kind of server."
      The remedy is editorial: cut or reshape the run.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: The inner and outer layers | The transport layer abstracts communication details from the protocol layer, enabling the same JSON-RPC 2.0 message format across all transport mechanisms. | 1
    category: dead_words
    disposition: fix
    note: |
      This is an abstraction-stack sentence: "layer" abstracts "details" from another "layer" and ends in a generalized enabling clause. It explains little beyond the preceding sentences and reads like system prose.
  - severity: major
    article: mcp-in-a-nutshell
    locator: Staying current | The application decides what the model does with the result; MCP defines how that result gets there. | 1
    category: weak_close
    disposition: fix
    note: |
      The closing sentence restates the piece's central division of responsibility instead of leaving a sharper final implication. The same point has already been made in the opening and in the preceding section.
  notes: I heard a clear technical explainer whose voice turns schematic in the participant overview and whose final line repeats its governing distinction.
