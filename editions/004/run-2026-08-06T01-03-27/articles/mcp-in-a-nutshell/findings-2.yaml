mechanics:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: The inner and outer layers | a client may call the mandatory `server/discover` method | 1
    category: grammar
    disposition: fix
    note: |
      The method needs a definite article: "the mandatory `server/discover` method."
      This is the editors' synthesis, so the editors fix it.
    suggestion: a client may call the mandatory `server/discover` method
  - severity: minor
    article: mcp-in-a-nutshell
    locator: What a server can offer | a fixed catalogue | 1
    category: spelling
    disposition: fix
    note: |
      "Catalogue" is British spelling, while "behavior" later in the piece is American.
      The piece should use one spelling convention throughout.
    suggestion: Change "catalogue" to "catalog" (or change "behavior" to "behaviour").
  notes: |
    Two mechanics issues require changes: one missing article and one British-American spelling inconsistency.
