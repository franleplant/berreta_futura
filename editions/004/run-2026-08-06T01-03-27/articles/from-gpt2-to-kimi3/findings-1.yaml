worth:
  result: changes_required
  findings:
  - severity: minor
    article: from-gpt2-to-kimi3
    locator: KimiK3 uses several kinds of memory | This is possibly the most important part of the block_attn_res function. | 1
    repair_from: KimiK3 uses several kinds of memory | This is possibly the most important part of the block_attn_res function. | 1
    category: section_does_not_pay
    disposition: fix
    note: |
      This sentence is an isolated comment about the source's implementation
      function, not an explanation of KimiK3's architecture. It spends space
      without advancing the argument and breaks the conclusion of the
      AttnRes section.
    suggestion: Delete the sentence.
  omissions:
  - fact: The source's clarification that the usual O(N^2) framing describes materializing full attention, while FlashAttention and KV caching change the practical cost picture.
    reader_loses: A useful caveat about what linear attention is and is not solving.
    verdict: defensible
  - fact: The generalized Householder-transition description and the detailed chunkwise recurrence equations for parallel DeltaNet training.
    reader_loses: The formal mechanism behind the re-parameterization.
    verdict: defensible
  - fact: The source's code listings, installation/setup context, exact tensor shapes, and implementation snippets.
    reader_loses: Copy-paste implementation detail that is not usable or necessary on a printed page.
    verdict: defensible
  - fact: The UMMA example and the explicit FLOP decomposition for chunk size C.
    reader_loses: A hardware-specific illustration of why intermediate chunks can outperform C=1.
    verdict: defensible
  retentions:
  - passage: Twenty-two thousand five hundred and eighty. That's how many GPT-2 (2019) models fit inside KimiK3 (2026).
    costs: A brief numerical hook that frames the scale comparison.
    verdict: earns_place
  - passage: The pattern is now visible. Each generation adds capacity where the preceding memory system loses something...
    costs: A short synthesis that makes the architectural progression explicit.
    verdict: earns_place
  - passage: The final model is large, but size alone is not the architectural story.
    costs: The closing thesis and the piece's own interpretive position.
    verdict: earns_place
  notes: |
    Changes required because one stray implementation comment spends space without
    contributing to the otherwise effective progression from cache limits to
    selective memory and retrieval. The piece gives readers a compact causal
    account of why each architectural addition from GPT-2 through KimiK3 exists,
    rather than merely listing the models' features.
