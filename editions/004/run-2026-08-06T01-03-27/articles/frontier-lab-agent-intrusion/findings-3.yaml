craft:
  result: changes_required
  findings:
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: Two ways into a production pod | The first vector used HDF5 external raw storage. | 1
    category: jargon
    disposition: fix
    note: |
      "HDF5 external raw storage" and the later "fsspec reference" name mechanisms before giving an outside engineer enough footing to understand what they are. Define the terms briefly at first use, or describe the mechanism without both labels.
    suggestion: |
      Add a short plain-language gloss after each term at its first appearance.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: From pod to network | Everything that follows, on this day and the next, descends from it. | 1
    category: dead_words
    disposition: fix
    note: |
      This portentous hinge sentence announces a significance the surrounding chronology already demonstrates; "descends from it" is vague and decorative.
    suggestion: |
      Cut the sentence and let the next section carry the transition.
  notes: |
    I heard a patient, specific forensic narrative with a human voice, interrupted only by a few unglossed technical labels and one announced, rather than demonstrated, causal hinge.
