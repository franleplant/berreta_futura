briefs:
- id: cover-synthetic
  purpose: cover
  prompt: 'A square abstract editorial cover illustration, at least 1000 by 1000 pixels, for a print magazine issue about the machinery that surrounds a machine-learning model: protocols, evaluations, architectures and human judgment that make a capable model dependable. Compose one compact abstract proposition from three to seven large geometric components: a single small solid element held, guided and bounded by larger structural forms around it, so the small element reads as subordinate to the system that carries it. Leave a substantial field of quiet negative space. Publication ink set only: warm off-white paper ground, charcoal ink, deep cobalt, brick coral, and one restrained muted-green or dusty-lavender accent, all at low to medium saturation with slight pigment variation, subtle paper tooth and quiet print grain. Controlled dimensional shading and synthetic material depth are welcome where they strengthen the proposition. Preserve a legible silhouette at thumbnail size and keep important detail away from the extreme edges. Judge anatomy of forms, materials, lighting, intersections and physical relationships as strictly as composition. Avoid all typography: no masthead, title, issue number, caption, logo, watermark, pseudo-writing, lettering or numerals anywhere in the image. Avoid literal diagrams, icon systems, circuit-board motifs, brain or robot imagery, generic-AI futurism, neon gradients, ornamental complexity and photorealism.'
- id: cover-art-directed
  purpose: cover
  prompt: 'A square studio photograph, at least 1000 by 1000 pixels, made as an edition-specific artwork for a print magazine issue about how a small capable component only becomes dependable inside the larger system built around it. Photograph one physical constructed object on a warm off-white seamless background: a single small hand-thrown ceramic bead, glazed brick coral, held precisely at the centre of a much larger machined jig of turned wood and matte steel, with cobalt-anodised clamps and one muted-green calibration ring. The jig is honest workshop hardware, obviously made by hand, cradling rather than crushing the bead. Use soft directional daylight from the upper left, gentle falloff, true contact shadows, and materially convincing surfaces: glaze reflections, brushed metal, grain, faint dust. Colour stays in the publication palette at low to medium saturation: warm off-white, charcoal, deep cobalt, brick coral, muted green, small warm-ochre accents. Keep a strong readable silhouette at thumbnail size and keep important detail away from the extreme edges; print-friendly midtones, no crushed blacks. Do not include any typography, masthead, caption, logo, label, watermark, pseudo-writing or numerals. Do not include humans or hands. Do not include string, knots, paper scraps, diagrams, pinboards or collage elements. Avoid generic-AI futurism, glossy product-render sheen, neon lighting, impossible reflections and incoherent joinery.'
- id: cover-wildcard
  purpose: cover
  prompt: 'A square, at least 1000 by 1000 pixels, single surprising image for the cover of a print magazine issue about capability held safely inside a system. One improbable proposition, immediately legible at thumbnail size: an enormous industrial bench vice of charcoal cast iron and cobalt-painted steel, jaws closed on a single perfect soap bubble that has not burst, the bubble iridescing faintly in brick coral, muted green and dusty lavender against a warm off-white studio void. Scale shock and arrested motion carry the image: the vice is monumental, the bubble is small, intact, and impossibly calm; the jaw faces dimple the film without breaking it. Photographic realism of materials, with believable contact between rubbered jaw faces and the bubble skin, true soft shadow beneath, and specular highlights that obey one light source from the upper left. Keep the silhouette unmistakable and centred, with clean margins and no important detail at the extreme edges; print-safe tonal range with open midtones and no muddy darks. No typography of any kind: no masthead, title, caption, logo, label, watermark, pseudo-writing or numerals. No humans, no hands. Avoid clutter, arbitrary symbols, floating debris, sparkles, neon cyberpunk, familiar AI-futurist imagery, incoherent physics and lens-flare spectacle.'
- id: opener-frontier-lab-agent-intrusion
  purpose: opener
  article_id: frontier-lab-agent-intrusion
  prompt: 'A square wordless illustration, at least 1000 by 1000 pixels, in original family-friendly children''s science-comedy manga style: simple charcoal contours, rounded readable expressions, economical watercolour washes, minimal hatching, restrained halftone, quiet print grain, and exactly one playful visual idea. Scene: in a calm workshop corridor, a curious school-age boy with round glasses crouches at the left and follows a thin mischievous red thread of signal that slips through three layered gates arranged across the centre of the frame, each gate a little sturdier than the last; at the right, a compact non-animal helper robot has already trapped the head of the red thread inside a clear glass containment box and is calmly latching its lid. The mood is competent and unpanicked, gently funny, never frightening. Palette: gentle historical magazine colour at low to medium saturation, background chosen by the setting, using softened cyan and cobalt workshop walls, muted-green gate frames, dusty-lavender shadow, small warm-ochre accents, warm off-white breathing room and charcoal ink, with the red signal as the only hot note; at least three distinct non-neutral colours and no uniform single-colour background. Strong silhouettes and expressions that stay legible when printed small; print-friendly contrast; slight pigment variation and subtle paper tooth. Keep the essential subject well inside the frame so a square crop cannot cut it. Cast is exactly one boy and one robot. Avoid: any recognizable franchise character, blue robotic cats, franchise gadgets, copied costumes or faces; uniform yellow, mustard, beige, sepia, cream-paper or bright cyan backgrounds; extra humans, extra robots or robot-faced background appliances; decorative montages, contact sheets or filler patterns; dense technical realism, steampunk clutter, excessive crosshatching; glossy modern anime rendering, painterly concept art, neon cyberpunk, photorealism; captions, labels, speech balloons, interface glyphs, numerals or any decorative pseudo-writing.'
  subject: The recurring pair trace a mischievous abstract red signal through layered security gates and calmly seal it inside a transparent containment box.
  composition: Square composition with the boy at left, three layered gates across the centre, and the robot with the clear containment box at right, the full red trace kept well inside the frame and legible at A5.
  alt_text: A bespectacled boy and friendly helper robot trace a red signal through layered workshop gates and contain it in a clear box.
  credit: Original illustration by the editors with Codex image generation.
- id: opener-eval-engineering
  purpose: opener
