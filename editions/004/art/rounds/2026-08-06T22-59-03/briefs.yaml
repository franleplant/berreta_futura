  prompt: 'A square wordless illustration, at least 1000 by 1000 pixels, in original family-friendly children''s science-comedy manga style: simple charcoal contours, rounded readable expressions, economical watercolour washes, minimal hatching, restrained halftone, quiet print grain, one playful visual idea. Scene: a bright test bench where small colourful sample blocks ride a looping wooden tray track; a curious school-age boy with round glasses works a hand stamp at the centre while a compact non-animal helper robot flips a points lever that sends one block down a rejection chute; a second block has sprung off a paddle and arcs back over the loop for another pass; an empty review desk with an unused chair waits at the right. Cheerful, methodical, gently comic. Palette: gentle historical magazine colour at low to medium saturation chosen by the setting, with muted-green bench, softened cobalt machinery, brick-coral samples, dusty-lavender shadow, small warm-ochre accents, warm off-white breathing room and charcoal ink; at least three distinct non-neutral colours and no uniform single-colour background. Strong silhouettes and expressions legible at small print size, print-friendly contrast, slight pigment variation, subtle paper tooth. Keep the essential action well inside the frame so a square crop cannot cut it. Cast is exactly one boy and one robot. Avoid: any recognizable franchise character, blue robotic cats, franchise gadgets, copied costumes or faces; uniform yellow, mustard, beige, sepia, cream-paper or bright cyan backgrounds; extra humans, extra robots or robot-faced background appliances; decorative montages or filler patterns; dense technical realism, steampunk clutter, excessive crosshatching; glossy modern anime rendering, painterly concept art, neon cyberpunk, photorealism; captions, labels, speech balloons, interface glyphs, numerals or any decorative pseudo-writing.'
  subject: The pair operate a physical evaluation loop with stamping, rerouting and rejection stations while one failed sample springs back for another pass.
  composition: Square composition with the looping tray track filling the lower two thirds, the pair working at centre, an empty human-review desk at right, and the rebounding sample arcing above the loop.
  alt_text: A boy and helper robot test colourful model outputs on a looping tray system while one failed sample springs back for another pass.
