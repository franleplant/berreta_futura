  composition: >-
    The full test loop spans the foreground, the pair work at center, an empty
    review desk sits at right, and a failed sample springs back for another pass.
  alt_text: A boy and helper robot test colorful model outputs on a looping tray system while one failed sample springs back for another pass.
  credit: Original illustration by the editors with Codex image generation.
