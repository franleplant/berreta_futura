craft:
  result: changes_required
  findings:
  - severity: blocking
    article: pragmatic-leverage
    locator: '- | If you''re only using AI to write the code, then you''re taking the 2–4 hours of coding time down to 10–20 minutes, but you haven''t accelerated anything else here. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Six conditional constructions make the piece sound patterned: "If you're only using AI...", "But if you use AI...", "If the model is 50% likely...", "If you draw this out...", "if you've done some work...", and "If you're doing multiple phases...". The author's idiom is protected in faithful_edit, so the remedy is editorial: cut or restructure enough of these sentences to restore variation.
  scores:
    voice: 4
    sentence_variety: 2
    economy: 3
  notes: I hear a clear, conversational practitioner voice, but the argument is carried by a repeated conditional sentence shape that becomes audible before the piece ends.
