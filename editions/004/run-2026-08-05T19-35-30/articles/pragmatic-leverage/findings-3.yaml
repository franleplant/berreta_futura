worth:
  result: changes_required
  findings:
  - severity: major
    article: pragmatic-leverage
    category: no_position
    disposition: fix
    note: |
      The manuscript is a faithful, competent condensation of the source, but it adds no ordering judgment, defended cut, or claim of its own. Its rationale describes the source's practical account rather than stating what this magazine wants the reader to conclude.
    suggestion: Add a brief editorial frame naming the practical judgment this piece wants the reader to carry away.
  omissions:
  - fact: The opening framing that this is an addendum or side-quest to a recent series, published standalone because it did not fit the main post
    reader_loses: The piece's relationship to the author's broader series and why it appears independently.
    verdict: defensible
  - fact: 'The note that the piece is referenced in Why Software Factories Fail part 2: Turning the lights back on'
    reader_loses: A cross-reference for readers who want the surrounding argument.
    verdict: defensible
  - fact: The author's @dexhorthy handle
    reader_loses: A direct identifier for finding the author on X.
    verdict: defensible
  - fact: The source's explicit note label before the explanation of expected pain
    reader_loses: Only a structural cue; the explanatory content remains.
    verdict: defensible
  retentions:
  - passage: Even before AI, only 25-50% of the time...
    costs: A paragraph, but it establishes the baseline that coding is only 25-50% of shipping time; it earns its place.
    verdict: earns_place
  - passage: If you're only using AI to write the code...
    costs: A paragraph, but it defines the failure of code-only acceleration; it earns its place.
    verdict: earns_place
  - passage: But if you use AI to help you plan and align...
    costs: A short paragraph containing the central 2-3x leverage claim; it earns its place.
    verdict: earns_place
  - passage: Let's assume that if you yolo a two-sentence prompt...
    costs: The baseline probability example needed for the leverage comparison; it earns its place.
    verdict: earns_place
  - passage: Now let's say you are a principal engineer...
    costs: The detailed-spec counterexample makes the diminishing rework risk concrete; it earns its place.
    verdict: earns_place
  - passage: 'And at the far end: write every line yourself.'
    costs: The zero-rework endpoint completes the comparison; it earns its place.
    verdict: earns_place
  - passage: For this example I'm gonna blur...
    costs: The caveat separating probability from change cost prevents the expected-pain model from being misread; it earns its place.
    verdict: earns_place
  - passage: If you draw this out, there's an inverse relationship...
    costs: This states the general relationship the examples establish; it earns its place.
    verdict: earns_place
  - passage: What you don't want to do is spend 6 hours...
    costs: The 6-hour/10-minute rule supplies an actionable planning heuristic; it earns its place.
    verdict: earns_place
  - passage: You need to do this without overindexing...
    costs: The product-to-technical zoom example explains how to apply the heuristic under uncertainty; it earns its place.
    verdict: earns_place
  - passage: This is what we mean by leverage...
    costs: The closing synthesis connects phased planning to steering and expected-pain reduction; it earns its place.
    verdict: earns_place
  - passage: Good luck.
    costs: A non-informational sign-off that could be removed without losing substance.
    verdict: cut
  notes: Changes required because the edit preserves the source's operational argument but gives the magazine no explicit editorial position of its own. The piece is shorter than the source and the omitted framing and cross-reference are defensible for an ephemeral X article; every substantive retained passage earns its place.
