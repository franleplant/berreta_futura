worth:
  result: changes_required
  findings:
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | What you don't want to do is spend 6 hours planning a task for which you could have eliminated 80% of the expected pain in the first 10 minutes. | 1
    repair_from: The 80/20 rule in AI coding leverage | What you don't want to do is spend 6 hours planning a task for which you could have eliminated 80% of the expected pain in the first 10 minutes. | 1
    category: lost_operational_detail
    disposition: fix
    note: |
      The source explains how to apply pragmatic leverage: stop planning at one level when unanswered questions require zooming into technical detail, then steer a little at each planning phase to reduce expected pain. The manuscript keeps the warning against overplanning but drops this method, leaving the reader without the source's most actionable guidance.
    suggestion: Restore a concise version of the zoom-down and phase-by-phase steering guidance.
  - severity: major
    article: pragmatic-leverage
    category: over_compressed
    disposition: fix
    note: |
      The central argument survives, but the cut removes the practical procedure that turns the expected-pain heuristic into a working planning practice. Restoring the zoom-down example and the instruction to steer at each phase would bring the piece back above the bone.
    suggestion: Add the two omitted application points without restoring the source's introductory metadata.
  omissions:
  - fact: 'The post is an addendum to a recent series and is referenced in Why Software Factories Fail part 2: Turning the lights back on.'
    reader_loses: No substantive loss; this publication context does not affect the argument.
    verdict: defensible
  - fact: The explicit statement that effort invested up front and expected pain have an inverse relationship.
    reader_loses: Little loss; the expected-pain equation and the 6-hours-versus-10-minutes example convey the relationship.
    verdict: defensible
  - fact: The warning not to overindex on questions that cannot be answered without going down a level.
    reader_loses: A reader may not know when to stop product-level planning and inspect technical feasibility.
    verdict: needed
  - fact: The example of ending Product-level work and zooming down to technical details to understand feasibility.
    reader_loses: The concrete trigger for changing planning levels is missing.
    verdict: needed
  - fact: The instruction that, across multiple planning phases from 50kft to 10kft, you should do a little steering at each phase to eliminate as much expected pain as possible.
    reader_loses: The reader loses the operational method for applying leverage continuously rather than only making one initial planning investment.
    verdict: needed
  - fact: The source's spelling and punctuation variants ('Lets', 'yolo', and '2-3x') are normalized in the manuscript.
    reader_loses: Nothing substantive.
    verdict: defensible
  retentions:
  - passage: Even before AI, only 25–50% of the time to ship a feature was writing the code itself.
    costs: This compact baseline establishes why coding speed alone is insufficient; it earns its space.
    verdict: earns_place
  - passage: If you're only using AI to write the code
    costs: This gives the concrete 2–4-hours-to-10–20-minutes comparison that makes the leverage claim legible; it earns its space.
    verdict: earns_place
  - passage: But if you use AI to help you plan and align
    costs: This states the article's main practical conclusion and its 2–3× estimate; it earns its space.
    verdict: earns_place
  - passage: Let's assume if you yolo a two-sentence prompt into your factory
    costs: The 50% rework baseline supplies the first endpoint of the thought experiment; it earns its space.
    verdict: earns_place
  - passage: Now let's say you are a principal engineer with 10 years of experience.
    costs: The detailed-spec endpoint shows that even expert planning does not eliminate all rework; it earns its space.
    verdict: earns_place
  - passage: 'And at the far end: write every line yourself.'
    costs: The zero-rework endpoint completes the leverage spectrum; it earns its space.
    verdict: earns_place
  - passage: note For this example I'm gonna blur
    costs: The caveat distinguishes probability from expected pain and prevents the percentages from being misread; it earns its space.
    verdict: earns_place
  - passage: expected pain = P(you'll have to change it)
    costs: The equation is the piece's reusable decision heuristic; it earns its space.
    verdict: earns_place
  - passage: good luck.
    costs: A sign-off that adds no information; the omitted zooming and steering guidance could occupy this space.
    verdict: cut
  notes: |
    Changes required because the manuscript preserves the leverage thesis but omits the source's concrete method for zooming into feasibility and steering across planning phases.
