    article: from-gpt2-to-kimi3
    locator: – | A KV cache preserves exact token history but grows with context. | 1
    repair_from: – | A KV cache preserves exact token history but grows with context. | 1
    category: invented_claim
    disposition: fix
    note: |
      The source says the KV cache retains key and value vectors for previous tokens. It does not claim that the cache preserves the exact token history; that wording overstates what is stored.
