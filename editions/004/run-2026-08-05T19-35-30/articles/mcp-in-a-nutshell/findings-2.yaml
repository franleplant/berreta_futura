shape:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: The primitives carry context and action | Imagine a database server exposing a query tool, a resource containing the database schema, and a prompt with examples of using that tool. | 1
    repair_from: '- | The useful way to read the Model Context Protocol is as a boundary with a vocabulary. | 1'
    category: running_example
    disposition: fix
    note: |
      The piece introduces several unrelated examples—a VS Code connection pair,
      a database server, a Python SDK flow, and subscription notifications—but
      none carries the reader through the argument. The architecture remains
      understandable, yet the examples do not accumulate into one concrete case.
    suggestion: Establish one representative host-and-server scenario in the opening and reuse it through the architecture, primitives, and update-notification sections.
  scores:
    order: 4
    coherence: 4
    opening: 4
    ending: 4
  notes: |
    I verified that the piece moves coherently from MCP's boundary, to connections,
    primitives, and request context, but its examples do not form a continuous
    running case.
craft:
  result: changes_required
  findings:
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | The useful way to read the Model Context Protocol is as a boundary with a vocabulary. | 1'
    category: weak_opening_sentence
    disposition: fix
    note: |
      "The useful way to read" clears its throat before the protocol appears; the
      sentence announces a reading method instead of beginning with the protocol's
      concrete function.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: The primitives carry context and action | The data layer is the useful center of MCP because it defines what can cross the boundary. | 1
    category: dead_words
    disposition: fix
    note: |
      "The useful center" is abstract evaluative language that adds no mechanism;
      the sentence already explains what the data layer does without ranking it.
  - severity: major
    article: mcp-in-a-nutshell
    locator: Requests carry their own context | The result is a protocol in which tools and data stay in their own servers while one conversation can discover them, use them, and notice when they change. | 1
    category: weak_close
    disposition: fix
    note: |
      The closing sentence restates the opening promise—separate servers, shared
      discovery, use, and change notification—without leaving the reader with a
      new consequence or question.
  scores:
    voice: 4
    sentence_variety: 4
    economy: 3
  notes: |
    I heard a clear, technically minded explainer whose opening and closing lean on
    abstract summary language, with one evaluative phrase that can be removed.
