craft:
  result: changes_required
  findings:
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | An AI application becomes more useful when it can reach tools and data outside its own model. | 1'
    category: weak_opening_sentence
    disposition: fix
    note: |
      The opening announces general usefulness before giving the reader a concrete
      problem or interaction.
    suggestion: |
      Open with the concrete exchange MCP enables between an application and an external tool or data source.
  - severity: major
    article: mcp-in-a-nutshell
    locator: One host, several dedicated connections | The architecture has two layers. | 1
    category: no_voice
    disposition: fix
    note: |
      The voice disappears into a neutral taxonomy here: the prose classifies layers
      and transport behavior evenly, with no particular human angle or texture.
    suggestion: |
      Anchor the explanation in one concrete connection or request before naming the architectural layers.
  - severity: major
    article: mcp-in-a-nutshell
    locator: The primitives are the useful part | Every request carries the protocol version and relevant capabilities in its `_meta` field, and clients normally identify themselves there as well. | 1
    category: jargon
    disposition: fix
    note: |
      `_meta`, protocol capabilities, and client identification are introduced as
      implementation terms without a gloss, making this nutshell harder to enter
      for engineers outside the MCP subfield.
    suggestion: |
      Add a short plain-language explanation of `_meta` and capabilities, or remove those implementation details from this overview.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: One host, several dedicated connections | The data layer is the inner layer, while the transport layer is the outer layer. | 1
    category: dead_words
    disposition: fix
    note: |
      This is a definite-article equation that repeats the layer names without
      explaining what the distinction enables.
    suggestion: |
      Replace the equation with the practical consequence of separating message semantics from connection mechanics.
  - severity: major
    article: mcp-in-a-nutshell
    locator: Requests do not depend on a remembered connection | The protocol is the part that lets them meet. | 1
    category: weak_close
    disposition: fix
    note: |
      The closing sentence restates the article's boundary metaphor instead of
      leaving the reader with a new implication or useful perspective.
    suggestion: |
      End on the concrete benefit of keeping tools and data in their own systems while making them usable in one conversation.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: Requests do not depend on a remembered connection | The protocol is the part that lets them meet. | 1
    category: cliche
    disposition: fix
    note: |
      "Lets them meet" is a familiar personification that adds polish but no
      mechanism at the point where the explanation should be most precise.
    suggestion: |
      Replace the personification with the specific action the protocol coordinates.
  scores:
    voice: 3
    sentence_variety: 3
    economy: 3
  notes: |
    I heard a clear technical explainer that gradually turns into an even taxonomy,
    with its weakest moments coming when implementation jargon and summary metaphors
    replace concrete explanation.
