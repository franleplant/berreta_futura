worth:
  result: changes_required
  findings:
  - severity: blocking
    article: factory-systems-problem
    repair_from: '- | Software factories are super real, but we need to be realistic. | 1'
    category: longer_than_source
    disposition: fix
    note: |
      The manuscript is substantially longer than the combined pinned sources.
      A faithful edit can justify source-length treatment when it makes
      paywalled, ephemeral, or scattered material accessible; here, however,
      the edit expands three short posts with added connective and rhetorical
      wording, defeating the condensation promise.
    suggestion: Cut the added connective language and preserve only the material needed to collect the three posts clearly.
  - severity: major
    article: factory-systems-problem
    locator: '- | Blog post time. | 1'
    repair_from: '- | It won''t be solved through tokens or how you apply the tokens (but it is a piece of the puzzle), ugh. | 1'
    category: section_does_not_pay
    disposition: fix
    note: |
      "Ugh. Blog post time." is pure transition and does not inform the reader.
      Its space could carry the omitted context that the service-bus post was a
      second hot take prompted by the first one, or simply be removed to bring
      the edit back under source length.
    suggestion: Delete the transition and move directly into the service-bus argument.
  - severity: minor
    article: factory-systems-problem
    locator: '- | Lots of bad memories here. | 1'
    repair_from: '- | Making the entire service bus non-deterministic would be a mistake. | 1'
    category: section_does_not_pay
    disposition: fix
    note: |
      This personal aside adds no argument beyond the preceding warning that a
      non-deterministic service bus is a mistake. It is expendable space in an
      already overlong faithful edit.
    suggestion: Cut the aside or retain only a concrete consequence if one is needed.
  omissions:
  - fact: The opening context, 'second hot take, as it seems the first hot take landed.'
    reader_loses: The reader does not know that the service-bus post responds to the reception of an earlier hot take.
    verdict: defensible
  retentions:
  - passage: Ugh. Blog post time.
    costs: A transition with no information; the space could restore the omitted second-hot-take context or reduce the overlength.
    verdict: cut
  - passage: Lots of bad memories here. Not great tech impl, but the theory / education is generally on point.
    costs: A personal aside that repeats the caution already made and occupies space in an already overlong edit.
    verdict: cut
  - passage: At home, in your homelab, you should be cracking on this problem space...
    costs: Several lines of exhortation, but they give the reader concrete career and practice advice.
    verdict: earns_place
  notes: |
    Changes required because the faithful edit is longer than the three source posts combined and spends avoidable space on transitions and personal asides. The collection does give a reader convenient access to three scattered posts and preserves their central systems-engineering, corporate-culture, and deterministic-service-bus arguments.
