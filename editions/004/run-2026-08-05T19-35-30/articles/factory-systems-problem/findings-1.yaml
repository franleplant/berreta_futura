craft:
  result: changes_required
  findings:
  - severity: major
    article: factory-systems-problem
    locator: '- | If someone is selling you a factory rn and they aren''t in the super small cohort (i.e. they are likely startups created in last six months!) or circa <10 people in the who''s-who, who have been trying (and realistically failing) over the last two years. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Three conditional openings repeat the same setup: "If someone is selling you a factory rn...", "if you want a super fast promotion...", and "If you want a modern plug and play choice...". The pattern becomes audible; cut or restructure one of the conditional sentences.
  - severity: major
    article: factory-systems-problem
    locator: '- | Look up anything in the .NET space such as MassTransit, NServiceBus, WCF if you wanna steal ideas for prompting. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Three consecutive imperatives—"Look up...", "Use it and have a job invoke...", and "Don't make the entire service bus..."—give the final paragraph a checklist cadence. Vary or cut one.
  - severity: minor
    article: factory-systems-problem
    locator: '- | Software factories are super real but we need to be realistic. | 1'
    category: weak_opening_sentence
    disposition: fix
    note: |
      "Super real" and "realistic" announce the stance while repeating the same word family. Open on the concrete systems claim instead.
  - severity: minor
    article: factory-systems-problem
    locator: '- | The best practices right now are to build abstractions/pieces needed which entails solving non-agent topics. | 1'
    category: dead_words
    disposition: fix
    note: |
      This is an abstraction stack ("best practices", "abstractions/pieces", "non-agent topics") that delays the actual examples. Name the work directly or move to the sandboxing and build details.
  - severity: minor
    article: factory-systems-problem
    locator: '- | The factory aspects haven''t been cracked yet, the innovators are toying around with discovering practices and pieces. | 1'
    category: passive
    disposition: fix
    note: |
      "Haven't been cracked" and later "It won't be solved through tokens..." hide the actor who must do the solving. Name the people or teams where that matters.
  - severity: minor
    article: factory-systems-problem
    locator: '- | Almost lights out. | 1'
    category: dead_words
    disposition: fix
    note: |
      The fragment is a portentous shorthand whose meaning is unclear without the following list. Let the concrete list carry the emphasis.
  - severity: minor
    article: factory-systems-problem
    locator: '- | smashing corporate friction in the realm of DevEx for agents. | 1'
    category: jargon
    disposition: fix
    note: |
      "DevEx" is left undefined, and the surrounding abstraction makes the sentence harder to parse for an engineer outside this niche. Expand the term or state the friction plainly.
  - severity: minor
    article: factory-systems-problem
    locator: '- | n8n was a silly idea, which I''ve always suspected was developed by young folks in Silicon Valley who are all in on the LLM craze who have never worked in corporate in their life thus didn''t have the knowledge that service buses are a solved problem and there''s deep prior art in the spooky land of enterprise. | 1'
    category: jargon
    disposition: fix
    note: |
      "Service buses" and the named products that follow assume specialist background without a brief definition of the architectural role. Add the function before the product names.
  scores:
    voice: 4
    sentence_variety: 2
    economy: 3
  notes: I heard a vivid, impatient personal voice, but the conditional and imperative cadences recur loudly, while a few abstract or undefined technical phrases blur otherwise concrete advice.
