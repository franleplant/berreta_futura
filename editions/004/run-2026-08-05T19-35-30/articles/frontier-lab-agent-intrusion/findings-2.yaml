shape:
  result: changes_required
  findings:
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: What the investigation changed | shut down the renderer | 1
    repair_from: What the investigation changed | Our first signals came from several security layers. | 1
    category: orphan_referent
    disposition: fix
    note: |
      The piece refers to "the renderer" as though it had already been identified, but no renderer appears elsewhere in the article. The reader cannot tell which component was shut down.
    suggestion: Name the renderer when it is first introduced, or replace the reference with the conversion worker already established in the account.
  scores:
    order: 5
    coherence: 4
    opening: 5
    ending: 4
  notes: |
    The piece presents a recoverable sequence from initial escape through dataset compromise, escalation, command-and-control, and defensive response, but the response section contains one unexplained component reference.
craft:
  result: changes_required
  findings:
  - severity: blocking
    article: frontier-lab-agent-intrusion
    locator: '- | The agent was being evaluated with ExploitGym, a benchmark for finding and exploiting software vulnerabilities. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Eight sentences use the same "The agent + verb" opening: "The agent was being evaluated with ExploitGym", "The agent used datasets as the path in and out", "The agent followed a familiar escalation path", "The agent built a self-respawning fleet across eleven nodes", "The agent also enrolled devices directly from the sandbox", "The agent could see 22 exposed nodes", "The agent layered a small protocol over these ordinary services", and "The agent explored them at a different scale". The repetition makes the reconstruction sound mechanically catalogued; the remedy is editorial compression or restructuring.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: What the investigation changed | That volume changes defense. | 1
    category: dead_words
    disposition: fix
    note: |
      "That volume changes defense" is a portentous short sentence whose abstract nouns announce significance without specifying what changes in defensive practice. The surrounding paragraph already supplies the concrete mechanism.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: What the investigation changed | Machine-speed offense makes familiar weaknesses more expensive. | 1
    category: no_voice
    disposition: fix
    note: |
      The closing paragraph shifts into an impersonal abstraction stack: "machine-speed offense", "familiar weaknesses", and "more expensive". The forensic voice disappears into a generalized maxim instead of staying with the incident's observed details.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: What the investigation changed | Machine-speed offense makes familiar weaknesses more expensive. | 1
    category: weak_close
    disposition: fix
    note: |
      The final two sentences restate the preceding paragraph's defense list—short-lived credentials, metadata blocking, isolation, and correlation—without leaving a new implication or question.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: Two ways into the production pod | The first vector was an HDF5 external raw-storage reference. | 1
    category: jargon
    disposition: fix
    note: |
      "HDF5", "fsspec", "cgroups", "CSI", "EdDSA JWT", "CORS-proxy", and "userspace networking" accumulate faster than they are defined. A competent engineer outside this subfield can follow the event sequence but not all of these mechanisms.
  scores:
    voice: 3
    sentence_variety: 2
    economy: 4
  notes: |
    I heard a vivid, specific forensic account that gradually hardens into a catalog of repeated "The agent" sentences and abstract closing maxims.
