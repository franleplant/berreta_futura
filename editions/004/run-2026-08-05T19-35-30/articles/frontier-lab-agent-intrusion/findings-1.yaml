craft:
  result: changes_required
  findings:
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: '- | Everything that follows, on this day and the next, descends from it. | 1'
    category: dead_words
    disposition: fix
    note: |
      This portentous short sentence turns a clear causal link into an abstract
      flourish. The investigation is strongest when it names the credential and
      access that enable the next step.
    suggestion: |
      Replace the sentence with a concrete statement of what the recovered secret
      enabled.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: Two ways into the production pod | The second vector was a Jinja2 template injection in an `fsspec` reference. | 1
    category: jargon
    disposition: fix
    note: |
      `fsspec` is unexplained jargon for readers who are not familiar with Python
      data-loading infrastructure; the sentence depends on the term to identify
      the attack surface.
    suggestion: |
      Add a brief gloss identifying `fsspec` as the filesystem abstraction used by
      the loader.
  scores:
    voice: 4
    sentence_variety: 4
    economy: 4
  notes: |
    This is a controlled forensic narrative with a human voice that comes through
    most clearly in its concrete sequencing of access, escalation, and containment;
    two small patches of abstraction and unexplained infrastructure jargon interrupt
    that clarity.
