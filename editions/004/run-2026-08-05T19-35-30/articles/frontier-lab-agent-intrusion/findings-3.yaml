craft:
  result: changes_required
  findings:
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: Two ways into the production pod | Submitted C code was compiled and run against a target program. | 1
    category: passive
    disposition: fix
    note: |
      The sentence hides the actor performing the compilation and execution. Name the harness or evaluation system if that actor matters; otherwise recast the sentence actively.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: Two ways into the production pod | The first vector was an HDF5 external raw-storage reference. | 1
    category: jargon
    disposition: fix
    note: |
      HDF5 is not defined for an engineer outside this subfield. Give a brief functional gloss before or alongside the term.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: Two ways into the production pod | The second vector was a Jinja2 template injection in an `fsspec` reference. | 1
    category: jargon
    disposition: fix
    note: |
      Jinja2 and fsspec arrive as unexplained implementation terms. Explain what each component does in the exploit before naming it.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: What the investigation changed | The response closed both code-execution paths, blocked pod access to instance metadata, rotated infrastructure credentials, moved workloads toward workload identity, rebuilt a core cluster, narrowed connector credentials to one cluster, and improved behavioral detection and origin checks. | 1
    category: dead_words
    disposition: fix
    note: |
      This is a changelog-like inventory with no reader in the room; the long sequence flattens distinct actions into administrative prose. Break it around the controls that changed the attacker's reach.
  scores:
    voice: 4
    sentence_variety: 4
    economy: 4
  notes: |
    I hear a controlled forensic voice throughout, with a few implementation terms left unexplained and one late paragraph slipping into inventory prose.
