shape:
  result: changes_required
  findings:
  - severity: major
    article: mcp-protocol-update
    locator: '- | Extensions now have reverse-DNS identifiers, negotiation in the capabilities map, delegated maintainers, their own repositories, and a path from experimental to official. | 1'
    repair_from: '- | Those transport changes also make traffic easier to operate. | 1'
    category: missing_transition
    disposition: fix
    note: |
      The piece moves from transport operations into extensions, then into tasks,
      authorization, deprecations, and schemas as an unmarked feature catalogue.
      The central stateless-session argument becomes difficult to track once this
      sequence begins.
    suggestion: Add a clear signpost that the piece is leaving the core transport changes and surveying the remaining specification updates.
  scores:
    order: 4
    coherence: 3
    opening: 5
    ending: 4
  notes: |
    This review verified that the piece opens with the session-removal argument,
    develops its operational consequences, and ends with the release timeline;
    changes are required because the later feature catalogue lacks a clear
    structural transition from that argument.
craft:
  result: changes_required
  findings:
  - severity: minor
    article: mcp-protocol-update
    locator: '- | The candidate is the largest revision since MCP launched, and it contains breaking changes. | 1'
    category: ai_phrasing
    disposition: fix
    note: |
      "Largest revision since MCP launched" is a significance claim the prose does not establish; it sounds like release-note emphasis rather than observed description.
    suggestion: |
      Replace the superlative with the specific scope of the breaking changes.
  - severity: major
    article: mcp-protocol-update
    locator: '- | Extensions now have reverse-DNS identifiers, negotiation in the capabilities map, delegated maintainers, their own repositories, and a path from experimental to official. | 1'
    category: dead_words
    disposition: fix
    note: |
      This is an abstraction stack and inventory: several institutional properties arrive in one balanced list without showing what any of them changes for a reader.
    suggestion: |
      Cut the list to the extension changes that alter implementation or governance, and connect each to its consequence.
  - severity: minor
    article: mcp-protocol-update
    locator: '- | Extensions now have reverse-DNS identifiers, negotiation in the capabilities map, delegated maintainers, their own repositories, and a path from experimental to official. | 1'
    category: jargon
    disposition: fix
    note: |
      "Reverse-DNS identifiers" is unexplained jargon for engineers outside this protocol community.
    suggestion: |
      Add a short parenthetical defining reverse-DNS identifiers as names derived from an organization's domain.
  - severity: major
    article: mcp-protocol-update
    locator: '- | Three older features are deprecated: Roots moves to tool parameters, resource URIs, or server configuration; Sampling moves to direct LLM-provider integration; and Logging moves to `stderr` for stdio transports or OpenTelemetry for structured observability. | 1'
    category: dead_words
    disposition: fix
    note: |
      The sentence is a changelog with no reader in the room: three feature migrations, separated by semicolons, ask the reader to decode a policy inventory rather than follow an argument.
    suggestion: |
      Split the sentence and state the practical migration consequence for each deprecated feature.
  - severity: minor
    article: mcp-protocol-update
    locator: '- | A Standards Track SEP cannot reach Final status until a matching scenario enters the conformance suite. | 1'
    category: jargon
    disposition: fix
    note: |
      "SEP" and "Standards Track" are protocol-governance terms the piece never defines.
    suggestion: |
      Expand SEP on first use and briefly explain what the Standards Track status controls.
  - severity: minor
    article: mcp-protocol-update
    locator: '- | The candidate was locked on May 21, 2026; the final specification ships on July 28. | 1'
    category: passive
    disposition: fix
    note: |
      "Was locked" hides who made the decision; the actor is relevant because the sentence describes the release process.
    suggestion: |
      Name the group that locked the candidate, or recast the sentence around the decision date.
  scores:
    voice: 3
    sentence_variety: 4
    economy: 3
  notes: |
    I heard a technically confident synthesis that becomes release-note inventory in its extension and deprecation passages, with a few undefined governance terms and one unsupported superlative.
