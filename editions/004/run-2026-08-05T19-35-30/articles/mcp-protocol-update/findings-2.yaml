worth:
  result: changes_required
  findings:
  - severity: blocking
    article: mcp-protocol-update
    locator: '- | Protocol version, client information, and capabilities travel in `_meta` on each request | 1'
    repair_from: '- | For implementers, the first decision is transport: the 2026-07-28 release candidate removes MCP''s protocol-level session | 1'
    category: stripped_utility
    disposition: fix
    note: |
      The source's concrete 2026 wire example requires the `MCP-Protocol-Version` header alongside `Mcp-Method` and `Mcp-Name`, with the request sent to `/mcp`. The manuscript names only the latter two headers and says the protocol version travels in `_meta`, leaving an implementer without the complete request contract and potentially implying that the required version header is unnecessary.
    suggestion: Include the complete required header set and clarify how the version header relates to the per-request `_meta` fields.
  omissions:
  - fact: 'The 2026 request wire format: `POST /mcp`, `Content-Type: application/json`, `MCP-Protocol-Version: 2026-07-28`, `Mcp-Method`, and `Mcp-Name`'
    reader_loses: Cannot configure or verify a conforming stateless HTTP request from the synthesis alone.
    verdict: needed
  - fact: The legacy `initialize`/`initialized` exchange's full JSON request and the example `Mcp-Session-Id` UUID
    reader_loses: No concrete before-and-after request pair for planning migration, but the prose still explains the old handshake and session.
    verdict: defensible
  - fact: The six SEP references and the December transport-plan provenance
    reader_loses: Cannot jump directly to the individual proposals or historical rationale, but the behavior changes themselves remain clear.
    verdict: defensible
  - fact: 'The worked `create_basket()` → `{basket_id: "b_123"}` → `add_item(basket_id: "b_123")` exchange'
    reader_loses: The explicit-handle pattern is less immediately concrete, though `basket_id` and `browser_id` are named.
    verdict: defensible
  - fact: The `Cache-Control` model and the statement that SSE is no longer the only way to learn that a list changed
    reader_loses: Less guidance on how to interpret `ttlMs` and `cacheScope`, but their purpose is stated.
    verdict: defensible
  - fact: The `ext-*` repository naming convention and independent extension versioning
    reader_loses: Less repository and release-management detail for extension maintainers.
    verdict: defensible
  - fact: Tools declare MCP Apps UI templates ahead of time so hosts can prefetch, cache, and security-review them before execution
    reader_loses: The host-side review workflow is slightly less explicit, though prefetching, caching, and review are retained.
    verdict: defensible
  - fact: The `iss`-omission future-version rejection warning and its mix-up-attack rationale
    reader_loses: Less urgency and security context, but the current validation requirement remains.
    verdict: defensible
  - fact: The `$defs` keyword alongside the listed JSON Schema composition features
    reader_loses: One schema vocabulary detail, without changing the stated support for references.
    verdict: defensible
  - fact: The conformance-suite requirement's SEP number and the explicit statement that the SDK tier system scores official SDKs against that same suite
    reader_loses: Cannot locate the governing proposal as quickly, but the policy consequence is retained.
    verdict: defensible
  - fact: Instructions to consult the changelog, open specification-repository issues, and use the contributor Discord Working Group channel
    reader_loses: No direct support route for implementation questions.
    verdict: defensible
  omissions_summary:
    verdict: over_compressed
    severity: major
    note: The missing required version-header/request shape is the restoration that matters; adding it near the opening transport decision would restore operational completeness without materially enlarging the piece.
  retentions:
  - passage: 'For implementers, the first decision is transport:'
    costs: Opening framing and the explicit migration order consume space, but they give the synthesis its implementation-oriented position.
    verdict: earns_place
  - passage: In practice, we've found this pattern
    costs: The maintainers' judgment about explicit handles takes several sentences, but it explains why the design is more than a compatibility workaround.
    verdict: earns_place
  - passage: Those transport changes also make traffic easier to operate.
    costs: The cache and tracing paragraph could be shortened, but it covers two distinct operational consequences that implementers need.
    verdict: earns_place
  - passage: Once the transport is updated, the next migration choices are extensions and lifecycle.
    costs: The transition sentence spends little space and supplies a useful migration structure.
    verdict: earns_place
  - passage: The release is a deliberate break, with machinery intended to make the next one less disruptive.
    costs: The governance synthesis repeats some policy details, but it connects the changes to a forward-looking rationale.
    verdict: earns_place
  - passage: Implementers targeting 2026-07-28 should use the window first
    costs: The closing recommendation occupies a short paragraph, but converts the source's timeline into an actionable sequence.
    verdict: earns_place
  retentions_summary:
    verdict: section_pays
    severity: none
    note: The retained passages provide framing, interpretation, operational consequences, or an implementation sequence; none is inert enough to cut before restoring the missing wire-format detail.
  notes: |
    Changes required because the synthesis gives implementers a clear transport-first migration plan and the release's major behavioral changes, but omits a required header from the concrete stateless request contract.
