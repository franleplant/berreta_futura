craft:
  result: changes_required
  findings:
  - severity: minor
    article: mcp-protocol-update
    locator: '- | It''s often a more powerful one. | 1'
    category: dead_words
    disposition: fix
    note: |
      "More powerful" is an unearned generic intensifier; the preceding paragraph
      already names the concrete advantages of explicit handles.
    suggestion: |
      Replace the evaluation with the specific advantage the pattern provides.
  - severity: minor
    article: mcp-protocol-update
    locator: '- | The release is a deliberate break, with machinery intended to make the next one less disruptive. | 1'
    category: dead_words
    disposition: fix
    note: |
      "Deliberate break" and "machinery" stack abstractions without adding
      information, producing the balanced, portentous register the house rules
      identify as robotic.
    suggestion: |
      State directly which mechanisms make future changes easier to adopt.
  - severity: minor
    article: mcp-protocol-update
    locator: '- | A Standards Track SEP cannot reach Final status until a matching scenario enters the conformance suite. | 1'
    category: jargon
    disposition: fix
    note: |
      "SEP" is used as an unexplained protocol-specific acronym, leaving a
      competent engineer outside this subfield to infer its meaning.
    suggestion: |
      Expand SEP at first use or briefly identify what kind of document it is.
  scores:
    voice: 4
    sentence_variety: 4
    economy: 4
  notes: |-
    I heard a confident, concrete technical synthesis with a clear human presence,
    interrupted briefly by a few abstract evaluations and one unexplained acronym.
