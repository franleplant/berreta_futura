shape:
  result: changes_required
  findings:
  - severity: major
    article: eval-engineering
    locator: Install the examiner | Two researchers tested 100 production traces from a voice agent, had a human expert label 39 kinds of failure, hid those labels, and gave the same cases to evaluation systems. | 1
    repair_from: '- | A software travel agent answered a simple trip question with an exchange rate, a weekly temperature, and museum hours. | 1'
    category: running_example
    disposition: fix
    note: |
      The opening establishes a software travel agent as the concrete case, but the next sections switch to a voice-agent benchmark, generic traces, and autonomous pull requests without returning to that case. The argument remains recoverable, but the piece loses a carrying example and each section begins to feel newly illustrated.
    suggestion: Choose one agent case and thread it through installation, routing, failure tests, and the merge gate, using the other examples only as a brief contrast.
  scores:
    order: 4
    coherence: 4
    opening: 4
    ending: 4
  notes: |
    I verified that the piece progresses from the need for evaluation through installation, behavioral routing, permanent tests, and autonomous merging, but its concrete examples do not form one continuous case.
craft:
  result: changes_required
  findings:
  - severity: blocking
    article: eval-engineering
    locator: Make the score change the run | Use a model from another family when possible | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      The piece uses 23 ownerless imperative sentences. They include:
      "Use a model from another family when possible", "Write one observable success condition",
      "Let the judge handle semantic calls", "Do not reward response length", "Pin the judge and log its version",
      "Optimize against a judge long enough", "Start with 25 complete traces", "Write each finding in four lines",
      "Then give each capability its own folder", "Never treat the recorded answer as truth",
      "Test the verifier with one clearly correct result", "Make sure the environment does not reveal the answer",
      "Simulate anything that costs money or writes to production", "Run this loop often enough",
      "Run the gate in shadow mode for at least four hours", "Keep it closed when automated and human verdicts differ",
      "Sample only 1% to 5% of traces", "Start this week with faithfulness, tool-parameter accuracy, and response quality",
      "Choose the dataset deliberately", "Keep 300 to 800 held-out cases", "Begin with five failures",
      "Install one skill, pull 25 traces, and build one eval today", and "Add another whenever something breaks".
      The repeated shape becomes the article's governing rhythm. Because it is the author's own construction,
      the remedy is an editor's: cut or substantially compress the instructional runs.
  - severity: minor
    article: eval-engineering
    locator: Let safe work merge itself | The model bill does not move. Everything else does. | 1
    category: dead_words
    disposition: fix
    note: |
      "Everything else does" is a vague balanced-clause punchline. It gestures at broad consequences
      without naming them, so the sentence adds emphasis more than understanding.
  - severity: minor
    article: eval-engineering
    locator: 'Let safe work merge itself | Choose the dataset deliberately: `final_response`, `single_step`, `trajectory`, or RAG. | 1'
    category: jargon
    disposition: fix
    note: |
      "Trajectory" and especially "RAG" are unexplained evaluation terms for a competent engineer outside
      this subfield. Define them or give the concrete dataset behavior each names.
  scores:
    voice: 4
    sentence_variety: 2
    economy: 3
  notes: |
    The piece has a vivid opening and a useful central examiner metaphor, but its voice gradually yields
    to a long sequence of commands, making the article sound more like an operational checklist than a person
    reasoning through the stakes.
