    I checked every factual assertion, quotation, number, attribution, and furniture element against the pinned extraction; I could not check claims against any external source because none is in scope.
mechanics:
  result: changes_required
  findings:
  - severity: major
    article: eval-engineering
    locator: 'The evals that repay the afternoon | The dataset type matters: `final_response` measures the answer alone, `single_step` one decision, `trajectory` the whole path, and RAG retrieval quality. | 1'
    category: grammar
    disposition: fix
    note: |
      The list is not grammatically parallel: `single_step`, `trajectory`, and RAG retrieval quality lack the verb supplied for `final_response`.
    suggestion: 'The dataset type matters: `final_response` measures the answer alone, `single_step` measures one decision, `trajectory` measures the whole path, and RAG measures retrieval quality.'
  - severity: minor
    article: eval-engineering
    locator: The evals that repay the afternoon | A living suite holds 300 to 800 cases, with 500 running in under five minutes. | 1
    category: typography
    disposition: fix
    note: |
      The range uses “to”; ranges are set with en dashes throughout the piece.
    suggestion: A living suite holds 300–800 cases, with 500 running in under five minutes.
  - severity: minor
    article: eval-engineering
    locator: Let safe work merge itself | Sampling 1% to 5% of traces avoids the cost of full capture. | 1
    category: typography
    disposition: fix
    note: |
      The range uses “to”; ranges are set with en dashes throughout the piece.
    suggestion: Sampling 1%–5% of traces avoids the cost of full capture.
  scores:
    grammar: 2
    typography: 3
    consistency: 4
  notes: |
    Changes required because one list is grammatically nonparallel and two numeric ranges use “to” instead of en dashes.
shape:
  result: changes_required
  findings:
  - severity: major
    article: eval-engineering
    locator: Make the score change the run | For the travel agent, an empty search result should force an admission of uncertainty rather than another polished invention. | 1
    repair_from: '- | The search tool had returned nothing, so the model filled the gap and passed its invention off as a lookup. | 1'
    category: duplication
    disposition: fix
    note: |
      The empty-search travel-agent failure is introduced in the opening, then restated as "For the travel agent, an empty search result should force an admission of uncertainty rather than another polished invention" and again as "For the travel agent, the empty search result becomes a test of whether the response stays faithful to the tool output." The repeated example slows the argument.
    suggestion: State the travel-agent failure once, then let later sections advance its implications without restating it.
  - severity: major
    article: eval-engineering
    locator: Let safe work merge itself | Every pull request an agent opens otherwise lands in a human queue. | 1
    repair_from: Let safe work merge itself | Every pull request an agent opens otherwise lands in a human queue. | 1
    category: running_example
    disposition: fix
    note: |
      The travel-agent case carries the opening and the first three sections, but the merge section switches to pull requests, production systems, and a self-improving codebase. The concrete thread is abandoned before the conclusion, so later claims feel like a new piece.
    suggestion: Carry the travel-agent case through the merge-gating discussion, using the coding examples only once as an explicit contrast.
  - severity: minor
    article: eval-engineering
    locator: The evals that repay the afternoon | Faithfulness, tool-parameter accuracy, and response quality are a working default for any tool-using agent. | 1
    repair_from: The evals that repay the afternoon | Faithfulness, tool-parameter accuracy, and response quality are a working default for any tool-using agent. | 1
    category: heading_not_a_claim
    disposition: fix
    note: |
      The heading promises a claim about which evaluations repay the time, but the section primarily catalogs default dimensions, dataset types, suite size, and starter failures. Its promise does not match the section's argument.
    suggestion: Rename the heading to state the section's claim about a compact, high-yield starter suite.
  scores:
    order: 4
    coherence: 4
    opening: 5
    ending: 4
  notes: |
    The piece moves from a travel-agent failure to routing, tooling, test construction, merge gates, and a closing suite prescription. The main sequence holds, but repeated treatment of the same failure, abandonment of the running example, and one non-claim heading require changes.
craft:
  result: changes_required
  findings:
  - severity: major
    article: eval-engineering
    locator: '- | A better model would not have caught this. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Three consecutive sentences in the paragraph use the same "A [noun] [verb]" shape:
      "A better model would not have caught this," "A thermometer tells you the room is cold,"
      and "A thermostat turns the heat on." The pattern becomes audible before the analogy
      finishes. Vary or cut one of these openings.
    suggestion: |
      Combine the thermometer and thermostat comparison into one sentence or recast one
      sentence around the missing layer rather than another "A [noun]" subject.
  - severity: major
    article: eval-engineering
    locator: Install the examiner around the case | The repositories have different jobs. | 1
    category: no_voice
    disposition: fix
    note: |
      The voice disappears in the paragraph beginning "The repositories have different jobs."
      The commands and product-by-product descriptions read like a changelog with no reader
      in the room, replacing the piece's earlier concrete, observant voice with a catalog.
    suggestion: |
      Reframe the tools through the reader's decision—what each one lets a team do and when—
      before presenting the commands.
  - severity: minor
    article: eval-engineering
    locator: Let safe work merge itself | The constraint is the product. | 1
    category: dead_words
    disposition: fix
    note: |
      "The constraint is the product" is a balanced, portentous clause that sounds like a
      prefabricated insight rather than a sentence explaining the specific lesson of the
      preceding example.
    suggestion: |
      State which constraint—specification, guardrails, or evaluation target—makes the
      autonomous loop safe.
  - severity: minor
    article: eval-engineering
    locator: Let safe work merge itself | Everything else does. | 1
    category: dead_words
    disposition: fix
    note: |
      "Everything else does" is a portentous short sentence whose referent is vague; it
      gestures at scale without naming what changes.
    suggestion: |
      Name the concrete consequence for the team or workflow instead of ending with the
      elliptical contrast.
  - severity: minor
    article: eval-engineering
    locator: 'The evals that repay the afternoon | The dataset type matters: `final_response` measures the answer alone, `single_step` one decision, `trajectory` the whole path, and RAG retrieval quality. | 1'
    category: jargon
    disposition: fix
    note: |
      "RAG" is unexplained subfield jargon, and its compressed placement beside the dataset
      types makes the sentence harder for an engineer outside this area to parse.
    suggestion: |
      Expand RAG on first use as retrieval-augmented generation and state what its eval
      measures.
  - severity: minor
    article: eval-engineering
    locator: The evals that repay the afternoon | Install one skill, pull 25 traces, and build one eval today. | 1
    category: passive
    disposition: fix
    note: |
      The closing call to action uses an ownerless imperative: no actor is named, so the
      instruction floats above the reader and the team that would carry it out.
    suggestion: |
      Name the actor and context, such as "Your team can install one skill, pull 25 traces,
      and build one eval today."
  scores:
    voice: 3
    sentence_variety: 3
    economy: 3
  notes: |
    I heard a vivid, concrete voice in the opening and core argument, then a catalog-like
    register in the tooling section and several slogan-shaped sentences that blur otherwise
    useful specificity.
