worth:
  result: approved
  findings: []
  omissions:
  - fact: The claim that identical rented models widened the gap between teams rather than between models
    reader_loses: The opening economic and organizational stakes behind eval engineering.
    verdict: defensible
  - fact: The source's explicit framing of the missing layer as the cheapest line in the stack and the only one encoding a company's own definition of correct
    reader_loses: Why evaluation is strategically distinct from buying a better model.
    verdict: defensible
  - fact: The source's report that one company changed only its evals across successive agent versions and saw every score dimension move, concluding evals should have existed at month one rather than month nine
    reader_loses: A concrete longitudinal demonstration that evals themselves improve a product.
    verdict: defensible
  - fact: 'Arize AX''s benchmark result: 74.4% recall and 91.0% precision'
    reader_loses: The full comparison and the precision/recall tradeoff in the blind test.
    verdict: defensible
  - fact: 'The names and dates of the four vendors that shipped their expertise as skills: LangChain, Galileo, AWS, and Arize'
    reader_loses: Evidence for the claim that the evaluation category was unbundling into the terminal.
    verdict: defensible
  - fact: The source's warning that most users install langchain-skills first and then wonder where the production material comes from
    reader_loses: A practical distinction between the repository that builds evals and the one that supplies traces.
    verdict: defensible
  - fact: The source's attribution of the six routing rules to a 21-year-old founder in Tokyo whose post received two likes
    reader_loses: The provenance and illustrative oddity of the operating principle.
    verdict: defensible
  - fact: 'The explicit five-step loop wording: mine traces, identify a failure, build an eval, improve the agent, and repeat'
    reader_loses: A compact mnemonic for the incident-to-test workflow.
    verdict: defensible
  - fact: The instruction that each trace write-up should record what the user asked and what the agent actually did, what worked and did not, attribution, and the capability to preserve or improve
    reader_loses: The exact four-field template for turning observations into eval candidates.
    verdict: defensible
  - fact: The example quotation from an operator who merged around 1,500 pull requests in 90 days without inspecting code
    reader_loses: A vivid account of how constraint-based trust feels in practice.
    verdict: defensible
  - fact: The source's statement that three of the four merge signals are history or deterministic checks and exactly one touches the model
    reader_loses: Why the proposed confidence score is less model-dependent than it may appear.
    verdict: defensible
  - fact: 'The source''s final three-line discipline: measure the path, make verdicts change the next edge, and turn every failure into a permanent test'
    reader_loses: A concise closing formulation of the article's operating principles.
    verdict: defensible
  retentions:
  - passage: Everyone is renting the same brain now.
    costs: Opening framing that establishes the model-versus-harness thesis; it earns its space.
    verdict: earns_place
  - passage: A thermometer tells you the room is cold.
    costs: The central metaphor makes the distinction between measurement and control immediately legible.
    verdict: earns_place
  - passage: The useful order is simple. Loops came first, then graphs, then evals.
    costs: A compact organizing claim that gives the synthesis a clearer progression than the source's transitions.
    verdict: earns_place
  - passage: Optimize against a judge long enough and the agent learns to look right rather than be right.
    costs: A memorable caveat explaining why rubric and judge hygiene matter.
    verdict: earns_place
  - passage: The constraint is the product.
    costs: A short thesis that connects confidence gating, guardrails, and autonomous merging.
    verdict: earns_place
  - passage: The model bill does not move. Everything else does.
    costs: Rhetorical close to the rollout section; the surrounding operational guidance already carries the argument.
    verdict: cut
  - passage: What survives model replacement is the examiner
    costs: Restates the rental/examiner thesis from the opening and earlier sections, but also provides a useful conclusion.
    verdict: earns_place
  - passage: Install one skill, pull 25 traces, and build one eval today.
    costs: A concrete call to action that turns the synthesis into an immediately usable next step.
    verdict: earns_place
  notes: |
    This piece gives a reader the source's actionable eval-engineering workflow—routing verdicts into execution, installing the tooling, mining 25 traces, building hidden-rubric tests, and gating merges—without requiring the full source's promotional context and benchmark miscellany. Its sections broadly follow the source, but the synthesis adds a clear thermostat metaphor, a tighter progression from measurement to autonomous merging, and concrete operational commands.
evidence:
  result: changes_required
  findings:
  - severity: major
    article: eval-engineering
    locator: — | A better model would not have caught this. | 1
    repair_from: — | A better model would not have caught this. | 1
    category: unreached_conclusion
    disposition: fix
    note: |
      The source reports that successive agent versions changed no model, prompts, or human nudges, yet scores improved across every dimension, and concludes that evals should have been installed on day one rather than month nine. The manuscript omits that source conclusion.
  scores:
