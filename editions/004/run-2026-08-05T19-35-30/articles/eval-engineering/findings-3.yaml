shape:
  result: changes_required
  findings:
  - severity: major
    article: eval-engineering
    locator: Install the examiner around the case | A new platform is optional. | 1
    repair_from: Make the score change the run | Optimize against a judge long enough and the agent learns to look right rather than be right. | 1
    category: missing_transition
    disposition: fix
    note: |
      The piece moves from judge design and evaluator gaming directly into a catalogue of platforms and installation commands. The reader is not told why tooling follows, or how these tools operationalize the examiner just defined.
    suggestion: Add a bridge explaining that, once the judge and routing rules are specified, the next decision is how to install that examiner against real production cases.
  - severity: major
    article: eval-engineering
    locator: The evals that repay the afternoon | Install one skill, pull 25 traces, and build one eval today. | 1
    repair_from: 'Turn failures into permanent tests | A useful first set contains 25 complete traces with good and bad behavior beside each other: a normal request, a user-confirmed success, a correction or rephrasing, a failed or repeated tool call, and an external failure such as a timeout or rate limit. | 1'
    category: duplication
    disposition: fix
    note: |
      The prescribed number of traces appears in the testing section and again in the closing call to action. The second occurrence repeats an earlier concrete instruction without adding structure.
    suggestion: Keep the detailed 25-trace prescription in the testing section and make the closing call to action refer to starting from production traces without repeating the number.
  scores:
    order: 4
    coherence: 4
    opening: 5
    ending: 5
  notes: |
    I verified the article's argument order, opening, transitions, repetition, referents, running example, headings, furniture, and ending; the main repairs are the tooling transition and repeated trace count.
craft:
  result: changes_required
  findings:
  - severity: minor
    article: eval-engineering
    locator: The useful order is simple. Loops came first, then graphs, then evals. | The useful order is simple. | 1
    category: weak_opening_sentence
    disposition: fix
    note: |
      "The useful order is simple" is throat-clearing before the actual sequence. Start with "Loops came first, then graphs, then evals" so the paragraph begins with its claim.
    suggestion: Cut the opener and begin with the sequence.
  - severity: minor
    article: eval-engineering
    locator: 'The evals that repay the afternoon | The dataset type matters: `final_response` measures the answer alone, `single_step` measures one decision, `trajectory` measures the whole path, and RAG measures retrieval quality. | 1'
    category: jargon
    disposition: fix
    note: |
      "RAG" is specialized terminology that the piece does not define, unlike the surrounding dataset types.
    suggestion: Spell out retrieval-augmented generation and explain what it measures at first use.
  - severity: minor
    article: eval-engineering
    locator: Let safe work merge itself | The constraint is the product. | 1
    category: dead_words
    disposition: fix
    note: |
      "The constraint is the product" is a portentous definite-article equation that sounds like a slogan rather than an explanation.
    suggestion: Replace it with the concrete point that the gate's constraints determine what the system can safely automate.
  - severity: minor
    article: eval-engineering
    locator: 'The evals that repay the afternoon | What survives model replacement is the examiner: the failures turned into tests, the rules that change the next edge, and the track record that lets a machine merge its own work. | 1'
    category: dead_words
    disposition: fix
    note: |
      The sentence stacks abstractions into a balanced summary, making the conclusion sound more declarative than observed.
    suggestion: Name the specific artifacts that remain useful after a model swap, then let the final instruction carry the close.
  scores:
    voice: 4
    sentence_variety: 4
    economy: 3
  notes: |
    This is a confident, technically grounded synthesis with a human voice, though a few slogan-like abstractions and one undefined acronym interrupt its otherwise concrete movement.
