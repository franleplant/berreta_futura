worth:
  result: changes_required
  findings:
  - severity: major
    article: eval-engineering
    locator: The missing wire | A better model would not have caught this. | 1
    repair_from: The missing wire | A better model would not have caught this. | 1
    category: lost_essential_fact
    disposition: fix
    note: |
      The source's blind test is absent: 100 production traces, 39 labeled failures, and the comparative results for Braintrust Loop, Codex on GPT-5.5 High, LangSmith, and Arize AX. That evidence makes the claim that a coding agent can rival dedicated evaluation platforms—and that the category is unbundling—concrete. Without it, the reader gets the method but loses the source's strongest evidence that this approach is practical now.
    suggestion: Restore a compact paragraph with the test design, the four headline scores, and the conclusion that the tooling is moving into agents people already use.
  - severity: major
    article: eval-engineering
    locator: Mine the failures you already paid for | The trace tells you what happened, not what should have happened. | 1
    repair_from: Mine the failures you already paid for | The trace tells you what happened, not what should have happened. | 1
    category: lost_operational_detail
    disposition: fix
    note: |
      The source explicitly says that anything costing money or writing to production must be simulated rather than called. The manuscript tells readers to build and run evaluations but omits this safety boundary, so a reader following it could exercise real side effects while mining or running tests.
    suggestion: Add the simulation rule alongside the instructions for building the first Harbor task and running the suite.
  - severity: major
    article: eval-engineering
    locator: The missing wire | A thermometer tells you the room is cold. A thermostat turns the heat on. | 1
    repair_from: The missing wire | The progression is simple. | 1
    category: lost_essential_fact
    disposition: fix
    note: |
      The source reports a company that changed no model, prompts, or human nudges and saw scores move across every dimension, concluding that evals belonged in the system on day one rather than month nine. That result is the clearest evidence that the proposed examiner improves a product rather than merely measuring it.
    suggestion: Carry the eval-only longitudinal result in one sentence before the thermostat metaphor.
  omissions:
  - fact: The blind test of 100 live voice-agent traces, hand-labeled into 39 failures
    reader_loses: Cannot see how the evaluation systems were compared or how representative the benchmark was.
    verdict: needed
  - fact: Braintrust Loop recovered 87.2% of human-flagged failures; Codex on GPT-5.5 High had 84.6% recall and 82.8% precision; LangSmith had 79.5%; Arize AX had 74.4% recall and 91.0% precision
    reader_loses: Loses the concrete evidence behind the claim that an already-paid coding agent can rival dedicated platforms.
    verdict: needed
  - fact: LangChain, Galileo, AWS, and Arize shipped their evaluation expertise as skills within four weeks
    reader_loses: Loses the reported evidence for the category-unbundling trend.
    verdict: defensible
  - fact: The shell commands and Claude Code plugin commands for installing the skills
    reader_loses: Nothing essential in a print piece; these are setup sequences the source can provide.
    verdict: defensible
  - fact: The distinction between langchain-skills building evals and langsmith-skills pulling production runs, plus portability under the open skills specification
    reader_loses: Loses useful ecosystem context, but not the core evaluation method.
    verdict: defensible
  - fact: evalkit's six phase commands and its report command returning prioritized code-location recommendations
    reader_loses: Cannot reproduce that exact workflow without returning to the source.
    verdict: defensible
  - fact: The anecdote about the 21-year-old Tokyo founder whose wiring post had two likes
    reader_loses: Nothing substantive; it is color around the routing rule.
    verdict: defensible
  - fact: The explicit five-step mine-traces loop and the Harbor task-folder layout
    reader_loses: Loses a compact visual of how findings become runnable tasks, but the manuscript retains the underlying process.
    verdict: defensible
  - fact: The instruction that anything costing money or writing to production must be simulated
    reader_loses: Could run evaluations with real side effects or bills, making the operational guidance unsafe.
    verdict: needed
  - fact: The claim that the eval-only company concluded evals should have been present on day one rather than month nine
    reader_loses: Loses the strongest evidence that evaluation changes system performance, not just observability.
    verdict: needed
  - fact: The anecdote of approving and merging around 1,500 pull requests in 90 days without looking at code
    reader_loses: Loses a vivid supporting example of constraint-based trust, but not the mechanism.
    verdict: defensible
  - fact: The source's exact framing that 19 of 20 autonomous pull requests merged, roughly three quarters of top-agent work had no human edit, and Guardrails rejected one in five
    reader_loses: The manuscript keeps the figures but drops the explicit attribution and comparative framing.
    verdict: defensible
  - fact: 'The source''s closing three rules: measure the path, make verdicts change the next edge, and turn every failure into a permanent test'
    reader_loses: Nothing essential; the manuscript states all three ideas throughout.
    verdict: defensible
  - fact: The X and Telegram links, timestamp, view count, and replies
    reader_loses: Nothing substantive; these are platform and promotion material.
    verdict: defensible
  retentions:
  - passage: Everyone is renting the same brain now.
    costs: A short framing passage, but it establishes the article's central contrast between interchangeable models and differentiated evaluation systems.
    verdict: earns_place
  - passage: A thermometer tells you the room is cold.
    costs: The metaphor occupies several sentences, but it makes the distinction between measurement and control immediately legible.
    verdict: earns_place
  - passage: The constraint is the product.
    costs: A repeated slogan, yet it connects the merge gate, historical record, and specification warning into one governing idea.
    verdict: earns_place
  - passage: Most people will keep scrolling outputs on Friday
    costs: A closing contrast that restates the opening and uses a few lines of space.
    verdict: earns_place
  notes: 'Changes required because the synthesis preserves the core method but drops the source''s strongest benchmark evidence and the safety rule to simulate side-effecting evaluations. The manuscript has a clear position: the durable product is the examiner and its feedback loop, not the rented model. Its sections reorder and rename the source''s material rather than reproducing the source''s exact sequence. The retained passages all support that position, so none is recommended for cutting first.'
