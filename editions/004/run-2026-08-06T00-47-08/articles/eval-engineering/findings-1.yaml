mechanics:
  result: changes_required
  findings:
  - severity: major
    article: eval-engineering
    locator: '- | Specific, clean, useful-sounding. | 1'
    category: grammar
    disposition: fix
    note: |
      This standalone sentence has no verb. Although the clipped phrasing is rhetorically deliberate, the surrounding prose does not establish sentence fragments as a grammatical convention.
    suggestion: The answer was specific, clean, and useful-sounding.
  - severity: major
    article: eval-engineering
    locator: '- | All of it invented. | 1'
    category: grammar
    disposition: fix
    note: |
      This standalone sentence is a verbless fragment. The intended meaning requires an explicit verb.
    suggestion: All of it was invented.
  - severity: major
    article: eval-engineering
    locator: The missing wire | Loops, then graphs, then evals. | 1
    category: grammar
    disposition: fix
    note: |
      This standalone sentence has no verb. The sequence can remain concise while being made grammatical.
    suggestion: The progression was loops, then graphs, then evals.
  scores:
    grammar: 2
    typography: 5
    consistency: 5
  notes: |
    Changes required because three standalone verbless fragments occur in otherwise standard grammatical prose; typography, heading form, and internal consistency are clean.
shape:
  result: changes_required
  findings:
  - severity: major
    article: eval-engineering
    locator: The first suite | The travel agent's 32.3% faithfulness score is why the first measure matters. | 1
    repair_from: '- | The team measured 100 real sessions and found two numbers that should never sit that far apart: response quality was 83.9%, while faithfulness to what the tools actually returned was 32.3%. | 1'
    category: duplication
    disposition: editor_decision
    note: |
      The travel-agent faithfulness result is stated in the opening and repeated in
      the final suite section, making the same example and number do the same work twice.
    suggestion: Remove the repeated 32.3% callback from the first-suite section.
  - severity: major
    article: eval-engineering
    locator: Let the record decide who merges | Every pull request an agent opens can land in the same human queue. | 1
    repair_from: Mine the failures you already paid for | Run this loop repeatedly and each failure stops being an incident and becomes a permanent test. | 1
    category: missing_transition
    disposition: fix
    note: |
      The piece jumps from mining failures and turning them into tests to autonomous
      pull-request merging without explaining how the resulting evaluation record
      becomes a merge gate.
    suggestion: Add a bridge explaining that the mined tests and verdict history now govern merge decisions.
  scores:
    order: 4
    coherence: 4
    opening: 5
    ending: 5
  notes: |
    The piece verifies a clear progression from shared model capability to evaluation
    wiring, failure mining, merge gates, and a starter suite, but it repeats the
    travel-agent score and needs a bridge into the merge-automation section.
craft:
  result: changes_required
  findings:
  - severity: blocking
    article: eval-engineering
    locator: The judge needs rules of its own | Use a model from another family when possible, because a model recognizes its own writing and grades it more kindly. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Eighteen ownerless imperative sentences make the piece sound procedural rather than written: "Use a model from another family when possible"; "Write one observable success condition for each primary verdict"; "Let the judge handle semantic calls"; "Do not reward response length"; "Pin the judge and log its version"; "Start with 25 complete traces"; "Write each finding in four lines"; "Take the answer key from tests, source records, policy, known state, or a person"; "Test the verifier with one clearly correct result and one plausible but wrong result"; "Keep the expected outcome and judge credentials hidden from the agent being tested"; "Run this loop repeatedly"; "Run the gate in shadow first"; "Keep it closed when automated and human verdicts differ by more than 2%"; "Sample only 1% to 5% of traces"; "Start with three measurements for any agent that calls tools"; "Choose the dataset type on purpose"; "Keep the suite alive"; "Then build five tests first." The reader hears the checklist pattern before the argument.
    suggestion: Cut or recast several imperatives so the instructions arrive through varied sentence shapes and named actors.
  - severity: major
    article: eval-engineering
    locator: The judge needs rules of its own | Use a model from another family when possible, because a model recognizes its own writing and grades it more kindly. | 1
    category: passive
    disposition: fix
    note: |
      The paragraph gives five consecutive instructions to an unnamed "you"; the ownerless imperative hides who is responsible for choosing, writing, checking, and pinning the evaluation rules.
    suggestion: Name the responsible team or system in at least some of these instructions.
  - severity: major
    article: eval-engineering
    locator: Let the record decide who merges | Trust in an agent is an actuarial calculation. | 1
    category: dead_words
    disposition: editor_decision
    note: |
      Three compact "X is Y" equations—"Trust in an agent is an actuarial calculation," "The constraint is the product," and "The model is a rental"—stack aphoristic certainty without adding mechanism; the last also echoes the opening metaphor.
    suggestion: Keep the one aphorism that earns its claim and cut or recast the other two.
  - severity: minor
    article: eval-engineering
    locator: The first suite | A retrieval set grades RAG quality. | 1
    category: jargon
    disposition: fix
    note: |
      "RAG" is not defined, so a competent engineer outside retrieval work has to infer the acronym.
    suggestion: Spell out retrieval-augmented generation on first use.
  - severity: minor
    article: eval-engineering
    locator: The first suite | Low context recall can reject a handoff. | 1
    category: jargon
    disposition: fix
    note: |
      "Context recall" is presented as an established metric without explaining what it measures.
    suggestion: Add a short plain-language gloss for context recall.
  - severity: minor
    article: eval-engineering
    locator: Let the record decide who merges | A 429 is somebody else’s limit unless your agent was supposed to recover from it. | 1
    category: jargon
    disposition: fix
    note: |
      The HTTP status code "429" is unexplained and interrupts the otherwise plain account of external failures.
    suggestion: Write 'rate-limit error (HTTP 429)' on first mention.
  scores:
    voice: 4
    sentence_variety: 2
    economy: 4
  notes: |
    I heard a vivid, confident piece whose concrete examples carry real authority, but the long runs of checklist imperatives and a few aphoristic equations make the middle sound like an operating manual.
