mechanics:
  result: changes_required
  findings:
  - severity: major
    article: eval-engineering
    locator: Let the record set the gate | Across top agents, about three quarters of merged work goes in without a human edit, reverts remain in the low single digits, and Guardrails alone rejects one pull request in five before review. | 1
    category: punctuation
    disposition: fix
    note: |
      The sentence joins independent clauses with a comma after "human edit",
      creating a comma splice. The prose is editorial in faithful_synthesis, so
      the editors must repair it.
    suggestion: Use a semicolon after 'edit' or add a conjunction before 'reverts'.
  scores:
    grammar: 4
    typography: 5
    consistency: 5
  notes: |
    One comma splice requires correction; sentence openings, headings, typography,
    and number styles are otherwise consistent.
