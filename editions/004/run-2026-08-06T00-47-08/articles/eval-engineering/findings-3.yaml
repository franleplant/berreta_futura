craft:
  result: changes_required
  findings:
  - severity: minor
    article: eval-engineering
    locator: The examiner closes the loop | The evidence that this is practical is already here. | 1
    category: weak_opening_sentence
    disposition: fix
    note: |
      This sentence clears its throat before presenting the evidence; the paragraph would enter more directly through the production-trace study that follows.
    suggestion: |
      Cut the sentence and begin with the researchers' 100 production traces.
  - severity: major
    article: eval-engineering
    locator: The examiner closes the loop | The category is unbundling into the terminal already open. | 1
    category: dead_words
    disposition: fix
    note: |
      "Unbundling" is corporate abstraction, and the terminal metaphor adds decoration without making the mechanism clearer.
    suggestion: |
      State plainly that vendors are packaging their evaluation expertise as skills for agents developers already use.
  - severity: minor
    article: eval-engineering
    locator: Keep the suite alive | A retrieval set grades RAG quality. | 1
    category: jargon
    disposition: fix
    note: |
      "RAG" is unexplained subfield jargon for readers who may understand evaluation engineering without knowing the acronym.
    suggestion: |
      Expand the acronym on first use or describe retrieval-augmented generation in ordinary language.
  - severity: minor
    article: eval-engineering
    locator: Let the record set the gate | The constraint is the product. | 1
    category: dead_words
    disposition: fix
    note: |
      This portentous short sentence presents a slogan rather than advancing the argument; the surrounding paragraphs already explain the constraint.
    suggestion: |
      Replace the slogan with the specific consequence of making the gate part of the product.
  scores:
    voice: 4
    sentence_variety: 4
    economy: 4
  notes: |
    I heard a confident, concrete writer throughout, with a few slogan-like abstractions and one unexplained acronym interrupting an otherwise human voice.
