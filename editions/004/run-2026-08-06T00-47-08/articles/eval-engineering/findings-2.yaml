shape:
  result: changes_required
  findings:
  - severity: major
    article: eval-engineering
    locator: The missing wire | The practical case is already visible. | 1
    repair_from: '- | A travel agent answered a question about an exchange rate, the week''s temperature, and a museum''s opening hours. | 1'
    category: running_example
    disposition: fix
    note: |
      The piece opens with a travel-agent failure, then shifts to a voice-agent benchmark, autonomous pull requests, and a self-improving codebase. These examples do not accumulate into one carrying case, so the argument's concrete thread keeps restarting.
    suggestion: Use the travel-agent trace as the spine and recast the later voice-agent, pull-request, and codebase cases as brief contrasts.
  - severity: minor
    article: eval-engineering
    locator: The first suite | The first suite | 1
    repair_from: The first suite | The first suite | 1
    category: heading_not_a_claim
    disposition: fix
    note: |
      "The first suite" names the section's topic but not what it argues: that a small, durable suite should test the agent's full path and survive model replacement.
    suggestion: Rename the heading to state the claim, such as 'Start with a suite that can see the whole run.'
  scores:
    order: 4
    coherence: 4
    opening: 5
    ending: 5
  notes: |
    This piece moves from commoditized models and hallucination risk through eval feedback, failure mining, merge gates, and a starter suite, ending with a clear payoff; its main structural weakness is the succession of unrelated examples.
craft:
  result: changes_required
  findings:
  - severity: blocking
    article: eval-engineering
    locator: Make the score act | Low context recall can reject a handoff. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Six consecutive "[condition] can [verb]" constructions make the paragraph
      sound generated: "Low context recall can reject a handoff", "Bad tool use
      can retry or swap a node", "A hallucination can quarantine a branch", "A
      schema failure can block an edge", "A compliance risk can route to human
      review", and "Verified completion can terminate the run." Cut or recast
      several of them.
  - severity: minor
    article: eval-engineering
    locator: The first suite | A retrieval set grades RAG quality. | 1
    category: jargon
    disposition: fix
    note: |
      "RAG" is not expanded for an engineer outside this subfield.
    suggestion: |
      Write "retrieval-augmented generation (RAG)" on first use.
  - severity: minor
    article: eval-engineering
    locator: Let the record decide who merges | The constraint is the product. | 1
    category: dead_words
    disposition: fix
    note: |
      This is a portentous short sentence that announces an insight without
      naming the concrete constraint or product.
    suggestion: |
      Replace it with the specific constraint and product consequence being
      asserted.
  scores:
    voice: 4
    sentence_variety: 2
    economy: 4
  notes: |
    I heard a vivid, technically grounded voice until the routing list settled
    into a repeated modal pattern that makes the prose sound mechanically
    enumerated.
