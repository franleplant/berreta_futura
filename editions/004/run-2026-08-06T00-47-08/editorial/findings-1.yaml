craft:
  result: changes_required
  findings:
  - severity: blocking
    article: '-'
    locator: '- | A codebase can pass 38 green tests and still be completely broken. | 1'
    category: repeated_shape
    disposition: fix
    note: |
      Six sentences use the same modal-claim shape: "A codebase can pass 38 green tests and still be completely broken", "Teams can rent nearly the same brain", "A dashboard could display that gap forever", "An eval can send the run down another edge", "A loop that learns to raise its score can still miss the specification", and "Your agent's first durable feature may be the failure it is no longer allowed to forget." The repetition makes the prose feel mechanically cautious.
    suggestion: Recast at least two of these sentences without a modal auxiliary.
  - severity: major
    article: '-'
    locator: '- | Mine real traces, define correctness outside the model, and turn each failure into a test. | 1'
    category: repeated_shape
    disposition: fix
    note: |
      Three consecutive sentences use imperative constructions: "Mine real traces, define correctness outside the model, and turn each failure into a test", "Then let the verdict retry a tool call, reject a handoff, quarantine an answer, or ask a person to review it", and "So begin with the broken cases, keep the answer key hidden, simulate side effects, and compare automated judgments with human ones before opening the gate." The sequence turns advice into a repeated command pattern.
    suggestion: Recast the middle imperative as a declarative sentence describing what the verdict does.
  - severity: minor
    article: '-'
    locator: '- | There is a trap. | 1'
    category: dead_words
    disposition: fix
    note: |
      "There is a trap" is a portentous announcement that delays the concrete point and sounds like a stock transition.
    suggestion: Name the specific failure directly in this sentence.
  - severity: minor
    article: '-'
    locator: '- | An eval can send the run down another edge. | 1'
    category: jargon
    disposition: fix
    note: |
      "Eval" is unexplained subfield shorthand for an evaluation and may interrupt readers outside this specialty.
    suggestion: Replace "eval" with "evaluation" on first use.
  scores:
    voice: 4
    sentence_variety: 2
    economy: 4
  notes: |
    The piece sounds like a sharp editor explaining a practical lesson, but its repeated modal claims and commands make the cadence feel more system-built than written.
