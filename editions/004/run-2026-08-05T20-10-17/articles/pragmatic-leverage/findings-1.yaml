worth:
  result: approved
  findings: []
  omissions:
  - fact: The source's @dexhorthy X handle
    reader_loses: A direct identifier for locating or following the original author, though the Dex Horthy byline remains.
    verdict: defensible
  retentions:
  - passage: This one is a bit of an addendum / side-quest
    costs: One short framing paragraph, which preserves the source's standalone context and connection to the series.
    verdict: earns_place
  - passage: Even before AI, only 25-50% of the time
    costs: One paragraph, but it establishes the work breakdown that makes the leverage argument intelligible.
    verdict: earns_place
  - passage: If you're only using AI to write the code
    costs: One paragraph, but its 2-4-hour to 10-20-minute comparison distinguishes coding speed from delivery speed.
    verdict: earns_place
  - passage: But if you use AI to help you plan and align
    costs: One sentence, but it states the central 2-3x leverage claim.
    verdict: earns_place
  - passage: Lets assume if you yolo a two-sentence prompt
    costs: One paragraph, but it supplies the baseline 50% mergeability and rework probabilities.
    verdict: earns_place
  - passage: Now lets say you are a principal engineer
    costs: One paragraph, but the 10-year, 100-repo, afternoon-spec example shows that detailed planning reduces rather than eliminates rework.
    verdict: earns_place
  - passage: 'And at the far end: write every line yourself'
    costs: One sentence, but it completes the effort-versus-rework range with the zero-rework boundary.
    verdict: earns_place
  - passage: '**note** For this example I''m gonna blur'
    costs: The note and its qualification prevent the percentages from being mistaken for a single literal probability.
    verdict: earns_place
  - passage: If the model is 50% likely to get a button style wrong
    costs: One concrete example, but it makes the distinction between likelihood and repair cost usable.
    verdict: earns_place
  - passage: expected pain = P(you'll have to change it)
    costs: One displayed formula, but it gives the reader the article's reusable model.
    verdict: earns_place
  - passage: If you draw this out, there's an inverse relationship
    costs: One sentence, but it states the governing relationship between up-front effort and expected pain.
    verdict: earns_place
  - passage: What you don't want to do is spend 6 hours
    costs: One paragraph, but the 6-hour versus first-10-minutes example supplies the practical anti-overplanning rule.
    verdict: earns_place
  - passage: You need to do this without overindexing
    costs: One paragraph, but it explains when to zoom from product questions into technical feasibility.
    verdict: earns_place
  - passage: This is what we mean by leverage
    costs: The closing paragraph, but it turns the model into the actionable 50kft-to-10kft steering advice.
    verdict: earns_place
  notes: |
    This faithful edit gives readers a durable, legible standalone version of an ephemeral X article while preserving its 25-50% work split, expected-pain equation, and 50kft-to-10kft steering advice.
    The source-length treatment is justified by access and legibility. The only omission is the original author handle, which does not impair understanding or action; no needed omission makes the piece over-compressed, and every substantive passage earns its place.
