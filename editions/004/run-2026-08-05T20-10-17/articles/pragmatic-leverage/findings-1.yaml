craft:
  result: changes_required
  findings:
  - severity: blocking
    article: pragmatic-leverage
    locator: Seeking Leverage | If you're only using AI to write the code, then you're taking the 2–4 hours of coding time down to 10–20 minutes, but you haven't accelerated anything else here. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Six full conditional scaffolds recur: "If you're only using AI to write the code, then you're taking the 2–4 hours of coding time down to 10–20 minutes, but you haven't accelerated anything else here."; "But if you use AI to help you plan and align, then you actually get closer to 2–3x faster."; "If the model is 50% likely to get a button style wrong, but the fix is one cheap prompt, then our combined 'expected pain' is low."; "If you draw this out, there's an inverse relationship between effort invested up front and expected pain."; "if you've done some work at the 'Product' level and have not answered all the open questions yet, its possible you may need to end it where you are and zoom down a level to the technical details to understand what's feasible."; and "If you're doing multiple phases of planning, zooming in from 50kft view all the way to the 10kft view, you want to do a little bit of steering at each phase to ensure you are eliminating as much expected pain as possible." The "Lets assume if you yolo a two-sentence prompt into your factory" sentence adds a seventh embedded variant. The shape is the author's rhythm, so the remedy is an editor's: cut or consolidate the repeated setups.
  - severity: major
    article: pragmatic-leverage
    locator: '- | This one is a bit of an addendum / side-quest to the recent series. | 1'
    category: weak_opening_sentence
    disposition: author_decision
    note: |
      The first three sentences are publication logistics—an addendum, a note about fit, and a cross-reference—before the useful 25–50% shipping-time split. The opening announces a post instead of giving the reader the argument.
    suggestion: Open with the 25–50% shipping-time split.
  - severity: minor
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | If you draw this out, there's an inverse relationship between effort invested up front and expected pain. | 1
    category: dead_words
    disposition: author_decision
    note: |
      "draw this out" plus "inverse relationship" is a balanced abstraction that labels the tradeoff after the examples have already shown it; the sentence adds little reader-facing guidance.
    suggestion: Use the concrete 6-hour/10-minute comparison to state the tradeoff directly.
  - severity: minor
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | This is what we mean by leverage - and it requires being pragmatic. | 1
    category: dead_words
    disposition: author_decision
    note: |
      "This is what we mean by leverage" is a definite-article, balanced-clause summary that repeats the section's premise, while "requires being pragmatic" adds no mechanism.
    suggestion: Cut the summary sentence and let the concrete planning guidance carry the transition.
  - severity: minor
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | You need to do this without overindexing on questions you won't be able to answer without going down a level. | 1
    category: dead_words
    disposition: author_decision
    note: |
      "Overindexing" is corporate planning shorthand, and the sentence never states plainly what to do with the unanswered questions.
    suggestion: Name the questions to defer instead of using "overindexing."
  - severity: minor
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | If you're doing multiple phases of planning, zooming in from 50kft view all the way to the 10kft view, you want to do a little bit of steering at each phase to ensure you are eliminating as much expected pain as possible. | 1
    category: jargon
    disposition: author_decision
    note: |
      "50kft view" and "10kft view" are unexplained altitude shorthand; a competent engineer outside product-planning culture may not know which decisions each level denotes.
    suggestion: Spell out the product and technical levels.
  - severity: minor
    article: pragmatic-leverage
    locator: '- | It is referenced briefly in Why Software Factories Fail part 2: Turning the lights back on. | 1'
    category: passive
    disposition: author_decision
    note: |
      "It is referenced briefly" hides the actor in a sentence that contributes only publication metadata; the passive has no reader-facing reason.
    suggestion: Cut this cross-reference from the opening.
  scores:
    voice: 3
    sentence_variety: 1
    economy: 3
  notes: |
    I hear a candid engineer explaining a real delivery tradeoff; the voice is strongest in the concrete examples and thins into formula when the planning advice turns abstract. Changes are required because the conditional scaffold is blocking and the opening, summary language, jargon, and passive metadata all make the reader work harder than the mechanism warrants.
