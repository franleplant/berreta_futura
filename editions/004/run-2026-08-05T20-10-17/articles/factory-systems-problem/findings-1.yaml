worth:
  result: approved
  findings: []
  omissions:
  - fact: 'The seven inline numeric extraction markers: [3] before ''innovators''; [2] before ''non-agent topics''; [1] before ''almost lights out''; [2] before ''sandboxing''; [3] before ''at home, in your homelab''; [1] before ''wcf''; and [1] before ''lots of bad memories here''.'
    reader_loses: Nothing substantive; these are extraction annotations, not facts, instructions, or explained links.
    verdict: defensible
  retentions:
  - passage: software factories are super real but we need to be realistic.
    costs: The maturity warning and anti-hype frame; without it, the later systems prescription loses its scope.
    verdict: earns_place
  - passage: the best practices right now are to build abstractions/pieces needed
    costs: The concrete sandboxing, monorepo, reproducible-build, CI/CD, identity, and secret-management checklist; cutting it would strip utility.
    verdict: earns_place
  - passage: at home, in your homelab, you should be cracking on this problem space
    costs: Specific next actions and the promotion/interview consequence; it turns the diagnosis into advice.
    verdict: earns_place
  - passage: i must stress that factories is not a token or llm problem.
    costs: The governing systems-engineering and corporate-culture thesis, including the qualification that token use is still one piece.
    verdict: earns_place
  - passage: second hot take, as it seems the first hot take landed.
    costs: A short transition identifying the service-bus paragraph as a follow-on post; it helps orient this collected-post sequence.
    verdict: earns_place
  - passage: look up anything in the @dotnet space such as mass transit, nservicebus, wcf
    costs: Actionable prior-art names plus the Temporal recommendation; removing them would make the architecture warning non-operational.
    verdict: earns_place
  - passage: which i've always suspected was developed by young folks in silicon valley
    costs: Speculation about the creators rather than the service-bus design; the argument survives without it.
    verdict: cut
  - passage: ugh. blog post time.
    costs: A four-word meta aside with no information.
    verdict: cut
  notes: |
    By collecting three otherwise separate posts into one legible sequence, this piece gives the reader a single systems-and-corporate-culture diagnosis with the concrete stack and deterministic-service-bus/Temporal prescription attached. It is a faithful_edit at source length, justified by scattered-post collection. The manuscript and sources run in the same order: factory maturity and stack, systems/culture thesis, then n8n/service-bus advice. The title supplies a clear synthesizing position, and no section-level weight problem or substantive omission remains.
