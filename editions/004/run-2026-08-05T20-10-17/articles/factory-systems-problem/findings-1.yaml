    voice: 4
    sentence_variety: 2
    economy: 2
  notes: |
    I hear a sharp, unmistakably human systems rant—lowercase, slang, and dry asides intact—but the thesis keeps arriving as repeated contrasts and abstract inventories. Changes are required for the editorial title, the abstraction-heavy middle, and the final paragraph's undefined references and commands.
