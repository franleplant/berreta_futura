    category: weak_opening_sentence
    disposition: fix
    note: |
      The first sentence announces a posture and repeats "real" and "realistic" instead of putting the unresolved factory failure on the page.
    suggestion: |
      Open with the unsolved factory practice, then let the realism qualification follow.
  - severity: major
    article: factory-systems-problem
    locator: '- | software factories are super real but we need to be realistic. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Five balanced contrast turns repeat: "software factories are super real but we need to be realistic."; "it isn't cracked but it's a puzzle that's being solved daily."; "i must stress that factories is not a token or llm problem. it's a systems engineering and corporate culture problem."; "it won't be solved through tokens or how you apply the tokens (but it is a piece of the puzzle) ugh."; and "lots of bad memories here, not great tech impl but the theory / education is generally on point." The construction is the author's rhythm, but five turns make the pattern audible; an editor should cut or structurally vary the passage.
  - severity: major
    article: factory-systems-problem
    locator: '- | the best practices right now are to build abstractions/pieces needed which entails solving non-agent topics. | 1'
    category: dead_words
    disposition: fix
    note: |
      "the best practices", "abstractions/pieces", and "non-agent topics" stack abstractions, then the next sentence supplies a changelog: "sandboxing, monorepo, reproducible builds, ci/cd, identity/secret management, smashing corporate friction in the realm of devex for agents." The nouns are not tied to a failure or mechanism.
    suggestion: |
      Replace the inventory with one concrete failure-and-fix example, then name the abstraction it exemplifies.
  - severity: minor
    article: factory-systems-problem
    locator: '- | almost lights out. | 1'
    category: dead_words
    disposition: fix
    note: |
      The isolated, portentous fragment "almost lights out" announces a threshold without saying what is nearly finished, so it reads as a decorative beat.
    suggestion: |
      Delete the fragment or attach the claim to the concrete systems list.
  - severity: minor
    article: factory-systems-problem
    locator: '- | at home, in your homelab, you should be cracking on this problem space in your free time if you want a super fast promotion and red carpet service at your next interview. | 1'
    category: dead_words
    disposition: fix
    note: |
      "problem space", "super fast promotion", and "red carpet service" turn a concrete homelab invitation into corporate and motivational filler; the following "highest roi you can have right now is learning the entire damn stack, automating it and showing it at your next interview/doing a recorded talk at a meetup." repeats the promise.
    suggestion: |
      Keep the concrete invitation to build and demonstrate the stack, and remove the career-payoff language.
  - severity: minor
    article: factory-systems-problem
    locator: '- | it won''t be solved through tokens or how you apply the tokens (but it is a piece of the puzzle) ugh. | 1'
    category: cliche
    disposition: fix
    note: |
      "piece of the puzzle" is a stock figure that does not map the mechanism; the parenthetical softens the sharper systems claim while "ugh" already supplies the aside.
    suggestion: |
      Cut the parenthetical and state the qualification in concrete systems terms.
  - severity: major
    article: factory-systems-problem
    locator: '- | look up anything in the @dotnet space such as mass transit, nservicebus, wcf if you wanna steal ideas for prompting. | 1'
    category: jargon
    disposition: fix
    note: |
      The recommendation names @dotnet, MassTransit, NServiceBus, WCF, and later @temporalio without explaining what kind of systems they are or what design to borrow. A competent engineer outside this niche has to leave the article to parse the argument.
    suggestion: |
      Give each named system a short functional gloss tied to the deterministic service-bus boundary.
  - severity: minor
    article: factory-systems-problem
    locator: '- | look up anything in the @dotnet space such as mass transit, nservicebus, wcf if you wanna steal ideas for prompting. | 1'
    category: passive
    disposition: fix
    note: |
      The final paragraph stacks three ownerless imperatives: "look up anything in the @dotnet space such as mass transit, nservicebus, wcf if you wanna steal ideas for prompting.", "use it and have a job invoke an agent as a process.", and "don't make the entire service bus non-deterministic." No service owner, job, or team is named, so the prose sounds like an instruction stream rather than an accountable recommendation.
    suggestion: |
      Name the actor responsible for each action before issuing the command.
