worth:
  result: changes_required
  findings:
  - severity: major
    article: mcp-protocol-update
    locator: '- | In `2026-07-28`, the same `tools/call` is self-contained. | 1'
    repair_from: '- | Until 2025-11-25, Streamable HTTP began with an `initialize`/`initialized` handshake. | 1'
    category: stripped_utility
    disposition: fix
    note: |
      The source gives concrete before-and-after wire exchanges: POST /mcp, Content-Type, JSON-RPC bodies, and the _meta clientInfo shape. The manuscript names the methods and headers but omits the endpoint, body layout, and one runnable current call, so an implementer must return to the source or specification to know what to send.
    suggestion: Carry one compact before-and-after exchange, including POST /mcp, JSON params, and _meta; omit only illustrative values if space is tight.
  - severity: major
    article: mcp-protocol-update
    locator: '- | Multi-round-trip work returns an `InputRequiredResult` with input requests and an opaque `requestState`. | 1'
    repair_from: '- | Multi-round-trip work returns an `InputRequiredResult` with input requests and an opaque `requestState`. | 1'
    category: lost_operational_detail
    disposition: fix
    note: |
      The source specifies resultType: input_required, the nested inputRequests.confirm elicitation with its message and boolean schema, and the replacement of a held-open SSE stream by a retry carrying inputResponses and the echoed requestState. The manuscript names only the broad pieces, so a reader cannot construct or recognize the multi-round-trip payload from this account.
    suggestion: Include the minimal InputRequiredResult and retry JSON shape, and state explicitly that the SSE stream is no longer held open.
  - severity: major
    article: mcp-protocol-update
    locator: '- | It is a breaking release; the final specification ships July 28, 2026. | 1'
    repair_from: '- | It is a breaking release; the final specification ships July 28, 2026. | 1'
    category: lost_operational_detail
    disposition: fix
    note: |
      The source says the candidate was locked on May 21, 2026, gives a ten-week window for SDK and client workload validation, and expects Tier 1 SDKs to ship support during that window. The manuscript gives the final date but omits the candidate status and adoption deadline, leaving implementers unable to plan the validation window.
    suggestion: Add the lock date, ten-week validation window, and Tier 1 support expectation.
  - severity: major
    article: mcp-protocol-update
    repair_from: '- | A remote MCP server that previously needed sticky sessions, a shared session store, and deep packet inspection at the gateway can now run behind a plain round-robin load balancer, route traffic on an `Mcp-Method` header, and let clients cache responses for as long as the server''s `ttlMs` permits. | 1'
    category: no_position
    disposition: fix
    note: |
      The manuscript gives a useful condensation of the maintainers' thesis, but it makes no magazine-level claim about what matters most, what readers should change first, or why these changes belong together. Its cuts and emphasis are therefore indistinguishable from a paraphrase.
    suggestion: State an editorial thesis at the opening, such as treating the release primarily as an operator-facing transport migration with extensions and lifecycle rules as its supporting package.
  - severity: major
    article: mcp-protocol-update
    repair_from: '- | A remote MCP server that previously needed sticky sessions, a shared session store, and deep packet inspection at the gateway can now run behind a plain round-robin load balancer, route traffic on an `Mcp-Method` header, and let clients cache responses for as long as the server''s `ttlMs` permits. | 1'
    category: source_shaped
    disposition: fix
    note: |
      The manuscript follows the source's sequence almost exactly: stateless core, server-to-client requests, routing/cache/tracing, extensions, authorization, deprecations, schemas, and governance. For a faithful_synthesis, preserving the source's shape without a new organizing logic does little editorial work.
    suggestion: Reorganize around implementer decisions—what changes in deployment and request handling now, what must migrate, and what can wait—and make that organizing rule explicit.
  omissions:
  - fact: The six SEPs that jointly complete the stateless plan and the December Future of MCP Transports roadmap.
    reader_loses: The provenance and coordinated rationale for the stateless break, but not its described behavior.
    verdict: defensible
  - fact: The candidate lock date of May 21, 2026, the ten-week validation window, and the expectation that Tier 1 SDKs ship support during it.
    reader_loses: The release status and the concrete testing and adoption deadline.
    verdict: needed
  - fact: 'The exact pre-2026 initialize exchange: POST /mcp, Content-Type: application/json, the JSON-RPC initialize body, and the sample Mcp-Session-Id UUID.'
    reader_loses: A historical wire example, while the manuscript still explains the old sticky-session behavior.
    verdict: defensible
  - fact: The exact 2026-07-28 self-contained POST /mcp exchange, including Content-Type, JSON-RPC params, and the _meta clientInfo object.
    reader_loses: The concrete request shape needed to implement or test the new transport without consulting the source.
    verdict: needed
  - fact: The SEP-2575 and SEP-2567 identifiers for removing the initialize handshake and Mcp-Session-Id.
    reader_loses: Citation-level traceability, not the behavioral change.
    verdict: defensible
  - fact: The browser_id alternative and the worked create_basket -> basket_id b_123 -> add_item exchange.
    reader_loses: A concrete illustration of handle threading, though the prose preserves the pattern.
    verdict: defensible
  - fact: The SEP-2260 and SEP-2322 identifiers and the historical note that the server-request boundary was previously recommended rather than required.
    reader_loses: The proposal provenance and evolution history; the current normative boundary remains.
    verdict: defensible
  - fact: 'The InputRequiredResult fields resultType: input_required, inputRequests.confirm with its elicitation message and boolean schema, and the old held-open SSE flow.'
    reader_loses: The exact elicitation and retry payload and the transport behavior it replaces.
    verdict: needed
  - fact: The SEP-2243, SEP-2549, and SEP-414 citations for routing headers, caching, and tracing.
    reader_loses: Proposal-level references; the operational fields and effects remain.
    verdict: defensible
  - fact: The HTTP Cache-Control model and the consequence that SSE is no longer the only way to learn that a list changed.
    reader_loses: Why ttlMs and cacheScope replace the previous change-notification dependency.
    verdict: defensible
  - fact: The note that several SDKs and tools already propagated the W3C trace keys and that the resulting trace appears as one OpenTelemetry span tree.
    reader_loses: Implementation context and the precise observability destination, while the propagation path remains.
    verdict: defensible
  - fact: The statement that extensions already existed in 2025-11-25 without a formal process, and the SEP-2133 citation.
    reader_loses: The historical reason the new extension governance matters.
    verdict: defensible
  - fact: The count that this release contains two official extensions and the SEP-1865 citation for MCP Apps.
    reader_loses: A count and citation, while both extension behaviors are described.
    verdict: defensible
  - fact: The production-use rationale for moving experimental Tasks out of core into an extension.
    reader_loses: Why the redesign was necessary, though the new lifecycle and migration requirement remain.
    verdict: defensible
  - fact: The source's six authorization SEPs and its framing that the changes align MCP with deployed OAuth and OpenID Connect practice.
    reader_loses: The change-set's provenance and broader interoperability context.
    verdict: defensible
  - fact: RFC 9207 and SEP-2468 as the authority for validating iss.
    reader_loses: The citation behind the new authorization check, not the check itself.
    verdict: defensible
  - fact: 'The concrete application_type consequence: avoiding an authorization server defaulting a desktop or CLI client to web and rejecting its localhost redirect.'
    reader_loses: The practical failure mode that explains why the new registration field matters.
    verdict: defensible
  - fact: The SEP-837, SEP-2352, SEP-2207, SEP-2350, and SEP-2351 identifiers for the remaining authorization changes.
    reader_loses: Citation-level detail; the corresponding rules are summarized.
    verdict: defensible
  - fact: The SEP-2577 citation for the Roots, Sampling, and Logging deprecations.
    reader_loses: The proposal reference, not the replacements or compatibility window.
    verdict: defensible
  - fact: The exact JSON Schema keyword names oneOf, anyOf, allOf, $ref, and $defs, and the SEP-2106 citation.
    reader_loses: Examples of the newly permitted constructs, though the full dialect and constraints are named.
    verdict: defensible
  - fact: The SEP-2164 citation for changing -32002 to -32602 Invalid Params.
    reader_loses: The citation, while both codes and the required client update remain.
    verdict: defensible
  - fact: The count of three governance SEPs and the SEP-2484 identifier for the conformance-suite gate.
    reader_loses: Proposal provenance; the lifecycle and conformance requirement remain.
    verdict: defensible
  - fact: The instruction that the full candidate is in the draft specification and that the changelog will enumerate every change against 2025-11-25.
    reader_loses: Where to audit the complete diff.
    verdict: defensible
  - fact: The instruction to report problems in the specification repository and implementation questions in the relevant Working Group Discord channel.
    reader_loses: The source's support and feedback paths.
    verdict: defensible
  - fact: The Looking Ahead framing that the foundation is intended to grow long-term, with extensions on their own timeline, plus the closing acknowledgments.
    reader_loses: Rhetorical future framing and thanks, not technical substance.
    verdict: defensible
  retentions:
  - passage: A remote MCP server that previously needed sticky sessions
    costs: One long opening sentence, but it gives the deployment payoff—round-robin routing, header routing, and cache control—that makes the update matter.
    verdict: earns_place
  - passage: The release candidate for the 2026-07-28 specification is the largest revision since launch.
    costs: One sentence, but it establishes scale and identifies the release being summarized.
    verdict: earns_place
  - passage: It is a breaking release; the final specification ships July 28, 2026.
    costs: One sentence, but status and final date are essential context for adoption.
    verdict: earns_place
  - passage: An application may still keep state.
    costs: The stateful-application paragraph spends several sentences, but it distinguishes application handles from protocol sessions and preserves the model-threading idea.
    verdict: earns_place
  - passage: In practice, we've found this pattern
    costs: Two sentences, but they explain the non-obvious claim that explicit handles can be more powerful than hidden transport state.
    verdict: earns_place
  - passage: A server may issue one only while actively processing
    costs: The server-request paragraph earns its space by preserving the consent boundary and any-instance retry behavior.
    verdict: earns_place
  - passage: Three transport details finish the operational change.
    costs: The paragraph spends space on routing, cache metadata, and trace propagation—the fields an operator needs to recognize.
    verdict: earns_place
  - passage: Extensions now have a formal path.
    costs: The extension-governance sentences explain negotiation, ownership, and independent versioning rather than merely naming the feature.
    verdict: earns_place
  - passage: MCP Apps lets a server ship an interactive HTML interface
    costs: Three sentences, but they carry sandboxing, prefetch/security review, and audit/consent semantics.
    verdict: earns_place
  - passage: Tasks graduates from the core into an extension
    costs: The Tasks paragraph uses space on method names, server-directed creation, removal of tasks/list, and migration—the operational substance of the change.
    verdict: earns_place
  - passage: Clients must validate `iss` in authorization responses
    costs: The authorization paragraph is dense, but it retains each major normative hardening and its migration consequence.
    verdict: earns_place
  - passage: Roots, Sampling, and Logging are annotation-only deprecations.
    costs: The paragraph earns its space by naming replacements and the one-year compatibility guarantee.
    verdict: earns_place
  - passage: Tool schemas now use full JSON Schema 2020-12.
    costs: The schema paragraph carries both new expressiveness and safety constraints, plus the error-code migration.
    verdict: earns_place
  - passage: This release contains breaking changes.
    costs: The governance section repeats the headline slightly, but adds lifecycle, extension, and conformance rules that justify the space.
    verdict: earns_place
  - passage: The handshake and session are gone.
    costs: This sentence repeats the immediately preceding before-and-after summary; its space could carry the omitted current POST /mcp exchange or validation-window detail.
    verdict: cut
  notes: |
    The manuscript gives readers a compact, deployment-first account of the 2026-07-28 stateless redesign, its extensions, authorization changes, schema rules, and lifecycle policy. Changes are required because the omitted request payloads and release-validation window cost operational utility, while the synthesis follows the source's sequence without an editorial organizing claim. The needed omissions do not erase the release's core argument, and no retained section is inert; only the sentence "The handshake and session are gone." is a cuttable repetition.
evidence:
  result: changes_required
  findings:
  - severity: major
    article: mcp-protocol-update
    locator: '- | let clients cache responses for as long as the server''s `ttlMs` permits | 1'
    category: qualification_loss
    disposition: fix
    note: |
      The extraction limits this to `tools/list` responses in the deployment summary and to list/resource reads carrying `ttlMs` and `cacheScope`; the manuscript broadens it to generic responses and makes `ttlMs` sound sufficient on its own.
  - severity: major
    article: mcp-protocol-update
    locator: '- | It makes that deployment possible by making the protocol core stateless, adding an Extensions framework with Tasks and MCP Apps, hardening authorization, and setting a deprecation policy. | 1'
    category: unreached_conclusion
    disposition: fix
    note: |
      The extraction connects ordinary HTTP deployment to the stateless core and presents Extensions, authorization, and deprecation as separate changes. It does not conclude that all four changes make this deployment possible.
  - severity: major
    article: mcp-protocol-update
    locator: '- | Until 2025-11-25, Streamable HTTP began with an `initialize`/`initialized` handshake. | 1'
    category: number_or_name_error
    disposition: fix
    note: |
      The extraction says, "In 2025-11-25, calling a tool over Streamable HTTP means establishing a session first." The manuscript turns that specification-version reference into an unsupported historical cutoff with "Until."
  - severity: minor
    article: mcp-protocol-update
    locator: '- | Multi-round-trip work returns an `InputRequiredResult` with input requests and an opaque `requestState`. | 1'
    category: invented_claim
    disposition: fix
    note: |
      The extraction shows an `InputRequiredResult` containing `requestState` and says the client echoes it, but it never characterizes that state as opaque.
  - severity: minor
    article: mcp-protocol-update
    locator: How the Protocol Evolves From Here | Standards Track proposal cannot reach Final until a matching scenario lands in the conformance suite, the same suite used to score official SDK tiers. | 1
    category: invented_claim
    disposition: fix
    note: |
      The extraction says the new SDK tier system scores official SDKs against the conformance suite. The manuscript changes the scored object to "official SDK tiers."
  scores:
    claim_support: 3
    qualification_survival: 3
    quote_accuracy: 5
    attribution: 5
  notes: |
    I checked the edition byline, title, faithful-synthesis label, headings, body, and inline protocol details against the complete pinned extraction; this piece has no separate deck, captions, pull quotes, key-idea box, glossary, or cheat-sheet lines to check. The findings concern broadened scope, an unsupported causal conclusion, a version-boundary error, and two added or altered details.
