shape:
  result: changes_required
  findings:
  - severity: major
    article: mcp-protocol-update
    locator: '- | In `2026-07-28`, the same `tools/call` is self-contained. | 1'
    repair_from: '- | Until 2025-11-25, Streamable HTTP began with an `initialize`/`initialized` handshake. | 1'
    category: orphan_referent
    disposition: fix
    note: |
      The phrase "same `tools/call`" appears before any earlier `tools/call` has been established, leaving the comparison without a clear antecedent.
    suggestion: Establish the `tools/call` reference before referring to it as the same call.
  - severity: major
    article: mcp-protocol-update
    locator: Authorization Hardening | Roots, Sampling, and Logging are annotation-only deprecations. | 1
    repair_from: Authorization Hardening | The specification also clarifies refresh-token requests, scope accumulation during step-up, and the `.well-known` discovery suffix. | 1
    category: missing_transition
    disposition: fix
    note: |
      The section moves from authorization behavior to deprecation policy without signaling that the release discussion has broadened.
    suggestion: Add a bridge framing deprecations as a separate compatibility change.
  - severity: major
    article: mcp-protocol-update
    locator: Authorization Hardening | Tool schemas now use full JSON Schema 2020-12. | 1
    repair_from: Authorization Hardening | Their methods, types, and capability flags continue to work in this release and every specification version published within a year of it, and removal needs a separate SEP. | 1
    category: missing_transition
    disposition: fix
    note: |
      The schema and error-code paragraph follows the deprecation discussion with another unmarked shift in subject.
    suggestion: Signal that schema and error handling are the next distinct compatibility change.
  - severity: minor
    article: mcp-protocol-update
    locator: Authorization Hardening | Authorization Hardening | 1
    repair_from: Authorization Hardening | Clients must validate `iss` in authorization responses, a mitigation for mix-up attacks that matter more when one client talks to many servers. | 1
    category: heading_not_a_claim
    disposition: fix
    note: |
      The heading promises authorization hardening, but the section also contains deprecation and schema/error compatibility changes.
    suggestion: Use a heading that frames the section's broader compatibility argument.
  - severity: minor
    article: mcp-protocol-update
    locator: How the Protocol Evolves From Here | How the Protocol Evolves From Here | 1
    repair_from: How the Protocol Evolves From Here | This release contains breaking changes. | 1
    category: heading_not_a_claim
    disposition: fix
    note: |
      This heading names a topic rather than the section's claim that lifecycle gates and conformance requirements make future revisions safer.
    suggestion: Name the lifecycle and conformance safeguards as the heading's claim.
  scores:
    order: 4
    coherence: 3
    opening: 5
    ending: 4
  notes: |
    The piece moves from a stateless deployment payoff through request semantics, extensions, compatibility changes, and lifecycle policy, with a strong opening and a landed conclusion. The remaining defects are an unintroduced `tools/call`, two unmarked topic shifts, and headings that do not fully frame their sections.
craft:
  result: changes_required
  findings:
  - severity: blocking
    article: mcp-protocol-update
    locator: '- | It is a breaking release; the final specification ships July 28, 2026. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Seven sentences use the same semicolon-linked clause or list shape: "It is a breaking release; the final specification ships July 28, 2026."; "A tool can mint a `basket_id`; the model passes that identifier as an ordinary argument on the next call."; "They use reverse-DNS IDs, negotiation through an `extensions` map, separate `ext-*` repositories, delegated maintainers, and independent versions; an Extensions Track can carry a feature from experimental to official."; "A server can answer `tools/call` with a task handle; the client drives it with `tasks/get`, `tasks/update`, and `tasks/cancel`."; "Dynamic Client Registration now carries the OpenID Connect `application_type`; clients bind registered credentials to the issuing server's `issuer` and re-register if a resource moves."; "Roots move toward tool parameters, resource URIs, or server configuration; Sampling toward direct LLM-provider integration; Logging toward `stderr` for stdio and OpenTelemetry for structured observability."; and "Input schemas still need an object root but may use composition, conditionals, and references; output schemas are unrestricted, and `structuredContent` may be any JSON value." At seven occurrences, the cadence becomes the article's dominant beat.
    suggestion: Recast at least two of these sentences without the semicolon hinge.
  - severity: minor
    article: mcp-protocol-update
    locator: '- | Three transport details finish the operational change. | 1'
    category: weak_opening_sentence
    disposition: author_decision
    note: |
      "Three transport details finish the operational change" is a throat-clearing changelog opener: it announces a bundle instead of giving the reader a fact.
    suggestion: Open with the `Mcp-Method` and `Mcp-Name` routing detail.
  - severity: minor
    article: mcp-protocol-update
    locator: Extensions Become First-Class | Extensions now have a formal path. | 1
    category: dead_words
    disposition: author_decision
    note: |
      "Formal path" is an abstract metaphor that says extensions are now supported without telling the reader how; the next sentence supplies the mechanism.
    suggestion: Replace the sentence with the first concrete extension mechanism.
  - severity: minor
    article: mcp-protocol-update
    locator: Extensions Become First-Class | Extensions Become First-Class | 1
    category: cliche
    disposition: fix
    note: |
      "First-Class" is a stock programming-status idiom in an editor-owned heading; it labels importance instead of naming what the section adds.
    suggestion: Rename the heading to "Extension Negotiation and MCP Apps."
  - severity: major
    article: mcp-protocol-update
    locator: Authorization Hardening | Clients must validate `iss` in authorization responses, a mitigation for mix-up attacks that matter more when one client talks to many servers. | 1
    category: jargon
    disposition: author_decision
    note: |
      "`iss`" and "mix-up attacks" arrive without a plain-language gloss, so an engineer outside OAuth or MCP cannot tell what is being confused or why multiple servers matter.
    suggestion: Define a mix-up attack in plain language when `iss` is introduced.
  - severity: minor
    article: mcp-protocol-update
    locator: Authorization Hardening | In a future version, clients will be expected to reject a response that omits it, so authorization servers should supply it now. | 1
    category: passive
    disposition: author_decision
    note: |
      "Clients will be expected" leaves the actor setting the expectation unnamed; the policy sounds like an abstract requirement rather than a decision.
    suggestion: Name the authority that will require clients to reject the response.
  - severity: major
    article: mcp-protocol-update
    locator: Authorization Hardening | Roots, Sampling, and Logging are annotation-only deprecations. | 1
    category: jargon
    disposition: author_decision
    note: |
      "Roots", "Sampling", "Logging", and "annotation-only deprecations" are MCP-specific terms introduced as if known; the paragraph never gives an outside engineer a functional gloss for the features.
    suggestion: Add a short functional gloss for each feature before stating its deprecation status.
  - severity: minor
    article: mcp-protocol-update
    locator: How the Protocol Evolves From Here | This release contains breaking changes. | 1
    category: dead_words
    disposition: author_decision
    note: |
      "This release contains breaking changes." and "We don't intend for that to be the norm." are portentous short announcements that repeat the opening's "breaking release" without naming the concrete compatibility consequence.
    suggestion: Join the warning to the twelve-month deprecation rule.
  - severity: minor
    article: mcp-protocol-update
    locator: How the Protocol Evolves From Here | The stateless rework in this release is the kind of foundational change that needed a clean break. | 1
    category: cliche
    disposition: author_decision
    note: |
      "Foundational change" and "clean break" stack a generic status label with a familiar figure instead of naming the incompatibility that required dropping sessions.
    suggestion: State the incompatibility directly instead of using "clean break."
  scores:
    voice: 3
    sentence_variety: 1
    economy: 3
  notes: |
    I heard a clear technical voice in the deployment and state-handling examples, then a semicolon-driven release-note register with unexplained protocol shorthand. The opening earns attention, but the repeated clause shape and abstract signposting require revision.
