  retentions:
  - passage: A remote MCP server that previously needed sticky sessions...
    costs: A short setup paragraph, but it establishes the practical stakes, release scale, and planning dates.
    verdict: earns_place
  - passage: In 2025-11-25, calling a tool over Streamable HTTP...
    costs: Two HTTP examples consume a code block, but show exactly what the old and new wire contracts require.
    verdict: earns_place
  - passage: Streamable HTTP now requires Mcp-Method and Mcp-Name headers...
    costs: Dense operational prose, but it preserves routing, caching, and distributed-tracing details an implementer needs.
    verdict: earns_place
  - passage: Removing the protocol-level session does not make an application stateless...
    costs: A full paragraph, but it explains the explicit-handle migration and the model-visible state model.
    verdict: earns_place
  - passage: The protocol no longer manages that state for you...
    costs: A few reinforcing lines, but they prevent the stateless-core change from being misread as a ban on application state.
    verdict: earns_place
  - passage: Server-initiated requests may now be issued only while actively processing...
    costs: A paragraph, but it states the causality and consent boundary for elicitation.
    verdict: earns_place
  - passage: Multi Round-Trip Requests (SEP-2322) no longer hold an SSE stream open...
    costs: A JSON example, but it is the concrete retry contract and shows why any instance can resume the call.
    verdict: earns_place
  - passage: Long-running work has an immediate migration...
    costs: A dense paragraph, but it preserves every task method, server-directed creation, and removed method an implementer must migrate.
    verdict: earns_place
  - passage: Authorization now follows OAuth 2.0 and OpenID Connect deployments more closely...
    costs: A substantial paragraph, but it carries the validation, registration, issuer, refresh-token, scope, and discovery changes.
    verdict: earns_place
  - passage: Schema and error handling bring another compatibility check...
    costs: A compact technical paragraph, but it retains the schema vocabulary, validation limits, and exact error-code migration.
    verdict: earns_place
  - passage: Extensions now have a formal path...
    costs: A paragraph, but it explains how future capabilities are negotiated, housed, maintained, and versioned.
    verdict: earns_place
  - passage: MCP Apps lets servers ship interactive HTML...
    costs: A paragraph, but it preserves sandboxing, prefetch and review, and the audit path for UI actions.
    verdict: earns_place
  - passage: Three core features are annotation-only deprecations...
    costs: A paragraph, but it names all replacements and the one-year compatibility guarantee.
    verdict: earns_place
  - passage: The ten-week period between the May 21 lock...
    costs: A short timeline paragraph, but it gives maintainers the validation window and Tier 1 expectation.
    verdict: earns_place
  - passage: This release contains breaking changes. We don't intend for that to be the norm...
    costs: A governance paragraph, but it preserves the twelve-month lifecycle rule, extension path, and conformance gate.
    verdict: earns_place
  - passage: With the stateless rework landed...
    costs: A concluding paragraph that repeats the direction, but it states the payoff for future transport and lifecycle upgrades.
    verdict: earns_place
  notes: |
    The piece gives an implementer a migration sequence—stateless transport, explicit handles and payload retries, then Tasks/auth/schema changes and extension/deprecation guardrails—rather than merely repeating the announcement.
    It is materially shorter than the source while retaining the method names, headers, fields, JSON exchanges, error code, schema constraints, and lifecycle thresholds needed to act. Every omission is a defensible citation, history, support pointer, or secondary illustration; no omission cuts past the bone. Every listed retention earns its place, so no section carries inert weight.
    Shape: the manuscript runs Change deployment and request handling | Keep application state and retries explicit | Migrate calls, authorization, and schemas | Use extensions and deprecation windows | Build on the compatibility suite. The source runs A Stateless Protocol | Extensions Become First-Class | Authorization Hardening | Roots, Sampling, and Logging Are Deprecated | Full JSON Schema 2020-12 for Tools | How the Protocol Evolves From Here | Release Timeline and Validation | Looking Ahead. The regrouping is editorial rather than source-shaped.
    Position: the opening instruction to start with transport and the claim that model-visible handles can be more powerful than hidden session state give the synthesis its own ordering and judgment.
