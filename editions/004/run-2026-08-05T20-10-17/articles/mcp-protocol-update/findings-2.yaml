worth:
  result: approved
  findings: []
  omissions:
  - fact: The announcement that the release candidate was available on May 21, rather than only locked that day
    reader_loses: The publication-state nuance, not any implementation guidance.
    verdict: defensible
  - fact: The statement that six SEPs complete the plan from The Future of MCP Transports in December
    reader_loses: Roadmap provenance and the count of proposals, not the changes themselves.
    verdict: defensible
  - fact: The exact old session-bound tools/call POST, including its sample session UUID and request id 2
    reader_loses: A second before-and-after wire example; the new request and prose establish the migration.
    verdict: defensible
  - fact: The explicit statement that the Mcp-Session-Id header itself is removed
    reader_loses: An explicit migration checkbox, though the session-free request and surrounding explanation make the removal clear.
    verdict: defensible
  - fact: SEP-2575, the identifier for removing the initialize/initialized handshake
    reader_loses: A lookup reference only; the rule is retained.
    verdict: defensible
  - fact: SEP-2567, the identifier for removing the protocol session
    reader_loses: A lookup reference only; the rule is retained.
    verdict: defensible
  - fact: The browser_id example and the create_basket/add_item worked sequence
    reader_loses: A second illustration of explicit handles; basket_id still teaches the pattern.
    verdict: defensible
  - fact: The note that earlier specifications recommended server-initiated requests before making them required
    reader_loses: Historical nuance; the current restriction and its user-facing consequence remain.
    verdict: defensible
  - fact: SEP-2243, the identifier for the routing headers
    reader_loses: A lookup reference only; the headers and their behavior are retained.
    verdict: defensible
  - fact: The HTTP Cache-Control analogy and the statement that SSE is no longer the only way to learn that a list changed
    reader_loses: Motivating context for cache metadata, not its freshness and sharing semantics.
    verdict: defensible
  - fact: SEP-2549, the identifier for ttlMs and cacheScope
    reader_loses: A lookup reference only; both fields and their meaning remain.
    verdict: defensible
  - fact: SEP-414, the identifier for W3C Trace Context propagation
    reader_loses: A lookup reference only; the key names and trace path remain.
    verdict: defensible
  - fact: The statement that extensions existed in 2025-11-25 but had no formal process
    reader_loses: Historical contrast; the new formal process is fully described.
    verdict: defensible
  - fact: SEP-2133, the identifier for the formal extensions process
    reader_loses: A lookup reference only; reverse-DNS IDs, negotiation, repositories, and independent versioning remain.
    verdict: defensible
  - fact: The explicit count that this release contains two official extensions
    reader_loses: A count; MCP Apps and Tasks are both covered.
    verdict: defensible
  - fact: SEP-1865, the identifier for MCP Apps
    reader_loses: A lookup reference only; the UI behavior and security path remain.
    verdict: defensible
  - fact: RFC 9207, the cited standard for iss validation
    reader_loses: A standards citation, not the validation requirement.
    verdict: defensible
  - fact: SEP-2468, the identifier for iss validation
    reader_loses: A lookup reference only; the attack and mitigation remain.
    verdict: defensible
  - fact: SEP-837, the identifier for application_type during registration
    reader_loses: A lookup reference only; the interoperability problem and fix remain.
    verdict: defensible
  - fact: SEP-2352, the identifier for issuer binding and re-registration
    reader_loses: A lookup reference only; the issuer behavior remains.
    verdict: defensible
  - fact: SEP-2207, the identifier for refresh-token requests
    reader_loses: A lookup reference only; the clarification is retained.
    verdict: defensible
  - fact: SEP-2350, the identifier for scope accumulation during step-up
    reader_loses: A lookup reference only; the scope clarification is retained.
    verdict: defensible
  - fact: SEP-2351, the identifier for the .well-known discovery suffix
    reader_loses: A lookup reference only; the suffix clarification is retained.
    verdict: defensible
  - fact: SEP-2577, the identifier for the deprecation lifecycle
    reader_loses: A lookup reference only; replacements and the grace period remain.
    verdict: defensible
  - fact: SEP-2106, the identifier for full JSON Schema 2020-12
    reader_loses: A lookup reference only; the schema rules and safety limits remain.
    verdict: defensible
  - fact: SEP-2164, the identifier for the missing-resource error change
    reader_loses: A lookup reference only; both error codes and the migration instruction remain.
    verdict: defensible
  - fact: The statement that three governance SEPs are included, including SEP-2484 for the conformance gate
    reader_loses: The count and lookup identifier, not the lifecycle, extension, or conformance rules.
    verdict: defensible
  - fact: The explanation that the stateless rework specifically required a clean break
    reader_loses: Some rationale for the breaking change; the change and future compatibility policy remain.
    verdict: defensible
  - fact: The draft-specification location and promise that the changelog will enumerate every difference from 2025-11-25
    reader_loses: A validation pointer, not the substance of the changes.
