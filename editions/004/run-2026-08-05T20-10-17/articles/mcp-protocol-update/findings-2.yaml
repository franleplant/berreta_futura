mechanics:
  result: changes_required
  findings:
  - severity: major
    article: mcp-protocol-update
    locator: Keep application state and retries explicit | Server-initiated requests may now be issued only while actively processing a client request (SEP-2260). | 1
    category: grammar
    disposition: fix
    note: |
      "While actively processing a client request" has no explicit subject and dangles from "Server-initiated requests"; requests cannot do the processing. This is synthesized prose, so the editors should repair it.
    suggestion: A server may now issue server-initiated requests only while it is actively processing a client request (SEP-2260).
  scores:
    grammar: 4
    typography: 5
    consistency: 5
  notes: |
    Changes required because one dangling modifier remains; sentence openings, headings, punctuation, typography, and code samples are otherwise clean.
shape:
  result: changes_required
  findings:
  - severity: major
    article: mcp-protocol-update
    locator: Keep application state and retries explicit | A tool can mint an explicit handle such as `basket_id`, and the model passes it as an ordinary argument on later calls. | 1
    repair_from: '- | A remote MCP server that previously needed sticky sessions, a shared session store, and deep packet inspection at its gateway can now run behind a plain round-robin load balancer. | 1'
    category: running_example
    disposition: fix
    note: |
      The opening's remote-server scenario and the transport search call are abandoned as the piece moves to a basket handle, a file-deletion elicitation, task polling, OAuth, and MCP Apps. Each section introduces a fresh illustration, so no concrete case carries the argument through the protocol changes.
    suggestion: Choose one implementer scenario and thread it through the transport, state, retry, migration, and extension sections, retaining at most one contrast.
  scores:
    order: 5
    coherence: 3
    opening: 5
    ending: 5
  notes: |
    The piece moves in a recoverable order from stateless transport through explicit state, migrations, extensions, and compatibility policy, but its concrete examples do not form a continuous thread.
craft:
  result: changes_required
  findings:
  - severity: major
    article: mcp-protocol-update
    locator: Use extensions and deprecation windows | Roots, the feature represented by root declarations, moves toward tool parameters, resource URIs, or server configuration. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Three consecutive sentences use the same shape: feature name, explanatory clause, then "moves" plus destination. The instances are "Roots, the feature represented by root declarations, moves toward tool parameters, resource URIs, or server configuration.", "Sampling, which lets MCP call an LLM provider, moves toward direct provider integration.", and "Logging, which emits log output, moves to `stderr` for stdio transports and OpenTelemetry for structured observability." The sequence is monotonous enough to sound like a changelog.
    suggestion: Vary the openings and predicates of the three migration sentences.
  - severity: major
    article: mcp-protocol-update
    locator: Use extensions and deprecation windows | Three core features are annotation-only deprecations. | 1
    category: no_voice
    disposition: fix
    note: |
      The paragraph beginning here is where the person drops out: it inventories feature states, destinations, deprecation windows, and expected shipments with no reader-facing consequence or observed workload. Its grammatical certainty and noun-heavy transitions sound like system output rather than maintainers explaining a choice.
    suggestion: Tie each deprecation and the release window to the implementer decision it changes.
  - severity: minor
    article: mcp-protocol-update
    locator: '- | For an implementer, start with the transport: change deployment and request handling around a stateless protocol core, move application state and long-running work into explicit handles or extensions, and separate immediate migrations from changes with a grace period. | 1'
    category: passive
    disposition: fix
    note: |
      "For an implementer" names an audience, not an actor; the sentence then issues four imperatives without a subject. That ownerless command gives the opening a manual-like register.
    suggestion: Name the implementer as the actor in the migration guidance.
  - severity: minor
    article: mcp-protocol-update
    locator: '- | The `2026-07-28` release candidate is the largest revision since launch. | 1'
    category: ai_phrasing
    disposition: fix
    note: |
      "Largest revision since launch" asks a superlative to announce scale before the concrete changes establish it, making the sentence sound like significance-signalling.
    suggestion: Replace the ranking with the concrete change that makes this revision different.
  - severity: minor
    article: mcp-protocol-update
    locator: Change deployment and request handling | The `initialize`/`initialized` handshake and protocol-level session are gone. | 1
    category: dead_words
    disposition: fix
    note: |
      Four stand-alone declarations use the portentous short-sentence register: "The `initialize`/`initialized` handshake and protocol-level session are gone.", "Any instance can handle any request.", "Task creation is server-directed.", and "This release contains breaking changes." Each is understandable, but their clipped certainty makes the release read like system output.
    suggestion: Fold each declaration into the sentence that supplies its mechanism or consequence.
  - severity: minor
    article: mcp-protocol-update
    locator: Change deployment and request handling | A trace can follow a call from the host application through the client SDK, MCP server, and downstream services as one span tree in an OpenTelemetry-compatible backend. | 1
    category: jargon
    disposition: fix
    note: |
      "Span tree" and "OpenTelemetry-compatible backend" are subfield terms with no plain-language gloss, so the tracing claim is not legible to a competent engineer outside this specialty.
    suggestion: Define the trace structure and backend in plain language before relying on those terms.
  - severity: minor
    article: mcp-protocol-update
    locator: Migrate calls, authorization, and schemas | Long-running work has an immediate migration. | 1
    category: weak_opening_sentence
    disposition: fix
    note: |
      The section opens on two abstractions, "long-running work" and "migration", while the concrete Tasks change appears later. It announces a category instead of putting the reader in the change.
    suggestion: Open with the Tasks API moving from the core specification to an extension.
  - severity: minor
    article: mcp-protocol-update
    locator: Migrate calls, authorization, and schemas | Schema and error handling bring another compatibility check. | 1
    category: dead_words
    disposition: fix
    note: |
      This is an abstraction stack ending in a generic noun phrase. It delays the actual schema and error changes that follow.
    suggestion: Lead with the specific schema or error change instead of a compatibility-check abstraction.
  - severity: minor
    article: mcp-protocol-update
    locator: Migrate calls, authorization, and schemas | The specification also clarifies refresh-token requests, scope accumulation during step-up, and the `.well-known` discovery suffix. | 1
    category: jargon
    disposition: fix
    note: |
      "Step-up" and the `.well-known` discovery suffix are subfield terms left unexplained; the list reads like a changelog for OAuth insiders.
    suggestion: Gloss both terms before listing them.
  - severity: minor
    article: mcp-protocol-update
    locator: Keep application state and retries explicit | Server-initiated requests may now be issued only while actively processing a client request (SEP-2260). | 1
    category: passive
    disposition: fix
    note: |
      The server is the known actor, but "may now be issued" hides it behind a passive construction without a clear reason to foreground the requests.
    suggestion: Make the server the grammatical subject of this restriction.
  - severity: minor
    article: mcp-protocol-update
    locator: Use extensions and deprecation windows | Extensions now have a formal path. | 1
    category: dead_words
    disposition: fix
    note: |
      "Formal path" is process abstraction: it says a path exists without naming the negotiation and repository mechanism described in the next sentence.
    suggestion: Name the extension mechanism directly in the opening sentence.
  - severity: minor
    article: mcp-protocol-update
    locator: Use extensions and deprecation windows | Roots, the feature represented by root declarations, moves toward tool parameters, resource URIs, or server configuration. | 1
    category: dead_words
    disposition: fix
    note: |
      The appositive "the feature represented by root declarations" defines Roots by repeating the term, leaving the feature's behavior unexplained.
    suggestion: Explain what roots do before describing where they move.
  scores:
    voice: 3
    sentence_variety: 2
    economy: 3
  notes: |
    I hear a technically fluent synthesis that is most human when it explains handles and retries, then flattens into a changelog around deprecations and release policy. The piece needs changes for the repeated migration syntax, abstract release-note sentences, and unglossed tracing and authorization terms.
