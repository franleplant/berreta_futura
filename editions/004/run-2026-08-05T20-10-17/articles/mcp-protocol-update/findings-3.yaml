shape:
  result: changes_required
  findings:
  - severity: minor
    article: mcp-protocol-update
    locator: Change deployment and request handling | In `2025-11-25`, calling a tool over Streamable HTTP means establishing a session first. | 1
    repair_from: Change deployment and request handling | In `2025-11-25`, calling a tool over Streamable HTTP means establishing a session first. | 1
    category: heading_not_a_claim
    disposition: fix
    note: |
      The heading names the operations covered but not the section's claim that stateless request handling makes calls independently routable.
    suggestion: Rename the heading to 'Why stateless request handling removes sticky sessions.'
  - severity: major
    article: mcp-protocol-update
    locator: Keep application state and retries explicit | A basket tool can mint an explicit handle, `basket_id`, and the model can pass it as an ordinary argument on later calls. | 1
    repair_from: 'Change deployment and request handling | Keep the opening server''s search call in view: | 1'
    category: running_example
    disposition: fix
    note: |
      The piece starts with a search request, then switches to a basket handle and a file-deletion confirmation, while later sections introduce tasks and MCP Apps. No concrete case carries the argument across sections, so the reader must repeatedly reset the frame.
    suggestion: Carry the opening search request through the later state, retry, and compatibility sections, retaining at most one contrasting example.
  - severity: minor
    article: mcp-protocol-update
    locator: Migrate calls, authorization, and schemas | Long-running work on this same server has a new lifecycle. | 1
    repair_from: Migrate calls, authorization, and schemas | Long-running work on this same server has a new lifecycle. | 1
    category: heading_not_a_claim
    disposition: fix
    note: |
      The heading inventories three compatibility surfaces but does not state what the section concludes about their coordinated migration.
    suggestion: Rename the heading to 'Three compatibility surfaces require coordinated migration.'
  - severity: major
    article: mcp-protocol-update
    locator: Use extensions and deprecation windows | During the ten-week candidate window, SDK maintainers and client implementers validate the changes against real workloads. | 1
    repair_from: '- | The candidate was locked on May 21, 2026; the final specification ships July 28 after ten weeks of validation. | 1'
    category: duplication
    disposition: fix
    note: |
      The opening says the final specification ships after ten weeks of validation, then this paragraph repeats the same ten-week candidate-window fact. The second occurrence adds no new structural step.
    suggestion: Keep the ten-week validation fact in the opening timeline and use this paragraph for the validation consequence instead.
  scores:
    order: 4
    coherence: 3
    opening: 4
    ending: 4
  notes: |
    This piece moves from stateless request routing through explicit state and retries, compatibility migration, extensions and deprecations, and conformance. The overall order is recoverable and the opening and ending land, but the running examples reset, the timeline repeats, and two headings label topics rather than claims.
craft:
  result: changes_required
  findings:
  - severity: minor
    article: mcp-protocol-update
    locator: 'Change deployment and request handling | Keep the opening server''s search call in view: | 1'
    category: passive
    disposition: fix
    note: |
      "Keep the opening server's search call in view" is an ownerless imperative. It orders the reader around without carrying an argument in the sentence.
    suggestion: |
      Turn the command into a declarative transition that says what the example demonstrates.
  - severity: minor
    article: mcp-protocol-update
    locator: Change deployment and request handling | The `initialize`/`initialized` handshake is removed (SEP-2575). | 1
    category: passive
    disposition: fix
    note: |
      The sentence gives no actor for the removal. The revision or SEP is the relevant subject, so the passive construction makes a changelog fact sound ownerless.
    suggestion: |
      Make the revision or specification the subject of the removal.
  - severity: minor
    article: mcp-protocol-update
    locator: Change deployment and request handling | The `initialize`/`initialized` handshake is removed (SEP-2575). | 1
    category: jargon
    disposition: fix
    note: |
      "SEP" is never expanded, although the article uses it repeatedly as if its meaning were obvious to engineers outside MCP.
    suggestion: |
      Expand SEP on first use and abbreviate later references.
  - severity: minor
    article: mcp-protocol-update
    locator: Keep application state and retries explicit | The protocol no longer manages that state for you, but it doesn't prevent you from managing it yourself. | 1
    category: dead_words
    disposition: fix
    note: |
      "Manages" and "managing" repeat the preceding basket-handle point, so this balanced clause adds no new boundary.
    suggestion: |
      Cut the sentence and let the basket_id example carry the distinction.
  - severity: minor
    article: mcp-protocol-update
    locator: Keep application state and retries explicit | It's often a more powerful one. | 1
    category: dead_words
    disposition: fix
    note: |
      The pronoun "one" has no stable referent and "more powerful" names no capability. A generic comparative is being asked to carry the insight.
    suggestion: |
      Name the specific capability that makes explicit handles stronger, or delete the sentence.
  - severity: minor
    article: mcp-protocol-update
    locator: Migrate calls, authorization, and schemas | Long-running work on this same server has a new lifecycle. | 1
    category: dead_words
    disposition: fix
    note: |
      "Long-running work," "same server," and "new lifecycle" form an abstraction stack that announces a change without showing it.
    suggestion: |
      Cut this announcement and begin with the concrete change to Tasks.
  - severity: minor
    article: mcp-protocol-update
    locator: Migrate calls, authorization, and schemas | Tasks shipped as an experimental core feature in `2025-11-25`. | 1
    category: passive
    disposition: fix
    note: |
      The feature is presented as having shipped, but no release or specification is acting. The passive hides provenance that matters in a migration.
    suggestion: |
      Make the 2025-11-25 specification or release the actor.
  - severity: minor
    article: mcp-protocol-update
    locator: Migrate calls, authorization, and schemas | `tasks/list` is removed because it cannot be scoped safely without sessions. | 1
    category: passive
    disposition: fix
    note: |
      Both "is removed" and "cannot be scoped" remove the actor and mechanism, leaving a policy decision in system-log voice.
    suggestion: |
      Make the revision the subject and state why sessionless scoping fails.
  - severity: major
    article: mcp-protocol-update
    locator: Use extensions and deprecation windows | The release marks three core features as annotation-only deprecations. | 1
    category: no_voice
    disposition: fix
    note: |
      This paragraph becomes a flat deprecation catalogue: "annotation-only deprecations," "the replacement," "log output," and "a separate SEP" arrive as labels, with no person making a choice or showing the implementer's consequence. The voice disappears here.
    suggestion: |
      Anchor each deprecation to the implementer's decision or consequence before listing the replacement.
  - severity: minor
    article: mcp-protocol-update
    locator: Use extensions and deprecation windows | Extensions now have a formal path. | 1
    category: dead_words
    disposition: fix
    note: |
      "A formal path" is an abstract announcement; the next sentence supplies the actual negotiation and repository mechanics.
    suggestion: |
      Cut this sentence and let the concrete extension rules open the paragraph.
  - severity: minor
    article: mcp-protocol-update
    locator: Use extensions and deprecation windows | Direct integration with that provider is the replacement. | 1
    category: dead_words
    disposition: fix
    note: |
      This is a definite-article equation: "direct integration" is abstract and "the replacement" merely points back to it without stating the behavior.
    suggestion: |
      State the concrete replacement behavior instead of calling it "the replacement."
  - severity: minor
    article: mcp-protocol-update
    locator: Use extensions and deprecation windows | Logging emits log output. | 1
    category: dead_words
    disposition: fix
    note: |
      "Emits log output" repeats the noun as verb and object, so the sentence contributes no information.
    suggestion: |
      Cut the sentence or state what the replacement observability path does.
  scores:
    voice: 3
    sentence_variety: 4
    economy: 3
  notes: |
    I hear a technically fluent maintainer explaining a real migration, but the deprecation catalogue turns into changelog prose and several transitions go abstract or ownerless.
    The piece needs a small set of cuts, active subjects, and one acronym expansion before it reads as a person throughout.
