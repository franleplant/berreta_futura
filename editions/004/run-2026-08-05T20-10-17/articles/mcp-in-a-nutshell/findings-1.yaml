craft:
  result: changes_required
  findings:
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | MCP in a Nutshell | 1'
    category: cliche
    disposition: fix
    note: |
      The title uses the stock "in a nutshell" formula; it promises compression rather than giving this protocol a distinctive angle.
    suggestion: Retitle around the protocol's concrete job.
  - severity: blocking
    article: mcp-in-a-nutshell
    locator: '- | A database MCP server can expose a tool for querying the database, a resource that contains its schema, and a prompt with few-shot examples for interacting with those tools. | 1'
    repair_from: '- | A database MCP server can expose a tool for querying the database, a resource that contains its schema, and a prompt with few-shot examples for interacting with those tools. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Seven sentences use the same "Subject can + verb" capability shape: "A database MCP server can expose...", "MCP servers can execute...", "a client can send...", "Servers can expose...", "the client can list...", "A client can also expose...", and "Optional extensions such as Tasks can return...". The modal cadence becomes audible before the explanation accumulates.
    suggestion: Cut or structurally recast at least two of the seven capability sentences.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | An AI application reaches that server through an MCP host, which creates one MCP client for each server; each client maintains a dedicated connection. | 1'
    repair_from: '- | An AI application reaches that server through an MCP host, which creates one MCP client for each server; each client maintains a dedicated connection. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Four sentences use an independent-clause semicolon join: "An AI application reaches...; each client maintains...", "Streamable HTTP uses...; MCP recommends OAuth...", "A client may send...; every server must implement...", and "Sampling and logging are deprecated...; new implementations should...". Each pair appends another protocol fact in the same beat, flattening the rhythm.
    suggestion: Recast at least two of the four semicolon joins.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | The discovery response is typically cacheable, so the initial exchange need not happen for every request. | 1'
    repair_from: '- | The discovery response is typically cacheable, so the initial exchange need not happen for every request. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Four sentences use the "clause, so consequence" shape: "The discovery response is typically cacheable, so...", "A result arrives as a content array..., so...", "When the database server's available tools change..., so...", and "Notifications are best effort..., so...". The repeated causal tail makes paragraph endings sound mechanical.
    suggestion: Recast at least two of the four causal joins.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | MCP is a stateless protocol. | 1'
    repair_from: '- | Two layers carry that exchange. | 1'
    category: no_voice
    disposition: fix
    note: |
      Paragraph 3 is where I stop hearing a person: "MCP is a stateless protocol" opens a sequence of version and capability rules that reads like a protocol dump. The concrete database frame disappears and the register becomes an even checklist.
    suggestion: Reintroduce the database scenario at the start of paragraph 3.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | Two layers carry that exchange. | 1'
    category: dead_words
    disposition: fix
    note: |
      "Two layers carry that exchange." is a portentous short sentence; "carry" is a decorative metaphor, and the next sentence already names the layers and their mechanism.
    suggestion: Cut the sentence and let the next sentence name the two layers.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | MCP is a stateless protocol. | 1'
    category: dead_words
    disposition: fix
    note: |
      "MCP is a stateless protocol." is a definite-article equation. It labels a property without showing why the request behavior matters, adding to the spec-register shift.
    suggestion: Tie statelessness directly to the request behavior before the version rules.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | Those capabilities are expressed through primitives. | 1'
    category: passive
    disposition: fix
    note: |
      "Those capabilities are expressed through primitives." hides the actor and introduces an abstraction before the following sentence supplies the concrete tools, resources, and prompts.
    suggestion: Name the servers as the actor in this transition.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | Sampling and logging are deprecated client primitives as of protocol version 2026-07-28; new implementations should integrate directly with LLM provider APIs and log to stderr when using STDIO or use OpenTelemetry. | 1'
    category: passive
    disposition: fix
    note: |
      "New implementations should..." is an ownerless imperative: implementations do not choose, and the people responsible for the change are unnamed.
    suggestion: Name the implementers responsible for the deprecation decision.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | A database MCP server can expose a tool for querying the database, a resource that contains its schema, and a prompt with few-shot examples for interacting with those tools. | 1'
    category: jargon
    disposition: fix
    note: |
      The opening never expands MCP; the title gives only the acronym, so an engineer outside the subfield has to guess the central noun.
    suggestion: Expand MCP on first use.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | Every request carries the protocol version and the capabilities relevant to that request in its `_meta` field. | 1'
    repair_from: '- | Every request carries the protocol version and the capabilities relevant to that request in its `_meta` field. | 1'
    category: jargon
    disposition: fix
    note: |
      `_meta` appears as a protocol-specific field with no gloss, and later identifiers such as `server/discover`, `*/list`, `tools/call`, and `inputSchema` arrive as syntax a non-MCP reader cannot reliably parse.
    suggestion: Define the field-and-method naming convention before introducing `_meta`.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | This design allows listings to be dynamic. | 1'
    category: dead_words
    disposition: fix
    note: |
      "This design allows listings to be dynamic." is an abstraction-stack summary. "This design" names nothing and "dynamic" adds no operational detail after the Tasks explanation.
    suggestion: State the concrete listing change and its client consequence.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | The protocol supports real-time notifications to enable dynamic updates between servers and clients. | 1'
    category: dead_words
    disposition: fix
    note: |
      "The protocol supports real-time notifications to enable dynamic updates..." stacks abstractions before the event mechanics and repeats "dynamic" instead of giving the reader a concrete actor and event.
    suggestion: Open with the specific notification event and its recipient.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | The application updates the model''s available capabilities when the database server changes, and the next call follows the new list. | 1'
    repair_from: '- | The client normally calls `tools/list` again and updates the tool registry available to the model. | 1'
    category: weak_close
    disposition: fix
    note: |
      The final sentence restates the preceding update-and-next-call behavior. It closes on a summary loop rather than adding clarity, perspective, or curiosity.
    suggestion: End on the consequence for the model's next turn.
  scores:
    voice: 2
    sentence_variety: 1
    economy: 3
  notes: |
    I heard a careful technical explainer whose concrete database frame gives way to a protocol-spec register, with modal capability sentences and summary clauses carrying the cadence. Changes are required because the modal pattern is blocking and the final line loops back over the preceding sentence; the remaining findings are local repairs to voice, jargon, abstraction, and passive agency.
