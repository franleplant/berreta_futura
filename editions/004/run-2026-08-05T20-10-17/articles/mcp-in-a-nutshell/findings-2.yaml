shape:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | In the database example, the query tool performs the action, the schema resource supplies context, and the prompt provides few-shot examples for the interaction. | 1'
    repair_from: '- | It may expose a query tool, a resource containing the database schema, and a prompt with few-shot examples for interacting with those tools. | 1'
    category: duplication
    disposition: fix
    note: |
      The opening states, "It may expose a query tool, a resource containing the database schema, and a prompt with few-shot examples for interacting with those tools." Later it repeats, "In the database example, the query tool performs the action, the schema resource supplies context, and the prompt provides few-shot examples for the interaction." The later passage restates the same three-part mapping instead of advancing the explanation.
    suggestion: Keep the database mapping in one place and remove the later restatement.
  scores:
    order: 4
    coherence: 4
    opening: 5
    ending: 4
  notes: |
    The piece moves from a database-server setup through transport and request mechanics to primitives, client features, and live updates, with one repeated database mapping.
craft:
  result: changes_required
  findings:
  - severity: blocking
    article: mcp-in-a-nutshell
    locator: '- | It may expose a query tool, a resource containing the database schema, and a prompt with few-shot examples for interacting with those tools. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Nineteen subject-first declaratives with a finite verb and a technical object or complement fill the first two paragraphs:
      "It may expose a query tool, a resource containing the database schema, and a prompt with few-shot examples for interacting with those tools."
      "An AI application acts as the MCP host."
      "The host creates one MCP client for each server and coordinates them."
      "Each client maintains a dedicated connection to its corresponding server."
      "A local MCP server using STDIO typically serves a single client."
      "A remote MCP server using Streamable HTTP typically serves many."
      "MCP focuses solely on the protocol for context exchange."
      "The AI application decides how to use its LLMs and manage the context the protocol provides."
      "The exchange has two layers."
      "The data layer defines message structure and semantics."
      "MCP uses JSON-RPC 2.0 as its underlying RPC protocol."
      "Clients and servers exchange requests and responses."
      "The transport layer establishes connections, frames messages, and handles authentication."
      "STDIO uses standard input and output to connect local processes, with no network overhead."
      "Streamable HTTP sends client-to-server messages with HTTP POST."
      "Optional Server-Sent Events provide streaming."
      "The transport supports bearer tokens, API keys, and custom headers."
      "MCP recommends OAuth to obtain authentication tokens."
      "The transport layer abstracts communication details from the protocol layer, enabling the same JSON-RPC 2.0 message format across all transport mechanisms."
      The pattern is audible before the distinctions are. Because it is the author's dominant construction, the remedy is editorial: cut or recast the run.
    suggestion: Have an editor combine several declaratives and anchor the explanation in fewer concrete actions.
  - severity: blocking
    article: mcp-in-a-nutshell
    locator: '- | The exchange has two layers. | 1'
    repair_from: '- | Consider a database MCP server. | 1'
    category: no_voice
    disposition: fix
    note: |
      At paragraph 2, the concrete database setup gives way to an even inventory of protocol nouns and verbs. The same register continues through the close: grammatically clean, but with no curiosity, reader-facing judgment, or human-sized consequence.
    suggestion: Keep one database request in view and make each protocol term answer a concrete question the reader has just encountered.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | Consider a database MCP server. | 1'
    category: jargon
    disposition: fix
    note: |
      MCP is never expanded, and the article asks a non-specialist engineer to absorb STDIO, Streamable HTTP, JSON-RPC 2.0, Server-Sent Events, OAuth, _meta, */list, */get, inputSchema, elicitation/create, OpenTelemetry, Tasks, subscriptions/listen, and notifications/tools/list_changed, alongside terms such as few-shot and LLMs. Several are described by behavior but not defined in plain language.
    suggestion: Expand MCP and gloss only the names needed for the first database exchange before introducing the rest.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | Wherever it runs, the server is the program that provides context. | 1'
    category: dead_words
    disposition: fix
    note: |
      "Wherever it runs" is throat-clearing, and "the server is the program that provides context" is a definite-article equation. The same abstraction stack returns in "The data layer defines message structure and semantics.", "The transport layer abstracts communication details from the protocol layer, enabling the same JSON-RPC 2.0 message format across all transport mechanisms.", and "On the server side, primitives carry actions, context, or interaction templates: tools are executable functions, resources are data sources, and prompts are reusable templates." The prose names layers and properties where a concrete exchange would do more work.
    suggestion: Tie the boundary to one concrete request and drop the universal and definite-article framing.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | Change notifications are opt-in. | 1'
    category: dead_words
    disposition: fix
    note: |
      Short, portentous declarations punctuate the inventory: "Every server must implement it.", "Discovery is optional.", "The response is typically cacheable.", "The message has no id.", and "Notifications are best effort." They read like status flags rather than sentences embedded in an explanation.
    suggestion: Fold each status fact into the request flow that gives it meaning.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | Sampling and logging are deprecated client primitives as of protocol version 2026-07-28. | 1'
    category: dead_words
    disposition: fix
    note: |
      The sequence "Sampling and logging are deprecated client primitives as of protocol version 2026-07-28.", "New implementations should integrate directly with LLM provider APIs.", "For logging, new STDIO implementations should write to stderr.", and "Other implementations should use OpenTelemetry." is a changelog with no reader in the room. It introduces policy and version status as an abstract list rather than explaining the protocol's interaction.
    suggestion: Tie each deprecation to the concrete client behavior the database example needs.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | Consider a database MCP server. | 1'
    category: passive
    disposition: fix
    note: |
      Ownerless or passive constructions repeatedly remove the actor: "Consider a database MCP server.", "Notifications can be used when no response is required.", "Return to the database server's next request.", "Sampling and logging are deprecated client primitives as of protocol version 2026-07-28.", "Under JSON-RPC, no response is expected.", and "The protocol gives no guarantee that every notification will be sent or received, especially across a transport reconnect." The client, server, or specification body is often the missing agent.
    suggestion: Name the acting side whenever it changes what the reader should implement.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | The same pattern extends beyond tools to the other primitives, keeping clients and servers synchronized in real time as their available capabilities change. | 1'
    category: weak_close
    disposition: fix
    note: |
      The close restates the notification pattern with "the same pattern" and ends on generic "capabilities change" language. It adds no new consequence, perspective, or question, despite the preceding caveats about best-effort delivery and reconnects.
    suggestion: End on the practical consequence of a missed notification and the polling fallback.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | The same pattern extends beyond tools to the other primitives, keeping clients and servers synchronized in real time as their available capabilities change. | 1'
    category: ai_phrasing
    disposition: fix
    note: |
      "Keeping clients and servers synchronized in real time" asserts a certainty the paragraph has not earned: it has just said notifications may be lost across reconnects and that clients should poll. The sentence smooths over that uncertainty in generic system language.
    suggestion: Let the best-effort and polling caveats govern the final claim.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | This makes MCP stateless: each request stands on its own. | 1'
    category: ai_phrasing
    disposition: fix
    note: |
      The formula "This makes X: Y" turns one metadata detail into a system-level conclusion and states it as settled. The explanation has not earned "stateless" or the accompanying idiom.
    suggestion: Qualify the claim and spell out which state is carried between requests.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | This makes MCP stateless: each request stands on its own. | 1'
    category: cliche
    disposition: fix
    note: |
      "Stands on its own" is a familiar idiom that does not make the request-state relationship visible.
    suggestion: Describe the concrete request lifecycle instead of using the idiom.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | This design allows listings to be dynamic. | 1'
    category: dead_words
    disposition: fix
    note: |
      "This design allows listings to be dynamic" is a restating summary. "Dynamic" names no event, timing, or observable client behavior.
    suggestion: State what can change and when the client observes that change.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | Consider a database MCP server. | 1'
    category: weak_opening_sentence
    disposition: fix
    note: |
      "Consider..." is a throat-clearing invitation rather than a first sentence that gives the reader the article's problem or payoff.
    suggestion: Make the first sentence state what the database server enables or reveals.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | MCP in a Nutshell | 1'
    category: cliche
    disposition: fix
    note: |
      "In a Nutshell" is a stock frame that contributes no mechanism or point of view.
    suggestion: Title the exchange or boundary the article actually explains.
  scores:
    voice: 1
    sentence_variety: 1
    economy: 2
  notes: 'I heard a protocol inventory assembled from evenly weighted declaratives: the database example briefly opens a door, then the prose turns into a system speaking. Changes are required because the piece has no sustained human voice, a blocking sentence pattern, and a close that overstates synchronization.'
