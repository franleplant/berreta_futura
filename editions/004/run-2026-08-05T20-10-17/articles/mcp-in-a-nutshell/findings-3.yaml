  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | For logging, new STDIO implementations should write to stderr, while other implementations should use OpenTelemetry. | 1'
    repair_from: '- | For logging, new STDIO implementations should write to stderr, while other implementations should use OpenTelemetry. | 1'
    category: qualification_loss
    disposition: fix
    note: |
      The extraction limits both recommendations to new implementations: "New implementations should log to stderr (stdio transport) or use OpenTelemetry." The manuscript drops "new" for the non-STDIO branch, broadening the recommendation to existing implementations.
  scores:
    claim_support: 4
    qualification_survival: 4
    quote_accuracy: 5
    attribution: 5
  notes: |
    I checked the title, byline, and every body assertion against the complete pinned extraction; this piece has no captions, pull quotes, key-idea boxes, glossary entries, or cheat-sheet lines to check. The logging sentence broadens a source-limited recommendation.
