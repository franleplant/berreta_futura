shape:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | Tool availability can change while the conversation runs. | 1'
    repair_from: '- | Tool listings can change. | 1'
    category: missing_transition
    disposition: fix
    note: |
      The piece raises changing tool listings, detours through elicitation, deprecations, and Tasks, then returns to subscriptions without signaling the return. The reader must reconstruct why the earlier thread has reopened.
    suggestion: Move the subscriptions discussion directly after the mutable-tool-list point, then present elicitation, deprecations, and Tasks as the remaining optional features.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | Tool availability can change while the conversation runs. | 1'
    repair_from: '- | Tool listings can change. | 1'
    category: duplication
    disposition: fix
    note: |
      The premise appears twice: paragraph four says "Tool listings can change," and paragraph six says "Tool availability can change while the conversation runs." The second occurrence repeats the setup before advancing to the subscription mechanism.
    suggestion: State the mutable-list premise once and begin the subscription paragraph with its mechanism.
  scores:
    order: 3
    coherence: 3
    opening: 4
    ending: 4
  notes: |
    This piece moves from a database request through transport, discovery, tool calls, and optional runtime behavior, but its tool-list thread is split and restated.
craft:
  result: changes_required
  findings:
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | Start with a database request. | 1'
    category: weak_opening_sentence
    disposition: fix
    note: |
      The first line tells the reader how to begin instead of opening on the mechanism; the database request has no consequence until the next sentence.
    suggestion: Lead with the database server exposing the query tool rather than with an instruction.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | Start with a database request. | 1'
    category: passive
    disposition: fix
    note: |
      "Start with" is an ownerless imperative: no actor is named for the action, so the opening sounds like a procedure issued by nobody.
    suggestion: Name the actor who initiates the example.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | A remote server typically serves many clients over Streamable HTTP. | 1'
    category: jargon
    disposition: fix
    note: |
      "Streamable HTTP" arrives as a protocol-specific name before the reader sees what the transport does; the later POST and Server-Sent Events description is a delayed gloss.
    suggestion: Gloss Streamable HTTP when it first appears.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | Inside that connection, JSON-RPC 2.0 supplies the message format. | 1'
    category: no_voice
    disposition: fix
    note: |
      This is where I stop hearing a person: the second paragraph becomes an even inventory of formats, transports, and capabilities, with no human-scale actor or consequence.
    suggestion: Anchor the transport paragraph in one concrete message exchange.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | If the client asks for an unsupported version, the server returns an error listing the versions it accepts. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Three sentences use the same "If X, Y" construction: "If the client asks for an unsupported version, the server returns an error listing the versions it accepts.", "If the database server needs more information or confirmation before running a query, it can request it with `elicitation/create`.", and "If the client skips that poll, the model may continue with an old tool list." The conditional template is audible across the piece.
    suggestion: Keep the clearest conditional and recast the other two as direct consequences.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | To call one, the client passes that exact name to `tools/call` and supplies arguments matching the schema. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Three sentences use the same purpose-opener shape: "To call one, the client passes that exact name to `tools/call` and supplies arguments matching the schema.", "To get a language-model completion, a new server should integrate directly with a provider's API.", and "To hear about those changes, the client opens a long-lived `subscriptions/listen` stream and sends a `toolsListChanged: true` filter." The repeated procedural cadence is conspicuous in a piece this compact.
    suggestion: Recast the later two purpose-openers as continuations of their preceding sentences.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | The protocol marks sampling and logging as deprecated client primitives as of protocol version 2026-07-28. | 1'
    category: dead_words
    disposition: fix
    note: |
      This reads like a changelog entry: "deprecated client primitives" and a version date arrive without explaining the practical change the reader should understand.
    suggestion: State the practical replacement before the deprecation date.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | For logging, new STDIO implementations should write to stderr, while other implementations should use OpenTelemetry. | 1'
    category: jargon
    disposition: fix
    note: |
      "OpenTelemetry" arrives as implementation jargon with no explanation of what role it plays in logging.
    suggestion: Gloss OpenTelemetry as the telemetry system used for logging.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | The same subscription pattern can cover the other primitives. | 1'
    category: dead_words
    disposition: fix
    note: |
      "The same subscription pattern" and "the other primitives" stack abstractions and make a general claim without an example; the sentence mostly restates reusability.
    suggestion: Name one concrete non-tool subscription in place of 'other primitives'.
  scores:
    voice: 3
    sentence_variety: 2
    economy: 3
  notes: |
    I heard a concrete first paragraph give way to an even protocol inventory, with procedural transitions and unexplained implementation shorthand. Changes are required for the loss of voice, repeated sentence templates, and reader-facing gaps in the jargon and deprecation material.
