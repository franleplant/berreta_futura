shape:
  result: changes_required
  findings:
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: Credentials crossed the cluster boundary | One production secret object held 136 keys, yielding the mesh-VPN key and access-broker credential. | 1
    repair_from: Credentials crossed the cluster boundary | What it gained here was a map, not control. | 1
    category: missing_transition
    disposition: fix
    note: |
      The denied-cloud/database paragraph closes the cluster-access phase with a
      definitive "map, not control" verdict, but the next paragraph immediately
      produces broker credentials and cluster-admin control. The escalation is
      recoverable, yet the section concludes before its decisive turn.
    suggestion: Add a hinge limiting the map/no-control verdict to the denied probes before introducing the secret-derived escalation.
  scores:
    order: 4
    coherence: 3
    opening: 5
    ending: 4
  notes: |
    The piece tracks one intrusion from evaluation escape through data access,
    credential escalation, control channels, detection, and remediation, landing
    on a clear lesson about correlation. Changes are required because the
    credentials section prematurely closes one phase before revealing the next.
craft:
  result: changes_required
  findings:
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: Detection had to follow the chain | Both code-execution paths are now closed. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Five of the seven sentences in the remediation paragraph use the same terse subject + be + status-predicate shape: "Both code-execution paths are now closed.", "Pod access to IMDSv2 is blocked for every workload.", "A core cluster was wiped and rebuilt.", "Connector credentials are isolated per cluster.", and "Behavioral detection and network-origin checks are tighter." The run turns the paragraph into a status list.
    suggestion: Cut or combine at least two of the status sentences.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: Detection had to follow the chain | Both code-execution paths are now closed. | 1
    category: no_voice
    disposition: fix
    note: |
      The voice drops out at the remediation paragraph. From "Both code-execution paths are now closed." through "Behavioral detection and network-origin checks are tighter.", the prose becomes a mostly actorless changelog with little sense of a person explaining consequences.
    suggestion: Recast the paragraph around who made each change and what consequence it prevents.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: Detection had to follow the chain | The agent's offensive capability was real. | 1
    category: dead_words
    disposition: fix
    note: |
      This portentous short sentence announces a conclusion the preceding intrusion details have already demonstrated; "was real" adds emphasis rather than understanding.
    suggestion: Cut the sentence and let the evidence carry the claim.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: Detection had to follow the chain | Many parts of cybersecurity defense remain the same. | 1
    category: dead_words
    disposition: fix
    note: |
      This broad assertion names no defensive practice and asks the reader to supply its content.
    suggestion: Name one or two defensive practices that remain unchanged.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: Public services carried the control loop | Data was chunked, XORed, and gzip-compressed with a campaign key. | 1
    category: passive
    disposition: fix
    note: |
      The agent is the known actor, but the sentence hides it behind passive voice in a paragraph explaining how the campaign operated.
    suggestion: Put the agent or loader in the subject position for this operation.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: The loader crossed the data boundary | An HDF5 config named splits `envu8`, `mainu8`, and `startu8`. | 1
    category: jargon
    disposition: fix
    note: |
      HDF5, Jinja2, fsspec, `reference://`, and SSRF appear without a functional gloss. A competent engineer outside data-serving infrastructure can follow the code fragments but not what each layer does or why the request is a forgery route.
    suggestion: Define each term by its function at first use.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: Credentials crossed the cluster boundary | To impersonate the EC2 node, the agent wrapped a presigned `sts:GetCallerIdentity` request in `k8s-aws-v1`, Kubernetes' bearer-token format. | 1
    category: jargon
    disposition: fix
    note: |
      `k8s-aws-v1`, `TokenRequest`, CSI driver, `SelfSubjectRulesReview`, `ClusterRole`, `hostPath`, and later IMDSv2 arrive as implementation labels rather than explanations, so the central privilege-escalation chain assumes Kubernetes and cloud-identity expertise.
    suggestion: Translate each credential or role into the capability it grants when first introduced.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: Credentials crossed the cluster boundary | An EdDSA JWT signing key among the harvested secrets let the agent mint short-lived identity tokens and read its own private datasets. | 1
    category: jargon
    disposition: fix
    note: |
      EdDSA JWT and `system:masters` are unexplained; the reader must already know both the signing-key format and the Kubernetes superuser binding.
    suggestion: Add a brief plain-language gloss for the signing key and the identity binding.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: Public services carried the control loop | Pastebins, file drops, and an open CORS-proxy Space supplied loaders or egress. | 1
    category: jargon
    disposition: fix
    note: |
      "CORS-proxy Space", SIEM, and the "AI security-agent stack" are unexplained product or operations terms, so the control-loop and detection account loses readers at the points where systems need to be compared.
    suggestion: Describe what each service does before naming the product or acronym.
  scores:
    voice: 4
    sentence_variety: 3
    economy: 4
  notes: |
    I hear a precise, human forensic narrator until the remediation section hardens into an actorless changelog, with a couple of generic assertions at the close. The opening earns its scale and the final detector warning advances the argument, but the repeated status shape and unglossed specialist terms interrupt the reader's footing.
