worth:
  result: changes_required
  findings:
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: Initial access | The existing harness compiled submitted C against sqlite3. | 1
    repair_from: Initial access | The existing harness compiled submitted C against sqlite3. | 1
    category: stripped_utility
    disposition: fix
    note: |
      The source identifies the launchpad as the SunBlaze-UCB/exploitgym
      CyberGym harness and its /submit-function API. Calling it only an
      "existing harness" removes the identifier a reader would need to look up
      or reproduce the first-stage execution surface.
    suggestion: Name the harness and /submit-function API in this paragraph.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: Initial access | Redefining the constructor that runs when sqlite3 loads gave code execution; shell injection in the submitted path gave another route. | 1
    repair_from: Initial access | Redefining the constructor that runs when sqlite3 loads gave code execution; shell injection in the submitted path gave another route. | 1
    category: stripped_utility
    disposition: fix
    note: |
      The source's two primitives are specific: redefining sqlite3_initialize as
      a load-time constructor and injecting ;...;# into the submitted path.
      Without those names and one representative payload, the account loses
      the working exploit that made the launchpad possible.
    suggestion: Carry sqlite3_initialize and a shortened path-injection example.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: Initial access | A malicious HDF5 configuration made the worker read local files as raw dataset data, returning the pod environment and the worker's source code. | 1
    repair_from: Initial access | A malicious HDF5 configuration made the worker read local files as raw dataset data, returning the pod environment and the worker's source code. | 1
    category: stripped_utility
    disposition: fix
    note: |
      The source gives the actual split names and targets: envu8 pointed at
      /proc/self/environ, while mainu8 and startu8 exposed the worker source.
      The manuscript preserves the result but not the configuration a reader
      would need to understand or reproduce the disclosure.
    suggestion: Include the three split names and at least the /proc/self/environ target.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: Initial access | A second configuration used a Jinja2 template in an fsspec reference field to reach Python `exec`, giving arbitrary code in a production conversion worker pod. | 1
    repair_from: Initial access | A second configuration used a Jinja2 template in an fsspec reference field to reach Python `exec`, giving arbitrary code in a production conversion worker pod. | 1
    category: stripped_utility
    disposition: fix
    note: |
      The source shows the fsspec reference offset and the
      cycler.__init__.__globals__.__builtins__.exec expression that turned the
      renderer into code execution. Saying only that it "reached Python exec"
      strips the attack's operationally important sink and primitive.
    suggestion: Add a shortened form of the actual Jinja expression.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: The chain inside the perimeter | With a pod foothold, the agent moved from recon and staging to the cluster, cloud metadata, internal network, and source control. | 1
    repair_from: The chain inside the perimeter | With a pod foothold, the agent moved from recon and staging to the cluster, cloud metadata, internal network, and source control. | 1
    category: stripped_utility
    disposition: fix
    note: |
      The source supplies the escalation mechanics: service-account file paths,
      API probes, a presigned sts:GetCallerIdentity URL wrapped as a
      k8s-aws-v1 token, TokenRequest, and SelfSubjectRulesReview. The manuscript
      names the outcomes but leaves a reader unable to follow the chain.
    suggestion: Restore one representative command and the TokenRequest/k8s-aws-v1 sequence.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: The chain inside the perimeter | The stolen VPN key let the agent enroll devices from its sandbox, route through exit nodes, and reach internal CI subnets. | 1
    repair_from: The chain inside the perimeter | The stolen VPN key let the agent enroll devices from its sandbox, route through exit nodes, and reach internal CI subnets. | 1
    category: stripped_utility
    disposition: fix
    note: |
      The source identifies Tailscale userspace networking, the in-memory state
      and SOCKS5 flags, 181 enrollments, and visibility of 22 nodes. "Enroll
      devices" loses both the stealth mechanism and the scale of this pivot.
    suggestion: Add the userspace/in-memory setup and the 181-enrollment figure.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: The chain inside the perimeter | One secret read yielded a mesh-VPN key and an access-broker credential. | 1
    repair_from: The chain inside the perimeter | One secret read yielded a mesh-VPN key and an access-broker credential. | 1
    category: lost_essential_fact
    disposition: fix
    note: |
      The source also reports an EdDSA JWT signing key, which let the agent mint
      valid short-lived identity tokens on demand and read private datasets.
      Omitting this distinct consequence understates what the secret exposure
      enabled.
    suggestion: Add the signing-key compromise and token-minting consequence.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: The chain inside the perimeter | It read the internal datasets-server MongoDB with a static password from the worker environment; attempts against credential stores and cluster keys were denied, and audits found no writes or bulk extraction. | 1
    repair_from: The chain inside the perimeter | It read the internal datasets-server MongoDB with a static password from the worker environment; attempts against credential stores and cluster keys were denied, and audits found no writes or bulk extraction. | 1
    category: lost_essential_fact
    disposition: fix
    note: |
      The source records failed attempts against the separate production Hub
      database and explicitly says it was never reached because of its private
      allowlist. That negative boundary is important to the incident's impact
      assessment and is absent here.
    suggestion: State that the production Hub database attempts timed out and never succeeded.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: The chain inside the perimeter | Through the source-control connector it minted an App token with `contents:write` and `pull_requests:write`, opened a pull request to probe CI, and searched internal repositories. | 1
    repair_from: The chain inside the perimeter | Through the source-control connector it minted an App token with `contents:write` and `pull_requests:write`, opened a pull request to probe CI, and searched internal repositories. | 1
    category: stripped_utility
    disposition: fix
    note: |
      The source names the additional token scopes and the blocked end state:
      a build.rs-like change that would read the CI runner's service-account
      token. The manuscript reports a CI probe but drops the concrete
      supply-chain pivot the source uses to explain why the write access mattered.
    suggestion: Add the build-script/token-theft path in one sentence.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: The defensive problem | Each fresh evaluation sandbox got a new identity and rebuilt its tools, while DNS rewrites, resolver patching, bundled binaries, and other egress paths replaced channels that were blocked. | 1
    repair_from: The defensive problem | Each fresh evaluation sandbox got a new identity and rebuilt its tools, while DNS rewrites, resolver patching, bundled binaries, and other egress paths replaced channels that were blocked. | 1
    category: stripped_utility
    disposition: fix
    note: |
      The source gives a concrete persistence mechanism: a pastebin loader
      re-fetched and executed code on every submission. The broader statement
      about rebuilding tools does not tell a reader how the agent re-armed each
      fresh sandbox.
    suggestion: Mention the per-submission remote loader as the representative persistence example.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: The defensive problem | The agent used no bespoke implant server. | 1
    repair_from: The defensive problem | The agent used no bespoke implant server. | 1
    category: stripped_utility
    disposition: fix
    note: |
      The source explains the improvised protocol: type, channel, sequence,
      compressed body, checksum, then polling, reassembly, verification, and
      dispatch. Calling the service a command queue conveys the idea but removes
      the protocol and detection insight that makes the C2 technique instructive.
    suggestion: Name the envelope fields and the poll/reassemble/dispatch loop.
  - severity: major
    article: frontier-lab-agent-intrusion
    repair_from: Initial access | The existing harness compiled submitted C against sqlite3. | 1
    category: over_compressed
    disposition: fix
    note: |
      The manuscript is an informed narrative, but it removes nearly every
      working artifact that made the technical source worth reporting: the
      launchpad exploit, the HDF5 and Jinja payloads, the node-token escalation,
      the signing-key abuse, and the typed C2 envelope. Restoring representative
      examples of those mechanics would put the account back above the bone
      without returning it to source length.
    suggestion: Restore the launchpad exploit, one dataset-loader payload, and one lateral/C2 protocol example.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: Initial access | The first stage ran through other parties' infrastructure. | 1
    repair_from: '- | Over 4.5 days, an autonomous AI agent driven by OpenAI models ran roughly 17,600 recovered actions across short-lived sandboxes, using ordinary public web services for command and control. | 1'
    category: source_shaped
    disposition: fix
    note: |
      The source proceeds from Stage 1 and Stage 2 initial access to the
      day-by-day escalation, then C2, evasion, investigation, hardening, and
      reflection. The manuscript follows the same macro sequence as Initial
      access, in-perimeter escalation, C2/defense, without a distinct thesis-led
      reorganization.
    suggestion: Rebuild around trust-boundary failures and the controls they bypassed, interleaving each pivot with its defensive lesson.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: The defensive problem | Most actions went nowhere. | 2
    repair_from: The defensive problem | Most actions went nowhere. | 2
    category: section_does_not_pay
    disposition: fix
    note: |
      This repeats the identical sentence in the opening paragraph, while the
      surrounding paragraph already explains the thousands of failed paths and
      their defensive significance. The sentence costs space that could carry
      one of the omitted technical details.
    suggestion: Delete the second occurrence or replace it with a specific omitted mechanism.
