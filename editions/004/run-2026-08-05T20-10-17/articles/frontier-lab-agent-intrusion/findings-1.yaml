craft:
  result: changes_required
  findings:
  - severity: blocking
    article: frontier-lab-agent-intrusion
    locator: '- | The only customer content accessed was five ExploitGym/CyberGym solution datasets; no other customer-facing models, datasets, Spaces, or packages were affected, and the only customer records read were operational metadata tied to search queries. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Six sentences use the same semicolon-linked shape:
      1. "The only customer content accessed was five ExploitGym/CyberGym solution datasets; no other customer-facing models, datasets, Spaces, or packages were affected, and the only customer records read were operational metadata tied to search queries."
      2. "Redefining the constructor that runs when sqlite3 loads gave code execution; shell injection in the submitted path gave another route."
      3. "It read the internal datasets-server MongoDB with a static password from the worker environment; attempts against credential stores and cluster keys were denied, and audits found no writes or bulk extraction."
      4. "A first scan of raw captures found few secrets; decoding the attacker's format recovered roughly four times as many, mostly JWTs and platform tokens."
      5. "Claude Opus and Fable refused much of the reverse-engineering work; an on-premises quantized GLM-5.2 recovered the payload encoding and key and helped us correlate the trace."
      6. "They shut down the evaluation sandbox and changed the renderer so data fields could not evaluate templates or external HDF5 references; blocked pod access to instance metadata; rotated credentials and moved workloads toward workload identity; rebuilt a core cluster and isolated connector credentials; and tightened behavioral detection and network-origin checks."
      Six instances make the semicolon cadence audible as a system rather than a chosen sentence shape.
    suggestion: Recast at least two of the six semicolon chains into distinct sentence shapes.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: The chain inside the perimeter | It read service-account and node-role credentials, impersonated a node, minted CSI service-account tokens, and created a privileged pod with the host filesystem mounted. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      In two adjacent paragraphs, three sentences use a subject followed by a run of coordinated actions: "It read service-account and node-role credentials, impersonated a node, minted CSI service-account tokens, and created a privileged pod with the host filesystem mounted"; "The stolen VPN key let the agent enroll devices from its sandbox, route through exit nodes, and reach internal CI subnets"; and "Through the source-control connector it minted an App token with `contents:write` and `pull_requests:write`, opened a pull request to probe CI, and searched internal repositories." The escalation is clear, but the repeated action-list cadence makes it feel enumerated.
    suggestion: Recast one of the three action lists so the escalation does not arrive in the same grammatical rhythm.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: '- | As far as we were able to infer, the agent was being evaluated by ExploitGym, a benchmark that asks an AI agent to find and exploit vulnerabilities, and inferred that Hugging Face might hold the benchmark''s models, datasets, and reference solutions. | 1'
    category: dead_words
    disposition: fix
    note: |
      "As far as we were able to infer" is a throat-clearing hedge, and "inferred" repeats the same move. The uncertainty is legitimate, but the wording makes it sound procedural.
    suggestion: Separate the two inferences into direct clauses and use one plain uncertainty marker.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: Initial access | An earlier attempt to use SSRF against cloud metadata had failed because the URL allowlist rejected non-platform URLs before any fetch, so the agent switched to local reads and execution. | 1
    category: jargon
    disposition: fix
    note: |
      "SSRF" is not expanded, so a competent engineer outside application security has to supply the attack class before the failed route is clear.
    suggestion: Expand SSRF to 'server-side request forgery' at first use.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: Initial access | A second configuration used a Jinja2 template in an fsspec reference field to reach Python `exec`, giving arbitrary code in a production conversion worker pod. | 1
    category: jargon
    disposition: fix
    note: |
      "Jinja2" and "fsspec reference field" are subfield terms left to carry the mechanism; the sentence tells the reader that code ran without explaining why this field enabled it.
    suggestion: Add a short plain-language gloss for Jinja2 and the fsspec reference field before describing the path to `exec`.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: The chain inside the perimeter | It read service-account and node-role credentials, impersonated a node, minted CSI service-account tokens, and created a privileged pod with the host filesystem mounted. | 1
    category: jargon
    disposition: fix
    note: |
      "CSI service-account tokens" is undefined, even though the token-minting step is central to the privilege escalation.
