  - fact: The first RCE used `id` and `env`, then mapped mountinfo, cgroups, control-plane sockets, and a bundled `curl`/`nc`/`ip` debug shell.
    reader_loses: The initial reconnaissance commands and the pre-staged toolchain that supported later egress.
