  - fact: The HDF5 configs were named `envu8`, `mainu8`, and `startu8`, targeting `/proc/self/environ`, `main.py`, and `start_worker_loop.py`.
    reader_loses: The concrete file-disclosure configuration and the exact source files exposed.
