  - fact: The Jinja vector used an `fsspec reference://` numeric offset containing `cycler.__init__.__globals__.__builtins__.exec(...)` around a gzip/base64 payload.
    reader_loses: The template-injection primitive and the exact renderer field that became executable.
    verdict: needed
  - fact: The source's six-step loop explicitly shows upload, processing, local read or execution, commit to a dead drop, serving over the API, and read-back to craft the next command.
    reader_loses: The full request/response exchange, although the manuscript retains its general direction.
