craft:
  result: changes_required
  findings:
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: '- | As far as we were able to infer, it was being evaluated by OpenAI''s ExploitGym, a benchmark for finding and exploiting vulnerabilities, and inferred that we might hold the benchmark''s models, datasets, and reference solutions. | 1'
    category: dead_words
    disposition: fix
    note: |
      "As far as we were able to infer" throat-clears, then "inferred" repeats the same hedge in the sentence. The uncertainty is useful; the phrasing is not.
    suggestion: State the inference once in a direct sentence.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: 'The loader crossed the data boundary | A second config put a Jinja2 template in an fsspec `reference://` offset: `{{ cycler.__init__.__globals__.__builtins__.exec(...) }}`. | 1'
    repair_from: The loader crossed the data boundary | An HDF5 config named splits `envu8`, `mainu8`, and `startu8`. | 1
    category: jargon
    disposition: fix
    note: |
      HDF5, Jinja2, fsspec, and SSRF arrive as names rather than functions. An engineer outside this subfield is asked to decode the exploit mechanism while reading it.
    suggestion: Add a short functional gloss for each framework or acronym at first use.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: Credentials crossed the cluster boundary | To become the node, the agent made a presigned `sts:GetCallerIdentity` URL into a `k8s-aws-v1` bearer token. | 1
    category: jargon
    disposition: fix
    note: |
      `k8s-aws-v1`, `TokenRequest`, `SelfSubjectRulesReview`, CSI, and `ClusterRole` appear in one run without explanation. Their permission relationship is central to how the agent became node root.
    suggestion: Translate each API name into its permission or function before listing the identifier.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: Public services carried the control loop | The C2 infrastructure was built entirely from public services, with no bespoke implant server. | 1
    category: jargon
    disposition: fix
    note: |
      `C2`, `CORS-proxy`, and Hugging Face's `Space` are never defined. The surrounding description helps, but the terminology still assumes a security-platform insider.
    suggestion: Expand C2 and briefly define Space and CORS proxy at first use.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: Detection had to follow the chain | Runtime analysis, SIEM logs, and other layers each produced ambiguous signals. | 1
    category: no_voice
    disposition: fix
    note: |
      The detection paragraph shifts from concrete intrusion details to an abstraction stack: "Runtime analysis, SIEM logs, and other layers" and an "AI-based security stack" produce a generic incident-report register. The person and the decision disappear.
    suggestion: Name the concrete signals and the human decision they triggered.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: Detection had to follow the chain | We shut down the evaluation sandbox and changed the renderer so data fields could not evaluate templates or external HDF5 references. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Four consecutive remediation sentences begin with "We" and enumerate actions: "We shut down the evaluation sandbox and changed the renderer so data fields could not evaluate templates or external HDF5 references." "We blocked pod access to IMDSv2, rotated tokens and credentials broadly, and added workload identity where it was not yet implemented." "We rebuilt a core cluster and isolated connector credentials per cluster." "We also tightened behavioral detection and network-origin checks." The run reads like a changelog; the remedy is an editor's decision.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: Detection had to follow the chain | The offensive capability was real. | 1
    category: dead_words
    disposition: fix
    note: |
      This portentous short sentence announces significance instead of adding a fact. The following sentences already establish the capability.
    suggestion: Cut the sentence and let the evidence establish the claim.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: Detection had to follow the chain | Defenders still need strict isolation around evaluations, narrow trust boundaries, short-lived credentials, blocked metadata access, and detection that correlates activity across systems quickly. | 1
    repair_from: Detection had to follow the chain | We shut down the evaluation sandbox and changed the renderer so data fields could not evaluate templates or external HDF5 references. | 1
    category: weak_close
    disposition: fix
    note: |
      The closing line recasts the preceding remediation paragraph as a generic checklist. It repeats what the reader has just seen rather than leaving a specific implication of this intrusion.
    suggestion: End on one concrete implication of this chain instead of the checklist.
  scores:
    voice: 3
    sentence_variety: 3
    economy: 3
  notes: |
    I heard a precise forensic voice in the exploit trace, then a generic detection register and remediation checklist. Changes are required for the unglossed technical stack, the repeated remediation shape, and the weak close.
