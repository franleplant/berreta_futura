mechanics:
  result: changes_required
  findings:
  - severity: major
    article: from-gpt2-to-kimi3
    locator: '- | ali works on inference at Baseten and studies engineering at the University of Waterloo. | 1'
    category: capitalisation
    disposition: fix
    note: |
      The author note begins with the lowercase name "ali". This is editor-written
      furniture, so the sentence-initial proper name must be capitalised.
    suggestion: Ali works on inference at Baseten and studies engineering at the University of Waterloo.
  - severity: major
    article: from-gpt2-to-kimi3
    locator: '- | The baseline model is about 124 million parameters. | 1'
    category: grammar
    disposition: fix
    note: |
      The copula "is" incorrectly makes "parameters" a complement of "model".
      Use a possessive verb to state the parameter count.
    suggestion: The baseline model has about 124 million parameters.
  - severity: major
    article: from-gpt2-to-kimi3
    locator: '- | Each block applies causal self-attention and an MLP through residual connections, then a final hidden state is mapped to vocabulary logits. | 1'
    category: punctuation
    disposition: fix
    note: |
      The comma before "then" joins two independent clauses without a
      coordinating conjunction.
    suggestion: Each block applies causal self-attention and an MLP through residual connections, and then a final hidden state is mapped to vocabulary logits.
  - severity: major
    article: from-gpt2-to-kimi3
    locator: '- | In essence, a fixed-capacity associative memory (fixed dimensions) needs an eviction policy, since a purely additive linear operation eventually adds interference once at capacity. | 1'
    category: grammar
    disposition: fix
    note: |
      The reduced clause "once at capacity" grammatically attaches to the
      additive operation, which is not the thing with a capacity. State the
      memory or state explicitly.
    suggestion: In essence, a fixed-capacity associative memory (fixed dimensions) needs an eviction policy, since a purely additive linear operation eventually adds interference once the memory reaches capacity.
  scores:
    grammar: 2
    typography: 4
    consistency: 4
  notes: |
    Changes required because the author note is uncapitalised, the parameter-count
    sentence uses the wrong predicate, one sentence contains a comma splice, and
    the closing capacity clause dangles. The opening number phrase reads as an
    intentional rhetorical fragment, so it is not filed.
