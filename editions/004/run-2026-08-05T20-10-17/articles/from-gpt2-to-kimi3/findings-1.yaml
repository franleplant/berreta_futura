craft:
  result: changes_required
  findings:
  - severity: minor
    article: from-gpt2-to-kimi3
    locator: '- | Twenty-two thousand five hundred and eighty. | 1'
    category: weak_opening_sentence
    disposition: fix
    note: |
      The opener is a standalone number; until the next sentence, the reader does not know what is being counted. It creates suspense by withholding the comparison rather than giving it a first foothold.
    suggestion: Put the comparison and its object in the first sentence.
  - severity: major
    article: from-gpt2-to-kimi3
    locator: '- | GPT-2 is a decoder-only architecture. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Five main clauses use the equation-shaped "X is Y" frame: "GPT-2 is a decoder-only architecture.", "That storage is the KV cache.", "The baseline model is about 124 million parameters.", "The trade-off is expressiveness.", and "The feature map is a less expressive approximation of the softmax kernel, so practical accuracy loss depends on the architecture and workload." Three are enough for a major repetition finding; the cadence makes the explanation sound catalogued. The shape is the author's own, so the remedy is editorial.
    suggestion: Recast at least two of the five equation-shaped sentences as clauses inside the surrounding mechanism.
  - severity: major
    article: from-gpt2-to-kimi3
    locator: '- | Each block applies causal self-attention and an MLP through residual connections, then a final hidden state is mapped to vocabulary logits. | 1'
    repair_from: '- | GPT-2 is a decoder-only architecture. | 1'
    category: jargon
    disposition: fix
    note: |
      The opening architecture paragraph stacks "decoder-only", "causal self-attention", "MLP", "residual connections", "hidden state", "vocabulary logits", and "autoregressive decoding" without defining them. A competent engineer outside this subfield must already know the vocabulary to reach the KV-cache point.
    suggestion: Add a plain-language gloss before introducing the transformer stack.
  - severity: major
    article: from-gpt2-to-kimi3
    locator: '- | Softmax attention applies its nonlinearity after the q·k product, coupling each query to every key. | 1'
    category: jargon
    disposition: fix
    note: |
      "q", "k", "ELU+1", "D×D", and "re-associable" arrive as notation rather than explained ideas. The paragraph's central claim about compressing memory is therefore gated by terminology a non-specialist cannot decode.
    suggestion: Define q and k as query and key vectors before using the notation.
  - severity: minor
    article: from-gpt2-to-kimi3
    locator: '- | At a high level, both methods make scores non-negative, divide by their sum, and compute a weighted average of values. | 1'
    category: dead_words
    disposition: fix
    note: |
      "At a high level" is throat-clearing; the three following verbs already state the comparison. It makes a precise mechanism sound like a summary of a summary.
    suggestion: Delete the 'At a high level' preface.
  - severity: minor
    article: from-gpt2-to-kimi3
    locator: '- | The trade-off is expressiveness. | 1'
    category: dead_words
    disposition: fix
    note: |
      "The trade-off is expressiveness" is a definite-article equation with an abstract noun; the next sentence carries the actual claim about accuracy loss.
    suggestion: State the concrete accuracy cost directly.
  - severity: minor
    article: from-gpt2-to-kimi3
    locator: '- | Gated MLA controls how much of each retrieved feature reaches the residual stream through element-wise multiplication with a gate projected from the input. | 1'
    category: jargon
    disposition: fix
    note: |
      The late architecture inventory assumes "macrocycle", "residual stream", "latent space", and "FLOPs" without explaining why those details matter. The acronyms are expanded, but the reader still gets a component list rather than a usable picture.
    suggestion: Add plain-language glosses for macrocycle and FLOPs at first use.
  - severity: minor
    article: from-gpt2-to-kimi3
    locator: '- | Scaling laws remain relevant, but capacity must be added in the right place and in a form the system can use. | 1'
    category: dead_words
    disposition: fix
    note: |
      The sentence stacks abstractions—"scaling laws", "capacity", "the right place", and "a form the system can use"—without naming an architectural choice. It smooths the transition but adds little beyond the concrete limitation in the next sentence.
    suggestion: Name the specific capacity placement the paragraph means.
  - severity: major
    article: from-gpt2-to-kimi3
    locator: '- | In essence, a fixed-capacity associative memory (fixed dimensions) needs an eviction policy, since a purely additive linear operation eventually adds interference once at capacity. | 1'
    category: weak_close
    disposition: fix
    note: |
      "In essence" introduces a restating summary. The fixed-capacity/interference claim has already appeared in "A finite cache must overwrite or combine with information already stored." and "Additive updates eventually interfere"; the final sentence repeats the premise instead of leaving a new implication.
    suggestion: End on the architectural consequence of periodic full-attention retrieval.
  scores:
    voice: 4
    sentence_variety: 2
    economy: 3
  notes: |
    I heard a technically confident synthesis that keeps memory concrete through a sustained store-and-forgetting metaphor, but the middle turns into equation-shaped cataloguing and assumes more specialist vocabulary than it earns; the final line repeats an earlier premise instead of opening a new perspective.
