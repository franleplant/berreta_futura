worth:
  result: changes_required
  findings:
  - severity: blocking
    article: from-gpt2-to-kimi3
    locator: '- | DeltaNet makes the write corrective. | 1'
    repair_from: '- | DeltaNet makes the write corrective. | 1'
    category: lost_operational_detail
    disposition: fix
    note: |
      The source scales DeltaNet's correction by a learned per-token write strength,
      beta = sigmoid(w_beta(x)). Only beta=1 gives exact replacement; smaller values
      interpolate with the existing state. Without that qualifier, the manuscript's
      claim that the old association is removed and the new one takes its place is
      misleading.
    suggestion: Name beta and explain that exact replacement occurs only at full write strength.
  - severity: major
    article: from-gpt2-to-kimi3
    locator: '- | KimiK3 keeps this memory system and adds other ways to retrieve and spend capacity. | 1'
    repair_from: '- | KimiK3 keeps this memory system and adds other ways to retrieve and spend capacity. | 1'
    category: lost_essential_fact
    disposition: fix
    note: |
      The source's KimiK3 account includes blockwise Attention Residuals every
      12 decoder layers, forming eight depth blocks across the 23 macrocycles.
      Learned query-key weights selectively retrieve earlier residual states,
      addressing residual dilution and hidden-state growth, with a stated
      latency/compute trade-off. Omitting AttnRes leaves out a central retrieval
      mechanism in the manuscript's own memory argument and makes the KimiK3
      description incomplete.
    suggestion: Add a concise AttnRes paragraph covering its frequency, selective depth retrieval, and purpose.
  - severity: major
    article: from-gpt2-to-kimi3
    repair_from: '- | The useful question is what each model does with memory: what it stores, how it updates that store, and how it retrieves information after the store fills. | 1'
    category: source_shaped
    disposition: fix
    note: |
      The manuscript's implicit sequence is scale/question, GPT-2 and KV cache,
      linear attention, DeltaNet, gating and Kimi Linear, KimiK3, conclusion.
      That is the source's retained subject order, even though the manuscript
      announces a memory lens. A faithful synthesis needs a distinct problem-led
      structure rather than the source's lineage spine.
    suggestion: Make store, update, forgetting, and retrieval the actual section architecture, with each model introduced under the limitation it solves.
  omissions:
  - fact: The GPT-2 code-level module map (wte/wpe embeddings, dropout, h block loop, ln_f, lm_head) and pre-LayerNorm residual order
    reader_loses: An implementation-level mapping from the prose to the source's shown baseline code; the conceptual pipeline remains.
    verdict: defensible
  - fact: 'The baseline dimensions: a 50,304 padded vocabulary from 50,257, 12 layers, 12 heads, and 768-dimensional embeddings'
    reader_loses: The concrete dimensions needed to reproduce the roughly 124M-parameter baseline, but not the memory argument.
    verdict: defensible
  - fact: The attention kernel's q/k/v head reshaping, 1/sqrt(d) scaling, causal mask, softmax, dropout, and output projection
    reader_loses: Low-level mechanics behind causal self-attention; no conceptual claim in the manuscript depends on them.
    verdict: defensible
  - fact: 'The source''s FlashAttention caveat: its 2020 release changed the materialized O(N²) picture, while older reference decoding often recomputed history without a KV cache'
    reader_loses: Historical complexity context and the distinction between training and uncached autoregressive implementations; the manuscript makes no contrary claim.
    verdict: defensible
  - fact: The decode traffic detail of two ND HBM reads and two 1D writes per step while the KV cache grows O(N)
    reader_loses: The quantitative reason bandwidth becomes the bottleneck; the manuscript still gives the directional explanation.
    verdict: defensible
  - fact: Linear attention's explicit cache pair (S, z), updates S += k @ v and z += k, and output normalization q @ S / (q @ z)
    reader_loses: The exact fixed-state recurrence and the separate normalizer vector, but the manuscript preserves the high-level attention contract.
    verdict: defensible
  - fact: DeltaNet's learned per-token write strength beta = sigmoid(w_beta(x)), scaling u = beta * (v - v_old)
    reader_loses: Without beta, the corrective write is incorrectly understood as an unconditional exact replacement rather than a partial update.
    verdict: needed
  - fact: The DeltaNet readback derivation (k @ k.T) v and the learned Q/K pointer interpretation
    reader_loses: Why key normalization recovers a stored value and how queries point to associations; the result is still stated.
    verdict: defensible
  - fact: 'The parallel-prefill treatment: DeltaNet''s reparameterized recurrence, chunkwise formulation, C=1 and C=N endpoints, typical C=64/128, UMMA, and the 2Ld^2 + 2LCd cost split'
    reader_loses: How corrective updates become hardware-efficient and how chunk size trades within-chunk work against state work; this is implementation context outside the memory-level thesis.
    verdict: defensible
  - fact: Mamba-2's explicit alpha * S_old + S_new update and Gated Delta's cumulative product of decay factors across timesteps
    reader_loses: The exact bounded-decay and multiplicative-prefix implementation, while the selective-versus-global forgetting distinction remains.
    verdict: defensible
  - fact: 'The historical hybrid step combining Gated DeltaNet with Mamba and Kimi Linear''s three named changes: interleaved MLA, MoE replacing the MLP, and the alpha projection'
    reader_loses: Lineage and an explicit checklist, though the surrounding progression covers the resulting mechanisms.
    verdict: defensible
  - fact: KimiK3's SiTU activation, including its tanh/beta gate formula, and the caveat that an unfused implementation is nearly 3x slower
    reader_loses: One activation change and its speed trade-off; neither is needed for the manuscript's memory thesis.
    verdict: defensible
  - fact: MLA query LoRA, the separate output-gating refinement, and the down/up projections around the shared experts
    reader_loses: The remaining low-level KimiK3 refinements needed for full reproduction, but not the progression being synthesized.
    verdict: defensible
  - fact: Blockwise Attention Residuals every 12 layers, with learned query-key mixing of earlier residual states, eight blocks, and the stated roughly 2% latency and 1.25x compute trade-off
    reader_loses: A central KimiK3 retrieval and capacity mechanism, including how it compensates for information lost by constant-state KDA.
    verdict: needed
  - fact: The source's final comparative claim that attention is the most effective selective-read mechanism
    reader_loses: The source's strongest justification for periodic MLA, though the manuscript still explains that MLA supplies full-context retrieval.
    verdict: defensible
  retentions:
  - passage: Twenty-two thousand five hundred and eighty. That's how many GPT-2 (2019) models fit inside KimiK3 (2026).
    costs: A short scale hook that establishes the seven-year and 22,580-to-one stakes; it earns its space.
    verdict: earns_place
  - passage: 'The useful question is what each model does with memory:'
    costs: One sentence that supplies the manuscript's organizing lens and gives the lineage a reason to be read.
    verdict: earns_place
  - passage: 'The MoE has 898 experts: two shared experts process every token'
    costs: A compact set of concrete capacity numbers that makes sparse routing legible.
    verdict: earns_place
  - passage: In essence, a fixed-capacity associative memory (fixed dimensions) needs an eviction policy
    costs: A restatement of the earlier finite-cache diagnosis; the sentence could instead carry the omitted AttnRes mechanism.
    verdict: cut
  notes: |
    Changes required because the DeltaNet paragraph overstates exact replacement, KimiK3 omits AttnRes, and the faithful synthesis follows the source's subject order.
    The two needed omissions are local repairs rather than evidence of piece-wide over-compression; the other cuts are defensible implementation or historical detail. The final eviction restatement is the only cut-worthy retention, so no section-level dead weight finding is needed. The manuscript has a real position in arguing that each capacity increase answers a concrete memory limitation, and it is shorter than its source.
evidence:
