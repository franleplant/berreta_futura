craft:
  result: changes_required
  findings:
  - severity: minor
    article: mcp-in-a-nutshell
    locator: A shared counter between the application and the service | A shared counter between the application and the service | 1
    category: dead_words
    disposition: fix
    note: |
      "Counter" is a decorative metaphor that does not map onto the protocol's connection or notification mechanism; the later heading repeats it without developing the image.
    suggestion: Use a literal heading naming the host, client, server, or tool-notification exchange.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: When the counter changes | This per-request design keeps the protocol's assumptions visible. | 1
    category: dead_words
    disposition: fix
    note: |
      "Keeps the protocol's assumptions visible" is an abstract, portentous claim that adds no concrete consequence after the preceding explanation.
    suggestion: Replace it with the specific operational consequence for request handling, or cut the sentence.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: A shared counter between the application and the service | The server means the program providing context, wherever that program runs. | 1
    category: dead_words
    disposition: fix
    note: |
      "The server means" is an awkward definitional phrase, and "wherever that program runs" repeats information already conveyed by the local and remote examples.
    suggestion: State the server's role directly and remove the redundant location clause.
  notes: |
    I heard a clear, technically grounded explainer whose voice briefly turns abstract in a few definitions and headings.
teaching:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: A shared counter between the application and the service | Every request carries enough information to stand on its own, while a separate transport carries the message. | 1
    repair_from: A shared counter between the application and the service | Every request carries enough information to stand on its own, while a separate transport carries the message. | 1
    category: missing_term
    disposition: fix
    note: |
      The source names MCP as stateless, but the explainer describes the behavior without
      giving readers that searchable term. A reader may understand that requests stand alone
      yet be unable to recognize or search for "stateless MCP."
    suggestion: Name and briefly define statelessness when explaining per-request metadata.
  - severity: minor
    article: mcp-in-a-nutshell
    category: missing_furniture
    disposition: fix
    note: |
      The edition supplies no explicit deck or standfirst, key ideas box, glossary,
      "try it in fifteen minutes" exercise, cheat sheet, or editors' diagram captions.
      These omissions leave the explainer without the supporting furniture specified for
      this edition.
    suggestion: Add the missing reader-support furniture, or explicitly declare which items are intentionally absent.
  notes: |
    A first-time reader came away able to explain MCP's host/client/server arrangement,
    its two protocol layers, its primitives, and the basic discovery, invocation, and
    notification flow, but not the searchable term "stateless" and without the expected
    supporting furniture.
    1 central claim: correct, cites "An AI application can discover a".
    2 mechanism: correct, cites "The connection has two layers. The data".
    3 number or stated limit: correct, cites "MCP calls these offerings primitives: tools".
    4 term: correct, cites "The application is the MCP host.".
    5 operational, list a server's tools: correct, cites "Next the client sends `tools/list`. The server".
    6 operational, subscribe to tool-list changes: correct, cites "A client that wants updates opens".
