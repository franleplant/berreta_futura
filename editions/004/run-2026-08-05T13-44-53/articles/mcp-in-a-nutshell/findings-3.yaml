  notes: |
    Checked every assertion in the manuscript against the pinned extraction: statelessness
    and _meta-field design, server/discover as optional discovery, transport layers and
    JSON-RPC 2.0, the three primitives (tools, resources, prompts) and their discovery
    lifecycle, the two server-to-client primitives with sampling and logging deprecated
