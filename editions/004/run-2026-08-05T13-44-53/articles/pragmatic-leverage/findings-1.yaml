shape:
  result: changes_required
  findings:
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | If you draw this out, there's an inverse relationship between effort invested up front and expected pain. | 1
    repair_from: The 80/20 rule in AI coding leverage | If you draw this out, there's an inverse relationship between effort invested up front and expected pain. | 1
    category: missing_transition
    disposition: fix
    note: |
      The piece explains the inverse relationship between planning effort and rework pain, then jumps to "what you don't want to do" without articulating the principle that connects them: match planning investment to the pain it eliminates. Without this bridge, the advice to avoid over-planning seems to contradict the earlier point that planning reduces pain.
    suggestion: 'After the inverse-relationship sentence, insert an explanation of the strategic principle: identify tasks where planning delivers high value in pain reduction, and invest accordingly. This connects the analysis to the pragmatic planning advice that follows.'
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | good luck. | 1
    repair_from: '- | good luck. | 1'
    category: ending
    disposition: fix
    note: |
      The piece stops with a dismissal rather than concluding. The piece builds to an insight about multi-phase planning with steering at each phase, and that needs to land as a conclusion that reinforces the thesis about where leverage comes from.
    suggestion: Replace 'good luck.' with a substantive closing that ties back to the opening, such as reinforcing that leverage is in the intelligence applied to planning, not in code-writing speed.
  - severity: minor
    article: pragmatic-leverage
    locator: '- | Seeking Leverage | 1'
    repair_from: '- | Seeking Leverage | 1'
    category: heading_not_a_claim
    disposition: fix
    note: |
      The heading names a topic rather than the claim of the section, which is that planning and alignment—not code writing—is where AI leverage actually comes from.
    suggestion: Retitle to a claim-based heading such as 'The Leverage Is in Planning' or 'Why Code Writing Isn't the Bottleneck'.
  - severity: minor
    article: pragmatic-leverage
    locator: '- | The 80/20 rule in AI coding leverage | 1'
    repair_from: '- | The 80/20 rule in AI coding leverage | 1'
    category: heading_not_a_claim
    disposition: fix
    note: |
      The heading names a concept rather than the argument of the section. The section argues that the effort-pain tradeoff requires pragmatic allocation of planning effort to maximize pain reduction per task.
    suggestion: Retitle to a claim-based heading such as 'Match Planning Effort to Impact' or 'Where Planning Investment Pays Off'.
  scores:
    order: 2
    coherence: 2
    opening: 3
    ending: 1
  notes: |
    The piece contains a sound argument about pragmatic planning for AI leverage, but the flow is broken by a missing transition between analysis and application. The jump from explaining the effort-pain tradeoff to advising against over-planning lacks the connecting principle, and the ending does not land. Headings name topics and concepts rather than the claims their sections assert.
craft:
  result: changes_required
  findings:
  - severity: blocking
    article: pragmatic-leverage
    locator: Seeking Leverage | If you're only using AI to write | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Six conditional sentences—all opening with "if/If" and presenting a condition-consequence structure—appear across roughly 480 words. They occur at: "If you're only using AI to write the code, then you're taking...", "But if you use AI to help you plan and align, then you actually get closer...", "Lets assume if you yolo a two-sentence prompt...", "If you draw this out, there's an inverse relationship...", "if you've done some work at the Product level...", and "If you're doing multiple phases of planning...". The reader hears the pattern before the argument. This exact finding appeared in Edition 004. The remedy is an editor's: cut two of these sentences, restructure to vary the shape, or reconsider the piece.
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | good luck. | 1
    category: weak_close
    disposition: editor_decision
    note: |
      The closing line is a sign-off, not a sentence that passes the Final Editing Test. It leaves the reader with neither clarity, perspective, nor curiosity about what precedes it. The piece would close stronger with a final sentence that reframes the central insight or poses a lingering question.
  scores:
    voice: 4
    sentence_variety: 1
    economy: 4
  notes: |
    Dex's voice is sharp throughout—honest and conversational in exactly the way faithful_edit should sound. But the piece relies on one sentence shape six times, and "good luck" at the end is too thin a closing line.
