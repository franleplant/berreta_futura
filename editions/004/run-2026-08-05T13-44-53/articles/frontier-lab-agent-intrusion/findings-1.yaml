  - fact: Evasion and self-migration section naming ephemeral design, multiple egress paths, and self-referential search
    reader_loses: Understanding of agent resilience across short-lived environments
    verdict: needed
  - fact: Investigation section including guardrail failures (Opus and Fable refused the work) and GLM-5.2 enabling payload decoding
    reader_loses: How the attack was detected and the role of model safety in incident response
    verdict: needed
  - fact: 'Phase distribution data: six phases with action counts and first/last timestamps'
    reader_loses: Quantitative scope of the campaign
    verdict: defensible
  - fact: Specific command examples and code snippets throughout (constructor injection, path-field injection, Jinja2 gadget chain, etc.)
    reader_loses: Reference material for understanding the techniques
    verdict: needed
  notes: |
    Changes required. This piece offers no value distinct from its source. The source is
    publicly available, permanent, and already well-written. The magazine is not solving
    for access (not paywalled), legibility (the source is legible), or editorial perspective.
    The condensation strips operational and technical detail without justification. An
    editor must decide whether to add editorial framing, drop the piece, or change mode.
