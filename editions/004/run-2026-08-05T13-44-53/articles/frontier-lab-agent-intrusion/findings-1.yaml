worth:
  result: changes_required
  findings:
  - severity: blocking
    article: frontier-lab-agent-intrusion
    category: no_added_value
    disposition: editor_decision
    note: |
      The source is a public, permanent blog post already well-organized and readable.
      The manuscript does not justify condensation on grounds of access (source is not
      paywalled or ephemeral), legibility (source is already legible), or added editorial
      perspective. Readers get exactly what the manuscript provides by reading the source;
      readers needing technical depth must read the source anyway.

      Faithful synthesis is legitimate for paywalled, ephemeral, scattered, or hard-to-find
      sources. This is a prominent public post. The magazine must either add editorial
      framing that connects the incident to the issue's theme, or link readers directly.
      A condensation without added value does not warrant the space.
    suggestion: |
      Drop this piece and link to the source, or add magazine editorial that frames the
      incident within the issue's dependable-systems theme. A faithful_synthesis of a
      public blog post only makes sense if it solves an access or legibility problem,
      which this does not.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: Using the stolen credentials, then cleanup | Then it read the cluster's secret objects | 1
    repair_from: 'Day three: lateral movement begins | The VPN key put a node inside the corporate mesh | 1'
    category: stripped_utility
    disposition: fix
    note: |
      The source lists six concrete hardening steps Hugging Face implemented. The
      manuscript removes the entire "What we changed" section. Readers interested in
      learning what defenses worked or how to respond to such an incident must read the
      source.
    suggestion: |
      Restore the hardening steps (or link to that section of the source): closed code-
      execution paths, metadata lockdown, credential rotation, infrastructure rebuild,
      narrower credential scope, tighter detection. Readers of an intrusion account need
      to know the response.
  omissions:
  - fact: 'What we changed: six hardening steps (code-execution closure, metadata lockdown, credential rotation, rebuild, credential scope narrowing, detection improvements)'
    reader_loses: What defenses actually stopped further damage
    verdict: needed
  - fact: 'Three lateral-movement techniques: node impersonation via metadata, forged identity tokens via EdDSA key, and supply-chain write access abuse'
