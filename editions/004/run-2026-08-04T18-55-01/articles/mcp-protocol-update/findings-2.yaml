    Verified all factual claims, numbers, dates, versions, SEP citations, technical terms, and three quotations against the source extraction. All assertions are supported by the source text. Qualifications about breaking changes, deprecation timelines, and the extension framework are preserved. No invented claims, missing numbers, transposed facts, or accuracy issues found. The synthesis accurately represents the protocol changes, technical procedures, governance framework, and timeline from the source.
mechanics:
  result: changes_required
  findings:
  - severity: major
    article: mcp-protocol-update
    locator: An extension gets its own name, repository, and version number | identified by a reverse-DNS ID, negotiated through an extensions map in client and server capabilities, lives in its own ext-* repository under its own maintainers, and versions independently | 1
    category: grammar
    disposition: fix
    note: |
      The list of extension characteristics has broken parallelism. 'identified' and 'negotiated' are passive participles; 'lives' is an active verb; and 'versions' is neither clearly passive nor active as written. All items in the list following 'is' must match grammatically. Either all should be passive participles (identified, negotiated, placed, versioned) or all active verbs with matching mood.
    suggestion: an extension is identified by a reverse-DNS ID, negotiated through an extensions map in client and server capabilities, placed in its own ext-* repository under its own maintainers, and versioned independently of the specification
  scores:
    grammar: 3
    typography: 5
    consistency: 4
  notes: |
    One broken parallelism in a list of extension characteristics. Otherwise clean on grammar, spelling, and typography.
