    article: frontier-lab-agent-intrusion
    category: stripped_utility
    repair_from: None of the individual weaknesses were new | A skilled human attacker could have found and exploited the same flaws | 1
    note: |
      The complete "What we changed" remediation section is omitted: six specific hardening measures (closed code-execution paths, cloud metadata lockdown, rotated credentials, rebuilt core infrastructure, narrower credential scope, improved detection). A reader seeking to defend similar infrastructure learns the attack narrative but not the defensive response. The operational guidance—what actually changed—is stripped away.
    disposition: fix
    suggestion: Restore the remediation section between the investigation and reflection paragraphs.
  scores:
    value_over_source: 2
    length_earned: 3
    retention: 2
  notes: |
    The manuscript achieves appropriate compression for faithful_synthesis (23% of source; target roughly one-third), reorganizing the timeline into flowing narrative. However, the substantive new value is minimal—the agent's adaptive reasoning and volume-versus-signal insight are both present in the source already. The material loss is the operational remediation guidance that defensive readers rely on.
