shape:
  result: changes_required
  findings:
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | You need to do this without overindexing on questions you won't be able to answer without going down a level | 1
    repair_from: The 80/20 rule in AI coding leverage | What you don't want to do is spend 6 hours planning a task for which you could have eliminated 80% of the expected pain in the first 10 minutes | 1
    category: orphan_referent
    disposition: editor_decision
    note: |
      The pronoun "this" in "You need to do this" has an ambiguous antecedent—it could refer to "not spending 6 hours" (prior sentence) or to the desired behavior of planning strategically. The reader must backtrack to clarify. A prior pass identified this and chose not to add a bridging sentence because that would require new prose, which faithful_edit forbids.
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | For example, if you've done some work at the Product level and have not answered all the open questions yet, it's possible you may need to end it where you are and zoom down a level to the technical details to understand what's feasible | 1
    repair_from: The 80/20 rule in AI coding leverage | You need to do this without overindexing on questions you won't be able to answer without going down a level | 1
    category: argument_order
    disposition: editor_decision
    note: |
      A framework example (Product level / technical details) appears before the framework itself is named (50kft view / 10kft view). The piece implies these refer to the same model but does not explicitly state it, leaving the reader uncertain which framework the example illustrates. A prior pass identified this and noted that reordering would require moving source author's sections, which faithful_edit forbids.
  - severity: major
    article: pragmatic-leverage
    locator: '- | good luck | 1'
    repair_from: '- | you want to do a little bit of steering at each phase to ensure you are eliminating as much expected pain as possible | 1'
    category: ending
    disposition: fix
    note: |
      The final sentence, "good luck.", is a casual dismissal rather than a landing. The substantive conclusion (steering at each phase) is complete in the prior sentence. The piece stops rather than lands.
  - severity: minor
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | The 80/20 rule in AI coding leverage | 1
    repair_from: The 80/20 rule in AI coding leverage | The 80/20 rule in AI coding leverage | 1
    category: heading_not_a_claim
    disposition: fix
    note: |
      The heading "The 80/20 rule in AI coding leverage" labels the topic rather than naming the section's argument. It could better name the claim about the inverse relationship between planning effort and rework pain.
  scores:
    order: 3
    coherence: 3
    opening: 4
    ending: 2
  notes: |
    The argument progresses coherently from planning leverage through the effort-pain trade-off to multi-level steering, but framework introduction is out of order, a key pronoun is ambiguous, and the ending is abrupt.
craft:
  result: approved
  findings: []
  scores:
    voice: 5
    sentence_variety: 4
    economy: 4
  notes: |
    Consistent personal voice with enough character (yolo, downloaded into your head, good luck) that it reads as a person thinking through a problem. The worked example builds conceptually with varied sentence structures. No deadwood, hedging, or system-generated phrasing. The density increases slightly when handling multiple planning abstractions, but the syntax stays clean and every sentence does work.
