shape:
  result: changes_required
  findings:
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | You need to do this without overindexing on questions you won't be able to answer without going down a level. | 1
    repair_from: The 80/20 rule in AI coding leverage | If you draw this out, there's an inverse relationship between effort invested up front and expected pain. | 1
    category: missing_transition
    disposition: fix
    note: |
      The section transitions from the inverse relationship (effort up front reduces pain) to a warning against over-planning, then to "you need to do this without overindexing." The connector is missing: "you need to do this" has no clear antecedent. The reader understands the pieces separately but not how they fit together.
    suggestion: 'Bridge the trade-off to the practice: ''To navigate this trade-off, find where additional planning stops reducing expected pain—and don''t go deeper. You can do this without overindexing on questions you can''t answer at your current level.'''
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | zooming in from 50kft view all the way to the 10kft view | 1
    repair_from: The 80/20 rule in AI coding leverage | For example, if you've done some work at the 'Product' level and have not answered all the open questions yet, its possible you may need to end it where you are and zoom down a level to the technical details to understand what's feasible. | 1
    category: orphan_referent
    disposition: fix
    note: |
      The piece establishes one planning-depth model—"Product level" zooming to "technical details"—then later invokes a different-sounding model: "50kft view all the way to the 10kft view." These frameworks may be equivalent or different, but the piece never clarifies which. A reader cannot be certain what mental model the author is describing.
    suggestion: 'Introduce the framework once with consistent naming: establish that you zoom ''from high-level (Product, 50kft view) down to technical details (10kft view)'' to answer progressively more concrete questions.'
  - severity: minor
    article: pragmatic-leverage
    category: heading_not_a_claim
    disposition: fix
    note: |
      Both headings name topics rather than claims. "Seeking Leverage" introduces a concept; "The 80/20 rule in AI coding leverage" names a framework. Neither expresses what the section argues.
    suggestion: 'Reframe as claims: ''Leverage multiplies when you optimize planning, not just code'' and ''Calculate the effort-to-rework trade-off for each task'' or similar.'
  scores:
    order: 3
    coherence: 3
    opening: 4
    ending: 3
  notes: |
    The piece establishes a clear argument about planning-effort versus rework likelihood and navigating the trade-off pragmatically. Flow breaks where analysis transitions to practice: an unclear pronoun and an undefined framework create local confusion about what "pragmatic zooming" means and requires.
