mechanics:
  result: changes_required
  findings:
  - severity: major
    article: from-gpt2-to-kimi3
    locator: '- | fixes... then I saw that it was released in 2020 | 1'
    category: capitalisation
    disposition: editor_decision
    note: |
      An ellipsis after "fixes" creates ambiguity: if "then I saw" is a new sentence, the standing
      rule requires it to open capitalised. If it is a continuation within one sentence, the ellipsis
      is an unconventional choice; a semicolon or period would clarify the boundary. By the magazine's
      standing rule that sentences open capitalised regardless of the source author's stylistic intent,
      "then" should be capitalised. This is the author's retained text, so an editor decides whether
      to capitalise "then" or to repunctuate the sentence.
    suggestion: That's what Flash Attention fixes. Then I saw that it was released in 2020.
  scores:
    grammar: 4
    typography: 5
    consistency: 4
  notes: |
    One capitalisation anomaly where an ellipsis precedes a lowercase "then" that should be
    capitalised by standing rule. The ellipsis creates sentence-boundary ambiguity that editing can
    resolve.
shape:
  result: approved
  findings: []
  scores:
    order: 5
    coherence: 5
    opening: 5
    ending: 4
  notes: |
    The piece traces a clear architectural progression from GPT-2 through KimiK3, with each section explaining both a problem and its solution. The argument order is recoverable in one read: scale is not the differentiator; instead, each architectural step solves a specific constraint (bandwidth, overcapacity, forgetting, signal dilution). The opening earns the piece by posing a sharp question ("whether that gap is just scale") and answering it with a throughline the reader can follow. Transitions are smooth, each section building on the prior, especially the movement from linear attention (solves growth; costs accuracy) to DeltaNet (solves interference via replacement, not addition). The ending lands by revealing the unifying frame—every step is a different eviction policy—which retroactively organizes all preceding content. No duplication, no orphan referents, no argument-order collapse. The piece holds its structure despite the density of technical detail, and the voice (particularly the O(N²) confession and the "seven hours" acknowledgment) keeps the reader engaged throughout.
