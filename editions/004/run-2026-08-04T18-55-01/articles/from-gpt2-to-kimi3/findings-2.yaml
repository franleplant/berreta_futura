  notes: |
    The piece traces the architectural path from GPT-2 to KimiK3 as a progression of solutions to fixed-capacity memory management: each step from linear attention through AttnRes offers a different answer to what gets evicted from the cache and when. The argument order is logical and necessary, with each section building on the previous without gaps. The opening earns what follows by promising that each step brought something new, and the ending lands by unifying all steps under the eviction-policy frame. No duplication, orphan referents, or missing transitions interrupt the flow, and the piece holds together on a single careful read.
