  notes: |
    Sentence-initial capitalization is consistent throughout (all capitalized,
    the piece's own convention). No agreement errors, dangling modifiers, or
    sentence fragments. Punctuation is correct: compound sentences use commas
    before coordinating conjunctions, independent clauses are joined by
    semicolons where appropriate. Code blocks are properly fenced with matching
    delimiters. Spelling and typography are accurate; no em dashes, doubled
    spaces, or stray markup. No unlabeled editor additions in the prose.
