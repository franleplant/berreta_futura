    The piece establishes one intrusion narrative across all vectors, maintains a single running example from escape through cluster-admin despite temporal backtracking (open with the hook, explain the arrival, move forward), recovers argument order in one read, and lands on a strong reflection about the asymmetry of machine-speed exploitation versus human-speed defense.
