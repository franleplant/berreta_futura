  notes: |
    This is a forensic narrative that maintains human voice throughout. The reader
    hears a person who understands the mechanism and respects the reader's
    intelligence. Technical exposition is clear without becoming clinical. The
    strategic choices—holding the attack as one throughline of consequence,
    reframing the threat as asymmetry of speed rather than damage dealt—carry
    the argument cleanly. No findings.
