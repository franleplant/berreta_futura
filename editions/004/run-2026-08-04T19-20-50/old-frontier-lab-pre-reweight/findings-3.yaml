worth:
  result: approved
  findings: []
  notes: |
    This piece narrates the actual attack progression from initial exploit through
    lateral movement to internal access, extracting the three defensive shapes
    (node impersonation via cloud credentials, forged identity tokens, supply-chain
    write access) as the machine-speed attack patterns that matter for defenders.
    It completes its prior revision against length and positioning, delivering
    forensic facts without forensic-investigation overhead. At 11% of source length,
    it is lean but justified—the source's bulk is enumerated actions and forensic
    methodology, not narrative content. The restructuring from phase-by-phase to
    escalation-by-escalation is appropriate editorial work.
  scores:
    value_over_source: 4
    length_earned: 5
    retention: 4
