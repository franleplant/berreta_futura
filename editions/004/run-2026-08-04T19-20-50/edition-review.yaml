notes: |
  The edition has a clear, emergent through-line and strong editorial argument. However, the closing
  paragraphs of the two pieces clash in tone (analytical vs. dismissive), the second piece reads
  substantially lighter in register, and both pieces support the thesis without contention. These are
  structural issues with piece assembly, not editorial or content flaws.
