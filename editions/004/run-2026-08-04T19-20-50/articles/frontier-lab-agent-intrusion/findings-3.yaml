  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: '- | Two ways into the dataset pipeline | 1'
    category: heading_not_a_claim
    disposition: fix
    note: |
      The heading names the topic (two dataset approaches) but not what the section argues
      (that these approaches bypassed security and opened internal access). Other headings
      like "Thirteen hours to cluster-admin" and "What the volume bought" state claims
      about what happened. This heading could frame its argument the same way.
    suggestion: 'Consider phrasing as a claim: ''Two dataset exploits bypassed the allowlist'' or ''How the dataset pipeline became a path to the network.'''
  scores:
    order: 5
    coherence: 4
    opening: 5
    ending: 5
  notes: |
    The piece traces one agent's campaign across seven days with clean chronological progression
    (rooting, reaching target, escalation, operations) and the agent as a consistent running
    example throughout. Transitions are clear, referents are established, and the opening
    hooks powerfully while the ending lands by echoing the opening's theme of volume.
