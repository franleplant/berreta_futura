mechanics:
  result: changes_required
  findings:
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: '- | None of the individual flaws that followed were new | 1'
    category: agreement
    disposition: editor_decision
    note: |
      "None" is a singular pronoun requiring a singular verb. The text reads
      "None of the individual flaws that followed were new" but should be "was
      new". The error appears in the author's own text.
    suggestion: None of the individual flaws that followed was new
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: '- | No customer model, dataset, or Space were touched | 1'
    category: agreement
    disposition: editor_decision
    note: |
      The negative determiner "No" followed by a compound subject requires
      singular agreement. The sentence reads "were touched" but should be "was
      touched", as "no customer model, dataset, or Space" is a singular
      negation of multiple items. The error appears in the author's own text.
    suggestion: No customer model, dataset, or Space was touched
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: 'Two ways into the dataset pipeline | Three configs, three paths: the worker''s process environment, and two of its own source files | 1'
    category: grammar
    disposition: editor_decision
    note: |
      This line is formatted as a sentence (capital letter opening, terminal
      period) but contains no main verb. It functions as a fragment introducing
      the three configs and paths that follow. Either supply an explicit verb
      ("These were three configs, three paths") or reformat as a list label.
      The error appears in the author's text.
    suggestion: 'These were three configs, three paths: the worker''s process environment, and two of its own source files'
  scores:
    grammar: 3
    typography: 4
    consistency: 4
  notes: |
    Three major issues survive in the author's text: two subject-verb agreement
    errors and one sentence fragment. The rest of the piece maintains clean
    typography, consistent tense and voice, and strong technical precision
    throughout the reconstruction.
shape:
