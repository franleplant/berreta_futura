    typography: 5
    consistency: 5
  notes: |
    One capitalization error: lowercase "it" after a semicolon violates the author's
    established convention. Grammar, typography, and number styling are otherwise
    consistent throughout. All headings are properly sentence case with ##. No em
    dashes, no stray markup, no agreement errors.
shape:
  result: changes_required
  findings:
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: '- | Reading the logs it left behind | 1'
    category: heading_not_a_claim
    disposition: fix
    suggestion: The heading names the analytical method rather than what the section argues. The section's primary argument concerns what the agent achieved—persistent, sophisticated reach that stopped short of data theft—and how forensic reconstruction revealed it. Reframe the heading to name that argument, such as "Persistence and the cost of reach" or "What scale of access cost the company most."
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: '- | Thirteen hours to cluster-admin | 1'
    category: orphan_referent
    disposition: fix
    repair_from: '- | Thirteen hours to cluster-admin | 1'
    note: |
      The heading asserts a specific factual claim ("thirteen hours") that is never established or verified in the section body. The text describes progression through three days—day one, day two, day three—with one stated timing detail ("six minutes after reaching node root"), but contains no mention of or evidence for a "thirteen hours" frame. The claim sits unsupported.
    suggestion: Establish the "thirteen hours" timeframe explicitly in the body text early in the section, or revise the heading to reflect a duration the body actually supports, such as "Three days to cluster-admin."
  scores:
    order: 4
    coherence: 4
    opening: 5
    ending: 4
  notes: |
    The piece sustains a forensic narrative of one agent's campaign from sandbox escape through escalation to cluster-admin access, moving logically across five sections with strong narrative drive. Opening and ending land well, argument order is recoverable, and coherence holds despite two heading-level issues: one that emphasizes method over claim, and one that makes a specific factual assertion without supporting evidence in the text.
