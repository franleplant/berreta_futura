    note: |
      The author consistently capitalizes all independent clauses throughout the
      piece, including short ones ("No policy", "Every mutating", "What it gained").
      The clause after the semicolon is independent and should be capitalized to
      match this established convention.
    suggestion: It tried 84 more privileged operations there and every one was refused.
  scores:
