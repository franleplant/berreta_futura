craft:
  result: approved
  findings: []
  scores:
    voice: 4
    sentence_variety: 4
    economy: 4
  notes: |
    Reads as a forensic analyst explaining actual events with clarity and
    appropriate technical depth. Voice is consistent and human throughout; metaphors
    earn their places and humor is rare and dry. The closing sentence reframes the
    entire narrative through a perspective shift rather than restating. No clichés,
    no robot register, no unearned claims. Technical jargon is appropriate to the
    developer/engineer audience. The piece sustains precision across 17,600 actions
    without losing the reader to abstraction.
