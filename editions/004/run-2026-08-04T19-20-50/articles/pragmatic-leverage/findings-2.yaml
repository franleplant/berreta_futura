shape:
  result: changes_required
  findings:
  - severity: minor
    article: pragmatic-leverage
    locator: Seeking Leverage | Even before AI, only 25-50% of the time | 1
    category: heading_not_a_claim
    disposition: fix
    note: "Heading names the activity, not what the section argues. \"Seeking Leverage\" \ndescribes the topic but doesn't claim anything about leverage or where it comes from.\n"
    suggestion: 'Name the claim: ''Where Real Leverage Comes From'' or ''Why Planning Matters More Than Code-Writing''.'
  - severity: minor
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | Let's assume if you yolo a two-sentence prompt | 1
    category: heading_not_a_claim
    disposition: fix
    note: "Heading names the framework being introduced, not the claim the section makes \nabout planning effort. \"The 80/20 rule in AI coding leverage\" describes the tool, \nnot what applying it argues.\n"
    suggestion: 'Name the claim: ''Why Planning Effort Has Diminishing Returns'' or ''How to Calibrate Planning Without Overindexing''.'
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | You need to do this without overindexing on questions you won't be able to answer without going down a level | 1
    repair_from: The 80/20 rule in AI coding leverage | What you don't want to do is spend 6 hours planning | 1
    category: missing_transition
    disposition: fix
    note: "The piece shifts from the 80/20 payoff principle (\"don't waste planning hours\") \nto multi-level planning complexity (\"zoom down to answer feasibility questions\") \nwithout saying how they connect. The reader must infer that zooming is part of \npragmatic 80/20 effort allocation, but this isn't stated.\n"
    suggestion: 'Add a sentence bridging them: ''But when planning at one level of abstraction, you may discover questions that can''t be answered there—which is when you zoom down to a more detailed level.'''
  - severity: minor
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | Good luck | 1
    category: ending
    disposition: fix
    note: "\"Good luck\" reads as a sign-off rather than a landing. The preceding sentence \nabout doing \"a little bit of steering at each phase\" lands the insight. This \nsign-off undercuts it instead of reinforcing it.\n"
    suggestion: Either end on the steering insight itself, or add a closing sentence that reinforces the main point before the sign-off.
  scores:
    order: 3
    coherence: 3
    opening: 4
    ending: 2
  notes: "The piece argues that leverage comes from planning pragmatically at the right \nabstraction level. That argument holds together but asks the reader to infer \nthe connection between 80/20 effort payoff and multi-level zooming. The opening \nis strong; the ending is weak.\n"
craft:
  result: changes_required
  findings:
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | if you yolo a two-sentence prompt into your factory | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Five conditional constructions in approximately 430 words: "if you yolo a
      two-sentence prompt", "If you're only using AI to write the code, then
      you're taking", "But if you use AI to help you plan and align, then you
      actually get closer", "if you've done some work at the Product level",
      and "If you're doing multiple phases of planning". The pattern clusters in
      the opening sections and creates a rhythmic repetition that a reader
      begins to anticipate. Remedy is an editor's call: tighten the opening
      section, vary the consequent structures, or accept the pattern as part of
      the reasoning voice.
  - severity: minor
    article: pragmatic-leverage
    locator: You need to do this without overindexing on questions you won't be able to answer without going down a level. | without overindexing on | 1
    category: jargon
    note: |
      "Overindexing on" is startup/tech jargon (meaning to prioritize or focus
      too heavily) used without definition. The term jars slightly against the
      conversational tone of the rest of the piece and may not be transparent to
      readers outside that circle. Consider "don't focus on questions that
      require deeper investigation" or similar.
  scores:
    voice: 4
    sentence_variety: 3
    economy: 3
  notes: |
    The piece maintains direct authorial voice and concrete examples throughout,
    with pragmatic reasoning and respect for the reader's intelligence. The main
    defect is a cluster of conditional constructions in the opening that creates
    a pattern the reader begins to expect; a single use of startup jargon without
    definition breaks the conversational register.
