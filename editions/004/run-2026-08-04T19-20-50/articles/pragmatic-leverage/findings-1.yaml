mechanics:
  result: changes_required
  findings:
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 Rule in AI Coding Leverage | Lets assume if you yolo | 1
    category: spelling
    disposition: editor_decision
    note: |
      "Lets" should be a contraction: "Let's" (let us).
    suggestion: Let's assume if you yolo a two-sentence prompt into your factory...
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 Rule in AI Coding Leverage | Now lets say you are | 1
    category: spelling
    disposition: editor_decision
    note: |
      "lets" should be a contraction: "let's" (let us).
    suggestion: Now let's say you are a principal engineer with 10 years of experience.
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 Rule in AI Coding Leverage | its possible you may need | 1
    category: spelling
    disposition: editor_decision
    note: |
      "its" should be a contraction: "it's" (it is). The possessive form "its" does not apply here.
    suggestion: '...if you''ve done some work at the "Product" level and have not answered all the open questions yet, it''s possible you may need to end it where you are...'
  - severity: major
    article: pragmatic-leverage
    locator: '- | The 80/20 Rule in AI Coding Leverage | 1'
    category: heading_form
    disposition: fix
    note: |
      Heading is in title case; the magazine uses sentence case for headings. Lowercase all words except the first and any proper nouns or acronyms.
    suggestion: The 80/20 rule in AI coding leverage
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 Rule in AI Coding Leverage | leverage - and it requires | 1
    category: typography
    disposition: fix
    note: |
      Em dash-like construction " - " is not permitted. Replace with one of: period, comma, colon, semicolon, or parentheses.
    suggestion: This is what we mean by leverage, and it requires being pragmatic.
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 Rule in AI Coding Leverage | good luck | 1
    category: capitalisation
    disposition: editor_decision
    note: |
      Sentence begins with lowercase. The magazine's convention is that sentences open with a capital letter.
    suggestion: Good luck.
  scores:
    grammar: 2
    typography: 3
    consistency: 3
  notes: |
    Three spelling errors survive in the author's text: two missing apostrophes in contractions ("let's"), one confusion between possessive and contraction ("it's"). The heading appears in title case rather than sentence case. One em dash-like construction requires substitution with approved punctuation. One sentence-final closing lacks the expected capital opening.
shape:
  result: changes_required
  findings:
  - severity: minor
    article: pragmatic-leverage
    category: heading_not_a_claim
    disposition: fix
    note: |
      Both section headings are topical rather than argumentative. "Seeking Leverage" names the section topic but not what it argues (code-only optimization has limited impact). "The 80/20 Rule in AI Coding Leverage" names a principle but not the argument (how to find the right planning balance pragmatically).
    suggestion: 'Revise to claim-based headings: ''Why Code-Only Acceleration Falls Short'' and ''Finding Your Planning Sweet Spot''.'
  - severity: major
    article: pragmatic-leverage
    locator: What you don't want to do is spend 6 hours planning a task for which you could have eliminated 80% of the expected pain in the first 10 minutes. | 1
    repair_from: You need to do this without overindexing on questions you won't be able to answer without going down a level. | 1
    category: missing_transition
    disposition: fix
    note: |
      The jump from the 6-hour planning lesson to the overindexing warning lacks a bridge. Both address over-planning in different dimensions: the first warns against high effort for low-impact fixes; the second warns against specifying unanswerable questions. The piece treats them as separate lessons rather than related facets of pragmatism.
  - severity: major
    article: pragmatic-leverage
    locator: If you're doing multiple phases of planning, zooming in from 50kft view all the way to the 10kft view, you want to do a little bit of steering at each phase to ensure you are eliminating as much expected pain as possible. | 1
    repair_from: good luck. | 1
    category: ending
    disposition: fix
    note: |
      The ending restates the core principle but stops with 'good luck,' which dismisses rather than lands. The piece raises a question (how much planning is right?), develops an answer through framework and pragmatism lessons, but exits without delivering closure or a sense of arrival.
    suggestion: 'Replace the dismissal with closure: ''That''s why real leverage comes from steering planning continuously, not from chasing perfect specs.'''
  scores:
    order: 4
    coherence: 3
    opening: 4
    ending: 2
  notes: |
    The piece builds a followable framework for pragmatic planning decisions but has three issues that prevent landing: headings that name topics rather than claims, a missing transition between two related pragmatism lessons, and an ending that stops instead of concluding.
craft:
  result: changes_required
  findings:
  - severity: blocking
    article: pragmatic-leverage
    locator: The 80/20 Rule in AI Coding Leverage | If you're only using AI to write | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Six "If..." conditional constructions in ~470 words dominate sentence variety: "If you're only using AI to write the code, then you're taking", "if you use AI to help you plan and align, then you actually get closer", "If you draw this out, there's an inverse relationship", "If the model is 50% likely...then our combined", "if you've done some work at the Product level...its possible you may need", and "If you're doing multiple phases of planning...you want to do a little bit of steering". The shape is the author's own voice, so remedy is editorial: run shorter, cut two conditionals, or reconsider the piece. Dex writes with conviction, but readers anticipate the shape.
  scores:
    voice: 4
    sentence_variety: 2
    economy: 3
  notes: |
    Dex's voice is clear and grounded in operational judgment, which is the piece's strength. The repeated conditional structure becomes mechanical—six instances in 470 words means one appears roughly every 78 words. A reader starts predicting the shape instead of following the thought.
