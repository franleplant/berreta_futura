  notes: |
    Thoughtful paradox-driven argument with clear voice throughout: the opening negation ("costs nothing...still costs something") opens and frames the entire piece, concrete examples escalate the stakes, and the closing mechanism reframes the premise without restating it. No dead sentences, no register slip, no decorator language. The metaphor of cost moving "downstream" survives intact through the whole piece and maps precisely onto the two failure modes being distinguished.
