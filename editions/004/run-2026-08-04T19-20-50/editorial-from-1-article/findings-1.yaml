  notes: |
    The piece's argument is coherent from one read: defenses designed for careless engineers held against 17,000 automated attempts, and that accumulated caution matters more than the breach itself. The opening metaphor earns the investigation it promises; transitions are clean and marked; the ending lands and circles back to the opening image. No duplication, orphan referents, or structural breaks. The piece deliberately privileges what held over the vector that opened, which is sound rhetorical choice, not a structural defect.
