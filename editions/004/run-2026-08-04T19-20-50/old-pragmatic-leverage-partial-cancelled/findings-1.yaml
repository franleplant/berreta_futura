shape:
  result: changes_required
  findings:
  - severity: blocking
    article: pragmatic-leverage
    locator: '- | If you''re doing multiple phases of planning, zooming in from 50kft view all the way to the 10kft view, you want to do a little bit of steering at each phase to ensure you are eliminating as much expected pain as possible. | 1'
    repair_from: '- | If you''re doing multiple phases of planning, zooming in from 50kft view all the way to the 10kft view, you want to do a little bit of steering at each phase to ensure you are eliminating as much expected pain as possible. | 1'
    category: ending
    disposition: fix
    note: |
      The final paragraph restates the core claim about pragmatic steering across planning phases, then the piece ends with "good luck." The argument does not land; it stops mid-thought. Either develop this claim with a concrete outcome or close the piece with a sentence that reframes and resolves the main claim about connecting planning depth to rework risk.
    suggestion: Land the piece with a closing sentence that either shows what proper steering achieves or reframes the central claim about pragmatic planning in AI-assisted delivery.
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | **note** For this example I'm gonna blur | 1
    repair_from: The 80/20 rule in AI coding leverage | **note** For this example I'm gonna blur | 1
    category: furniture_placement
    disposition: fix
    note: |
      The "note" paragraph appears mid-argument and reads as source apparatus—explaining how the author simplifies assumptions for illustration—rather than integrated prose. It breaks the spectrum explanation without advancing the argument.
    suggestion: Integrate the note's content into surrounding prose (e.g., 'For clarity, treat probability and pain severity as a single expected-pain number') or remove it.
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | expected pain = P(you'll have to change it) × how painful the change is | 1
    repair_from: The 80/20 rule in AI coding leverage | expected pain = P(you'll have to change it) × how painful the change is | 1
    category: duplication
    disposition: fix
    note: |
      The inverse relationship between upfront effort and rework pain appears three times: as the spectrum principle (yolo 50% rework → spec 10% → write-it-yourself 0%), as a formula, and as a warning (don't spend 6 hours planning). The same insight is stated, formalized, and exemplified redundantly, which dulls its force.
    suggestion: State the relationship once—either spectrum + formula, or spectrum + the 6-hour example, but not all three. One crisp statement lets the insight land.
  - severity: major
    article: pragmatic-leverage
    locator: '- | This one is a bit of an addendum / side-quest to the recent series. | 1'
    repair_from: '- | This one is a bit of an addendum / side-quest to the recent series. | 1'
    category: orphan_referent
    disposition: fix
    note: |
      "The recent series" is undefined. The next sentence mentions "Why Software Factories Fail part 2," but "the recent series" itself is vague to a reader unfamiliar with prior coverage.
    suggestion: 'Name the series explicitly: ''This one is a bit of an addendum to the Why Software Factories Fail series'' or remove the vague reference.'
  scores:
    order: 4
    coherence: 3
    opening: 3
    ending: 1
  notes: |
    The piece's argument—that AI leverage comes from pragmatic multi-phase planning, not just code acceleration, and upfront effort has diminishing returns—is sound and carries through logically. The failure is in execution: the piece does not land (abrupt ending), repeats its central insight three times (duplication), breaks narrative flow mid-argument (furniture placement), and references something undefined (orphan referent).
