shape:
  result: changes_required
  findings:
  - severity: blocking
    article: pragmatic-leverage
    locator: '- | This one is a bit of an addendum / side-quest to the recent series. | 1'
    repair_from: '- | This one is a bit of an addendum / side-quest to the recent series. | 1'
    category: opening
    disposition: editor_decision
    note: |
      The piece opens with publication context rather than its argument about where AI-assisted delivery gains leverage. The substantive second paragraph has to restart the piece, so the opening does not earn the argument that follows.
    suggestion: Cut or relocate the addendum preamble so the piece opens on the time spent beyond writing code.
  - severity: minor
    article: pragmatic-leverage
    locator: Seeking Leverage | Even before AI, only 25–50% of the time to ship a feature was writing the code itself. | 1
    repair_from: Seeking Leverage | Even before AI, only 25–50% of the time to ship a feature was writing the code itself. | 1
    category: heading_not_a_claim
    disposition: fix
    note: |
      "Seeking Leverage" names the section's topic but not the claim it makes: most delivery time lies outside code-writing, so planning and verification are leverage points.
