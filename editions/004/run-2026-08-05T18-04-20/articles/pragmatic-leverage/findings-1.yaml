  scores:
    order: 4
    coherence: 4
    opening: 2
    ending: 4
  notes: |
    I verified that the argument progresses from delivery-time allocation to expected pain and then to pragmatic planning depth, with the main structural weakness concentrated in the preamble and first heading.
craft:
  result: changes_required
  findings:
  - severity: blocking
    article: pragmatic-leverage
    locator: Seeking Leverage | If you're only using AI to write the code, then you're taking the 2–4 hours of coding time down to 10–20 minutes, but you haven't accelerated anything else here. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Seven conditional constructions make the piece sound patterned: "If you're only using AI to write the code, then you're taking the 2–4 hours of coding time down to 10–20 minutes, but you haven't accelerated anything else here"; "But if you use AI to help you plan and align, then you actually get closer to 2–3x faster"; "Let's assume if you yolo a two-sentence prompt into your factory, your chance of getting a fully-mergeable result is ~50%, the chance you have to rework it is 50%"; "If the model is 50% likely to get a button style wrong, but the fix is one cheap prompt, then our combined 'expected pain' is low"; "If you draw this out, there's an inverse relationship between effort invested up front and expected pain"; "For example, if you've done some work at the 'Product' level and have not answered all the open questions yet, it's possible you may need to end it where you are and zoom down a level to the technical details to understand what's feasible"; and "If you're doing multiple phases of planning, zooming in from 50kft view all the way to the 10kft view, you want to do a little bit of steering at each phase to ensure you are eliminating as much expected pain as possible." The remedy is editorial: cut or recast several of these sentences.
  - severity: minor
    article: pragmatic-leverage
    locator: '- | This one is a bit of an addendum / side-quest to the recent series. | 1'
    category: weak_opening_sentence
    disposition: fix
    note: |
      The opening announces the article's relationship to earlier posts before giving the reader a reason to continue.
  - severity: minor
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | This is what we mean by leverage - and it requires being pragmatic. | 1
    category: dead_words
    disposition: fix
    note: |
      This balanced abstraction restates the title's idea without adding a concrete observation.
  scores:
    voice: 4
    sentence_variety: 2
    economy: 3
  notes: |
    I hear an experienced practitioner speaking plainly, but the repeated conditional syntax eventually becomes louder than the argument.
