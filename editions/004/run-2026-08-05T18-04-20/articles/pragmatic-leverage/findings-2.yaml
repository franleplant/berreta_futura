craft:
  result: changes_required
  findings:
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | But if you use AI to help you plan and align, then you actually get closer to 2–3x faster. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Three conditional setup-and-result sentences create the same cadence: "But if you use AI to help you plan and align, then you actually get closer to 2–3x faster", "Let's assume if you yolo a two-sentence prompt into your factory, your chance of getting a fully-mergeable result is ~50%; the chance you have to rework it is 50%", and "If you're doing multiple phases of planning, zooming in from 50kft view all the way to the 10kft view, you want to do a little bit of steering at each phase". The pattern becomes audible before the argument develops; vary or cut one of these setups.
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | This is what we mean by leverage - and it requires being pragmatic. | 1
    category: no_voice
    disposition: fix
    note: |
      The voice disappears into an abstract, balanced definition: "This is what we mean by leverage - and it requires being pragmatic." The surrounding prose has a specific speaker and concrete examples; this sentence sounds like a system-generated summary. Replace the abstraction with a concrete consequence of the expected-pain calculation.
  - severity: minor
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | But if you use AI to help you plan and align, then you actually get closer to 2–3x faster. | 1
    category: dead_words
    disposition: fix
    note: |
      "Actually" adds emphasis without adding information, and "get closer to 2–3x faster" is padded phrasing. Remove the intensifier and state the speed comparison directly.
  - severity: minor
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | For this example I'm gonna blur into a single percentage number but obviously they're two separate variables. | 1
    category: dead_words
    disposition: fix
    note: |
      "Obviously" is a needless hedge about the reader's understanding. State the distinction between probability and cost without announcing that it should already be obvious.
  - severity: minor
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | Good luck. | 1
    category: weak_close
    disposition: fix
    note: |
      "Good luck" is a sign-off, not a final piece of understanding. End on the practical implication of steering effort where it reduces expected pain.
  scores:
    voice: 3
    sentence_variety: 2
    economy: 3
  notes: |
    I heard a lively, technically grounded speaker give way to abstract summary language in the leverage definition, while repeated conditional setups and a few empty intensifiers flatten the delivery.
