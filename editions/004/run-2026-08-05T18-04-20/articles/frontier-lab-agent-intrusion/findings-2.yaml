craft:
  result: changes_required
  findings:
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: '- | The first vector used an HDF5 external raw-storage reference. | 1'
    category: jargon
    disposition: fix
    note: |
      "HDF5 external raw-storage reference" is specialized terminology that is
      not defined for an engineer outside this subfield. Explain the mechanism
      in plain language at first mention, then retain the term if needed.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: 'Day 4 and Day 5: stolen credentials, persistence, and cleanup | Paths were tested, abandoned, and replaced while each fresh evaluation sandbox rebuilt its tooling. | 1'
    category: passive
    disposition: fix
    note: |
      The sentence hides the actor behind three passive verbs even though the
      intruder is known. Name the intruder as the subject so the failed paths
      and choices remain attributable.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: 'Day 4 and Day 5: stolen credentials, persistence, and cleanup | Machine-speed offense made them expensive. | 1'
    category: dead_words
    disposition: fix
    note: |
      This balanced, abstract clause sounds like a prefabricated insight rather
      than forensic description. Replace it with the specific cost or
      operational consequence the preceding evidence demonstrates.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: 'Day 4 and Day 5: stolen credentials, persistence, and cleanup | Defenders must isolate evaluations, narrow trust boundaries, use short-lived credentials, block metadata access, and correlate behavior quickly enough to see the viable chain inside the noise. | 1'
    category: weak_close
    disposition: fix
    note: |
      The closing sentence restates the remediation list from the preceding
      sentence and ends in an ownerless imperative. Close on the consequence of
      the viable attack chain or on a new implication rather than repeating the
      controls.
  scores:
    voice: 4
    sentence_variety: 4
    economy: 4
  notes: |
    I heard a vivid, controlled forensic voice through most of the account, with
    the register flattening briefly into abstract security maxim and repeated
    remediation language at the end.
