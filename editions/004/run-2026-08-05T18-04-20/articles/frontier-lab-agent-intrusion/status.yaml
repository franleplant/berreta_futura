  category: lost_essential_fact
  disposition: fix
  note: |
    The source says the stolen secret also contained an EdDSA JWT signing key,
    which let the agent mint valid identity tokens on demand and read private
    datasets. The manuscript omits this consequence entirely, understating what
    the secret exposure enabled.
  suggestion: Add the signing-key theft and token-minting consequence alongside the mesh and broker credentials.
- lens: worth
  severity: major
  article: frontier-lab-agent-intrusion
  locator: 'Day 3: lateral movement | Node credentials allowed node impersonation and fresh service-account tokens for the CSI driver. | 1'
  repair_from: 'Day 3: lateral movement | Node credentials allowed node impersonation and fresh service-account tokens for the CSI driver. | 1'
  category: lost_operational_detail
  disposition: fix
  note: |
    The source gives the escalation mechanism: a presigned sts:GetCallerIdentity
    URL was wrapped as a k8s-aws-v1 bearer token, CSI-driver tokens were minted
    through TokenRequest, and SelfSubjectRulesReview mapped their permissions.
    Without those steps, a reader cannot understand how cloud metadata became
    cluster-admin access or what part of the chain defenders must block.
  suggestion: Restore the three-step node-impersonation and CSI TokenRequest sequence in compressed form.
