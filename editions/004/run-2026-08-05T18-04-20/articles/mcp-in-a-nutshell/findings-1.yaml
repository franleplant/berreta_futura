craft:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | The data layer defines the JSON-RPC 2.0 messages, capability and version discovery, and the primitives that servers and clients can offer. | 1'
    category: jargon
    disposition: fix
    note: |
      “JSON-RPC 2.0” and “capability and version discovery” arrive without a plain-language explanation. A competent engineer outside this subfield may not know what these terms mean.
    suggestion: |
      Briefly explain JSON-RPC 2.0 as the message format and describe discovery as the handshake that identifies supported versions and features.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | That small qualification describes the boundary MCP keeps throughout: the protocol supplies a shared vocabulary and message flow, while the application remains responsible for deciding what the model may do with the context it receives. | 1'
    category: dead_words
    disposition: fix
    note: |
      “That small qualification describes the boundary MCP keeps throughout” is an abstract, balanced setup for the useful point that follows. The sentence sounds like a packaged insight rather than a person naming the distinction directly.
    suggestion: |
      State the distinction directly: MCP defines the messages and available capabilities; the application decides which actions the model may take.
  scores:
    voice: 4
    sentence_variety: 4
    economy: 4
  notes: |
    I heard a clear, technically minded explainer whose voice briefly recedes into protocol jargon and an abstract concluding formulation.
