worth:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: MCP has two layers. | Streamable HTTP uses HTTP POST, can stream with Server-Sent Events, and supports ordinary HTTP authentication methods such as bearer tokens, API keys, and custom headers. | 1
    repair_from: MCP has two layers. | Streamable HTTP uses HTTP POST, can stream with Server-Sent Events, and supports ordinary HTTP authentication methods such as bearer tokens, API keys, and custom headers. | 1
    category: lost_operational_detail
    disposition: fix
    note: |
      The source explicitly recommends OAuth for obtaining authentication tokens. The manuscript lists authentication mechanisms but omits that recommendation, leaving an implementer without the source's guidance on the preferred authentication flow.
    suggestion: Add that MCP recommends OAuth for obtaining authentication tokens.
  - severity: major
    article: mcp-in-a-nutshell
    locator: MCP is a stateless protocol. | A client may begin with the mandatory `server/discover` request, which carries fields such as `protocolVersion`, `clientInfo`, and `clientCapabilities`. | 1
    repair_from: MCP is a stateless protocol. | A client may begin with the mandatory `server/discover` request, which carries fields such as `protocolVersion`, `clientInfo`, and `clientCapabilities`. | 1
    category: lost_operational_detail
    disposition: fix
    note: |
      The source gives the exact wire namespaced fields (`io.modelcontextprotocol/protocolVersion`, `io.modelcontextprotocol/clientInfo`, and `io.modelcontextprotocol/clientCapabilities`) and the server response fields (`serverInfo` and `supportedVersions`). Replacing them with generic names makes the explainer less usable as a protocol reference.
    suggestion: Include the exact metadata keys and response field names once, alongside the conceptual explanation.
  - severity: major
    article: mcp-in-a-nutshell
    locator: Servers can also ask the user for more information or confirmation through elicitation. | Servers can also ask the user for more information or confirmation through elicitation. | 1
    repair_from: Servers can also ask the user for more information or confirmation through elicitation. | Servers can also ask the user for more information or confirmation through elicitation. | 1
    category: lost_operational_detail
    disposition: fix
    note: |
      The source names the callable method `elicitation/create`. A reader who wants to implement or inspect elicitation must return to the source to find the method identifier.
    suggestion: Name `elicitation/create` in the sentence introducing elicitation.
  - severity: major
    article: mcp-in-a-nutshell
    locator: Servers can also ask the user for more information or confirmation through elicitation. | Sampling and logging are deprecated client primitives as of protocol version 2026-07-28. | 1
    repair_from: Sampling and logging are deprecated client primitives as of protocol version 2026-07-28. | Sampling and logging are deprecated client primitives as of protocol version 2026-07-28. | 1
    category: lost_operational_detail
    disposition: fix
    note: |
      The source identifies the deprecated methods `sampling/createMessage` and `logging`'s replacement guidance. The manuscript explains the policy but omits the sampling method name, which is the identifier an implementer would need to recognize or migrate.
    suggestion: Add `sampling/createMessage` when describing the deprecated sampling primitive.
  - severity: major
    article: mcp-in-a-nutshell
    locator: These updates are best effort. | A reconnect may lose a notification, so clients should also rely on polling to preserve freshness of results. | 1
    repair_from: These updates are best effort. | A reconnect may lose a notification, so clients should also rely on polling to preserve freshness of results. | 1
    category: no_position
    disposition: fix
    note: |
      The manuscript is a competent condensation and rearrangement, but it never makes an editorial claim about what readers should conclude or prioritize. Its final sentence restates the source's scope rather than supplying a magazine position.
    suggestion: Add a clear framing judgment, such as treating MCP primarily as a context-and-capability boundary whose application-level policy matters more than transport choice.
  omissions:
  - fact: 'The overview''s inventory of MCP projects: specification, SDKs, development tools including MCP Inspector, and reference server implementations'
    reader_loses: The scope of the MCP ecosystem beyond the wire protocol.
    verdict: defensible
  - fact: 'The explicit participant definitions: host coordinates clients, client obtains context for the host, and server provides context'
    reader_loses: Some role-boundary precision, though the manuscript conveys the architecture.
    verdict: defensible
  - fact: Local STDIO servers typically serve one client, while remote Streamable HTTP servers typically serve many clients
    reader_loses: A useful deployment distinction about expected connection fan-out.
    verdict: defensible
  - fact: The transport layer is conceptually the outer layer and the data layer the inner layer
    reader_loses: A diagrammatic mental model, not a necessary operational fact.
    verdict: defensible
  - fact: The source's utility feature of progress tracking for long-running operations
    reader_loses: Awareness that progress reporting exists separately from the Tasks extension.
    verdict: defensible
  - fact: The exact namespaced metadata keys `io.modelcontextprotocol/protocolVersion`, `io.modelcontextprotocol/clientInfo`, and `io.modelcontextprotocol/clientCapabilities`
    reader_loses: The exact fields needed to construct compliant JSON-RPC requests.
    verdict: needed
  - fact: The discovery response's `serverInfo` field and explicit `supportedVersions` response structure
    reader_loses: The concrete response fields needed to implement version and identity handling.
    verdict: needed
  - fact: The source's recommendation to use OAuth to obtain Streamable HTTP authentication tokens
    reader_loses: The preferred authentication approach for remote deployments.
    verdict: needed
  - fact: The `elicitation/create` method
    reader_loses: The method identifier needed to issue an elicitation request.
    verdict: needed
  - fact: The `sampling/createMessage` method name
    reader_loses: The identifier needed to recognize deprecated sampling calls during migration.
    verdict: needed
  - fact: The full discovery JSON exchange
    reader_loses: A copyable request example, including JSON-RPC `id` and the metadata envelope.
    verdict: defensible
  - fact: The discovery pseudo-code using `Client(stdio_client(server_config))`, capability checks, and `app.register_mcp_server`
    reader_loses: A concrete SDK-shaped implementation pattern.
    verdict: defensible
  - fact: The full `tools/list` request and response JSON
    reader_loses: 'A copyable listing exchange and the exact `resultType: complete` response.'
    verdict: defensible
  - fact: The `units` argument's default of `metric` when omitted
    reader_loses: A small but concrete behavioral caveat in the weather example.
    verdict: defensible
  - fact: The full `tools/call` response JSON
    reader_loses: A concrete example of the returned content array and response envelope.
    verdict: defensible
  - fact: The full subscription listen, acknowledgement, notification, and refresh JSON exchanges
    reader_loses: Copyable wire examples for implementing subscriptions and correlating stream events.
    verdict: defensible
  - fact: 'The source''s five reasons notifications matter: dynamic environments, efficiency, consistency, real-time collaboration, and extension beyond tools'
    reader_loses: Several motivations for the notification design.
    verdict: defensible
  - fact: The four pseudo-code blocks for tool federation, tool execution, and notification handling
    reader_loses: Concrete SDK/application integration patterns.
    verdict: defensible
  omissions_summary: |
    The needed omissions do not cut past the conceptual bone, but restoring the exact metadata keys, OAuth recommendation, and omitted method names would remove avoidable implementation detours.
  retentions:
  - passage: MCP gives an AI application a common way to reach tools and data
    costs: Opening thesis and local-versus-remote examples occupy space, but establish the protocol boundary and prevent transport from being confused with server role.
    verdict: earns_place
  - passage: MCP has two layers. The data layer uses JSON-RPC 2.0
    costs: The transport comparison takes a paragraph, but gives the reader the essential relationship between wire format, framing, and authentication.
    verdict: earns_place
  - passage: MCP is a stateless protocol. Every request carries
    costs: The discovery retry and caching explanation uses substantial space, but explains why discovery is optional and how version negotiation works.
    verdict: earns_place
  - passage: The important question is what a server can actually offer
    costs: The primitive taxonomy and list/get/call methods spend a full paragraph, but provide the shared vocabulary the article promises.
    verdict: earns_place
  - passage: Consider a database server. It might expose a tool
    costs: This example repeats the primitive definitions, but shows how tools, resources, prompts, and a unified registry fit together.
    verdict: earns_place
  - passage: A concrete call uses JSON-RPC with an `id`
    costs: The weather example consumes space that could hold more wire details, but it teaches exact naming, schema-conforming arguments, and rich results.
    verdict: earns_place
  - passage: These updates are best effort. A reconnect may lose a notification
    costs: The notification lifecycle is detailed, but the subscription, acknowledgement, event, and refresh sequence is the article's main operational example.
    verdict: earns_place
  retentions_summary: |
    No passage clearly fails to pay for its space; the principal trade is between these working explanations and the omitted exact identifiers.
  notes: |
    Changes required because the piece gives a strong conceptual synthesis but omits several exact protocol identifiers and supplies no distinct editorial position.
