mechanics:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | The client first learns what exists, then the application can combine tools from many connected servers into one registry for the language model. | 1'
    category: punctuation
    disposition: fix
    note: |
      This is a comma splice joining two independent clauses. The prose is editor-written in faithful_synthesis, so the editors must repair it.
    suggestion: The client first learns what exists; then the application can combine tools from many connected servers into one registry for the language model.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | MCP in a Nutshell | 1'
    category: heading_form
    disposition: fix
    note: |
      The title is in title case rather than the required sentence case.
    suggestion: MCP in a nutshell
  scores:
    grammar: 3
    typography: 5
    consistency: 4
  notes: |
    One comma splice and one title-case heading require correction.
shape:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | Servers can also ask the user for more information or confirmation through elicitation. | 1'
    repair_from: '- | Servers can also ask the user for more information or confirmation through elicitation. | 1'
    category: missing_transition
    disposition: fix
    note: |
      The piece moves from the database/tool-call explanation into a cluster of
      deprecations and extensions, then returns to notification mechanics. The
      reader is not told why these topics are being introduced or how they relate
      to the main message flow, so the central sequence loses momentum.
    suggestion: Add a transition that frames elicitation, deprecations, and extensions as optional or advanced protocol features before returning to notifications.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | A concrete call uses JSON-RPC with an `id`, the method `tools/call`, and parameters such as `name: "weather_current"` and `arguments: {"location": "San Francisco", "units": "imperial"}`. | 1'
    repair_from: '- | Consider a database server. | 1'
    category: running_example
    disposition: fix
    note: |
      The database server is established as the running example, but the concrete
      call abruptly switches to a weather tool without explaining the change. The
      result is two unrelated examples rather than one case carrying the argument.
    suggestion: Keep the concrete call within the database example, or explicitly mark the weather call as a contrasting illustration.
  scores:
    order: 3
    coherence: 3
    opening: 4
    ending: 4
  notes: |
    I verified that the piece progresses from MCP's architecture through message flow and primitives to updates and application responsibility, but two topic shifts weaken that progression.
craft:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: Primitives and discovery | Tools are executable functions for actions such as file operations, API calls, and database queries. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Three consecutive primitive definitions use the same catalog shape:
      "Tools are executable functions...", "Resources provide context...", and
      "Prompts are reusable templates...". The repetition makes the paragraph
      sound assembled rather than written; vary the sentence shapes or cut one
      definition.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | MCP is a stateless protocol. Every request carries the protocol version and the capabilities relevant to that request in its `_meta` field. | 1'
    category: no_voice
    disposition: fix
    note: |
      The third paragraph is where the voice disappears: it stacks protocol
      metadata, method names, version negotiation, and caching rules in an even
      register with no human-scale explanation. Give the paragraph one concrete
      interaction to carry the technical details.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | Sentry’s official server runs remotely over Streamable HTTP. | 1'
    category: jargon
    disposition: fix
    note: |
      "Streamable HTTP" is a subfield term that the piece names but never
      explains; a competent engineer outside MCP may not know what transport
      behavior it denotes.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | Sampling and logging are deprecated client primitives as of protocol version 2026-07-28. | 1'
    category: passive
    disposition: fix
    note: |
      "Are deprecated" hides who made the decision and leaves the sentence
      sounding like a changelog entry. Name the specification or maintainers
      responsible for the deprecation.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: Server primitives | The important question is what a server can actually offer. | 1
    category: dead_words
    disposition: fix
    note: |
      "The important question" is throat-clearing; the paragraph can move
      directly to what servers offer.
  scores:
    voice: 3
    sentence_variety: 3
    economy: 3
  notes: |
    I heard a careful technical explainer whose voice flattens into catalog prose
    when it reaches protocol negotiation and primitive definitions.
