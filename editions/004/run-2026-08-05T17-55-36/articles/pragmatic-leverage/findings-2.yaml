craft:
  result: changes_required
  findings:
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | Let's assume that if you yolo a two-sentence prompt into your factory, your chance of getting a fully mergeable result is ~50%; the chance you have to rework it is 50%. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Four conditional "if..." constructions create a noticeable repeated shape:
      "if you yolo a two-sentence prompt into your factory", "If the model is 50% likely to get a button style wrong", "if you've done some work at the \"Product\" level", and "If you're doing multiple phases of planning". The remedy is editorial: cut or recast at least one of these passages.
  - severity: minor
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | You need to do this without overindexing on questions you won't be able to answer without going down a level. | 1
    category: dead_words
    disposition: fix
    note: |
      "Overindexing," "going down a level," and "what's feasible" stack abstractions without naming the concrete decision the reader should make.
  - severity: minor
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | This is what we mean by leverage, and it requires being pragmatic. | 1
    category: dead_words
    disposition: fix
    note: |
      This balanced clause restates the article's label instead of adding a sharper consequence.
  - severity: minor
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | If you're doing multiple phases of planning, zooming in from 50kft view all the way to the 10kft view, you want to do a little bit of steering at each phase to ensure you are eliminating as much expected pain as possible. | 1
    category: jargon
    disposition: fix
    note: |
      "50kft view" and "10kft view" are undefined planning jargon for readers outside this engineering idiom.
  scores:
    voice: 3
    sentence_variety: 2
    economy: 3
  notes: |
    I hear a practical authorial voice, but it fades into planning abstractions and a repeated conditional pattern near the middle of the piece.
