  findings: []
  omissions:
  - fact: The piece is an addendum or side-quest to a recent series, published standalone because it did not fit the main post.
    reader_loses: No context for why this article exists or how it relates to the series.
    verdict: defensible
  - fact: 'It is briefly referenced in ''Why Software Factories Fail part 2: Turning the lights back on.'''
    reader_loses: A cross-reference for readers following the broader series.
    verdict: defensible
  - fact: The source explicitly says there is an inverse relationship between upfront effort and expected pain.
    reader_loses: A concise statement of the relationship illustrated by the surrounding examples.
    verdict: defensible
  - fact: The source uses a hyphenated 'fully-mergeable' formulation and lowercase note styling.
    reader_loses: Nothing substantive; these are wording and formatting differences.
    verdict: defensible
  - fact: The source closes with 'good luck.'
    reader_loses: Nothing substantive.
    verdict: defensible
  retentions:
  - passage: Even before AI, only 25–50% of the time to ship a feature...
    costs: The opening establishes the central time-allocation premise on which the rest of the argument depends.
    verdict: earns_place
  - passage: Using AI only to write the code takes...
    costs: The concrete 2–4 hour to 10–20 minute comparison shows why coding speed alone is insufficient.
    verdict: earns_place
  - passage: Using AI to help you plan and align...
    costs: States the practical leverage claim and its estimated 2–3× effect.
    verdict: earns_place
  - passage: Let's assume that if you yolo a two-sentence prompt...
    costs: Provides the baseline probability against which planning effort is evaluated.
    verdict: earns_place
  - passage: Now let's say you are a principal engineer...
    costs: Shows that even exceptional context and detailed planning do not eliminate rework.
    verdict: earns_place
  - passage: 'And at the far end: write every line yourself.'
    costs: Completes the leverage spectrum by identifying the zero-rework extreme.
    verdict: earns_place
  - passage: 'Note: For this example I''m gonna blur...'
    costs: Preserves the caveat distinguishing probability from the pain of correction.
    verdict: earns_place
  - passage: What you don't want to do is spend 6 hours planning...
    costs: Turns the model into an actionable planning heuristic.
    verdict: earns_place
  - passage: You need to do this without overindexing...
    costs: Retains the important qualification that planning may need to zoom into technical feasibility.
    verdict: earns_place
  - passage: This is what we mean by leverage...
    costs: Synthesizes the argument into pragmatic steering across planning levels.
    verdict: earns_place
  notes: |
    This edit gives a reader the source's practical argument that AI's real delivery leverage comes from planning and alignment, calibrated by expected rework pain, rather than from code generation alone. The omissions remove contextual framing and a restated relationship, but no load-bearing fact, operational detail, or caveat; every retained passage carries the explanation or its actionable heuristic.
