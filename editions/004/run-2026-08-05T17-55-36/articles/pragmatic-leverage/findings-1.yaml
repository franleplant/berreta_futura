craft:
  result: changes_required
  findings:
  - severity: blocking
    article: pragmatic-leverage
    locator: Seeking Leverage | If you're only using AI to write the code, then you're taking the 2–4 hours of coding time down to 10–20 minutes, but you haven't accelerated anything else here. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Seven conditional sentences make the same if-clause-to-consequence move:
      "If you're only using AI to write the code, then you're taking the 2–4 hours of coding time down to 10–20 minutes, but you haven't accelerated anything else here"; "But if you use AI to help you plan and align, then you actually get closer to 2–3× faster"; "Let's assume if you yolo a two-sentence prompt into your factory, your chance of getting a fully mergeable result is ~50%, the chance you have to rework it is 50%"; "If you draw this out, there's an inverse relationship between effort invested up front and expected pain"; "if you've done some work at the 'Product' level and have not answered all the open questions yet, it's possible you may need to end it where you are and zoom down a level to the technical details to understand what's feasible"; "If the model is 50% likely to get a button style wrong, but the fix is one cheap prompt, then our combined 'expected pain' is low"; and "If you're doing multiple phases of planning, zooming in from 50kft view all the way to the 10kft view, you want to do a little bit of steering at each phase to ensure you are eliminating as much expected pain as possible." The pattern becomes audible before the argument develops; cut or recast several of these sentences.
  - severity: minor
    article: pragmatic-leverage
    locator: '- | This one is a bit of an addendum / side-quest to the recent series. | 1'
    category: weak_opening_sentence
    disposition: author_decision
    note: |
      The opening spends its first sentence explaining the article's publishing context rather than giving the reader the practical claim. Start with the leverage argument and move this context elsewhere or remove it.
  - severity: minor
    article: pragmatic-leverage
    locator: The 80/20 Rule in AI Coding Leverage | This is what we mean by leverage—and it requires being pragmatic. | 1
    category: dead_words
    disposition: author_decision
    note: |
      This balanced, abstract definition repeats terms the preceding examples have already made concrete. Replace it with the specific operational consequence of choosing how much planning to do.
  scores:
    voice: 4
    sentence_variety: 1
    economy: 3
  notes: |
    I heard a candid practitioner in the examples, but the piece's repeated conditional sentence shape eventually takes over the reading experience.
