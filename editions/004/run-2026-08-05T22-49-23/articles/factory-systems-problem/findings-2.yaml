worth:
  result: approved
  findings: []
  omissions:
  - fact: The warning that startups created in the last six months are unlikely to belong to the small expert cohort
    reader_loses: Less specific evidence for skepticism toward vendors claiming to have solved factory systems.
    verdict: defensible
  - fact: The cohort is described as the who's-who of roughly ten people
    reader_loses: The social-expertise qualifier, though the manuscript preserves the approximate size and two-year effort.
    verdict: defensible
  - fact: A homelab project could earn a super-fast promotion and red-carpet treatment at an interview
    reader_loses: The source's explicit career upside, beyond the manuscript's retained highest-ROI advice.
    verdict: defensible
  - fact: The post is introduced as a second hot take because the first apparently landed
    reader_loses: Context about the author's sequence of posts and audience response.
    verdict: defensible
  - fact: The service-bus prior art is described as being in the 'spooky land of enterprise'
    reader_loses: A rhetorical characterization, not operational or argumentative substance.
    verdict: defensible
  - fact: The source calls this a second hot take
    reader_loses: A framing label only; the substantive service-bus argument remains.
    verdict: defensible
  omissions_summary:
    verdict: defensible
    note: The manuscript drops contextual and rhetorical details but keeps the systems-engineering thesis, the concrete stack components, the service-bus technologies, and the Temporal recommendation.
  retentions:
  - passage: Software factories are super real but we need to be realistic.
    costs: A brief framing sentence, but it establishes the piece's central caution.
    verdict: earns_place
  - passage: The work is almost lights out.
    costs: A short, somewhat opaque characterization, but it conveys the source's claim about the intensity of the work.
    verdict: earns_place
  - passage: Blog post time.
    costs: A transition with no information; the space could support one of the omitted contextual details.
    verdict: cut
  - passage: 'I have lots of bad memories here:'
    costs: Personal setup without a specific example; the following technical assessment already carries the useful point.
    verdict: cut
  retentions_summary:
    verdict: section_does_not_pay
    severity: major
    note: The 'Blog post time' transition and 'I have lots of bad memories here' preamble are expendable, though most retained passages carry the argument or its concrete recommendations.
  shape:
    source_sections:
    - Software factories are super real but we need to be realistic
    - Factories are not a token or LLM problem
    - Do not make the service bus non-deterministic
    manuscript_sections:
    - Software factories are super real but we need to be realistic
    - Factories are not a token or LLM problem
    - Do not make the service bus non-deterministic
    verdict: source_shaped
    severity: major
    note: As a faithful edit collecting three posts, preserving their sequence is appropriate.
  position:
    verdict: has_position
    note: It argues directly that factory reliability is a systems and corporate-culture problem and recommends deterministic, established service-bus infrastructure.
  notes: |
    Approved because it collects three scattered posts into one readable argument while preserving the central thesis, concrete infrastructure checklist, named service-bus options, and Temporal recommendation.
evidence:
  result: changes_required
  findings:
  - severity: major
    article: factory-systems-problem
    locator: ' | If someone is selling you a factory rn and isn’t in the very small cohort of roughly ten people who have been trying, and realistically failing, to solve this over the last two years, they are selling bullshit. | 1'
    repair_from: ' | Software factories are super real but we need to be realistic. | 1'
    category: qualification_loss
    disposition: fix
    note: |
      The source describes a super-small cohort, likely including startups created
      in the last six months, or circa fewer than ten people in the who's-who.
      The manuscript turns this into a single cohort of roughly ten people and
      drops the source's alternative and qualification.
