shape:
  result: changes_required
  findings:
  - severity: major
    article: factory-systems-problem
    locator: '- | At home, in your homelab, you should be cracking on this problem space in your free time and showing it at your next interview or in a recorded talk at a meetup. | 1'
    repair_from: '- | At home, in your homelab, you should be cracking on this problem space in your free time and showing it at your next interview or in a recorded talk at a meetup. | 1'
    category: duplication
    disposition: editor_decision
    note: |
      The first paragraph gives the same career-and-demonstration advice twice. It
      first says, "At home, in your homelab, you should be cracking on this problem
      space in your free time and showing it at your next interview or in a
      recorded talk at a meetup." It then repeats the idea as, "The highest ROI you
      can have right now is learning the entire damn stack, automating it and
      showing it at your next interview/doing a recorded talk at a meetup."
    suggestion: Keep one version of the interview-and-talk recommendation.
  - severity: major
    article: factory-systems-problem
    locator: '- | n8n was a silly idea, which I’ve always suspected was developed by young folks in Silicon Valley who are all in on the LLM craze who have never worked in corporate in their life thus didn’t have the knowledge that service busses are a solved problem and there’s deep prior art in the spooky land of enterprise. | 1'
    repair_from: '- | I must stress that factories are not a token or LLM problem. | 1'
    category: missing_transition
    disposition: fix
    note: |
      The piece moves from its general systems-engineering thesis directly into a
      hostile evaluation of n8n. The reader has to infer that n8n is the concrete
      case illustrating the preceding claim.
    suggestion: Add a transition that frames n8n and service-bus determinism as the thesis’s concrete example.
  scores:
    order: 4
    coherence: 3
    opening: 4
    ending: 3
  notes: |
    I verified that the piece proceeds from the state of software factories, to its
    systems-engineering thesis, to a service-bus example, but repetition and the
    unmarked jump into n8n weaken the arrangement.
craft:
  result: changes_required
  findings:
  - severity: major
    article: factory-systems-problem
    locator: ' | Look up anything in the @dotnet space such as MassTransit, NServiceBus, WCF if you wanna steal ideas for prompting. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Three consecutive imperative sentences—"Look up anything...", "Use it and have a job invoke an agent as a process.", and "Don't make the entire service bus non-deterministic."—create a noticeable command pattern. The remedy is editorial: cut or recast one of the commands.
  - severity: minor
    article: factory-systems-problem
    locator: ' | DevEx | 1'
    category: jargon
    disposition: fix
    note: |
      "DevEx" is unexplained specialist shorthand. Define it on first use or replace it with plain language.
  - severity: minor
    article: factory-systems-problem
    locator: ' | The work is almost lights out. | 1'
    category: dead_words
    disposition: fix
    note: |
      "Almost lights out" is an opaque metaphor here; it does not clarify what the work entails or why it matters.
  scores:
    voice: 4
    sentence_variety: 3
    economy: 2
  notes: |
    I heard a forceful, opinionated person throughout, but the piece loses economy when its commands and broad shorthand accumulate faster than the argument can sharpen.
