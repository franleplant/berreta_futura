    qualification_survival: 3
    quote_accuracy: 5
    attribution: 5
  notes: |
    I checked the title, body assertions, examples, numbers, attributions, and
    conclusions against all three pinned extractions; the cohort qualification is
    materially narrowed in the manuscript.
