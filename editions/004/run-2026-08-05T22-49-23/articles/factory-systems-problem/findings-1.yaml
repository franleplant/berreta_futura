    suggestion: The factory is a systems problem
  - severity: major
    article: factory-systems-problem
    locator: '- | If someone is selling you a factory rn and they aren’t in the super small cohort | 1'
    category: grammar
    disposition: editor_decision
    note: |
      The sentence is structurally malformed: the alternatives after "if" do not resolve cleanly, and "who have been trying" has no clear grammatical antecedent. The sentence is retained source prose, so an editor chooses the remedy.
    suggestion: If someone is selling you a factory rn and is not in the very small cohort of roughly ten people who have been trying, and often failing, to solve this over the last two years, they are selling bullshit.
