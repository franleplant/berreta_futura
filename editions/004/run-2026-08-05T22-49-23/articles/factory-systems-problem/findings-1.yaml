craft:
  result: changes_required
  findings:
  - severity: minor
    article: factory-systems-problem
    locator: '- | Software factories are super real but we need to be realistic. | 1'
    category: weak_opening_sentence
    disposition: fix
    note: |
      The opening announces a posture instead of beginning with the argument.
      It uses "super real" and "we need to be realistic" as throat-clearing.
    suggestion: |
      Open with the concrete claim that factory reliability is a systems problem, then establish the state of the field.
  - severity: minor
    article: factory-systems-problem
    locator: '- | Almost lights out. | 1'
    category: dead_words
    disposition: fix
    note: |
      This fragment is an unexplained intensifier and does not tell the reader what the listed infrastructure work accomplishes.
    suggestion: |
      Replace it with a direct sentence explaining the practical consequence of the preceding stack.
  - severity: major
    article: factory-systems-problem
    locator: '- | At home, in your homelab, you should be cracking on this problem space in your free time if you want a super fast promotion and red carpet service at your next interview. | 1'
    category: dead_words
    disposition: fix
    note: |
      The sentence shifts into empty motivational and career-marketing language: "super fast promotion" and "red carpet service" are decorative promises rather than part of the argument.
    suggestion: |
      Cut the career promise and retain only the specific reason to build and demonstrate the stack.
  - severity: minor
    article: factory-systems-problem
    locator: '- | smashing corporate friction in the realm of DevEx for agents. | 1'
    category: jargon
    disposition: fix
    note: |
      "DevEx" is unexplained specialist shorthand, and the phrase around it is abstract enough that an engineer outside this subfield may not know what work is meant.
    suggestion: |
      Spell out developer experience and name the concrete friction being removed.
  - severity: minor
    article: factory-systems-problem
    locator: '- | It isn’t cracked but it’s a puzzle that’s being solved daily. | 1'
    category: passive
    disposition: fix
    note: |
      "Is being solved daily" hides the actors doing the solving and turns a precise claim into a generic process statement.
    suggestion: |
      Name who is developing these practices or state plainly what remains unresolved.
  - severity: minor
    article: factory-systems-problem
    locator: '- | service busses are a solved problem and there’s deep prior art in the spooky land of enterprise. | 1'
    category: dead_words
    disposition: fix
    note: |
      "The spooky land of enterprise" is a decorative metaphor that does not explain the underlying service-bus mechanism.
    suggestion: |
      Replace the metaphor with the specific enterprise systems or constraints being referenced.
  - severity: minor
    article: factory-systems-problem
    locator: '- | Lots of bad memories here, not great tech impl but the theory / education is generally on point. | 1'
    category: weak_close
    disposition: fix
    note: |
      The closing line trails into shorthand and personal reaction, leaving the reader with no sharper conclusion about the recommendation.
    suggestion: |
      End by stating the operational principle the examples establish: keep orchestration deterministic and invoke agents inside it.
  scores:
    voice: 4
    sentence_variety: 3
    economy: 2
