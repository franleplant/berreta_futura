craft:
  result: changes_required
  findings:
  - severity: blocking
    article: factory-systems-problem
    locator: '- | Software factories are super real, but we need to be realistic. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Six sentences rely on the same copular "X is Y" shape: "Software factories are super real", "It isn't cracked, but it's a puzzle", "The best practices right now are to build", "The work is almost lights out", "It's a systems engineering and corporate culture problem", and "It's time for a blog post." The repetition makes the argument sound assembled from declarations; cut or recast several of these sentences.
  - severity: minor
    article: factory-systems-problem
    locator: '- | The innovators are toying around with discovering practices and pieces. | 1'
    category: dead_words
    disposition: fix
    note: |
      "Toying around with discovering practices and pieces" is vague abstraction that does not tell the reader what the innovators are actually doing. Replace it with the specific practice or experiment being discovered.
  - severity: minor
    article: factory-systems-problem
    locator: '- | which entails solving non-agent topics | 1'
    category: jargon
    disposition: fix
    note: |
      "Non-agent topics" is undefined shorthand for a competent engineer outside this niche. Name the concrete systems concerns meant here.
  - severity: minor
    article: factory-systems-problem
    locator: '- | smashing corporate friction in the realm of DevEx for agents | 1'
    category: jargon
    disposition: fix
    note: |
      "DevEx" arrives as unexplained insider shorthand. Spell out the term or describe the developer-experience problems directly.
  scores:
    voice: 4
    sentence_variety: 2
    economy: 2
  notes: |
    I hear a forceful, opinionated engineer, but the piece leans on repeated declarative constructions and several abstractions that blur its strongest systems argument.
