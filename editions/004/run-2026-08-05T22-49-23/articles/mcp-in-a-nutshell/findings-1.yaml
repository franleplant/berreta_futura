craft:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | MCP has two layers. The data layer defines the JSON-RPC 2.0 messages and the things clients and servers can offer. The transport layer handles connection setup, message framing, authentication, and the channel itself. The same JSON-RPC messages can travel over either transport. Stdio is direct process communication with no network overhead. Streamable HTTP uses HTTP POST, can stream with Server-Sent Events, and supports normal HTTP authentication methods. MCP recommends OAuth for obtaining tokens. | 1'
    category: jargon
    disposition: fix
    note: |
      This paragraph introduces a dense run of unexplained specialist terms—JSON-RPC 2.0, stdio, Streamable HTTP, Server-Sent Events, and OAuth—before the reader has enough context to understand them. Define the few terms needed for the explanation in plain language or remove the implementation detail.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | Sampling and logging are deprecated as of protocol version `2026-07-28`; new implementations should call language-model providers directly and send logs to stderr or use OpenTelemetry. | 1'
    category: jargon
    disposition: fix
    note: |
      `OpenTelemetry` is introduced without explanation and is not necessary to understand the protocol's main boundary. Briefly identify it as a standard observability system or omit the name.
  scores:
    voice: 4
    sentence_variety: 4
    economy: 4
  notes: |
    I heard a lucid, technically minded explainer whose main craft problem is the accumulation of undefined implementation vocabulary in an otherwise reader-facing piece.
