craft:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | Servers offer three kinds of building blocks. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Three consecutive definition sentences use the same subject-verb-object
      shape: "A tool performs an action such as a file operation, API call, or
      database query." "A resource supplies context such as file contents,
      database records, or an API response." "A prompt supplies a reusable
      interaction pattern, including system prompts and few-shot examples."
      The repetition makes this paragraph sound catalogued rather than written.
    suggestion: |
      Recast or cut one of the three definitions so the paragraph does not march
      through identical sentence shapes.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | and the usual `_meta` fields. | 1'
    category: jargon
    disposition: fix
    note: |
      "`_meta` fields" is protocol-specific jargon that the piece uses without
      explaining what metadata they carry or why the reader needs them.
    suggestion: |
      Add a brief plain-language gloss for `_meta`, or remove the phrase from
      this example.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | new implementations should write to stderr for stdio transports or use OpenTelemetry. | 1'
    category: jargon
    disposition: fix
    note: |
      "OpenTelemetry" appears as an unexplained implementation term; a competent
      engineer outside observability work may not know what role it plays here.
    suggestion: |
      Identify OpenTelemetry as a standard observability and tracing system, or
      describe the needed logging destination without naming it.
  scores:
    voice: 4
    sentence_variety: 3
    economy: 4
  notes: |
    I heard a clear, patient technical explainer whose voice flattens briefly into
    a catalogue in the building-blocks paragraph, with two small pockets of
    unexplained implementation jargon.
