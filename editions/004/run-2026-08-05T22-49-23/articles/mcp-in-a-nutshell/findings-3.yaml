mechanics:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | Sampling, which let servers request language-model completions through the client | 1'
    category: agreement
    disposition: fix
    note: |
      "Sampling" is singular, so the relative-clause verb must be "lets," not "let." This is editorial prose in a faithful synthesis.
    suggestion: Sampling, which lets servers request language-model completions through the client
  scores:
    grammar: 4
    typography: 5
    consistency: 5
  notes: |
    One subject-verb agreement error requires correction; capitalization, typography, and consistency are otherwise clean.
