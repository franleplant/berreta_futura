craft:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | MCP has two layers. | 1'
    category: no_voice
    disposition: fix
    note: |
      The voice disappears here into an even, system-produced register: layered abstractions,
      protocol terminology, and declarative explanations continue without a human angle or
      concrete tension.
    suggestion: Recast this paragraph around one concrete exchange or reader-facing problem before introducing the layers.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | Tools are executable functions for actions such as file operations, API calls, and database queries. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Three consecutive primitive definitions use the same cataloging shape:
      "Tools are executable functions", "Resources provide context", and
      "Prompts are reusable interaction templates." The repetition makes the passage
      sound like documentation rather than written explanation.
    suggestion: Combine or substantially vary these three definitions, cutting one if necessary.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | The data layer defines JSON-RPC 2.0, a format in which one side sends a named request and the other returns a response. | 1'
    category: jargon
    disposition: fix
    note: |
      The piece leaves a dense cluster of specialist terms underexplained, including
      JSON-RPC 2.0, Streamable HTTP, Server-Sent Events, bearer tokens, OpenTelemetry,
      durable handles, and several protocol method names.
    suggestion: Define or remove the first unfamiliar implementation term in each cluster, prioritizing the concepts a general engineer needs to follow the example.
  scores:
    voice: 2
    sentence_variety: 3
    economy: 3
  notes: |-
    I heard a technically competent explainer whose human voice fades into protocol documentation,
    especially in the layers and primitives passages, while a repeated catalog shape and dense
    unexplained terminology reinforce that effect.
