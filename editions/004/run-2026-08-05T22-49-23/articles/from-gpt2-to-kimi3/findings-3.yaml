craft:
  result: changes_required
  findings:
  - severity: blocking
    article: from-gpt2-to-kimi3
    locator: '- | Linear attention replaces those reads and writes with state updates, but its feature map is a less expressive approximation to the softmax kernel, so the practical accuracy loss depends on the architecture and workload. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Six contrast constructions make the prose sound templated: "Linear attention replaces those reads and writes with state updates, but its feature map is a less expressive approximation to the softmax kernel, so the practical accuracy loss depends on the architecture and workload"; "The fixed state is cheaper, but it cannot preserve every earlier association as a separate record"; "DeltaNet can replace one association, but memory also needs a way to fade when the context changes"; "This frees capacity, but it forgets every association together"; "Scaling laws remain relevant, but capacity must be added in the right place and in a form the system can use"; and "A growing cache avoids recomputation but consumes bandwidth." The remedy is editorial: cut or recast enough of these sentences to break the pattern.
  - severity: major
    article: from-gpt2-to-kimi3
    locator: '- | GPT-2 keeps a separate key and value for each earlier token in its KV cache. | 1'
    category: jargon
    disposition: fix
    note: |
      The piece introduces several unexplained specialist terms and acronyms, including KV cache, D×D state, ELU+1, softmax kernel, MLA, MLP, FLOPs, SiTU, AttnRes, and KDA. A competent engineer outside this subfield may follow the narrative but not the machinery. Define the essential terms at first use and remove or gloss the rest.
  - severity: minor
    article: from-gpt2-to-kimi3
    locator: '- | The update is simple: | 1'
    category: dead_words
    disposition: fix
    note: |
      "The update is simple" is an empty assessment before the code and adds no information. Replace it with a direct description of what the snippet updates.
  - severity: minor
    article: from-gpt2-to-kimi3
    locator: '- | Scaling laws remain relevant, but capacity must be added in the right place and in a form the system can use. | 1'
    category: dead_words
    disposition: fix
    note: |
      This abstraction stack ("remain relevant", "the right place", "a form the system can use") postpones the concrete claim. State which kinds of capacity the lineage adds and what limitation each addresses.
  scores:
    voice: 4
    sentence_variety: 2
    economy: 4
  notes: |
    I heard a technically assured explainer whose concrete mechanisms and occasional first-person aside keep it human, but six contrast sentences create a detectable template and several abstractions leave the reader to supply definitions.
