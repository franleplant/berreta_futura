worth:
  result: approved
  findings: []
  omissions:
  - fact: GPT-2 is explicitly a decoder-only model with token and positional embeddings, 12 layers, 12 heads, 768-dimensional states, and about 124M parameters.
    reader_loses: The baseline's concrete scale and the decoder-only computation pattern are less grounded.
    verdict: defensible
  - fact: GPT-2's attention applies causal masking, softmax, dropout, and an output projection after forming q, k, and v.
    reader_loses: Some implementation context for what later attention variants are changing.
    verdict: defensible
  - fact: Without caching, autoregressive decoding recomputes all prior-token projections and representations at every step.
    reader_loses: The precise source of the KV-cache saving.
    verdict: defensible
  - fact: Each decode step makes two N-dimensional reads and two one-dimensional writes to HBM, while the cache grows linearly in sequence length.
    reader_loses: A concrete hardware explanation for the bandwidth bottleneck.
    verdict: defensible
  - fact: Linear attention maintains both the D-by-D state S and the normalization vector z, computing qS divided by qz.
    reader_loses: The operational denominator needed to implement normalized linear attention.
    verdict: defensible
  - fact: The source distinguishes the paper's misleading O(N^2) framing from FlashAttention and from historical implementations that recomputed token history.
    reader_loses: A clearer account of which quadratic costs were real and which optimization changed them.
    verdict: defensible
  - fact: DeltaNet's chunking cost separates a fixed 2Ld^2 state term from a 2LCd within-chunk term; C=1 is linear attention, C=N is full attention, and practical chunks are often 64 or 128.
    reader_loses: The quantitative reason chunk size interpolates between the two extremes and why hardware-friendly intermediate chunks matter.
    verdict: defensible
  - fact: The source gives the vectorized forward-substitution construction that computes all DeltaNet corrections within a chunk.
    reader_loses: A reader could understand the recurrence but not reproduce the parallel algorithm.
    verdict: defensible
  - fact: Mamba-2 is identified as the contribution supplying the uniform decay update, and Gated Delta's cumulative decay is described as a multiplicative prefix-sum analogue.
    reader_loses: Attribution and the exact mechanism by which decay propagates through time.
    verdict: defensible
  - fact: Kimi Linear's three changes are listed as interleaved MLA, MoE replacing the MLP, and the alpha projection providing fine-grained decay control.
    reader_loses: The explicit decomposition of what distinguishes Kimi Linear from DeltaNet.
    verdict: defensible
  - fact: KimiK3's AttnRes adds roughly 2% inference latency, provides a reported 1.25x compute advantage, and forms eight blocks across the macrocycles.
    reader_loses: The quantitative trade-off and scale of the blockwise residual design.
    verdict: defensible
  - fact: The source includes the SiTU activation equations, MLA query LoRA, and the detailed Gated MLA/output-gating changes.
    reader_loses: The exact implementation of several KimiK3 refinements is unavailable without consulting the source.
    verdict: defensible
  - fact: The post's publication time and social response are omitted.
    reader_loses: Only provenance and reception context, not architectural understanding.
    verdict: defensible
  retentions:
  - passage: A language model must keep useful information somewhere.
    costs: A short framing paragraph, but it establishes the memory-centered question that organizes the entire lineage.
    verdict: earns_place
  - passage: 'The basic attention contract remains:'
    costs: A compact teaching aside that makes the linear-attention approximation intelligible before the later mechanisms.
    verdict: earns_place
  - passage: Scaling laws remain relevant, but capacity must be added in the right place
    costs: A transition that restates the progression, but it states the manuscript's synthesis rather than merely repeating a source section.
    verdict: earns_place
  - passage: The progression from GPT-2 to KimiK3 is a set of repairs to memory failure.
    costs: A concluding synthesis paragraph, justified because it names the causal relationship among the mechanisms.
    verdict: earns_place
  - passage: A fixed-capacity associative memory eventually needs an eviction policy.
    costs: A final restatement of the thesis, but it leaves the reader with the general principle connecting gating, routing, decay, and retrieval.
    verdict: earns_place
  notes: |
    The piece gives a reader a compact causal map from KV-cache bandwidth limits through fixed-state interference to Delta updates, gating, hybrid retrieval, sparse experts, and selective residual access, making the source's architectural lineage legible as a sequence of repairs.
