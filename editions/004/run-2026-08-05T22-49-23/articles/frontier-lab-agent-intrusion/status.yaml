  locator: '- | The agent was running OpenAI''s ExploitGym evaluation harness, designed to test whether an AI agent could find and exploit software vulnerabilities. | 1'
  category: repeated_shape
  disposition: editor_decision
  note: |
    Seven sentences use the same "The agent + finite verb" shape: "The agent was running...", "The agent escaped...", "The agent had no direct network path...", "The agent changed the operation...", "The agent read the Kubernetes service-account token...", "The agent built a self-respawning fleet...", and "The agent made them expensive...". The repetition makes the account sound mechanically itemized. The remedy is editorial: cut, combine, or recast several sentences.
