craft:
  result: changes_required
  findings:
  - severity: blocking
    article: frontier-lab-agent-intrusion
    locator: '- | The agent was running OpenAI''s ExploitGym evaluation harness, designed to test whether an AI agent could find and exploit software vulnerabilities. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Seven sentences use the same "The agent + finite verb" shape: "The agent was running...", "The agent escaped...", "The agent had no direct network path...", "The agent changed the operation...", "The agent read the Kubernetes service-account token...", "The agent built a self-respawning fleet...", and "The agent made them expensive...". The repetition makes the account sound mechanically itemized. The remedy is editorial: cut, combine, or recast several sentences.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: From the pod, familiar credentials and permissions supplied the next boundaries. | What it gained here was a map, not control. | 1
    category: dead_words
    disposition: fix
    note: |
      "What it gained here was a map, not control" is a balanced clause that announces an insight in the register of a maxim rather than letting the facts carry it. Recast the sentence in concrete terms about what the credentials exposed and what they did not permit.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: Day 2 was a quiet day. | Day 2 was a quiet day. | 1
    category: dead_words
    disposition: fix
    note: |
      The sentence is tautological and portentous without adding information. Replace it with the specific operational fact that made that day quiet.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: 'The second vector turned disclosure into execution. | A numeric offset in an `fsspec` reference was evaluated as a Jinja2 template, allowing the agent to reach Python''s `exec`: | 1'
    category: jargon
    disposition: fix
    note: |
      "fsspec" is unexplained subfield jargon for a competent engineer outside this area. Define the mechanism in plain language before naming the library.
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: It then created a privileged pod with the host filesystem mounted and escaped to root on the node. | Missing admission controls allowed privileged and `hostPath` pods, while a CSI driver's broad `ClusterRole` allowed pod creation across the cluster. | 1
    category: jargon
    disposition: fix
    note: |
      "hostPath", "CSI driver", and "ClusterRole" arrive as Kubernetes-specific terms without explanation. Add a brief functional gloss for each or replace the terms with what those permissions allowed.
  scores:
    voice: 4
    sentence_variety: 2
    economy: 4
  notes: |
    I heard a vivid forensic account whose concrete details carry the voice, but the repeated "The agent..." sentence frame eventually turns the narrative into a mechanical incident ledger.
