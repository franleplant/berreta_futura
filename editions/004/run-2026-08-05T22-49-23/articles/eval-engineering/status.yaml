  repair_from: '- | Everyone is renting the same brain now | 1'
  category: source_shaped
  disposition: fix
  note: |
    The manuscript follows the source's sequence almost exactly: shared models and the travel-agent failure, what eval engineering is, installation and benchmark results, verdict-driven routing, trace mining and Harbor tasks, autonomous merging, then the starter suite and conclusion. The synthesis clarifies and compresses that sequence but does not make an editorial decision about its shape.
  suggestion: Reorder the material around the central claim that verdicts change the next edge—for example, lead with the thermostat/routing loop, then supply the benchmark, installation, and implementation steps as support.
