    locator: ' | Before collecting data, run /evalkit.plan with an instruction to map the repository''s entrypoint, tools, backing data, and result shape, read the 25 traces in ./traces, propose eval candidates grounded in what actually failed, and recommend one before implementation. | 1'
    repair_from: ' | Before collecting data, run /evalkit.plan with an instruction to map the repository''s entrypoint, tools, backing data, and result shape, read the 25 traces in ./traces, propose eval candidates grounded in what actually failed, and recommend one before implementation. | 1'
