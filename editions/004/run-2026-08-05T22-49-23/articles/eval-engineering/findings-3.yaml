    quote_accuracy: 5
    attribution: 4
  notes: |
    I checked the title, headings, body claims, figures, commands, numbers, attributions, quotations, and conclusions against the pinned extraction; external material and the truncated remainder of the /evalkit.plan command could not be checked.
