      The extraction shows an /evalkit.plan command, but its displayed instruction is truncated after "for grounding and to". The detailed repository-mapping, 25-trace, candidate-proposal, and recommendation instructions appear separately as a generic skill prompt, not as the documented /evalkit.plan command. The manuscript presents those details as belonging to that command without support in the pinned extraction.
