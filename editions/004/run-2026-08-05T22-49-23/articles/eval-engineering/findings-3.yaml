shape:
  result: changes_required
  findings:
  - severity: major
    article: eval-engineering
    locator: '- | The travel agent should fail the first when its search returns nothing | 1'
    repair_from: '- | For the travel agent, an empty tool result is a separate failure | 1'
    category: duplication
    disposition: fix
    note: |
      The travel-agent empty-result example is explained twice: first as a routing
      failure requiring acknowledgment, then again as the first test the suite
      should contain. The later repetition weakens the progression from method to
      durable test.
    suggestion: Keep the first explanation and refer back to it briefly when introducing the initial test suite.
  scores:
    order: 4
    coherence: 4
    opening: 5
    ending: 5
  notes: |-
    I verified that the piece progresses from the evaluation problem through routing,
    implementation, judging, and operational safeguards, with one repeated travel-agent
    failure example interrupting an otherwise coherent arc.
craft:
  result: changes_required
  findings:
  - severity: blocking
    article: eval-engineering
    locator: '- | Run the gate in shadow mode for at least four hours of real traffic, merging nothing. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      The piece uses at least seven imperative sentences in a concentrated run: "Run the gate in shadow mode for at least four hours of real traffic, merging nothing", "Keep it closed when automated and human verdicts differ by more than 2 percent", "Sample 1 to 5 percent of traces", "Open the gate on the boring 80 percent and keep the risky slice under review", "Keep the suite alive", "Hold out 300 to 800 cases and keep 500 running in under five minutes", and "Begin with an empty tool result, a repeated call, a boundary refusal, handoff integrity, and verified completion." The reader hears a procedure manual rather than a person. The remedy is editorial: cut or consolidate several commands.
  - severity: minor
    article: eval-engineering
    locator: '- | Low context recall can reject a handoff. | 1'
    category: jargon
    disposition: fix
    note: |
      "Context recall" is specialized evaluation terminology and is not defined for a competent engineer outside this subfield.
    suggestion: Define context recall in plain language at its first use.
  - severity: minor
    article: eval-engineering
    locator: '- | Choose the dataset type deliberately: `final_response`, `single_step`, `trajectory`, or `RAG`. | 1'
    category: jargon
    disposition: fix
    note: |
      "RAG" is presented as a dataset type without expansion, leaving a reader outside the immediate field to infer its meaning.
    suggestion: Expand RAG on first use.
  - severity: major
    article: eval-engineering
    locator: '- | A score can describe the past. | 1'
    category: weak_close
    disposition: fix
    note: |
      The final pair, "A score can describe the past. The examiner decides what happens next.", restates the earlier score-versus-routing contrast and ends in a slogan rather than leaving a new consequence or question.
    suggestion: Replace the closing pair with one concrete implication for how a team should use its next evaluation result.
  - severity: minor
    article: eval-engineering
    locator: '- | The order matters. | 1'
    category: dead_words
    disposition: fix
    note: |
      "The order matters." is a portentous signpost whose meaning is supplied immediately by the following sentences.
    suggestion: Cut the sentence and begin directly with the sequence it introduces.
  scores:
    voice: 4
    sentence_variety: 2
    economy: 4
  notes: I heard a vivid, technically grounded voice that gradually turns into a dense sequence of procedural imperatives, with a closing contrast that sounds more like a maxim than a final discovery.
