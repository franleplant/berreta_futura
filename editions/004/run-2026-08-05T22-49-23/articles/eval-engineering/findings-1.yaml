shape:
  result: changes_required
  findings:
  - severity: blocking
    article: eval-engineering
    locator: '- | The sentence: A reader gets a working path from a polished but ungrounded answer to an evaluation loop that changes the agent''s next action, using the travel agent as the thread. | 1'
    repair_from: '- | The sentence: A reader gets a working path from a polished but ungrounded answer to an evaluation loop that changes the agent''s next action, using the travel agent as the thread. | 1'
    category: opening
    disposition: fix
    note: |
      The manuscript opens with editorial process notes rather than the argument itself. The reader must pass through a statement of intent and a list of omissions before reaching the actual point of interest.
    suggestion: Remove the process notes and open directly with the travel-agent failure or the model-parity claim.
  - severity: major
    article: eval-engineering
    locator: 'The model will be replaced. The examiner remains: the failures turned into tests, the rules that change the next edge, and the track record that lets a machine merge its own work. | 1'
    repair_from: The software travel agent answered a simple trip question with an exchange rate, the week's temperature, and a museum's opening hours. | 1
    category: running_example
    disposition: fix
    note: |
      The opening promises the travel agent as the thread, but the concrete case disappears after the initial diagnosis. The later sections introduce general examples and procedures without returning to that agent, so the piece reads as a sequence of explanations rather than one carried-through case.
    suggestion: Return to the travel agent when introducing the eval loop, routing verdicts, and gate, showing how each mechanism changes that run.
  scores:
    order: 4
    coherence: 4
    opening: 1
    ending: 4
  notes: |
    The piece moves coherently from model parity to a hallucinating travel agent, then to evaluation loops, judges, routing, and autonomous gates, but its opening is occupied by process notes and its promised running example is not sustained.
craft:
  result: changes_required
  findings:
  - severity: major
    article: eval-engineering
    locator: '- | The sentence: A reader gets a working path from a polished but ungrounded answer to an evaluation loop that changes the agent''s next action, using the travel agent as the thread. | 1'
    category: weak_opening_sentence
    disposition: fix
    note: |
      The piece opens with editorial summary and omission notes rather than an article sentence. The framing announces the argument before the reader encounters it.
    suggestion: |
      Remove the two setup lines and begin with "Everyone is renting the same brain now."
  - severity: minor
    article: eval-engineering
    locator: ' | Specific, clean, useful-sounding. | 1'
    category: dead_words
    disposition: fix
    note: |
      This decorative triad and fragment labels the answer instead of showing its effect.
    suggestion: |
      Replace the triad with one concrete sentence describing why the answer appeared trustworthy.
  - severity: minor
    article: eval-engineering
    locator: ' | That layer is the distance between an AI that impresses people and one that gets paid. | 1'
    category: dead_words
    disposition: fix
    note: |
      The balanced clause performs a ready-made insight and compresses several different outcomes into a slogan.
    suggestion: |
      State the operational distinction directly: evaluation determines whether failures alter the agent's next action.
  - severity: minor
    article: eval-engineering
    locator: ' | The wiring is direct. | 1'
    category: dead_words
    disposition: fix
    note: |
      This portentous short sentence announces a transition without adding information.
    suggestion: |
      Delete it and let the following routing examples make the connection.
  - severity: minor
    article: eval-engineering
    locator: ' | The category was unbundling itself into the terminal already open. | 1'
    category: dead_words
    disposition: fix
    note: |
      "Unbundling" is corporate abstraction, and the terminal metaphor decorates a point that the preceding facts already establish.
    suggestion: |
      Say plainly that evaluation capabilities were moving into coding-agent workflows.
  - severity: major
    article: eval-engineering
    locator: ' | Start with 25 complete traces, chosen so good and bad behavior sit beside each other: a normal request, a user-confirmed success, a correction or rephrasing, a failed or repeated tool call, and an external failure such as a timeout or rate limit. | 1'
    category: passive
    disposition: fix
    note: |
      The article repeatedly issues ownerless imperatives: "Start with 25 complete traces", "Turn the finding into a folder", "Keep the suite alive", "Begin with five evals", and "Install one skill." The unnamed actor makes the procedure sound like system output.
    suggestion: |
      Name the responsible team or role once, then vary the remaining instructions or fold them into prose.
  - severity: minor
    article: eval-engineering
    locator: ' | Choose the dataset type deliberately: `final_response`, `single_step`, `trajectory`, or `RAG`. | 1'
    category: jargon
    disposition: fix
    note: |
      "Trajectory" and especially "RAG" arrive as unexplained taxonomy; a competent engineer outside evaluation work cannot infer the distinctions reliably from this sentence.
    suggestion: |
      Define each term briefly at first use or replace the list with the behavior each dataset captures.
  - severity: minor
    article: eval-engineering
    locator: ' | That is what decides whether the $200 on the card statement produces a demo or a business. | 1'
    category: ai_phrasing
    disposition: fix
    note: |
      The closing claim assigns a sweeping business verdict to the evaluation layer without demonstrating that certainty, turning a useful conclusion into a slogan.
    suggestion: |
      End on the narrower demonstrated claim: the loop determines whether the model's failures become tests and alter future runs.
  scores:
    voice: 4
    sentence_variety: 4
    economy: 3
  notes: |
    I heard a vivid, technically grounded argument whose voice thins when the prose shifts into editorial framing, taxonomic lists, and procedural imperatives.
