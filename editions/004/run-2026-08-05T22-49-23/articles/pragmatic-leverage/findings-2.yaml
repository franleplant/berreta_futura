worth:
  result: changes_required
  findings:
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | Even before AI, only 25-50% of the time to ship a feature was writing the code itself. | 1
    repair_from: '- | Even before AI, only 25-50% of the time to ship a feature was writing the code itself. | 1'
    category: no_position
    disposition: fix
    note: |
      The manuscript faithfully condenses the source's argument but supplies no magazine-level ordering judgment, defended cut, or claim of its own; it remains a paraphrase, even though the source is made more accessible as a faithful edit.
    suggestion: Add a brief framing sentence that states what practical judgment this piece wants the reader to take away.
  omissions:
  - fact: The opening explanation that this is an addendum or side-quest to a recent series, published standalone because it did not fit the main post.
    reader_loses: Less context about why the piece exists and how it relates to the author's larger series.
    verdict: defensible
  - fact: 'The reference to Why Software Factories Fail part 2: Turning the lights back on.'
    reader_loses: A pointer to related material, but not a fact needed to understand the argument.
    verdict: defensible
  - fact: The source heading Seeking Leverage.
    reader_loses: Only a navigational label; the manuscript's opening paragraphs provide the same transition.
    verdict: defensible
  - fact: The source's explicit 'If you're only using AI to write the code' phrasing.
    reader_loses: Nothing substantive; the manuscript preserves the same contrast and numbers.
    verdict: defensible
  - fact: The note marker introducing the explanation that probability and pain are being blurred into one percentage.
    reader_loses: The manuscript keeps the qualification and the distinction, so the warning remains clear.
    verdict: defensible
  - fact: The phrase 'If you draw this out' before the inverse-relationship claim.
    reader_loses: No meaning; the relationship is stated directly.
    verdict: defensible
  - fact: The closing 'good luck.'
    reader_loses: Only a sign-off, not operational or argumentative substance.
    verdict: defensible
  retentions:
  - passage: Even before AI, only 25-50% of the time...
    costs: The opening establishes the central premise that coding is only part of delivery; removing it would make the later leverage claim harder to assess.
    verdict: earns_place
  - passage: Using AI only to write the code means...
    costs: A short contrast that quantifies why coding speed alone is insufficient; it earns the space.
    verdict: earns_place
  - passage: Assume that when you yolo a two-sentence prompt...
    costs: The concrete 50% baseline gives the expected-pain model a usable starting point.
    verdict: earns_place
  - passage: Now let's say you are a principal engineer...
    costs: The 10-year, 100-repo scenario makes clear that even expert specification cannot eliminate all rework.
    verdict: earns_place
  - passage: For this example I'm gonna blur...
    costs: The qualification and button-style example prevent readers from treating the percentages as literal precision.
    verdict: earns_place
  - passage: You need to do this without overindexing...
    costs: The Product-to-technical zoom example supplies the practical boundary on planning and keeps 'pragmatic' from becoming abstract advice.
    verdict: earns_place
  notes: |
    Changes required because the manuscript gives readers an accessible condensation of the source but does not add a distinct magazine-level position. No needed omissions make it over-compressed, and no retained section fails to pay for its space.
