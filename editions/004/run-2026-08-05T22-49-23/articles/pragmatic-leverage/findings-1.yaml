shape:
  result: changes_required
  findings:
  - severity: blocking
    article: pragmatic-leverage
    locator: '- | This one is a bit of an addendum / side-quest to the recent series. | 1'
    repair_from: '- | This one is a bit of an addendum / side-quest to the recent series. | 1'
    category: opening
    disposition: editor_decision
    note: |
      The opening is publication context rather than the piece's point of interest. It delays the argument about where AI-assisted delivery gains leverage and does not earn the first substantive section.
    suggestion: Open with the 25-50% shipping-time split, and move the addendum context into furniture or remove it.
  - severity: major
    article: pragmatic-leverage
    locator: '- | It is referenced briefly in Why Software Factories Fail part 2: Turning the lights back on. | 1'
    repair_from: '- | This one is a bit of an addendum / side-quest to the recent series. | 1'
    category: orphan_referent
    disposition: editor_decision
    note: |
      The standalone piece points readers to an external series and a specifically named prior post that it does not contain, leaving the opening dependent on material outside the argument.
    suggestion: Remove the external-reference sentence from the body or relocate it to non-body furniture.
  - severity: minor
    article: pragmatic-leverage
    locator: Seeking Leverage | Seeking Leverage | 1
    repair_from: Seeking Leverage | Seeking Leverage | 1
    category: heading_not_a_claim
    disposition: fix
    note: |
      The heading names an aspiration rather than the section's argument: coding is only part of delivery time, and planning and alignment are where additional leverage appears.
    suggestion: Rename the heading to state that planning and alignment, not coding alone, create the leverage.
  scores:
    order: 4
    coherence: 4
    opening: 2
    ending: 4
  notes: The piece moves from the share of delivery time spent beyond coding, through expected pain and planning depth, to pragmatic steering; its main structural problems are the contextual opening, dangling external references, and one non-argument heading.
craft:
  result: changes_required
  findings:
  - severity: major
    article: pragmatic-leverage
    locator: Seeking Leverage | If you're only using AI to write the code, then you're taking the 2-4 hours of coding time down to 10-20 minutes, but you haven't accelerated anything else here. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Conditional openings recur throughout the piece: "If you're only using AI...", "But if you use AI...", "Let's assume if you yolo...", "If you draw this out...", "if you've done some work...", "If you're doing multiple phases...", and "If the model is 50% likely...". The pattern becomes audible before the argument develops. Because this is the author's rhythm, the remedy is editorial: cut or restructure several conditional sentences.
  - severity: minor
    article: pragmatic-leverage
    locator: Seeking Leverage | This is what we mean by leverage - and it requires being pragmatic. | 1
    category: dead_words
    disposition: fix
    note: |
      "This is what we mean by leverage" restates the term abstractly before the sentence adds another abstraction. Replace it with the concrete operational consequence of the preceding planning phases.
  - severity: minor
    article: pragmatic-leverage
    locator: '- | This one is a bit of an addendum / side-quest to the recent series. | 1'
    category: weak_opening_sentence
    disposition: fix
    note: |
      The opening announces the article's publishing context instead of giving the reader the leverage claim. Start with the feature-shipping time split or the practical problem the piece will solve.
  scores:
    voice: 4
    sentence_variety: 2
    economy: 3
  notes: I hear a candid practitioner explaining a useful model, but the repeated conditional sentence shape starts carrying the prose and makes the later guidance feel patterned rather than discovered.
