craft:
  result: changes_required
  findings:
  - severity: major
    article: mcp-protocol-update
    locator: Authorization | Authorization clients must validate `iss`, the issuer identifier in an authorization response, and declare their OpenID Connect `application_type`, which tells the authorization server whether the client is a web, native, or other application. | 1
    category: no_voice
    disposition: fix
    note: |
      The voice thins into a changelog in the authorization paragraph: a sequence of requirements and protocol terms with no concrete actor, situation, or consequence for the reader.
    suggestion: |
      Anchor the paragraph in one authorization flow, then attach each requirement to the step where an implementer encounters it.
  - severity: minor
    article: mcp-protocol-update
    locator: 'The same stateless design changes how a server asks for input during a call | Instead of holding an SSE stream open, the server returns an `InputRequiredResult` with a `resultType`, an `inputRequests` entry describing the prompt and its schema, and a `requestState` value: | 1'
    category: jargon
    disposition: fix
    note: |
      `SSE` is not defined, so a competent engineer outside this subfield may not know which streaming mechanism is meant.
    suggestion: |
      Expand `SSE` to “Server-Sent Events (SSE)” on first use.
  - severity: minor
    article: mcp-protocol-update
    locator: The release includes breaking changes beyond transport and lifecycle | The specification also describes refresh-token requests for OpenID Connect-style servers, scope accumulation during step-up authorization, and the `.well-known` discovery suffix. | 2
    category: jargon
    disposition: fix
    note: |
      “Step-up authorization” arrives without definition, leaving a key authorization behavior opaque to readers outside identity work.
    suggestion: |
      Add a short gloss such as “authorization that asks the user for stronger credentials or consent.”
  - severity: minor
    article: mcp-protocol-update
    locator: The release includes breaking changes beyond transport and lifecycle | The specification also describes refresh-token requests for OpenID Connect-style servers, scope accumulation during step-up authorization, and the `.well-known` discovery suffix. | 2
    category: jargon
    disposition: fix
    note: |
      `OpenID Connect` is named as if familiar, but the piece never identifies it as an identity layer built on OAuth.
    suggestion: |
      Briefly identify OpenID Connect as the identity layer involved in these authorization flows.
  - severity: minor
    article: mcp-protocol-update
    locator: This release contains breaking changes. The maintainers do not intend that to become normal. | The feature lifecycle policy sets Active, Deprecated, and Removed stages with at least twelve months between deprecation and the earliest possible removal. | 1
    category: dead_words
    disposition: fix
    note: |
      “The maintainers do not intend that to become normal” is an abstract, institutional reassurance that says less than the concrete twelve-month policy that follows.
    suggestion: |
      Cut the reassurance and let the stated lifecycle rule carry the point.
  - severity: minor
    article: mcp-protocol-update
    locator: The release includes breaking changes beyond transport and lifecycle | The release includes breaking changes beyond transport and lifecycle. | 1
    category: dead_words
    disposition: fix
    note: |
      This sentence is an abstraction-stack introduction: “breaking changes,” “transport,” and “lifecycle” name categories before showing what changed.
    suggestion: |
      Replace the category summary with the first concrete authorization change, or move this sentence after the examples.
  - severity: minor
    article: mcp-protocol-update
    locator: This release contains breaking changes. The maintainers do not intend that to become normal. | With it landed, implementers targeting 2026-07-28 are expected to adopt future revisions without rewriting their transport or lifecycle code. | 2
    category: ai_phrasing
    disposition: fix
    note: |
      The closing claim projects certainty about future revisions and “without rewriting” beyond what the piece has established; “With it landed” also has the impersonal cadence of system prose.
    suggestion: |
      Attribute the expectation to the maintainers and qualify the promise about future rewrites.
  - severity: minor
    article: mcp-protocol-update
    locator: Three operational changes follow | Streamable HTTP now requires `Mcp-Method` and `Mcp-Name` headers, so load balancers, gateways, and rate limiters can route on the operation without inspecting the body; requests are rejected when the headers and body disagree. | 1
    category: passive
    disposition: fix
    note: |
      “Requests are rejected” hides the actor responsible for enforcement; the protocol, server, or gateway could each be doing it.
    suggestion: |
      Name the enforcing component, such as “the server rejects requests when the headers and body disagree.”
  scores:
    voice: 3
    sentence_variety: 4
    economy: 4
  notes: I heard a clear, technically confident synthesis whose voice thins into a protocol changelog in the authorization passage and whose close makes a stronger future promise than the body supports. The concrete examples and operational detail keep the piece readable, but several undefined identity terms and abstract transitions interrupt that clarity.
