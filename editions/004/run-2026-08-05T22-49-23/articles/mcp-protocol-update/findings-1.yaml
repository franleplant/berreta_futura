craft:
  result: changes_required
  findings:
  - severity: minor
    article: mcp-protocol-update
    locator: '- | Three operational changes follow. | 1'
    category: dead_words
    disposition: fix
    note: |
      This portentous signpost sounds like system prose rather than a person
      entering the explanation.
    suggestion: |
      Name the three changes directly or begin with the first one.
  - severity: major
    article: mcp-protocol-update
    locator: '- | A remote MCP server that previously needed sticky sessions, a shared session store, and deep packet inspection at the gateway can now run behind a plain round-robin load balancer, route traffic on an Mcp-Method header, and let clients cache tools/list responses for as long as the server''s ttlMs permits. | 1'
    category: jargon
    disposition: fix
    note: |
      The opening stacks unexplained protocol and infrastructure terms,
      including sticky sessions, deep packet inspection, Mcp-Method, tools/list,
      and ttlMs, before giving the reader a foothold.
    suggestion: |
      Define the few terms needed for the argument in plain language and move
      the remaining identifiers into later technical detail.
  scores:
    voice: 4
    sentence_variety: 4
    economy: 3
  notes: |
    I heard a technically confident, human explanation whose opening assumes too
    much protocol vocabulary and whose later signpost briefly slips into system
    prose.
