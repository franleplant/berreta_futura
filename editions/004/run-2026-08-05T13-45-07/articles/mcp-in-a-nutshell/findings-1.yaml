craft:
  result: changes_required
  findings:
  - severity: blocking
    article: mcp-in-a-nutshell
    locator: 'Primitives | A server can expose three things: tools, resources, and prompts. A tool is a function | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      The definite-article equation—"A [noun] is/can [definition]"—appears 15+ times
      throughout the piece, with 6 consecutive instances in the Primitives section.
      This creates monotony that makes the piece sound like a reference manual
      rather than conversational explanation. The opening and close work well; the
      middle registers as mechanical. The remedy is editorial: restructure these
      sections, tighten the piece, or decide whether it belongs in the issue as is.
  scores:
    voice: 3
    sentence_variety: 2
    economy: 4
  notes: |
    The piece explains MCP's architecture clearly and structurally, but the heavy
    repetition of one sentence shape—particularly the string of "A [noun] is/can"
    definitions—undermines the voice present in the opening. A reader hears the
    pattern before the argument.
