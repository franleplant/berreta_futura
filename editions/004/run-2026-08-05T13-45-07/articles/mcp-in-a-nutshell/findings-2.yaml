shape:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: 'Primitives | A server built around a database can expose all three at once: query tools, a resource holding the schema, and a prompt showing how to use both together. | 1'
    repair_from: 'Primitives | A client can expose one thing back to a server: elicitation. | 1'
    category: missing_transition
    disposition: fix
    note: |
      The paragraph shifts from describing server-side primitives (tools, resources, prompts exemplified by a database server) to client-side primitives (elicitation) without a bridge. A reader follows "servers expose three things" and then encounters "clients expose one thing" with no sentence signaling the shift in direction.
    suggestion: 'Before ''A client can expose one thing back to a server,'' insert a transitional sentence marking the shift: ''Servers expose three primitives. Clients can play one active role: elicitation.'''
  scores:
    order: 4
    coherence: 3
    opening: 5
    ending: 5
  notes: |
    The piece establishes a clear pattern in the opening (discover, ask, listen) and delivers on it across five sections with sound logical structure. The opening is concrete and strong, the ending lands by returning to that pattern and reinforcing scope. One mid-section transition from server-side to client-side primitives is unannounced.
