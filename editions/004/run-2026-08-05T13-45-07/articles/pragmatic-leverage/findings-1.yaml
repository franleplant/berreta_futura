mechanics:
  result: changes_required
  findings:
  - severity: major
    article: pragmatic-leverage
    locator: '- | It didn''t fit cleanly into the main post so I''m publishing it standalone | 1'
    category: punctuation
    disposition: editor_decision
    note: |
      Two independent clauses joined by "so" require a comma between them. The missing comma creates a run-on sentence.
    suggestion: It didn't fit cleanly into the main post, so I'm publishing it standalone.
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | Lets assume if you yolo a two-sentence prompt | 1
    category: spelling
    disposition: editor_decision
    note: |
      "Let's" is the contraction of "let us". The apostrophe is missing here.
    suggestion: Let's assume if you yolo a two-sentence prompt
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | Now lets say you are a principal engineer | 1
    category: spelling
    disposition: editor_decision
    note: |
      "Let's" is the contraction of "let us". The apostrophe is missing here.
    suggestion: Now let's say you are a principal engineer
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | its possible you may need to end it | 1
    category: spelling
    disposition: editor_decision
    note: |
      "It's" is the contraction of "it is". The author has used the possessive form "its" instead.
    suggestion: it's possible you may need to end it
  - severity: major
    article: pragmatic-leverage
    locator: '- | Seeking Leverage | 1'
    category: heading_form
    disposition: fix
    note: |
      Headings use sentence case. Only the first word and proper nouns are capitalized. "Leverage" is a common noun and should be lowercase.
    suggestion: Seeking leverage
  - severity: minor
