    Five major errors found: one run-on sentence, three spelling errors in contractions (Let's vs Lets, it's vs its), one heading in title case instead of sentence case, and a labeled note appearing in article prose. Additionally, four instances of hyphens instead of en dashes in numeric ranges. The piece cannot be approved for publication without revision.
shape:
  result: changes_required
  findings:
  - severity: blocking
    article: pragmatic-leverage
    locator: '- | This one is a bit of an addendum / side-quest to the recent series. | 1'
    repair_from: '- | This one is a bit of an addendum / side-quest to the recent series. | 1'
    category: opening
    disposition: fix
    note: |
      The opening is editorial framing about the article's relationship to other work,
      not the argument itself. A reader enters not knowing what series is meant or why
      that context matters. The actual argument opens at "Even before AI, only 25-50%
      of the time to ship a feature was writing the code itself." Start there.
    suggestion: Remove the meta-commentary and open directly on the observation about shipping time.
  - severity: blocking
    article: pragmatic-leverage
    locator: '- | Good luck. | 1'
    repair_from: '- | There''s no perfect process for this. | 1'
    category: ending
    disposition: fix
    note: |
      The piece stops without resolution. A reader finishes without a clear takeaway
      about how or when to apply pragmatic leverage.
    suggestion: End with a concrete principle or final thought that lands the piece—what should a reader do with this?
  - severity: major
    article: pragmatic-leverage
    locator: Seeking Leverage | But if you use AI to help you plan and align, then you actually get closer to 2-3x faster. | 1
    repair_from: '- | ## The 80/20 rule in AI coding leverage | 1'
    category: missing_transition
    disposition: fix
    note: |
      The first section claims planning yields 2-3x improvement. The next section pivots
      to effort-pain ratios and expected pain formulas without explaining how these
      concepts connect to the promised speedup or why the reader should care about the math.
    suggestion: Add one sentence bridging the promised benefit to the mechanism—e.g., "This speedup comes from managing the tradeoff between planning effort and rework risk."
  - severity: major
    article: pragmatic-leverage
    locator: '- | Seeking Leverage | 1'
    repair_from: '- | Seeking Leverage | 1'
    category: heading_not_a_claim
    disposition: fix
    note: |
      The heading names the topic, not what the section argues. It should state the
      claim the section makes about leverage, not just invoke the concept.
    suggestion: Reframe to "Planning with AI Yields Real Speedup" or "Where AI Planning Actually Helps."
  - severity: major
    article: pragmatic-leverage
    locator: '- | This one is a bit of an addendum / side-quest to the recent series. | 1'
    repair_from: '- | This one is a bit of an addendum / side-quest to the recent series. | 1'
    category: orphan_referent
    disposition: fix
    note: |
      "The recent series," "Why Software Factories Fail part 2," and "the factory"
      are referenced without definition. Readers unfamiliar with that context cannot
      orient themselves or understand what "factory" means here.
    suggestion: Either briefly define the context or remove references that require external knowledge.
  - severity: major
    article: pragmatic-leverage
    category: running_example
    disposition: fix
    note: |
      The piece is entirely abstract—effort percentages, probability formulas, zooming
      levels. No concrete case walks through how a developer would apply this leverage
      principle from planning through implementation. The piece is titled "Pragmatic"
      and described as a "practical account," but no practical instance demonstrates it.
    suggestion: Include one scenario showing a developer deciding how much to plan for a specific task, then executing it, to ground the principle.
  scores:
    order: 2
    coherence: 2
    opening: 1
    ending: 1
  notes: |
    The piece argues for pragmatic planning investment as an AI strategy but opens with
    editorial framing, jumps between theory and application without bridges, and ends
    without resolution. The core insight—effort-to-pain tradeoff—appears but is never
    demonstrated with a concrete case, and key terms like "the factory" remain undefined.
