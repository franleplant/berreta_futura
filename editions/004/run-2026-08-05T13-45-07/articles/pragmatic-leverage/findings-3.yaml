shape:
  result: changes_required
  findings:
  - severity: major
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | You need to do this without overindexing on questions you won't be able to answer without going down a level. | 1
    repair_from: The 80/20 rule in AI coding leverage | You need to do this without overindexing on questions you won't be able to answer without going down a level. | 1
    category: missing_transition
    disposition: fix
    note: |
      The piece establishes that planning effort and expected rework pain are inversely related, then warns against spending six hours planning when ten minutes could cut pain by 80%. It then introduces zooming to technical details as pragmatic, but without explaining how this technique prevents over-planning or fits the effort-pain framework. The reader must infer the connection; it's not stated.
    suggestion: |
      Bridge the jump by explaining when and why you'd zoom down. For example: "Being pragmatic means recognizing when high-level planning has hit its limits—when you can't answer the questions in front of you without understanding the technical constraints. That's when you zoom down."
  scores:
    order: 3
    coherence: 3
    opening: 4
    ending: 3
  notes: |
    The piece establishes a clear thesis (planning matters for AI acceleration) and illustrates the effort-pain tradeoff with specific scenarios, but introduces a second principle (zooming levels) without bridging it to the first.
craft:
  result: changes_required
  findings:
  - severity: blocking
    article: pragmatic-leverage
    category: repeated_shape
    disposition: editor_decision
    locator: Seeking Leverage | If you're only using AI to write | 1
    note: |
      Six "If you X, then/consequence Y" constructions establish structural
      monotony: "If you're only using AI to write", "But if you use AI to help
      you plan", "if you yolo a two-sentence prompt", "if you've done some work
      at the 'Product' level", "If you draw this out", and "If you're doing
      multiple phases of planning". In ~380 words, the pattern becomes visible
      before the substance. The remedy is editorial: cut instances, vary the
      sentence openings, or reconsider the piece's scope.
  scores:
    voice: 4
    sentence_variety: 1
    economy: 4
  notes: |
    The author's pragmatic voice is clear and authentic throughout, but one
    conditional structure overwhelms the piece and erodes sentence variety.
    Changes required due to the blocking repeated shape.
