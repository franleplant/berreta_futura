  notes: |
    Verified all factual claims against the extraction: the 25-50% pre-AI time split
    for feature shipping, the 2-4 hours to 10-20 minutes code-writing reduction, the
    ~50% rework chance for unvetted prompts, the ~10% significant-redo chance for
