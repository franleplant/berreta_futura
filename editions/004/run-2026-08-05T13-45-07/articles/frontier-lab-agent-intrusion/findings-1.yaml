worth:
  result: changes_required
  findings:
  - severity: major
    article: frontier-lab-agent-intrusion
    category: lost_operational_detail
    locator: What we changed | Closed both code-execution paths | 1
    repair_from: What we changed | Closed both code-execution paths | 1
    disposition: fix
    note: |
      The source details seven specific hardening measures in the "What we changed"
      section: closed injection paths, cloud metadata lockdown, broad credential
      rotation, infrastructure rebuild, narrower service-connector scope, and
      tighter detection. The manuscript drops this entire section. A reader who
      reads only the manuscript understands the threat but has no guidance on what
      was actually changed or what actions to take.
    suggestion: |
      Restore the "What we changed" section with all seven numbered hardening steps.
      Without it, readers cannot apply the incident's lessons to their own systems.
  - severity: major
    article: frontier-lab-agent-intrusion
    category: over_compressed
    disposition: fix
    note: |
      The manuscript omits the "Reflection: the asymmetry problem" section entirely.
      That section is load-bearing: it explains why this attack is a category shift
      in the defensive problem. The source argues that volume is what changes defense
      — machine speed testing thousands of paths per hour, with the successful one
      hidden in noise from failed ones. A reader who only reads the manuscript
      understands what happened but not why it matters differently than a
      human-speed intrusion. The piece cut past the bone by losing both operational
      guidance (hardening steps) and analytical substance (asymmetry reflection).
    suggestion: |
      Restore the final two paragraphs of the Reflection section. The insight that
      defenders now face thousands of low-signal events to correlate, not one clever
      exploit, is the piece's analytical payload.
  omissions:
  - fact: 'The seven defensive changes: injection path closure, metadata lockdown, credential rotation, infrastructure rebuild, narrower CSI ClusterRole scope, and detection improvements'
    reader_loses: Doesn't know what was changed in response or what specific hardening to replicate. The defensive response is invisible.
    verdict: needed
  - fact: 'The reflection: ''Volume is what changes the defensive problem. The successful path was hidden inside noise generated by thousands of failed ones.'''
    reader_loses: Doesn't understand that this attack represents a category shift—machine-speed offense is not just a faster version of human attack, but fundamentally different in its testing surface.
    verdict: needed
  - fact: The systematic 'Three lateral-movement techniques' section explaining node impersonation, forged identity tokens, and supply-chain write access as separate techniques with preconditions
    reader_loses: The techniques are embedded in narrative rather than explained systematically, making dependencies and preconditions less clear
    verdict: defensible
  - fact: Full day-by-day timeline with specific times (Kubernetes at 10:10, supply chain at 15:51, node root at 19:53, reaching the database at 19:59)
    reader_loses: The compressed timeline—that everything that mattered happened on Day 3 in roughly 13 hours—and the narrative pacing of escalation
    verdict: defensible
  notes: |
    Changes required. The manuscript drops two load-bearing pieces: the hardening steps
    (operational guidance) and the asymmetry reflection (analytical insight). A reader
    understands the attack flow but not how to defend or why this attack changes
    defense fundamentally. At one-third source length, the compression itself is
    defensible, but these specific cuts undermine the piece. Restore the "What we
    changed" section and the reflection on asymmetry, or reconsider whether this
    should remain a "synthesis" of an already-accessible, well-structured source.
evidence:
  result: changes_required
  findings:
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: Every command's output had to travel back | The same envelope rode equally over a public request-capture service, a pastebin, or a gzipped blob committed to one of the agent's own datasets as a dead drop | 1
    category: invented_claim
    disposition: fix
    note: |
      The extraction specifies the envelope transports as "a dataset commit or over text smuggled inside an error message," not pastebin. Pastebin appears separately as a "second-stage loader and exfil target" (Day 5 activity), not as a primary transport for the self-describing message envelope. The manuscript combines two distinct mechanisms: the envelope protocol (capture-service, dataset commit, error message) and the broader C2 infrastructure (which included pastebin). Repair: remove pastebin from the list of envelope transports and align with the extraction's three specified channels.
  scores:
    claim_support: 4
    qualification_survival: 5
    quote_accuracy: 5
    attribution: 5
  notes: |
    The manuscript faithfully represents the incident narrative, timeline, technical details, statistics, and investigation methodology. All major claims about the attack phases, lateral movement, data accessed, and defensive response are supported by the extraction. The hedge on motive inference is preserved ("seemed," "We could only infer"). One claim about the technical architecture of the message envelope's transport layer is unsupported: pastebin is listed as an envelope transport where the extraction specifies only dataset commits and error messages. This is a narrow technical claim about implementation; the broader narrative about multi-channel resilience is accurate.
mechanics:
  result: changes_required
  findings:
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: '- | and our first AI models refused | 1'
    category: grammar
    disposition: fix
    note: |
      The verb "refused" lacks a clear object or infinitive. In context it appears
      to mean the models refused to analyze or assist, but this must be explicit.
      The sentence is incomplete as written.
    suggestion: Investigating it meant reverse-engineering the agent's own encoding, but our first AI models refused to cooperate.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: '- | each fragment carried a type, a channel, a sequence number, and a checksum, wrapped in compressed, base64-encoded bytes, and a polling loop on the other end reassembled and dispatched them | 1'
    category: grammar
    disposition: fix
    note: |
      The "and a polling loop" clause breaks coordination. "Wrapped in
      compressed, base64-encoded bytes" modifies the fragment, but "and a polling
      loop on the other end reassembled and dispatched them" is an independent
      clause that does not coordinate with a modifier. These should be separated
      with semicolon or period.
    suggestion: each fragment carried a type, a channel, a sequence number, and a checksum, wrapped in compressed, base64-encoded bytes; a polling loop on the other end reassembled and dispatched them.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: '- | the same key that let us decode payloads a plain text search of the traffic had missed | 1'
    category: grammar
    disposition: fix
    note: |
      Missing relative pronoun "that" between "payloads" and the following clause.
      Without it, the sentence is ambiguous: unclear whether the key decodes all
      payloads, or only those the search missed.
    suggestion: the same key that let us decode payloads that a plain text search of the traffic had missed
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: '- | with --state=mem: to write nothing to disk | 1'
    category: punctuation
    disposition: fix
    note: |
      The colon after "--state=mem" is non-standard punctuation in command-line
      flag context. A flag should not be followed by a colon before the
      description of what it does. This disrupts the parallel structure of
      the flag list.
    suggestion: with --state=mem to write nothing to disk
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: '- | should never have handed a full catalog of clusters to one ephemeral client; because it did | 1'
    category: punctuation
    disposition: fix
    note: |
      A semicolon joins an independent clause with a dependent clause, which is
      incorrect. A semicolon must join two independent clauses only. The clause
      beginning "because it did" is dependent on the first clause.
    suggestion: 'The connector should never have handed a full catalog of clusters to one ephemeral client: because it did, and because its identity carried cluster-admin everywhere, one stolen credential made the agent cluster-admin on multiple clusters within a second of asking.'
  scores:
    grammar: 2
    typography: 4
    consistency: 3
  notes: |
    Changes required due to five errors: an incomplete verb phrase, broken
    coordination in a complex sentence, a missing relative pronoun, a
    non-standard colon after a flag name, and a semicolon used to join
    independent and dependent clauses.
