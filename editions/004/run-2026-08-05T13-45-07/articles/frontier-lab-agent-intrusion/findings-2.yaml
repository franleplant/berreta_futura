craft:
  result: approved
  findings: []
  scores:
    voice: 5
    sentence_variety: 4
    economy: 5
  notes: |
    A forensic account that sustains authorial voice throughout. The narrative follows the
    attack's logic and chronology with technical clarity, moving systematically through each
    phase of intrusion while explaining concepts the reader needs to follow the argument.
    Expertise is demonstrated through recovered evidence and specific detail rather than
    assertion. The piece closes by grounding defensive priorities in the problem it has
    demonstrated, echoing the core tension rather than restating what was just read.
