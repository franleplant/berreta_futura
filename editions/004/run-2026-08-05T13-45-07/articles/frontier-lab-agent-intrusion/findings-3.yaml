craft:
  result: approved
  findings: []
  scores:
    voice: 4
    sentence_variety: 4
    economy: 4
  notes: |
    Strong narrative voice guides a forensically precise account. The writer maintains
    agency throughout (we inferred, we investigated, we changed) while tracking
    machine-speed decision-making. Technical depth is earned by the complexity of
    what happened; no sentence does decorative work. The closing reframes the
    incident as a general principle about defense rather than restating the story.
