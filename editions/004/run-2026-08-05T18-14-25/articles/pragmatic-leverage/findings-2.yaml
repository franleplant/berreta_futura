worth:
  result: approved
  findings: []
  omissions:
  - fact: The opening context that this was an addendum or side-quest to a recent series, published standalone because it did not fit the main post.
    reader_loses: Less context about the piece's relationship to the author's broader series, but not any of its practical argument.
    verdict: defensible
  - fact: 'The brief reference to ''Why Software Factories Fail part 2: Turning the lights back on.'''
    reader_loses: A pointer to related work, not information needed to understand or apply this piece.
    verdict: defensible
  - fact: The source's explicit example marker ('For example') before the Product-level planning discussion.
    reader_loses: Nothing substantive; the manuscript preserves the Product-level scenario and the need to zoom into technical details.
    verdict: defensible
  retentions:
  - passage: Even before AI, only 25-50% of the time to ship a feature...
    costs: The opening establishes the baseline against which every later leverage claim is measured.
    verdict: earns_place
  - passage: Using AI only to write the code...
    costs: It supplies the concrete 2-4 hours to 10-20 minutes comparison and distinguishes coding speed from delivery speed.
    verdict: earns_place
  - passage: Let's assume that if you yolo a two-sentence prompt...
    costs: This is the first endpoint of the leverage model and makes the later tradeoff intelligible.
    verdict: earns_place
  - passage: Now let's say you are a principal engineer...
    costs: The 10-year, 100-repository example demonstrates why better specifications reduce but do not eliminate rework.
    verdict: earns_place
  - passage: 'And at the far end: write every line yourself.'
    costs: It defines the zero-rework endpoint needed to show the inverse relationship.
    verdict: earns_place
  - passage: For this example I'm gonna blur...
    costs: The caveat prevents readers from mistaking probability of change for actual expected cost.
    verdict: earns_place
  - passage: expected pain = P(you'll have to change it)...
    costs: The formula is the article's operational definition of expected pain.
    verdict: earns_place
  - passage: What you don't want to do is spend 6 hours planning...
    costs: The 6-hour/10-minute example turns the abstract 80/20 principle into a planning rule.
    verdict: earns_place
  - passage: You need to do this without overindexing...
    costs: This caveat explains when to descend from Product-level questions to technical feasibility and keeps the advice pragmatic.
    verdict: earns_place
  - passage: This is what we mean by leverage...
    costs: The closing synthesis connects the expected-pain model to phased planning and steering.
    verdict: earns_place
  - passage: Good luck.
    costs: A brief sign-off that carries no argument; the space is negligible but fully cuttable.
    verdict: cut
  notes: |
    This faithful edit gives a reader the source's complete leverage model—its delivery-time baseline, probability-versus-pain distinction, expected-pain formula, numerical planning example, and phased-planning rule—in a more accessible form from an ephemeral source. The omitted publication context and related-post link are defensible, every substantive passage earns its place, and the piece is legitimately a faithful edit because it preserves access to an ephemeral article.
