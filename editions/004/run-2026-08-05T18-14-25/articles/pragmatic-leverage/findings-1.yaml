craft:
  result: changes_required
  findings:
  - severity: blocking
    article: pragmatic-leverage
    locator: Seeking Leverage | If you're only using AI to write the code, then you're taking the 2-4 hours of coding time down to 10-20 minutes, but you haven't accelerated anything else here. | 1
    category: repeated_shape
    disposition: editor_decision
    note: |
      Seven conditional constructions make the prose announce its pattern: "If you're only using AI to write the code, then you're taking the 2-4 hours of coding time down to 10-20 minutes, but you haven't accelerated anything else here"; "But if you use AI to help you plan and align, then you actually get closer to 2-3x faster"; "Let's assume if you yolo a two-sentence prompt into your factory, your chance of getting a fully-mergeable result is ~50%, the chance you have to rework it is 50%"; "If you draw this out, there's an inverse relationship between effort invested up front and expected pain"; "if you've done some work at the \"Product\" level and have not answered all the open questions yet, it's possible you may need to end it where you are and zoom down a level"; "If you're doing multiple phases of planning, zooming in from 50kft view all the way to the 10kft view, you want to do a little bit of steering at each phase"; and "If the model is 50% likely to get a button style wrong, but the fix is one cheap prompt, then our combined \"expected pain\" is low." The author's construction is the defect, so cut or consolidate several instances.
  - severity: major
    article: pragmatic-leverage
    locator: '- | This one is a bit of an addendum / side-quest to the recent series. | 1'
    category: weak_opening_sentence
    disposition: fix
    note: |
      The opening clears its throat with publication context instead of beginning with the leverage claim.
  - severity: minor
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | This is what we mean by leverage - and it requires being pragmatic. | 1
    category: dead_words
    disposition: fix
    note: |
      This balanced abstraction restates the section's point without adding a concrete consequence.
  - severity: minor
    article: pragmatic-leverage
    locator: The 80/20 rule in AI coding leverage | If you're doing multiple phases of planning, zooming in from 50kft view all the way to the 10kft view, you want to do a little bit of steering at each phase to ensure you are eliminating as much expected pain as possible. | 1
    category: jargon
    disposition: fix
    note: |
      "50kft view" and "10kft view" are unexplained planning jargon for readers outside this management vocabulary.
  - severity: minor
    article: pragmatic-leverage
    locator: '- | It is referenced briefly in Why Software Factories Fail part 2: Turning the lights back on. | 1'
    category: passive
    disposition: fix
    note: |
      The passive construction hides the relevant actor and makes the opening furniture more indirect than necessary.
  scores:
    voice: 4
    sentence_variety: 1
    economy: 3
  notes: |
    I heard a personable, practical voice get caught in a repeated conditional mold, with the opening and a few abstract sentences supplying avoidable editorial drag.
