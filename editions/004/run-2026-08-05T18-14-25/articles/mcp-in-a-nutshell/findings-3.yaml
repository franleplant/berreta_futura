craft:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | A tool performs an action such as a file operation, API call, or database query. | 1'
    category: repeated_shape
    disposition: editor_decision
    note: |
      Three consecutive sentences use the same "A [noun] [verb]" shape:
      "A tool performs...", "A resource supplies...", and "A prompt provides...".
      The repetition makes the taxonomy sound mechanically assembled; vary the
      construction or compress the three definitions.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | With those connections in place, the client and server exchange JSON-RPC messages. | 1'
    category: no_voice
    disposition: fix
    note: |
      The voice disappears here into an even, procedural register. The following
      sentences ("MCP is a stateless protocol", "Every request carries...", and
      "Because each request carries...") stack abstractions and protocol rules
      without a human point of attention.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | This separation gives an application a simple working path: connect, discover what each server supports, invoke the right primitive, and refresh when the server changes. | 1'
    category: dead_words
    disposition: fix
    note: |
      "A simple working path" is an abstraction stack, and the four-item
      imperative list adds procedural weight without making the mechanism more
      concrete. Replace the phrase with the specific consequence for the
      application.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: '- | Both transports carry the same JSON-RPC 2.0 message format. | 1'
    category: jargon
    disposition: fix
    note: |
      "JSON-RPC 2.0" is named but not explained; a competent engineer outside
      this subfield may not know what the format contributes here. Add a brief
      plain-language gloss or defer the term.
  - severity: major
    article: mcp-in-a-nutshell
    locator: '- | It chooses the server, sends the call, and decides how a change enters the conversation. | 1'
    category: weak_close
    disposition: fix
    note: |
      The final sentence restates the preceding claim that the application is
      "the gatekeeper" and closes with another balanced list. End on the practical
      implication of that control instead of repeating the summary.
  scores:
    voice: 3
    sentence_variety: 2
    economy: 3
  notes: |
    The piece begins with a clear human-scaled example, then its voice thins into
    protocol taxonomy and repeated declarative constructions; the ending repeats
    its gatekeeper summary rather than leaving a sharper implication.
