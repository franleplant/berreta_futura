craft:
  result: changes_required
  findings:
  - severity: major
    article: mcp-in-a-nutshell
    locator: The data layer is where the practical work happens. | The data layer is where the practical work happens. | 1
    category: dead_words
    disposition: fix
    note: |
      This is an abstraction stack and a definite-article equation: "the data layer"
      is introduced as a place where "practical work happens" without naming the
      work. Replace it with the concrete exchange this paragraph describes.
  - severity: major
    article: mcp-in-a-nutshell
    locator: The data layer is where the practical work happens. | MCP is a stateless protocol. | 1
    category: no_voice
    disposition: fix
    note: |
      The voice disappears here as the prose shifts into an impersonal specification
      recital. Re-enter through a concrete consequence for the client or reader
      before stacking protocol rules.
  - severity: major
    article: mcp-in-a-nutshell
    locator: MCP's useful promise is therefore procedural. | MCP's useful promise is therefore procedural. | 1
    category: weak_close
    disposition: fix
    note: |
      The closing paragraph restates the article's procedure instead of leaving a
      sharper consequence or question. End on the boundary between model access and
      application control rather than announcing a summary.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: The client begins with `tools/list`. | The response can be paginated with a cursor and returns tool metadata including `name`, `title`, `description`, and `inputSchema`. | 1
    category: passive
    disposition: fix
    note: |
      "Can be paginated" hides the actor. Name the server or protocol behavior that
      paginates the response.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: Clients that federate many servers can use progressive discovery instead of loading every tool at startup. | Clients that federate many servers can use progressive discovery instead of loading every tool at startup. | 1
    category: jargon
    disposition: fix
    note: |
      "Progressive discovery" is not defined for an engineer outside this subfield.
      Explain the behavior in plain language when the term first appears.
  - severity: minor
    article: mcp-in-a-nutshell
    locator: Clients that federate many servers can use progressive discovery instead of loading every tool at startup. | New implementations should call provider APIs directly for model access and use stderr or OpenTelemetry for logs. | 1
    category: jargon
    disposition: fix
    note: |
      "OpenTelemetry" arrives without definition. Add a brief identifier for the
      logging and tracing system or remove the name.
  scores:
    voice: 3
    sentence_variety: 3
    economy: 3
  notes: |
    I heard a clear technical explainer become a specification recital in the data-layer
    section, with a summary-heavy close and a few terms left inside the protocol's
    vocabulary rather than the reader's.
