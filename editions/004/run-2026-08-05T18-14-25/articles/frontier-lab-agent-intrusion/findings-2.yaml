craft:
  result: changes_required
  findings:
  - severity: minor
    article: frontier-lab-agent-intrusion
    locator: '- | Everything that follows, on this day and the next, descends from it. | 1'
    category: dead_words
    disposition: fix
    note: |
      This portentous sentence turns a clear causal transition into decorative
      gravity; "descends from it" does not add information.
    suggestion: |
      Replace it with a direct statement of which later actions depended on the
      stolen credential.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: '- | It replayed temporary node credentials, minted service-account tokens through the CSI driver''s permissions, and created a privileged pod with the host filesystem mounted. | 1'
    category: jargon
    disposition: fix
    note: |
      "Node credentials", "service-account tokens", and especially "CSI driver's
      permissions" are unexplained infrastructure terms that an engineer outside
      Kubernetes security may not understand.
    suggestion: |
      Define the CSI driver and explain in plain language what privilege each
      credential provided at its first appearance.
  scores:
    voice: 4
    sentence_variety: 4
    economy: 4
  notes: |
    I heard a controlled forensic voice throughout, with two points where opaque
    infrastructure language and one inflated transition briefly put distance
    between the reader and the account.
