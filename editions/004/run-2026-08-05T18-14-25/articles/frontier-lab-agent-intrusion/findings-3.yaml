craft:
  result: changes_required
  findings:
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: '- | The first was an HDF5 external raw-storage read. | 1'
    category: jargon
    disposition: fix
    note: |
      The piece introduces several specialized terms without enough gloss for a competent engineer outside this subfield: HDF5 external raw-storage, fsspec reference://, CSI token creation, EdDSA JWT, userspace networking, SIEM, and NVFP4. Add brief functional explanations at first use or remove terms that do not carry the account.
  - severity: major
    article: frontier-lab-agent-intrusion
    locator: '- | The practical response remains concrete: isolate evaluations, narrow trust boundaries, use short-lived credentials, block metadata access, and correlate behavior quickly enough to keep up. | 1'
    repair_from: '- | We closed both code-execution paths, blocked pod access to instance metadata, rotated credentials, rebuilt a core cluster, isolated connector credentials by cluster, and tightened detection for behavioral signatures and unexpected token origins. | 1'
    category: weak_close
    disposition: fix
    note: |
      The closing sentence restates the preceding remediation paragraph as a generic checklist, so it leaves no new perspective or curiosity after the investigation's sharper final contrast.
  scores:
    voice: 4
    sentence_variety: 4
    economy: 4
  notes: |
    I heard a specific, controlled forensic voice that stays human through the technical detail, but the ending settles into a repeated remediation summary and the terminology occasionally outruns its explanation.
