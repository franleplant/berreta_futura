shape:
  result: changes_required
  findings:
  - severity: major
    article: editorial
    locator: '- | The lesson crosses the factory and the security desk. | 1'
    repair_from: '- | A two-sentence prompt can save an afternoon. | 1'
    category: running_example
    disposition: fix
    note: |
      The piece moves from prompts to MCP schemas to a security campaign and then to a factory metaphor without one concrete case carrying the argument. The reader can follow the thesis, but the examples do not accumulate into a single illustrative thread.
    suggestion: Use the prompt-to-result workflow as the running case and make the security campaign one explicit contrast.
