    I verified that the argument progresses from context and planning to autonomy risks and visibility, but its examples do not form a sustained running case.
craft:
  result: changes_required
  findings:
  - severity: major
    article: editorial
    locator: '- | The difference is not eloquence. It is what the system knows before it moves, and what the people around it can see while it moves. | 1'
    category: banned_tic
    disposition: fix
    note: |
      The editor-owned antithesis ("It is not X. It is Y.") is a banned tic and announces a constructed insight.
    suggestion: |
      Recast the contrast as one direct sentence that names the operative difference.
  - severity: minor
    article: editorial
    locator: '- | An MCP client does this through explicit schemas, capabilities, and results. | 1'
    category: jargon
    disposition: fix
    note: |
      "MCP client" and its associated terms are unexplained jargon for a competent engineer outside this subfield.
    suggestion: |
      Briefly define MCP in terms of the client's role before naming schemas and capabilities.
  - severity: minor
    article: editorial
    locator: '- | Good planning reduces expected rework because it removes uncertainty early. | 1'
    category: dead_words
    disposition: fix
    note: |
      This abstraction stack ("planning," "expected rework," and "uncertainty") states a general principle without a concrete scene or mechanism.
    suggestion: |
      Name the specific planning detail that prevents a later retry or misstep.
  - severity: major
    article: editorial
    locator: '- | The useful agent is therefore less like a clever employee than a fast colleague working under glass. | 1'
    category: banned_tic
    disposition: fix
    note: |
      The closing paragraph uses a second editor-owned antithetical comparison, "less like X than Y," repeating the banned contrast pattern.
    suggestion: |
      Keep the observability image but state the agent's relationship to oversight without the binary comparison.
  scores:
    voice: 4
    sentence_variety: 4
    economy: 4
  notes: |
    I heard a compact, confident editorial with a clear governing image, interrupted by abstract explanation and two conspicuous antithetical constructions that make the editor's hand audible.
