    article: editorial
    locator: The work between the prompt and the result | MCP gives that handoff a shape. | 1
    category: jargon
    disposition: fix
    note: |
      "MCP" is central jargon that a competent engineer outside this subfield may
      not know, and the editorial never expands or defines it.
    suggestion: Define MCP on first use.
  - severity: minor
    article: editorial
    locator: The work between the prompt and the result | Now run the same workflow at attack speed. | 1
    category: passive
    disposition: fix
    note: |
      The ownerless imperative tells the reader to run the workflow without naming
      an actor, producing the house's instruction-like register.
    suggestion: Name the actor who should run the workflow.
  - severity: minor
    article: editorial
    locator: The work between the prompt and the result | Give an agent room to work, and leave a mark beside every door it opens. | 1
    category: passive
    disposition: fix
    note: |
      This second ownerless imperative shifts into advice without identifying who
      should grant access or record the activity.
    suggestion: Name the responsible operator in the sentence.
  scores:
