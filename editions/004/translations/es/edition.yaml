title: The Systems Around the Model
subtitle: Protocols, evaluations, architectures, and the operational work that turns model capability into dependable
  systems
cover:
  headline: The Systems Around the Model
  deck: Seven reports on the machinery that makes intelligence useful, legible, and safe
  back_text: The model is only one component. Reliability lives in the protocol, the evidence, the feedback loop,
    the architecture, and the judgment that connects them.
closing_plate_titles:
- Signal Through Gates
- Memory and Retrieval
- The Useful Boundary
editorial:
  path: manuscript/editorial.md
articles:
- id: frontier-lab-agent-intrusion
  title: Anatomy of a Frontier Lab Agent Intrusion
  short_title: Agent Intrusion
  display_emphasis: Intrusion
  author_note: Hugo Larcher, Adrien Carreira, raphael g, and Christophe Rannou are contributors publishing through
    Hugging Face.
  manuscript: articles/frontier-lab-agent-intrusion.md
  figures:
  - id: campaign-timeline
    caption: The recovered campaign compresses into a 4.5-day timeline of foothold, command and control, lateral
      movement, credential use, and cleanup.
    credit: 'Diagram by Hugo Larcher, Adrien Carreira, raphael g, Christophe Rannou; source: Anatomy of a Frontier
      Lab Agent Intrusion: A Technical Timeline of the July 2026 Incident.'
    alt_text: A campaign timeline shows event volume and phase activity across four and a half days.
    anchor: The kill chain
- id: eval-engineering
  title: Eval Engineering
  short_title: Eval Engineering
  display_emphasis: Eval
  author_note: Argona is the publishing name of @Argona0x, an AI-focused X account.
  manuscript: articles/eval-engineering.md
  figures:
  - id: eval-engine
    caption: Evaluation becomes engineering when production traces, failure labels, and repeatable graders form
      one operating loop.
    credit: 'Diagram by Argona; source: Eval Engineering: the step that turns a $200 model into a $200,000 system.'
    alt_text: A source diagram presents the first stage of an evaluation-engineering workflow.
    anchor: Thermometer, thermostat
  - id: eval-routing
    caption: 'Scores become useful only when they change the next edge: retry, reject, quarantine, block, or route
      to human review.'
    credit: 'Diagram by Argona; source: Eval Engineering: the step that turns a $200 model into a $200,000 system.'
    alt_text: A source diagram maps evaluation failures to routing decisions.
    anchor: What a score is allowed to do
- id: pragmatic-leverage
  title: Pragmatic Leverage in the Software Factory
  short_title: Pragmatic Leverage
  display_emphasis: Leverage
  author_note: Dex Horthy is the founder of HumanLayer, a YC-backed developer-tools company.
  manuscript: articles/pragmatic-leverage.md
  figures:
  - id: delivery-time
    caption: Coding is only one fraction of feature delivery; alignment, review, rework, testing, and verification
      consume the rest.
    credit: 'Diagram by Dex Horthy; source: Pragmatic Leverage in the Software Factory.'
    alt_text: A source diagram breaks feature delivery time into coding and surrounding work.
    anchor: Seeking leverage
  - id: minimal-prompt-risk
    caption: A minimal prompt saves preparation time but leaves a large chance of costly rework.
    credit: 'Diagram by Dex Horthy; source: Pragmatic Leverage in the Software Factory.'
    alt_text: A source diagram relates a two-sentence prompt to expected rework.
    anchor: The 80/20 rule in AI coding leverage
- id: from-gpt2-to-kimi3
  title: From GPT-2 to KimiK3
  short_title: GPT-2 to KimiK3
  display_emphasis: KimiK3
  author_note: ali works on inference at Baseten and studies engineering at the University of Waterloo.
  manuscript: articles/from-gpt2-to-kimi3.md
  figures:
  - id: gpt2-baseline
    caption: 'GPT-2 supplies the recognizable baseline: token and position embeddings, transformer blocks, normalization,
      and a language-model head.'
    credit: 'Diagram by ali; source: 22580: From GPT2 to Kimi3, Explained.'
    alt_text: A source diagram outlines the GPT-2 decoder-only architecture.
    anchor: GPT-2 and the cache
  - id: attention-progression
    caption: The worklog follows attention from full pairwise comparison toward recurrent state and delta-rule correction.
    credit: 'Diagram by ali; source: 22580: From GPT2 to Kimi3, Explained.'
    alt_text: A source diagram compares stages in the evolution of attention mechanisms.
    anchor: From linear attention to DeltaNet
