    source_id: formally-verifying-agent-written-full-stack-web-b28ecfb7
    path: media/002.png
    caption: 'Flow diagram showing the PDD Kit workflow for formally verifying agent-written code.'
    alt_text: 'Flow diagram showing the PDD Kit workflow for formally verifying agent-written code. Team members review intent by expressing requirements in plain language, which are formalized in a pdd-plan containing decision cards, intent artifacts, trusted boundaries, and reviewer approvals. The plan generates a formal specification with Verus ensures clauses. Machines then check the code through pdd-prove, which includes Verus proofs, tests for trusted components, and LLM gap review. Verified code and receipts are submitted as a pull request. Dashed feedback loops return specification contradictions and verification gaps to earlier planning and coding stages.'
    anchor: How PDD Kit works
    layout: evidence_band
  - id: figure-3
    source_id: formally-verifying-agent-written-full-stack-web-b28ecfb7
    path: media/004.png
    caption: Three-panel illustration comparing login outcomes.
    alt_text: Three-panel illustration comparing login outcomes. In the first panel, a customer logs in with the correct email and password and receives a “customer” ticket. In the second panel, the same email is paired with an incorrect password and access is refused. In the third panel, an administrator logs in with the correct username and password and receives an “admin” ticket. The diagram uses a ticket-counter analogy to explain authentication and role-based access.
    anchor: Pet Store login
    layout: evidence_band
