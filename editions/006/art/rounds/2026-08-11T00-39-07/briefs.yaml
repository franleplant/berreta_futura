- id: cover-synthetic-cells-and-disks
  purpose: cover
  prompt: 'Square abstract cover artwork, at least 1000 by 1000 pixels, no typography of any kind. One compact geometric proposition: a large field of warm off-white breathing room holding five large rounded-rectangle cells of different sizes, arranged with confident asymmetry. Each cell is closed on all four sides and contains exactly one solid disk of a single ink: cobalt, brick coral, muted green, softened cyan, dusty lavender. One cell alone stands slightly ajar, its front face swung open a few degrees, and its disk has travelled half a diameter past the opening, caught in the negative space between cells. Publication ink set only: charcoal, cobalt, softened cyan, brick coral, muted green, dusty lavender, small warm-ochre accent, warm off-white ground. Controlled dimensional shading and a sense of synthetic material depth are welcome: soft thickness on the cell walls, one consistent light direction, quiet print grain and slight pigment variation. Keep the silhouette legible at thumbnail size and keep important detail away from the extreme edges. No masthead, title, issue number, caption, logo, watermark, pseudo-writing, numerals, or glyphs. No literal diagrams, arrows, icon systems, circuit motifs, network graphs, generic AI futurism, gradients that muddy in print, or ornamental complexity. No characters, no photographic elements.'
- id: cover-art-directed-paper-rooms
  purpose: cover
  prompt: 'Square cover artwork, at least 1000 by 1000 pixels, no typography of any kind. Medium: a hand-cut layered paper relief, built from thick matte cover stock, photographed straight on under low raking light so every cut edge throws a real shadow and the paper tooth reads. Subject: a shallow honeycomb of small paper rooms, roughly sixteen of them in an uneven grid, each room a separate hand-cut box with its own tiny back wall and its own single folded paper token resting inside. Every room is a closed world of its own, no shared floor between them. One room in the lower third has its front panel folded down like a small ramp, and its folded token has been lifted out and pinned in mid-air a short distance away, catching the strongest light in the frame. Publication palette: charcoal, cobalt, softened cyan, brick coral, muted green, dusty lavender, warm ochre accent, warm off-white paper. Material conviction matters more than decoration: real fibre, real fold creases, real cast shadow, honest depth of a few millimetres. Preserve a legible silhouette at thumbnail size, keep important detail away from the extreme edges, and keep the tonal range printable. No masthead, title, caption, logo, watermark, pseudo-writing, numerals, or glyphs. No string, knots, thread, pushpins with visible heads, torn paper scraps, diagrams, hands, or people. No collage-template look, no digital render sheen, no neon.'
- id: cover-wildcard-drawer-of-rooms
  purpose: cover
  prompt: 'Square photograph, at least 1000 by 1000 pixels, no typography of any kind. A convincing, physically coherent photograph of one improbable thing: a single colossal steel filing drawer, roughly the size of a shipping container, hanging alone in the air above a shallow salt flat at first light, with no cabinet, no frame, and no support anywhere around it. The drawer is pulled fully open and tilted a few degrees off level. Inside it, packed edge to edge, sit dozens of tiny fully furnished lit rooms, each one complete and separate, each with its own small warm lamp burning. At the drawer''s low lip one small room has slid past the edge and is caught in mid-fall, still lit, a few metres below the others. Shoot it straight: real optics, a medium-format look, one true dawn light source, honest shadow on the wet salt below, faint reflection in the standing water, real steel with real scratches and dust. Cool pale blue sky, charcoal steel, warm ochre lamplight, muted green and coral in the miniature interiors. Thumbnail impact comes from the unmistakable floating open drawer silhouette, the scale shock, the tilt, and the falling room. Keep the tonal range printable, keep important detail away from the extreme edges, and keep the frame uncluttered. No masthead, title, caption, logo, watermark, signage, pseudo-writing, numerals, or glyphs. No painting, illustration, concept art, or CGI look, no people, no floating debris fields, no lens flare spectacle, no neon, no familiar AI-futurist imagery.'
- id: opener-actor-model
  purpose: opener
  article_id: the-actor-model-in-a-nutshell
  prompt: |-
    Square illustration. Scene: Pedro and Maro work a small courtyard of five wooden huts set in a loose arc, each hut standing on its own little plot with a gap of open ground between it and its neighbours. Every hut is sealed shut, no windows and no shared table, and each has one bright letter slot in its door. Pedro kneels at the nearest hut, posting a folded paper note through its slot with a careful two-handed push and a pleased, concentrating expression. Maro strides between two further huts carrying a small stack of folded notes in its mitten hands, one note already slipping free and gliding on the air. Two more notes wait in a tidy pile on the ground. Nothing passes between the huts except the notes. Late afternoon, dry swept earth underfoot, low grasses, an open pale sky. Pedro and Maro are the only figures in the picture. Style: original family-friendly children's science-comedy manga, simple charcoal contours, rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone, quiet print grain, one playful visual idea. Palette: scene-led gentle historical magazine color at low to medium saturation, softened cyan and cobalt, brick coral, muted green, dusty lavender, small warm-ochre accents, warm off-white breathing room, charcoal ink; the setting chooses the background, never one flat yellow paper field. Constraints: entirely wordless editorial storytelling; single panel; at least three distinct non-neutral colors; strong silhouettes and expressions legible at A5 print size; print-friendly contrast; slight pigment variation, subtle paper tooth, quiet print grain; keep the essential subject well inside the square crop. Avoid: any recognizable franchise character, costume, face, silhouette, or gadget, no Doraemon or Nobita likeness, no blue robotic cats; no extra humans, extra robots, or robot-faced background appliances; no uniform yellow, mustard, beige, sepia, cream-paper, or bright cyan background field; no decorative montages, contact sheets, or filler patterns; no dense technical realism, steampunk clutter, or heavy crosshatching; no modern glossy anime rendering, painterly concept art, neon cyberpunk, or photorealism; no decorative pseudo-writing, interface glyphs, captions, labels, numerals, or speech balloons.

    Recurring cast — draw exactly as specified, never redesign: Pedro, a school-age boy: black tousled hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions, or extra limbs.
  subject: Pedro and Maro post messages between small closed huts that share nothing but their letter slots, the actor model's one rule made physical.
  composition: Square composition, a loose arc of five hut fronts filling the middle band, Pedro kneeling at the nearest slot and Maro mid-stride between two huts, the essential action held well inside a centred square crop.
  alt_text: Pedro posts a folded note through the letter slot of one of five separate huts while Maro carries more notes between them.
  credit: Original illustration for this edition, art direction Story-Led Boy and Robot, Gentle Print Color.
  cast_references:
  - art-directions/references/story-led-boy-and-robot-cast.png
