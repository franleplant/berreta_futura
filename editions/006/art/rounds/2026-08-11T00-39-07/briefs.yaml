ackground field; no decorative montages, contact sheets, or filler patterns; no dense technical realism, steampunk clutter, or heavy crosshatching; no modern glossy anime rendering, painterly concept art, neon cyberpunk, or photorealism; no decorative pseudo-writing, interface glyphs, captions, labels, numerals, or speech balloons.

