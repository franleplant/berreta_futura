    interest rather than alarm; Maro sits on the rail''s edge nearby holding the two spilled bolts ready
    to hand back. Warm workshop interior, high windows, cool grey floor. Pedro, Maro, and Flopaz are the
    only figures in the picture. Flopaz walks the line a little ahead, laying two fingers on each passing
    cart to feel that it runs true. Style: original family-friendly children''s science-comedy manga,
