  subject: An evening lane of letter posts, each waiting alone for its own message, walked by Pedro and
    Maro at the end of the round.
  composition: Wide horizontal vignette with a long low horizon, the row of posts receding across the
    frame and the two figures centred, all essential action inside the middle four fifths.
  alt_text: At dusk Pedro, Flopaz, and Maro walk a lane of separate letter posts, Maro reaching up to
    deliver the last note and Flopaz carrying the mail sack.
  credit: Original illustration for this edition, art direction Story-Led Boy and Robot, Gentle Print
