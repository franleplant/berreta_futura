  prompt: 'Square illustration. Scene: a small stone gateway just wide enough for one visitor, fitted
    with a wooden turnstile and a coin slot at knee height. A short queue of folded paper messengers,
    each about the size of a cat and standing upright on paper legs, waits its turn. The messenger at
    the front is posting a plain unmarked coin into the slot with a paper hand, and the turnstile arm
    has begun to swing open for it. Behind the gate the road runs on toward an open sunlit garden. Pedro
    crouches beside the slot with a bowl of plain coins, offering one to the next messenger in line with
    an encouraging expression; Maro perches on the gate wall above, one mitten hand resting on the turnstile
    arm, screen showing friendly attention. A messenger without a coin waits politely to one side, not
    admitted, not distressed. Late morning, warm stone, cool shade under the arch. Pedro, Maro, and Flopaz
    are the only figures in the picture, and the paper messengers have no faces. Flopaz sits on the wall
    beside the gate with her ankles crossed, calmly watching the coin drop and the bar begin to rise.
    Style: original family-friendly children''s science-comedy manga, simple charcoal contours, rounded
    readable expressions, economical watercolor washes, minimal hatching, restrained halftone, quiet print
    grain, one playful visual idea. Palette: scene-led gentle historical magazine color at low to medium
    saturation, softened cyan and cobalt, brick coral, muted green, dusty lavender, small warm-ochre accents,
    warm off-white breathing room, charcoal ink; the setting chooses the background, never one flat yellow
    paper field. Constraints: entirely wordless editorial storytelling; single panel; at least three distinct
    non-neutral colors; strong silhouettes and expressions legible at A5 print size; print-friendly contrast;
    slight pigment variation, subtle paper tooth, quiet print grain; keep the gate, the paying messenger
    and both figures well inside the square crop. Avoid: any recognizable franchise character, costume,
    face, silhouette, or gadget, no Doraemon or Nobita likeness, no blue robotic cats; no extra humans,
    extra robots, or robot-faced background appliances; no uniform yellow, mustard, beige, sepia, cream-paper,
    or bright cyan background field; no decorative montages, contact sheets, or filler patterns; no dense
    technical realism, steampunk clutter, or heavy crosshatching; no modern glossy anime rendering, painterly
    concept art, neon cyberpunk, or photorealism; no decorative pseudo-writing, interface glyphs, captions,
    labels, numerals, currency symbols, or speech balloons.


    Recurring cast — draw exactly as specified, never redesign: Pedro, a school-age boy: black tousled
    hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never
    a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded
    rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder
    joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch
    at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions,
    or extra limbs. Flopaz, a school-age girl, Pedro''s height: chestnut-brown hair in one low side ponytail
    with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top;
    white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails,
    never a hat, never glasses.'
