    in the outer eighth of either side. Avoid: any recognizable franchise character, costume, face, silhouette,
    or gadget, no Doraemon or Nobita likeness, no blue robotic cats; no extra humans, extra robots, or
    robot-faced background appliances; no uniform yellow, mustard, beige, sepia, cream-paper, or bright
    cyan background field; no decorative montages, contact sheets, or filler patterns; no dense technical
