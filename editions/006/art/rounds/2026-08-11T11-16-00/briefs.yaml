- id: opener-actor-model
  purpose: opener
  article_id: the-actor-model-in-a-nutshell
  prompt: 'Square illustration. Scene: Pedro and Maro work a small courtyard of five wooden huts set in
    a loose arc, each hut standing on its own little plot with a gap of open ground between it and its
    neighbours. Every hut is sealed shut, no windows and no shared table, and each has one bright letter
    slot in its door. Pedro kneels at the nearest hut, posting a folded paper note through its slot with
    a careful two-handed push and a pleased, concentrating expression. Maro strides between two further
    huts carrying a small stack of folded notes in its mitten hands, one note already slipping free and
    gliding on the air. Two more notes wait in a tidy pile on the ground. Nothing passes between the huts
    except the notes. Late afternoon, dry swept earth underfoot, low grasses, an open pale sky. Pedro,
    Maro, and Flopaz are the only figures in the picture. Flopaz kneels at another hut, holding its letter
    slot open with one finger as she listens for the reply, calm and attentive. Style: original family-friendly
    children''s science-comedy manga, simple charcoal contours, rounded readable expressions, economical
    watercolor washes, minimal hatching, restrained halftone, quiet print grain, one playful visual idea.
    Palette: scene-led gentle historical magazine color at low to medium saturation, softened cyan and
    cobalt, brick coral, muted green, dusty lavender, small warm-ochre accents, warm off-white breathing
    room, charcoal ink; the setting chooses the background, never one flat yellow paper field. Constraints:
    entirely wordless editorial storytelling; single panel; at least three distinct non-neutral colors;
    strong silhouettes and expressions legible at A5 print size; print-friendly contrast; slight pigment
    variation, subtle paper tooth, quiet print grain; keep the essential subject well inside the square
    crop. Avoid: any recognizable franchise character, costume, face, silhouette, or gadget, no Doraemon
    or Nobita likeness, no blue robotic cats; no extra humans, extra robots, or robot-faced background
    appliances; no uniform yellow, mustard, beige, sepia, cream-paper, or bright cyan background field;
    no decorative montages, contact sheets, or filler patterns; no dense technical realism, steampunk
    clutter, or heavy crosshatching; no modern glossy anime rendering, painterly concept art, neon cyberpunk,
    or photorealism; no decorative pseudo-writing, interface glyphs, captions, labels, numerals, or speech
    balloons.


    Recurring cast — draw exactly as specified, never redesign: Pedro, a school-age boy: black tousled
    hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never
    a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded
    rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder
    joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch
    at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions,
    or extra limbs. Flopaz, a school-age girl, Pedro''s height: chestnut-brown hair in one low side ponytail
    with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top;
    white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails,
    never a hat, never glasses.'
  subject: Pedro and Maro post messages between small closed huts that share nothing but their letter
    slots, the actor model's one rule made physical.
  composition: Square composition, a loose arc of five hut fronts filling the middle band, Pedro kneeling
    at the nearest slot and Maro mid-stride between two huts, the essential action held well inside a
    centred square crop.
  alt_text: Pedro posts a folded note through the letter slot of one of five separate huts, Flopaz listens
    at another slot, and Maro carries more notes between them.
  credit: Original illustration for this edition, art direction Story-Led Boy and Robot, Gentle Print
    Color.
  cast_references:
  - art-directions/references/story-led-boy-and-robot-cast.png
