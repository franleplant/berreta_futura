    behind holding the last folded note up toward the nearest box, reaching on tiptoe. The posts near
    the frame edges are simple silhouettes; the two figures and the last note sit at the centre of the
    frame. Cool evening air, long soft shadows, first stars, dressed for a cool evening at the end of
    a long walk, both a few years older than usual and drawn with softer, more painterly light. Pedro,
    Maro, and Flopaz are the only figures in the picture. Flopaz walks a few steps behind with a small
    canvas mail sack over her shoulder, pausing at an unlit letter post. Style: original family-friendly
    children''s science-comedy manga, simple charcoal contours, rounded readable expressions, economical
    watercolor washes, minimal hatching, restrained halftone, quiet print grain, one playful visual idea.
    Palette: scene-led gentle historical magazine color at low to medium saturation, softened cyan and
