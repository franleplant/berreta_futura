<details><summary>prompt</summary><pre>Square cover artwork, at least 1000 by 1000 pixels, entirely wordless, with no typography of any kind. Style: original family-friendly children's science-comedy manga with simple charcoal contours, rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone, quiet print grain, slight pigment variation and subtle paper tooth, one playful visual idea, drawn at full poster weight. Scene, one dramatic moment on a windy night: a narrow lamp-lit wooden gantry juts out over a deep canyon, and a towering surge of blank folded paper notes is roaring up the canyon and breaking over the gantry rail like a wave, thousands of small pale rectangles tumbling in the wind. Maro is airborne, launched off the rail at the top of a long diagonal arc with both mitten hands closing around one single note that glows warm ochre, the only lit object in the surge. Pedro is flat on his stomach on the planks at the gantry edge, arms stretched full length, both hands clamped on the cord that runs from his grip to Maro, one foot braced hard against a post, face set with effort. Flopaz stands upright behind them, feet apart against the gust, one hand hauling down a heavy lever that has just swung a small hatch open in the gantry wall so the wave has somewhere to go, the other hand shielding her eyes, hair and clothes streaming sideways. All three have a real part in the one idea. Composition: strong rising diagonal from Pedro's braced foot through his arms to Maro at the top of the arc, the wave mass filling the lower right, open night sky upper left; the leaping robot, the outstretched boy, and the braced girl must read as three distinct silhouettes at postage-stamp size. Palette led by the setting, low to medium saturation: deep cobalt and softened cyan night, charcoal ink contours, brick coral on the gantry lamp and its light pooling on the planks, muted green weathered timber, dusty lavender through the cloud of notes, a small warm-ochre accent on the caught note, warm off-white breathing room in the sky. At least three distinct non-neutral colors. Print-friendly contrast, legible at A5, important detail kept well away from the extreme edges. Single image, no panels. Avoid: any masthead, title, issue number, caption, logo, watermark, numerals, glyphs, pseudo-writing, interface marks, or speech balloons; any writing or printing on the paper notes; direct copies of Doraemon, Nobita, or any recognizable franchise character, blue robotic cats, signature franchise gadgets, copied costumes or copied faces; extra humans, extra robots, or robot-faced background appliances; uniform yellow, mustard, beige, sepia, cream-paper, or bright cyan backgrounds; decorative montages, contact sheets, or filler patterns; dense technical realism, steampunk clutter, or excessive crosshatching; modern glossy anime rendering, painterly concept art, neon cyberpunk, or photorealism.

Recurring cast — identities below are canon: Pedro, a school-age boy: black tousled hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions, or extra limbs. Flopaz, a school-age girl, Pedro's height: chestnut-brown hair in one low side ponytail with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top; white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails, never a hat, never glasses.
