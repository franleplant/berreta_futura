briefs:
- id: cover-seal-press-oxblood
  purpose: cover
  prompt: 'Square cover artwork, at least 1000 by 1000 pixels, entirely wordless, with no typography of any kind. The proposition, in one sentence: an agreement costs nothing to write down and everything to mean, and the price is paid in the single instant something is pressed hard enough to leave a permanent mark. How the plate sits in the cover frame, in one sentence: this is a confident-dark lantern slide inside a warm off-white page, its near-black oxblood ground shaking hands with the black masthead above while the vermilion wax picks up the masthead''s red-orange accent and the red-orange spine band at the right edge, and the white-hot stamp face reads as the one bright event in the whole cover. Medium and treatment: bold flat poster illustration in the manner of a confident screenprint, hard edges, committed saturated fills, controlled shading used only to give roundness and weight to the few big forms, print-flat color throughout, no gradients that muddy in print, no pigment-wash softness, no all-over grain or texture doing the work color should do. Ink discipline: one generous oxblood ground so deep it reads near black across the entire frame, with vermilion, cobalt, and bone white as the only other inks, all saturated and committed rather than pale or dusty. Exactly one luminous accent: the incandescent circular face of the press, white hot at its centre with a chrome yellow edge, the brightest thing in the picture. Five large forms, counted: one, a monumental blunt press plunger descending from the top edge of the frame, a plain heavy near-black column cut off by the frame, filling the upper middle; two, its white-hot circular stamp face at the bottom of that column, tilted a few degrees, hanging a hand''s width short of full contact; three, a massive cobalt slab lying across the lower third like an anvil, its front face square to the viewer, its top surface catching the hot light; four, a thick vermilion wax pad on that slab directly under the stamp, already deformed and bulging out in two blunt tongues under the coming pressure, one tongue overhanging the slab edge; five, one tiny bone-white human silhouette standing at the far left end of the slab, about a twelfth of the frame height, present only to give the press its scale. Composition and tension: a heavy vertical descent meeting a heavy horizontal, scale shock between the tiny figure and the machine, arrested motion in the last moment before the stamp lands, and the wax already yielding before it has been touched. At thumbnail size the silhouette of a huge dark column coming down onto a slab, with one burning disk between them, must read in one beat and lead the eye straight to that disk. Keep important detail well away from the extreme edges, keep the frame uncluttered, keep the tonal range printable. Judge materials, lighting, intersections, and physical relationships as strictly as composition: the metal must have real mass, the wax must be soft where it bulges, and every shadow must come from the stamp face and no other source. Avoid: any masthead, title, issue number, caption, logo, watermark, numerals, glyphs, pseudo-writing, monograms, heraldry, or any device, letter, or pattern engraved on the stamp face or impressed in the wax; hands, arms, welders, tools held by anyone, faces, characters, or narrative staging; showers of sparks, swarms, confetti, particle clouds, smoke plumes, scattered debris, grids or arrays of repeated small elements; a second press, a second slab, or any background machinery; gears, cogs, rivets, pipework, steampunk clutter, circuit motifs, network graphs, neon cyberpunk, or AI-futurist cliches; muted, dusty, pastel, sepia, beige, or gentle low-saturation palettes; mid-tone grounds, photographic gray grounds, or textured wallpaper grounds; photorealism, CGI sheen, lens flare spectacle, or concept-art rendering.'
- id: cover-one-at-a-time-throat
  purpose: cover
  prompt: 'Square cover artwork, at least 1000 by 1000 pixels, entirely wordless, with no typography of any kind. The proposition, in one sentence: everything the world pushes at you passes through one narrow door, strictly one thing at a time, and that single-file throat is exactly why nothing ever breaks. How the plate sits in the cover frame, in one sentence: this is a pale constructivist plate that breathes with the warm off-white page rather than fighting it, while the enormous violet-navy mass gives it a hard high-contrast silhouette so it never reads as a dull rectangle, and the vermilion chute below answers the masthead''s red-orange accent and the red-orange spine band at the right edge. Medium and treatment: bold flat poster illustration in the manner of a confident screenprint, hard edges, committed saturated fills, controlled shading only where it gives depth to the few big forms, print-flat color throughout, no gradients that muddy in print, no wash softness, no all-over grain standing in for color. Ink discipline: one generous pale bone-cream ground, with violet-navy so deep it reads near black, emerald, and vermilion as the only other inks, all saturated and committed rather than dusty. Exactly one luminous accent: a single white-hot cube, blazing, the brightest thing in the frame and the image''s event. Five large forms, counted: one, a monumental violet-navy hopper occupying the upper two thirds of the frame, straight hard sides tapering steeply inward, cut off by the top edge of the frame, its interior a flat darker near-black; two, three enormous emerald blocks wedged shoulder to shoulder inside that taper, jammed and pressing down, plainly unable to pass together, drawn large enough to fill their part of the frame; three, the throat itself, a narrow hard-edged bone-cream gap at the hopper''s mouth, the only opening in the whole mass; four, the single white-hot cube exactly in that throat, halfway through, its top half still dark inside the hopper and its lower half blazing in the open, casting hard emerald light up onto the blocks above it and a hard violet-navy shadow down; five, a broad vermilion chute below, angled off to the right and cut off by the frame edge, empty and waiting, with a clear cube''s width of open bone ground between the throat and the chute. Composition and tension: a top-heavy pressing mass held back by one small opening, an unmistakable hourglass silhouette achieved without any sand, arrested motion in the cube caught mid-passage, and the precarious sense that the blocks above are about to shift. At thumbnail size the tapering black mass with one hot point at its mouth must read in a single beat. Keep important detail well away from the extreme edges, keep the frame uncluttered, keep the tonal range printable. Judge materials, lighting, intersections, and physical relationships as strictly as composition: the blocks must have real weight and rest on each other honestly, the throat must be genuinely too narrow for two, and every shadow must come from the hot cube. Avoid: any masthead, title, issue number, caption, logo, watermark, numerals, glyphs, pseudo-writing, or markings printed on the blocks; sand, grains, gravel, dust, falling particles, sparks, swarms, confetti, particle clouds, scattered debris, or grids and arrays of repeated small elements; more than three blocks above the throat and more than one hot cube; frames, stands, legs, scaffolding, conveyor structures, wires, cables, arrows, or connecting lines; circuit motifs, network graphs, neon cyberpunk, or AI-futurist cliches; characters, faces, hands, or narrative staging; muted, dusty, pastel, sepia, or gentle low-saturation palettes; mid-tone grounds, photographic gray grounds, or textured wallpaper grounds; photorealism, CGI sheen, or concept-art rendering.'
- id: cover-star-into-the-pocket
  purpose: cover
  prompt: 'Square cover artwork, at least 1000 by 1000 pixels, entirely wordless, with no typography of any kind. The proposition, in one sentence: the largest thing anyone has ever built is being handed out to everybody, and it is going into an ordinary pocket that is far too small for it. How the plate sits in the cover frame, in one sentence: this is a confident-dark lantern slide inside the warm off-white page, its violet-navy ground meeting the black masthead above, the vermilion pocket lining catching the masthead''s red-orange accent and the red-orange spine band at the right edge, and the burning sphere serving as the one place the eye lands. Medium and treatment: bold flat poster illustration in the manner of a confident screenprint, hard edges, committed saturated fills, controlled shading only on the few big forms to give the cloth its folds and the sphere its roundness, print-flat color throughout, no gradients that muddy in print, no wash softness, no all-over grain or texture substituting for color. Ink discipline: one generous violet-navy ground so deep it reads near black, with cobalt, vermilion, and bone white as the only other inks, all saturated and committed rather than pale or dusty. Exactly one luminous accent: a single colossal incandescent sphere, chrome yellow at the core going white hot at the rim, the brightest thing in the picture and the image''s event. Five large forms, counted: one, that sphere, filling the upper middle of the frame, enormous, perfectly plain, with no surface markings of any kind; two, a vast cobalt plane of heavy cloth filling the lower third of the frame, seen straight on, with two big hard-edged folds and nothing else; three, an oversized bone-white patch pocket stitched flat onto that plane at the lower right, its mouth stretched into a taut oval plainly narrower than the sphere, its bowed lip strained outward; four, the flat vermilion lining showing in the open mouth of that pocket, the hottest color in the cloth, with the lower quarter of the sphere already sunk inside it; five, one tiny bone-white human silhouette standing on the cobalt plane at the far left, about a twelfth of the frame height, present only to give the sphere its scale. Composition and tension: extreme scale shock between the tiny figure, the ordinary pocket, and the sphere, spatial invasion as the sphere pushes into an opening that cannot hold it, arrested motion in the descent, and hard light raking left across the cloth so the figure and the folds throw long violet-navy shadows away from the sphere. At thumbnail size the silhouette of a huge burning disk sinking into a dark cloth horizon must read in one beat. Keep important detail well away from the extreme edges, keep the frame uncluttered, keep the tonal range printable. Judge materials, lighting, intersections, and physical relationships as strictly as composition: the cloth must strain and bow where the sphere bears on it, the stitching line of the pocket must be a hard clean seam, and all light and shadow in the frame must come from the sphere and nothing else. Avoid: any masthead, title, issue number, caption, logo, watermark, numerals, glyphs, pseudo-writing, brand marks, or embroidery on the cloth; drawn sun rays, radiating spokes, starbursts, lens flare, star fields, galaxies, nebulae, planets, or moons; sparks, embers, swarms, confetti, particle clouds, scattered debris, or grids and arrays of repeated small elements; a second sphere or a second pocket; buttons, zips, buckles, belt loops, or any garment detail beyond the pocket and two folds; whole figures wearing the garment, faces, hands, characters, or narrative staging; circuit motifs, network graphs, neon cyberpunk, or AI-futurist cliches; muted, dusty, pastel, sepia, or gentle low-saturation palettes; mid-tone grounds, photographic gray grounds, or textured wallpaper grounds; photorealism, CGI sheen, or concept-art rendering.'
