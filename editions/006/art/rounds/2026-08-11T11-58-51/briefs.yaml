briefs:
- id: cover-toll-monolith-coin
  purpose: cover
  prompt: 'Square cover artwork, at least 1000 by 1000 pixels, entirely wordless, with no typography of any kind. The proposition, in one sentence: access is something you buy, and the door answers before the payment has even landed. Medium and treatment: bold flat poster illustration in the manner of a confident screenprint, hard edges, committed saturated fills, controlled shading used only to give depth to the few big forms, print-flat color throughout, no gradients that muddy, no pigment-wash softness, no all-over grain or texture doing the work color should do. Ink discipline: one generous deep oxblood-black ground filling the entire frame, with vermilion, cobalt, and bone white as the only other inks, all of them saturated and committed rather than pale or dusty. Exactly one luminous accent: a single white-hot blade of light, the hottest and brightest thing in the picture, which owns the frame and is the image''s event. Exactly five large forms, counted: one, a monumental flat near-black monolith wall standing on the right two thirds of the frame, its face unornamented, its top edge cut off by the frame; two, a narrow horizontal slot cut low across that wall, the only opening in it; three, one enormous plain unmarked vermilion coin, standing on its edge in the left third and tipped mid-fall toward the slot, still a coin''s width short of reaching it, its lower rim not yet touching the ground; four, the white-hot blade of light already escaping the slot and raking left across the floor to meet the falling coin, throwing one hard cobalt shadow behind it; five, one tiny bone-white human silhouette standing at the foot of the wall, about a twelfth of the frame height, present only to give the wall its scale. Composition and tension: extreme scale shock between the tiny figure, the giant coin, and the endless wall, plus arrested motion in the tipping coin, plus the wrongness of the light arriving before the payment. At thumbnail size the eye must land on the white blade of light in one beat, and the silhouette of a huge disk falling toward a black wall must be instantly readable. Keep important detail well away from the extreme edges, keep the tonal range printable, and keep the frame uncluttered. Judge anatomy, materials, lighting, intersections, and physical relationships as strictly as composition. Avoid: any masthead, title, issue number, caption, logo, watermark, numerals, glyphs, pseudo-writing, denominations, or markings stamped on the coin; swarms, confetti, particle clouds, sparks, scattered debris, grids or arrays of repeated small elements; any second coin; circuit motifs, network graphs, neon cyberpunk, or AI-futurist cliches; characters, faces, narrative staging, or any scene with actors in it; muted, dusty, pastel, sepia, beige, or gentle low-saturation palettes; mid-tone or textured wallpaper grounds; photorealism, CGI sheen, lens flare spectacle, or concept-art rendering.'
- id: cover-two-vaults-one-letter
  purpose: cover
  prompt: 'Square cover artwork, at least 1000 by 1000 pixels, entirely wordless, with no typography of any kind. The proposition, in one sentence: two sealed worlds share nothing at all, and touch only through the single message crossing the gap between them. Medium and treatment: bold flat poster illustration in the manner of a confident screenprint, hard edges, committed saturated fills, controlled shading only where it gives weight to the big slabs, print-flat color throughout, no gradients that muddy, no wash softness, no all-over grain standing in for color. Ink discipline: one generous pale bone-cream ground, with deep emerald, violet-navy so dark it reads near black, and vermilion as the only other inks, all saturated and committed rather than dusty. Exactly one luminous accent: a single folded letter burning white at its core with a hot chrome-yellow edge, the brightest thing in the frame and the image''s event. Six large forms, counted: one, a sheer deep emerald slab tower rising from the bottom left corner past the top of the frame, seen straight on; two, a single shutter flush closed in that emerald face, drawn only as a hard seam; three, a sheer violet-navy slab tower rising from the bottom right corner past the top of the frame; four, one shutter in the violet-navy face half raised, a thick vermilion inner edge showing under it, the dark opening beneath still narrower than the letter; five, the tall column of pale bone ground running floor to sky in the gap between the two towers, empty and generous; six, the folded white letter in mid-flight at the centre of that gap, tilted, committed, already past the point of return, throwing one hard wedge of its own light across the emerald face and one hard shadow across the violet-navy one. Composition and tension: a symmetrical vertical canyon broken by one asymmetrical event, arrested motion in the flying letter, and the precarious question of whether the half-open shutter will finish rising in time. At thumbnail size the two black-and-emerald slabs and one hot spark between them must read instantly and lead the eye to the letter in one beat. Keep important detail well away from the extreme edges, keep the tonal range printable. Judge materials, lighting, intersections, and physical relationships as strictly as composition. Avoid: any masthead, title, issue number, caption, logo, watermark, numerals, glyphs, pseudo-writing, addresses, stamps, or writing of any kind on the letter; more than one letter; swarms, confetti, particle clouds, mail storms, grids or arrays of repeated small elements, scattered debris; wires, cables, arrows, connecting lines, circuit motifs, network graphs, neon cyberpunk, or AI-futurist cliches; characters, faces, hands, or narrative staging; muted, dusty, pastel, sepia, or gentle low-saturation palettes; mid-tone or textured wallpaper grounds; photorealism, CGI sheen, or concept-art rendering.'
- id: cover-mended-chain-link
  purpose: cover
  prompt: 'Square cover artwork, at least 1000 by 1000 pixels, entirely wordless, with no typography of any kind. The proposition, in one sentence: the line never stops, so the broken link has to mend itself while the whole load is still pulling. Medium and treatment: bold flat poster illustration in the manner of a confident screenprint, hard edges, committed saturated fills, controlled shading only on the few big forms to give the metal its roundness, print-flat color, no gradients that muddy, no wash softness, no all-over grain or texture substituting for color. Ink discipline: one generous violet-navy ground so deep it reads near black across the whole frame, with cobalt, vermilion, and bone white as the only other inks, all saturated and committed. Exactly one luminous accent: a single white-hot forged link, incandescent, the brightest thing in the picture and the image''s event. Five large forms, counted: one, a monumental cobalt chain of four or five huge links descending from the upper left corner, cut off by the frame, each link big enough to walk through; two, the same chain continuing out of the lower right corner, three or four links, also cut off by the frame; three, the torn end of the upper chain, its last link split open and drawn back taut, the fracture faces flat vermilion; four, the torn end of the lower chain, its split link likewise drawn back and straining, so the gap between the two ends is wide and clearly under full tension; five, the single white-hot new link hanging exactly in that gap, its ends already closed around both broken ends, blazing, spilling hard cobalt and vermilion light along the neighbouring links. Optionally, one tiny bone-white human silhouette standing on the flat of a lower link, about a twelfth of the frame height, only to give the chain its scale. Composition and tension: one strong diagonal from upper left to lower right, held apart at the middle by the load, with scale shock and the arrested instant just before the weld cools. At thumbnail size the broken diagonal chain and the single burning link at its centre must read in one beat. Keep important detail well away from the extreme edges, keep the tonal range printable, keep the frame uncluttered. Judge materials, lighting, intersections, and physical relationships as strictly as composition: the chain must hang and pull as real metal under load. Avoid: any masthead, title, issue number, caption, logo, watermark, numerals, glyphs, pseudo-writing, or marks stamped into the metal; showers of sparks, swarms, particle clouds, scattered debris, grids or arrays of repeated small elements; second chains, chain nets, tangles, or background chainwork; circuit motifs, network graphs, gears, cogs, steampunk clutter, neon cyberpunk, or AI-futurist cliches; characters, faces, hands holding tools, welders, or narrative staging; muted, dusty, pastel, sepia, or gentle low-saturation palettes; mid-tone or textured wallpaper grounds; photorealism, CGI sheen, lens flare spectacle, or concept-art rendering.'
