  art_path: editions/006/art/picks/cover-mended-chain-link-v2.jpg
  deck: Actors, Durable Objects, self-healing pipelines, x402, and superintelligence for every pocket
  back_text: 'HTTP has carried a status code for money since the nineties. Nobody agreed what
    it should say, so a billion times a day a server answers Payment Required and nothing
    happens. Agreements are like that: cheap to write down, expensive to mean. The machines
    are about to start meaning them.'
