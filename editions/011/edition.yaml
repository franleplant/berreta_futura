    source_id: mega-megadevhq-on-x-b8963c9d
    path: media/001.jpg
    credit: 'Figure by MEGA; source: Towards Autonomous Product Development.'
    caption: 'Context access is not unlimited access: agents read project knowledge and an observable
      environment, and reach production data only indirectly.'
    alt_text: 'Diagram of an agent''s self-service context: project knowledge and an observable environment
      it consults directly, production data reached only through a controlled boundary, and direct production
      access marked not permitted.'
    anchor: Context, not intelligence
    layout: evidence_band_prose
  - id: event-driven
    source_id: mega-megadevhq-on-x-b8963c9d
    path: media/002.jpg
    credit: 'Figure by MEGA; source: Towards Autonomous Product Development.'
    caption: 'Work can start without a human dispatch: events and schedules wake cloud agents, and the
      human sets direction.'
    alt_text: 'Side-by-side flows: human-dispatched work where a person reads signals and starts each
      agent, and event-driven work where signals trigger always-on cloud agents that call a human only
      when needed.'
    anchor: Work that doesn't wait for us
    layout: evidence_band_prose
