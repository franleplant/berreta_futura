# Edition 11 spec, scaffolded by `mag produce` from plan.yaml, then filled in.
# TITLE, COVER COPY, EMPHASIS, NOTES, AND FIGURE PICKS ARE PROVISIONAL: chosen by
# Claude on 2026-09-24 for the editor to revise; art picks too, in art/showcase.html.
# Reading order: Yegge sets the theme (fuel is what distrust costs), then the bill
# itself (Opus 5.5 prices, Cursor's tokens), the checks that spend it (CI, uReview,
# Muse), agents trusted with real work (Grok Bot, MEGA, the LLM wiki, the enzyme),
# and the people who carry trust (Pai's death spiral, Larson's archetypes).
# uReview figure (media/002.jpg, pipeline diagram) dropped: its Display P3 ICC profile
# makes the render's page tracer fail loud. Restore once the tracer accepts P3.
id: '011'
issue_number: 11
title: What Trust Costs
subtitle: A factory idling on its fuel bill, the price of a task on Opus 5.5, Cursor's token diet, CI
  under agent load, Uber's code reviewer, the fences around Muse, a support bot, a product rebuilt in
  five days, Karpathy's LLM wiki, an enzyme Claude found, the senior engineer death spiral, and four kinds
  of Staff engineer
publication_date: '2026-09-25'
status: draft
format:
  article_opener: illustrated_paper_spots_v1
art_direction_path: art-directions/story-led-boy-and-robot.yaml
cover:
  layout: footer_caption
  headline: What Trust Costs
  deck: A factory idling on its fuel bill, the price of a task on Opus 5.5, Cursor's token diet, CI under
    agent load, Uber's code reviewer, the fences around Muse, a support bot, a product rebuilt in five
    days, Karpathy's LLM wiki, an enzyme Claude found, the senior engineer death spiral, and four kinds
    of Staff engineer
  back_text: 'Yegge can no longer afford to run his factory on the one model he trusts. Fuel is what distrust
    costs you: every retry, every extra review, every fence. This issue follows that bill through prices
    and caches, test selection and code review, sandboxes and support queues, and closes with the people
    who carry the trust no token buys.'
  art_path: editions/011/art/rounds/2026-09-25T00-27-24/cover-synthetic-nozzle-floods-keyhole-v4.png
