- id: cover-synthetic-nozzle-floods-keyhole
  purpose: cover
  prompt: 'Branch: synthetic. Reading: every check an agent must pass is fuel burned, so distrust is paid for by the drop. Metaphor: a fuel nozzle floods a keyhole. The verb is FLOODS, drawn at its most violent instant, the jet hitting the lock at full pressure. Register: constructivist poster diagonal, hard-cut shapes, angular thrust, confident flat fills with controlled shading only on the big forms. Inks: ultramarine and tangerine as the committed inks, a near-black used only as a form ink, on a generous chrome yellow ground that stays unmistakably yellow in print; one luminous accent, the white-hot jet of fuel. Four large forms, counted: the oversized fuel nozzle, its hose, a massive keyhole slab, and the white jet. Weapons: thrust, with the whole composition driving from the upper right to the lower left along one diagonal, and frame invasion, with the hose and nozzle bleeding off the top and right edges. The nozzle is the size of a locomotive against the keyhole slab. Type zones: keep the top-left corner quiet for a small wordmark and the bottom strip clear for one line of type. Essential subject inside the middle three-fifths of a portrait 2:3 plate, 1440x2160. Print-flat color, hard edges, no muddy gradients, no pigment-wash softness, no all-over grain. No swarms, confetti, particles, grids, or scattered debris. No typography of any kind: no masthead, title, numerals, logo, caption, pseudo-writing, or watermark. No circuit motifs, network graphs, neon cyberpunk, or AI-futurist cliches. No characters and no scene staging.'
- id: cover-art-directed-canister-tips-into-lock
  purpose: cover
  prompt: 'Branch: art_directed. Reading: a builder who trusts one engine keeps pouring money into it until the tank tips past the point of no return. Metaphor: the fuel meant for work spills into the lock that guards it. Medium: a staged tabletop photograph of real handmade objects, lit by a single raking window light from the left, with true cast shadows, real reflections in glass, weight you can feel in the iron. Subject: a hand-blown glass canister of amber fuel TIPS past its balance point on the lip of a pale plaster ledge, its thick amber stream pouring mid-air straight into the keyhole of a heavy cast-iron padlock with a verdigris patina. Five forms, counted: the canister, the amber stream, the padlock, its long cast shadow, and the ledge edge. Hues committed: bone plaster ground, amber, oxblood lacquer on the canister cap, verdigris teal, burnished brass on the shackle. Weapon: radical viewpoint, a low macro camera almost at ledge height looking up at the tipping canister so it towers over the lock. Ground: pale bone plaster, evenly lit, never gray or dim. Type zones: the top-left corner stays open plaster for a small wordmark and the bottom strip stays clean ledge for one line of type. Essential subject inside the middle three-fifths of a portrait 2:3 plate, 1440x2160, crisp high-contrast silhouette against the pale ground. No typography, labels, numerals, or pseudo-writing anywhere, including on the canister. No hands, no people. No circuit motifs, network graphs, neon, or AI-futurist cliches. No dark or mid-tone background, no clutter, no scattered debris.'
- id: cover-wildcard-ice-padlock-bursts
  purpose: cover
  prompt: 'Branch: wildcard. Reading: trust costs nothing until it breaks, and then you pay for all of it at once. Proposition: a colossal padlock carved from clear ice BURSTS open, split clean in two by a single gold coin frozen at the exact point of impact. Single colossal form commitment: the padlock is the size of a house and nothing else shares the frame except its own parts. Forms, counted: the left half of the ice lock body, the right half, the snapped shackle arcing upward, the gold coin at the split, and the lock''s hard shadow on the floor. Render as a hyperreal award-winning studio photograph of an impossible event: motion frozen at one ten-thousandth of a second, hard studio strobe from above right, caustic light refracting through the ice onto the floor, the coin blazing warm gold. Ground: a saturated violet seamless studio sweep that stays unmistakably violet in print, with the ice picking up magenta and cool emerald refractions. Weapon: frame invasion, the lock halves bleeding off the left and right edges, the shackle cropped by the top of the plate. Two clean halves only: no shards, no spray, no scattered debris, no particles. Type zones: keep the top-left corner calm violet for a small wordmark and the bottom strip clear floor for one line of type. Essential event inside the middle three-fifths of a portrait 2:3 plate, 1440x2160. No typography, numerals, engraving, logo, or pseudo-writing on the lock or coin. No people, no hands. No darkness as mood, no black or near-black ground, no neon cyberpunk, no circuit motifs, no AI-futurist cliches.'
- id: opener-seats-and-sunsets
  purpose: opener
  article_id: seats-and-sunsets-steve-yegge
  prompt: |-
    Scene: inside a cheerful toy factory with idle conveyor belts, a big rounded machine with a wide brass funnel on top and a round dial whose needle droops low. Pedro stands on a wobbly step stool, pouring a comically tiny fuel can into the giant funnel, cheeks puffed with effort. Flopaz stands beside the machine, calmly pointing up at the sagging needle with a raised eyebrow. Maro holds an empty coin purse upside down, one lonely coin falling out, eyes curved in dismay. Tall factory windows on the left glow with a coral and lavender sunset, laying long light across the floor. One playful idea: the huge hungry machine and the tiny can. Original family-friendly children's science-comedy manga illustration: simple charcoal contours, rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone, slight pigment variation, subtle paper tooth, quiet print grain, single panel. Palette: gentle historical magazine color at low to medium saturation, softened cyan and cobalt, brick coral, muted green, dusty lavender, small warm-ochre accents, warm off-white breathing room, charcoal ink; at least three distinct non-neutral colors, the background color arising from the sunset factory. Strong silhouettes and expressions legible at A5, print-friendly contrast. Landscape frame 1760x1024 (1.71:1) filled edge to edge; keep every head, hand, and essential prop well inside the frame with headroom. Entirely wordless: no text, letters, numerals, labels, captions, speech balloons, pseudo-writing, or interface glyphs, and the dial has no markings. Nobody appears except Pedro, Maro, and Flopaz: no extra humans, no extra robots, no robot-faced appliances. Avoid copies of Doraemon, Nobita, or any franchise character, blue robotic cats, signature franchise gadgets, copied costumes or faces; avoid uniform yellow, mustard, beige, sepia, cream-paper, or bright cyan backgrounds; avoid decorative montages, filler patterns, dense technical realism, steampunk clutter, excessive crosshatching, glossy anime rendering, painterly concept art, neon cyberpunk, and photorealism.

    Recurring cast — draw exactly as specified, never redesign: Pedro, a school-age boy: black tousled hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions, or extra limbs. Flopaz, a school-age girl, Pedro's height: chestnut-brown hair in one low side ponytail with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top; white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails, never a hat, never glasses.
  subject: Pedro, Maro, and Flopaz try to keep a whimsical toy factory running on one expensive fuel as the sun sets through its windows.
  composition: Wide factory floor with a big rounded machine at center right, Pedro on a step stool pouring a tiny can into its giant funnel, Flopaz pointing at a sagging gauge needle, Maro holding an empty coin purse upside down, warm sunset light raking in from tall windows on the left.
