- id: closing-orchard-ladder
  purpose: closing
  prompt: |-
    Scene: late afternoon in an autumn apple orchard. A single tall wooden ladder leans into an old apple tree whose crown fills the top of the page with muted-green and warm-ochre leaves and a few brick-coral apples. At the bottom, Flopaz plants both feet and braces the ladder's legs with her whole weight, looking up with calm focus. Halfway up, Maro hooks one mitten hand on a rung and lifts a woven basket upward with the other, antenna tilted toward the top. At the top, Pedro leans out and stretches for the last apple on a high branch, tongue out in concentration, trusting the ladder completely. A few fallen apples rest in the grass at the ladder's foot. One idea: the one who reaches highest depends on the one holding the bottom. Full-page closing plate, portrait 1536x2160 (1:1.41, an A5 page), poster weight, the ladder's height carrying the vertical composition from grass to canopy, all three cast members in the middle band with every head and hand well inside the frame. Mood leads: low golden autumn light, slightly more painterly watercolor, Pedro and Flopaz may read a few years older in knitted sweaters and boots for the season, while their identity anchors hold exactly as canon. Original family-friendly children's science-comedy manga illustration: simple charcoal contours, rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone, slight pigment variation, subtle paper tooth, quiet print grain, single panel. Palette: gentle historical magazine color at low to medium saturation, softened cyan and cobalt sky behind the leaves, brick coral, muted green, dusty lavender shadows, small warm-ochre accents, warm off-white breathing room, charcoal ink; at least three distinct non-neutral colors; the setting chooses the background. Strong silhouettes and expressions legible at A5, print-friendly contrast. Entirely wordless: no text, letters, numerals, labels, captions, speech balloons, pseudo-writing, or interface glyphs. Nobody appears except Pedro, Maro, and Flopaz: no extra humans, no farmers, no extra robots, no robot-faced appliances. Avoid copies of Doraemon, Nobita, or any franchise character, blue robotic cats, signature franchise gadgets, copied costumes or faces; avoid uniform yellow, mustard, beige, sepia, cream-paper, or bright cyan backgrounds; avoid decorative montages, contact sheets, filler patterns, dense technical realism, steampunk clutter, excessive crosshatching, modern glossy anime rendering, painterly concept art, neon cyberpunk, and photorealism.

    Recurring cast — identities below are canon: Pedro, a school-age boy: black tousled hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions, or extra limbs. Flopaz, a school-age girl, Pedro's height: chestnut-brown hair in one low side ponytail with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top; white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails, never a hat, never glasses.

    This slot is licensed to vary presentation, overriding the fixed outfits above where they conflict: Closing plates carry the same license as tails at full-page poster weight: mood leads, identity anchors hold.
  subject: Pedro picks the last apple at the top of a tall wooden ladder while Flopaz braces its feet and Maro relays the basket halfway up.
  composition: Portrait A5 plate, 1536x2160, one tall orchard ladder rising from grass at the bottom to a canopy near the top, the three figures stacked along it in the middle band with every head and hand well inside the frame.
  alt_text: In an autumn orchard, a girl braces the foot of a tall wooden ladder, a small robot midway up passes a basket, and a boy at the top stretches for the last apple.
  credit: Illustration generated for this edition.
