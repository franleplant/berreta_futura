<figure>
<img src="cover-synthetic-bolt-outrun-v1.png" loading="lazy">
<figcaption>cover-synthetic-bolt-outrun — variant 1</figcaption>
<details><summary>prompt</summary><pre>Editorial cover art. The proposition, in one sentence: the repair lands and the breach has already run past it.
Graphic register: relief linocut printed from a carved block, brutal blacks, gouge marks visible at the form edges, a faint double-inked overlap where two plates meet.
The verb is SPLITS, drawn at its most violent instant: a hairline fracture splits the stone slab, racing ahead of the colossal iron bolt that is still driving home.
Count the forms, five and no more: one enormous headed iron bolt driven diagonally from the upper left, the stone slab it is meant to close, the fracture tearing away from the bolt toward the lower right, the shear of slab already lifting free, and a single white glint on the bolt head.
Compositional weapons: scale shock, the bolt is the size of a bridge girder against a slab that reads as a wall of a building; and frame invasion, the bolt bleeds off the left and top edges, the slab off the bottom and right, cropped confidently.
Inks, exactly these: a generous chrome yellow ground that stays unmistakably a saturated color in print; near black as a form ink for the bolt and the carved shadow; vermilion for the fracture and the lifted shear. One luminous accent and one only: a hot white glint at the bolt head that owns the frame and is the image's event.
Rendering: print flat color, hard edges, confident fills, the only shading a controlled two step on the two biggest forms. No gradients, no wash softness, no all over grain.
Portrait 2:3, 1440x2160 pixels, full bleed. Type zones: the top left corner is quiet chrome yellow ground with no detail, reserved for a small wordmark, and the bottom 90 points is flat ground tolerating one line of type; the right edge tolerates a narrow band. Nothing essential in the outer eighth of any edge; the essential subject sits in the middle three fifths.
Absolutely no typography, no lettering, no pseudo writing, no numerals, no logo, no caption, no watermark anywhere in the artwork. No swarms, confetti, particle clouds, grids of repeated small elements, or scattered debris. No characters, no narrative staging. No circuit motifs, network graphs, neon cyberpunk, or AI futurist cliche. Anatomy of the machined forms, material weight, and the way the bolt meets the stone must read as physically true.</pre></details>
</figure>

<details><summary>prompt</summary><pre>Cover art in the art directed branch, a studio photograph of real material under real light. The proposition, in one sentence: pushed past the speed its own body can hold, the thing being made tears itself open.
Medium and craft: macro studio photography of wet stoneware on a spinning potter's wheel, hard raking key light from the left with a single soft fill, believable weight in the clay, visible slip, water sheen, and the tooth of the grog. Render with full depth: modelled form, cast shadow, atmosphere, real facture.
The verb is TEARS. Catch the exact instant the flaring vessel wall goes past true and opens along the rim, not the slumped aftermath.
Four large forms: the flaring vessel wall opening along one side; the iron wheelhead beneath it; an arc of cobalt glaze thrown off the rim and still airborne as one continuous ribbon, never a spray of droplets; and a wooden potter's rib tool falling out of frame at the bottom.
Compositional weapons: radical viewpoint, dead on macro from slightly below the rim; and frame invasion, the wheelhead bleeds off the bottom and both side edges.
Color, four to six hues, exempt from any ink discipline: a saturated emerald seamless backdrop that stays a color in print, wet umber clay, ochre slip, one cobalt glaze arc, bone white specular highlights, a breath of rose in the reflected light. The silhouette of clay against emerald must stay hard edged and high contrast; no mid tone haze, no muddy field, no near black ground.
Portrait 2:3, 1440x2160 pixels, full bleed. Type zones: the top left corner holds unbroken emerald backdrop for a small wordmark, the bottom 90 points is quiet enough for one line of type, the right edge tolerates a narrow band. Essential subject inside the middle three fifths, no important detail at the extreme edges.
No people, no hands. No typography, lettering, pseudo writing, numerals, logos, captions, or watermarks in the artwork. No particle clouds or scattered debris. Physical relationships, material behaviour, and lighting must be judged as strictly as composition; nothing generically AI, no circuit motifs, no neon.</pre></details>

<details><summary>prompt</summary><pre>Cover art, wildcard branch, built for impact: one improbable event rendered like an award winning photograph of something that cannot happen.
In one sentence: the limit gets overtaken from behind, and the enamel gives way before the sign can even swing.
Photorealistic, cinematic, hard studio strobe against open sky. The verb is PUNCHES. A single heavy steel ball bearing, the size of a cannonball, punches clean through a huge tangerine enamel road roundel; the enamel skin curls back around the hole in torn petals, bare steel showing bright at the tear, the disc still perfectly upright, caught in the millisecond of penetration.
Three forms only: the roundel, the curling torn lip with its bright raw edge, the bearing mid flight with the hard shadow it throws on the enamel face. Nothing else in frame.
Compositional weapons: dead on macro viewpoint, and frame invasion, the roundel bleeds off both side edges and the bottom so the plate crops it hard.
Color entirely its own: a saturated violet sky as the ground, a tangerine enamel face with a bone white rim, cold steel greys, one small hot specular on the bearing. Hard edged high contrast silhouette against the violet; no dusk haze, no mid tone mush, no dark or near black ground.
Portrait 2:3, 1440x2160 pixels, full bleed. Type zones: the top left corner is clean violet sky for a small wordmark, the bottom 90 points is quiet sky tolerating one line of type, the right edge tolerates a narrow band. Essential subject in the middle three fifths.
The enamel face is blank: no numerals, no letters, no symbols, no pseudo writing, no logos, no captions, no watermark anywhere in the artwork. No debris fields, no particle clouds, no swarms. Materials, impact physics, shadow, and reflection must be believable at full size and the silhouette must read in one beat at thumbnail size.</pre></details>

<details><summary>prompt</summary><pre>A single wordless editorial illustration. Scene: early morning in the courtyard of a small civic building. Pedro kneels on a low plank scaffold, pressing the last fresh brick into a gap in a stone boundary wall, trowel still in his hand, pleased and slightly out of breath. Maro stands below him holding up the mortar bucket with both mitten hands, screen eyes turned upward. Flopaz crouches at the foot of the wall a little to the right, one hand flat on the stone, looking straight into a second gap that has already opened low down, with morning light spilling through it onto the paving. Only Pedro, Maro, and Flopaz are in the picture, each with a real part in the one idea: the hole is closed and another is already open.
Frame: landscape 1760x1024 pixels, 1.71 to 1, filled edge to edge; every head, hand, trowel, and bucket sits well inside the frame with generous headroom, since nothing outside the frame prints.
Style: original family friendly children's science comedy manga, simple charcoal contours, rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone, quiet print grain, one playful visual idea, entirely wordless.
Palette: scene led gentle historical magazine color at low to medium saturation, softened cyan and cobalt, brick coral, muted green, dusty lavender, small warm ochre accents, warm off white breathing room, charcoal ink; the setting chooses the background, at least three distinct non neutral colors, never one uniform yellow paper field.
Print friendly contrast, strong silhouettes and expressions legible at A5 size, slight pigment variation, subtle paper tooth, quiet print grain. Single panel, never a multi panel sequence.
Avoid: any resemblance to Doraemon, Nobita, or any recognizable franchise character, blue robotic cats, franchise gadgets, copied costumes or faces; uniform yellow, mustard, beige, sepia, cream paper, or bright cyan backgrounds; extra humans, extra robots, robot faced appliances; decorative montages, contact sheets, filler patterns; dense technical realism, steampunk clutter, heavy crosshatching; modern glossy anime rendering, painterly concept art, neon cyberpunk, photorealism; decorative pseudo writing, interface glyphs, captions, labels, or speech balloons.

Recurring cast — draw exactly as specified, never redesign: Pedro, a school-age boy: black tousled hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions, or extra limbs. Flopaz, a school-age girl, Pedro's height: chestnut-brown hair in one low side ponytail with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top; white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails, never a hat, never glasses.</pre></details>
</figure>
