<figcaption>closing-the-lock-gate — variant 1</figcaption>
<details><summary>prompt</summary><pre>A full page wordless plate, poster weight, high summer noon register. Scene: a stone canal lock cut deep into a grassy bank, seen from the towpath a little above it. The upper pound is full and green and still; the lower chamber below is drawn down to wet stone, and one half raised sluice paddle sends a single thick rope of white water falling the whole height of the chamber. Pedro stands out on the balance beam of the closed gate with his whole weight thrown against it, feet skidding on the worn timber, glasses slipping. Flopaz kneels at the paddle gear on the coping with both hands on the winding handle, giving it a careful quarter turn, and she is watching the water level rather than the falling water. Maro stands down on the lower cill with his mitten hands flat on the wet stone and his screen tipped up, reading the rise against a worn depth mark cut into the wall. One small empty wooden boat waits in the lower chamber with its rope slack. Hot pale stone, moss in the joints, bright green upper water, a wide summer sky. Painterly looseness is welcome in the falling water and the haze, but the drawing stays the edition's drawing. Only Pedro, Maro, and Flopaz appear.
Frame: portrait A5 page, 1536x2160 pixels, 1 to 1.41, filled edge to edge, composed to hold up as a full page plate with the cast legible at print size and nothing essential in the outer eighth.

Palette: scene led gentle historical magazine color at low to medium saturation, softened cyan and cobalt, brick coral, muted green, dusty lavender, small warm ochre accents, warm off white breathing room, charcoal ink; the summer lock and its green water choose the background, at least three distinct non neutral colors, never one uniform yellow paper field.
Print friendly contrast, strong silhouettes and expressions legible at A5 size, slight pigment variation, subtle paper tooth, quiet print grain. Single image, never a multi panel sequence.

Recurring cast — identities below are canon: Pedro, a school-age boy: black tousled hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions, or extra limbs. Flopaz, a school-age girl, Pedro's height: chestnut-brown hair in one low side ponytail with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top; white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails, never a hat, never glasses.

<details><summary>prompt</summary><pre>A full page wordless plate, poster weight, windy late afternoon register. Scene: a bare grassy ridge under a big moving sky, the grass combed flat in one direction by a hard spring gale. An enormous kite rides high in the upper third of the page, small with distance but pulling like a horse, its line running as one taut diagonal down the whole page. Flopaz stands furthest out on the ridge with both hands on the line and her heels dug in, leaning back into the pull, calm and reading the sky. Pedro is braced behind her at a stout wooden winder set in the turf, cranking the handle to let line out one deliberate turn at a time, mouth set with effort, hair pushed sideways by the wind. Maro sits back at the anchor stake with the line taken one round about it and gripped in both mitten hands, rounded feet planted, screen turned up to watch the kite. Cloud shadow runs across the ridge behind them. Painterly softness is welcome in the racing cloud and the far country below, but the drawing stays the edition's drawing. Only Pedro, Maro, and Flopaz appear.
