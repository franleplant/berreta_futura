- id: closing-the-lock-gate
  purpose: closing
  prompt: |-
    A full page wordless plate, poster weight, high summer noon register. Scene: a stone canal lock cut deep into a grassy bank, seen from the towpath a little above it. The upper pound is full and green and still; the lower chamber below is drawn down to wet stone, and one half raised sluice paddle sends a single thick rope of white water falling the whole height of the chamber. Pedro stands out on the balance beam of the closed gate with his whole weight thrown against it, feet skidding on the worn timber, glasses slipping. Flopaz kneels at the paddle gear on the coping with both hands on the winding handle, giving it a careful quarter turn, and she is watching the water level rather than the falling water. Maro stands down on the lower cill with his mitten hands flat on the wet stone and his screen tipped up, reading the rise against a worn depth mark cut into the wall. One small empty wooden boat waits in the lower chamber with its rope slack. Hot pale stone, moss in the joints, bright green upper water, a wide summer sky. Painterly looseness is welcome in the falling water and the haze, but the drawing stays the edition's drawing. Only Pedro, Maro, and Flopaz appear.
    Frame: portrait A5 page, 1536x2160 pixels, 1 to 1.41, filled edge to edge, composed to hold up as a full page plate with the cast legible at print size and nothing essential in the outer eighth.
    Style: original family friendly children's science comedy manga, simple charcoal contours, rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone, quiet print grain, one idea, entirely wordless. Broad period and production cues only, never a franchise character, costume, silhouette, or gadget.
    Palette: scene led gentle historical magazine color at low to medium saturation, softened cyan and cobalt, brick coral, muted green, dusty lavender, small warm ochre accents, warm off white breathing room, charcoal ink; the summer lock and its green water choose the background, at least three distinct non neutral colors, never one uniform yellow paper field.
    Print friendly contrast, strong silhouettes and expressions legible at A5 size, slight pigment variation, subtle paper tooth, quiet print grain. Single image, never a multi panel sequence.
    Avoid: any resemblance to Doraemon, Nobita, or any recognizable franchise character, blue robotic cats, franchise gadgets, copied costumes or faces; uniform yellow, mustard, beige, sepia, cream paper, or bright cyan backgrounds; extra humans, extra robots, robot faced appliances; decorative montages, contact sheets, filler patterns; dense technical realism, steampunk clutter, heavy crosshatching; modern glossy anime rendering, painterly concept art, neon cyberpunk, photorealism; decorative pseudo writing, interface glyphs, numerals, captions, labels, or speech balloons.

    Recurring cast — identities below are canon: Pedro, a school-age boy: black tousled hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions, or extra limbs. Flopaz, a school-age girl, Pedro's height: chestnut-brown hair in one low side ponytail with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top; white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails, never a hat, never glasses.

    This slot is licensed to vary presentation, overriding the fixed outfits above where they conflict: Closing plates carry the same license as tails at full-page poster weight: mood leads, identity anchors hold.
  subject: The cast lets a canal lock fill at a chosen rate, one quarter turn of the paddle at a time, with the gauge mark and not the torrent deciding the pace.
  composition: A deep vertical stone chamber down the centre of the page with the falling water as its spine, Pedro high on the gate beam at the left, Flopaz at the gear on the right coping, and Maro small at the bottom on the cill reading the mark.
  alt_text: Pedro throws his weight against a canal lock gate beam while Flopaz turns the sluice handle a quarter turn and Maro, down on the wet cill, reads the rising water against a mark cut in the stone.
  credit: Illustration generated for this edition.
  cast_references:
  - art-directions/references/story-led-boy-and-robot-cast.png
- id: closing-holding-the-line
  purpose: closing
  prompt: |-
    A full page wordless plate, poster weight, windy late afternoon register. Scene: a bare grassy ridge under a big moving sky, the grass combed flat in one direction by a hard spring gale. An enormous kite rides high in the upper third of the page, small with distance but pulling like a horse, its line running as one taut diagonal down the whole page. Flopaz stands furthest out on the ridge with both hands on the line and her heels dug in, leaning back into the pull, calm and reading the sky. Pedro is braced behind her at a stout wooden winder set in the turf, cranking the handle to let line out one deliberate turn at a time, mouth set with effort, hair pushed sideways by the wind. Maro sits back at the anchor stake with the line taken one round about it and gripped in both mitten hands, rounded feet planted, screen turned up to watch the kite. Cloud shadow runs across the ridge behind them. Painterly softness is welcome in the racing cloud and the far country below, but the drawing stays the edition's drawing. Only Pedro, Maro, and Flopaz appear.
    Frame: portrait A5 page, 1536x2160 pixels, 1 to 1.41, filled edge to edge, composed to hold up as a full page plate with the cast legible at print size and nothing essential in the outer eighth.
    Style: original family friendly children's science comedy manga, simple charcoal contours, rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone, quiet print grain, one idea, entirely wordless. Broad period and production cues only, never a franchise character, costume, silhouette, or gadget.
    Palette: scene led gentle historical magazine color at low to medium saturation, softened cyan and cobalt, brick coral, muted green, dusty lavender, small warm ochre accents, warm off white breathing room, charcoal ink; the windy green ridge and its cloud sky choose the background, at least three distinct non neutral colors, never one uniform yellow paper field.
    Print friendly contrast, strong silhouettes and expressions legible at A5 size, slight pigment variation, subtle paper tooth, quiet print grain. Single image, never a multi panel sequence.
    Avoid: any resemblance to Doraemon, Nobita, or any recognizable franchise character, blue robotic cats, franchise gadgets, copied costumes or faces; uniform yellow, mustard, beige, sepia, cream paper, or bright cyan backgrounds; extra humans, extra robots, robot faced appliances; flocks of birds or scattered clouds of small repeated shapes; decorative montages, contact sheets, filler patterns; dense technical realism, steampunk clutter, heavy crosshatching; modern glossy anime rendering, painterly concept art, neon cyberpunk, photorealism; decorative pseudo writing, interface glyphs, numerals, captions, labels, or speech balloons.

    Recurring cast — identities below are canon: Pedro, a school-age boy: black tousled hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions, or extra limbs. Flopaz, a school-age girl, Pedro's height: chestnut-brown hair in one low side ponytail with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top; white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails, never a hat, never glasses.

