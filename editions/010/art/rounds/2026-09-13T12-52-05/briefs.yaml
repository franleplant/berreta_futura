  subject: A kite strong enough to drag all three of them stays flyable only because the line is paid out one measured turn at a time and anchored at the far end.
  composition: One taut diagonal line from the high kite in the upper right down to the anchor stake at the lower left, with Flopaz leaning against the pull, Pedro at the winder mid page, and Maro holding the turn at the bottom.
  alt_text: On a windswept ridge Flopaz leans back against the pull of a high kite while Pedro pays the line out from a wooden winder and Maro holds a turn of it around an anchor stake.
  credit: Illustration generated for this edition.
