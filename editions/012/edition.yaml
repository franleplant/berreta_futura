  #   detect-and-send-production-issues-straight-to-yo-99aa0cdb media/001.png: 
  #   detect-and-send-production-issues-straight-to-yo-99aa0cdb media/002.png: 
  #   detect-and-send-production-issues-straight-to-yo-99aa0cdb media/003.png: 
  #   detect-and-send-production-issues-straight-to-yo-99aa0cdb media/004.png: 
  #   detect-and-send-production-issues-straight-to-yo-99aa0cdb media/005.png: 
  figures:
  - id: issues-list
    source_id: detect-and-send-production-issues-straight-to-yo-99aa0cdb
    path: media/002.png
    caption: The Issues tab for a production Worker groups failures into issues, each with an event count,
      a trend line, and when it was last seen.
    alt_text: Screenshot of the Cloudflare dashboard Issues tab for a Worker named portal-prod. Summary
      tiles show latest occurrence 4 minutes ago, 244 active issues, 93.64k active occurrences, and 0 resolved
      issues. A table lists issues such as Worker exceeded CPU time limit with 748 events and TimeoutError,
      The operation was aborted due to timeout, with 3.57k events, each with a small trend sparkline, last-seen
      time, and an Active status.
    anchor: Catch failures automatically
    layout: evidence_band_prose
  - id: occurrence-context
    source_id: detect-and-send-production-issues-straight-to-yo-99aa0cdb
    path: media/004.png
    caption: With identifiers added through the tracing API, each occurrence shows the user and session
      it affected above its execution trail.
    alt_text: Screenshot of an issue occurrence. A Context section shows User ID usr_8f2a1c9d and Session
      ID sess_01JQ9CX7P4R8N2KM. Below, an Execution trail lists a GET / request and an error, Unexpected
      end of JSON input, both at 09:17:06.525.
    anchor: Contextualizing errors for your agent
    layout: compact_band
  - id: issue-to-agent-flow
    source_id: detect-and-send-production-issues-straight-to-yo-99aa0cdb
    path: media/001.png
    caption: 'Five stages: a Worker fails in production, Cloudflare groups and routes the issue, a coding
      agent investigates and opens a pull request, and the team decides what reaches production.'
    alt_text: 'Diagram of five numbered boxes in a row. Under Production: 1, Production Worker, an exception,
      5xx, or error log occurs. Under Cloudflare Automation: 2, Detect and group, related failures become
      one issue with diagnostic context; 3, Route the issue, use an automation trigger or send it manually
      to a configured destination. Under Agent-assisted: 4, Investigate, the coding agent proposes changes
      to code and tests and opens a pull request, with an optional link to Cloudflare MCP. Under Human control:
      5, Review and deploy, your team reviews the proposal and decides what reaches production.'
    anchor: Send detected issues to your agent
    layout: evidence_band_prose
