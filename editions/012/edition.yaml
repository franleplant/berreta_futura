  figures:
  - id: hillclimb-loop
    source_id: automating-eval-design-and-hillclimbing-with-cla-757c4a0e
    path: media/006.png
    caption: 'The hillclimbing loop: an analyzer reads only train-split failures and proposes one diff per
      round, which is kept when train and test both rise and reverted when only train rises or either score
      drops.'
    alt_text: 'Flow diagram. The thing being edited, such as a prompt, feeds an application of model plus
      harness held fixed, scored on a held-out test split and a train split. Train-split traces go to an
      analyzer that proposes one diff per round. Decision boxes read: train up and test up, keep the diff;
      train up and test flat, overfit, revert; either down, regression, revert.'
