- id: introducing-forge-the-open-source-pipeline-for-g
  title: 'Introducing Forge: the open source pipeline for SDKs and CLIs'
  short_title: Introducing Forge
  display_emphasis: Forge
  opener_variant: edge_medallion
  author: Dimitri Mitropoulos, Matt “TK” Taylor, Samuel Macleod
  author_note: "From the Cloudflare blog."
  content_mode: article
  source_ids:
  - introducing-forge-the-open-source-pipeline-for-g-2f7c2d78
  manuscript: editions/012/articles/introducing-forge-the-open-source-pipeline-for-g.md
  # figure candidates (uncomment into a `figures:` list; each row needs id, source_id, path, caption, alt_text,
  # anchor = a ## or ### heading in the manuscript, and layout = one of evidence_band, evidence_band_prose, adaptive_band,
  # compact_band, column_plate, landscape_plate, full_band, rotated_plate; render enlarges small-text figures
  # itself unless the row sets fit: keep, and tone: auto|keep|invert controls dark-image inversion). short_title and display_emphasis must occur inside title.
  #   introducing-forge-the-open-source-pipeline-for-g-2f7c2d78 media/001.png: 
  #   introducing-forge-the-open-source-pipeline-for-g-2f7c2d78 media/002.png: 
  #   introducing-forge-the-open-source-pipeline-for-g-2f7c2d78 media/003.png: 
  #   introducing-forge-the-open-source-pipeline-for-g-2f7c2d78 media/004.png: 
  figures:
  - id: before-after-forge
    source_id: introducing-forge-the-open-source-pipeline-for-g-2f7c2d78
    path: media/002.png
    caption: Before Forge, a broken spec surfaced only after three merged PRs reached the SDK generator;
      with Forge in CI, the team learns of the failure before its PR merges.
    alt_text: 'Two-column diagram. Before Forge: a feature API spec passes through PR merged steps into
      an aggregate API spec, a centralized config that may miss some operations, and an SDK generator, ending
      in a red box reading Failure detected, team had no idea, revert 3 upstream PRs. After Forge: the same
      feature API spec goes through Forge in CI straight to a red box reading Failure detected, team knows
      immediately before PR merges.'
    anchor: Our API outgrew our generators
    layout: column_plate
  - id: chained-targets
    source_id: introducing-forge-the-open-source-pipeline-for-g-2f7c2d78
    path: media/003.png
    caption: One OpenAPI operation flows through Forge CI into the TypeScript SDK, which in turn produces
      the cf CLI command, the Cap'n Web call, and the docs page.
    alt_text: Flow diagram. An OpenAPI box for GET /accounts/tokens with operationId accounts.tokens.list
      feeds a Forge CI box listing lint and validate, resolve refs, publish global metrics, and aggregate.
      That feeds a TypeScript SDK box with client.accounts.tokens.list(), which branches to a cf CLI box
      with cf accounts tokens list and a Cap'n Web box with await api.accounts.tokens.list(). All three
      feed a Docs box for accounts, tokens, list covering TypeScript, cf CLI, and Cap'n Web.
    anchor: Generate anything, chain the outputs
    layout: column_plate
  opener_art:
    path: editions/012/art/picks/opener-introducing-forge-v2.jpg
    alt_text: 'Pedro feeds one sheet of dough into a crank machine Maro turns, and Flopaz catches the cookies that come out shaped like a key, a book, and a toolbox.'
    credit: Illustration generated for this edition.
  tail_art_path: editions/012/art/picks/tail-introducing-forge-v1.jpg
