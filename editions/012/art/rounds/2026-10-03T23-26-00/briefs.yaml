briefs:
- id: opener-one-month-without-ai
  purpose: opener
  article_id: one-month-without-ai
  prompt: 'Original family-friendly children''s science-comedy manga illustration, synthetic and naive,
    never a rendered scene: simple charcoal contours, rounded readable expressions, economical watercolor
    washes, minimal hatching, restrained halftone, slight pigment variation, subtle paper tooth, quiet
    print grain. Gentle historical magazine color at low to medium saturation: softened cyan and cobalt,
    brick coral, muted green, dusty lavender, small warm-ochre accents, charcoal ink, warm off-white paper,
    at least three distinct non-neutral colors. Scene: Pedro, with a firm decided face, holds a pulled
    power plug at the end of a cable; Maro sags beside him, eyes drooping into sleepy curves, dozing upright;
    Flopaz, calm, holds out a yellow pencil and a plain paper notebook to Pedro. Props: the cable and
    plug, the pencil, the notebook. Setting barely suggested: one soft dusty-lavender wash behind the
    three, one pale wall-socket edge at the left, one soft cast shadow under them. Nothing else. The washes
    stop short of the frame edges and fade into warm off-white paper; the cast is drawn large, filling
    most of the frame height, with calm empty paper around them. Landscape frame 1.71:1, 1760x1024, cropped
    object-fit cover: keep every head, hand, and essential prop well inside the frame with headroom. Entirely
    wordless; the notebook pages are blank. Pedro, Maro, and Flopaz are the only characters, each drawn
    exactly to their cast descriptions; nobody else appears. Strong silhouettes and expressions legible
    at A5, print-friendly contrast. Avoid: detailed or full-bleed backgrounds, shelves, pegboards, posters,
    furniture sets, sunsets, panoramas, crisp digital line art, cel shading, a flat yellow, mustard, beige,
    sepia, or bright cyan field filling the frame, extra humans or robots, robot-faced appliances, decorative
    montages or filler patterns, steampunk clutter, excessive crosshatching, glossy anime rendering, painterly
    concept art, neon cyberpunk, photorealism, pseudo-writing, interface glyphs, captions, labels, speech
    balloons, and any franchise character, blue robotic cat, or copied gadget, costume, or face.


    Recurring cast — draw exactly as specified, never redesign: Pedro, a school-age boy: black tousled
    hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never
    a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded
    rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder
    joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch
    at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions,
    or extra limbs. Flopaz, a school-age girl, Pedro''s height: chestnut-brown hair in one low side ponytail
    with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top;
    white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails,
    never a hat, never glasses.'
  subject: Pedro unplugs Maro for a month while Flopaz offers pencil and paper instead.
  composition: 'Three large figures in a row on paper: Pedro center with the plug, sleepy Maro left, Flopaz
    right holding out the notebook, one lavender wash and one socket edge behind.'
  alt_text: Pedro pulls Maro's plug and Maro dozes with sleepy eyes while Flopaz hands Pedro a pencil
    and a paper notebook.
  credit: Illustration generated for this edition.
  cast_references:
  - art-directions/references/story-led-boy-and-robot-cast.png
