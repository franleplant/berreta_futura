briefs:
- id: opener-one-month-without-ai
  purpose: opener
  article_id: one-month-without-ai
  prompt: 'Original family-friendly children''s science-comedy manga illustration: simple charcoal contours,
    rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone,
    quiet print grain, slight pigment variation and subtle paper tooth; synthetic and naive, big figures,
    few props, one playful visual idea. Gentle historical magazine color at low to medium saturation:
    softened cyan and cobalt, brick coral, muted green, dusty lavender, small warm-ochre accents, charcoal
    ink, warm off-white paper, at least three distinct non-neutral colors. Scene: Pedro pulls Maro''s
    charging plug out of a wall socket and Maro dozes with sleepy half-closed eyes, while Flopaz hands
    Pedro a pencil and a paper notebook. Props: the plug and its cord, one pencil, one notebook. The setting
    is only a patch of pale cobalt wall with a socket and a strip of floor, laid in a few flat washes
    with a soft cast shadow, the washes stopping short of the frame and fading into warm off-white paper;
    the three figures are large, filling most of the frame height, with calm empty paper around them.
    Landscape frame 1760x1024 (1.71:1), printed object-fit cover, so keep every head, hand, and essential
    prop well inside the frame with headroom. Entirely wordless. Nobody but Pedro, Maro, and Flopaz, each
    drawn to their cast description, with strong silhouettes and expressions legible at A5 and print-friendly
    contrast. Avoid: cluttered or minutely rendered backgrounds, shelves of objects, pegboards, posters,
    props beyond the ones named, crisp digital line art, cel shading, modern glossy anime rendering, painterly
    concept art, photorealism, neon cyberpunk, steampunk clutter, dense technical realism, excessive crosshatching,
    decorative montages or filler patterns, a flat yellow, mustard, beige, sepia, or bright cyan field
    filling the frame, extra humans or robots, robot-faced appliances, multiple panels, and any text,
    letters, numerals, labels, captions, pseudo-writing, interface glyphs, or speech balloons. Never copy
    Doraemon, Nobita, or any franchise character, blue robotic cat, signature gadget, costume, face, or
    silhouette.


    Recurring cast — draw exactly as specified, never redesign: Pedro, a school-age boy: black tousled
    hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never
    a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded
    rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder
    joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch
    at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions,
    or extra limbs. Flopaz, a school-age girl, Pedro''s height: chestnut-brown hair in one low side ponytail
    with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top;
    white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails,
    never a hat, never glasses.'
  subject: Pedro unplugs a dozing Maro while Flopaz hands him a pencil and notebook.
  composition: Three large figures across a landscape frame against a washed wall patch, the cord arcing
    between Pedro and Maro, Flopaz entering from the right.
  alt_text: Pedro pulls Maro's plug and Maro dozes with sleepy eyes while Flopaz hands Pedro a pencil
    and a paper notebook.
  credit: Illustration generated for this edition.
  cast_references:
  - art-directions/references/story-led-boy-and-robot-cast.png
