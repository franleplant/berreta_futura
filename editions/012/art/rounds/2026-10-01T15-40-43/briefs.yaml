- id: closing-deep-well
  purpose: closing
  prompt: |-
    A vertical cutaway of an old stone well in a sunny summer meadow, drawn like a cross-section diagram from a children's science book but entirely wordless. The top third of the page is the ground level: a round fieldstone rim with a small wooden roof and a wooden crank, muted-green grass and a few wildflowers, a softened cyan sky. Maro grips the crank handle with both mittens and turns it hard, leaning back with effort and a determined look. Pedro, in a straw-colored summer shirt, leans over the rim on his elbows, peering down the shaft with delight. Flopaz stands beside him holding out an empty tin cup, calm and patient, already waiting for the water. Below the ground line the page cuts away to show the shaft: a long rope runs straight down through layered earth in brick coral and warm ochre bands, past roots and round stones in dusty lavender shadow, to a small glinting pool of cobalt water at the very bottom of the page, where a wooden bucket has just lifted free, water spilling from its brim in a few bright droplets. Poster weight, mood leads: bright morning light at the top, cool quiet depth below. One playful idea: the cup is tiny and the well is enormous, so the reward is small and the haul is long. Original family-friendly children's science-comedy manga illustration: simple charcoal contours, rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone, slight pigment variation, subtle paper tooth, and quiet print grain. Gentle historical magazine color at low to medium saturation: softened cyan and cobalt, brick coral, muted green, dusty lavender, small warm-ochre accents, warm off-white breathing room, and charcoal ink, at least three distinct non-neutral colors. Strong silhouettes legible at A5 size, print-friendly contrast. Portrait full A5 page, 1:1.41, 1536 x 2160, a genuinely vertical composition with every head, hand, and the bucket kept well inside the frame and no essential detail at the extreme edges. Single panel. Entirely wordless: no text, letters, numerals, labels, captions, speech balloons, interface glyphs, or pseudo-writing; no depth markings on the shaft. Pedro, Maro, and Flopaz are the only characters: no extra humans, extra robots, or robot-faced appliances. Avoid: copies of Doraemon, Nobita, or any recognizable franchise character, blue robotic cats, signature franchise gadgets, copied costumes or faces; uniform yellow, mustard, beige, sepia, cream-paper, or bright cyan backgrounds; decorative montages, contact sheets, filler patterns; dense technical realism, steampunk clutter, excessive crosshatching; modern glossy anime rendering, painterly concept art, neon cyberpunk, photorealism.

    Recurring cast — identities below are canon: Pedro, a school-age boy: black tousled hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions, or extra limbs. Flopaz, a school-age girl, Pedro's height: chestnut-brown hair in one low side ponytail with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top; white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails, never a hat, never glasses.

    This slot is licensed to vary presentation, overriding the fixed outfits above where they conflict: Closing plates carry the same license as tails at full-page poster weight: mood leads, identity anchors hold.
  subject: Pedro, Maro, and Flopaz haul a bucket up from a very deep stone well on a bright summer morning, the long rope showing how far the water was.
  composition: Vertical cutaway; the trio and the wooden crank sit in the top third at ground level, the well shaft drops down the full page through earth and stone, and the bucket rises from a glinting pool at the bottom.
  alt_text: 'A cutaway of a deep stone well: Maro turns the wooden crank, Pedro leans over the rim to watch the rope, and Flopaz holds out a tin cup while a brimming bucket rises from the water far below.'
  credit: Illustration generated for this edition.
  cast_references:
  - art-directions/references/story-led-boy-and-robot-cast.png
- id: closing-block-tower
  purpose: closing
  prompt: |-
    A sunlit attic playroom on a rainy-bright afternoon, slanted wooden beams and a dusty lavender wall, a braided rug in muted green and brick coral on warm plank floor. Rising from the rug at the lower center of the page, a tall narrow tower of plain wooden building blocks in mixed shapes (cubes, arches, cylinders, planks) stacked far taller than the children, painted in softened cobalt, brick coral, muted green, and warm ochre, leaning very slightly to one side with a single block near the middle jutting out. Near the top of the page Maro stands on tiptoe on a small wooden step stool, his antenna quivering, lowering the final block onto the peak with both mittens and total concentration. At the base Pedro, in a cozy oversized sweater, crouches with both hands half raised and cheeks puffed from holding his breath; Flopaz kneels beside him, steady and watchful, one finger touching the jutting middle block to keep it still. Poster weight, mood leads: warm afternoon light slanting across the tower, hushed suspense, painterly softness. One playful idea: the taller it gets, the more gently everyone moves. Original family-friendly children's science-comedy manga illustration: simple charcoal contours, rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone, slight pigment variation, subtle paper tooth, and quiet print grain. Gentle historical magazine color at low to medium saturation: softened cyan and cobalt, brick coral, muted green, dusty lavender, small warm-ochre accents, warm off-white breathing room, and charcoal ink, at least three distinct non-neutral colors. Strong silhouettes legible at A5 size, print-friendly contrast. Portrait full A5 page, 1:1.41, 1536 x 2160, a genuinely vertical composition with the tower top, Maro, and every head kept well inside the frame and no essential detail at the extreme edges. Single panel. Entirely wordless: no text, letters, numerals, labels, captions, speech balloons, interface glyphs, or pseudo-writing; the blocks are plain with no letters or numbers. Pedro, Maro, and Flopaz are the only characters: no extra humans, extra robots, toys with faces, or robot-faced appliances. Avoid: copies of Doraemon, Nobita, or any recognizable franchise character, blue robotic cats, signature franchise gadgets, copied costumes or faces; uniform yellow, mustard, beige, sepia, cream-paper, or bright cyan backgrounds; decorative montages, contact sheets, filler patterns; dense technical realism, steampunk clutter, excessive crosshatching; modern glossy anime rendering, painterly concept art, neon cyberpunk, photorealism.

    Recurring cast — identities below are canon: Pedro, a school-age boy: black tousled hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions, or extra limbs. Flopaz, a school-age girl, Pedro's height: chestnut-brown hair in one low side ponytail with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top; white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails, never a hat, never glasses.

    This slot is licensed to vary presentation, overriding the fixed outfits above where they conflict: Closing plates carry the same license as tails at full-page poster weight: mood leads, identity anchors hold.
  subject: Maro balances the last wooden block on top of a wobbling tower taller than the children while Pedro and Flopaz hold their breath.
  composition: A narrow block tower rises from the floor at lower center to near the top of the page; Maro stands on a step stool at the top setting the final block, Pedro and Flopaz crouch at the base with hands half raised to catch it.
  alt_text: In a sunlit playroom, Maro stands on a step stool placing the last wooden block on a tall wobbling tower while Pedro and Flopaz crouch at its base, holding their breath with hands raised.
  credit: Illustration generated for this edition.
