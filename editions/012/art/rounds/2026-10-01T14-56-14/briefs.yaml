- id: cover-synthetic-coin-slot
  purpose: cover
  prompt: 'Branch: synthetic. Reading: an agent sat silent for thirty minutes and burned thirty dollars of effort to return twenty seconds of work. Proposition: idle effort is money swallowed whole. Verb: SWALLOWS, drawn at the instant the coin is half gone. Register: constructivist poster diagonal, hard flat fills, knife-cut edges, controlled shading only on the two big forms. Inks: a generous saturated cobalt ground, chrome yellow, bone, and near-black used only for forms, with ONE luminous accent: a white-hot rim of light where the coin''s edge meets the slot. Five large forms, counted: a colossal chrome-yellow coin, a near-black slotted block, the white-hot slot rim, one small bone-colored sheet of paper falling out of the block''s underside, and one hard near-black shadow wedge. Weapons: scale shock (the coin is the size of a cartwheel against a block no taller than a doorstep) and thrust (the whole composition drives from upper right to lower left along one steep diagonal; nothing horizontal carries the energy). The coin bleeds off the right edge. Type zones: keep the top-left corner as clean cobalt for a small wordmark and the bottom 90pt as quiet cobalt for one line of type; the event lives in the middle three-fifths. Portrait PNG, 1440 x 2160, 2:3, full-bleed, hard-edged high-contrast silhouette that holds against a white page. No typography of any kind: no masthead, title, numerals, currency symbols, logos, watermark, or pseudo-writing. No gradients that muddy, no grain doing the work of color, no swarms, no scattered coins, no circuit motifs, network graphs, neon cyberpunk, or AI-futurist clichés, no black or mid-tone ground. Must read in one beat at thumbnail size.'
- id: cover-art-directed-meter
  purpose: cover
  prompt: 'Branch: art_directed. Reading: waiting is never free; somewhere a meter runs while nothing happens. Proposition: silence has a meter, and it just ran out. Medium: a tabletop oil painting in the still-life tradition, thick deliberate brushwork, real light raking across real surfaces, believable weight, modelled form, cast shadow, gentle atmosphere. Picture an old cast-iron coin meter, painted oxblood and chipped to bare metal at the corners, caught at the instant its glass dome BURSTS outward and its blank red flag snaps upright; three heavy brass coins spring from the split seam. Four forms only: the meter, the bursting glass dome in three large curved shards, the upright flag, the three coins read as one cluster. Hues committed: a saturated emerald wall behind, oxblood iron, warm brass ochre, bone-white glass highlights, a cool teal shadow pooling on the tabletop. Viewpoint: radical worm''s-eye from the tabletop, the meter towering and tipping toward the viewer, its top cropped by the upper edge. Type zones: the top-left quarter stays as plain emerald wall for the wordmark, and the bottom 90pt is calm tabletop in teal shadow, open for a caption line. Portrait PNG, 1440 x 2160, 2:3, essential subject in the middle three-fifths. No text, numerals, dial markings, logos, or pseudo-writing on the meter or anywhere. No black or near-black ground, no mid-tone haze, no clutter, no hands, no circuit motifs or AI-futurist imagery. Strong silhouette at thumbnail size, clean print reproduction.'
- id: cover-wildcard-hourglass-gold
  purpose: cover
  prompt: 'Branch: wildcard. Reading: the agent''s half hour was not empty; it was being poured away. Proposition: time, spent idle, turns to molten money. Shoot it like an award-winning studio photograph of an impossible thing: a large glass hourglass SHATTERS mid-air, frozen at the exact millisecond of rupture, and what spills from the broken waist is not sand but a thick rope of molten gold, glowing, catching hard light. Viewpoint is a low macro angle looking up at the falling hourglass, which tilts hard along a diagonal. Forms, counted: the upper glass bulb, the lower glass bulb, the gold stream, and four large clean glass shards; no fine debris, no dust, no particle spray. Background: a seamless saturated hot-magenta studio sweep, evenly lit, unmistakably a color. Hues: magenta ground, liquid gold, crystalline glass with ultramarine and rose reflections, one white specular highlight on the gold that owns the frame. Hard studio key light, crisp cast shadows on the sweep, hyperreal materials, believable physics. Compose so the top-left corner is clean magenta for a small wordmark and the bottom 90pt is untouched magenta for a line of type; keep the hourglass and the gold in the middle three-fifths, the upper bulb cropped by the right edge. Portrait PNG, 1440 x 2160, 2:3. No typography, numerals, logos, watermark, or pseudo-writing; no dark mood lighting, no black ground, no clutter, no circuit motifs or AI-futurist clichés. Must stop a passerby at thumbnail size.'
- id: opener-one-month-without-ai
  purpose: opener
  article_id: one-month-without-ai
  prompt: |-
    A cozy bedroom workshop with muted green walls and a wooden desk. Pedro, firm and a little nervous, has just pulled Maro's charging cord from the wall socket and holds the plug up like a decision made. Maro sits on a low stool, contentedly dozing, its screen eyes curved into sleepy closed arcs, a small cobalt blanket over its knees. Flopaz stands at the right, calm and encouraging, holding out a yellow pencil and a plain paper notebook to Pedro. One playful idea: the helper takes a holiday and the boy goes back to his own hands. Original family-friendly children's science-comedy manga illustration: simple charcoal contours, rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone, slight pigment variation, subtle paper tooth, and quiet print grain. Gentle historical magazine color at low to medium saturation: softened cyan and cobalt, brick coral, muted green, dusty lavender, small warm-ochre accents, warm off-white breathing room, and charcoal ink, at least three distinct non-neutral colors; the setting chooses the background. Strong silhouettes and expressions legible at A5 size, print-friendly contrast. Landscape frame 1.71:1, 1760 x 1024, filled edge to edge; keep every head, hand, and essential prop well inside the frame with headroom. Single panel. Entirely wordless: no text, letters, numerals, labels, captions, speech balloons, interface glyphs, or pseudo-writing; the notebook pages are blank. Pedro, Maro, and Flopaz are the only characters: no extra humans, extra robots, or robot-faced appliances. Avoid: copies of Doraemon, Nobita, or any recognizable franchise character, blue robotic cats, signature franchise gadgets, copied costumes or faces; uniform yellow, mustard, beige, sepia, cream-paper, or bright cyan backgrounds; decorative montages, contact sheets, filler patterns; dense technical realism, steampunk clutter, excessive crosshatching; modern glossy anime rendering, painterly concept art, neon cyberpunk, photorealism.

    Recurring cast — draw exactly as specified, never redesign: Pedro, a school-age boy: black tousled hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions, or extra limbs. Flopaz, a school-age girl, Pedro's height: chestnut-brown hair in one low side ponytail with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top; white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails, never a hat, never glasses.
  subject: Pedro unplugs Maro for a month of work by hand while Flopaz offers him a pencil and notebook.
  composition: Landscape interior with Maro dozing at left, Pedro mid-gesture holding the unplugged cord at center, Flopaz at right extending pencil and notebook.
