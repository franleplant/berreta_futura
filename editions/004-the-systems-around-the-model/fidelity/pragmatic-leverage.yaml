- id: synthesis-007
  kind: p
  status: modified
  source: Lets assume if you yolo a two-sentence prompt into your factory, your chance of getting a fully-mergeable
    result is ~50%, the chance you have to rework it is 50%.
  edited: Assume you send a two-sentence prompt into your factory. The chance of a fully mergeable result
    might be about 50 percent, with another 50 percent chance that you need to rework it.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-008
  kind: p
  status: modified
  source: Now lets say you are a principal engineer with 10 years of experience. You have the whole codebase
    across 100 repos downloaded into your head. So you spend an afternoon writing a perfectly detailed
    spec by hand. Now your odds are better, but you probably still have about a 10% chance that you'll
    have to redo *something* significant.
  edited: Now assume you are a principal engineer with ten years of experience and the whole codebase,
    across one hundred repositories, downloaded into your head. You spend an afternoon writing a perfectly
    detailed specification by hand. Your odds improve, but there is probably still a meaningful chance
    that you must redo something significant.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
