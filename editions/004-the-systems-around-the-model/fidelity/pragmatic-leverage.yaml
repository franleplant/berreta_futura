- id: synthesis-016
  kind: p
  status: modified
  source: If you're doing multiple phases of planning, zooming in from 50kft view all the way to the 10kft
    view, you want to do a little bit of steering at each phase to ensure you are eliminating as much
    expected pain as possible.
  edited: If your planning moves from the 50,000-foot view toward the 10,000-foot view, steer a little
    at each phase. The goal is not maximal specification. The goal is to eliminate as much expected pain
    as possible for the least effort.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
