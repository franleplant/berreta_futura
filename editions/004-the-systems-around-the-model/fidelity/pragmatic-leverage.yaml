- id: synthesis-013
  kind: p
  status: modified
  source: What you don't want to do is spend 6 hours planning a task for which you could have eliminated
    80% of the expected pain in the first 10 minutes.
  edited: Draw the relationship and you get an inverse curve between effort invested up front and expected
    pain. What you do not want is to spend six hours planning a task when the first ten minutes could
    have removed 80 percent of the expected pain.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-014
  kind: p
  status: modified
  source: You need to do this without overindexing on questions you won't be able to answer without going
    down a level. For example, if you've done some work at the "Product" level and have not answered all
    the open questions yet, its possible you may need to end it where you are and zoom down a level to
    the technical details to understand what's feasible. There's no perfect process for this.
  edited: You also cannot overinvest in questions that only become answerable after you move down a level.
    Product planning may expose a technical uncertainty. At that point, stop trying to complete the product
    view and inspect the implementation constraints. There is no perfect sequence.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-015
