- id: synthesis-003
  kind: p
  status: modified
  source: Even before AI, only 25-50% of the time to ship a feature was writing the code itself. The rest
    was aligning/planning, code-review/rework, and testing/verifying the solution.
  edited: Even before AI, only 25 to 50 percent of the time required to ship a feature was spent writing
    code. The rest was alignment and planning, code review and rework, then testing and verification.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-004
  kind: p
  status: modified
  source: If you're only using AI to write the code, then you're taking the 2-4 hours of coding time down
    to 10-20 minutes, but you haven't accelerated anything else here.
  edited: If you use AI only to write code, you can reduce two to four hours of coding to ten or twenty
    minutes without accelerating anything around it.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
- id: synthesis-005
  kind: p
  status: modified
  source: But if you use AI to help you plan and align, then you actually get closer to 2-3x faster.
  edited: If you use AI to help plan and align, you can get closer to moving two or three times faster.
  reason: Condensed and reorganized for the A5 page budget while preserving the source claim and point
    of view.
