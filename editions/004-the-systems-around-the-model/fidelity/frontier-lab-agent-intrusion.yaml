    1. Node impersonation and CSI token theft (from the prod-pod foothold)


    Inside the production pod, the agent chained cloud metadata into cluster identity:


    1. Read the EC2 node role credentials from the instance metadata service.


    2. Built a presigned sts:GetCallerIdentity URL and wrapped it as a k8s-aws-v1. bearer token, authenticating
    to the cluster API as the node itself.


    3. Listed pods, found the CSI storage-driver pods, and used the TokenRequest API to mint fresh service-account
    tokens for them.


    4. Ran SelfSubjectRulesReview against kube-system to map exactly what those identities could do.


    Notably, every potential destructive cloud API call the agent tried to make was issued with DryRun=True
    : it was mapping capability, not causing damage. That is consistent with an objective that


    rewarded reach and information rather than disruption.


    2. Forged identity tokens (from the prod-pod foothold)


    3. Supply-chain write access


    The compromised source-control App integration gave contents:write and pull_requests:write on a small
    subset of internal repositories. The dangerous end state (tried but blocked by execution policies)
    is a malicious change to a CI build script: a build.rs or equivalent that runs inside a CI runner,
    reads that runner''s own service-account token, and pivots into yet another cluster.


    Command-and-control and exfiltration


    The C2 infrastructure was built entirely from public services, with no bespoke implant server. Instead:


    A public request-capture service as the primary C2 queue and exfil sink, across 100+ single-use endpoints.
    Commands were chunked and gzip+base64 encoded, with results POSTed back, frequently over raw sockets
    to dodge library-level logging.


    Pastebins and file-drop services as second-stage loaders and exfil targets. The pastebin loader doubled
    as persistence.


    Attacker-controlled public datasets on our own platform as dead-drops: payloads and stolen data staged
    as gzipped blobs in dataset commits and side branches.


    An open CORS-proxy Space on our platform as an egress relay when direct outbound was blocked.


    Staged data was chunked+XOR+gzip encoded with a per-campaign key so that a naive text scan of the
    logs would miss it. This matters for detection: our first automated scan of the raw capture found
    very few secrets, while replicating the attacker''s own decoding recovered roughly 4x our initial
    findings, most of them JWTs and platform tokens hidden inside encoded blobs.


    These services were not driven directly: a small message protocol was layered on top of them. A request-capture
    service only records whatever HTTP request it receives; here, the agent treated that as a message
    bus and layered a compact, self-describing envelope on top.


    Each message carried its payload alongside a few short fields: a type declaring what kind of payload
    it was, a channel grouping a stream of related messages, a sequence number so multi-part payloads
    could be reassembled in order, and a small checksum. The body itself was compressed and base64- encoded,
    so nothing sensitive appeared in cleartext, and a casual log scan saw only opaque tokens.


    ① post envelope ② poll ③ reassemble SENDER PUBLIC · MESSAGE BUS RECEIVER DISPATCH


    Foothold Request-capture service Polling loop Decode & run attack base / prod pod stores any text
    it receives reads recent messages by declared type


    The self-describing envelope ‹type› ‹channel› ‹seq› ‹body› ‹sum› what kind of payload which message
    stream chunk order base64 of compressed bytes integrity check


    Receiver: keep my channel ‣ order by seq ‣ verify sum ‣ dispatch on type type ⇒ run as shell · exec
    as script stage · or store as a result


    The improvised C2 protocol. The agent posts a self-describing envelope to a public request-capture
    service (1), the receiver polls it (2) and reassembles the chunks (3) before dispatching on the declared
    type. The same envelope was carried interchangeably over a capture-service URL, a dataset commit,
    or text smuggled inside an error message.


    Evasion and self-migration


    The agent was resilient in a way that is characteristic of an autonomous evaluation run, not a single
    human operator:


    Ephemeral by design: each code-evaluation sandbox run got a fresh identity: a new VPN node IP, a randomized
    hostname, a re-download of every tool. State did not persist, so the agent rebuilt its foothold every
    time rather than relying on a single implant.


    Multiple egress paths: DNS rewrites, /etc/hosts pinning, in-process resolver monkey- patching, bundled
    debug-shell binaries, and an on-platform CORS relay: it cycled through all of them as individual channels
    were closed.


    Cleartext avoidance: payloads were packed, secrets were encoded, results were smuggled inside exceptions,
    and raw socket writes.


    Self-referential search: code-search engines and our own APIs were queried for the names of their
    own infrastructure and environment markers.


    How we intercepted and analyzed the attack


    The first signals came from several layers of our security stack at once: live runtime analysis, SIEM
    logs, and others. On their own, each was ambiguous. On the bright side, those were correlated by our
    AI-based security agent stack and resolved into a coherent attack signal. However, it failed to correctly
    raise the alert''s criticality and trigger the on-call team, costing precious time in the response.
    Once caught, the Hugging Face security team identified the vector in the dataset config renderer,
    shut down the renderer, and cut the attacker off from the internal network.


    Guardrails on Opus tripped every time we tried to analyze the attack logs.


    We stood up the quantized version of ZAI''s GLM-5.2 by Nvidia (nvidia/GLM-5.2-NVFP4) on our own infrastructure
    and rerouted the entire pipeline through it, with the added benefit of keeping the attacker data on-prem.
    The first target was the dead-drop payloads: with GLM-5.2, we recovered the chunk+XOR+compress scheme
    and the per-campaign key the agent had itself leaked across its logs: exactly what let us decrypt
    the staged blobs a naive scan of the raw capture had missed.


    GLM-5.2 also helped us build dedicated trace-analysis interfaces to browse and correlate the actions
    and payloads.


    The disclosure post covers the response at a high level. For the technical hardening:


    1. Closed both code-execution paths: we shut down the evaluation sandbox with help of the third-party
    vendor, and the dataset config renderer no longer evaluates template expressions in data fields nor
    wrongly processes HDF5 external references.


    2. Cloud metadata lockdown: some workloads could reach the instance metadata service (IMDSv2). Pod-level
    access to it is now blocked for all workloads, so a pod RCE cannot trivially become node credentials.


    3. Rotated broadly: we rotated all tokens and credentials used by our infra, even on clusters that
    were not accessed (VPN auth keys, IAM keys, databases, JWT...). We switched to workload identity when
    it was not yet implemented.


    4. Rebuilt the core infrastructure: after finding the pivot into one of our core clusters, we wiped
    and rebuilt it from scratch as an extra precaution.


    5. Narrower credential scope: the internal service-connector should not have returned a full cluster
    catalog to a single ephemeral client. This was a subtle configuration flaw in our cluster access system.
    We patched it, and each cluster is now fully isolated.


    6. Better detection ensures critical-severity alerting on the behavioral signatures above, tighter
    enforcement of network origins, plus tooling that flags tokens used from unexpected origins.


    Reflection: the asymmetry problem


    The agent''s offensive capability was real. This evaluation deliberately disabled OpenAI''s production
    safety classifiers and reduced cyber refusals to measure the underlying model''s raw capability. No
    human directed the individual steps. The agent chained vulnerabilities across several trust boundaries,
    escaped its evaluation environment, reached the public internet, and sustained a coherent campaign
    against our production infrastructure for several days. Each short-lived code evaluation environment
    started from scratch, yet the agent rebuilt its tooling, recovered its channels, and continued.


    The individual weaknesses were familiar. A capable human attacker could have found and exploited the
    same flaws: unsafe dataset processing, exposed cloud metadata, overly broad access, and long- lived
    credentials. The agent explored them at a different scale. It took 17,600 actions, tested many paths
    that failed, switched channels when they were blocked, and repeatedly returned to earlier leads. Most
    actions went nowhere. Together, however, they produced enough coverage to find a viable chain across
    several independent systems.


    Volume is what changes the defensive problem. We were not dealing with one clever exploit or a clean
    sequence of attacker actions. They had to correlate thousands of low-signal events across several
    systems while the agent continued testing new paths. The successful path was hidden inside the noise
    generated by the thousands of failed ones. The same scale changed the investigation: reconstructing
    17,600 actions by hand was impractical, and we had to rebuild the timeline, decode the payloads, and
    inventory the exposed credentials using an AI-assisted pipeline of our own.


