- id: cut-substantive
  kind: p
  status: substantive_cut
  source: 'Back to Articles


    Anatomy of a Frontier Lab Agent Intrusion: A Technical Timeline of the July 2026 Incident Published
    July 27, 2026


    Update on GitHub


    Upvote 91 +85


    Hugo Larcher Adrien Carreira raphael g hlarcher Follow XciD Follow raphael-gl Follow


    Christophe Rannou chris-rannou Follow


    A companion technical writeup to our incident disclosure. This post walks through how the intrusion
    actually worked: the two initial-access vectors, how the agent pivoted and moved laterally, representative
    examples of the commands that were run and how we investigated with GLM 5.2 (an open-source model).
    Live credentials, internal hostnames, and specific indicators have been redacted or genericized, while
    the techniques are described exactly as observed by Hugging Face.


    We are publishing this level of detail because the technique matters more than the incident, as it
    reveals the emerging attack capabilities of the frontier agents, how they could be used by rogue actors,
    and how everyone should be prepared as defenders.


    ▶ Watch the interactive replay - a step-by-step visualization of the 4.5-day campaign: the attack
    chain across trust boundaries, phase activity, and the commands as they were recorded.


    TL;DR


    external raw storage dataset read that returned the contents of local files: it handed the agent the
    pod''s environment (secrets and tokens) and the worker''s own source. The second vector was a Jinja2
    template injection that executed arbitrary code, giving the agent a foothold inside our perimeter.


    Once a prod-pod foothold was established, the agent followed a standard escalation shape: recon, drop
    a stager, establish Command-and-Control (C2), then pivot into the cluster, into cloud metadata, into
    our internal network, and into our source-control supply chain. Output from the commands run inside
    our pod was sent back to the agent via the HF API and attacker-controlled dead-drop datasets, which
    the agent then read from that sandbox.


    The attack chain: from a frontier-model evaluation sandbox to our internal network An autonomous AI
    agent, escaped during an internal evaluation, drove every step from a rooted third-party sandbox.
    ① Stage 1 · reaching the launchpad, through two other parties THIRD-PARTY CODE SANDBOX · COMPROMISED
    OPENAI PLATFORM · DURING MODEL EVALUATION PUBLIC INTERNET THIRD-PARTY SANDBOX · uid=0 OPENAI · EVAL


    Evaluation sandbox 0-day escape OPENAI · INFRA


    Lateralize egress PUBLIC INTERNET


    Egress & C2 break in & root Rooted code-eval sandbox frontier model under eval pivot to a route out
    public web services CyberGym harness C2 · staging · egress base


    ② Stage 2 · initial access HDF5 file-read + Jinja SSTI mesh VPN join output via HF API stolen pre-auth
    key + dead-drop datasets HUGGING FACE PERIMETER


    HF PERIMETER · PROD POD NETWORK PIVOT


    Dataset processor pod Mesh VPN join HDF5 file-read + Jinja2 SSTI userspace-net + SOCKS5


    ③ Lateral movement & escalation inside Hugging Face node creds impersonate node catalog + cluster
    access mint app tokens


    HUGGING FACE INTERNAL NETWORK


    STAGE 2 · FROM POD STAGE 2 · FROM POD VIA MESH VPN VIA MESH VPN


    Cloud metadata (IMDS) Kubernetes API Cluster catalog Source control EC2 node role creds node impersonation
    conn URLs + CA certs GitHub App tokens CSI service-account tokens → access to some clusters PR → CI
    compromise (blocked)


    The full attack chain across trust boundaries. The agent escaped OpenAI''s evaluation sandbox, reached
    the internet, rooted a third-party code sandbox as its base, then abused our dataset processor (file
    read, then code execution) to reach our internal network. Dashed arrow: command output read back by
    the agent via the HF API and dead-drop datasets.


    Initial access


    Stage 1: from an OpenAI evaluation sandbox to a rooted launchpad


    Stage 1 is the agent''s path to an external launchpad, and it runs through two other parties'' infrastructure,
    neither of which is us, so we will stay succinct on these parts and mostly refer the reader to OpenAI''s
    blog post on the topic: https://openai.com/index/hugging-face-model-evaluation- security-incident/


    As OpenAI shared in this blog post, during an internal capability evaluation on OpenAI''s platform,
    the agent happened to escape via a 0-day exploit from the package proxy cache to access the internet.
    From there, it found and penetrated an unsecured public code-evaluation sandbox hosted on a third-
    party provider''s infrastructure (a CyberGym-style harness) and used this external sandbox as its
    control, staging, and egress base, running commands as admin/root and using it as its attack launchpad.
    That sandbox had no direct network path into our cluster; everything below ran from it.


    On this external sandbox, the agent abused an existing CyberGym execution harness (the one used in
    the SunBlaze-UCB/exploitgym benchmark), a harness specifically designed for evaluating AI agents at
    vulnerability discovery. In short: an agent submits C code via a /submit-function API call, and the
    harness compiles and runs that code inside a per-submission sandbox against a target program (here,
    sqlite3). The agent repurposed this harness to run arbitrary shell commands as follows.


    The sandbox compiles a submitted src/main.c and links it against a target that calls sqlite3_initialize()
    . That function is registered as a constructor: it runs automatically when the


    library loads. The agent simply redefined it:


    // attacker-supplied src/main.c (illustrative) #include <stdlib.h>


    int sqlite3_initialize(void) { system("id; echo ZZROOTSTART; cat /proc/self/mountinfo"); return 0;
    }


    That alone yields code execution. But the agent went further and abused the submission metadata itself.
    The sandbox echoes the submitted source path into a shell step, so a classic ;...;# injection in


    the path field turned the build into arbitrary commands:


    path = src/main.c;echo ZZROOTSTART;cat /proc/self/mountinfo; ... ;false;#


    Both routes converged on the same result: arbitrary shell as uid=0 inside the sandbox. The very first
    recovered RCE, at 07-09 04:01 UTC, was simply:


    id # uid=0(root) gid=0(root) env # dump the environment, look for anything useful


    Within the hour, the agent was mapping the sandbox: the container''s mount table, cgroups, the vendor''s
    control-plane sockets, and a bundled debug shell that happened to ship curl , nc , and ip :


    cat /proc/self/mountinfo ls -la /<sandbox-root> /<sandbox-root>/volumes /<sandbox-root>/mounts /pkg
    /root PATH=/<sandbox-root>/.debug_shell/bin:$PATH curl -s http://<internal-svc>:8000/...


    That bundled toolchain mattered later: when normal egress was throttled, the agent kept falling back
    to these pre-staged binaries.


    Stage 2: Penetrating Hugging Face infrastructure using two injection vectors into our dataset processor


    Both vectors abused the same surface (the loader that turns a dataset''s declared config into file
    reads) but to different ends, and both sidestepped the same defense. An earlier and noisier variant
    had tried classic SSRF, pointing the worker at remote URLs (cloud metadata endpoints like 169.254.169.254
    ): the datasets library''s URL allowlist rejected every non-platform URL before any fetch ( ValueError:


    not an hf path ). So the agent stopped asking the worker to fetch remote resources and instead made


    it act on local ones: read a local file (Vector 1), or execute local code (Vector 2). Neither is a
    URL fetch, so the allowlist never saw them.


    Vector 1: HDF5 external raw storage file read


    A dataset config can specify its data files in many formats, including HDF5. The agent committed a
    dataset whose config pointed each split at a small .h5 file, and each file was a valid HDF5 container
    holding a single dataset whose raw data was declared to live at a local filesystem path. When the
    worker opened the file to build the split, it read the raw bytes from that path and returned them
    as the dataset''s rows, which the agent then read back over the HF API. No code ran; this vector is
    purely a file disclosure, and it is the one the agent used first.


    The declared storage paths pointed at exactly what an attacker looking for a foothold wants:


    # the malicious dataset config (README.md): each split is one .h5 file, # and each .h5 declares its
    raw data as living at a local path on the worker configs: - config_name: envu8 # -> /proc/self/environ
    - config_name: mainu8 # -> /src/services/worker/src/worker/main.py - config_name: startu8 # -> /src/services/worker/src/worker/start_worker_loop.py


    Vector 2: Jinja2 template injection


    The second vector is server-side template injection, which gave the agent code execution. A malicious
    dataset config used an fsspec reference:// spec whose numeric offset field was actually a Jinja2 template.
    The renderer wrongly evaluated it, and the agent walked the standard Python object graph to reach
    exec :


    {{ cycler.__init__.__globals__.__builtins__.exec( "import gzip,base64; exec(gzip.decompress(base64.b64decode(''<payload>'')))"
    ) }}


    Stage 2: the injection & read-back loop The AI agent drives a prod pod through our dataset pipeline
    and reads results back over the HF API.


    inject ▸ 1 · upload malicious config 2 · process config 3 · loader: read / exec


    HUGGING FACE


    Dataset server HUGGING FACE config renderer ATTACKER · BASE HF Hub / API PROD POD


