  source: Q is also a learned pointer. Wq and Wk read the same residual stream, and the query for a fact
    points at the key direction that fact was written into. The update first asks what information the
    current key retrieves from the cache. It subtracts that existing information from the value we want
    to store, multiplies the key by the difference, and adds the result back. Old information is removed
    and new information is written in its place.
  edited: DeltaNet treats the state like fast weights and applies a delta rule. Before writing a new key-value
    association, it estimates what the current state would retrieve for that key. The update stores the
    difference between the desired value and the existing prediction.
