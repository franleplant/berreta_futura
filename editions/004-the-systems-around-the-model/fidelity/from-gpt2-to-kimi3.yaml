    h_l = \alpha_0 \cdot h_1 + \sum_{i=1}^{l-1} \alpha_i \cdot f_i(h_i


    Each weight alpha_i is computed from a query-key dot product. The query is learned for each layer,
    while the keys and values come from earlier residual- stream states. The scores are normalized to
    sum to one, then used to form a weighted combination of those states.


    The model therefore does not have to condition only on its immediate predecessor. AttnRes gives each
    layer selective access to earlier layer outputs, allowing its learned query to retrieve the representations
    most useful for the current computation.


    The pseudocode below applies the same idea at block granularity. A block is the element-wise sum of
    the attention and MLP outputs accumulated across 12 decoder layers, stored as a single depth representation
    for later AttnRes mixing.


    Applying residual attention at every layer would add too much training and inference cost. Applying
    it only at fixed block boundaries captures most of the benefit at a lower cost. In KimiK3, each boundary
    occurs after 12 decoder layers. Across 23 four-layer macrocycles, this produces eight AttnRes blocks,
    which increases our inference speed.


