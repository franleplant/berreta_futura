  source: Kimi K3 Ultimately, the KimiK3 language backbone looks similar to the Kimi Linear model above.
    It contains 23 four-layer macrocycles. In each macrocycle, three layers use Kimi Delta Attention and
    the fourth uses Multi-head Latent Attention. The first layer uses a dense feed-forward network; every
    remaining layer uses a latent Mixture-of-Experts.
  edited: KimiK3 keeps the hybrid shape. Three of every four attention layers use Kimi Delta Attention,
    while the fourth uses Multi-head Latent Attention. Its feed-forward capacity comes from a large Mixture-of-Experts
    system.
