    In essence, a fixed-capacity associative memory (fixed dimensions) needs an eviction policy, since
    a purely additive linear operation eventually adds interference once at capacity. To that end, learned
    selection, like gating, routing, or decay, is necessary, and attention is the most effective selective-read
    mechanism.


