    There is a trade-off.


    Here, we replace the exponential used by softmax with ELU+1 applied separately to q and k before they
    interact. Both approaches normalize the resulting scores, but the feature map used by linear attention
    is a less expressive approximation of the softmax kernel. That approximation can reduce fidelity,
    although the practical accuracy loss depends on the architecture and workload.


    Notice that we still divide by the sum of qk, which is omitted from the diagram for simplicity. At
    a high level, attention consists of three steps:


    DeltaNet (Fast Weight Programmers) A finite cache must overwrite or combine with information already
    stored. The state from token i-1 does not receive its own slot; it is added to the same D by D matrix.
    New queries can therefore no longer retrieve a perfectly isolated representation of each earlier token.


    That addition is also the source of the efficiency gain. Updating the cache additively rather than
    by concatenation prevents it from growing in O(N), but the same operation causes information to interfere.
    DeltaNet addresses this loss of recoverability.


    Eloquently put by Schlag’s paper (Fast Weight Programmers): “when the sequence length exceeds storage
    capacity, the model may end up in an overcapacity regime. To properly operate under such a regime,
    the model should learn to dynamically interact with the memory contents and selectively decide which
    key-value associations to keep and which ones to delete. The purely additive instruction may be inappropriate
    for this purpose…. endlessly adding new associations to a memory of finite size, as in Eq. 17, inevitably
    will reach a limit.“


    The regime that makes linear attention attractive, where N is much larger than D, also exposes its
    main limitation. Once the state exceeds its effective capacity, associations begin to interfere because
    the update is additive and nothing leaves the cache.


