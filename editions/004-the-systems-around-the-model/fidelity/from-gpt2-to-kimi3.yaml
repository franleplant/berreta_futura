    Gated Delta Net We now have a method for making precise changes to the cache. With each new fact (each
    new key vector), we can look at exactly the old information stored at that point and replace it with
    the new information we want to attend to.


    However, this mechanism can forget only an association for which it has a specific replacement. It
    cannot efficiently clear multiple associations during a context switch or decay memory generally to
    free capacity.


    If we were doing purely additive linear attention:


    Adding the ability to forget would be simple. We''d just need a parameter controlling the forgetful
    state:


    python


    S_old=cache S_new=k@v # cache=S_old+S_new cache=alpha * S_old + S_new


    This is the Mamba-2 contribution. We decay the previous cache, then add the new cache at full strength,
    preventing the state from growing without bound.


    varying importance of different key-value associations.


    That is, if the model needs to forget one specific association, all associations are forgotten equally.
    The Delta rule, in contrast, can update a single fact but has no way to make the rest of the facts
    decay.


    So the Gated Delta rule combines Mamba''s gated update rule with the Delta rule. It adds a parameter,
    alpha, that switches to the pure Delta rule when set to one and clears the memory when set to zero.
    The challenge is implementing this with the same parallel-chunks method.


    The implementation uses the same DeltaNet reparameterization described in the previous section. The
    mathematics is nearly identical, with one addition: a data- dependent scalar between zero and one
    that controls the decay of the previous state. This combines effective key-value association learning
    with adaptive memory management.


