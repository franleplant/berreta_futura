    The remaining changes are MLA query LoRA, output gating, and blockwise Attention Residuals every 12
    layers. AttnRes adds roughly 2% inference latency, but provides two important benefits:


    Selective retrieval of earlier representations, which mitigates residual dilution and hidden-state
    growth A 1.25x compute advantage


    sum of the original embedding and every preceding layer''s output, all weighted equally.


    h_l = h_1 + \sum_{i=1}^{l-1} f_i(h_i)


    Here, h_i is the input to layer i, h_1 is the embedding of the current token (the last token in the
