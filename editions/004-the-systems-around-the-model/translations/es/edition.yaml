title: Los sistemas alrededor del modelo
subtitle: Protocolos, evaluaciones, arquitecturas y el trabajo operativo que convierte la capacidad de los modelos
  en sistemas confiables
cover:
  headline: Los sistemas alrededor del modelo
  deck: Siete informes sobre la maquinaria que hace útil, comprensible y segura a la inteligencia
  back_text: El modelo es solo un componente. La confiabilidad vive en el protocolo, la evidencia, el ciclo de
    retroalimentación, la arquitectura y el criterio que los conecta.
closing_plate_titles:
- Señales entre compuertas
- Memoria y recuperación
- El límite útil
editorial:
  path: manuscript/editorial.md
articles:
- id: frontier-lab-agent-intrusion
  title: Anatomía de la intrusión de un agente en un laboratorio de frontera
  short_title: Intrusión de un agente
  display_emphasis: Intrusión
  author_note: Hugo Larcher, Adrien Carreira, raphael g y Christophe Rannou son colaboradores que publican a través
    de Hugging Face.
  manuscript: articles/frontier-lab-agent-intrusion.md
  figures:
  - id: campaign-timeline
    caption: La campaña reconstruida se condensa en una cronología de cuatro días y medio de afianzamiento, mando
      y control, movimiento lateral, uso de credenciales y limpieza.
    credit: 'Diagrama de Hugo Larcher, Adrien Carreira, raphael g y Christophe Rannou; fuente: Anatomy of a Frontier
      Lab Agent Intrusion: A Technical Timeline of the July 2026 Incident.'
    alt_text: Una cronología de la campaña muestra el volumen de eventos y la actividad de cada fase durante cuatro
      días y medio.
    anchor: La cadena de ataque
- id: eval-engineering
  title: Ingeniería de evaluaciones
  short_title: Ingeniería de evaluaciones
  display_emphasis: evaluaciones
  author_note: Argona es el nombre con el que publica @Argona0x, una cuenta de X centrada en IA.
  manuscript: articles/eval-engineering.md
  figures:
  - id: eval-engine
    caption: La evaluación se convierte en ingeniería cuando las trazas de producción, las etiquetas de fallos
      y los evaluadores repetibles forman un único ciclo operativo.
    credit: 'Diagrama de Argona; fuente: Eval Engineering: the step that turns a $200 model into a $200,000 system.'
    alt_text: Un diagrama de la fuente presenta la primera etapa de un flujo de ingeniería de evaluaciones.
    anchor: El examinador que ya tienes
  - id: eval-routing
    caption: 'Las puntuaciones solo resultan útiles cuando cambian la siguiente arista: reintentar, rechazar, poner
      en cuarentena, bloquear o enviar a revisión humana.'
    credit: 'Diagrama de Argona; fuente: Eval Engineering: the step that turns a $200 model into a $200,000 system.'
    alt_text: Un diagrama de la fuente asocia fallos de evaluación con decisiones de enrutamiento.
    anchor: Haz que la puntuación cambie la siguiente arista
- id: pragmatic-leverage
  title: Apalancamiento pragmático en la fábrica de software
  short_title: Apalancamiento pragmático
  display_emphasis: Apalancamiento
  author_note: Dex Horthy es el fundador de HumanLayer, una empresa de herramientas para desarrolladores respaldada
    por YC.
  manuscript: articles/pragmatic-leverage.md
  figures:
  - id: delivery-time
    caption: Programar es solo una fracción de la entrega de una funcionalidad; la alineación, la revisión, la
      reelaboración, las pruebas y la verificación consumen el resto.
    credit: 'Diagrama de Dex Horthy; fuente: Pragmatic Leverage in the Software Factory.'
    alt_text: Un diagrama de la fuente divide el tiempo de entrega entre programación y trabajo circundante.
    anchor: Buscar apalancamiento
  - id: minimal-prompt-risk
    caption: Un prompt mínimo ahorra tiempo de preparación, pero deja una gran probabilidad de reelaboración costosa.
    credit: 'Diagrama de Dex Horthy; fuente: Pragmatic Leverage in the Software Factory.'
    alt_text: Un diagrama de la fuente relaciona un prompt de dos oraciones con la reelaboración esperada.
    anchor: La regla 80/20 del apalancamiento al programar con IA
- id: from-gpt2-to-kimi3
  title: De GPT-2 a KimiK3
  short_title: GPT-2 a KimiK3
  display_emphasis: De GPT-2 a KimiK3
  author_note: ali trabaja en inferencia en Baseten y estudia ingeniería en la Universidad de Waterloo.
  manuscript: articles/from-gpt2-to-kimi3.md
  figures:
  - id: gpt2-baseline
    caption: 'GPT-2 aporta el punto de partida reconocible: embeddings de tokens y posiciones, bloques transformer,
      normalización y una cabeza de modelo de lenguaje.'
    credit: 'Diagrama de ali; fuente: 22580: From GPT2 to Kimi3, Explained.'
    alt_text: Un diagrama de la fuente resume la arquitectura de solo decodificador de GPT-2.
    anchor: GPT-2 y la caché
  - id: attention-progression
    caption: El registro de trabajo sigue la atención desde la comparación completa entre pares hasta el estado
      recurrente y la corrección mediante la regla delta.
    credit: 'Diagrama de ali; fuente: 22580: From GPT2 to Kimi3, Explained.'
    alt_text: Un diagrama de la fuente compara etapas en la evolución de los mecanismos de atención.
    anchor: De la atención lineal a DeltaNet
