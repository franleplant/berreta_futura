ndly contrast. Entirely wordless, single panel, no multi-panel layout. Avoid: any resemblance to Doraemon, Nobita, or any recognizable franchise character, blue robotic cats, franchise gadgets, copied costumes or faces; tentacled monsters, teeth, eyes, or any frightening creature design; uniform yellow, mustard, beige, sepia, cream-paper, or bright cyan backgrounds; extra humans, extra robots, or robot-faced background appliances; decorative montages, contact sheets, or filler patterns; dense technical realism, steampunk clutter, or heavy crosshatching; modern glossy anime rendering, painterly concept art, neon cyberpunk, or photorealism; decorative pseudo-writing, interface glyphs, captions, labels, speech balloons, numerals, or any typography.

