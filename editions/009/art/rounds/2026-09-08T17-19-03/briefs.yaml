- id: opener-research-acceleration
  purpose: opener
  article_id: research-acceleration-the-view-inside-openai
  prompt: |-
    A busy timber workshop, seen wide. On the left Maro turns a large iron crank with both hands, leaning into it cheerfully, and the crank drives a long many-armed machine of simple wooden levers and belts stretching across the centre of the scene, each arm turning out a finished wooden wheel and flicking it along. On the right the finished wheels have stacked into a leaning tower already far taller than Flopaz, who stretches a cloth measuring tape up the side of it with her head tipped back, astonished, unable to reach the top. In the middle foreground Pedro sits on an upturned crate holding a small sand hourglass level in both hands, looking from the hourglass to the stack, working out how much faster this is. Sawdust hangs in the light. Setting details: teal machine frame, brick coral belts, muted green shutters, dusty lavender shadow under the bench, warm ochre timber and sawdust light, warm off-white wall. Pedro, Maro, and Flopaz all appear and each has a real part in this single idea. Frame: landscape 1.71:1, 1760 x 1024 pixels, filled edge to edge, with every head, hand, and essential prop well inside the frame and clear headroom above the wheel tower, because nothing outside the frame prints. Style: original family-friendly children's science-comedy manga illustration with simple charcoal contours, rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone, quiet print grain, slight pigment variation and subtle paper tooth, and one playful visual idea only. Palette: gentle historical magazine color at low to medium saturation, softened cyan and cobalt, brick coral, muted green, dusty lavender, small warm ochre accents, warm off-white breathing room, charcoal ink; the setting chooses the background color and at least three distinct non-neutral colors appear. Strong silhouettes and expressions that stay legible at A5 print size, print-friendly contrast. Entirely wordless, single panel, no multi-panel layout. Avoid: any resemblance to Doraemon, Nobita, or any recognizable franchise character, blue robotic cats, franchise gadgets, copied costumes or faces; uniform yellow, mustard, beige, sepia, cream-paper, or bright cyan backgrounds; extra humans, extra robots, or robot-faced background appliances; decorative montages, contact sheets, or filler patterns; dense technical realism, steampunk clutter, or heavy crosshatching; modern glossy anime rendering, painterly concept art, neon cyberpunk, or photorealism; clock faces, dials, gauges, decorative pseudo-writing, interface glyphs, captions, labels, speech balloons, numerals, or any typography, including tick marks on the measuring tape.

    Recurring cast — draw exactly as specified, never redesign: Pedro, a school-age boy: black tousled hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions, or extra limbs. Flopaz, a school-age girl, Pedro's height: chestnut-brown hair in one low side ponytail with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top; white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails, never a hat, never glasses.
  subject: The work has been handed to a machine that outruns the people who used to do it, and they are measuring how far ahead it has gotten.
  composition: Landscape workshop with Maro at a big crank on the left driving a many-armed machine across the centre, finished wheels stacking taller than Flopaz on the right as she measures the stack, Pedro in the middle foreground with an hourglass.
