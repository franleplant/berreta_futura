  subject: 'The plan is plumbing: open the gate and the water reaches every plot, not only the first one.'
  composition: Landscape stone aqueduct running the full width in a shallow diagonal, Maro at the sluice gate on the left, Pedro mid-channel guiding the flow with a paddle, Flopaz planting at the far right plot as the water arrives.
