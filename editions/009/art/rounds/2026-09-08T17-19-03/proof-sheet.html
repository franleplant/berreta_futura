<figure>
<img src="cover-synthetic-split-trellis-v1.png" loading="lazy">
<figcaption>cover-synthetic-split-trellis — variant 1</figcaption>
<details><summary>prompt</summary><pre>Branch: synthetic. Proposition in one sentence: the thing we grew has split the trellis we built to shape it. The image's verb is SPLITS, drawn at the instant of rupture, not after. Graphic register: linocut and woodcut relief printing with brutal blacks, gouged tool marks, chattered cut edges, and confident flat fills. Inks, exactly these: a generous chrome yellow ground; oxblood as the second ink; a near-black form ink used only for forms and never as the ground; and one luminous accent of bare white-hot paper. FOUR large forms and nothing else: a colossal near-black root and tuber mass, vastly oversized for its world, swelling up from the lower half; the straight ruled oxblood lattice it has burst, its members snapped and hinging outward; one long lattice member tumbling free across the upper right; and the single white-hot gap torn open where the mass came through, the one luminous element that owns the frame and leads the eye in a single beat. Compositional weapons: scale shock, with the root mass sized like a girder against a garden trellis, plus frame invasion, the mass bleeding confidently off the bottom edge and both side edges. Type zones: keep the top-left corner an open, detail-free field of the chrome yellow ground for a small wordmark; keep the bottom strip of the plate a quiet unbroken band of flat ground that can carry one line of type; leave the outermost right edge free of critical detail for a spine band. Portrait artwork, 1440 x 2160 pixels, 2:3, full bleed, essential subject inside the middle three-fifths. Hard print-flat color, no muddy gradients, no pigment-wash softness, no all-over grain doing the work color should do. Absolutely no typography of any kind: no masthead, title, issue number, caption, logo, pseudo-writing, numerals, or watermark. No swarms, confetti, particle clouds, grids or arrays of repeated small elements, or scattered debris. No characters, no narrative staging, no centered object floating on an empty field with a drop shadow. No circuit motifs, network graphs, neon cyberpunk, or AI-futurist cliches. Judge anatomy of the forms, materials, lighting, intersections, and physical relationships as strictly as composition.</pre></details>
</figure>

<details><summary>prompt</summary><pre>Branch: art_directed. The proposition, one sentence: whatever a stranger sends inward must stop at a wall that has no way to carry it further. The verb is ARRESTS, caught at the exact moment the motion dies. Medium, committed to fully: a thick hand-built glazed stoneware relief, photographed straight on in raking morning daylight, rendered with real modelled depth, believable weight, cast shadow, crackled glaze facture, a chipped lip, and grit in the clay body. Hues, five: a deep emerald glaze ground across the wall face, cobalt pooling in the glaze's low places, warm ochre daylight raking from the left, bone white for the paper, and a thin oxblood shadow line where the forms meet. THREE large forms: the enormous slab wall filling almost the whole plate; the small dark pass-through mouth cut into it, the only opening; and one bone-white folded paper slip jammed halfway through that mouth, bent, stalled, going no further, its cast shadow the plate's fourth mass. Compositional weapons: radical viewpoint, dead-on macro so close the wall reads as landscape, together with scale shock, the slip sized like a door in the wall's own world. Type zones: the upper-left area of the wall stays a plain unbroken glaze field for a small wordmark; the bottom of the plate is the wall's flat glazed footing, quiet enough to carry one line of type; the outer right edge holds no critical detail so a spine band can sit there. Portrait artwork, 1440 x 2160 pixels, 2:3, full bleed, essential subject inside the middle three-fifths, hard-edged high-contrast silhouette that will not dissolve against an off-white page. No mid-tone haze, no textured wallpaper ground, no black or near-black ground. Absolutely no typography, pseudo-writing, numerals, logo, or watermark of any kind, and no writing on the paper slip. No human figures, no characters, no narrative staging, no swarms or arrays of small repeated elements. No circuit motifs, network graphs, neon cyberpunk, or AI-futurist cliches. Materials, lighting, intersections, and physical relationships must be strictly believable.</pre></details>

<details><summary>prompt</summary><pre>A bright workshop divided by a thick glass wall. On the right, Maro stands inside a sealed glass reading booth, both hands holding open one large letter whose edges curl and bristle like something alive, a heap more of the same letters spilling around its feet, its posture calm and businesslike. In the centre of the glass wall a small brass pass-through slot: Maro is pushing one smooth, entirely blank pebble-shaped wooden token through it, and Flopaz, leaning in from the left side of the glass with a careful expression, receives that single token in her cupped palms and nothing else. On the far left Pedro stands at a wooden board of real tools and levers, one hand resting on a big lever, watching the token arrive before he pulls anything. Not one letter crosses the glass. Setting details: teal-painted workbench, cobalt tiled floor, brick coral tool handles, muted green plants on a high shelf, warm off-white daylight from tall windows. Pedro, Maro, and Flopaz all appear and each has a real part in this single idea. Frame: landscape 1.71:1, 1760 x 1024 pixels, filled edge to edge, with every head, hand, and essential prop well inside the frame and clear headroom above, because nothing outside the frame prints. Style: original family-friendly children's science-comedy manga illustration with simple charcoal contours, rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone, quiet print grain, slight pigment variation and subtle paper tooth, and one playful visual idea only. Palette: gentle historical magazine color at low to medium saturation, softened cyan and cobalt, brick coral, muted green, dusty lavender, small warm ochre accents, warm off-white breathing room, charcoal ink; the setting chooses the background color and at least three distinct non-neutral colors appear. Strong silhouettes and expressions that stay legible at A5 print size, print-friendly contrast. Entirely wordless, single panel, no multi-panel layout. Avoid: any resemblance to Doraemon, Nobita, or any recognizable franchise character, blue robotic cats, franchise gadgets, copied costumes or faces; uniform yellow, mustard, beige, sepia, cream-paper, or bright cyan backgrounds; extra humans, extra robots, or robot-faced background appliances; decorative montages, contact sheets, or filler patterns; dense technical realism, steampunk clutter, or heavy crosshatching; modern glossy anime rendering, painterly concept art, neon cyberpunk, or photorealism; decorative pseudo-writing, interface glyphs, captions, labels, speech balloons, numerals, or any typography, including on the letters and the token.

Recurring cast — draw exactly as specified, never redesign: Pedro, a school-age boy: black tousled hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions, or extra limbs. Flopaz, a school-age girl, Pedro's height: chestnut-brown hair in one low side ponytail with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top; white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails, never a hat, never glasses.</pre></details>
