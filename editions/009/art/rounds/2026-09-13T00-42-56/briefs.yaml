- id: closing-mound-city
  purpose: closing
  prompt: |-
    A full-page poster-weight plate, vertical. On a dry ochre plain at dusk stands a colossal cluster of earthen spires, a single fused mound of towers and buttresses three storeys high, its flanks fluted and pitted with vents and its ridges softened by a hundred seasons of rain; the whole structure is unmistakably built by nobody, raised grain by grain, with no straight line anywhere in it. Nothing else breaks the plain. At the foot of the mound, small in the lower fifth: Pedro stands with both arms half raised and his head tipped right back, taking in the height; Maro stands beside him holding a rolled paper plan slack at its side, arm down, the plan clearly of no further use; Flopaz has walked a few steps ahead into a shadowed arch at the mound's base and stands with one palm flat against the warm earth wall, feeling the draught coming out of it. Warm light comes from low and behind the spires so their silhouette is hard and their west faces glow. Register: full-page poster weight with mood leading, painterly washes and long low dusk light within the same charcoal-contour manga idiom. Setting details: warm ochre and brick coral earth on the spires, softened cobalt and dusty lavender sky behind them, muted green scrub grass at the plain's edge, warm off-white light band at the horizon, charcoal ink contours, no muddy blacks. Pedro, Maro, and Flopaz all appear and each has a real part in this single idea. Frame: portrait A5 page proportion, 1:1.41, 1536 x 2160 pixels, composed as a single full-page plate with the essential subject well inside the frame. Style: original family-friendly children's science-comedy manga illustration with simple charcoal contours, rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone, quiet print grain, slight pigment variation and subtle paper tooth, and one playful visual idea only. Palette: gentle historical magazine color at low to medium saturation, softened cyan and cobalt, brick coral, muted green, dusty lavender, small warm ochre accents, warm off-white breathing room, charcoal ink; the setting chooses the background color and at least three distinct non-neutral colors appear. Strong silhouettes legible at A5 print size, print-friendly contrast. Entirely wordless, single panel, no multi-panel layout. Avoid: any resemblance to Doraemon, Nobita, or any recognizable franchise character, blue robotic cats, franchise gadgets, copied costumes or faces; visible insects, swarms, creatures, eyes, or any frightening design; scattered rubble, repeated small rocks, or fields of identical small elements; castles, carved masonry, windows, doors, ladders, or any sign of human construction on the mound; uniform yellow, mustard, beige, sepia, cream-paper, or bright cyan backgrounds; extra humans, extra robots, or robot-faced background appliances; decorative montages, contact sheets, or filler patterns; dense technical realism, steampunk clutter, or heavy crosshatching; modern glossy anime rendering, painterly concept art, neon cyberpunk, or photorealism; decorative pseudo-writing, interface glyphs, captions, labels, speech balloons, numerals, or any typography.

    Recurring cast — identities below are canon: Pedro, a school-age boy: black tousled hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions, or extra limbs. Flopaz, a school-age girl, Pedro's height: chestnut-brown hair in one low side ponytail with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top; white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails, never a hat, never glasses.

    This slot is licensed to vary presentation, overriding the fixed outfits above where they conflict: Closing plates carry the same license as tails at full-page poster weight: mood leads, identity anchors hold.
  subject: A colossal earthen termite-mound city on a dusk plain, architecture that rose without an architect, with the cast tiny at its base and Maro's paper plan hanging useless at its side.
  composition: Vertical plate where the fused spires occupy the upper four fifths against a low sun, their hard silhouette meeting a pale horizon band, with the three figures small along the bottom fifth and Flopaz stepping into a shadowed arch at the mound's foot.
  alt_text: On a dusk plain Pedro looks up at a colossal earthen mound of spires while Maro lets a rolled paper plan hang unused and Flopaz rests a palm on the warm earth wall at its base.
  credit: Illustration generated for this edition.
  cast_references:
  - art-directions/references/story-led-boy-and-robot-cast.png
- id: closing-risen-dough
  purpose: closing
  prompt: |-
    A full-page poster-weight plate, vertical. A warm farmhouse kitchen at night, seen from slightly below. On the table stands a tall glazed crock, and the dough inside it has risen far past anybody's estimate: a smooth pale dome swells up out of the mouth, has lifted the heavy lid clean off to one side where it now rests tilted on the dough's shoulder, and spills in one slow soft lobe over the rim toward the table. It is calm, not alarming, and it is still rising. Flopaz stands at the table with both hands under the overhanging lobe, holding it up like someone catching a sleeping child, entirely unhurried. Pedro stands on a wooden stool at the far side with a flour-dusted measuring jug forgotten in one hand, leaning in over the crock with his mouth open. Maro stands on the floor at the near corner of the table, arms up, steadying the tilted lid so it does not slide, its face screen lit warm by the lamp above. Flour handprints on the table, a folded cloth fallen on the floorboards. Register: full-page poster weight with mood leading, painterly nocturnal washes, one warm hanging lamp against cool blue night at the window, within the same charcoal-contour manga idiom. Setting details: warm ochre lamplight pooling on the table, brick coral crock glaze and kitchen tiles, softened cobalt night beyond the small window, muted green herb jar on the shelf, dusty lavender shadow in the room's upper corners, warm off-white dough and flour haze, charcoal ink contours, no muddy blacks. Pedro, Maro, and Flopaz all appear and each has a real part in this single idea. Frame: portrait A5 page proportion, 1:1.41, 1536 x 2160 pixels, composed as a single full-page plate with the essential subject well inside the frame. Style: original family-friendly children's science-comedy manga illustration with simple charcoal contours, rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone, quiet print grain, slight pigment variation and subtle paper tooth, and one playful visual idea only. Palette: gentle historical magazine color at low to medium saturation, softened cyan and cobalt, brick coral, muted green, dusty lavender, small warm ochre accents, warm off-white breathing room, charcoal ink; the setting chooses the background color and at least three distinct non-neutral colors appear. Strong silhouettes legible at A5 print size, print-friendly contrast. Entirely wordless, single panel, no multi-panel layout. Avoid: any resemblance to Doraemon, Nobita, or any recognizable franchise character, blue robotic cats, franchise gadgets, copied costumes or faces; faces, eyes, mouths, limbs, or any creature features on the dough; a monstrous devouring blob, panic, mess sprayed across the room, or any frightening design; crowded shelves of repeated jars, tins, or small identical objects; uniform yellow, mustard, beige, sepia, cream-paper, or bright cyan backgrounds; extra humans, extra robots, or robot-faced background appliances; decorative montages, contact sheets, or filler patterns; dense technical realism, steampunk clutter, or heavy crosshatching; modern glossy anime rendering, painterly concept art, neon cyberpunk, or photorealism; decorative pseudo-writing, interface glyphs, captions, labels, speech balloons, numerals, or any typography.

