  subject: A colossal fused cave column grown drop by drop over ages, lit by one lantern, with Pedro waiting under it to catch the next single drop.
  composition: Vertical plate with the ribbed column running unbroken from the bottom pool to the top vault, Flopaz's raised lantern lighting it from the left middle band and Pedro and Maro small at its base in the reflecting shallows.
