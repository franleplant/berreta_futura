  subject: A night kitchen where risen dough has pushed the lid off its crock and overflows the rim, tended calmly by all three, growth that outran the recipe that started it.
  composition: Vertical plate viewed slightly from below, the swelling dome and tilted lid holding the upper middle under a single hanging lamp, Flopaz and Pedro flanking the crock and Maro bracing the lid at the near lower corner.
  alt_text: In a lamplit night kitchen, dough swells out of a crock and lifts its lid while Flopaz supports the overflowing lobe, Pedro leans in from a stool, and Maro steadies the tilted lid.
