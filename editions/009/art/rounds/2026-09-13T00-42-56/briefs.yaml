- id: closing-cave-column
  purpose: closing
  prompt: |-
    A full-page poster-weight plate, vertical. Deep inside a limestone cavern, a single colossal flowstone column runs the entire height of the frame, floor to vaulted roof: one stalactite and one stalagmite met and fused ages ago, and the joined pillar is ribbed, draped, and banded like poured wax, thicker than a house and built entirely out of patience. A shallow mirror pool lies around its foot and holds its reflection. Flopaz stands at the pool's edge holding a lantern up and out at arm's length, the one light in the cave, throwing the column's ribs into raking relief. Pedro crouches ankle-deep in the shallow water directly under the column with both palms cupped together, waiting for a single bright drop hanging far above to fall. Maro stands a pace behind Pedro with a folded measuring stick held loosely at its side, forgotten, its face screen tipped up at the roof where the column disappears into the dark vault. Cool cave dark at the edges, one warm island of light in the middle. Register: full-page poster weight with mood leading, painterly subterranean washes and dramatic single-lantern light within the same charcoal-contour manga idiom. Setting details: dusty lavender and softened cobalt cave shadow, warm ochre lantern glow across the column's banding, brick coral mineral stain down one flank, muted green weed at the pool's rim, warm off-white highlights on wet stone and water, charcoal ink contours, deep but never muddy darks. Pedro, Maro, and Flopaz all appear and each has a real part in this single idea. Frame: portrait A5 page proportion, 1:1.41, 1536 x 2160 pixels, composed as a single full-page plate with the essential subject well inside the frame. Style: original family-friendly children's science-comedy manga illustration with simple charcoal contours, rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone, quiet print grain, slight pigment variation and subtle paper tooth, and one playful visual idea only. Palette: gentle historical magazine color at low to medium saturation, softened cyan and cobalt, brick coral, muted green, dusty lavender, small warm ochre accents, warm off-white breathing room, charcoal ink; the setting chooses the background color and at least three distinct non-neutral colors appear. Strong silhouettes legible at A5 print size, print-friendly contrast. Entirely wordless, single panel, no multi-panel layout. Avoid: any resemblance to Doraemon, Nobita, or any recognizable franchise character, blue robotic cats, franchise gadgets, copied costumes or faces; bats, creatures, glowing eyes, faces in the rock, or any frightening design; forests of repeated identical stalactites, crystal clusters, sparkle confetti, or scattered small elements; caving gear, helmets, ropes, rigging, or expedition clutter; uniform yellow, mustard, beige, sepia, cream-paper, or bright cyan backgrounds; extra humans, extra robots, or robot-faced background appliances; decorative montages, contact sheets, or filler patterns; dense technical realism, steampunk clutter, or heavy crosshatching; modern glossy anime rendering, painterly concept art, neon cyberpunk, or photorealism; decorative pseudo-writing, interface glyphs, captions, labels, speech balloons, numerals, or any typography.

