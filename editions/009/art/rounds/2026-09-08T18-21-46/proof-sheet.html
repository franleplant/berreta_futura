<details><summary>prompt</summary><pre>A full-page poster-weight plate, vertical. A colossal spiral seashell stands on a wide tidal flat, taller than a two-storey house, its whorls climbing the full height of the frame and its wide aperture opening toward the viewer at ground level; the spiral's order is exact and unmistakably grown, ridge answering ridge, nothing about it ruled or drawn. Flopaz stands at the aperture with one palm flat on the inner lip and her head turned to listen into the hollow, entirely still. Pedro has stepped a pace inside the mouth, leaning back with both hands on his knees to look up the vault of the spiral, mouth open. Maro sits on the wet sand at the shell's foot with a ball of measuring string it has stopped unwinding, one loose end lying forgotten across its knee, its face tipped up at the top whorl far above. Low water lies in bright sheets around them and holds the shell's reflection. Register: full-page poster weight with mood leading, painterly washes and low late-afternoon light raking across the flats, within the same charcoal-contour manga idiom. Setting details: brick coral and soft rose banding on the shell, softened cobalt shallow water, warm ochre wet sand, muted green weed at the waterline, dusty lavender far shore, warm off-white sky breathing at the top edge, charcoal ink contours. Pedro, Maro, and Flopaz all appear and each has a real part in this single idea. Frame: portrait A5 page proportion, 1:1.41, 1536 x 2160 pixels, composed as a single full-page plate with the essential subject well inside the frame. Style: original family-friendly children's science-comedy manga illustration with simple charcoal contours, rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone, quiet print grain, slight pigment variation and subtle paper tooth, and one playful visual idea only. Palette: gentle historical magazine color at low to medium saturation, softened cyan and cobalt, brick coral, muted green, dusty lavender, small warm ochre accents, warm off-white breathing room, charcoal ink; the setting chooses the background color and at least three distinct non-neutral colors appear. Strong silhouettes legible at A5 print size, print-friendly contrast. Entirely wordless, single panel, no multi-panel layout. Avoid: any resemblance to Doraemon, Nobita, or any recognizable franchise character, blue robotic cats, franchise gadgets, copied costumes or faces; any creature inside the shell, eyes, teeth, or frightening design; beaches strewn with scattered small shells, debris, or repeated small elements; uniform yellow, mustard, beige, sepia, cream-paper, or bright cyan backgrounds; extra humans, extra robots, or robot-faced background appliances; decorative montages, contact sheets, or filler patterns; dense technical realism, steampunk clutter, or heavy crosshatching; modern glossy anime rendering, painterly concept art, neon cyberpunk, or photorealism; decorative pseudo-writing, interface glyphs, captions, labels, speech balloons, numerals, or any typography.

Recurring cast — identities below are canon: Pedro, a school-age boy: black tousled hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions, or extra limbs. Flopaz, a school-age girl, Pedro's height: chestnut-brown hair in one low side ponytail with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top; white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails, never a hat, never glasses.
