- id: closing-listening-shell
  purpose: closing
  prompt: |-
    A full-page poster-weight plate, vertical. A colossal spiral seashell stands on a wide tidal flat, taller than a two-storey house, its whorls climbing the full height of the frame and its wide aperture opening toward the viewer at ground level; the spiral's order is exact and unmistakably grown, ridge answering ridge, nothing about it ruled or drawn. Flopaz stands at the aperture with one palm flat on the inner lip and her head turned to listen into the hollow, entirely still. Pedro has stepped a pace inside the mouth, leaning back with both hands on his knees to look up the vault of the spiral, mouth open. Maro sits on the wet sand at the shell's foot with a ball of measuring string it has stopped unwinding, one loose end lying forgotten across its knee, its face tipped up at the top whorl far above. Low water lies in bright sheets around them and holds the shell's reflection. Register: full-page poster weight with mood leading, painterly washes and low late-afternoon light raking across the flats, within the same charcoal-contour manga idiom. Setting details: brick coral and soft rose banding on the shell, softened cobalt shallow water, warm ochre wet sand, muted green weed at the waterline, dusty lavender far shore, warm off-white sky breathing at the top edge, charcoal ink contours. Pedro, Maro, and Flopaz all appear and each has a real part in this single idea. Frame: portrait A5 page proportion, 1:1.41, 1536 x 2160 pixels, composed as a single full-page plate with the essential subject well inside the frame. Style: original family-friendly children's science-comedy manga illustration with simple charcoal contours, rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone, quiet print grain, slight pigment variation and subtle paper tooth, and one playful visual idea only. Palette: gentle historical magazine color at low to medium saturation, softened cyan and cobalt, brick coral, muted green, dusty lavender, small warm ochre accents, warm off-white breathing room, charcoal ink; the setting chooses the background color and at least three distinct non-neutral colors appear. Strong silhouettes legible at A5 print size, print-friendly contrast. Entirely wordless, single panel, no multi-panel layout. Avoid: any resemblance to Doraemon, Nobita, or any recognizable franchise character, blue robotic cats, franchise gadgets, copied costumes or faces; any creature inside the shell, eyes, teeth, or frightening design; beaches strewn with scattered small shells, debris, or repeated small elements; uniform yellow, mustard, beige, sepia, cream-paper, or bright cyan backgrounds; extra humans, extra robots, or robot-faced background appliances; decorative montages, contact sheets, or filler patterns; dense technical realism, steampunk clutter, or heavy crosshatching; modern glossy anime rendering, painterly concept art, neon cyberpunk, or photorealism; decorative pseudo-writing, interface glyphs, captions, labels, speech balloons, numerals, or any typography.

    Recurring cast — identities below are canon: Pedro, a school-age boy: black tousled hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions, or extra limbs. Flopaz, a school-age girl, Pedro's height: chestnut-brown hair in one low side ponytail with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top; white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails, never a hat, never glasses.

    This slot is licensed to vary presentation, overriding the fixed outfits above where they conflict: Closing plates carry the same license as tails at full-page poster weight: mood leads, identity anchors hold.
  subject: A house-sized seashell whose exact spiral was grown rather than drawn, and the three stopping their measuring to listen to it instead.
  composition: Vertical plate with the shell's whorls climbing the full height and its aperture at ground level, the three small in the lower fifth around the mouth, wet flats and reflection carrying the eye up the spiral.
  alt_text: On a tidal flat, Flopaz listens with a palm on the lip of a house-sized spiral shell while Pedro leans into its mouth looking up the whorls and Maro sits at its foot with a ball of measuring string left unwound.
  credit: Illustration generated for this edition.
  cast_references:
  - art-directions/references/story-led-boy-and-robot-cast.png
- id: closing-frost-window
  purpose: closing
  prompt: |-
    A full-page poster-weight plate, vertical. Inside a warm room at night, one tall sash window fills nearly the whole frame, and across every pane a vast fern-frost pattern has grown by itself overnight, branching and branching again from the corners toward the centre, backlit by a street lamp outside so the crystal blazes pale against the cold dark. Flopaz stands at the left holding a small oil lamp up close to the glass so the frost throws its structure forward, her face lit from below. Pedro presses one warm bare palm flat against a lower pane and has already melted a clear round window through the frost, leaning in to squint through the hole at the night street. Maro stands on a low wooden stool at the right with a round magnifier held to a single frost frond at the pane's edge, close enough that its face screen glows off the glass. A knitted blanket has slid off the window seat onto the floorboards. Register: full-page poster weight with mood leading, painterly nocturnal washes, warm interior lamplight against cool night glass, within the same charcoal-contour manga idiom. Setting details: softened cobalt and dusty lavender night beyond the panes, warm ochre lamp glow on the room side, brick coral blanket and curtain edge, muted green potted plant on the sill, warm off-white frost and haze on the glass, charcoal ink contours and window bars, no muddy blacks. Pedro, Maro, and Flopaz all appear and each has a real part in this single idea. Frame: portrait A5 page proportion, 1:1.41, 1536 x 2160 pixels, composed as a single full-page plate with the essential subject well inside the frame. Style: original family-friendly children's science-comedy manga illustration with simple charcoal contours, rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone, quiet print grain, slight pigment variation and subtle paper tooth, and one playful visual idea only. Palette: gentle historical magazine color at low to medium saturation, softened cyan and cobalt, brick coral, muted green, dusty lavender, small warm ochre accents, warm off-white breathing room, charcoal ink; the setting chooses the background color and at least three distinct non-neutral colors appear. Strong silhouettes legible at A5 print size, print-friendly contrast. Entirely wordless, single panel, no multi-panel layout. Avoid: any resemblance to Doraemon, Nobita, or any recognizable franchise character, blue robotic cats, franchise gadgets, copied costumes or faces; frost drawn as snowflake stamps, repeated identical motifs, sparkle confetti, or scattered small elements; drawings, letters, or shapes traced in the frost; uniform yellow, mustard, beige, sepia, cream-paper, or bright cyan backgrounds; extra humans, extra robots, or robot-faced background appliances; decorative montages, contact sheets, or filler patterns; dense technical realism, steampunk clutter, or heavy crosshatching; modern glossy anime rendering, painterly concept art, neon cyberpunk, or photorealism; decorative pseudo-writing, interface glyphs, captions, labels, speech balloons, numerals, or any typography.

    Recurring cast — identities below are canon: Pedro, a school-age boy: black tousled hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions, or extra limbs. Flopaz, a school-age girl, Pedro's height: chestnut-brown hair in one low side ponytail with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top; white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails, never a hat, never glasses.

