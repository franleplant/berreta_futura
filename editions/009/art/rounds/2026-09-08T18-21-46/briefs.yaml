  subject: A window pane whose enormous branching frost was built overnight by plain repeated physics, and a warm palm opening one clear hole through it.
  composition: Vertical plate with a tall backlit sash window occupying the full height, the three ranged across its lower half at lamp, pane, and stool, the frost's branching driving the eye inward from the corners.
  alt_text: At a tall night window furred with branching frost, Flopaz holds a lamp to the glass, Pedro melts a clear round hole with his palm and peers through, and Maro studies one frost frond through a magnifier from a stool.
  credit: Illustration generated for this edition.
