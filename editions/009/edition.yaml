  deck: Six patterns against prompt injection, the persona behind the Assistant, commerce agents
    in days, Pachocki's alien mind, OpenAI measuring its own acceleration, a plan built to benefit
    everyone, and first silicon called Jalapeño
  back_text: 'Run a plain optimization step on an unimaginable amount of compute and you get a mind
    nobody drew. This issue walks its perimeter: the six patterns that keep a stranger''s tokens
    away from the cart and the inbox, the character a model plays when it answers, a research lab
    watching its own work pass to agents, and a chip that went from design to tapeout in nine
    months with the model''s help. The systems are grown. The choices about them are still ours
    to design.'
