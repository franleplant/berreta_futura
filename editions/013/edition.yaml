  manuscript: editions/013/articles/introducing-clef-our-open-source-decision-models.md
  # figure candidates (uncomment into a `figures:` list; each row needs id, source_id, path, caption, alt_text,
  # anchor = a ## or ### heading in the manuscript, and layout = one of evidence_band, evidence_band_prose, adaptive_band,
  # compact_band, column_plate, landscape_plate, full_band, rotated_plate; render enlarges small-text figures
  # itself unless the row sets fit: keep, and tone: auto|keep|invert controls dark-image inversion). short_title and display_emphasis must occur inside title.
  #   introducing-clef-our-open-source-decision-models-c0a0a5f5 media/001.png: decision-index-vs-latency.png
  #   introducing-clef-our-open-source-decision-models-c0a0a5f5 media/002.png: 
  #   introducing-clef-our-open-source-decision-models-c0a0a5f5 media/003.png: 
  figures:
  - id: decision-model
    source_id: introducing-clef-our-open-source-decision-models-c0a0a5f5
    path: media/002.png
    caption: 'A decision model reads one input and scores every question in parallel: a support ticket becomes department Technical, 100 percent, and urgent, 100 percent.'
    alt_text: 'Diagram. Inputs: a support ticket from an enterprise customer reading Our API started returning 500 errors 20 minutes ago, and two questions, which team and is it urgent. An orange Decision model box evaluates all questions and returns parallel outputs: department Billing 0 percent, Technical 100 percent, Sales 0 percent; urgency Yes 100 percent, No 0 percent.'
    anchor: 'What a decision model does'
    layout: landscape_plate
  - id: decision-index
    source_id: introducing-clef-our-open-source-decision-models-c0a0a5f5
    path: media/001.png
    caption: 'Decision index against median latency: Clef and Clef-flash sit on the efficient frontier, higher and faster than open models and close to the closed Jev model.'
    alt_text: 'Scatter plot. Vertical axis Decision Index, higher is better; horizontal axis median latency in milliseconds, slower to the right. An orange dashed efficient frontier runs through Clef-flash at 57.1 and Clef at 61.2 on the left; open models including Surrogate Rune, Decider chat, AutoJev, and Jebadiah cluster lower; Jev sits far right at 57.8.'
    anchor: 'How Clef differs'
    layout: landscape_plate
  - id: rl-loop
    source_id: introducing-clef-our-open-source-decision-models-c0a0a5f5
    path: media/003.png
    caption: 'The RL service as a loop: logged production traffic becomes tasks, Workers AI samples responses, containers score them, and the trainer updates weights until a checkpoint is promoted.'
    alt_text: 'Flow diagram. Capture with Cloudflare AI Gateway feeds Prepare your data pipeline, which sends tasks into an RL training loop of three boxes: Generate on Cloudflare Workers AI, Execute and score in Cloudflare Containers with your reward code, and Update weights in the RL trainer. A selected checkpoint goes to Deploy on Workers AI, and new production traffic and feedback loop back to Capture.'
    anchor: 'Fine-tuning and the RL service'
    layout: landscape_plate
