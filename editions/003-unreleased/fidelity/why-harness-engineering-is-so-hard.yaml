- id: synthesis-004
  kind: p
  status: modified
  source: |-
    There is an illusion that settles over almost every project built on a large language model. The illusion is that the model is the product. You wire up an API call, write a prompt, get something impressive in the first demo, and feel as though the hard part is finished.

    It is not.
  edited: |-
    An illusion settles over almost every project built on a large language model: that the model is the product. An API call, a prompt, an impressive first demo — and the hard part feels finished. It is not.
  reason: Two paragraphs compressed into one for the page budget; the demo sequence is tightened into a list while keeping the illusion claim and the "It is not" turn.
- id: synthesis-005
  kind: p
  status: modified
  source: |-
    The difficult part is turning that impressive demonstration into behaviour you can rely on. It is getting the model to follow the same constraints across different inputs, express the right ideas without drifting, survive model updates, fail visibly instead of silently, and produce output that can be tested even though it will never be perfectly deterministic.
  edited: |-
    The difficult part is turning that demonstration into behaviour you can rely on: the same constraints across inputs, the right ideas without drifting, surviving model updates, failing visibly instead of silently, output that can be tested though never perfectly deterministic.
  reason: The five reliability requirements are kept complete but recast as a compact list to fit the page budget.
- id: synthesis-006
  kind: p
  status: modified
  source: |-
    That behavioural layer is a large part of what I mean by the harness: the prompts, examples, schemas, validators, evals, and guardrails that sit between a probabilistic model and the person using your product. The model generates the output. The harness is what makes that output usable. 
  edited: |-
    That behavioural layer is much of what I mean by the harness: the prompts, examples, schemas, validators, evals, and guardrails between a probabilistic model and the person using your product. The model generates the output; the harness makes it usable.
  reason: Light tightening only; the full harness definition and the model/harness contrast are preserved.
- id: synthesis-007
  kind: p
  status: modified
  source: |-
    This is why harness engineering is so hard, and why the difficulty keeps surprising people who are otherwise excellent engineers. I've spent months in it, and most of the pain comes from a handful of structural facts about working with a probabilistic system that look, on the surface, like ordinary software problems, but to our dismay, are not.
  edited: |-
    This keeps surprising otherwise excellent engineers. I've spent months in it; most of the pain comes from structural facts that look like ordinary software problems, but are not.
  reason: Condensed for the page budget; the first-person months-of-pain claim and the structural-facts thesis are kept.
- id: synthesis-008
  kind: h2
  status: retained
  source: |-
    You can't write the test you want to write
- id: synthesis-009
  kind: p
  status: modified
  source: |-
    The first thing that breaks is your testing instinct. Every testing practice you've built up over a career assumes determinism: given this input, the code produces this output, and I assert equality. But feed the same input to a language model twice, and you get two different outputs. Not always wildly different, sometimes the difference is a few words, a reordered clause, a slightly different way of phrasing the same idea, but different enough that a strict equality assertion is useless. 
  edited: |-
    Your testing instinct breaks first. Every practice you've built assumes determinism: given this input, the code produces this output, and I assert equality. Feed a language model the same input twice and you get two different outputs — a few words apart, but enough that strict equality is useless.
  reason: The list of small variation types is compressed to "a few words apart" for the page budget; the determinism premise and useless-equality conclusion are kept.
- id: synthesis-010
  kind: p
  status: modified
  source: |-
    This sounds like a minor annoyance. It is not. It removed the floor under my whole quality strategy for my specific harness. The reflex, "write a test, run it, green means done" no longer works, and most engineers don't have a replacement reflex ready. You can't assert on exact wording, because the wording changes. You can assert on structure (does the output parse, do the required fields exist, are the counts right), and you can assert on invariants (does it violate a rule it was told to follow), but both of those are weaker than what engineers are used to, and both let real unexpected output through. 
  edited: |-
    This removed the floor under my quality strategy. You can assert on structure and invariants, but both are weaker than engineers are used to and let unexpected output through.
  reason: Condensed for the page budget; the parenthetical examples of structural and invariant checks are dropped, but the floor-removal claim and the both-are-weaker-and-leaky qualification are kept.
- id: synthesis-011
  kind: p
  status: modified
  source: |-
    Instead of asking whether one output equals one expected answer, you begin asking whether the system satisfies a rubric across a distribution of inputs and repeated runs. That is closer to evaluation than ordinary unit testing, and the result is a confidence level rather than a proof of correctness.
  edited: |-
    Instead of one output equalling one expected answer, you ask whether the system satisfies a rubric across a distribution of inputs and repeated runs — a confidence level, not a proof.
  reason: Lightly tightened; the rubric-over-distribution reframing and the confidence-not-proof conclusion are kept.
- id: synthesis-012
  kind: p
