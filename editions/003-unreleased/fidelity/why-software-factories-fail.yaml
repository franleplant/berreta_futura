      "id": "part2-system-architecture",
      "kind": "p",
      "status": "modified",
      "source": "System architecture\nOnce the product review is settled, we do system architecture. This is not particularly novel and is something even vibe coders are starting to swear by.\nIf you wanna save time during review, you pick the person who would review the PR, and run through the product/tech specs with them before you get to the coding part.\nIn this phase we align on how the services, endpoints, schemas, queues, and stores talk to each other, without getting into the details of program design. To maximize human<>agent communication bandwidth, we make heavy use of visualizations here - for example sequence diagrams:\nContract / endpoint shapes:\nData models and transformations:\nMermaid is fine here but it can sometimes be overkill and sometimes lure you into a false sense that you are aligned. Architecture is fairly high leverage and there's a lot of potentially-bad model tics that you can head off during this phase. But it is insufficient to produce high-quality code. For that we need program design.",
      "edited": "System architecture aligns services, endpoints, schemas, queues, stores, and data flow without deciding the code's internal shape. Review it with the eventual PR reviewer; disagreement here is cheaper than rework.",
      "reason": "Condenses service and data-flow alignment, early reviewer participation, visualization choices, and the qualification that architecture is necessary but insufficient."
    },
    {
      "id": "part2-program-design-heading",
      "kind": "h2",
