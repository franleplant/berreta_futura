      "id": "part1-training-thesis",
      "kind": "p",
      "status": "modified",
      "source": "What I'm gonna try to convince you is that no amount of harness engineering or loopsmaxxing can solve what is fundamentally a model-training issue.\nTo grapple with this, I had to dig into how coding models are actually trained and evaluated - with respect to both the RLVR and the benchmark side of things.\nIn this post I'm gonna run through:\nSoftware factories date back to 1968, how have they evolved, and how has AI changed them\nWhy models can generate mountains of slop despite ace-ing benchmarks (even the brand new \"frontier\" benchmarks)\nIn spite of this, you can move pretty fast without setting your codebase on fire\nI'm gonna try to cut through the hype of every daily-emerging skills plugin and the ai-psychosis-tokenmaxxing advice pandemic, and talk in general terms about the types of things that work without referencing any particular skill or framework.\nmodels degrade codebase quality over time\nWhat I want to get to is this: models have a shortcoming. They can't maintain and improve codebase quality over time -- not without a decent amount of human steering.4\nI'm not going to say much more about maintainability. There are a bunch of books you can go read about it\nJohn Ousterhout's A Philosophy of Software Design\nRobert C. Martin's Clean Code\nMartin Fowler's Refactoring\nSo, why can't models do software maintainability?\n\"But surely the models have gotten better since then\"\nAt this point you might be dying to say: but Dex, surely the models have gotten much better since July\nThey have -- in some ways. In others they're about the same.\nSolving one-off problems, or vibe-coding a new marketing site? Yes. Way better.\nImproving codebase quality over time? Not much better, as far as I can tell.\nI can't prove this. You can't prove it either. There are no good benchmarks for a model's ability to maintain codebase quality. (More on where that's going later.)\nTHERE ARE NO GOOD BENCHMARKS for a model's ability to maintain codebase quality\n\n\nBut if you've worked with coding agents for a while -- and a lot of people are posting about exactly this -- you probably have the vibe already: they tend to make things worse over time, and make the codebase harder to work in.",
      "edited": "No amount of harness engineering or loopsmaxxing can solve what is fundamentally a model-training problem. Models are much better at one-off tasks, but I do not trust them to maintain and improve codebase quality over time without a decent amount of human steering. There are no good benchmarks for that ability.",
      "reason": "Preserves the model-training thesis, the one-off-task qualification, and the absence of a maintainability benchmark. The source's \"models degrade codebase quality over time\" section was folded forward into the article's third paragraph, ahead of the factory history and the lights-off experiment; in the source it follows both. The definition of maintainability as changing one part breaking another is declared by the later maintainability entry, whose edited text carries it."
