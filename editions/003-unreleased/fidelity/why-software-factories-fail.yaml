      "kind": "p",
      "status": "modified",
      "source": "In part 1, I went deep on why models can't be trusted to maintain codebase quality over time. Why no amount of harness engineering or tokenmaxxing will solve a model-training and benchmarks problem. Why \"model as judge\" for code quality doesn't work as well as some folks want to tell you.\nFor now, the judge is you -- so we're gonna put the code review back.\nWe're gonna embrace that same thing we've been doing since before AI, which is to do a little bit of planning up front, to reduce the odds of a long and difficult review.\nWe're gonna find leverage, and we're gonna use AI to help with this, across 4 phases:\nProduct Requirements\nSystem Architecture\nProgram Design\nVertical Slices",
