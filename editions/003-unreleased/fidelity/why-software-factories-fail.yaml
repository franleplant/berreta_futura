    {
      "id": "part2-product-review",
      "kind": "p",
      "status": "modified",
      "source": "Product review\nEverything starts with a product review: a short doc that pins down what we're building and why. The goal is to be able to take two sentences or a long voice note ramble and turn it into something semi-structured.\nFirst, we align on the problem to solve -- the actual user pain, in the user's terms. Second, what success looks like -- what can we read after shipping to decide the thing was worth building. Ideally this is a user outcome like \"can do XYZ workflow in less time\" or \"reaches onboarding milestone ABC earlier\". Sometimes it's lower level like an error rate or a latency number, sometimes just \"the support tickets about X stop.\"\nWe try to keep this pretty grounded in the product space, not the technical. As someone who lives with one foot in the product world and one foot in the tech, I often find myself drifting into the technical details here. When that happens, I try to just jot it down for later phases and get back to what the user actually experiences. If tech decisions are blocking product decisions, then we commit what we have and get into the architecture or do more prototype research on what's feasible\nAnd since most of this is about what the user sees, I don't describe it -- I mock it up. A rough HTML mockup of the actual screen settles an argument that three paragraphs would only prolong.\nHere's a real one in progress -- the doc pins down the feature with a JSON outline, then two rough HTML mockups of the actual screens:\nhttps://x.com/dexhorthy/status/2078592010852982977\nOf course, not everything gets a product review. A copy tweak, a one-off script, a bug with an obvious repro -- we still just oneshot those straight to the agent. This is for the changes where an agent misunderstanding our intent is expensive.\nFor this and all docs in the series, we do author-opt-in reviews. If you wanna save time during review, you pick the person who would review the PR, and run through the product/tech specs with them, either async via doc comments (we dogfood humanlayer for this, but you can just as easily do this in github/notion/plannotator/etc).",
      "edited": "A product review pins down the user pain, what success looks like, and, when useful, a rough mockup. Reserve it for work where misunderstanding intent would be expensive.",
      "reason": "Preserves product review's purpose, user pain, success criteria, mockups, proportional use, and review with the eventual PR reviewer."
    },
