      "id": "part1-frontier-evals",
      "kind": "p",
      "status": "modified",
      "source": "The frontier is getting better, slowly\nOf course lots of smart folks are working on this. My point is not that it can't be done, it's that the hype is outrunning the discipline.\nA few efforts I think are pointed the right way:\nSWE-Marathon (Abundant AI): ~400-hour tasks like \"clone all of Excel, every feature\" -- with a compound reward channel instead of a single pass/fail bit\nDeepSWE (Datacurve): big tasks on OSS repos that were never actually built in the real world, so by construction they can't already be sitting in the training set (solves contamination, but not quality)\nFrontier Code (Cognition): multi-PR tasks, and a clever move that evaluates quality deterministically -- it penalizes the model for writing tests that don't fail on the pre-patch code (if you've never heard about mutation testing you are in for a fun ride5). It also runs a judge model over the diff checking code-quality rules.\nBut a model judging quality can only go so far.\nif a model could reliably tell good code from bad, it might have written the good version to begin with, but maintainability has no fast oracle, so we can't reward for it during RL\n\n\nOf course, more review agents and more tokens do help -- they raise the floor, catching the dumb stuff.\nBut they don't move the ceiling, because the ceiling is whatever we managed to teach the model in RL, and good design is the thing we still don't know how to teach it.\nSo I still wouldn't bet my codebase on any of these. But they're the first evals I've seen even trying to score maintainability instead of stopping at pass/fail.",
      "edited": "Promising evaluations are beginning to use longer tasks, compound rewards, mutation testing, and model-based quality rules. But if a model could reliably judge good code, it might have written the good version to begin with. More tokens and review agents raise the floor; they do not move the ceiling beyond what the model learned to recognize. The frontier is improving; the hype is outrunning the discipline.",
      "reason": "Preserves the qualified frontier-improvement claim, the judge-model limitation, and the floor-versus-ceiling conclusion. The three named efforts -- SWE-Marathon, DeepSWE and Frontier Code -- are not named in print: only the techniques they contribute (longer tasks, compound rewards, mutation testing, model-judged quality rules) survive, while the labs, the task descriptions and the contamination argument are cut for the page budget. The sentence that RL needs a fast, reliable oracle and has none for maintainability is declared by the earlier maintainability entry, which imports it; the good-code-judging claim reaches print here from the pull-quote line that restates it."
    },
