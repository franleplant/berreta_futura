      "kind": "p",
      "status": "modified",
      "source": "While the code quality metrics are interesting, I don't think they tell the whole story, and its easy for a model to reward hack any of them. Just like SWE-bench shaped problems were the best verifier for \"solve a software problem one time\", because they map onto real world work at that \"zoom level\", I think \"pass all verifiers for an incrementally-divulged spec\" is a very realistic eval for \"can a model maintain a codebase over time\".\nThat is, a codebase becoming hard to maintain would lead to failing checkpoints in later stages, so a higher strict pass rate is a signal that the model is good at building a codebase that is maintainable.\nWith frontier models like Fable / Sol proving to be expert debuggers and reverse-engineers, incorporating cost/time/token metrics might become more important over time - frontier models like Fable and Sol can probably get it done in the NASTIEST of codebases, but I'd venture that a well-factored codebase will tend to lead to shorter, more token-efficent solves for future problems.\nAnd while \"build a whole feature across 8 checkpoints\" is a lot slower than \"solve a 15min SWE-bench multilingual problem\", it can be executed unattended and is subject deterministic behavior verifiers at the end. So IMO its a much better oracle than e.g. \"does another model think this code is clean\".\nI think any even better signal that we can hope to get from a model that is really good at maintaining a codebase, is that we could try having a frontier model like opus 5, fable 5, or gpt-5.6-sol write the first N checkpoints, and see if a dumber model like sonnet 5 or gpt-5.6-terra can implement checkpoint N+1.\nThis amplifies the signal of whether the smart models did a good job maintaining high-quality code that is easy to change.\nWhether a small model like Sonnet or Terra or even Haiku can implement checkpoint 8 impacts the smart models' score on checkpoints 1-7.",
      "edited": "The better oracle is the trajectory: can early design decisions survive later requirements? Cost, time, and tokens may matter too; a well-factored codebase should make the next change cheaper. An even sharper test would let a frontier model build checkpoints one through seven, then ask a smaller model to implement checkpoint eight. If it can inherit and extend the design, that result belongs to the model that left the codebase behind.",
      "reason": "Preserves trajectory-level verification, the connection between later failure and earlier design, cost and time as maintainability signals, and the proposed frontier-to-smaller-model inheritance test. The span carries the source's full sentence about cost, time and token metrics, including the clause print's \"a well-factored codebase should make the next change cheaper\" rests on: frontier models like Fable and Sol can get it done in the nastiest of codebases, but a well-factored codebase will tend to lead to shorter, more token-efficient solves for future problems. It also carries the source's reason the checkpoint eval beats a model judge -- slower than a fifteen-minute SWE-bench problem, but unattended and settled by deterministic behaviour verifiers, so a much better oracle than asking another model whether the code looks clean -- which is what print's \"better oracle\" asserts, and the sentence print's checkpoint one-through-seven and checkpoint eight claim rests on: whether a small model can implement checkpoint 8 scores the smart models on checkpoints 1-7. Cut: the reward-hacking warning about the quality metrics, the SWE-bench zoom-level analogy, and the specific model names in the proposal."
