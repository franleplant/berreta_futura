      "id": "part2-proportional-process",
      "kind": "p",
      "status": "modified",
      "source": "Obviously we don't do this whole process for everything we ship (see the sidequest below). I would guess the distribution is roughly:\n~40% of tasks get oneshot or oneshot w/ 1-2 rounds of light feedback\nfor medium tasks, we do product/system design all in one plan document, and don't bother breaking the work into phases\nfor large things, we do all the steps. we'll skip the product part for things where it doesn't make sense like big refactors.",
      "edited": "This process is proportional. Roughly 40 percent of tasks can still be one-shot or need only light feedback. Medium work can combine product and system design in one plan. Large or risky changes get the full sequence, with the irrelevant phases skipped when appropriate.",
