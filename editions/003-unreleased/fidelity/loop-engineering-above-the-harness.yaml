- id: synthesis-012
  kind: p
  status: modified
  source: 'Automations, this is the heartbeat


    Automations are what make a loop an actual loop and not just one run you did once. In the Codex app you make
    one in the Automations tab and you pick the project, the prompt it will run, how often, and if it runs on your
    local checkout or on a background worktree. The runs that find something go to a Triage inbox, and the runs
    that find nothing just archive themselves wich is nice. OpenAI uses them internally for boring stuff like daily
    issue triage, summarising CI failures, writing commit briefings, hunting bugs somebody added last week. And
    an automation can call a skill, so you keep the recurring thing maintainable, you fire $skill-name instead of
    pasting a giant wall of instructions into a schedule that nobody will ever update.


    Claude Code gets to the same place but through scheduling and hooks. You can run a prompt or a command on a
    interval with /loop, you can schedule a cron task, you can fire shell commands at certain points in the agent
    lifecycle with hooks, or you push the whole thing to GitHub Actions if you want it to keep running after you
    close the laptop. Same idea exactly, you define an autonomous task, you give it a cadence, and the findings
    come to you so you are not the one going around checking.


    There is a second in-session primitive worth knowing, and it’s the one closer to what this whole post is about.
    /loop re-runs on a cadence. /goal keeps going until a condition you wrote is actually true, and after every
    turn a separate small model checks whether you are done, so the agent that wrote the code isnt the one grading
    it. You give it something like “all tests in test/auth pass and lint is clean” and walk away. Codex has the
    same thing, also called /goal, it keeps working across turns until a verifiable stopping condition holds, with
    pause and resume and clear. Same primitive, both tools, wich is kind of the pattern for this whole article.


    So this is the part that surfaces the work. The rest of the loop is what acts on it.'
  edited: Automations are what make a loop an actual loop, not one run you did once. Codex schedules them in an
    Automations tab; Claude Code uses /loop, cron, hooks, or GitHub Actions. And /goal, in both, runs until a condition
    you wrote is true — in Claude Code, a separate small model checks each turn, so the agent that wrote the code
    isn’t grading it.
  reason: Condensed four automation paragraphs into one; removed OpenAI's internal-use examples, the skill-calling
    detail, Triage-inbox archiving, Codex /goal pause/resume and the section transition, keeping the schedule primitives
    of both tools and Claude Code's /goal separate-grader point.
- id: synthesis-013
  kind: p
  status: modified
  source: 'Worktrees so paralell doesnt turn into chaos


    The second you run more than one agent the files start colliding, that becomes the failure. Two agents writing
    the same file is the exact same headache as two engineers committing to the same lines and nobody talked to
    each other first. A git worktree fixes it, its a separate working directory on its own branch sharing the same
    repo history, so one agent’s edits literally can not touch the other one’s checkout.


    Codex builds the worktree support right in so several threads hit the same repo at once and dont bump into each
    other. Claude Code gives you the same isolation with git worktree, a --worktree flag to open a session in its
    own checkout, and a isolation: worktree setting you stick on a subagent so each helper gets a fresh checkout
    that cleans itself up after. I wrote about the human side of all this in the orchestration tax, the worktrees
    take away the mechanical collision but YOU are still the ceiling, your review bandwith decides how many you
    can actually run, not the tool.'
  edited: 'Worktrees keep parallel from turning into chaos: a separate working directory on its own branch, so one
    agent’s edits literally can not touch another’s checkout. But you are still the ceiling — your review bandwidth
    decides how many you can run, not the tool.'
  reason: Condensed; removed the two-engineers analogy and the orchestration-tax reference, keeping the isolation
    mechanism, the per-tool support claim folded into 'you', and the review-bandwidth ceiling.
- id: synthesis-014
  kind: p
  status: modified
  source: 'Skills, so you stop explaining your project every single time


    A skill is how you stop re-explaining the same project context every session like a goldfish. Both tools use
    the same format, a folder with a SKILL.md inside holding instructions and metadata, and then optional scripts,
    references, assets. Codex runs a skill when you call it with $ or /skills, or by itself when your task matches
    the skill description, wich is the reason a tight boring description beats a clever one. Claude Code does it
    the same way and I wrote the pattern up in agent skills.


    Skills are also where intent stops costing you over and over. I argued in the intent debt that an agent starts
    every session cold and it will fill any hole in your intent with a confident guess. A skill is that intent written
    down on the outside, the conventions, the build steps, the “we dont do it like this because of that one incident”,
    written one time where the agent reads it every run. Without skills the loop re-derives your whole project from
    zero every cycle, with skills it kind of compounds.


    One thing to keep straight, the skill is the authoring format and a plugin is how you ship it. When you want
    to share a skill across repos or bundle a few together you package them as a plugin. True in Codex, true in
    Claude Code.'
  edited: A skill is how you stop re-explaining the project every session — a folder with a SKILL.md, your intent
    written down once, where the agent reads it every run. Without skills the loop re-derives your project from
    zero every cycle; with skills it compounds.
  reason: Condensed the skills paragraphs; removed invocation details ($ and /skills), the intent-debt post reference,
    the incident example and the skill-versus-plugin packaging note, keeping the write-once-read-every-run point
    and the compounding claim.
- id: synthesis-015
  kind: p
  status: modified
  source: 'Plugins and connectors, the loop touches your real tools


    A loop that can only see the filesystem is a tiny loop. Connectors, wich are built on MCP, let the agent read
    your issue tracker, query a database, hit a staging api, drop a message in Slack. Codex and Claude Code both
    speak MCP so the connector you wrote for one usually just works in the other. And plugins bundle connectors
    and skills together so your teammate installs your setup in one go instead of rebuilding the whole thing from
    memory.


    This is the difference between an agent that says “here is the fix” and a loop that opens the PR, links the
    Linear ticket and pings the channel once CI is green by itself. The connectors are the reason the loop can act
    inside your actual environment instead of just telling you what it would do if it could.'
  edited: A loop that can only see the filesystem is a tiny loop. Connectors, built on MCP, let it read your issue
    tracker, message Slack — the difference between “here is the fix” and a loop that opens the PR and pings the
    channel once CI is green.
  reason: Condensed; removed plugin distribution, the staging-API and database examples' framing and the Linear-ticket
    step, keeping MCP, concrete tool examples and the fix-versus-PR contrast.
- id: synthesis-016
  kind: p
  status: modified
  source: 'Sub-agents, keep the maker away from the checker


    The most useful structural thing in a loop, by far, is splitting the one who writes from the one who checks.
    The model that wrote the code is way too nice grading its own homework. A second agent with different instructions
    and sometimes a different model catches the stuff the first one talked itself into.


    Codex only spawns subagents when you ask, runs them at the same time and then folds the results back into one
    answer. You define your own agents as TOML files in .codex/agents/, each with a name, a description, instructions
    and optional model and reasoning effort, so your security reviewer can be a strong model on high effort while
    your explorer is some fast read-only thing. Claude Code does the same with subagents in .claude/agents/ and
    agent teams that pass work between them. The usual split in both is one agent explores, one implements, one
    verifies against the spec.


    I made this case twice already, once as the code agent orchestra and once as adversarial code review. The reason
    it matters specifically inside a loop is the loop runs while you are not watching, so a verifier you actually
    trust is the only reason you can walk away. Subagents do burn more tokens since each one does its own model
    and tool work, so spend them where a second opinion is worth paying for. This is also basically what Claude
    Code’s /goal does under the hood, a fresh model decides if the loop is done instead of the one that did the
    work, the maker and checker split applied to the stop condition itself.'
  edited: 'Sub-agents keep the maker away from the checker: the model is way too nice grading its own homework,
    and a second agent catches what the first talked itself into. The loop runs while you are not watching, so a
    verifier you trust is the only reason you can walk away.'
  reason: Condensed; removed per-tool subagent configuration (TOML files, .claude/agents, agent teams), the prior-post
    references, the explore/implement/verify split and the token caveat (carried by the intro), keeping maker/checker
    separation and the walk-away rationale.
- id: synthesis-017
  kind: h2
  status: retained
  source: What one loop looks like
- id: synthesis-018
  kind: p
  status: modified
  source: 'Stick it together and a single thread turns into a little control panel. Here is one shape I keep using.


    An automation runs every morning on the repo. Its prompt calls a triage skill that reads yesterdays CI failures,
    the open issues, the recent commits, and writes the findings into a markdown file or a Linear board. For each
    finding that is worth doing the thread opens an isolated worktree and sends a sub-agent to draft the fix, and
    a second sub-agent reviews that draft against the project skills and the existing tests.


    Connectors let the loop open the PR and update the ticket. Anything the loop can not handle lands in the triage
    inbox for me. The state file is the spine of the whole thing, it remembers what got tried, what passed, what
    is still open, so tomorrow morning the run picks up where today stopped.


    And look at what you actually did there. You designed it one time. You did not prompt any of those steps. Thats
    Steinberger’s whole point made real, and its the same loop in Codex or in Claude Code because the pieces are
    the same pieces.'
  edited: An automation runs every morning; a triage skill reads yesterday’s CI failures, issues and commits. Each
    finding worth doing gets an isolated worktree, where one sub-agent drafts the fix and a second reviews it; anything
    the loop can’t handle lands in my triage inbox. The state file remembers what got tried and what is open, so
    tomorrow’s run picks up where today stopped. You designed it once; you prompted nothing. Steinberger’s point
    made real.
  reason: Condensed the worked example into one paragraph; removed the control-panel framing sentence, the PR/ticket
    connector step and the both-tools restatement, keeping the morning automation, worktree, drafting and reviewing
    sub-agents, triage inbox, state file and the designed-once payoff.
- id: synthesis-019
  kind: h2
  status: retained
  source: What the loop still does not do for you
- id: synthesis-020
  kind: p
  status: modified
  source: 'The loop changes the work, it does not delete you from it. And three problems actually get sharper as
    the loop gets better, not easier.


    Verification is still on you. A loop running unattended is also a loop making mistakes unattended. The whole
    reason you split the verifier sub-agent from the maker is to make the loop’s “its done” mean something, and
    even then “done” is a claim and not a proof. I keep saying the same line from code review in the age of AI,
    your job is to ship code you confirmed works.


    Your understanding still rots if you allow it. The faster the loop ships code you did not write, the bigger
    the gap between what exists and what you actually get. Thats comprehension debt and a smooth loop just makes
    it grow faster unless you read what the loop made.


    And the comfortable posture is the dangerous one. When the loop runs itself its very tempting to stop having
    an opinion and just take whatever it gives back. I called that cognitive surrender. Designing the loop is the
    cure when you do it with judgement and the accelerant when you do it to avoid thinking, same action, opposite
    result.'
  edited: 'The loop changes the work, it does not delete you from it. Verification is still on you: “done” is a
    claim and not a proof. Comprehension debt grows faster the more the loop ships code you did not write, unless
    you read what it made. And the comfortable posture is the dangerous one: cognitive surrender. Designing the
    loop with judgement is the cure; designing it to avoid thinking is the accelerant.'
  reason: Condensed the three sharper problems; removed the named prior-post references and the unattended-mistakes
    elaboration, keeping claim-not-proof verification, comprehension debt and cognitive surrender with the cure/accelerant
    contrast.
- id: synthesis-021
  kind: p
  status: modified
  source: 'Build the loop. Stay the engineer.


    I think this is a preview of how our work is going to evolve. That said, If I weren’t reviewing the code myself
    or if I relied entirely on automated loops to fix it my product’s quality would suffer. I’d likely end up stuck
    in a downward spiral, continuously digging myself into a deeper hole.


    That said, go ahead and set up your loops, but don’t forget that prompting your agents directly is also effective.
    It’s all about finding the right balance.'
  edited: I think this is a preview of how our work will evolve — but if I stopped reviewing the code myself, or
    if I relied entirely on loops, quality would suffer. Set up your loops — but prompting your agents directly
    is also effective; it’s about balance.
  reason: Condensed the closing; folded the section heading into prose, removed the downward-spiral elaboration,
    keeping the first-person forecast, the quality warning and the balance advice.
- id: synthesis-022
  kind: p
  status: modified
  source: Loops can also result in different outcomes depending on you. Two people can build the exact same loop
    and get completely opposite results. One uses it to move faster on work they understand deeply. The other uses
    it to avoid understanding the work at all. The loop doesn’t know the difference. You do.
  edited: Two people can build the exact same loop and get completely opposite results — one to move faster on work
    they understand deeply, the other to avoid understanding it at all. The loop doesn’t know the difference. You
    do.
  reason: Dropped the transitional lead-in sentence and merged the four short sentences into one for the page budget;
    wording otherwise follows the source.
- id: synthesis-023
  kind: p
  status: retained
  source: That’s what makes loop design harder than prompt engineering, not easier. Cherny’s point isn’t that the
    work got easier. It’s that the leverage point moved.
- id: synthesis-024
  kind: p
  status: retained
  source: Build the loop. But build it like someone who intends to stay the engineer, not just the person who presses
