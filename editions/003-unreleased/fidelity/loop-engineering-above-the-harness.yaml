- id: synthesis-002
  kind: p
  status: modified
  source: Loop engineering is replacing yourself as the person who prompts the agent. You design the system that
    does it instead. A loop here can be thought of a recursive goal where you define a purpose and the AI iterates
    until complete. I believe this may be the future of how we work with coding agents. However, its still early,
    I’m skeptical and you absolutely have to be careful about token costs (usage patterns can vary wildly if you
    are token rich or poor), so I want to unpack what it is and what it means.
  edited: 'Loop engineering is replacing yourself as the person who prompts the agent: you design the system that
    does it instead, a recursive goal where the AI iterates until complete. I believe this may be the future of
    how we work with coding agents — but it’s early, I’m skeptical, and token costs need watching.'
  reason: Condensed the opening definition; removed the token-rich/token-poor usage aside and the unpacking announcement,
    keeping the first-person belief and the skepticism.
- id: synthesis-003
  kind: p
  status: retained
  source: 'Peter Steinberger recently said: “You shouldn’t be prompting coding agents anymore. You should be designing
    loops that prompt your agents.” Similarly, Boris Cherny, head of Claude Code at Anthropic, said “I don’t prompt
    Claude anymore. I have loops running that prompt Claude and figuring out what to do. My job is to write loops”.'
- id: synthesis-004
  kind: p
  status: modified
  source: 'Okay, so what does any of that mean?


    For like two years the way you got something out of a coding agent was you wrote a good prompt and shared enough
    context. You type a thing, you read what came back, you type the next thing. The agent is a tool and you are
    holding it the entire time, one turn after the other. That part is kind of over, or at least some think it’s
    going to be.


    Now you build a small system that finds the work, hands it out, checks it, writes down what is done and then
    decides the next thing, and you let that system poke the agents instead of you. I wrote before about the cousin
    of this, agent harness engineering, which is making the environment one single agent runs inside and the factory
    model - the system that builds the software. Loop engineering sits one floor above the harness. The harness
    but it runs on a timer, it spawns little helpers, and it feeds itself.'
  edited: For two years you typed a prompt, read what came back, typed the next thing. That part is kind of over,
    or at least some think so. Now a small system finds the work, hands it out, checks it, records what is done,
    decides what’s next — the agent harness one floor up, feeding itself.
  reason: Merged the rhetorical question, the prompt-by-turn description and the new-system description into one
    paragraph; removed the cross-references to the earlier agent-harness and factory-model posts.
- id: synthesis-005
  kind: p
  status: modified
  source: The thing that surprised me is this is not really a tool thing anymore. A year ago if you wanted a loop
    you wrote a pile of bash and you maintained that pile forever and it was yours and only yours. Now the pieces
    just ship inside the products. Steinberger’s list maps almost exactly onto the Codex app, and then almost the
    same onto Claude Code. And once you notice the shape is the same you stop arguing about which tool, you just
    design a loop that still works no matter which one you happen to be sitting in.
  edited: This is not really a tool thing anymore. A year ago a loop was a pile of bash you maintained forever;
    now the pieces ship inside the products, the same shape in Codex and in Claude Code, so you design a loop that
    works in either.
  reason: Condensed; removed the surprise framing and the sentence mapping Steinberger's list onto each product,
    keeping the bash-pile history and the tool-agnostic conclusion.
- id: synthesis-006
  kind: h2
  status: retained
  source: The five pieces, and then notes
- id: synthesis-007
  kind: p
  status: modified
  source: 'A loop needs five things and then one place to remember stuff. Let me list it first and then map it.


    Automations that go off on a schedule and do discovery and triage by themselves.

    Worktrees so two agents working in paralell dont step on each other.

    Skills to write down the project knowledge the agent would otherwise just guess.

    Plugins and connectors to plug the agent into the tools you already use.

    Sub-agents so one of them has the idea and a different one checks it.'
  edited: 'A loop needs five things and a place to remember stuff: automations doing discovery and triage on a schedule;
    worktrees so parallel agents don’t step on each other; skills for what the agent would otherwise guess; plugins
    and connectors into your tools; and sub-agents so one has the idea and another checks it.'
  reason: Merged the announcement sentence and the five-item list into one prose sentence, trimming each item's
    phrasing for the page budget.
- id: synthesis-008
  kind: p
  status: modified
  source: Then the sixth thing, the memory. A markdown file, or a Linear board, anything that lives outside the
    single conversation and holds what’s done and what is next. Sounds too dumb to matter. But it’s the same trick
    every long running agent depends on and I went into it in long-running agents, the model forgets everything
    between runs so the memory has to be on disk and not in the context. The agent forgets, the repo doesnt.
  edited: 'The sixth is memory: a markdown file or a Linear board, anything outside the conversation that holds
    what’s done and what is next. The model forgets everything between runs, so the memory lives on disk. The agent
    forgets, the repo doesn’t.'
  reason: Condensed; removed the 'sounds too dumb to matter' aside and the reference to the long-running-agents
    post, keeping the disk-not-context point and the closing aphorism.
