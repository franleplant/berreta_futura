schema_version: 1
direction:
  name: Old Futures, Shared Work
  visual_language: >-
    Original 1960s–1970s children's science-fiction manga language: chunky
    expressive black ink, economical rounded characters, lively gadget comedy,
    halftone and screentone texture, generous unprinted paper, and slightly
    imperfect offset registration. Broad period cues only; no imitation of a
    specific franchise, artist, or character.
  palette: >-
    Varied vintage spot colors over warm aged paper: faded sky blue, dusty
    teal, moss and jade green, mustard yellow, brick red, coral, lavender,
    warm brown, and occasional violet or orange. Deep black ink remains
    structurally dominant. Restrained flat fills, not modern gradients.
  constraints:
  - Entirely wordless editorial storytelling
  - Strong silhouettes and one legible visual proposition per image
  - Print-friendly contrast with black ink carrying the structure
  - Slightly imperfect spot-color registration and restrained screentone
  - Original characters and machines with no franchise likeness
  avoid:
  - Direct imitation of Doraemon or any specific franchise or artist
  - Recognizable copyrighted characters, including a blue robotic cat
  - Modern glossy anime rendering, neon cyberpunk, or photorealism
  - Dense backgrounds and delicate low-contrast linework
  - Decorative pseudo-writing or interface glyphs that resemble text
assets:
- id: tail-software-factories
  role: article_tail
  article_id: why-software-factories-fail
  art_path: editions/003-unreleased/art/article-tails/software-factories-manga-v1.png
  subject: >-
    A cheerful human engineer pulls a large physical light switch in a dim
    automated workshop. The lamps reveal an overconfident machine assembly
    line that has tangled its own robot parts, while a smaller repaired machine
    waits calmly beside the engineer.
  composition: >-
    Wide comic vignette with the switch and engineer on the left, the comic
    machine tangle across the center, and open paper at the right. Lamps,
    faces, and the central knot must survive a very shallow horizontal crop.
  alt_text: >-
    An engineer turns on workshop lights, revealing a tangled automated
    assembly line and a small repaired machine.
  credit: Illustration by the editors with Codex image generation.
- id: tail-harness-engineering
  role: article_tail
  article_id: why-harness-engineering-is-so-hard
  art_path: editions/003-unreleased/art/article-tails/harness-engineering-manga-v1.png
  subject: >-
    A patient mechanic operates a quirky thinking-machine test harness. One
    input enters a glass-domed machine and three visibly different physical
    results emerge: a neat little rocket, a charming but impractical mushroom
    garden, and a comically tangled spring.
  composition: >-
    Wide centered apparatus with the mechanic on the left and three branching
    result windows across the central band. Keep faces, machine core, and all
    three outcomes inside the central horizontal third.
  alt_text: >-
    A mechanic tests a thinking machine that produces three very different
    physical outcomes from the same input.
  credit: Illustration by the editors with Codex image generation.
- id: tail-loop-engineering
  role: article_tail
  article_id: loop-engineering-above-the-harness
  art_path: editions/003-unreleased/art/article-tails/loop-engineering-manga-v1.png
  subject: >-
    A human designer and a small helpful robot improve a tabletop invention
    through a visible circular workflow of notes, tools, checks, and returned
    parts. Each circuit brings back a slightly better flying gadget.
  composition: >-
    Wide, playful loop running horizontally around the two collaborators and
    their workbench. The people, robot, invention, and circular motion remain
    legible in the central horizontal third.
  alt_text: >-
    A designer and small robot repeatedly improve a flying gadget through a
    loop of notes, tools, checks, and returned parts.
  credit: Illustration by the editors with Codex image generation.
- id: tail-context-engineering
  role: article_tail
  article_id: new-rules-of-context-engineering
  art_path: editions/003-unreleased/art/article-tails/context-engineering-manga-v1.png
  subject: >-
    A thoughtful engineer packs a transparent context suitcase for a small
    robot. Useful tools, memory cards, maps, and reference objects go in;
    duplicate clutter and contradictory arrows are calmly pruned into a bin.
  composition: >-
    Wide suitcase and robot centered, engineer at left, selected objects
    flowing in from above and clutter exiting to the right. The decisive
    packing action must survive a shallow crop.
  alt_text: >-
    An engineer carefully packs useful tools and references into a robot's
    context suitcase while removing duplicates and contradictions.
  credit: Illustration by the editors with Codex image generation.
- id: tail-open-weights
  role: article_tail
  article_id: open-weights-and-american-ai-leadership
  art_path: editions/003-unreleased/art/article-tails/open-weights-manga-v1.png
  subject: >-
    A diverse neighborhood of small workshops opens a once-locked cabinet of
    shared machine parts. People and friendly original robots pass gears,
    model pieces, and tools from hand to hand so many different inventions can
    be built.
  composition: >-
    Wide cabinet opening at center with a chain of hands and workshops
    extending left and right. Keep the open lock, shared parts, and exchange
    gesture inside the central horizontal third.
  alt_text: >-
    A community opens a cabinet of shared machine parts and passes them among
    many small workshops.
  credit: Illustration by the editors with Codex image generation.
- id: tail-buzz-multiplayer
  role: article_tail
  article_id: buzz-multiplayer-agent-layer
  art_path: editions/003-unreleased/art/article-tails/buzz-multiplayer-manga-v1.png
  subject: >-
    Several people and small original robots build one miniature city together
    around a communal project table. They share tools, plans, memory drawers,
    and tiny payments directly, while unused isolated chat bubbles sit empty
    outside the room.
  composition: >-
    Wide ensemble around one central table, with clear handoffs between people
    and robots. Keep the shared city, faces, and exchange gestures inside the
    central horizontal third.
  alt_text: >-
    People and small robots collaborate around one communal table, sharing
    tools, plans, memory, and payments while building a miniature city.
  credit: Illustration by the editors with Codex image generation.
- id: closing-room-kept
  role: closing_plate
  plate_index: 1
  art_path: editions/003-unreleased/art/coda-manga-01.png
  subject: >-
    A quiet shared workshop after the day's work: humans and small original
    robots carefully put tools, notes, and unfinished inventions into labeled
    shapes and drawers without any actual writing. One warm lamp remains on
    over the communal table.
  composition: >-
    Portrait scene with the strongest action and faces in the upper two thirds.
    The room feels inhabited and protected, not abandoned. It must work as the
    edition's only closing illustration when later plates do not print.
  alt_text: >-
    Humans and small robots carefully put away a shared workshop while one
    warm lamp remains on over the communal table.
  credit: Illustration by the editors with Codex image generation.
- id: closing-trust-transferred
  role: closing_plate
  plate_index: 2
  art_path: editions/003-unreleased/art/coda-manga-02.png
  subject: >-
    At the threshold between two adjoining workshops, a human passes a glowing
    but mechanical control key to a small original robot while another person
    holds the safety tether. Both sides remain attentive and responsible.
  composition: >-
    Portrait scene built around the handoff at center, with both rooms visible
    and open paper around the gesture. It continues the coda but also reads as
    a complete independent image.
  alt_text: >-
    A human passes a mechanical control key to a small robot while another
    person keeps hold of a safety tether.
  credit: Illustration by the editors with Codex image generation.
- id: closing-lease-signed
  role: closing_plate
  plate_index: 3
  art_path: editions/003-unreleased/art/coda-manga-03.png
  subject: >-
    Humans and small original robots stand together outside a whimsical
    many-roomed workshop they have built. Instead of signing words, each places
    a distinct tool-shaped seal onto a shared blank plaque as the doors open.
  composition: >-
    Portrait finale with the building rising behind the group and the shared
    sealing gesture centered. Celebratory but restrained, with generous warm
    paper and a clear visual conclusion.
  alt_text: >-
    Humans and small robots place tool-shaped seals on a shared plaque outside
    the many-roomed workshop they built together.
  credit: Illustration by the editors with Codex image generation.
