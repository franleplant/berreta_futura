  figures:
  - id: lights-on-factory
    decision: include
    source_id: why-software-factories-fail-turning-the-lights-b-1312d1ad
    asset_id: raster-002-da05c493
    caption: The lights-on factory restores human judgment before and during implementation — product
      intent, architecture, program design, vertical slices, and code review remain part of the loop.
    alt_text: A flow diagram titled Optimizing the Lights-On Factory shows requests entering a queue,
      an agent building against product and technical specifications, automated checks and human review,
      deployment to production, and user feedback returning to the queue.
    anchor: Turning the lights back on
    layout: compact_band
    criteria:
    - important
    - useful
    rationale: This is the combined article's visual hinge, replacing the incomplete loop-hype collage
      with Dex Horthy's complete operating model for restoring human judgment.
  - id: slopcodebench-strict-pass
    decision: include
    source_id: why-software-factories-fail-benchmarking-the-new-f1d9c04a
    asset_id: raster-002-c6471a04
    caption: On Dex Horthy's exploratory 17-checkpoint subset, Opus 5 passes four checkpoints; Opus
      4.8 and Sonnet 5 pass one each. The paper's full-benchmark results appear below for context.
    alt_text: Horizontal bars compare strict checkpoint pass rates. Opus 5 passes four of seventeen
      checkpoints, while Opus 4.8 and Sonnet 5 each pass one.
    anchor: The oracle arrives in checkpoints
    layout: compact_band
    criteria:
    - important
    - useful
    rationale: This is direct, source-authored evidence for the article's maintainability thesis and
      replaces the weaker correlational Faros chart.
