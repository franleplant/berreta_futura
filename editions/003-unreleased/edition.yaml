  - id: silent-failure-modes
    decision: include
    source_id: why-harness-engineering-is-so-hard-fe732038
    asset_id: raster-002-84bc510b
    caption: Traditional code crashes at the point of failure; model output returns a document that looks
      finished with the broken lines woven through it.
    alt_text: Two panels contrast traditional code ending in a crash with model output producing a full
      document marked as broken.
    anchor: You're debugging prose, not code
    layout: compact_band
    criteria:
    - important
    - useful
    rationale: The side-by-side makes the silent, graded failure mode visible exactly where the article
      observes that nothing crashes and everything ships.
