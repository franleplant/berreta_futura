      and Sonnet 5 pass one each. The paper's full-benchmark results appear below for context.
    alt_text: Horizontal bars compare strict checkpoint pass rates. Opus 5 passes four of seventeen checkpoints,
      while Opus 4.8 and Sonnet 5 each pass one.
    anchor: The oracle arrives in checkpoints
