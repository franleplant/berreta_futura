- id: new-rules-of-context-engineering
  title: Las nuevas reglas de la ingeniería de contexto
  short_title: Ingeniería de contexto
  display_emphasis: Contexto
  author_note: Thariq escribe desde el equipo de Claude Code sobre cómo simplificar el contexto para los modelos
    más recientes de Claude.
  manuscript: articles/new-rules-of-context-engineering.md
  source_sha256: 86fd2becc7d575d1f991f18b8b4432bef96b9c7654f758f5f87d8c2a3987eecb
  figures:
  - id: assembled-context-conflicts
    caption: 'Un contexto ensamblado, tres amos: el prompt de sistema permite documentación, una skill prohíbe
      comentarios, la petición quiere que funcione como el antiguo, y Claude los reconcilia a todos.'
    credit: 'Diagrama de Thariq; fuente: The New Rules of Context Engineering for Claude 5 Models.'
    alt_text: Un diagrama del contexto ensamblado destaca instrucciones contradictorias en las secciones de prompt
      de sistema, skills y petición del usuario.
    anchor: Quitarle las trabas a Claude
    source_caption_sha256: fd2886811c9600c32135024e93e0acc76ebda705a137e26750258c5af1806e63
    source_credit_sha256: 08d67b1f950bd7fd1e109a415f596bfe810f34da2a924b6223fe5c4320c04dfd
