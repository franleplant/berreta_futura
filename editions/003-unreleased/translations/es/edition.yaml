title: El nombre en el contrato de alquiler
subtitle: Fábricas, arneses, ciclos y contexto, y quién es dueño del piso donde trabajan los agentes
cover:
  headline: El nombre en el contrato de alquiler
  deck: Seis despachos sobre la pila de agentes —modelo, arnés, ciclo, contexto— y quién firma el alquiler
    de cada piso
  back_text: 'El prompt se vacía y los alrededores se llenan. Cada regla que borras es confianza transferida
    a un sistema: pregunta dónde aterriza y a nombre de quién está el contrato de alquiler.'
