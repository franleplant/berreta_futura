  title: 'Ingeniería de ciclos: el piso sobre el arnés'
  short_title: Ingeniería de ciclos
  display_emphasis: Ciclos
  author_note: Addy Osmani traza el paso de escribir los prompts a mano a diseñar los ciclos que se los dan a
    los agentes.
