articles:
- id: why-software-factories-fail
  title: Por qué fracasan las fábricas de software
  short_title: Fábricas de software
  display_emphasis: Fábricas
  author_note: Dex Horthy operó una fábrica de software a oscuras y cuenta por qué la mantenibilidad del código
    la derrotó.
  manuscript: articles/why-software-factories-fail.md
  source_sha256: 9efc23ded70a9d2560b8308973951671f14e4476b2920fc5b4522f8a61b5d385
  figures:
  - id: loops-prevailing-wisdom
    caption: 'La sabiduría dominante en su forma primaria, incrustada por el autor: el recordatorio de Peter Steinberger
      de dejar de escribir prompts a los agentes de programación y diseñar, en su lugar, los ciclos que se los
      escriben.'
    credit: 'Diagrama de Dex Horthy; fuente: Why Software Factories Fail.'
    alt_text: Una captura de una publicación de Peter Steinberger que pide a los lectores dejar de escribir prompts
      a los agentes y diseñar los ciclos que se los escriben, junto a una tarjeta de título de Loop Engineering
      y un fotograma de un orador.
    anchor: Breve historia de la fábrica de software
    source_caption_sha256: 4b031e9c1a2c569cf337e655e1b05519309d7825aacafa6f6fe2e5ca3f5d277f
    source_credit_sha256: 9f8736721be4e57aef9bb93dc6fe619c4537a5c4c80eee43175569292692c2ae
  - id: quality-decline-report
    caption: 'Del informe de Faros AI que cita el artículo: los incidentes por solicitud de cambios suben un
      242,7 por ciento, los errores por desarrollador un 54 por ciento, los incidentes mensuales un 57,9 por
      ciento y los errores por solicitud de cambios un 28,7 por ciento desde que los equipos adoptaron herramientas
      de programación con IA.'
    credit: 'Diagrama de Dex Horthy; fuente: Why Software Factories Fail.'
    alt_text: Un gráfico titulado la calidad de producción está bajando muestra barras rojas de incidentes por
      solicitud de cambios, incidentes mensuales, errores por desarrollador y errores por solicitud de cambios,
      todos en aumento tras una alta adopción de la IA.
    anchor: La fábrica de software a oscuras
    source_caption_sha256: cbb3c29bc5c6ca56874fd40976f4dc7c8e8167eb0dbc4480214fb33932f5f473
    source_credit_sha256: 53f3b7306270776b43241f5d15da85619adbfa112ee8956cc22df02cedf8d15c
- id: why-harness-engineering-is-so-hard
  title: Por qué la ingeniería de arneses es tan difícil
  short_title: Ingeniería de arneses
  display_emphasis: Arneses
  author_note: Winter pasó cinco meses construyendo un arnés de LLM en producción y cuenta por qué resiste las
    pruebas y la depuración corrientes.
  manuscript: articles/why-harness-engineering-is-so-hard.md
  source_sha256: ec7c7316090751d92ef12826b54e06441b79ea62cde238ef2b6ca8cd01a239d2
  figures:
  - id: nondeterminism-testing
    caption: La misma entrada se abre en abanico hacia salidas correctas, casi correctas y erróneas; la aserción
      de igualdad tachada es la prueba que no puedes escribir.
    credit: 'Diagrama de Winter; fuente: Why Harness Engineering Is So Hard.'
    alt_text: Un diagrama titulado el no determinismo rompe las pruebas muestra una entrada que produce salidas
      correctas, casi correctas y erróneas, con una aserción de igualdad tachada debajo.
    anchor: No puedes escribir la prueba que quieres escribir
    source_caption_sha256: 49e14c6434b108ec55c55caa920d9a473abe62ee7635155d3ee2fd8d65b7f9e9
    source_credit_sha256: 0f387eb4b923ca5c63a9af20c376daf197fd2f7b0c23d5e8e001e8e832513abc
  - id: silent-failure-modes
    caption: El código tradicional se estrella en el punto del fallo; la salida del modelo devuelve un documento
      que parece terminado con las líneas rotas entretejidas.
    credit: 'Diagrama de Winter; fuente: Why Harness Engineering Is So Hard.'
    alt_text: Dos paneles contrastan código tradicional que termina en un fallo estrepitoso con salida de modelo
      que produce un documento completo marcado como roto.
    anchor: Depuras prosa, no código
    source_caption_sha256: 46503035d9756e08f9766ec6f860d8e5dc736143aa08db2be26d37880f28de1c
    source_credit_sha256: 174d4ade68ebcb253a7afce2158d712eab57678933f539dca02eb336f558c7df
