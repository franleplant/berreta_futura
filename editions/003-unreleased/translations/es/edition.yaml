articles:
- id: why-software-factories-fail
  title: 'Por qué fracasan las fábricas de software: el arnés, la luz y el oráculo'
  short_title: Fábricas de software
  display_emphasis: Fábricas
  author_note: Dex Horthy es fundador de HumanLayer, una empresa de herramientas para desarrolladores respaldada
    por YC.
  manuscript: articles/why-software-factories-fail.md
  figures:
  - id: lights-on-factory
    caption: La fábrica con las luces encendidas devuelve el juicio humano a las etapas anteriores y simultáneas
      a la implementación; la intención de producto, la arquitectura, el diseño del programa, los cortes verticales
      y la revisión de código siguen dentro del ciclo.
    credit: 'Diagrama de Dex Horthy; fuente: Why Software Factories Fail: Turning the lights back on.'
    alt_text: Un diagrama de flujo titulado Optimizing the Lights-On Factory muestra solicitudes que entran en
      una cola, un agente que construye a partir de especificaciones de producto y técnicas, comprobaciones automáticas
      y revisión humana, despliegue a producción y respuesta de usuarios que vuelve a la cola.
    anchor: Volver a encender la luz
  - id: slopcodebench-strict-pass
    caption: En el subconjunto exploratorio de 17 puntos de control de Dex Horthy, Opus 5 supera cuatro; Opus
      4.8 y Sonnet 5 superan uno cada uno. Debajo aparecen como contexto los resultados del benchmark completo
      publicados en el paper.
    credit: 'Diagrama de Dex Horthy; fuente: Why Software Factories Fail: Benchmarking the New Frontier.'
    alt_text: Barras horizontales comparan tasas de aprobado estricto por punto de control. Opus 5 supera cuatro
      de diecisiete; Opus 4.8 y Sonnet 5 superan uno cada uno.
    anchor: El oráculo llega por puntos de control
- id: why-harness-engineering-is-so-hard
  title: Por qué la ingeniería de arneses es tan difícil
  short_title: Ingeniería de arneses
  display_emphasis: Arneses
  author_note: Winter pasó cinco meses y 104 commits construyendo un arnés de LLM en producción.
  manuscript: articles/why-harness-engineering-is-so-hard.md
  figures:
  - id: nondeterminism-testing
    caption: La misma entrada se abre en abanico hacia salidas correctas, casi correctas y erróneas; la aserción
      de igualdad tachada es la prueba que no puedes escribir.
    credit: 'Diagrama de Winter; fuente: Why Harness Engineering Is So Hard.'
    alt_text: Un diagrama titulado el no determinismo rompe las pruebas muestra una entrada que produce salidas
      correctas, casi correctas y erróneas, con una aserción de igualdad tachada debajo.
    anchor: No puedes escribir la prueba que quieres escribir
  - id: silent-failure-modes
    caption: El código tradicional se estrella en el punto del fallo; la salida del modelo devuelve un documento
      que parece terminado con las líneas rotas entretejidas.
    credit: 'Diagrama de Winter; fuente: Why Harness Engineering Is So Hard.'
    alt_text: Dos paneles contrastan código tradicional que termina en un fallo estrepitoso con salida de modelo
      que produce un documento completo marcado como roto.
    anchor: Depuras prosa, no código
- id: loop-engineering-above-the-harness
  title: 'Ingeniería de ciclos: el piso sobre el arnés'
  short_title: Ingeniería de ciclos
  display_emphasis: Ciclos
  author_note: Addy Osmani pasó 14 años liderando equipos de ingeniería de Chrome, Gemini y Google Cloud AI.
  manuscript: articles/loop-engineering-above-the-harness.md
- id: new-rules-of-context-engineering
  title: Las nuevas reglas de la ingeniería de contexto
  short_title: Ingeniería de contexto
  display_emphasis: Contexto
  author_note: Thariq Shihipar forma parte del personal técnico de Anthropic y trabaja en Claude Code.
  manuscript: articles/new-rules-of-context-engineering.md
  figures:
  - id: assembled-context-conflicts
    caption: 'Un contexto ensamblado, tres amos: el prompt de sistema permite documentación, una skill prohíbe
      comentarios, la petición quiere que funcione como el antiguo, y Claude los reconcilia a todos.'
    credit: 'Diagrama de Thariq; fuente: The New Rules of Context Engineering for Claude 5 Models.'
    alt_text: Un diagrama del contexto ensamblado destaca instrucciones contradictorias en las secciones de prompt
      de sistema, skills y petición del usuario.
    anchor: Quitarle las trabas a Claude
