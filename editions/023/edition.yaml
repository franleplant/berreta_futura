# rejected title: Fine Print on the Box
# rejected back_text: Riddle: what gets smarter every spring, cheaper every summer, and never once mentions the door it couldn't open?
# Edition 23 spec, scaffolded by `mag produce` from plan.yaml.
# Title and cover copy are drafted by produce for the editor to revise; TODO marks figure and art picks.
# Art paths are filled by picking in art/showcase.html after `mag art 023`.
# Article order here is the reading order; reorder freely.
id: '023'
issue_number: 23
# why this title: Pictures the work that runs while nobody is awake (factories merging around the clock, bots closing the books overnight, agents sleeping until a heartbeat wakes them, swarms told "I am stepping away for 8hrs"), and holds every piece that asks how you trust it in the morning: Raft proofs, simulated clocks, evals, faster lint and CI, compressors that learn as they run, and models whose reasoning gets harder to read.
# other title directions:
#   - Lights-Out Factory (a plant that runs with the lights off; fits the factories, the accounting bots, the swarms, and the CI and verification that must hold up with nobody watching)
#   - Leave a Note for the Morning (the handoff record: Board threads, paused Tasks with questions, nightly-reread manuals, tick-stamped logs and traces the next worker or reviewer reads)
#   - Who Reads the Logs? (a question over traces, chains of thought, audit trails, trace validation and eval transcripts, the evidence every piece leans on)
#   - One Megabyte Lighter (a number for the issue's diet: compressed Wikipedia, deleted tests and comments, deferred tool schemas, pruned experts, a CI bill cut to a twentieth)
title: The Night Shift
subtitle: A frontier model's safety report, proofs for two Raft libraries, a looped laptop model, Wikipedia squeezed by a learning compressor, accounting bots, an agent message board, two software factories, simulation testing, evals for agents, and a CI bill cut 95%.
publication_date: '2026-11-18'
status: draft
format:
  article_opener: illustrated_paper_spots_v1
  typesetting: book
art_direction_path: art-directions/story-led-boy-and-robot.yaml
