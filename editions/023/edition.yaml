    path: media/001.jpg
    caption: 'An agent as an actor: messages land in one mailbox, run one at a time, commit to the agent''s own database, and can message other actors or set a timer to wake it later.'
    alt_text: 'Diagram: messages enter the agent''s mailbox, where a duplicate hello is dropped; a run commits to storage, sends to other actors, and sleeps until a timer.'
    anchor: 'Why agents look like actors'
    layout: compact_band
  - id: figure-2
    source_id: pi-durable-actors-one-agent-one-owner-any-worker-57ec0d05
    path: media/002.jpg
    caption: 'The client asks the Rivet engine for an agent by key; the engine routes it to the worker node that hosts it, one actor per agent.'
    alt_text: 'Diagram: a client sends to the Rivet engine, which routes agents b, d, f to worker n1 and a, c, e to worker n2.'
    anchor: 'A cluster on my laptop'
    layout: compact_band
  - id: figure-3
    source_id: pi-durable-actors-one-agent-one-owner-any-worker-57ec0d05
    path: media/003.jpg
    caption: 'Killing n2 mid-run: the engine''s heartbeat restarts agent a on n1, the harness reruns the safe tool, and the tool picks up at tick 12.'
    alt_text: 'Diagram: worker n2 is killed after agent a''s tick 11; the Rivet engine restarts a on worker n1, which continues from tick 12 to 40.'
    anchor: 'Killing a node'
    layout: compact_band
