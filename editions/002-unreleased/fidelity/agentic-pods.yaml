- id: synthesis-001
  kind: p
  status: modified
  source: 'Today, 99% of our engineers use AI tools. More than 70% of pull requests are attributed to local or cloud
    agents. And our engineers have built 2,500+ agent skills across the software development lifecycle. Those numbers
    are exciting, but they led us to a much bigger question:


    How do we bring agentic AI beyond engineering?


    Praveen Neppalli@praveenTweetsMostrar traducciónAgentic AI adoption is on fire at @Uber, and it''s changing
    the way we build, not just in engineering, but across the entire company.'
  edited: 'Agentic AI adoption at Uber has changed how we build. Ninety-nine percent of our engineers use AI tools,
    more than 70 percent of pull requests are attributed to local or cloud agents, and engineers have built more
    than 2,500 agent skills across the development lifecycle. Those numbers raised a larger question: how do we
    bring agentic AI beyond engineering?'
- id: synthesis-002
  kind: h2
  status: modified
  source: We handpicked ~30 of our most AI-proficient engineers (people with deep knowledge of Uber's systems) and
    paired each of them with a domain expert from a business function.
  edited: Pair system knowledge with domain knowledge
- id: synthesis-003
  kind: p
  status: modified
  source: 'Finance. Legal. Operations. Marketing. Customer Support. HR. Procurement.


    We handpicked ~30 of our most AI-proficient engineers (people with deep knowledge of Uber''s systems) and paired
    each of them with a domain expert from a business function.


    These functions run on complex workflows that are often manual, highly nuanced, and spread across dozens of
    systems. You can''t automate them effectively by looking at process diagrams or documentation. You have to understand
    how the work actually gets done.'
  edited: Finance, legal, operations, marketing, support, HR, and procurement depend on nuanced workflows spread
    across many systems. Process diagrams do not show how that work actually happens. We created Agentic Pods by
    pairing about thirty AI-proficient engineers, each with deep knowledge of Uber's systems, with domain experts
    from business functions.
- id: synthesis-004
  kind: p
  status: modified
  source: 'Then we gave every pod just two weeks. • Days 1 – 2: Shadow the expert. Observe every step. Document
    workflows. Ask questions. Build intuition. • Day 3: Prioritize opportunities based on scale, repetition, business
    impact, and data availability. • Days 4 – 5: Build a working agent alongside the person doing the job. • Days
    6 – 9: Validate with several others performing the same work. Does it generalize? Does it actually make their
    job better? • Day 10: Ship.'
  edited: Each pod gets two weeks. On days one and two, the engineer shadows the expert, documents every step, asks
    questions, and builds intuition. Day three prioritizes opportunities by scale, repetition, business impact,
    and data availability. Days four and five produce a working agent beside the person doing the job. Days six
    through nine test whether it generalizes with other practitioners. Day ten ships.
- id: synthesis-005
  kind: h2
  status: modified
  source: The productivity gains are impressive, but what surprised us most wasn't the speed. • It was how quickly
    engineers embedded in unfamiliar domains uncovered opportunities that had been hiding in plain sight. • The
    biggest wins rarely come from automating one task. They come from rethinking an entire workflow. Once you redesign
    the workflow around AI, you often eliminate handoffs, remove unnecessary approvals, replace legacy tooling,
    reduce vendor spend, and dramatically accelerate decision-making. • The workflow becomes the unit of automation
    - not the individual task. • The most impactful agent skills cut across teams, orgs, functions, tools, and systems.
  edited: The workflow is the unit
- id: synthesis-006
  kind: p
  status: modified
  source: 'In just the past two months, we''ve run 16 Agentic Pods across 16 different business functions. • Capital
    allocation across 150 cities: 15 hours → 30 minutes. • Financial pacing reports: 2 days → 10 minutes. • Marketing
    web quality assurance: 2 weeks → 50 minutes. • Support workflow creation: 9,000 manual workflows → self-service
    automation.


    So we created something called Agentic Pods.'
  edited: In two months, sixteen pods worked across sixteen business functions. Capital allocation across 150 cities
    fell from fifteen hours to thirty minutes. Financial pacing reports went from two days to ten minutes. Marketing
    web quality assurance went from two weeks to fifty minutes. Support moved from nine thousand manually created
    workflows toward self-service automation.
