- id: synthesis-001
  kind: p
  status: modified
  source: 'The new swarm did better in every model configuration. Using Grok 4.5, it reached 80% in four hours,
    while the old swarm spiraled and had to be paused before its second hour.


    To test that progress, we returned to a task the old swarm had struggled with: building SQLite from scratch,
    in Rust, from nothing but its documentation.


    Earlier this year, we ran experiments to test the limits of scaling agents to cooperate toward a goal. Our hypothesis
    was that this would unlock a new tier of task scale and complexity. The flagship project was a long-running
    swarm building a web browser from scratch. It succeeded as a Sign in Download proof of concept, but fell far
    short of polished software.'
  edited: 'Earlier this year, a long-running swarm built a web browser from scratch: a useful proof of concept,
    but far from polished software. After that deliberately empirical hill-climb, we wanted to engineer the system
    with intent. We returned to a task the old swarm had struggled with—implementing SQLite in Rust from its documentation
    alone—and the new harness beat it with every model mix. Grok 4.5 reached 80 percent in four hours while the
    old run spiraled before hour two. More agents were not the decisive variable; topology, memory, coordination,
    and the planning-execution split changed quality and cost.'
