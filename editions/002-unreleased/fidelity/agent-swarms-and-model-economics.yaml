- id: synthesis-019
  kind: p
  status: modified
  source: Few moments in a large task genuinely require frontier intelligence, such as the original decomposition,
    the design decisions, and certain trade-offs. Once a frontier planner has collapsed the ambiguity into a detailed,
    explicit instruction, less expensive models simply have to follow it. This is a huge potential source of cost
    savings. In the run that used GPT-5.5 for both planners and workers, the workers alone cost $9,373. In the run
    where Opus 4.8 did the planning and Composer 2.5 did the work, the entire worker fleet cost $411.
  edited: 'Similar quality concealed enormous cost differences: $1,339 for the Opus-and-Composer hybrid versus $10,565
    for GPT-5.5 alone. Workers carried at least 69 percent of tokens in every run and more than 90 percent in most.
    Planner tokens cost more, but there are only a few moments when frontier intelligence is indispensable—the initial
    decomposition, major design decisions, and difficult trade-offs. Once ambiguity has been collapsed into explicit
    instructions, inexpensive models can perform most of the execution.'
- id: synthesis-020
  kind: p
  status: modified
  source: 'One detail worth noting comes from comparing the two hybrid runs. The Fable 5 planner ran up a slightly
    smaller bill than the Opus 4.8 planner, despite roughly twice the per-token price, because it used far fewer
    planning tokens. But the Fable run''s workers went through several times as many tokens, and the run as a whole
    came out substantially more expensive.


    Few moments in a large task genuinely require frontier intelligence, such as the original decomposition, the
    design decisions, and certain trade-offs. Once a frontier planner has collapsed the ambiguity into a detailed,
    explicit instruction, less expensive models simply have to follow it. This is a huge potential source of cost
    savings. In the run that used GPT-5.5 for both planners and workers, the workers alone cost $9,373. In the run
    where Opus 4.8 did the planning and Composer 2.5 did the work, the entire worker fleet cost $411.'
  edited: In the all-GPT-5.5 run, workers alone cost $9,373. In the Opus-planner, Composer-worker run, the whole
    worker fleet cost $411. Yet cheap planning is not automatically cheap overall. Fable used fewer planning tokens
    than Opus despite its higher per-token price, but its workers consumed several times as many tokens, making
    the complete run substantially more expensive. Models have to be selected by role and by their effect on downstream
    work, not by one headline token price.
