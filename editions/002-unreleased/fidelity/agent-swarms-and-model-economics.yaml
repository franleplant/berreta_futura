- id: synthesis-001
  kind: p
  status: modified
  source: 'The new harness outperformed the old in every mix.


    The old Grok 4.5 run was paused before its two-hour mark (more below). Every new configuration went on to pass
    100% of the suite.


    Table of Contents ↑ Trees and leaves The SQLite experiment What the tree does for memory Results across model
    mixes A version control system for agents A deep dive into the runs Failure modes at 1,000 commits per second
    Model economics Review lenses Specs as prompts Letting agents shape the environment'
  edited: We have been experimenting with how far coding-agent swarms can scale. A new harness, built from the SQLite
    documentation, outperformed our earlier approach in every model configuration. The striking result was not simply
    that more agents helped. It was that topology, memory, version control, and the division between planning and
    execution changed both quality and cost.
