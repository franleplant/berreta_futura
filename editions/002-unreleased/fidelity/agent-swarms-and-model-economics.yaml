- id: synthesis-003
  kind: p
  status: modified
  source: 'In a swarm, a planner never implements, so its context never fills with low-level detail, and a worker
    never plans, so it can spend all its context on one narrow piece of work. Sign in Download


    We suspect the ability to scale the agent swarm comes from this context efficiency, more than from parallelism
    itself. That efficiency is present in the swarm at every scale, which is why this decomposition helps agent
    performance even on moderately sized tasks.'
  edited: 'Our swarm forms a tree. A capable planner splits work and delegates it; cheaper workers execute focused
    tasks. The planner never implements and the worker never plans. This separation is valuable less for parallel
    speed than for context efficiency: each agent sees the memory required for its role instead of carrying the
    entire project until it drifts.'
- id: synthesis-004
  kind: p
  status: modified
  source: 'The browser swarm from earlier this year peaked at roughly 1,000 commits per hour on Git. The new system
    peaks at around 1,000 commits per second.


    Table of Contents ↑ Trees and leaves The SQLite experiment What the tree does for memory Results across model
    mixes A version control system for agents A deep dive into the runs Failure modes at 1,000 commits per second
    Model economics Review lenses Specs as prompts Letting agents shape the environment'
  edited: Coordination required infrastructure. The old browser experiment produced around a thousand commits an
    hour; the SQLite experiment could approach a thousand a second, so we built a custom version-control layer.
    Shared design documents, compile references, neutral reconcilers, megafile limits, and controlled breakage reduced
    split-brain designs and merge thrash. Multiple decorrelated review lenses were cheap and delivered unusually
    high returns.
