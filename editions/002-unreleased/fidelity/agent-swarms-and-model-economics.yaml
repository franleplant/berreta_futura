  edited: A swarm therefore resembles a compiler. Planners parse a goal into task trees and lower it step by step
    into executable work. The difference is that a compiler preserves meaning deterministically while a swarm is
    probabilistic at every stage. The task tree, shared memory, coordination machinery, review lenses, and verification
    environment all exist to close that semantic gap.
