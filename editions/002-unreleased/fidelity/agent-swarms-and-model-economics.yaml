- id: synthesis-003
  kind: p
  status: modified
  source: 'Planner agents, powered by the smartest models, split a goal into pieces and delegate them. Worker agents,
    generally powered by faster and less expensive models, execute those pieces.


    The design is a superset of more rigid orchestration systems. Rather than imposing a fixed topology on the problem,
    the swarm’s shape grows to cover the problem’s contours, and compute and context scale in proportion to the
    task’s complexity.


    We also varied which models did which jobs. In some runs, one model handled everything while in others, a frontier
    model planned while a fast, inexpensive model carried out the work. Every mix produced similar quality, but
    the costs varied enormously.1 Trees and leaves Sign in Download Descriptions of large tasks naturally take the
    shape of trees, with a goal at the root that subdivides recursively into basic units of work. Our swarm has
    two roles, both organized around that same tree-like decomposition:'
  edited: 'Large tasks naturally form trees: a goal at the root divides recursively until the leaves are concrete
    units of work. Our swarm uses two roles around that structure. Planner agents, powered by the strongest models,
    decompose goals and delegate them. Worker agents, generally faster and cheaper, execute the leaves. Rather than
    impose a fixed orchestration graph, the swarm grows to match the contours of the problem, so compute and context
    scale with complexity.'
- id: synthesis-004
  kind: p
  status: modified
  source: 'In a swarm, a planner never implements, so its context never fills with low-level detail, and a worker
    never plans, so it can spend all its context on one narrow piece of work. Sign in Download


    What the tree does for memory When a single agent takes on a complete task, it has to walk the entire tree itself,
    descending to each leaf while holding its ancestors, its current position, and the wider goal in context the
    whole time.


    There are echoes of this structure elsewhere. The economist Ronald Coase, asking why firms exist at all, argued
    that coordination costs grow faster than the work itself, so organizations settle into tiers of bounded units
    rather than letting everyone talk to everyone.'
  edited: This design has generalized to math problems, GPU kernels, vulnerability fixes, test coverage, and synthetic
    data. We think its scaling advantage comes more from context efficiency than parallelism. A single agent must
    traverse the whole tree while remembering its position and wider goal; it either focuses locally and loses the
    whole, or preserves the whole and weakens its local work. A planner never implements, so detail does not consume
    its context; a worker never plans and can focus on one leaf. Like the bounded tiers in Ronald Coase's account
    of firms, the tree contains coordination costs that otherwise grow faster than the work.
- id: synthesis-005
  kind: h2
  status: modified
  source: To facilitate this rate of activity, we built a new version control system (VCS) from scratch. Throughput
    was not the only reason to own this layer. Every change in the system passes through the VCS, so it is where
    collisions first become visible, and several of the coordination mechanisms in the next section are implemented
    directly inside of it. Failure modes at 1,000 commits per second Sign in Download Human engineering teams have
    standard coordination mechanisms like code review, ownership, standups, and merge queues. Those systems work
    at human tempo, but at the commit-rate of the swarm, we see failure modes that human teams don’t routinely encounter.
  edited: Failure modes at swarm speed
- id: synthesis-006
  kind: p
  status: modified
  source: 'The browser swarm from earlier this year peaked at roughly 1,000 commits per hour on Git. The new system
    peaks at around 1,000 commits per second.


    To facilitate this rate of activity, we built a new version control system (VCS) from scratch. Throughput was
    not the only reason to own this layer. Every change in the system passes through the VCS, so it is where collisions
    first become visible, and several of the coordination mechanisms in the next section are implemented directly
    inside of it. Failure modes at 1,000 commits per second Sign in Download Human engineering teams have standard
    coordination mechanisms like code review, ownership, standups, and merge queues. Those systems work at human
    tempo, but at the commit-rate of the swarm, we see failure modes that human teams don’t routinely encounter.'
  edited: The browser swarm peaked around 1,000 Git commits per hour; the new system can approach 1,000 per second.
    Coarse-locking tools cannot operate at that tempo, so we built a version-control system from scratch. Because
    every change passes through it, that layer also became the natural place to detect collisions and coordinate.
- id: synthesis-007
  kind: p
  status: modified
  source: 'The problem is two pictures of reality, and merge tooling can''t fix a disagreement. Instead, we have
    agents record decisions in shared design docs. Code that depends on a decision carries a compile- checked reference
    back to its doc. When planners unknowingly contradict each other, a reconciler merges the docs and the references
    propagate the resolution downstream.


    We fixed this through prompting. Planners make design decisions themselves rather than delegating them, and
    we require them to ensure that no two delegated subtrees decide the same question.'
  edited: Two unaware planners could create split-brain designs, implementing one concept incompatibly. We changed
    the prompts so planners own design decisions and delegated subtrees cannot decide the same question. When planners
    still fought over files, merge tooling could not reconcile their different pictures of reality. Agents now record
    decisions in shared documents; code carries compile-checked references to them; and a reconciler merges contradictions
    so resolutions propagate downstream.
- id: synthesis-008
  kind: p
  status: modified
  source: 'To fix this, we license intentional breakage. An agent that judges a core change worthwhile can make
    a focused patch outside its scope and leave a comment explaining why it did it.


    The compiler carries the change through the rest of the system, and everything depending on the old design fails
    to build. Each agent that hits one of those errors finds the comment, reads the reasoning, and updates its own
    piece of work to match.'
  edited: Workers were poor at absorbing another agent's context during a merge, so a neutral third party now resolves
    collisions. Workers can flag megafiles, block further commits, and hand decomposition to an outside agent. To
    counter learned reluctance to touch core code, intentional breakage lets an agent make a focused change, leave
    its reasoning, and use compiler failures to carry the new design through dependent work.
- id: synthesis-009
  kind: p
  status: modified
  source: 'No single lens catches everything, but decorrelated lenses stack, the way self-driving systems reach
    above-human reliability without any single perfect component. The compute spent on review is high return, since
    review is much cheaper than the work it audits. We suspect this stacked review system was a major contributor
    to the sustained quality of the runs.


    We experimented with many kinds of review lenses, such as giving a review agent the worker''s full transcript,
    or only its output, or nothing but the codebase. We also tried reviewers running on different models, with different
    training and a different personality.'
  edited: Review became another system, not a single pass. We tried reviewers with the worker's full transcript,
    only its output, or only the codebase; we also varied model and personality. No lens catches everything, but
    decorrelated lenses stack. Because review is cheaper than the work it audits, that compute had unusually high
    returns and appears to have helped quality survive long runs.
- id: synthesis-010
  kind: h2
  status: modified
  source: Letting agents shape the environment Stigmergy is the mechanism by which swarm organisms like ants and
    termites coordinate without direct communication. They shape the environment, and the environment shapes the
    next organism.
  edited: Letting agents shape the environment
- id: synthesis-011
  kind: p
  status: modified
  source: 'The underlying logic of the guide is that model weights are frozen, so it’s precisely surprise encounters
    that are worth capturing so the next agent trajectory is shorter.


    We pushed this further with an experiment in self-authored, shared context we call the Field Guide. It’s a folder
    owned entirely by the agents, whose index.md is automatically injected into every agent at start. It is the
    agents’ job to curate what goes into the guide and their only constraint is a line budget.'
  edited: 'Rules such as “keep notes” and “document decisions” are a form of stigmergy: agents change the environment,
    which guides the next agent. We extended this with a Field Guide owned by the swarm and injected into every
    new trajectory. Under a line budget, agents preserve surprising encounters so successors take shorter paths.
    Model weights stay frozen, but the working environment can learn.'
- id: synthesis-012
  kind: h2
  status: modified
  source: The SQLite experiment We instructed the new version of the swarm, equipped with all the improvements described
    above, to implement the whole of the 835-page SQLite manual in Rust. We withheld the sourceSign in code, Download
    test suites, SQLite binary, and internet access.
  edited: Rebuilding SQLite from a manual
- id: synthesis-013
  kind: p
  status: modified
  source: 'The swarm was never told the suite existed. After each run, we manually reviewed the code and the run
    itself, checking for cheating and shortcuts, and confirming the system was built out evenly, rather than just
    in the places where the tests look.


    To measure progress, we graded against sqllogictest, a test suite from the SQLite project built to check that
    different database engines return the same results for the same queries. It contains millions of queries with
    known correct answers, and the grade is the fraction the swarm''s database gets right. Progress shows up as
    a rising curve over the course of a run.'
  edited: We gave the improved swarm the 835-page SQLite manual and withheld the source, tests, binary, and internet
    access. We graded the result against millions of sqllogictest queries with known answers. The swarm was never
    told that suite existed; after each run we manually checked for shortcuts and verified that the system had been
    built broadly rather than only where tests happened to look.
- id: synthesis-014
  kind: p
  status: modified
  source: 'As you read the curves, keep in mind that agents chose their own strategies. Some built broad foundations
    and scored low for hours before a late spike while others went deep on one area, scored early, then plateaued
    while filling in the rest. Trends matter more than exact scores at exact moments.


    The new swarm did better in every model configuration. Using Grok 4.5, it reached 80% in four hours, while the
    old swarm spiraled and had to be paused before its second hour.


    The Fable 5 hybrid passed about two-thirds of the suite within the first hour. By the four-hour cutoff, the
    new runs sat between 73% and 85%, while the old runs ranged from 11% to 77%.'
  edited: 'We tested four model mixes: GPT-5.5 everywhere; Grok 4.5 everywhere; Opus 4.8 planning with Composer
    2.5 working; and Fable 5 planning with Composer 2.5 working. Strategies differed—some built broad foundations
    before a late score spike, others scored early and then plateaued—but the harness result did not. At four hours
    the new runs were between 73 and 85 percent while the old runs ranged from 11 to 77 percent. Every new configuration
    later passed the full suite.'
- id: synthesis-015
  kind: h2
  status: modified
  source: A deep dive into the runs Starting with the simplest measure of activity, we can see how the rate of commits
    varied for Grok 4.5 under the old harness versus the new. The old run produced 68,000 commits in its first two
    hours, roughly 70 times the new run's pace.
  edited: A deep dive into the runs
- id: synthesis-016
  kind: p
  status: modified
  source: 'The merge conflict data points to the latter interpretation. The old run accumulated more than 70,000
    conflicts before we paused it, accelerating rather than stabilizing, while the new run logged fewer than a thousand
    over its full four hours.


    A deep dive into the runs Starting with the simplest measure of activity, we can see how the rate of commits
    varied for Grok 4.5 under the old harness versus the new. The old run produced 68,000 commits in its first two
    hours, roughly 70 times the new run''s pace.'
  edited: Activity alone was misleading. The old Grok run made 68,000 commits in under two hours, about seventy
    times the new run's pace, but accumulated more than 70,000 merge conflicts and accelerated rather than stabilizing.
    The new run logged fewer than 1,000 conflicts across its full four hours. One old megafile attracted 7,771 conflicts
    from 1,173 agents; the most contested file in the new codebase saw 47.
- id: synthesis-017
  kind: p
  status: modified
  source: 'All of this shows up in the final codebase. In the Fable 5 mix, both the old and new swarms ultimately
    passed the full suite, but the old one needed 64,305 lines of engine code and the new one did it in 9,908. The
    Opus mix shows the same shape with 19,013 lines at a 97% grade under the old harness, and 4,645 lines at 100%
    under the new harness.


    The old run sprawled to 54 crates, including three separate SQL packages. The new run settled on nine crates
    early and never added another. Sign in Download


    The old swarm''s biggest coordination failure — split-brain, or planners duplicating each other''s work — showed
    up in the package structure. Rust code is organized into packages called crates, and in a project like this,
    each crate is roughly one major component.'
  edited: 'Split-brain showed up in the package structure too. The old swarm sprawled to 54 Rust crates, including
    three competing SQL packages. The new swarm settled on nine crates early and never added another. That coherence
    reached the final code: in the Fable mix, both harnesses eventually passed the suite, but the old one needed
    64,305 lines of engine code and the new one 9,908. With the Opus mix, the old harness used 19,013 lines to reach
    97 percent; the new one reached 100 percent in 4,645.'
