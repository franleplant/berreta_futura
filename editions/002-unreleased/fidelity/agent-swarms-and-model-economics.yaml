  source: 'The SQLite experiment We instructed the new version of the swarm, equipped with all the improvements
    described above, to implement the whole of the 835-page SQLite manual in Rust. We withheld the sourceSign in
    code, Download test suites, SQLite binary, and internet access.


    All of this shows up in the final codebase. In the Fable 5 mix, both the old and new swarms ultimately passed
    the full suite, but the old one needed 64,305 lines of engine code and the new one did it in 9,908. The Opus
    mix shows the same shape with 19,013 lines at a 97% grade under the old harness, and 4,645 lines at 100% under
    the new harness.'
  edited: For SQLite, agents received an 835-page manual but no source code, tests, binary, or internet access.
    We evaluated them against millions of sqllogictest cases, with a held-out set protecting the final result. Four
    planner/worker configurations reached between 73 and 85 percent after four hours in the new harness and later
    reached 100 percent; the old harness ranged from 11 to 77 percent at the same checkpoint.
- id: synthesis-007
  kind: p
  status: modified
  source: 'The merge conflict data points to the latter interpretation. The old run accumulated more than 70,000
    conflicts before we paused it, accelerating rather than stabilizing, while the new run logged fewer than a thousand
    over its full four hours.


    All of this shows up in the final codebase. In the Fable 5 mix, both the old and new swarms ultimately passed
    the full suite, but the old one needed 64,305 lines of engine code and the new one did it in 9,908. The Opus
    mix shows the same shape with 19,013 lines at a 97% grade under the old harness, and 4,645 lines at 100% under
    the new harness.'
  edited: The traces explain the difference. The old system made tens of thousands of early commits yet thrashed
    through roughly seventy thousand conflicts, spawned overlapping SQL implementations, and grew far more code.
    The new system made fewer, more coherent changes. One successful run reached full correctness in 4,645 lines
    where an older run used 19,013 lines for 97 percent.
- id: synthesis-008
  kind: h2
  status: modified
  source: 'We also varied which models did which jobs. In some runs, one model handled everything while in others,
    a frontier model planned while a fast, inexpensive model carried out the work. Every mix produced similar quality,
    but the costs varied enormously.1 Trees and leaves Sign in Download Descriptions of large tasks naturally take
    the shape of trees, with a goal at the root that subdivides recursively into basic units of work. Our swarm
    has two roles, both organized around that same tree-like decomposition:'
  edited: Models are roles, not a single bill
- id: synthesis-009
  kind: p
  status: modified
  source: Few moments in a large task genuinely require frontier intelligence, such as the original decomposition,
    the design decisions, and certain trade-offs. Once a frontier planner has collapsed the ambiguity into a detailed,
    explicit instruction, less expensive models simply have to follow it. This is a huge potential source of cost
    savings. In the run that used GPT-5.5 for both planners and workers, the workers alone cost $9,373. In the run
    where Opus 4.8 did the planning and Composer 2.5 did the work, the entire worker fleet cost $411.
  edited: Costs ranged from roughly $1,339 for an Opus-planner hybrid to $10,565 for an all-GPT-5.5 configuration.
    Workers consumed at least 69 percent of tokens and more than 90 percent in most runs. Frontier reasoning mattered
    at a few planning moments, while the bulk of execution could use cheaper models. In one comparison, GPT-5.5
    workers cost $9,373 and Composer workers $411.
- id: synthesis-010
  kind: p
  status: modified
  source: One detail worth noting comes from comparing the two hybrid runs. The Fable 5 planner ran up a slightly
    smaller bill than the Opus 4.8 planner, despite roughly twice the per-token price, because it used far fewer
    planning tokens. But the Fable run's workers went through several times as many tokens, and the run as a whole
    came out substantially more expensive.
  edited: 'The implication is architectural and economic: select models by role. A planner''s extra judgment can
    be worth its price because it shapes thousands of cheaper actions. A nominally inexpensive planner can still
    raise the total bill if its decomposition causes workers to consume far more tokens.'
