- id: synthesis-001
  kind: p
  status: modified
  source: 'Most developers still prompt their coding agents by hand. They type, they wait, they read the diff, they
    type again.


    Loop engineering is building a small system that


    . The honest version of this article is: loop engineering is real, and most developers don’t need it yet.


    The agents got good enough that the next leverage point is one floor up: the system that decides what they work
    on, when, with what gate, and what state survives between runs.'
  edited: Most developers still prompt an agent by hand, inspect the answer, and decide what to do next. Loop engineering
    starts when the system finds work, hands it to an agent, checks the result, records state, and chooses the next
    step. The upgrade is not a cleverer prompt. It is automation, state, a verifier, and a schedule.
