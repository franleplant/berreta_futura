  status: modified
  source: 'PART 2 · The 5 Building Blocks


    Three tiers: figure out if you actually need a loop, learn the five building blocks, then build the smallest
    one that works without hurting you.'
  edited: Five building blocks
- id: synthesis-006
  kind: p
  status: modified
  source: '05. Automations: the heartbeat.


    The connectors that pay back fastest for loop work, in order:


    07. Skills: write project knowledge


    Block the loop from architecture work.'
  edited: Automations provide the heartbeat, either on a cadence or until a goal is met. Worktrees isolate concurrent
    attempts. Skills preserve reusable operating knowledge. Connectors bring the loop into the systems where work
    lives. Sub-agents separate making from checking so the same context is not asked to invent and certify its own
    answer.
- id: synthesis-007
  kind: p
  status: modified
  source: '4. The loop has a hard stop.


    11. The minimum viable loop.


    One state file.


    10. The state file.'
  edited: 'A small state file prevents amnesia across runs: current goal, completed work, failed approaches, next
    action, and hard constraints. The minimum viable loop can be humble—select one bounded task, execute it in isolation,
    run one decisive verifier, record the result, and stop or continue according to an explicit rule.'
