    the loop runs while you are not watching, so a verifier you actually trust is the only reason you can walk away.
    Sub-agents burn more tokens since each one does its own model and tool work - spend them where a second opinion
    is worth paying for.'
  edited: The quiet failure is a loop that keeps producing plausible work while its notion of success drifts. Tests,
    type checks, linters, reproducible benchmarks, and human approval at high-risk boundaries turn motion into progress.
    The schedule is not the automation; the verifier is.
- id: synthesis-010
  kind: p
  status: modified
  source: 'Read the diffs.


    14. The security tax.


    Credentials in logs.


    The loop opens PRs faster than a human can read them. Without a gate that includes security checks (SAST, dependency
    audit, secret scanning), insecure code merges automatically.'
  edited: 'Autonomy also creates comprehension debt. Read diffs, sample the evidence behind green gates, keep agents
    away from unilateral architecture, and pair with them on design. Security adds another tax: generated code,
    hostile instructions hidden in skills or retrieved content, credentials in logs, and gradually expanding permissions.
    Use sandboxes, allowlists, scoped secrets, audit trails, budgets, and human gates for irreversible operations.'
- id: synthesis-011
  kind: p
  status: modified
  source: 'One automation. One skill. One state file. One gate.


    One state file.


    get one manual run reliable first. Turn it into a skill. Wrap it in a loop. Then schedule it. Skipping ahead
    is how loops fail in production.


    Get a manual run reliable. Turn it into a skill. Wrap it in a loop. Then schedule it. Order matters. Skip ahead
    and you’re paying for a system no one understands.'
  edited: Most teams do not need a grand autonomous factory. Start with one reliable manual procedure. Turn it into
    a reusable skill, then a bounded loop, then a scheduled automation. Add one state file and one objective gate.
    Keep the progression legible enough that automation amplifies engineering rather than replacing it.
