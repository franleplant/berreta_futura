  source: This is the part that decides whether the loop helps or just spends.
  edited: Decide whether a loop belongs
- id: synthesis-003
  kind: p
  status: modified
  source: '3. The agent can run the code it changes.


    Anything irreversible needs a human approval gate before action.


    No objective gate.


    - not until the task repeats, verification is automated, the budget can absorb the waste, and the agent has
    senior engineer tools.'
  edited: 'A useful candidate repeats, has an objective completion gate, fits a token or cost budget, and can give
    the agent senior-engineer tools: code, logs, a reproducible failure, and a command to run. Before automating,
    ask whether it happens weekly, whether a machine can prove success, whether the agent can execute the work,
    whether there is a hard stop, and whether a person remains before irreversible action.'
- id: synthesis-004
  kind: p
  status: modified
  source: 'Vague product work


    Architecture, auth, payments, vague product decisions. Keep the loop on lint-and-fix, not strategy.


    Teams with repetitive, machine-checkable work and the budget to run it


    Block the loop from architecture work.'
  edited: CI triage, dependency maintenance, lint cleanup, flaky-test investigation, and issue drafting often fit.
    Architecture, authentication, payments, deployment, and vague product work usually do not. The economics favor
    repetitive, machine-checkable, asynchronous work; judgment-heavy tasks remain better as deliberate prompts.
