  status: boilerplate_removed
  source: JUL 15 2026
- id: source-002
  kind: h1
  status: boilerplate_removed
  source: How We Built Our Knowledge Base
- id: source-003
  kind: p
  status: retained
  source: 'Employees ask our internal knowledge base more than 15,000 questions every day. It''s become one of the
    most widely adopted internal tools at the company since launching 3 months ago. Used by humans, automations
    and agents.


    At Cerebras, our teams work across data center operations, chip design, hardware, training, inference, cloud
    platform, and more. With hundreds of new employees joining every year, our communication channels were filling
    up with the same questions:'
- id: source-004
  kind: blockquote
  status: substantive_cut
  source: '“Where can I find X?”

    “Who is the expert in Y?”

    “What is Z?”'
- id: source-005
  kind: p
  status: retained
  source: We built Cerebras Knowledge to help people connect people and systems to useful information.
- id: source-006
  kind: h2
  status: retained
  source: Meeting data where it lives
- id: source-007
  kind: p
  status: retained
  source: 'Finding information inside an organization is hard. The data is scattered across tools, and every quarter
    or so someone proposes the same brilliant fix: let’s record everything in one platform so that all information
    is in a single place. The dream of a single source of truth, of course, rarely works in practice.'
- id: source-008
  kind: p
  status: retained
  source: 'Information is generated wherever it is convenient and ergonomic: suggested edits in a document, threads
    in Slack, code references in GitHub, and status metadata in Jira. These platforms are tailor-made for their
    specific domains, optimized through years of product engineering and analytics. Discussing a pull request in
    Google Docs would be a terrible experience.'
- id: source-009
  kind: p
  status: retained
  source: So we set out to design a system that required minimal change to existing behavior. On the data collection
    side, this meant extracting data from each platform directly.
- id: source-010
  kind: h2
  status: retained
  source: Anatomy of a knowledge base
- id: source-011
  kind: p
  status: retained
  source: 'Our knowledge base provides three things:'
- id: source-012
  kind: bullet
  status: substantive_cut
  source: A platform for collecting and storing internal data.
- id: source-013
  kind: bullet
  status: substantive_cut
  source: A platform for querying that data.
- id: source-014
  kind: bullet
  status: substantive_cut
  source: A layer that enforces authentication and authorization, with auditing and analytics.
- id: source-015
  kind: p
  status: retained
  source: At the core is a single Postgres table that holds embeddings, raw summaries, and metadata from many sources.
    The system continually ingests data from across the company and maintains a query-ready datastore.
- id: source-016
  kind: p
  status: retained
  source: 'We wanted a data interface that was simple but could work with most forms of data. We also wanted other
    developers at Cerebras to be able to build custom connectors. The result is deliberately simple: every source,
    from Slack threads to netlists, lands in the same embeddings table, and anything in that table is immediately
    queryable through the same interface:'
- id: source-017
  kind: p
  status: retained
  source: Each data source defines what the data is, how to connect to it, and how often it should be fetched. Each
    resulting embedding row follows the same interface regardless of whether it came from Slack, a code repository,
    a document system, or a custom database.
- id: source-018
  kind: h2
  status: retained
  source: Slack
- id: source-019
  kind: p
  status: retained
  source: Slack was the most important data source we needed to design for. It is where the most up-to-date engineering
    discussions happen across the company.
- id: source-020
  kind: h2
  status: retained
  source: How we process unstructured Slack conversations
- id: source-021
  kind: p
  status: retained
  source: We initially tested whether simple embeddings over raw text performed well enough. We quickly realized
    that vector search alone was insufficient for matching all relevant data.
- id: source-022
  kind: p
  status: substantive_cut
  source: 'Slack messages present several challenges:'
- id: source-023
  kind: bullet
  status: substantive_cut
  source: 'Information density varies enormously: “hey yeah sure mike” and a detailed kernel explanation are both
    messages.'
- id: source-024
  kind: bullet
  status: substantive_cut
  source: Message lengths vary, and shorter messages frequently beat longer, more detailed messages in cosine similarity.
- id: source-025
  kind: bullet
  status: substantive_cut
  source: The meaning of a message often depends on the surrounding conversation.
- id: source-026
  kind: p
  status: retained
  source: 'We needed a hybrid approach. We built Slack ingestion so every thread is retrievable through several
    search techniques at once, where each technique makes up for the weaknesses of the others:'
- id: source-027
  kind: bullet
  status: substantive_cut
  source: 'Full-text search catches the exact tokens that embeddings blur together: error strings, flag names, host
    names. When an engineer pastes a literal error message, an exact lexical match is almost always the best evidence,
    and no amount of semantic similarity should outrank it.'
- id: source-028
  kind: bullet
  status: substantive_cut
  source: Embedding search catches paraphrase. The person asking “restore hangs after manifest load” and the person
    who answered “checkpoint stalls on the NFS mount” may never share vocabulary. Vector similarity is what connects
    a question to an answer written in different words.(1)
- id: source-029
  kind: bullet
  status: substantive_cut
  source: Inverse document frequency separates signal from filler. A short message built around rare tokens, such
    as an obscure config flag, deserves to rank. “sounds good, thanks!” sits close to many queries in embedding
    space but scores near zero once term rarity is taken into account.
- id: source-030
  kind: bullet
  status: substantive_cut
  source: Age decay encodes that Slack answers expire. Two threads can answer the same question, and the one from
    six months ago may describe infrastructure that no longer exists. When relevance is otherwise equal, the newer
    thread wins.
- id: source-031
  kind: p
  status: substantive_cut
  source: “restore hangs after manifest load”
- id: source-032
  kind: bullet
  status: substantive_cut
  source: '2W AGO

    NO SHARED TOKENS

    PARAPHRASE MATCH

    CKPT_PREFETCH: RARE

    RECENT WINS TIE

    THREAD


    Checkpoint stalls on the NFS mount — set CKPT_PREFETCH=4.'
- id: source-033
  kind: p
  status: substantive_cut
  source: Checkpoint stalls on the NFS mount — set CKPT_PREFETCH=4.
- id: source-034
  kind: bullet
  status: substantive_cut
  source: '1D AGO

    EXACT TOKENS

    ERR_MANIFEST_TIMEOUT: RARE

    MESSAGE


    ERR_MANIFEST_TIMEOUT: restore hangs after manifest load.'
- id: source-035
  kind: p
  status: substantive_cut
  source: 'ERR_MANIFEST_TIMEOUT: restore hangs after manifest load.'
- id: source-036
  kind: bullet
  status: substantive_cut
  source: '3H AGO

    FALSE NEIGHBOR

    NO RARE TOKENS

    MESSAGE


    sounds good, thanks! will try that'
- id: source-037
  kind: p
  status: substantive_cut
  source: sounds good, thanks! will try that
- id: source-038
