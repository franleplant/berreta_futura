    ALSO MATCHES

    8 MO: DECAYED

    THREAD


    restore hangs after manifest load → use LEGACY_FETCHER=1.'
- id: source-039
  kind: p
  status: substantive_cut
  source: restore hangs after manifest load → use LEGACY_FETCHER=1.
- id: source-040
  kind: p
  status: substantive_cut
  source: No single scorer is trusted on its own. Each technique produces its own ranked view of the same corpus,
    and those views are fused at query time (see Reranking).
- id: source-041
  kind: h2
  status: substantive_cut
  source: Socket Mode
- id: source-042
  kind: p
  status: substantive_cut
  source: To collect data in real time, we installed a Slack bot into our workspace and ran it in Socket Mode. Slack
    pushes every message event to us over a persistent WebSocket, so we get real-time updates without polling the
    Web API and burning through its rate limits.
- id: source-043
  kind: p
  status: substantive_cut
  source: When an event arrives, we immediately acknowledge it, deduplicate it using the stable event ID, and mark
    the message for the ingest consumer.
- id: source-044
  kind: p
  status: substantive_cut
  source: The ingest consumer does not save a new message in isolation. It resolves the thread that the message
    belongs to and re-fetches the entire conversation, including the parent and every reply, from the Slack API.
    It then writes the whole thread back as one row. A reply to an existing thread therefore re-pulls the parent
    and all siblings, so the stored content, participant list, and last-activity timestamp always reflect the complete
    conversation.
- id: source-045
  kind: p
  status: substantive_cut
  source: Every Slack channel in our system has its own data source. This provides fine-grained tuning for data
    freshness. A team may choose to ingest a busy incident channel more frequently, for example.
- id: source-046
  kind: h2
  status: substantive_cut
  source: Threads and messages
- id: source-047
  kind: p
  status: substantive_cut
  source: Raw Slack text is keyword-searchable as soon as it lands because we maintain a Postgres full-text (GIN)
    index over the raw content. To enable useful vector search, however, we do some additional processing.(8)
- id: source-048
  kind: p
  status: substantive_cut
  source: 'During distillation, an LLM extracts structured data from the full thread:'
- id: source-049
  kind: bullet
  status: substantive_cut
  source: A one-line question that an engineer would actually search for.
- id: source-050
  kind: bullet
  status: substantive_cut
  source: A short summary.
- id: source-051
  kind: bullet
  status: substantive_cut
  source: The resolution.
- id: source-052
  kind: bullet
  status: substantive_cut
  source: The systems and code references mentioned.
- id: source-053
  kind: bullet
  status: substantive_cut
  source: '09:14

    QUESTION

    MAYA


    Restore stalls after manifest load on the larger cluster. Small runs are fine.'
- id: source-054
  kind: p
  status: substantive_cut
  source: Restore stalls after manifest load on the larger cluster. Small runs are fine.
- id: source-055
  kind: bullet
  status: substantive_cut
  source: '09:17

    SUMMARY

    OWEN


    I can reproduce with 128 shards. The logs stop before cache warmup.'
- id: source-056
  kind: p
  status: substantive_cut
  source: I can reproduce with 128 shards. The logs stop before cache warmup.
- id: source-057
  kind: bullet
  status: substantive_cut
  source: '09:18

    CONTEXT

    SAM


    My laptop also stalls when it sees Monday.'
- id: source-058
  kind: p
  status: substantive_cut
  source: My laptop also stalls when it sees Monday.
- id: source-059
  kind: bullet
  status: substantive_cut
  source: '09:21

    RESOLUTION

    MAYA


    Setting CKPT_PREFETCH=4 makes it complete. The default is too high for the NFS mount.'
- id: source-060
  kind: p
  status: substantive_cut
  source: Setting CKPT_PREFETCH=4 makes it complete. The default is too high for the NFS mount.
- id: source-061
  kind: bullet
  status: substantive_cut
  source: "VECTOR\n              Pgvector\n              \n                \n                \n              \n\
    \              READY One consistent record, 3,072 dimensions"
- id: source-062
  kind: p
  status: substantive_cut
  source: READY One consistent record, 3,072 dimensions
- id: source-063
  kind: p
  status: substantive_cut
  source: Question + summary + resolution + systems + code references
- id: source-064
  kind: p
  status: substantive_cut
  source: We embed these data points and write them into the shared embeddings table. The original transcript is
    not embedded directly. In our experiments, accuracy increased significantly when the thread was normalized into
    a consistent format.(7,9) The additional metadata also gives the semantic match more useful signal.
- id: source-065
  kind: h2
  status: substantive_cut
  source: Bursting
- id: source-066
  kind: p
  status: substantive_cut
  source: 'At this point Slack search was good, but we kept encountering the same problem: important messages inside
    long threads were not always represented in the thread-level summary.'
- id: source-067
  kind: p
  status: substantive_cut
  source: To boost the signal from individual messages, we use bursting. A burst is a run of consecutive messages
    from the same author. We embed individual bursts with the thread topic prepended as context(2) because sometimes
    the answer lives in one tangent message whose vocabulary never makes it into the thread summary. Burst embeddings
    make that message findable on its own.
- id: source-068
  kind: p
  status: substantive_cut
  source: 'To prevent low-signal data from reaching the database, each burst is scored against a weighted combination
    of signals and must clear a threshold before it is embedded:'
- id: source-069
  kind: bullet
  status: substantive_cut
  source: It contains a relatively rare token across the corpus, with IDF of at least 4.0.
- id: source-070
  kind: bullet
  status: substantive_cut
  source: The combined burst is at least 200 characters.
- id: source-071
  kind: bullet
  status: substantive_cut
  source: One or more messages in the burst contain reactions, providing a social boost.
- id: source-072
  kind: p
  status: substantive_cut
  source: After distillation, qualifying bursts are embedded and stored in the embeddings table alongside the thread-level
    record.
- id: source-073
  kind: h2
  status: substantive_cut
  source: Code repositories
- id: source-074
  kind: p
  status: substantive_cut
  source: Initially we debated whether embedding code repositories was necessary. With the rise of Claude Code and
    other command-line tools, creating code embeddings felt counterintuitive when it seemed like “grep is all you
    need.” After talking with others in the industry and reading Cursor’s findings on semantic search in large codebases,
    we decided to try.
- id: source-075
  kind: p
  status: substantive_cut
  source: We have many internal repositories, some larger than 40 GB. Our main concern was how to keep them current
    efficiently.
- id: source-076
  kind: h2
  status: substantive_cut
  source: Using CocoIndex to maintain code embeddings
- id: source-077
  kind: p
  status: substantive_cut
  source: After several experiments, we landed on CocoIndex, an open-source document embedding framework that specializes
    in vectorizing codebases.
- id: source-078
  kind: p
  status: substantive_cut
  source: For each repository, we split the code using language-specific regex boundaries ordered from coarse to
    fine. The splitter tries higher-level boundaries, such as classes, first. If a resulting chunk is still too
    large, it falls back to method boundaries and then smaller blocks. We embed the resulting chunks and write the
    vectors to Postgres. A single file may generate multiple embeddings at different levels of specificity, such
    as file-level and function-level records.
- id: source-079
  kind: p
  status: substantive_cut
  source: CocoIndex tracks synchronization metadata in Postgres. On each commit, it re-embeds and re-exports only
    the changed code chunks instead of recomputing the whole repository. This worked especially well for us because
    the synchronization state and embedding store live in the same database.
- id: source-080
  kind: p
  status: substantive_cut
  source: As the number of codebases grew, we moved repository onboarding into configuration files that teams can
    submit themselves, including allowlists and denylists at the file-path level.
- id: source-081
  kind: h2
  status: substantive_cut
  source: Custom data sources
- id: source-082
  kind: p
  status: substantive_cut
  source: Some teams already had their own databases and did not want to move data into Slack or a document system
    just to participate in the knowledge base. They wanted the same query surface over their existing tables.
- id: source-083
  kind: p
  status: substantive_cut
  source: To support this, we treat custom sources as plugin scripts. A team opens a pull request with a small Python
    module that knows how to read from its system and emit rows shaped like our embeddings table, plus a matching
    data source entry.
- id: source-084
  kind: p
  status: substantive_cut
  source: As long as the script writes into the shared database using the same schema as every other embedding row,
    the rest of the stack works unchanged. The data becomes queryable alongside Slack, code, and documents, with
    no special handling elsewhere in the system.
- id: source-085
  kind: h2
  status: retained
  source: Planning and tool fan-out
- id: source-086
  kind: p
  status: retained
  source: 'For every query, we first run a short planning pass where an LLM decides which tools and data sources
    are likely to matter. The main tools:'
- id: source-087
  kind: bullet
  status: retained
  source: 'subsystem_index: per-file LLM summaries.'
- id: source-088
  kind: bullet
  status: retained
  source: 'search: the unified vector pipeline across Slack, wiki, code, and other indexed sources, merged and reranked
    internally.'
- id: source-089
  kind: bullet
  status: retained
  source: 'search_slack: direct Slack retrieval.'
- id: source-090
  kind: bullet
  status: retained
  source: 'search_code: ripgrep over source repositories.'
- id: source-091
  kind: bullet
  status: retained
  source: 'recent_prs: recent pull requests relevant to the question.'
- id: source-092
  kind: bullet
  status: retained
  source: 'who_knows: people with demonstrated expertise on a topic.'
- id: source-093
  kind: p
  status: retained
  source: 'The planner works over a compact description of what we have indexed: which projects exist, which sources
    are available in each project, and what each source is good at answering. Given the user’s query and active
    scope, it emits tool selections that the executor fans out in parallel, normalizes into a common evidence format,
    and passes to a final synthesis LLM.(4)'
- id: source-094
  kind: h2
  status: retained
  source: Reranking
- id: source-095
  kind: p
  status: retained
  source: A document can surface near the top simply because it shares vocabulary with the query while answering
    a different question. Before reranking, we combine the retrievers’ incompatible result lists with reciprocal
    rank fusion, or RRF. For every document, we add weight / (60 + rank) for each list in which it appears, with
    a default weight of 1.0 and a smoothing constant of 60.
- id: source-096
  kind: p
  status: substantive_cut
  source: 'The smoothing constant makes consensus matter more than a single strong vote: a document that shows up
    near the top across several retrievers can beat one that ranks first in only one of them. We then merge duplicate
    chunks back to one source, cap how many results each file can contribute, and end up with a more diverse top
    twenty.'
- id: source-097
  kind: p
  status: retained
  source: We send the original query and those candidates to a small reranker model. It gives each document a score
    from zero to ten, and we keep the top ten.(6)
- id: source-098
  kind: p
  status: substantive_cut
  source: Once the ranking is final, we add context back to the winners. For example, if we match a wiki section
    we pull in the two neighboring sections so the heading, preconditions, and caveats that chunking split apart
    aren’t lost. This gives readers a complete snippet instead of a lonely paragraph that’s missing important context.
- id: source-099
  kind: p
  status: retained
  source: 'So the output of search is a rich packet of evidence: results fused from different retrievers, deduplicated
    at the source level, reranked against the actual question, and only then expanded with surrounding context.'
- id: source-100
  kind: h2
  status: retained
  source: MCP
- id: source-101
  kind: p
  status: retained
  source: In the MCP integration, we expose retrieval building blocks as direct tools instead of hiding them behind
    one “answer this question” endpoint. These tools are intentionally simple and as LLM-free as possible so clients
    can query them quickly and cheaply.(5)
- id: source-102
  kind: p
  status: retained
  source: Each MCP tool corresponds to one underlying retrieval primitive, such as search_slack, search_code, search,
    or who_knows. Tool inputs and outputs are narrow, structured, and stable, making them easy to call from any
    client or agent without embedding additional orchestration logic inside the tool itself.
- id: source-103
  kind: p
  status: substantive_cut
  source: Most tools run one query pipeline, such as vector search, lexical search, or ripgrep, apply lightweight
    scoring heuristics, and return raw evidence rows.
- id: source-104
  kind: p
  status: retained
  source: Claude Code, or any MCP-compatible agent, becomes the orchestration engine. It decides which tools to
    call, in what order, and how to assemble the results into a final answer or code edit. The retrieval layer itself
    does not depend on those LLM decisions in order to serve requests.
- id: source-105
  kind: h2
  status: retained
  source: Web UI
- id: source-106
  kind: p
  status: retained
  source: In the web UI, the same tools exist, but they are connected to a complete query pipeline that runs end
    to end for every user question. The UI agent owns the planner and executor steps.
- id: source-107
  kind: p
  status: substantive_cut
  source: 'Planner: A lightweight LLM pass inspects the query and active project, then chooses which retrieval tools
    to invoke, such as search, search_slack, and subsystem_index.'
- id: source-108
  kind: p
  status: substantive_cut
  source: 'Executor: The system fans those tool calls out in parallel, gathers the results, and normalizes them
    into a shared evidence schema with scores, recency, and source hints.'
- id: source-109
  kind: p
  status: retained
  source: 'Synthesis: A final LLM pass takes the typed evidence bundle and original question, then produces the
    answer shown in the UI, including citations, caveats, and cross-source synthesis.'
- id: source-110
  kind: p
  status: retained
  source: From the user’s perspective, the web UI is simply “ask a question and get an answer.” Under the hood,
    it runs the same planner → executor → synthesizer pattern that MCP clients can recreate explicitly.
- id: source-111
  kind: h2
  status: substantive_cut
  source: Organization
- id: source-112
  kind: p
  status: substantive_cut
  source: As the corpus grew, “search everything everywhere” rapidly stopped being useful. Engineers on compiler
    teams did not want infrastructure runbooks in their results, and vice versa. Projects are how we make search
    relevant by default.
- id: source-113
  kind: h2
  status: substantive_cut
  source: Projects and scoped search
- id: source-114
  kind: p
  status: substantive_cut
  source: 'We introduced projects as the primary way to organize the workspace that a query runs over. A project
    is a named bundle of data sources: specific Slack channels, code repositories, internal databases, and document
    spaces relevant to a team or initiative.'
- id: source-115
  kind: p
  status: substantive_cut
  source: Projects are intentionally lightweight. The same data source, such as a shared incidents channel or central
    platform repository, can be referenced by multiple projects instead of being duplicated.
- id: source-116
  kind: h2
  status: substantive_cut
  source: Onboarding and defaults
- id: source-117
  kind: p
  status: substantive_cut
  source: During onboarding, users are prompted to select or create a default project that matches how they work,
    such as ML training infrastructure, Compiler, or Data Center Operations.
- id: source-118
  kind: p
  status: substantive_cut
  source: That default project is stored on the user profile and scopes queries automatically. A new engineer gets
    high-signal answers without first having to learn which Slack channels, repositories, or document spaces matter.
- id: source-119
  kind: h2
  status: retained
  source: Final Thoughts
- id: source-120
  kind: p
  status: retained
  source: In the end, the knowledge base works because it meets people where the information already lives, instead
    of forcing everything into one rigid system. By combining various search techniques, we can surface evidence
    quickly. The result is a search experience that stays flexible enough for real company data, but structured
    enough to remain useful as Cerebras keeps growing.
