title: Los sistemas que construyen
subtitle: Fábricas de software, enjambres de agentes, bloques reutilizables y el criterio humano que los mantiene
  coherentes
cover:
  headline: Los sistemas que construyen
  deck: Seis informes de campo sobre lo que ocurre cuando el código, el conocimiento y el trabajo se convierten
    en sistemas de ciclos
  back_text: 'El ciclo es pequeño. La fábrica es inmensa. Entre ambos queda el trabajo difícil: preservar la intención,
    la evidencia y la comprensión humana.'
closing_plate_titles:
- Sistemas en movimiento
- Intención preservada
- Las señales regresan
editorial:
  path: manuscript/editorial.md
articles:
- id: software-factories-light-and-dark
  title: Fábricas de software, con luz y a oscuras
  short_title: con luz y a oscuras
  display_emphasis: Fábricas
  author_note: Addy Osmani pasó 14 años liderando equipos de ingeniería de Chrome, Gemini y Google Cloud AI.
  manuscript: articles/software-factories-light-and-dark.md
  figures:
  - id: loop-harness-factory
    caption: Un ciclo se convierte en arnés cuando incorpora entorno aislado, herramientas, memoria y puertas; varios
      arneses forman una fábrica al converger en una puerta de revisión bajo responsabilidad humana.
    credit: 'Diagrama de Addy Osmani; fuente: Software Factories, Light and Dark.'
    alt_text: Tres paneles muestran cómo un ciclo de un agente se convierte en arnés y luego en una fábrica con
      varios arneses, revisión, integración y producción.
    anchor: Ciclo, arnés, fábrica
  - id: factory-closed-loop
    caption: La fábrica cierra el circuito desde la intención hasta la cola, el arnés, los controles automáticos,
      la revisión y el despliegue; después devuelve las señales de producción a la cola de trabajo.
    credit: 'Diagrama de Addy Osmani; fuente: Software Factories, Light and Dark.'
    alt_text: Un circuito cerrado conecta intención, cola, arnés, controles automáticos, revisión humana, despliegue,
      observabilidad y señales operativas.
    anchor: El cuello estrecho
  - id: lights-on-factory
    caption: Una fábrica con luz mantiene a las personas en la frontera de revisión mientras los agentes construyen
      y los controles automáticos, el despliegue, la observabilidad, los incidentes y la respuesta de usuarios completan
      el ciclo.
    credit: 'Diagrama de Addy Osmani; fuente: Software Factories, Light and Dark.'
    alt_text: Un flujo de fábrica de software va desde la dirección y las señales de usuarios hasta un agente, controles
      automáticos, revisión humana, producción y observabilidad.
    anchor: Encender la luz donde vive el criterio
- id: the-building-block-economy
  title: La economía de los bloques de construcción
  short_title: Bloques de construcción
  display_emphasis: Bloques
  author_note: Mitchell Hashimoto es creador de Ghostty y cofundador de HashiCorp.
  manuscript: articles/the-building-block-economy.md
- id: agent-swarms-and-model-economics
  title: Enjambres de agentes y la nueva economía de los modelos
  short_title: Enjambres de agentes
  display_emphasis: Enjambres
  author_note: Wilson Lin es investigador en Cursor, donde trabaja en sistemas de programación autónoma
    de larga duración.
  manuscript: articles/agent-swarms-and-model-economics.md
  figures:
  - id: swarm-task-tree
    caption: Los agentes planificadores descomponen la meta de forma recursiva; los trabajadores dedican su contexto
      a hojas acotadas del árbol de tareas.
    credit: 'Diagrama de Wilson Lin; fuente: Agent Swarms and the New Model Economics.'
    alt_text: Una meta se ramifica mediante agentes planificadores en tareas acotadas para agentes trabajadores.
    anchor: Árboles y memoria
  - id: swarm-model-cost
    caption: Resultados comparables de SQLite tuvieron costes radicalmente distintos según qué modelos planificaron
      y cuáles absorbieron la carga de ejecución.
    credit: 'Diagrama de Wilson Lin; fuente: Agent Swarms and the New Model Economics.'
    alt_text: Comparación de costes entre cuatro configuraciones de modelos planificadores y trabajadores con los
      arneses antiguo y nuevo.
    anchor: Economía de modelos
- id: loop-engineering-roadmap
  title: 'Ingeniería de ciclos: una hoja de ruta más allá del prompt'
  short_title: Ingeniería de ciclos
  display_emphasis: Ciclos
  author_note: Codez es el nombre con el que publica Lev Deviatkin.
  manuscript: articles/loop-engineering-roadmap.md
- id: agentic-pods
  title: 'Pods de agentes: llevar la IA más allá de ingeniería'
  short_title: Pods de agentes
  display_emphasis: Pods
  author_note: Praveen Neppalli Naga es director de tecnología de Uber y antes ocupó puestos de liderazgo
    en ingeniería en LinkedIn.
  manuscript: articles/agentic-pods.md
- id: how-we-built-our-knowledge-base
  title: Cómo construimos nuestra base de conocimiento
  short_title: base de conocimiento
  display_emphasis: conocimiento
  author_note: Isaac Tai, Daniel Kim y Mike Gao trabajan en Cerebras Systems, la empresa de chips de IA
    creadora del Wafer-Scale Engine.
  manuscript: articles/how-we-built-our-knowledge-base.md
  figures:
  - id: knowledge-pipeline
    caption: Cerebras Knowledge conduce el material de las fuentes a través de destilación, embeddings, recuperación,
      fusión y reordenamiento, hasta sintetizar una respuesta con citas.
    credit: 'Diagrama: Isaac Tai, Daniel Kim y Mike Gao; fuente: Cerebras.'
    alt_text: Un diagrama vertical de arquitectura recorre el material desde la destilación y los embeddings hasta
      varias rutas de recuperación, la fusión, el reordenamiento y una respuesta citada.
    anchor: __opener__
  - id: planner-tool-fanout
    caption: Una etapa de planificación abre cada pregunta en abanico hacia herramientas de búsqueda especializadas
      antes de normalizar la evidencia y sintetizar la respuesta.
    credit: 'Diagrama: Isaac Tai, Daniel Kim y Mike Gao; fuente: Cerebras.'
    alt_text: Un diagrama horizontal muestra una consulta que entra en un planificador, se ramifica hacia varias
      herramientas y converge en evidencia normalizada y síntesis.
    anchor: Planificación y abanico de herramientas
  - id: mcp-web-ui-comparison
    caption: MCP expone primitivas de recuperación en bruto a clientes externos; la interfaz web se ocupa del ciclo
      completo de planificación, ejecución y síntesis.
    credit: 'Diagrama: Isaac Tai, Daniel Kim y Mike Gao; fuente: Cerebras.'
    alt_text: Una comparación arquitectónica contrapone las herramientas directas de recuperación MCP con el canal
      integrado de planificación, ejecución y síntesis de la interfaz web.
    anchor: Interfaz web
sections: []
