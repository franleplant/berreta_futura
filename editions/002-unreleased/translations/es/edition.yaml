  - id: mcp-web-ui-comparison
    caption: MCP expone primitivas de recuperación en bruto a clientes externos; la interfaz web se ocupa del ciclo
      completo de planificación, ejecución y síntesis.
    credit: 'Diagrama: Isaac Tai, Daniel Kim y Mike Gao; fuente: Cerebras.'
    alt_text: Una comparación arquitectónica contrapone las herramientas directas de recuperación MCP con el canal
      integrado de planificación, ejecución y síntesis de la interfaz web.
    anchor: Interfaz web
    source_caption_sha256: 6b99e2ef9a885ed24598b4aa6d8f263b055a43315a95afcff921aa6c9c872218
