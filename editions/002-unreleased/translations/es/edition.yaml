articles:
- id: software-factories-light-and-dark
  title: Fábricas de software, con luz y a oscuras
  short_title: con luz y a oscuras
  display_emphasis: Fábricas
  author_note: Addy Osmani escribe sobre sistemas de ingeniería, experiencia de desarrollo y software asistido por
    IA.
  manuscript: articles/software-factories-light-and-dark.md
  source_sha256: 7e4ad5250715a0fc38f75ce81f8f65e1f751979bdf0d03380eea3f231b484960
  figures:
  - id: loop-harness-factory
    caption: Un ciclo se convierte en arnés cuando incorpora entorno aislado, herramientas, memoria y puertas; varios
      arneses forman una fábrica al converger en una puerta de revisión bajo responsabilidad humana.
    credit: 'Diagrama de Addy Osmani; fuente: Software Factories, Light and Dark.'
    alt_text: Tres paneles muestran cómo un ciclo de un agente se convierte en arnés y luego en una fábrica con
      varios arneses, revisión, integración y producción.
    anchor: Ciclo, arnés, fábrica
    source_caption_sha256: c322059cee05b2df553fa67213559bcba81c5d49f4ea29435a0726b747fc2b3b
    source_credit_sha256: a19d5a93584f7573c0d5b593d75b9846fc0f1f45887c6dc17cbb43312f40bfd1
  - id: factory-closed-loop
    caption: La fábrica cierra el circuito desde la intención hasta la cola, el arnés, los controles automáticos,
      la revisión y el despliegue; después devuelve las señales de producción a la cola de trabajo.
    credit: 'Diagrama de Addy Osmani; fuente: Software Factories, Light and Dark.'
    alt_text: Un circuito cerrado conecta intención, cola, arnés, controles automáticos, revisión humana, despliegue,
      observabilidad y señales operativas.
    anchor: El cuello estrecho
    source_caption_sha256: ebecdad450fcdc439e9a8019c611b183b59857b82b2b4f2f518dc3737b518de8
    source_credit_sha256: 236714e0005cc6077bb2fb52b707b3b73050ce83840eeabb6dbdf1656df21334
  - id: lights-on-factory
    caption: Una fábrica con luz mantiene a las personas en la frontera de revisión mientras los agentes construyen
      y los controles automáticos, el despliegue, la observabilidad, los incidentes y la respuesta de usuarios completan
      el ciclo.
    credit: 'Diagrama de Addy Osmani; fuente: Software Factories, Light and Dark.'
    alt_text: Un flujo de fábrica de software va desde la dirección y las señales de usuarios hasta un agente, controles
      automáticos, revisión humana, producción y observabilidad.
    anchor: Encender la luz donde vive el criterio
    source_caption_sha256: 752c3eeded1e104be9ad1a54914293b26bbee5fcecfe9acff52a4196423db6cf
    source_credit_sha256: b3f11454d12506af158f94d0d1af6f9d63e6e73d7ea660611f5a041be2799f39
