title: Los sistemas que construyen
subtitle: Fábricas de software, enjambres de agentes, bloques reutilizables y el criterio humano que los mantiene
  coherentes
cover:
  headline: Los sistemas que construyen
  deck: Seis informes de campo sobre lo que ocurre cuando el código, el conocimiento y el trabajo se convierten
    en sistemas de ciclos
  back_text: 'El ciclo es pequeño. La fábrica es inmensa. Entre ambos queda el trabajo difícil: preservar la intención,
    la evidencia y la comprensión humana.'
