<h1>Art proof sheet — 005</h1>
<div class="grid">
<figure>
<img src="cover-synthetic-r3-v1.png" loading="lazy">
<figcaption>cover-synthetic-r3 — variant 1</figcaption>
<details><summary>prompt</summary><pre>Square abstract cover artwork for a print magazine issue whose single
editorial reading is: the impact has already happened — something
enormous has come down on the settled arrangement, and this issue is the
picture of that instant, everything still in the air and nothing yet
landed.

Composition: one violent abstract proposition built from six large,
confident geometric components. A colossal charcoal wedge drives down
from the upper right along a steep diagonal and has just struck a broad
brick-coral slab that runs across the lower third. The slab is caught at
the instant of failure: three heavy fragments flung apart and airborne on
clean divergent trajectories, their fracture faces raw and their edges
still matching where they parted. One small softened-cobalt disc is
launched clear at the top of the arc, the highest and smallest thing in
the frame — the whole picture points at it. A single muted-green shard
spins low and near, cropping the lower left. Everything is mid-flight; no
element is at rest.

Treatment: matte printed solids with clean hard edges, controlled
dimensional shading, honest cast shadows on a plain ground plane, and
quiet print grain. Push the contrast and saturation hard for newsstand
impact — deep charcoal against hot brick coral, no timidity — while
keeping the tonal range clean and printable with no muddy or crushed
darks. The negative space is the charged air the fragments are crossing,
concentrated in the upper left, not a polite decorative margin.

Palette (publication ink set only): charcoal ink, softened cyan and
cobalt, brick coral, muted green, dusty lavender, small warm-ochre
accents, warm off-white.

Requirements: square PNG, at least 1000 x 1000 pixels; at thumbnail size
it must read instantly as one dark wedge slamming down and a coral mass
bursting apart; memorable dynamic silhouette; keep the impact point and
all important detail well inside the frame, away from the extreme edges;
physically coherent trajectories, fracture geometry, contact shadows and
material weight.

Avoid: any typography, masthead, title, issue number, caption, logo,
pseudo-writing, glyph, numeral or watermark; literal diagrams; icon
systems; arrows or wayfinding symbols; doors, doorways, hinges, apertures
or things passing through openings; cantilevered slabs forming an
enclosure; explosion clichés such as sparks, fire, smoke plumes, glow,
lens flare, speed lines or particle dust; ornamental complexity;
generic-AI futurism, neon, chrome or gradient mesh; photorealism; human
figures; any recognizable brand or franchise imagery.
</pre></details>
</figure>

<figure>
<img src="cover-art-directed-r3-v1.png" loading="lazy">
<figcaption>cover-art-directed-r3 — variant 1</figcaption>
<details><summary>prompt</summary><pre>Square cover artwork: a bold hand-cut linocut and silkscreen poster in
four ink layers, for a print magazine issue whose single editorial
reading is that the machine is already running at full speed and the
people responsible for it are hanging off the side of it, reaching for
the controls while it moves.

The image: one worker in heavy overalls and rolled sleeves clings to the
flank of an enormous machine that is unmistakably already in motion. Seen
from a steep low angle, the machine's vast curved coral flank sweeps from
the lower left to the upper right and runs off both edges of the frame —
far too big for the picture, so its scale is felt rather than shown. The
worker is small against it, one boot braced on a rung, one gloved hand
locked white-knuckled on a handrail, the whole body swung out into open
air, the free arm stretched at full extension toward a single control
lever that is still just out of reach. Hair, collar and a loose strap
stream back hard in the rush of movement. The face is turned toward the
lever, mouth set, jaw tight — visible effort and nerve, not panic.
Beneath the outstretched hand there is nothing but open drop.

Treatment: hand-cut linocut character — visible gouge marks, chipped
contours, bold black keyline drawing, flat confident ink areas, coarse
halftone in one shadow field, slight silkscreen misregistration on one
layer, honest paper tooth and quiet print grain. Poster-weight contrast
and saturation: mid-century labour-poster conviction, nothing delicate or
decorative.

Palette: charcoal ink, brick coral, softened cobalt, muted green accents,
small warm-ochre accents, warm off-white paper. Pushed to poster
saturation and high contrast while staying clean in print, with no muddy
or crushed blacks.

Requirements: square PNG, at least 1000 x 1000 pixels; at thumbnail size
it must read instantly as one tiny figure flung out from a huge moving
mass, reaching; memorable silhouette dominated by the diagonal of the
body and the arm; correct human anatomy, correct grip mechanics, correct
weight and swing, correct contact between boot, hand and machine;
important detail kept well away from the extreme edges.

Avoid: any typography, masthead, title, issue number, caption, logo,
pseudo-writing, dial markings, glyph, numeral or watermark; ceramic
sculpture, glazed slabs, dressmaker's stands, toiles, pins or basting
thread; string, knots, paper scraps, torn-edge collage or pinned
diagrams; a second human figure; robots, androids or humanoid machines;
steampunk clutter, dense gear trains, rivets-and-pipes detailing or
exposed cabling; speed lines, motion blur streaks, sparks or smoke;
modern glossy anime rendering, painterly concept art, photorealism, neon
cyberpunk or generic-AI futurism; any recognizable brand or franchise
imagery.
</pre></details>
</figure>

<figure>
<img src="cover-wildcard-r3-v1.png" loading="lazy">
<figcaption>cover-wildcard-r3 — variant 1</figcaption>
<details><summary>prompt</summary><pre>Square cover artwork with a single surprising, immediately legible
proposition, for a print magazine issue about work that does not stop:
the shift continues at the end of a structure that is bending under a
force nobody has yet agreed how to hold.

The image: an impossibly slender tower rises from a bright shallow sea
and is bent by a gale into a deep, smooth arc, like a fishing rod under
load — the shaft sweeping up from the water at the lower left and curving
over until its tip hangs almost horizontal high above the sea at the
upper right. At the very tip, one small lit office box juts out over
nothing, its window blazing warm gold, and inside it the tiny silhouette
of a single person is still bent over a desk, working, entirely unbothered
by the angle of the world. A long banner of loose paper sheets streams
downwind from a gap in the office, hundreds of metres of white flecks
strung out in one clean curve across the sky. The tower's guy wires on the
windward side are taut as bowstrings; one has parted and whips free.

The picture is carried by precarious balance, scale shock and arrested
motion: the bend is at its maximum, the moment before it either holds or
goes.

Palette: this branch may leave the publication ink set. Use a high-key,
hot, saturated scheme that still reproduces cleanly in print — a blazing
coral-and-marigold sky, a hard band of saturated indigo squall sweeping in
from the right, bright turquoise sea below, charcoal contours and rigging,
and one small fierce gold window as the brightest point in the frame. Keep
values well separated and the overall image bright: no crushed blacks, no
muddy or murky passages, no low-contrast haze.

Requirements: square PNG, at least 1000 x 1000 pixels; at thumbnail size
it must read instantly as one enormous bent hook of a tower with a single
bright dot at its tip; unmistakable memorable silhouette; coherent gravity,
wind direction, elastic bending, cable tension, perspective and cast
shadow; the paper trail and the squall must move the same way; keep the
tower tip, the office and all important detail well inside the frame, away
from the extreme edges.

Avoid: any typography, masthead, title, issue number, caption, logo,
pseudo-writing, glyph, numeral or watermark; doors, doorways, portals,
glowing rims, energy swirls or particle sparkles; rooms, furniture or
carpets in flight; unrolling ribbons off rooftops; darkness, night, storm
gloom, muddy or crushed tones; lightning bolts, tornado funnels or
disaster-movie spectacle; visual clutter, crowds, aircraft or boats;
arbitrary symbols; robots, androids or floating interfaces; neon
cyberpunk or generic AI-futurist imagery; photorealistic faces; any
recognizable brand, skyline or franchise imagery.
</pre></details>
