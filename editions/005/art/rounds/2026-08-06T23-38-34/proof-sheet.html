<figure>
<img src="cover-synthetic-v1.png" loading="lazy">
<figcaption>cover-synthetic — variant 1</figcaption>
<details><summary>prompt</summary><pre>Square abstract cover artwork for a print magazine issue whose single
editorial reading is: software agents have outgrown the sandbox and now
need real rooms, ledgers, wallets and rules — the work of this issue is
building the doors.

Composition: one compact abstract proposition built from five large,
confident geometric components on a substantial field of warm off-white
negative space. A single broad flat plane occupies the lower two thirds,
pierced by one tall clean rectangular aperture. Three simple solids — a
slab, a wedge and a disc — pass through or rest in the aperture at
different depths, while a fourth solid waits outside it, unmistakably not
yet through. Controlled dimensional shading and synthetic material depth
are welcome where they strengthen the proposition; forms should read as
matte printed solids with clean edges and quiet print grain.

Palette (publication ink set only): charcoal ink, softened cyan and
cobalt, brick coral, muted green, dusty lavender, small warm-ochre
accents, warm off-white. Low to medium saturation, print-friendly
contrast, no muddy darks.

Requirements: square PNG, at least 1000 x 1000 pixels; legible silhouette
at thumbnail size; keep all important detail well inside the frame, away
from the extreme edges; physically coherent intersections, shadows and
material relationships.

Avoid: any typography, masthead, title, issue number, caption, logo,
pseudo-writing, glyph, numeral or watermark; literal diagrams; icon
systems; arrows or wayfinding symbols; ornamental complexity; generic-AI
futurism, glow, lens flare, neon, chrome or gradient mesh; photorealism;
human figures; any recognizable brand or franchise imagery.
</pre></details>
</figure>

<details><summary>prompt</summary><pre>Square cover artwork: a straight-on studio photograph of a purpose-made
glazed ceramic sculpture, for a print magazine issue whose single
editorial reading is that software agents have outgrown the sandbox and
now need real rooms, ledgers, wallets and rules — the work of this issue
is building the doors.

The object: a low wall of five hand-thrown, slightly irregular glazed
ceramic slabs standing edge to edge on a plain matte surface. The centre
slab is a real working panel on two small brass hinges, swung partly open
toward the camera, revealing a clean empty rectangle of cool shadow
behind the wall. Glazes vary slab to slab — softened cobalt, brick coral,
muted green, dusty lavender — with visible glaze pooling at the slab feet
and honest kiln variation in the surface. Hard raking light from the
upper left casts one long, physically exact shadow set across warm
off-white ground; the open panel throws a distinct angled shadow that
proves the hinge.

Palette: charcoal, softened cyan and cobalt, brick coral, muted green,
dusty lavender, warm-ochre accents, warm off-white. Low to medium
saturation, clean print reproduction, no crushed blacks.

Requirements: square PNG, at least 1000 x 1000 pixels; strong legible
silhouette at thumbnail size; important detail kept away from the extreme
edges; convincing ceramic material, correct hinge mechanics, correct
contact shadows.

Avoid: any typography, masthead, title, issue number, caption, logo,
pseudo-writing, glyph, numeral or watermark; string, thread, knots, paper
scraps, torn-edge collage or pinned diagrams; human figures or hands
unless nothing else is possible — none are needed here; generic-AI
futurism, glow, neon, chrome; ornamental clutter; any recognizable brand
or franchise imagery.
</pre></details>
</figure>

<details><summary>prompt</summary><pre>Square cover artwork with a single surprising, immediately legible
proposition, for a print magazine issue about software agents that have
outgrown the sandbox and now need real rooms, ledgers, wallets and rules.

The image: an ordinary domestic doorway — plain painted frame, one open
door — standing entirely free in the middle of a vast, empty, pale
grassland under a high flat sky. Through the doorway spills an entire
room's worth of everyday interior in mid-flight and frozen at the instant
of exit: a desk, a chair, a filing drawer with its drawers fanned open, a
lamp still lit, a scatter of small objects, all arrested in a rising
diagonal plume that is far larger than the door it came through. Scale
shock and arrested motion carry the picture; the doorway stays small,
calm and exact, the plume enormous. The interior side of the doorway
glows warm; everything outside it is cool and open.

Palette: predominantly light and airy — warm off-white sky, pale muted
green ground, charcoal contours, warm-ochre interior light, with softened
cobalt and brick coral accents in the flying objects. Keep tonal range
light and clean so the cover reproduces well in print.

Requirements: square PNG, at least 1000 x 1000 pixels; at thumbnail size
it must read instantly as one bright doorway with a dark plume erupting
from it; memorable silhouette; coherent perspective, gravity, shadows and
object-to-object physics; important detail kept away from the extreme
edges.

Avoid: any typography, masthead, title, issue number, caption, logo,
pseudo-writing, glyph, numeral or watermark; darkness, muddy or crushed
tones; visual clutter for its own sake; arbitrary symbols; portals with
glowing rims, energy swirls, particle sparkles or other familiar
AI-futurist imagery; neon cyberpunk; photorealistic human figures; any
recognizable brand or franchise imagery.
</pre></details>
</figure>

<figcaption>opener-arc-agi-3 — variant 1</figcaption>
<details><summary>prompt</summary><pre>Original family-friendly children's science-comedy manga illustration,
entirely wordless, one playful visual idea only.

Scene: a curious school-age boy with round glasses kneels behind a
compact helper robot and flips two small toggle switches on a little
access panel in the robot's back — just two switches, nothing else on the
panel. In front of the robot, three identical small puzzle boards made of
coloured squares rise and stack neatly into the air, each one completing
itself as it lifts. The robot's posture straightens with surprise as the
third board settles. A tidy quiet study nook: pale plaster wall, a low
workbench edge, one soft cast shadow.

Style: simple charcoal contours, rounded readable expressions, economical
watercolour washes, minimal hatching, restrained halftone, quiet print
grain, slight pigment variation, subtle paper tooth.

Cast: exactly one boy and exactly one compact non-animal helper robot. No
other people, no other robots, no robot-faced appliances or machines.

Palette: gentle historical magazine colour at low to medium saturation,
chosen by the setting — softened cobalt walls, muted green workbench,
brick coral and warm ochre in the puzzle squares, dusty lavender shadow,
warm off-white breathing room, charcoal ink. At least three distinct
non-neutral colours. Never a single flat yellow paper field.

Format: square composition; the boy, the robot and the rising boards are
the essential subject and must sit safely inside the frame with margin on
all sides; strong silhouettes and print-friendly contrast, fully legible
at A5 page size.

Avoid: any resemblance to Doraemon, Nobita or any recognizable franchise
character, costume, face, silhouette or gadget; blue robotic cats;
uniform yellow, mustard, beige, sepia, cream-paper or bright cyan
backgrounds; extra humans or robots; decorative montages, contact sheets
or filler patterns; dense technical realism, steampunk clutter, heavy
crosshatching; modern glossy anime rendering, painterly concept art, neon
cyberpunk, photorealism; any lettering, numerals, pseudo-writing,
interface glyphs, captions, labels, speech balloons or watermarks;
multi-panel layout.
</pre></details>
</figure>
