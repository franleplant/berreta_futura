    body, warm-ochre brass locks, dusty lavender shadow, warm off-white
    breathing room, charcoal ink. At least three distinct non-neutral
    colours. Never a single flat yellow paper field.

    Format: square composition; the three plates and both figures are the
    essential subject and must sit safely inside the frame with margin on all
    sides; strong silhouettes, print-friendly contrast, legible at A5 size.

    Avoid: any resemblance to Doraemon, Nobita or any recognizable franchise
