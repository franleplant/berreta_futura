    a half-built little civic building — a small colonnade of four stubby
    columns and a plain pediment, clearly made of the same interlocking
    blocks. The cornerstone is plain and blank, no inscription. The robot
    braces the block with both arms; the boy checks the level with a simple
    spirit level. Bright open air, a wide horizon line, one clean shadow.

    Style: simple charcoal contours, rounded readable expressions, economical
    watercolour washes, minimal hatching, restrained halftone, quiet print
    grain, slight pigment variation, subtle paper tooth.

    Cast: exactly one boy and exactly one compact non-animal helper robot. No
    other people, no other robots, no robot-faced appliances.

    Palette: gentle historical magazine colour at low to medium saturation —
    warm off-white stone, muted green ground, softened cobalt sky band, brick
    coral pediment, warm-ochre and dusty lavender accents, charcoal ink. At
    least three distinct non-neutral colours. Never a single flat yellow
    paper field.

    Format: square composition; the cornerstone, both figures and the small
    colonnade are the essential subject and must sit safely inside the frame
    with margin on all sides; strong silhouettes, print-friendly contrast,
    legible at A5 size.

    Avoid: any resemblance to Doraemon, Nobita or any recognizable franchise
    character, costume, face, silhouette or gadget; blue robotic cats;
    uniform yellow, mustard, beige, sepia, cream-paper or bright cyan
    backgrounds; extra humans or robots; flags, seals, crests, scales of
    justice or other institutional clichés; decorative montages or filler
    patterns; dense technical realism, steampunk clutter, heavy
    crosshatching; glossy anime rendering, painterly concept art, neon
    cyberpunk, photorealism; any lettering, numerals, pseudo-writing,
    interface glyphs, captions, labels, speech balloons or watermarks;
    multi-panel layout.
  subject: The boy and the robot set a blank cornerstone at the foot of a small half-built civic colonnade.
