- id: opener-prime-agent
  purpose: opener
  article_id: prime-agent-a-self-improving-rlm-agent
  prompt: |
    Original family-friendly children's science-comedy manga illustration,
    entirely wordless, one playful visual idea only.

    Scene: the compact helper robot sits at a workbench building a better
    version of its own arm. Its right arm is detached and clamped in a small
    vice; the robot works on it with its left hand, fitting a neatly machined
    new joint. Three earlier discarded joints lie in a row on the bench,
    visibly cruder than the one being fitted. The boy with round glasses
    stands beside the bench holding a hand mirror at an angle so the robot can
    see its own shoulder socket. Warm workshop corner.

    Style: simple charcoal contours, rounded readable expressions, economical
    watercolour washes, minimal hatching, restrained halftone, quiet print
    grain, slight pigment variation, subtle paper tooth.

    Cast: exactly one boy and exactly one compact non-animal helper robot —
    the detached arm and the spare joints are parts, not a second robot, and
    no reflected robot may appear as a separate character in the mirror. No
    other people, no other robots, no robot-faced appliances.

    Palette: gentle historical magazine colour at low to medium saturation —
    muted green bench, softened cobalt robot, brick coral wall panel,
    warm-ochre brass joints, dusty lavender shadow, warm off-white breathing
    room, charcoal ink. At least three distinct non-neutral colours. Never a
    single flat yellow paper field.

    Format: square composition; robot, bench, spare joints, boy and mirror are
    the essential subject and must sit safely inside the frame with margin on
    all sides; strong silhouettes, print-friendly contrast, legible at A5
    size.

    Avoid: any resemblance to Doraemon, Nobita or any recognizable franchise
    character, costume, face, silhouette or gadget; blue robotic cats;
    uniform yellow, mustard, beige, sepia, cream-paper or bright cyan
    backgrounds; extra humans or robots; gore, distress or damaged-machine
    pathos — the mood is cheerful tinkering; decorative montages or filler
    patterns; dense technical realism, steampunk clutter, heavy
    crosshatching; glossy anime rendering, painterly concept art, neon
    cyberpunk, photorealism; any lettering, numerals, pseudo-writing,
    interface glyphs, captions, labels, speech balloons or watermarks;
    multi-panel layout.
  subject: The robot upgrades its own detached arm at a workbench, three cruder discarded joints beside it, while the boy holds a mirror so it can see.
  composition: Square, robot and bench filling the lower right, boy and angled mirror at the left, spare joints lined along the bench front edge, off-white space above.
  alt_text: A small robot at a workbench fits a new joint to its own detached arm beside three cruder discarded joints, while a boy holds up a mirror.
