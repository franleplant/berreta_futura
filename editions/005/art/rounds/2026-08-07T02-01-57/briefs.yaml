briefs:
- id: cover-synthetic-r9
  purpose: cover
  prompt: |
    Square, entirely text-free cover artwork for a print magazine, minimum 1000 x 1000 pixels:
    one poster-weight illustration in an original family-friendly children's science-comedy manga
    style — simple charcoal contour drawing of varying weight, economical watercolor washes with
    honest pigment variation and soft edges, minimal hatching, restrained halftone in a single
    shadow field, subtle paper tooth and quiet print grain, one playful visual idea, no words
    anywhere. Poster scale and poster confidence: bigger shapes, fewer of them, more air than an
    interior spot illustration.

    Cast: exactly one curious school-age boy with round glasses and one compact, friendly,
    non-animal helper robot with a simple rounded body and readable face. No other figures of any
    kind.

    The scene, one clean staged moment: an enormous wall clock, taller than a person, mounted low
    on a sunlit plaster wall. Its dial is completely blank — a plain warm off-white face inside a
    broad, fully saturated brick-coral rim, with two simple charcoal hands and nothing else on it
    at all. The boy stands near the top of a wooden step-ladder leaning against the wall, both arms
    braced against the long hand, pushing it around to a new position; his weight is visibly in the
    push and one heel is lifted off the rung. Below him the small robot plants its feet and braces
    the ladder's foot with both manipulators, tipping its head back to watch. A second, shorter
    hand rests where the boy has already set it. Late-afternoon light rakes in from the left, warm
    and generous, throwing one long exact shadow of ladder, boy and robot across the wall and the
    floor. The mood is warm, purposeful and inviting: the hours are being decided, by hand, for
    someone new.

    Palette: warm off-white plaster wall and dial as the neutral ground; fully saturated brick
    coral as the hero colour in the clock rim; saturated cobalt in the robot's body and the
    ladder's painted rails; charcoal ink contours and shadow; warm ochre sunlight; small muted
    green and dusty lavender accents in the floor and shadow. At least three distinct non-neutral
    colours. Saturated and print-clean with strong separation of values: no muddy passages, no
    crushed blacks, no washed-out pastel haze.

    Requirements: square PNG at least 1000 x 1000 pixels; at thumbnail size it must read instantly
    as one big coral ring on cream with a small ladder and two small figures against it; strong
    legible silhouettes and expressions that survive reduction to A5 and smaller; keep the whole
    dial, the whole ladder and both figures well inside the frame, away from the extreme edges;
    correct human anatomy and proportion, correct ladder mechanics and lean angle, correct contact
    points, correct weight, and one consistent light direction for every shadow.

    Avoid: any typography, masthead, title, issue number, caption, logo, pseudo-writing, glyph,
    watermark, and specifically any numerals, roman numerals, tick marks, minute marks or dial
    gradations on the clock — the dial is blank; speech balloons, panel borders, multi-panel or
    comic-strip layout; Doraemon, Nobita or any recognizable franchise character, blue robotic
    cats, signature franchise gadgets, copied costumes, faces or silhouettes; extra humans, extra
    robots, animals, or background appliances with robot faces; doors, doorways, portals, hinges,
    apertures or anything passing through an opening; crates, furnished rooms, beds or bedding;
    giant woven mats or doormats, parachutes or canopies settled over buildings, unrolling carpets
    off rooftops, bent or leaning towers, giant filing drawers bursting from hillsides, aircraft,
    honeycomb grids of empty cells, glowing foundry sprue trees, ceramic slabs, glazed sculpture,
    stained glass, embroidered banners, appliqué, crowds or queues, dressmaker's stands, toiles,
    pins, string, knots, torn-paper collage, balance beams, fulcrums, scale pans, counterweights,
    cantilevered slabs forming an enclosure, or abstract geometric solids as the subject; a flat
    uniform yellow, mustard, beige, sepia or cream-paper field standing in for a background;
    steampunk clutter, gear trains, exposed cabling, dense technical realism or heavy
    crosshatching; modern glossy anime rendering, painterly concept art, photorealism, 3D render
    or CGI look, matte painting, neon cyberpunk, glow, lens flare, chrome, gradient mesh or
    generic-AI futurism; night, fog, gloom or disaster staging; any recognizable brand, product or
    franchise imagery.
- id: cover-art-directed-r9
  purpose: cover
  prompt: |
    Square, entirely text-free cover artwork for a print magazine, minimum 1000 x 1000 pixels: a
    straight, immaculately staged overhead macro photograph of one large hand-made hard-enamel
    cloisonné pin lying face-up on a sheet of warm off-white cotton-rag paper. This is a real
    physical object photographed, never an illustration, vector graphic or digital render.

    The pin: circular, roughly 90 mm across, filling most of the frame. Polished brass cloisonné
    wires draw the artwork in the simple, confident contour language of a children's
    science-comedy illustration — clean rounded shapes, generous line weight, no fine detail.
    The image on the pin, wordless and complete in itself: a school-age boy with round glasses
    stands on tiptoe with a compact, friendly, non-animal helper robot riding on his shoulders,
    the robot stretching one manipulator up to take hold of a small warm-ochre lamp hanging high in
    the pin's upper field. The boy is braced and grinning with effort; the robot's reach has just
    succeeded. Exactly these two characters and nothing else.

    Enamel and metal: the pin's field is a fully saturated cobalt enamel, deep and glassy; the
    boy's jumper is a fully saturated brick coral; the robot is pale steel grey with one muted
    green panel; the lamp and its halo are warm ochre; the brass wires and the outer rim are
    polished warm gold. Material honesty is essential — a hand-polished bevel on the rim, one or
    two honest air bubbles frozen in the enamel, a faint circular polishing swirl catching the
    light, one wire very slightly out of true where it was bent by hand, a hairline of brass
    showing at a colour boundary, and a single loose brass butterfly clutch lying on the paper
    beside the pin, casting its own small exact shadow.

    Light and camera: one warm low raking light from the upper left; medium-format camera, roughly
    100 mm macro equivalent, f/11, shot square-on from directly overhead; natural depth of field
    with the enamel face crisply sharp; a correct, physically exact contact shadow under the pin's
    rim proving its thickness; specular highlights that follow the enamel's curvature; consistent
    fine film grain across the whole frame; no HDR, no compositing seams, no sticker or mock-up
    look. The picture is calm, warm and inviting, and should pull the viewer closer rather than
    shout.

    Palette: warm off-white paper ground, fully saturated cobalt enamel as the hero, saturated
    brick coral, warm ochre, polished brass gold, muted green and charcoal shadow. Saturated and
    print-clean with well-separated values: no crushed blacks, no muddy or murky passages, no sepia
    or vintage-distressed treatment.

    Requirements: square PNG at least 1000 x 1000 pixels; at thumbnail size it must read instantly
    as one bold blue disc with two small gold-outlined figures reaching upward inside it; strong
    legible silhouettes at small size; keep the entire pin, the lamp motif and the loose clutch well
    inside the frame, away from the extreme edges; correct human anatomy in the lifting pose,
    correct balance and contact between the two figures, correct enamel and brass materials,
    correct shadow direction throughout.

    Avoid: any typography, masthead, title, issue number, caption, logo, engraved lettering,
    maker's mark, stamped mark, pseudo-writing, glyph, numeral or watermark anywhere on the pin,
    the clutch or the paper; Doraemon, Nobita or any recognizable franchise character, blue robotic
    cats, signature franchise gadgets, copied costumes, faces or silhouettes; a third character,
    extra humans, extra robots, animals, or robot-faced background objects; human hands, fingers,
    arms or faces in the photograph; backing cards, packaging, jewellery displays, pin boards,
    lanyards, denim, cutting mats, rulers, tweezers, tools or any other props; embroidered patches,
    appliqué, banners, French knots, crowds or queues; ceramic slabs, glazed sculpture, hinged
    panels, stained glass, dressmaker's stands, toiles, string, knots, paper scraps or torn-edge
    collage; doors, doorways, portals, hinges or apertures; crates, furnished rooms or beds; giant
    woven mats, parachutes over buildings, unrolling carpets, bent towers, giant filing drawers,
    aircraft, honeycomb grids, foundry sprue trees, balance beams, fulcrums or scale pans;
    steampunk clutter, gear trains, rivets-and-pipes detailing or exposed cabling; screens,
    terminals, cables or floating interfaces; glossy anime rendering, painterly concept art, vector
    illustration, 3D render, CGI, matte painting, neon cyberpunk, glow, lens flare, gradient mesh
    or generic-AI futurism; night, gloom, fog or crushed tones; any recognizable brand, product or
    franchise imagery.
- id: cover-wildcard-r9
  purpose: cover
  prompt: |
    Square, entirely text-free cover artwork for a print magazine, minimum 1000 x 1000 pixels: a
    completely convincing documentary photograph of an impossible thing, played absolutely straight
    by the camera. Everything in the frame is a real object photographed with real optics and real
    light — except the two characters, who are unmistakably hand-drawn and are nevertheless
    physically present in the room.

    The real scene: an ordinary office swivel chair, fully saturated cobalt upholstery on a
    five-star base with real casters, standing alone on a warm pale timber floor in an empty,
    sunlit workroom. Low golden light pours in from the left across the boards. Nothing else is in
    the room but the chair, its long exact shadow, and a scuff of dust in the light.

    The impossible element: a school-age boy with round glasses and a compact, friendly,
    non-animal helper robot, both drawn by hand in charcoal contour and economical watercolour
    washes on paper — visible paper fibre, visible brush edges, soft pigment pooling, slight
    halftone, flat as drawings — are here in the room and behaving as solid bodies. The small drawn
    robot sits in the chair's seat; the cushion is genuinely compressed under it and the drawn
    figure creases slightly where it bends over the seat's front edge. The drawn boy stands on the
    floor beside the chair, up on tiptoe, one hand still on the height lever, which has just been
    released — the gas lift is caught mid-extension and the seat and its passenger are rising, the
    robot's arms flung out and delighted, the chair turning a few degrees as it goes. Both drawn
    figures cast true, physically exact shadows onto the real upholstery and the real floor, lit by
    the same golden window light as everything else. They are not cut-outs, standees or props:
    there are no mounts, stands, tabs, easels or supports of any kind, and no drop-shadow sticker
    effect — they simply occupy the room. One clean staged moment, warm and luring, with the whole
    picture carried by arrested motion and by the spatial invasion of drawings into a real space.

    Photography: golden hour, medium-format camera, roughly 50 mm equivalent lens, f/5.6, tripod,
    shot from a slight low angle a couple of metres from the chair. Natural depth of field with the
    chair and both figures sharp, correct caster contact and floor shadows, correct gas-lift
    mechanics, correct upholstery compression, correct perspective and lens geometry, consistent
    fine film grain across the entire frame including the drawn figures, honest single-source
    colour temperature, no HDR, no compositing seams, no painterly, matte-painting, 3D-render or
    CGI look anywhere in the photograph.

    Palette: fully saturated cobalt chair as the hero against a warm off-white wall and pale timber
    floor; warm ochre and amber sunlight; brick coral in the drawn boy's jumper; muted green in the
    robot's panel; charcoal contours and shadow; a dusty lavender note in the floor shadow. Bright,
    saturated and print-clean with well-separated values: no night, no gloom, no fog, no muddy or
    murky passages, no crushed blacks, no low-contrast haze.

    Requirements: square PNG at least 1000 x 1000 pixels; at thumbnail size it must read instantly
    as one bold blue chair in warm light with two small ink-drawn figures on and beside it, the
    seat visibly rising; unmistakable memorable silhouette and one unmissable visual event; keep
    the whole chair, both figures and all important detail well inside the frame, away from the
    extreme edges; correct human anatomy in the drawn boy, expressions legible at small size.

    Avoid: any typography, masthead, title, issue number, caption, logo, pseudo-writing, glyph,
    numeral, brand marking on the chair or watermark; Doraemon, Nobita or any recognizable
    franchise character, blue robotic cats, signature franchise gadgets, copied costumes, faces or
    silhouettes; speech balloons or panel borders; real human figures, hands or faces anywhere in
    the photograph; a third character, extra humans, extra robots, animals, or robot-faced
    appliances; cardboard standees, paper cut-outs on stands, easels, clips, tape, mounts or any
    visible support; doors, doorways, portals, glowing rims, energy swirls or particle sparkles;
    furniture, carpets or paper sheets flying through the air; unrolling ribbons off rooftops; bent
    towers or lit office boxes; giant filing drawers bursting from hillsides; parachutes settled
    over houses; aircraft; giant woven mats or doormats; honeycomb grids of empty cells; foundry
    sprue trees; ceramic slabs, glazed sculpture, hinged panels or stained glass; embroidered
    banners, appliqué, crowds or queues; dressmaker's stands, toiles, pins, string, knots or
    torn-edge collage; balance beams, fulcrums or scale pans; screens, monitors, terminals, cables
    or floating interfaces; office clutter, desks, plants, whiteboards, filing cabinets, blinds or
    ceiling grids; steampunk clutter or gear trains; darkness, storm gloom, fire, smoke, damage or
    disaster staging; neon cyberpunk or generic AI-futurist imagery; any recognizable brand, logo,
    product or franchise imagery.
