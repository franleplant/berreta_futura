<details><summary>prompt</summary><pre>Square, entirely text-free abstract cover artwork for a print magazine,
minimum 1000 x 1000 pixels. Single editorial reading: the thing that
actually works is already alight in the middle of the night, and the
structures being set up around it take all their light and all their
direction from it.

Composition: one compact abstract proposition built from six large,
confident geometric solids standing on a plain ground plane, seen from a
slightly elevated three-quarter angle, in deep night. Five heavy matte
solids — a broad low slab, a tall upright block, a thick wedge, a long
horizontal bar, and a disc standing on its edge — are arranged in a loose,
open, unfinished ring with clear gaps between them, each at a different
height and angle, none touching. At the centre of the ring, alone on the
plane, sits one small squat cylinder that is the only source of light in
the picture: its body is fully saturated marigold and its flat top face
burns near warm off-white. Its light rakes outward across the ring, so
every surrounding solid has a hot warm-ochre and brick-coral inner face
and a deep cobalt-and-charcoal outer face, and each throws one long,
physically exact shadow radiating outward across the plane like a spoke.
The upper two thirds of the frame is an unbroken field of deep saturated
cobalt night — charged empty air, not decorative margin. Nothing is
falling, nothing is broken, nothing is in flight: the image is calm,
staged and luring, and should pull the viewer closer rather than shout.

Treatment: matte printed solids with clean hard edges, controlled
dimensional shading and synthetic material depth, slight pigment
variation, subtle surface tooth and quiet print grain. Light is described
entirely by surface tone and by honest cast shadow — no atmospheric haze,
no bloom, no halo, no light rays, no lens flare. Colour is fully
saturated and print-clean, values strongly separated: the night reads as
deep saturated blue, never as black mud, and the lit core is the
unmistakable brightest point in the frame.

Palette (publication ink set only): deep saturated cobalt and softened
cyan for the night field and outer faces, charcoal ink for edge and
shadow, saturated marigold and warm ochre as the light, brick coral on
the lit faces, small muted green and dusty lavender accents in the ground
plane, warm off-white only at the hottest point.

Requirements: square PNG at least 1000 x 1000 pixels; at thumbnail size
it must read instantly as one hot gold core inside a dark ring of blocks
with shadows radiating outward; memorable calm silhouette; keep the lit
cylinder, every solid and all important detail well inside the frame,
away from the extreme edges; physically coherent geometry, contact
points, light falloff and shadow direction throughout.

Avoid: any typography, masthead, title, issue number, caption, logo,
pseudo-writing, glyph, numeral, tick mark, scale gradation or watermark;
literal diagrams, icon systems, arrows or wayfinding symbols; doors,
doorways, hinges, apertures, portals or anything passing through an
opening; slabs cantilevered inward to form an enclosure; a wedge striking
or shattering a mass; a beam balanced on a fulcrum, scale pans, chains or
counterweights; a huge mass leaning or curling over small blocks; an open
arc cradle with a ramp leaning on it; a plaster scoop-trough still life;
gestural brush or monoprint ink fields; airborne fragments, debris,
sparks, smoke, speed lines or particle dust; fire, embers, candles,
lanterns or literal lamps; water, waves or liquid; campfire or ritual
staging; ornamental complexity; glow bloom, lens flare, light rays, neon,
chrome or gradient mesh; photorealism, 3D render, CGI or matte painting;
human figures, hands or faces; robots, androids, screens or interfaces;
crushed blacks, murky passages, fog, gloom or low-contrast haze; any
recognizable brand, product or franchise imagery.
</pre></details>

<details><summary>prompt</summary><pre>Square, entirely text-free cover artwork for a print magazine, minimum
1000 x 1000 pixels: a straight, immaculately staged night photograph of a
real hand-bent neon sculpture, glowing on the wall of a dark workshop.
This is a real physical object photographed with real optics and real
light, never an illustration, vector graphic or digital render. Single
editorial reading: a small new thing has been given light of its own, and
the rules and protections being bent around it are made by hand, one
curve at a time.

The subject: three concentric hand-bent neon rings, the largest roughly a
metre across, mounted flat on a dark charcoal-blue plaster wall and shot
square-on. The outer ring glows fully saturated cobalt, the middle ring
saturated brick coral, and the small innermost ring burns warm marigold
gold and is by far the brightest thing in the frame. The rings are
plainly handmade and honest about it: real glass tubing with visible wall
thickness, small trapped bubbles and faint tooling marks in the bends,
one ring very slightly out of true where it was bent by hand, blacked-out
lengths of tube where a segment returns, ceramic electrode housings and
neat cloth-covered wires dropping from the bottom of each ring to a plain
steel transformer box mounted low on the wall. A loose coil of unlit
spare glass tubing hangs on a nail to the right, catching only reflected
colour. The neon light spills across the plaster and shows its trowel
texture, pools cobalt and coral on a plain timber bench below, and falls
away honestly into deep blue darkness at the frame's corners. Nothing
else is in the room. The mood is warm, quiet and inviting — the one lit
thing on a dark night, the kind of light you walk toward.

Light and camera: night, no other light source than the neon itself;
medium-format camera, roughly 80 mm equivalent lens, f/8, tripod, an
exposure long enough to hold the wall texture and the colour pools while
keeping the gold core from blowing out. Real optics and real physics —
correct inverse-square falloff from each ring, correct coloured
reflections on plaster, glass and timber, correct specular highlight
running along the front of each tube, natural depth of field with the
glass crisply sharp, consistent fine film grain across the whole frame,
no HDR, no compositing seams, no starburst filter, no lens flare.

Palette: deep saturated cobalt-charcoal night wall and darkness,
saturated cobalt, brick coral, saturated marigold gold, warm ochre spill
light, warm off-white only in the hottest tube core, a faint muted green
note in the deepest wall shadow. Fully saturated and print-clean with
well-separated values: no crushed blacks, no muddy or murky passages, no
fog, no low-contrast haze, no sepia or vintage-distressed treatment.

Requirements: square PNG at least 1000 x 1000 pixels; at thumbnail size
it must read instantly as three glowing concentric rings — blue, coral,
and a hot gold centre — burning on darkness; unmistakable memorable
silhouette; keep all three rings, the transformer box and the hanging
coil well inside the frame, away from the extreme edges; correct glass
and metal materials, correct wiring mechanics, correct shadow and
reflection direction throughout.

Avoid: any typography, masthead, title, issue number, caption, logo,
lettering, script or cursive neon, any tube bent into a shape that reads
as a letter, word, number, arrow, heart, star or symbol, signage,
maker's marks, pseudo-writing, glyph, numeral or watermark; bar, diner,
motel, arcade or shopfront staging; neon-cyberpunk cityscapes, rain-slick
neon streets, Tokyo or Hong Kong signage, purple-and-pink cyberpunk
grading; human figures, hands or faces; robots, androids, screens,
terminals, monitors or floating interfaces; ceramic slabs, glazed
sculpture, hinged panels, stained glass, leaded panels or church
iconography; embroidered banners, appliqué, French knots, crowds or
queues; dressmaker's stands, toiles, pins, basting thread, string, knots,
paper scraps or torn-edge collage; risograph or linocut poster styling;
cloisonné pins or enamel badges; giant woven mats, parachutes over
buildings, unrolling carpets, bent towers, giant filing drawers, aircraft,
honeycomb paper grids, foundry sprue trees, balance beams, fulcrums or
scale pans; doors, doorways, portals, glowing rims, energy swirls or
particle sparkles; steampunk clutter, gear trains, rivets-and-pipes
detailing or dense exposed cabling; workshop clutter, scattered tools,
rulers, torches or gas bottles beyond the transformer and the hanging
coil; fire, smoke, sparks, damage or disaster staging; painting,
illustration, painterly concept art, anime rendering, 3D render, CGI,
matte painting or generic-AI futurism; any recognizable brand, product,
logo or franchise imagery.
</pre></details>

<details><summary>prompt</summary><pre>Square, entirely text-free cover artwork for a print magazine, minimum
1000 x 1000 pixels: a completely convincing documentary night photograph
of an impossible thing, played absolutely straight by the camera. Single
editorial reading: a whole finished, lived-in room has been built for
someone new and is being lowered into the street at night, still warm and
still in use, seconds before it becomes part of the terrace.

The photograph: a narrow street of dark brick terraced houses at night.
Between two of the houses there is a clean rectangular gap exactly one
room wide, waiting. Hanging perfectly still about a metre above that gap,
suspended on four taut steel cables rising out of the top of the frame to
an unseen crane hook, is a complete finished room with its street-facing
wall entirely absent, so the whole interior is open to the camera like a
lit stage. Inside, everything is calm and unmistakably already in use: a
warm ochre table lamp lit on a small desk, a made bed with a brick-coral
blanket turned down, a chair pushed back, a rug, a cobalt-painted
skirting board, a kettle steaming gently on a small hob, a curtain
hanging dead plumb at the room's inner window. Nothing inside has
shifted; nothing is falling. Two slack-free nylon tag lines run down from
the room's lower corners to the street, one tied off to an ordinary iron
bollard, the other held taut by a sandbag. The room's light spills down
the brickwork on both sides of the gap, catches the cable strands, and
lays one bright gold trapezoid across the wet tarmac below. Everything
else in the street is deep saturated blue night, with a single distant
streetlamp far down the road. No people are present anywhere in the
frame. The picture is carried by scale, precarious suspension and
arrested motion — the held second before the room settles into its slot —
and by the pull of one warm lit interior on a dark street.

Photography: night, medium-format camera, roughly 35 mm equivalent lens,
f/5.6, tripod, a long exposure that holds the brick texture and the wet
road reflections while keeping the room's interior bright and readable.
Real optics and real physics throughout — correct cable tension and load
geometry for the room's weight, correct rigging attachment at all four
corners, correct interior light falloff and spill, correct reflections in
wet tarmac, correct perspective and lens geometry, natural depth of field
with the room crisply sharp, honest mixed colour temperature, consistent
fine film grain across the whole frame, no HDR, no compositing seams, no
painting, illustration, matte-painting, 3D-render or CGI look of any
kind.

Palette: deep saturated cobalt-indigo night sky and brickwork, saturated
warm ochre and marigold interior light as the hero, brick coral in the
blanket, saturated cobalt at the skirting and one neighbouring front
door, muted green in a strip of verge, warm off-white on the lit ceiling
and the light pool on the road, charcoal shadow. Bright, fully saturated
and print-clean with well-separated values: no gloom, no fog, no
crushed blacks, no muddy or murky passages, no low-contrast haze.

Requirements: square PNG at least 1000 x 1000 pixels; at thumbnail size
it must read instantly as one blazing gold rectangle hanging in a dark
blue street on four thin cables; unmistakable memorable silhouette and one
unmissable visual event; keep the whole suspended room, the gap beneath
it, the tag lines and all important detail well inside the frame, away
from the extreme edges.

Avoid: any typography, masthead, title, issue number, caption, logo,
house numbers, street signs, shop signage, number plates, crane markings,
pseudo-writing, glyph, numeral or watermark; human figures, hands or
faces anywhere in the frame; a freestanding doorway in a field with a
room erupting from it; furniture, carpets or paper sheets flying loose
through the air; unrolling ribbons or carpets off rooftops; bent or
leaning towers and lit office boxes on structures; giant filing drawers
bursting from hillsides; an airliner on a petrol-station forecourt;
parachutes settled over houses; honeycomb grids of paper cells; foundry
sprue trees; giant woven mats or doormats; ceramic slabs, glazed
sculpture, hinged panels or stained glass; embroidered banners, appliqué,
crowds or queues; dressmaker's stands, toiles, pins, string, knots or
torn-edge collage; hand-drawn or illustrated figures inside a photograph;
cobalt swivel chairs; portals, glowing rims, energy swirls or particle
sparkles; neon signage, neon-cyberpunk streets or purple-pink cyberpunk
grading; screens, monitors, terminals, cables or floating interfaces;
robots or androids; fire, smoke, explosions, wreckage, crash damage,
emergency vehicles, flashing lights, press or onlookers; storm, rain
streaks, fog, darkness or crushed tones; visual clutter, parked vehicles,
bins, scaffolding, power lines or site machinery beyond the cables
themselves; recognizable faces; any recognizable brand, logo, product or
franchise imagery.
</pre></details>
