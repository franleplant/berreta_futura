<h1>Art proof sheet — 005</h1>
<div class="grid">
<figure>
<img src="cover-synthetic-r2-v1.png" loading="lazy">
<figcaption>cover-synthetic-r2 — variant 1</figcaption>
<details><summary>prompt</summary><pre>Square abstract cover artwork for a print magazine issue whose single
editorial reading is: the tenant moved in before the house was built —
the worker already exists and works, and the walls, rules and
institutions are being cantilevered in around it, late and still
unclosed.

Composition: one compact abstract proposition built from five large,
confident geometric components on a substantial field of warm off-white
negative space. Four heavy rectangular slabs cantilever inward from
beyond the four frame edges at four clearly different heights and
depths, overlapping in plan but never touching each other, forming an
unfinished enclosure with visible open gaps at every corner. At the
centre of the enclosure, resting on a plain ground plane, sits one
small, crisp, complete solid — a compact brick-coral block, sharper and
more finished than anything surrounding it. The slabs are massive and
provisional; the small block is exact and already at home. Controlled
dimensional shading and synthetic material depth are welcome where they
strengthen the proposition: forms read as matte printed solids with
clean edges, honest cast shadows on the ground plane, and quiet print
grain.

Palette (publication ink set only): charcoal ink, softened cyan and
cobalt, brick coral, muted green, dusty lavender, small warm-ochre
accents, warm off-white. Low to medium saturation, print-friendly
contrast, no muddy or crushed darks.

Requirements: square PNG, at least 1000 x 1000 pixels; at thumbnail size
it must read instantly as four heavy planes closing in on one small
bright core; keep the central event and all important detail well inside
the frame, away from the extreme edges; physically coherent overlaps,
cantilevers, contact shadows and material relationships.

Avoid: any typography, masthead, title, issue number, caption, logo,
pseudo-writing, glyph, numeral or watermark; literal diagrams; icon
systems; arrows or wayfinding symbols; doors, doorways, hinges,
apertures or things passing through openings; ornamental complexity;
generic-AI futurism, glow, lens flare, neon, chrome or gradient mesh;
photorealism; human figures; any recognizable brand or franchise
imagery.
</pre></details>
</figure>

<figure>
<img src="cover-art-directed-r2-v1.png" loading="lazy">
<figcaption>cover-art-directed-r2 — variant 1</figcaption>
<details><summary>prompt</summary><pre>Square cover artwork: a straight-on studio photograph of a tailor's
unfinished test garment on a dressmaker's stand, for a print magazine
issue whose single editorial reading is that the institutions, rules and
protections we are now drafting are being fitted, in a hurry, to a body
that is already standing here and already working.

The object: a plain calico toile — an unfinished first fitting garment —
on a worn wooden-footed dressmaker's stand. It is visibly mid-fitting
and provisional: one side seam still open and held closed by a rank of
steel pins that catch the light; long basting stitches in brick-coral
thread run in loose visible lines across the bodice; two panels pieced
in from different cloth, one muted green and one dusty lavender, where
the calico ran out; one sleeve detached entirely and hanging from a
single basting thread at the shoulder; a softened cobalt cloth measuring
tape draped over the neck of the stand. The garment is empty — the
shape of a body that is not there. Honest material: visible weave, pin
glint, fabric weight, small creases, a real seam allowance turned back.
Hard raking light from the upper left across a warm off-white seamless
ground, with one long, physically exact contact shadow proving the
stand's weight and the hanging sleeve's swing.

Palette: charcoal, softened cyan and cobalt, brick coral, muted green,
dusty lavender, warm-ochre accents, warm off-white. Low to medium
saturation, clean print reproduction, no crushed blacks.

Requirements: square PNG, at least 1000 x 1000 pixels; unmistakable
legible silhouette at thumbnail size — an empty garment form, one sleeve
swinging free; important detail kept well away from the extreme edges;
convincing cloth, correct pin and stitch mechanics, correct contact
shadows and drape.

Avoid: any typography, masthead, title, issue number, caption, logo,
pseudo-writing, tailor's chalk marks that read as letters or numbers,
glyph or watermark; loose string, knots, paper scraps, torn-edge
collage, pattern-paper montage or pinned diagrams; human figures, faces
or hands; mannequin heads or limbs; doors, doorways or hinges; ceramic,
glazed or geometric sculpture; sewing-room clutter, scattered tools,
spools, scissors or fabric bolts; generic-AI futurism, glow, neon,
chrome; any recognizable brand, label or franchise imagery.
</pre></details>
</figure>

<figure>
<img src="cover-wildcard-r2-v1.png" loading="lazy">
<figcaption>cover-wildcard-r2 — variant 1</figcaption>
<details><summary>prompt</summary><pre>Square cover artwork with a single surprising, immediately legible
proposition, for a print magazine issue about a new kind of worker that
has to be accommodated: given rooms, money, hours, rest and rules — and
about the welcome being wildly out of proportion to the small
institution offering it.

The image: a colossal brick-coral runner carpet unrolling off the roof
of a small, plain, flat-roofed concrete building alone on a vast pale
muted-green plain. The rolled drum — many times taller than the building
itself — is tipping over the parapet at the moment of no return, and the
unrolled length has already arced out and down for hundreds of metres in
a single bold curve, frozen in mid-fall, its far end still well above
the ground and rippling. The building beneath stays small, calm and
exact; the carpet is enormous and utterly committed. A high flat warm
off-white sky, a long precise shadow of the arc raking across the plain,
correct catenary sag, correct carpet weight, correct perspective. Scale
shock, precarious balance and arrested motion carry the picture.

Palette: predominantly light and airy — warm off-white sky, pale muted
green plain, charcoal contours and shadow, brick coral carpet, with
small softened cobalt and warm-ochre accents on the building. Keep the
tonal range light and clean so the cover reproduces well in print.

Requirements: square PNG, at least 1000 x 1000 pixels; at thumbnail size
it must read instantly as one bold coral ribbon sweeping across a pale
field from a tiny building; memorable silhouette; coherent gravity,
perspective, shadow and material physics; important detail kept away
from the extreme edges.

Avoid: any typography, masthead, title, issue number, caption, logo,
pseudo-writing, glyph, numeral or watermark; doors, doorways, portals,
glowing rims, energy swirls or particle sparkles; rooms or furniture in
flight; darkness, muddy or crushed tones; visual clutter for its own
sake; arbitrary symbols; red-carpet paparazzi staging, crowds, vehicles
or spectators; neon cyberpunk or generic AI-futurist imagery;
photorealistic human figures; any recognizable brand or franchise
imagery.
</pre></details>
