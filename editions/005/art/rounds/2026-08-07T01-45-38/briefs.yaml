briefs:
- id: cover-synthetic-r7
  purpose: cover
  prompt: |
    Square cover artwork for a print magazine: a straight, immaculately
    staged photograph of a small hand-made sculptural still life, built
    from cast plaster and hand-carved painted wood, shot on a warm
    off-white seamless ground. The single editorial reading: the same
    small measure, issued over and over, is what makes an unlimited
    thing safe to let loose.

    The objects — six geometric components in all, three of them large,
    on a broad field of warm off-white negative space:

    1. A very large, thick, broad scoop-trough of cast plaster painted a
       fully saturated vermilion-coral, tilted forward and to the right,
       occupying the upper left and centre. Its lip is squared and
       precise; its inner face reads a half-tone deeper than its outer
       face.
    2. A slender warm-ochre carved hardwood wedge propping the trough's
       underside, plainly load-bearing and plainly hand-cut.
    3. A low stepped platform of pale unpainted plaster crossing the
       lower right, with three identical shallow square recesses milled
       into its top surface, evenly spaced.
    4-6. Three identical small cubes of carved hardwood painted a
       saturated cobalt blue. Two sit seated and square in their
       recesses. The third is held in mid-air between the trough's lip
       and the empty third recess, supported on one fine, honestly
       visible brass pin — the craft is not hidden, and the pin is part
       of the picture.

    Material honesty is essential: visible mould seams and a few faint
    bubble pits in the plaster, wood grain rising faintly through matte
    hand-brushed casein paint, brush texture in the vermilion, one or
    two tiny chips at the carved edges, a trace of plaster dust in a
    crease, quiet paper tooth in the seamless ground. Everything must
    read as real material photographed, never as digital rendering or
    3D visualisation.

    Light and camera: one warm low raking light from the left, long,
    soft, physically exact contact shadows across the seamless ground;
    medium-format camera, roughly 80 mm macro equivalent, f/11, a
    straight-on and slightly elevated view, natural depth of field with
    the cobalt cubes crisply sharp, consistent fine film grain across
    the whole frame, no HDR, no compositing seams. Nothing is falling,
    broken or in flight; the picture is calm, exact and quietly
    inviting, and should pull the viewer closer rather than shout.

    Palette: warm off-white ground and pale plaster, saturated
    vermilion-coral hero, saturated cobalt accent, warm ochre, charcoal
    for shadow and edge. Colour fully saturated and print-clean — no
    muted pastels, no washed-out tints, no sepia or vintage-distressed
    treatment, no moody darkness, no crushed blacks. Attached reference
    covers govern colour character, saturation level and print finish;
    follow them for feel, not for composition or motif.

    Requirements: square PNG, at least 1000 x 1000 pixels; at thumbnail
    size it must read instantly as one big coral scoop above a pale step
    with three small blue cubes; memorable calm silhouette; keep the
    trough lip, the platform, all three cubes and every important detail
    well inside the frame, away from the extreme edges; physically
    coherent contact points, support, weight and shadow direction
    throughout.

    Avoid: any typography, masthead, title, issue number, caption, logo,
    pseudo-writing, glyph, numeral, tick mark, scale gradation or
    watermark; literal diagrams, icon systems, arrows or wayfinding
    symbols; doors, doorways, hinges, apertures or things passing
    through openings; slabs cantilevered inward to form an enclosure; a
    wedge striking or shattering a mass; a beam balanced on a fulcrum,
    scale pans, chains or counterweights; a huge mass leaning or curling
    over small blocks; an open arc cradle with a ramp leaning on it;
    airborne fragments, debris, sparks, smoke, speed lines or particle
    dust; water or liquid; ornamental complexity; glow, lens flare,
    neon, chrome or gradient mesh; any CGI, 3D-render, matte-painting,
    painterly or illustrated look; human figures, hands or faces;
    workshop clutter, scattered tools, rulers or set squares; any
    recognizable brand or franchise imagery.
- id: cover-art-directed-r7
  purpose: cover
  prompt: |
    Square cover artwork for a print magazine: a bright, straight
    photograph of real foundry work in a daylit workshop. The single
    editorial reading: the new workforce arrives all at once, cast from
    one mould, identical and countless — and every single one of them
    still has to be counted, paid and accounted for.

    The subject: a freshly shaken-out sand-casting sprue tree standing
    upright in a shallow bed of pale warm casting sand inside a
    hand-made wooden moulding flask on a pale timber bench. One central
    vertical runner carries about forty short radial gates, and on the
    end of every gate is an identical plain disc the size of a thumbnail
    — utterly blank on both faces, no markings of any kind. The tree is
    minutes old: the discs nearest the top of the runner still glow a
    fully saturated hot orange, cooling outward and downward through
    straw and pale gold to matte grey at the lowest ring, so the whole
    branching form carries one continuous heat gradient. A single
    saturated cobalt-blue enamelled steel pair of tongs lies at the
    bench edge in the foreground, the one cool colour in the frame.

    Material and process honesty: green sand with visible grain and a
    crisp parting line, sand still clinging to the lower discs, a fine
    feather of flash on two of the gates, a scorched ring on the bench
    where the flask was set down, the faint optical shimmer of heat
    directly above the crest — shimmer only, no smoke, no flame, no
    spark shower. The work is calm and finished, not dramatic. It must
    read as real metal, real sand and real timber photographed, never as
    illustration, painting or digital rendering.

    Light and camera: bright overcast daylight from a large window at the
    left, plus the metal's own warm glow lighting the sand around the
    base; medium-format camera, roughly 80 mm macro equivalent, f/8, a
    slight low three-quarter angle so the tree stands proud against a
    plain warm off-white workshop wall. Real optics and real physics —
    natural depth of field with the crest sharp, correct contact shadows
    under the flask, correct incandescent colour falloff, consistent fine
    film grain across the whole frame, no HDR, no compositing seams.
    Keep the image bright and well separated in value: this is a sunlit
    workshop, not a dark foundry.

    Palette: warm off-white wall and pale timber bench, pale warm sand,
    fully saturated hot orange and amber metal as the hero, warm ochre
    reflected light, one saturated cobalt accent in the tongs, charcoal
    in the shadows. Fully saturated and print-clean — no muted pastels,
    no sepia, no darkness, no crushed blacks, no murky passages, no
    low-contrast haze. Attached reference covers govern colour
    character, saturation level and finish; follow them for feel, not
    for composition or motif.

    Requirements: square PNG, at least 1000 x 1000 pixels; at thumbnail
    size it must read instantly as one glowing branching tree of
    identical discs standing in pale sand; unmistakable memorable
    silhouette built from the runner and its radiating gates; correct
    casting geometry, correct heat colour, correct sand and metal
    materials; keep the whole tree, the flask and all important detail
    well inside the frame, away from the extreme edges.

    Avoid: any typography, masthead, title, issue number, caption, logo,
    pseudo-writing, stamped marks, mint marks, dates, numerals, glyphs
    or watermark on the discs or anywhere else; coins with faces,
    heraldry or relief devices; fire, smoke plumes, spark showers,
    pouring molten streams, crucibles tipping, disaster or forge-drama
    staging; darkness, night, gloom or crushed tones; human figures,
    hands or faces; ceramic slabs, glazed sculpture or hinged panels;
    stained glass or leaded panels; dressmaker's stands, toiles, pins,
    basting thread, string, knots, paper scraps or torn-edge collage;
    embroidered banners, appliqué, crowds or queues of figures; giant
    woven mats or doormats; parachutes over buildings; aircraft;
    doors, doorways, portals or things passing through openings; robots,
    androids, screens, terminals, cables or floating interfaces;
    steampunk clutter, gear trains or rivets-and-pipes detailing;
    scattered workshop clutter beyond the flask and the tongs; linocut,
    silkscreen or vintage-poster styling; painterly concept art, anime
    rendering, 3D render, matte painting, neon cyberpunk or generic-AI
    futurism; any recognizable brand, logo or franchise imagery.
- id: cover-wildcard-r7
  purpose: cover
  prompt: |
    Square cover artwork: a completely convincing macro photograph of a
    hand-built paper-and-card diorama, played absolutely straight by the
    camera, for a print magazine. The single editorial reading: we have
    started building housing for a population that has not arrived yet,
    and so far exactly one light is on.

    The built subject: a vast honeycomb field of identical small
    open-topped rooms — a dense rectangular grid of cells, each cell a
    little square room with four low walls and a bare floor, laid out
    flat and running off all four edges of the frame with no visible
    end. The cell walls are cut from heavy card painted a fully
    saturated cobalt blue; the floors are warm off-white paper. Seen
    from a high oblique angle so hard raking sunlight drives long, exact
    shadows down inside every cell and the grid reads as a deep blue
    field of light and shadow.

    Every cell is empty except one, well inside the frame and just right
    of centre. That single cell is finished and inhabited: a hand-made
    miniature bed with a brick-coral paper blanket, a small chair and a
    table in warm ochre card, and a real working grain-of-wheat lamp so
    the cell's four walls, its floor and the rims of its neighbours glow
    warm amber, spilling a small pool of gold across the surrounding
    blue. It is the brightest point in the picture by a wide margin.

    Along one row toward the upper left the estate is still going up:
    three cells are bare basswood frames with no card walls yet, and one
    loose cobalt wall panel stands propped at an angle, caught
    mid-installation and clearly not yet fixed.

    Material honesty is the whole point — this must read as real paper
    photographed, never as illustration or digital rendering: 300 gsm
    card with visible fibre and grain, scalpel-cut edges very slightly
    furred and showing the white core, matte gouache with genuine brush
    texture and faint streaking, light scoring lines at every fold, one
    small bead of dried PVA glue catching the sun at a wall joint, a
    scatter of paper dust in a corner cell, and one wall a hair out of
    square.

    Light and camera: low warm sunlight raking from the upper left;
    medium-format camera, roughly 65 mm macro equivalent, f/11, natural
    depth of field with the lit cell and its neighbours crisply sharp
    and the far grid softening honestly toward the top of the frame;
    correct shadow lengths and directions everywhere, correct light
    falloff from the single tiny lamp, consistent fine film grain across
    the whole frame, no HDR, no compositing seams. The picture is calm,
    warm and inviting; the drama comes from scale and from that one
    light, not from spectacle.

    Palette: fully saturated cobalt blue card as the hero field, warm
    off-white paper floors and ground, warm ochre and amber lamplight,
    small brick-coral accents at the blanket and the propped panel,
    charcoal shadow. Bright, fully saturated and print-clean, values
    well separated — no night, no gloom, no fog, no muddy or murky
    passages, no crushed blacks, no low-contrast haze, no sepia or
    vintage treatment. Attached reference covers govern colour
    character, saturation level and finish; follow them for feel, not
    for composition or motif.

    Requirements: square PNG, at least 1000 x 1000 pixels; at thumbnail
    size it must read instantly as one deep blue honeycomb field
    running off every edge with a single hot gold cell burning inside
    it; unmistakable memorable silhouette and an unmissable single
    visual event; keep the lit cell, the unfinished row and the propped
    panel well inside the frame, away from the extreme edges.

    Avoid: any typography, masthead, title, issue number, caption, logo,
    pseudo-writing, room numbers, tiny signage, printed pattern, glyph,
    numeral or watermark; doors, doorways, portals, glowing rims, energy
    swirls or particle sparkles; paper sheets, furniture or carpets
    flying through the air; unrolling ribbons off rooftops; bent towers,
    leaning towers or lit office boxes on structures; giant filing
    drawers bursting out of hillsides; parachutes settled over houses;
    aircraft anywhere; giant woven mats or doormats; ceramic slabs,
    glazed sculpture or hinged panels; stained glass; dressmaker's
    stands, toiles, pins, basting thread, string, knots or torn-edge
    collage; crowds, queues or figures of any kind; human figures, hands
    or faces; robots, androids, screens, terminals or floating
    interfaces; honeycomb read as beehives, insects or hexagons; night,
    storm gloom, fire, smoke, damage or disaster staging; visual clutter
    beyond the grid, the lit cell and the unfinished row; cutting mats,
    scalpels, rulers or modelling tools in shot; painting, illustration,
    matte painting, concept art, 3D render or CGI look; neon cyberpunk
    or generic AI-futurist imagery; any recognizable brand, logo or
    franchise imagery.
