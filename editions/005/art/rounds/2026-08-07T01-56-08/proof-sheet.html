<figure>
<img src="cover-synthetic-r8-v1.png" loading="lazy">
<figcaption>cover-synthetic-r8 — variant 1</figcaption>
<details><summary>prompt</summary><pre>Square text-free cover artwork, minimum 1000 x 1000 px, for a print magazine issue whose reading is: a new kind of worker has arrived, and rooms, ledgers, wallets and rules must be made around its ongoing work. Synthetic branch in a bold monoprint lineage: one compact abstract proposition built from five to seven large gestural ink forms on a broad warm off-white field. Arrange four sweeping cobalt-violet and charcoal brush fields as a turbulent but coherent current crossing the centre; each field has a different pressure, edge and direction, with visible brayer drag and lifted pigment. At their crossing sits one very small saturated warm-orange circular mark, crisp and perfectly registered, the only calm element and the visual key: the worker already present while the surrounding systems learn to channel it. Add only restrained brick-coral and muted-green secondary marks where they clarify the structure. Use physical monoprint evidence: uneven ink density, plate wipe, dry-brush streaks, slight pigment skips, visible paper tooth and quiet print grain. Keep the silhouette legible at thumbnail size, preserve substantial negative space, and keep all important marks away from extreme edges. Publication palette only: charcoal, softened cyan and cobalt, brick coral, muted green, dusty lavender, warm ochre accent, warm off-white; saturated but clean, no muddy blacks. No typography, masthead, title, issue number, caption, logo, pseudo-writing, glyph, watermark, literal diagram, icon system, arrows, doors, rooms, furniture, human figures, robots, recognizable brands, collage, photorealism, CGI, neon, glow, lens flare, chrome, gradient mesh, ornamental complexity or generic-AI futurism.</pre></details>
</figure>

<figure>

<figcaption>cover-art-directed-r8 — variant 1</figcaption>
<details><summary>prompt</summary><pre>Square text-free cover artwork, minimum 1000 x 1000 px, for a print magazine issue about giving a newly arrived kind of worker the rooms, records, payments and rules it needs. Art-directed branch: a hand-pulled four-color risograph poster, photographed or scanned straight-on as a physical print. Make one deliberate abstract still life of three enormous overlapping circular ink fields, each a different imperfectly registered layer: saturated cobalt, brick coral and muted green. Their overlaps form a single irregular central clearing of warm off-white. In that clearing place one tiny warm-ochre crescent of ink, sharply printed and isolated; it is the small permission that makes the surrounding apparatus usable. The circles must feel like pressure plates or pooled resources, not symbols or diagrams. Use unmistakable risograph material character: visible halftone dots, slight registration drift, fibrous uncoated paper, edge chatter, uneven ink coverage and a few honest pinhole skips. Composition is calm, balanced and immediately legible at thumbnail size, with all essential shapes safely inside the frame and generous breathing room. Palette: charcoal ink, softened cyan and cobalt, brick coral, muted green, dusty lavender, warm ochre accent and warm off-white; low-to-medium saturation but strong clean contrast for print. Absolutely no typography, lettering, numbers, captions, logos, pseudo-writing, glyphs or watermark; no literal ledgers, wallets, doors, rooms, furniture, human figures, robots, string, knots, paper scraps, collage, photorealism, CGI, neon, glow, chrome, gradient mesh, ornamental clutter, franchise imagery or generic AI-futurist effects.</pre></details>

<figcaption>cover-wildcard-r8 — variant 1</figcaption>
<details><summary>prompt</summary><pre>Square text-free cover artwork, minimum 1000 x 1000 px, a completely convincing documentary photograph of an impossible physical printmaking event. The issue's reading is: a new worker is already active, while the human systems that house, account for, pay and govern it are still being improvised. Photograph a colossal freshly hand-inked linocut sheet spread across a real print shop floor, seen from a low three-quarter angle with natural optics and coherent light. The carved image on the sheet depicts one improbable event: four immense saturated ink currents have flowed out from separate carved channels and are physically pooling around one tiny untouched warm-orange island of clean paper; the currents stop just short of touching it, as if an entire institution is carefully making room for one active point. The linocut itself is bold and abstract, with large charcoal, cobalt, brick-coral and muted-green hand-inked fields, rough gouged edges, carved furrows, brayer streaks, slight color misregistration, paper tooth and a few authentic drying variations. The camera plays the impossible scene straight: real paper thickness, wet ink sheen, floor contact shadows, consistent film grain, bright clean exposure, no compositing or digital-render appearance. The orange island must read as the unmistakable thumbnail event, with all important detail safely inside the square crop. Publication-compatible palette may include warm off-white, dusty lavender and small warm-ochre accents; keep values separated and printable. No typography, title, labels, numerals, pseudo-writing, logos, watermark, literal diagrams, icon systems, doors, rooms, furniture, flying paper, human figures, robots, vehicles, fire, smoke, darkness, muddy tones, neon, glow, lens flare, chrome, CGI, painting, generic AI-futurism or recognizable brand/franchise imagery.</pre></details>
