  art_path: editions/005/art/rounds/2026-08-07T02-01-57/cover-art-directed-r9-v1.png
  back_text: 'A new kind of worker moved in before its house was built. It does not tire, it forgets
    nothing it is allowed to keep, and it works at a pace no institution was drawn for. This issue
    reports on the building: rooms for its memory, wallets for its spending, benchmarks for its work,
    rules for its rest, and doors that say which parts of the world are real. Build the doors. Write
    on them.'
