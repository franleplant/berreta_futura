  notes: '## Round 2 notes. Read these first; the round 1 notes follow.


    **The governing constraint of this round.** The round 1 fact-check passed with zero findings because
    the manuscript was word for word the author''s. That is the thing this piece has, and it is easy to
    lose while clearing line findings, because four of the seven findings can only be "fixed" by rewriting
    his sentences. So round 2 was built on one rule: **every repair is editor-owned text or editor-owned
    formatting, and no sentence of Dex Horthy''s was reworded, merged, split, or reordered.** Three findings
    are cleared that way, one is cleared with a single punctuation mark, and three are declined with reasons
    below. If a round 3 clears the declined three by editing the author, it will trade a minor line finding
    for a major fact-check finding.


    ### Finding 1, opening. Cleared: cut plus a labeled standfirst.


    The author''s first paragraph is gone from the body and the reprint now begins where the line editor
    named as the earliest repair point, "Even before AI, only 25–50% of the time to ship a feature was
    writing the code itself."


    The information in that paragraph is not lost; it is restated as editorial context in the standfirst,
    in the editor''s voice and visibly labeled, which is what `prompts/faithful-edit.md` permits for a
    necessary addition. This is also why the cut is not a fact-check problem: the paragraph is publishing
    chrome for a blog the reader is not holding, and every substantive thing it said (standalone publication,
    addendum to a series, didn''t fit the main post, referenced in part 2) survives above the first heading.


    Why the standfirst sits before `## Seeking leverage` rather than anywhere else: the format section
    requires the body to open on a paragraph so the illustrated opener can set it, and the first heading
    is a pinned figure anchor. The standfirst is the only thing that can occupy that slot once the author''s
    opener is cut. A standfirst is the normal magazine furniture for that position anyway.


    **What the standfirst deliberately does not say.** It calls the series "a recent series of his" rather
    than naming it *Why Software Factories Fail*. The source says "the recent series" in one sentence
    and names "Why Software Factories Fail part 2" in another; that they are the same series is an inference,
    well supported and almost certainly right, but an inference. Naming it would be the one manufactured
    claim in an otherwise clean piece. The italicized part-2 title is quoted from the source exactly,
    still with no link, because the source gives none.


    ### Finding 5, jargon. Cleared inside the same standfirst.


    The gloss is two clauses, both derived from sentences on the page rather than from the series:


    - "a factory is the setup you drop a prompt into and hope to get a fully-mergeable result back from"
    is read straight off "if you yolo a two-sentence prompt into your factory, your chance of getting
    a fully-mergeable result is ~50%".

    - the levels clause lists the three level-words the author actually uses ("Product", technical details,
    50kft to 10kft) and says they are phases of planning one piece of work, which is his own "multiple
    phases of planning, zooming in from 50kft view all the way to the 10kft view".


    Nothing in the gloss comes from outside the extraction. If a fact-checker challenges any of it, the
    honest fallback is to shorten the gloss, not to source it from the series.


    ### Finding 2, house_style. Cleared: attribution label plus one formatting change.


    Two defects at one site, both editor-owned.


    1. **`**note**` was unattributable.** It is now **Author''s note.** The marker is the author''s own;
    expanding a bare lowercase marker into a readable label is labeling, not writing, and it now reads
    unambiguously against the **Editor''s note.** at the top of the piece. The two labels do work for
    each other: with both present, a reader can tell at a glance which voice each block is in.

    2. **The sentence was severed mid-clause by a display quote.** "For this example I''m gonna blur"
    / blockquote / "into a single percentage number but obviously they''re two separate variables" is
    one sentence, and on a rendered A5 page the reader has to reassemble it across a pulled-out block.
    The quoted phrases are now inline, inside the sentence, with their quotation marks intact. Not one
    word moved, and the internal quotation marks are the author''s own. One comma was added before "but
    obviously", which is a punctuation normalization on a sentence that is now longer on the page.


    The payoff is that `expected pain = P(you''ll have to change it) × how painful the change is` is the
    only display block in the piece and gets the emphasis back. That formula is the definition everything
    after it runs on; it must stay a display block.


    ### Finding 6, dead_words. Half cleared.


    The comma splice is gone: "your chance of getting a fully-mergeable result is ~50%; the chance you
    have to rework it is 50%." A semicolon is print typography and is explicitly in scope for this mode.


    The other half, that the second clause is the arithmetic complement of the first, is **declined**.
    Removing it would delete an author''s clause on a stylistic judgment, on the sentence that sets up
    the entire model, and it is defensible as the author''s own emphasis: he is naming the rework probability
    because rework is the quantity the rest of the piece tracks. The splice was what made the restatement
    read as a second, separate figure; with the semicolon, the second clause reads as the restatement
    it is.


    ### Finding 3, repeated_cadence. Declined, and this is the right call.


    Six instances of "If you X, (then) Y" in 495 words is a real observation, and the reviewer capped
    it at minor and said why: "the repair requires rewording the author''s own sentences." In `faithful_edit`
    that is not a repair, it is the failure mode the mode exists to prevent. `docs/WRITING_RULES.md` is
    explicit that it "governs only the text you write yourself" and that a source sentence is never rewritten
    for using a banned construction; the same logic covers a repeated sentence shape. The conditional-addressed-to-you
    cadence is also this author''s register, and edition 004 already shipped one piece damaged by an editor
    deciding a sentence of his needed improving.


    If a future editor genuinely cannot live with it, the honest route is a mode conversion, not a quiet
    rewrite.


    ### Finding 4, ending. Declined.


    "Good luck." stays. `prompts/faithful-edit.md` names it in its hard rules as one of the two examples
    of why the mode exists ("''they are selling bullshit'' and ''Good luck.'' are the reason this mode
    exists"), and `docs/WRITING_RULES.md` quotes it under "Openings and endings" as a model close. Cutting
    it to satisfy a minor line finding would put the manuscript in direct conflict with both documents.
    It is also the fix that edition 004 got wrong in the other direction: that version welded an invented
    antithesis close on ahead of the sign-off, which is how the piece acquired a banned tic. Nothing goes
    before "Good luck." here.


    The capitalization is inherited from round 1 and is still the one call that could go either way; the
    author wrote "good luck." lowercase, plausibly as X-post style. Restoring the lowercase costs nothing
    and breaks nothing.


    ### Finding 7, orphan_referent. Declined, with a partial mitigation.


    "our combined ''expected pain''" and "This is what we mean by leverage" are the author''s pronouns
    and there is nothing in the extraction that names a company, a team, or a co-author. Any gloss would
    have to invent one. The standfirst mitigates it as far as honesty allows by establishing that the
    piece belongs to a series with continuing vocabulary, which makes the "we" read as the series rather
    than as an unnamed employer. That is not a full repair and should not be reported as one.


    ### Length


    The manuscript is roughly 560 words against a seven-page budget, up from 495. The standfirst added
    about 95 and the cut opener removed about 42. Round 1''s warning still stands and matters more now
    that an addition exists: **do not add prose to reach the budget.** There is nothing left in the extraction
    to restore, and the two labeled blocks in this piece are the maximum editorial apparatus it can carry
    before the reader starts hearing the magazine instead of the author.


    ---


    ## Round 1 notes, carried forward and corrected where round 2 changed them


    **Scope of the edit.** The extraction is 16 body paragraphs including two display quotes. All of the
    author''s prose is still present, in source order, with no paragraph merged, split, or reordered,
    **except** the opening paragraph, which round 2 cut under finding 1 and replaced with an editor''s
    standfirst. One display quote is now inline (finding 2). Those are the only structural differences
    from the source.


    **Chrome removed.**

    - The `dex` / `@dexhorthy` handle block. Byline and author note live in the `edition.yaml` row.

    - The H1 `# Pragmatic Leverage in the Software Factory`. Title lives in `edition.yaml`; the format
    section forbids an H1.

    - The opening logistics paragraph, as of round 2, per finding 1.

    - Nothing else. There was no navigation, advertising, or subscription furniture in the extraction.


    **Load-bearing sentences still judged untouchable.**

    - "Even before AI, only 25–50% of the time to ship a feature was writing the code itself." The whole
    argument rests on this fraction, and as of round 2 it is also the piece''s opening line.

    - The three-rung ladder: yolo prompt at ~50%, hand-written spec at ~10%, write every line yourself
    at zero. Removing any rung breaks the curve the next paragraphs describe.

    - The author''s note and the formula. The note is where he admits he is collapsing two variables into
    one number, and the formula is the piece''s only definition.

    - "There''s no perfect process for this." His own hedge. Deleting it makes the argument more confident
    than he made it.

    - "Good luck."


    **Every typography change in the file, complete list.**

    - Numeric ranges to en dashes: `25-50%` → `25–50%`, `2-4 hours` → `2–4 hours`, `10-20 minutes` → `10–20
    minutes`, `2-3x` → `2–3x`. No U+2014 appears anywhere.

    - Missing apostrophes repaired: `Lets assume` → `Let''s assume`, `Now lets say` → `Now let''s say`,
    `its possible` → `it''s possible`. Typing slips in an X post, not style. `Nothing''s`, `you''ll`,
    `won''t`, `didn''t`, `I''m gonna`, `yolo`, `50kft`, `10kft` are all left alone.

    - `good luck.` → `Good luck.` See finding 4 above.

    - The part-2 reference is italicized as a title, now inside the standfirst. No link invented.

    - One spaced hyphen became a comma: "This is what we mean by leverage, and it requires being pragmatic."
    A spaced hyphen sets badly in print and the house rule offers a comma. No word changed.

    - Round 2 additions: comma splice → semicolon in the ~50% sentence (finding 6); one comma added before
    "but obviously" in the author''s note (finding 2).


    **Every sentence in this file that the author did not write.** Four, all in the standfirst, plus two
    labels. The standfirst sentences are listed here so a fact-checker can find them without diffing:
    "Dex Horthy published this standalone."; "It is an addendum to a recent series of his that didn''t
    fit cleanly into the main post, and it is referenced briefly in *Why Software Factories Fail part
    2: Turning the lights back on*."; "The series'' vocabulary comes with it."; and the factory/levels
    gloss sentence. The labels are "**Editor''s note.**" and "**Author''s note.**". Nothing else in the
    manuscript is mine.


    **Headings.** The source''s `## Seeking Leverage` is recased to `## Seeking leverage` to match the
    figure anchor exactly. `## The 80/20 rule in AI coding leverage` matched already. Both appear exactly
    once, both are the author''s own, none added or removed. Figure captions are not written here; both
    figures carry their captions in the `edition.yaml` row.


    **What edition 004 got wrong, kept on the record.** `editions/004-the-systems-around-the-model/articles/pragmatic-leverage.md`
    closed on "The goal is not maximal specification. The goal is to eliminate as much expected pain as
    possible." That sentence is not in the extraction. It is an editor-built antithesis close (banned
    tic 1) welded onto the author''s own last paragraph, which already ends "eliminating as much expected
    pain as possible." The defect was made when someone decided the piece needed a summarizing beat before
    the sign-off. Both rounds of this rerun have refused that beat.


    **Unclear instructions.** One tension, unchanged. The brief''s budget note reads as an instruction
    to lengthen, while `faithful_edit` forbids adding prose. They reconcile only because this source has
    nothing withheld. Step 5 of the prompt handles a source that is too *long* and offers no escape hatch
    for one that is too short; assume the source wins. Round 2''s standfirst is not a counterexample:
    it was added to clear a major finding, not to reach a word count, and it would have been written at
    the same length against any budget.'
