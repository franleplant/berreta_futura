    \ the next two sentences already say that in the author's words and it would have\nbeen the third\
    \ statement of routing in one paragraph.\n\n## Claim ladder (inherited, unchanged)\n\n**Central claim.**\
    \ Everyone rents the same model now, so what separates two teams is the examiner\nthey build around\
    \ it: the layer that judges whether an answer was right and then changes what the\nsystem does next.\
    \ It costs almost nothing, nobody can sell it to you because it encodes your own\ndefinition of correct,\
    \ and it appreciates every week you run it.\n\n**Main caveat a reader must be able to state after\
    \ one read.** The examiner can be gamed and can\nbe wrong about the whole product: optimize against\
    \ a judge long enough and the agent learns to\nlook right rather than be right, and 38 green tests\
    \ coexisted with a completely broken product.\n\n**Supporting claims in the order the argument needs\
    \ them.**\n\n1. Quality and truth are different measurements and only one is usually watched. Travel\
    \ agent\n   invents an exchange rate, a week's temperature, museum hours; the search tool came back\
    \ empty.\n   Over 100 real sessions: response quality 83.9%, faithfulness 32.3%.\n2. A better model\
    \ would not have caught it. The missing layer decides whether an answer was right\n   and does something\
    \ with the verdict; nobody can sell it to you.\n3. The rented brain is the same everywhere (\"give\
    \ or take\"), which widened the gap between teams.\n4. Evals alone move the product: no model, prompt\
    \ or human-nudge changes across versions, scores\n   moved on every dimension; the team's own conclusion\
    \ was day one against month nine.\n5. Thermometer against thermostat; the return arrow is the whole\
    \ difference.\n6. Loops, then graphs, then evals, in that order. The graph made you fast; the judge\
    \ decides\n   whether the speed was worth having. Twenty parallel agents on one frozen judge multiplies\n\
    \   exposure.\n7. The examiner appreciates; the model is a rental.\n8. You already own the eval engine\
    \ (blind test, coding agent above two dedicated platforms).\n9. A number in a report has no path back\
    \ to the run it measured; the Tokyo founder's line; six\n   verdict-to-action rules, each a routing\
    \ decision executed mid-flight.\n10. Judge hygiene: another family, no shape-rewarding, pin the version.\n\
    11. Tests come from logs: 25 traces, the trace is not truth, attribution.\n12. The merge gate: four\
    \ signals, one confidence score, three of four deterministic or historical.\n13. Trust is actuarial;\
    \ 19 of 20 merge unattended; the 1,500-pull-request practitioner; the\n    constraint is the product.\n\
    14. The counterexample: 285 iterations, 1,094 merges, zero regressions, 38 green tests over a\n  \
    \  broken product; converge on the spec.\n15. This week: three measurements; score the whole path.\n\
