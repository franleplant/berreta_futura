  notes: '## What round 2 changed, and why


    Round 1 failed one deterministic gate, twice reported: the fenced block holding the six verdict-to-action
    routing rules. My predecessor''s own notes admit it: "The routing rules are a mapping, and prose bullets
    are what the previous draft was criticised for, so I used one fenced block. That was my call." It
    was the wrong call, and the reason is not stylistic. The magazine''s fence rule is a copy-and-run
    guarantee: a fenced block must be the source''s own lines character for character, and this one was
    invented formatting. The source presents those six pairs inside a block labelled `python` that is
    neither Python nor reproducible from the extraction as a stable, untruncated set of lines, so there
    was no faithful fence available to substitute. **Do not try again.** Any future reviser who reaches
    for a fence here for the routing rules, the install commands, the `evalkit` phases, the Harbor folder
    tree, or the four-line write-up template should stop: every code region in this extraction is either
    OCR-truncated at the right margin (`--yes --g`, `Evaluate my agent at ./my_agent for grounding and
    to`, `mine traces -> identify a failure -> build an eval -> improve the`) or arrives with column padding
    that cannot be trusted to match the pinned bytes. This article has no reproducible code, and that
    is a property of the source, not a gap in the writing.


    The repair: the six rules are now two sentences of ordinary prose, and they deliberately name only
    two of the six actions (quarantine the branch, end the run) plus the conclusion the source itself
    draws, that each is a routing decision the graph executes mid-flight. Three reasons for naming only
    two:


    1. **The figure already enumerates them.** `edition.yaml` pins figure `eval-routing` to this exact
    heading with the caption "Scores become useful only when they change the next edge: retry, reject,
    quarantine, block, or route to human review." A prose list of all six would put the same enumeration
    on the page twice, which is the "nothing appears twice" rule with the manifest''s figures counted
    as part of the page. My predecessor spotted this coupling and flagged it as a prompt gap; it is now
    load-bearing on the repair. **If anyone later removes or re-anchors that figure, this paragraph should
    grow back one or two of the missing actions**, because the reader would otherwise lose the range of
    what a verdict can do.

    2. The brief''s enumeration rule allows a list only when the reader will act on the items and there
    are no more than five. There are six, and a print reader acts on the principle rather than the table.

    3. The two I kept are the two the surrounding argument uses: quarantine picks up the hallucination
    thread from the travel agent, and "ends the run" sets up the verified-completion idea that the gate
