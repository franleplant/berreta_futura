  notes: '## What round 3 changed, and why


    Round 2 cleared the fence gate and failed on rhythm. Six of the seven findings are about arrangement,
    not content, so the claim ladder and the cut list below are inherited unchanged from round 2 and are
    still the record of what this piece is made of. **Read the fence warning in the round 2 notes before
    you touch anything that looks like it wants a code block: this extraction has no reproducible code
    and never will.** Every code region in it is either OCR-truncated at the right margin or column-padded,
    so a fenced block cannot match the pinned bytes. That constraint has now survived two rounds; do not
    re-litigate it.


    ### Finding 1, the verbless triad (major)


    The line editor counted six. I counted the same six and disposed of them one at a time rather than
    rewriting the piece''s rhythm wholesale, because two of the six are the author''s and are load-bearing.


    | triad | disposition |

    |---|---|

    | "Specific, clean, useful-sounding." | **Dropped.** It is the author''s, but it is the abstract one,
    it sits four words from the concrete triad in the same sentence, and "All of it invented." carries
    the whole beat alone. Nothing is lost but a repeat. |

    | "an exchange rate ... the opening hours of a museum" | **Kept.** Three real, different, concrete
    things, and the finding names it as the one to keep. |

    | "Same brain. Different examiner. Better product." | **Dropped**, and this is the decision the round
    rests on. See below. |

    | "a dashboard, a feeling, a sense that it seems worse than last week" | **Cut to two items:** "a
    dashboard, or a feeling that things seem worse than last week." The source''s own third item was the
    Friday scroll, which the close already owns. |

    | "Loops, then graphs, then evals." | **Kept.** The author''s sentence, an ordered history rather
    than an abstract list, and the next two sentences depend on the reader holding all three terms. |

    | "length, keywords or similarity to a reference" | **Expanded to four:** "response length, keyword
    hits, citation count or exact phrasing." The source lists six; my predecessor truncated to three and
    manufactured a triad the author did not write. Four breaks the shape and is closer to the source.
    |


    Three triads remain, all concrete, none abstract, none the last sentence. That satisfies banned tic
    3 as well.


    **On dropping "Same brain. Different examiner. Better product."** My predecessor listed it as one
    of the three verbatim voice-signature sentences, which is why it was untouchable last round. It is
    not untouchable: step 2 of the prompt lets the writer choose which three sentences carry the voice,
    and this one had become the piece''s most quoted instance of the tic the line editor is objecting
    to. The reviewer''s suggested replacement, "The model never changed. The examiner did, and the product
    got better," is a sentence in the author''s cadence that the author never wrote, which is exactly
    the failure mode that shipped in edition 004''s version of the Huntley piece. So I did not replace
    it. I deleted it. The sentence immediately before it already says the same thing in the author''s
    own words ("changed no model, no prompts and no human nudges ... only the evals, and the scores moved
    across every dimension"), so the paragraph loses a drumbeat and no content. **If a later round wants
    the line back, it costs a triad and it must come back verbatim, not paraphrased.**


    My three voice-signature sentences are now:


    1. "The agent wrote beautifully and told the truth about a third of the time."

    2. "The ones that cost money are sitting in your logs right now, wearing a timestamp."

    3. "Trust in an agent is an actuarial calculation."


    Also kept whole: "The constraint is the product", "reward the shape and the agent learns the shape",
    "38 green tests coexisted with a completely broken product", "optimize against a judge long enough
    and the agent learns to look right rather than be right", and the close.


    ### Finding 2, the admiring frame (major)


    Four instances, all mine, all removed by demoting the frame to plain attribution or deleting it:


    - "Their own conclusion was blunter:" → "Afterwards they said the evals should have been in the system
    on day one, not month nine." Attribution, no billing.

    - "The line that fixes the whole discipline belongs to a 21-year-old founder in Tokyo ..." → the quotation
    now goes first and the attribution follows it: "That is a 21-year-old founder in Tokyo with 258 followers;
    his post on it got two likes." The reader judges the line before being told who said it, which is
    the point of the finding. This also clears finding 6, because putting the quotation first forced the
    quotation marks. **The semicolon is deliberate.** My first attempt at the post-positioned attribution
    read "a 21-year-old founder in Tokyo, 258 followers, two likes on the post", which is a brand new
    verbless triad and would have handed finding 1 straight back. Watch for that whenever a frame gets
    demoted to an appositive.

    - "put it in a way no vendor would:" → deleted entirely, and with it the colon. The quoted sentence
    now stands as its own sentence after the plain fact of the 1,500 merges.

    - "Their own line is the one to keep:" → deleted. The clause is folded into the reporting sentence:
    "and still reported that 38 green tests coexisted with a completely broken product."


    Note that removing the fourth frame cost the piece nothing but required rewelding the sentence, because
    "zero regressions" and "38 green tests over a broken product" are the same team''s two findings and
    the reader needs them adjacent for the contradiction to land. "and still reported" is doing that work;
    it is attribution, not admiration.


    ### Finding 3, "the graph" undefined (major)


    The definition was in the source all along and my predecessor cut it as history. It is back, in the
    author''s own words, and it now sits **before** the first use rather than two sections after it: "Then
    many agents laid out as a graph, so work that never depended on each other ran side by side instead
    of standing in line." I moved the loops-then-graphs paragraph ahead of the return-arrow sentence to
    make that ordering possible, which is a departure from the source''s paragraph order and is allowed
    by step 3 of the prompt. Cost: 27 words. This is the only place in the piece where a manager can learn
    what "edge" and "routing" are going to mean, so **do not cut this paragraph for budget.** Cut from
    the round 2 list instead.


    I declined the reviewer''s suggested gloss ("the agent''s graph, the wiring that picks which step
    runs next") because it is an editor''s definition of a term the author defines himself, and the author''s
    version also carries why the graph exists, which the gloss does not.


    ### Finding 4, the section that turns three times (major)


    Structural fix rather than a declarative first sentence. The section was three subjects because it
    was three subjects: what a verdict does to a run, how to keep the judge honest, and where cases come
    from. The third now has its own heading, **`## Where the tests come from`, which is the source''s
    own subheading**, so nothing is asserted that the author did not. The second turn is bridged by naming
    the antecedent instead of announcing a topic change: "The examiner issuing those verdicts needs hygiene
    of its own."


    I declined the suggestion ("Wiring the verdict in is the easy half. The examiner and the cases it
    grades are the rest.") for two reasons. It is a table of contents for a two-paragraph stretch, and
    it ranks the three subjects by difficulty, which is a judgement the author never makes. A heading
    was the cheaper repair and it costs three words.


    `## Where the tests come from` carries no pinned figure, so it is free to change. **The two pinned
    headings are not:** `## Thermometer, thermostat` and `## What a score is allowed to do` are reproduced
    character for character and the FIGURE ANCHORS block above restates them. Renaming either strands
    its figure and the renderer refuses the build.


    ### Findings 5, 6, 7 (minor)


    - **Passive.** "A confidence score is computed the moment it opens" → "Four signals are there from
    the start, and the gate turns them into a confidence score." The gate is the actor. I kept the four
    signals in the same sentence rather than the reviewer''s colon-then-list, because splitting them added
    a sentence the budget could not pay for.

    - **Unmarked quotation.** Handled by the reordering described under finding 2.

    - **Buried list.** The gloss on faithfulness is now its own sentence after the list. It also stopped
    repeating 32.3%, which appears once, in paragraph 2, where the contrast lives.


    ### Length


    Body is 1,128 words excluding headings, measured as whitespace-delimited tokens in the non-heading
    paragraphs above the FIGURE ANCHORS marker. Round 2 measured 1,130 the same way. So this round is
    2 words shorter with one more heading and one more paragraph break, which is roughly a wash on rendered
    height; the guide''s top is 1,100 and both rounds sit just over it. **Round 2 was judged with no fit
    failure reported, so 1,130 words in this layout renders inside seven A5 pages. Do not treat that as
    headroom. Run `mag fit rerun-004-the-systems-around-the-model` before accepting.**


    The arithmetic, so the next reviser does not have to redo it: the finding repairs were not free. Deleting
    the four editorial frames and the "Specific, clean, useful-sounding." triad saved about 45 words;
    restoring the source''s definition of the graph (finding 3) and adding the `## Where the tests come
    from` heading (finding 4) spent about 80. I paid the difference out of the cut list below rather than
    out of any caveat.


    Already spent this round, so do not look for them: the shadow-mode-and-2%-deviation sentence (round
    2''s cut-priority 1), "and include one the user corrected, where the correction is the label free
    of charge" (priority 2), "so the review starts at the problem instead of at line one", and "A suite
    can go all green while the product it guards falls apart", which was a restatement of the 38-green-tests
    line sitting directly in front of it.


    If it still overflows, cut in this order and stop as soon as it fits:


    1. "Attribution is where beginners lose a week: the same lookup twice with identical arguments is
    your loop, and a 429 is somebody else''s limit, yours only if the agent was supposed to recover from
    it." (35 words, a practitioner detail; the two claims around it, tests come from logs and the trace
    is not truth, are the load-bearing ones)

    2. "Grade the path and not only the answer: a correct result reached through a broken sequence passes
    when the final response is all you score." (24 words)

    3. The blind-test sentence closing *Thermometer, thermostat*, which is the whole "you already own
    the engine" step and should go only under real pressure.


    Do not reach for the caveats. The travel-agent numbers, "the agent learns to look right rather than
    be right", and "38 green tests coexisted with a completely broken product" are what a manager has
    to be able to restate after one read. Do not reach for the graph definition either (finding 3), and
    do not reach for the quotation marks or the post-positioned attributions, which are findings 2 and
    6 and will come straight back.


    ## Claim ladder (inherited, unchanged)


    **Central claim.** Everyone rents the same model now, so what separates two teams is the examiner
    they build around it: the layer that judges whether an answer was right and then changes what the
    system does next. It costs almost nothing, nobody can sell it to you because it encodes your own definition
    of correct, and it appreciates every week you run it.


    **Main caveat a reader must be able to state after one read.** The examiner can be gamed and can be
    wrong about the whole product: optimize against a judge long enough and the agent learns to look right
    rather than be right, and 38 green tests coexisted with a completely broken product.


    **Supporting claims in the order the argument needs them.**


    1. Quality and truth are different measurements and only one is usually watched. Travel agent invents
    an exchange rate, a week''s temperature, museum hours; the search tool came back empty. Over 100 real
    sessions: response quality 83.9%, faithfulness 32.3%. Nobody caught it because the writing was the
    only part anyone looked at.

    2. A better model would not have caught it. The missing layer decides whether an answer was right
    and does something with the verdict; cheapest line in the stack, and nobody can sell it to you.

    3. The rented brain is the same everywhere ("give or take"), which widened the gap between teams instead
    of levelling it.

    4. Evals alone move the product: no model, prompt or human-nudge changes across versions, scores moved
    on every dimension; the team''s own conclusion was day one, not month nine.

    5. Thermometer against thermostat; the return arrow is the whole difference.

    6. Loops, then graphs, then evals, in that order and for those reasons. The graph made you fast; the
    judge decides whether the speed was worth having. Twenty parallel agents on one frozen judge multiplies
    exposure.

    7. The examiner appreciates; the model is a rental.

    8. You already own the eval engine (blind test, coding agent above two dedicated platforms).

    9. A number in a report has no path back to the run it measured; the Tokyo founder''s line; six verdict-to-action
    rules, each a routing decision executed mid-flight.

    10. Judge hygiene: another family, no shape-rewarding, pin the version.

    11. Tests come from logs, not imagination: 25 traces, the user correction as a free label, the trace
    is not truth, attribution.

    12. The merge gate: four signals, one confidence score, three of four deterministic or historical.

    13. Trust is actuarial; 19 of 20 merge unattended; the 1,500-pull-request practitioner; the constraint
    is the product.

    14. The counterexample: 285 iterations, 1,094 merges, zero regressions, and 38 green tests over a
    broken product. Converge on the spec, not the score. Shadow mode, 2% deviation.

    15. This week: three measurements; grade the path, not only the answer.

    16. The model will be replaced twice before the end of the year; the examiner survives.


    ## What is cut, and why (inherited from round 2, plus this round''s deletions)


    Dropped whole in earlier rounds: the "not a skim, open a terminal beside it" preamble and both X/Telegram
    promotion blocks; every install command and the `evalkit` phase list; the two-repositories detail
    and the open-skills portability list; the leaderboard''s four rows, reduced to the single comparison
    the author calls the interesting one; the vendor unbundling; the Harbor folder tree, the four-line
    write-up template and the verifier self-test; the interview step, which restates "it encodes your
    own definition of correct"; the aggregate merge statistics and the two-person-shop economics, as second
    evidence for what 19-in-20 already carries; the dataset taxonomy, the sizing numbers and the five
    first evals; and the source''s closing three-line recap, which would have ended the piece on a list.


    Dropped this round: "Specific, clean, useful-sounding."; "Same brain. Different examiner. Better product.";
    the Friday image in the thermostat paragraph (it survives once, in the close); and four editorial
    frames. Restored this round: the source''s own definition of the graph.


    Numbers kept: 83.9, 32.3, 100 sessions, 25 traces, 429, 19 of 20, 1,500, 90 days, 285, 1,094, 38,
    2%. Dropped: 87.2, 84.6, 82.8, 79.5, 74.4, 91.0, 39, $200, 300 to 800, 5 minutes, 4 hours, 1% to 5%.


    ## What the piece is resting on


    - The dollar figure is gone from the body even though it is in the source''s title. The argument survives
    it ("a couple of hundred a month"); if an editor wants the title''s `$200` echoed, the place is paragraph
    3, not the close.

    - The `eval-routing` figure enumerates all six verdict-to-action pairs in its caption, so the prose
    names only two of them on purpose. **If anyone removes or re-anchors that figure, this paragraph should
    grow back one or two of the missing actions**, because the reader would otherwise lose the range of
    what a verdict can do.

    - The close deliberately avoids the source''s own three-line recap and `WRITING_RULES.md`''s exemplar
    ending, which is a near-copy of that recap''s third line.

    - Claim strength preserved at every hedge: "give or take", "about a third of the time", "around 1,500",
    "the same way an insurer does". The gain-from-evals-alone claim is reported as the company''s, not
    verified.'
