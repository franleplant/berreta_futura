    ```\n\nThe six questions are unchanged from round 2. They were never the problem and the novice judge\
    \ has already been handed them.\n\n## What round 3 changed, finding by finding\n\n**1. orphan_referent,\
    \ \"two of the abilities a client can offer\" (major).** This\nwas the repair the whole round turned\
