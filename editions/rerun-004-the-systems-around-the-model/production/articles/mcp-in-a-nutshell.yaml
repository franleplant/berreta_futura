  notes: "```yaml\ncomprehension_questions:\n- What does MCP standardize, and what does it deliberately\
    \ leave alone?\n- Who are the three participants, and why is there one client per server?\n- What\
    \ are the three kinds of thing a server can offer, and what is each for?\n- How does either side find\
    \ out what the other supports, and is asking mandatory?\n- Why does the choice of transport not change\
    \ the protocol messages?\n- What follows from MCP being stateless, for requests and for change notifications?\n\
    ```\n\n## What changed in round 2, finding by finding\n\nThe manuscript was rewritten, not patched.\
    \ What follows is where each defect was\nmade, not only where it surfaced.\n\n**1. qualification_loss,\
    \ the deprecation (blocking).** This was the most\nimportant repair and it was made worse by my round-1\
    \ framing, not just by one\nclause. I had written \"The agreement is small enough to retire parts\
    \ of itself\"\nand then \"both went out with the 2026-07-28 version\". The source says only\n\"deprecated\
    \ as of protocol version 2026-07-28\" for sampling and logging, and\nnever says either was withdrawn.\
    \ A sibling article in this same issue states\ncorrectly that these are annotation-only deprecations\
    \ and the methods keep\nworking, so my version had the issue contradicting itself across two pages.\n\
    \nThe retirement framing is gone entirely. The paragraph now says the version\n\"deprecated two of\
    \ the abilities a client can offer\", then states in its own\nsentence that \"Both methods remain\
    \ in the protocol and both still work\", then\nscopes the \"New implementations should...\" advice\
    \ explicitly to new code. Three\nseparate signals, because one adjective was clearly not enough to\
    \ survive an\nedit. **Do not compress those three sentences back into one.** If a future\nreviser\
    \ needs the words: deprecated, still present, still working, advice\napplies to new code only.\n\n\
    Consequence for the ending: the old close leaned on \"small enough to retire\nparts of itself\", so\
    \ removing that framing removed the section's spine. The\nsection is now built on restraint (what\
    \ it declines to decide, what it declines\nto dictate, that it grows sideways) rather than on shrinkage.\n\
    \n**2. invented_claim, \"The fussiness buys separation\".** Cut. I had invented a\nrationale for one-client-per-server\
    \ and, worse, invented per-connection\ncapability and version state, which the source's statelessness\
    \ design\ncontradicts. The source states the one-to-one rule and gives no reason for it,\nso the manuscript\
    \ now states it and gives no reason either. The replacement\nsentence claims only what the source\
    \ has: a dedicated connection per client, and\na host whose job is coordinating clients. Do not put\
    \ a rationale back unless the\nsource grows one.\n\n**3. invented_claim, \"text in the ordinary case\"\
    .** The typicality claim is\ngone. Now \"plain text here, though the format carries other types too\"\
    , which\ntracks the source's \"In this example... but MCP supports various content types\".\n\n**4.\
    \ duplication, local versus remote.** Made twice in round 1. The fix was to\ndelete it from \"The\
    \ host keeps one client per server\" and keep it in \"One\nmorning on one connection\", because that\
    \ is the only place it has a scene to be\ntrue about: the reader has just watched a morning happen\
    \ and the paragraph tells\nthem the morning would have looked the same either way. Deleting it from\
    \ the\nwalkthrough instead would have left the transport point stated abstractly in a\nsection about\
    \ participants, which is what made it forgettable the first time.\n\nThree things migrated with it\
    \ and now appear exactly once, all in that final\nparagraph: Sentry (the piece's one permitted second\
    \ example, present only to\ndraw the remote contrast), the one-client-versus-many-clients point, and\
    \ \"the\nword 'server' says nothing about where the program runs\". The stacked 60-word\nsentence\
    \ the line editor flagged is now four sentences, and the remote case is\nintroduced as an increment\
    \ (\"What it adds is only what the local case lacks\")\nrather than as a fresh inventory.\n\n**5.\
    \ repeated_cadence, assertion-colon-expansion.** Ten instances in round 1;\nzero in this draft. Every\
    \ one became either a period plus a fragment (the\nreviewer's own suggested shape, used in the `_meta`\
    \ paragraph and in the remote\ntransport paragraph), an apposition with a comma, or a separate sentence.\
    \ The\nunderlying pressure is real and will recur: the house ban on the em dash pushes\nthis exact\
    \ construction. If you revise, count colons before you deliver. The\nopening paragraph in particular\
    \ used to be \"The useful material sits outside:\nthe rows in a database...\" and is now two sentences.\n\
    \nWatch the word count when you do this: the mental model has to land inside 150\nwords and it currently\
    \ lands at word 61, which is where it landed in round 1\n(word 62). That position was explicitly approved.\
    \ Any rewrite of the first\nparagraph must keep it there.\n\n**6. ai_phrasing, \"the difference is\
    \ worth memorizing\".** Cut, and nothing\nreplaced it. It was an instruction to the reader to care,\
    \ and it also promised a\nsingular difference between three things.\n\n**7. dead_words, the garden\
    \ path.** \"The specification calls the three tools\" is\nnow \"The specification names these three\
    \ tools, resources and prompts, and\ngroups them as primitives, meaning what the two sides can offer\
    \ each other.\" The\ndemonstrative \"these\" is what kills the misparse.\n\n**8. dead_words, the `_meta`\
    \ sentence.** Took the suggestion verbatim: \"All of\nit rides in a `_meta` field.\" The bundle now\
    \ has a pronoun that can hold three\nitems, and the redundant \"on every request\" is gone.\n\n**9.\
    \ ending, the stitched kicker.** The kicker itself was judged good, so it\nsurvives word for word.\
    \ What changed is the approach to it. The section's last\nsubstantive beat is now the durable-handle\
    \ extension, which is about a client\nthat does not hold a request open, and that is a statelessness\
    \ idea. So the\nbridge sentence (\"It loses nothing by going away, because nothing was being held\n\
    for it\") lets the section arrive at the close instead of jumping back two\nsections for it.\n\nI\
    \ declined the reviewer's suggested line. It reads \"That is the shape of a\nprotocol that stays small:\
    \ it drops what it does not need, and a server that\nremembers nothing...\" Two problems. \"It drops\
    \ what it does not need\" restates\nthe removal framing that finding 1 exists to eliminate, and the\
    \ line carries the\ncolon cadence finding 5 exists to eliminate. Taking it would have cleared\nfinding\
    \ 9 by reopening the blocking one.\n\n**10. house_style, the frontmatter.** Now `content_mode: in_a_nutshell`\
    \ and\n`source_ids` as a list with one entry, matching the `edition.yaml` row for this\narticle. Round\
    \ 1 used `original_synthesis` and a singular `source_id` because\nthe prompt's own frontmatter template\
    \ showed the singular form; a manual\ncorrection downstream was then overwritten by the pipeline,\
    \ so it has to be\nright here. **The prompt template and the manifest disagree. Follow the\nmanifest.**\n\
    \n## What the piece rests on, for whoever revises next\n\nThree things passed review and should be\
    \ treated as load-bearing until a judge\nsays otherwise:\n\n- The mental model at word 61 (two halves\
    \ and one wire). It is what the whole\n  piece spends, and the 150-word rule is what forced the structure.\n\
    - The headings, which are five claims about the world. None of them is a source\n  section name. The\
    \ source's contents run Scope, Participants, Layers, Data\n  layer, Transport layer, Statelessness\
    \ and discovery, Primitives, Notifications,\n  Example, and this is the failure the anti-exemplar\
    \ was written against.\n- One running example, Visual Studio Code plus the database server, returned\
    \ to\n  in every section. The filesystem server is one beat in the first section.\n  Sentry is one\
    \ clause in the walkthrough. The source's weather tool and its San\n  Francisco call are still deliberately\
    \ absent, because importing them would\n  create the second running example the prompt bans.\n\nTwo\
    \ method names survive, `server/discover` and `_meta`, both inside sentences,\nneither as a section\
    \ subject.\n\nStill unresolved and inherited from round 1: the source tells no history, so the\nproblem\
    \ is stated structurally in the opening paragraph. Do not reconstruct a\nbefore-state of bespoke connectors;\
    \ hard rule 5 forbids it and the extraction\ndoes not support it. Also still true: length cannot be\
    \ verified from here. This\ndraft is close to round 1's body length, which rendered within the seven-page\n\
    budget, so `mag fit` should be run rather than trusted."
