      notes: 'Checked every assertion against the single pinned architecture-overview

        extraction. The participant model is right: host as the AI application that

        coordinates and manages clients, one client per server each holding a

        dedicated connection, Visual Studio Code as the worked example, a second

        client instantiated for the local filesystem server. The three server

        primitives map onto the extraction''s database example exactly, tools for

        actions, a resource for the schema, a prompt carrying few-shot examples, and

        "primitives" is glossed as what the two sides can offer each other, which is

        the extraction''s own wording. Elicitation is described as the extraction has

        it, servers requesting more information or confirmation of an action, with

        the client declaring the elicitation capability. Statelessness is accurate:

        protocol version, request-relevant capabilities and, unless configured

        otherwise, client identity riding in _meta; server/discover mandatory for

        servers but optional for clients; version rejection listing the versions the

        server does support; the discovery response typically cacheable. The morning

        walkthrough tracks the example steps, tool-list fields (name, description,

        input schema), the unified registry, the application intercepting and routing

        the call, the content array with text as one of several types, opt-in change

        notifications via a long-lived subscriptions/listen stream, no reply expected,

        and best-effort delivery that can be lost across a reconnect, so clients

        should still poll. The transport paragraph is correct: stdio for local

        processes with no network overhead, Streamable HTTP posts for the Sentry

        server running on Sentry''s own platform, optional event stream, bearer tokens

        or API keys with OAuth recommended, local typically one client and remote

        typically many, and "server" saying nothing about where the program runs. The

        deprecation passage was checked closely. The extraction says the client

        primitives Sampling and Logging "are deprecated as of protocol version

        2026-07-28" and continues to describe both in the present tense with their

        live methods and with "new implementations should" guidance. The manuscript

        says the version deprecated two client-side abilities, that a server can

        still borrow the host''s model for a completion and still send log lines for

        debugging, that both methods remain in the protocol, and that what changed is

        the advice for new code. That states deprecation and does not imply removal,

        which is what the extraction supports. The Tasks extension sentence matches

        the extraction''s durable handle for long-running requests with later polling

        and retrieval. Scope restraint ("does not dictate how AI applications use

        LLMs or manage the provided context") survives. The closing image about a

        server you can hang up on and call back is a restatement of statelessness,

        not a new claim. Nothing required checking outside the extraction.'
