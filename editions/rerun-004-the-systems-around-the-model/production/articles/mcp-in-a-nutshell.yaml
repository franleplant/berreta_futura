  notes: "## 1. Pre-writing, as the prompt required\n\n**Q1. What did people do before this existed, and\
    \ what broke?**\nThe extraction does not answer this. There is no history, no prior art, no\naccount\
    \ of bespoke connectors, no combinatorial framing. The nearest material is\nthe scope note (\"MCP\
    \ focuses solely on the protocol for context exchange\") and\nthe data-layer note that the primitives\
    \ are \"the ways developers can share\ncontext from MCP servers to MCP clients.\" So I answered in\
    \ the only form the\nsource supports: the problem is structural, not historical. A model works on\n\
    what is placed in front of it, the material worth placing there lives outside\nthe application, and\
    \ somebody has to define the handover. Anything sharper would\nhave been my own knowledge, which hard\
    \ rule 5 forbids.\n\n**Q2. The mental model, in two or three plain sentences.**\nTwo halves and one\
    \ wire. The AI application owns the model, the conversation and\nevery decision about what to do with\
    \ context; the server owns a corner of the\noutside world and publishes it as a self-describing menu.\
    \ Neither side knows how\nthe other is built, so both announce their capabilities on every request\
    \ instead\nof assuming.\n\n**Q3. The single concrete scenario that carries the piece.**\nVisual Studio\
    \ Code as the host, connected to a server that fronts a database.\nBoth halves are in the source:\
    \ VS Code is the source's named example of a host,\nand a local database server is named in the participants\
    \ diagram, with the\nsource's own worked example of what such a server exposes (query tools, a schema\n\
    resource, a few-shot prompt). It is the only candidate that reaches every\nconcept: participants,\
    \ one client per server, all three server primitives,\ndiscovery, a tool call and a tool-list change.\
    \ The filesystem server appears\nonce, to show a second client being built. Sentry appears once, for\
    \ the contrast\nthe primary example cannot draw: a remote server serving many clients. The\nsource's\
    \ weather tool and its San Francisco call were left out on purpose,\nbecause importing them would\
    \ have created the second running example the prompt\nbans; the walkthrough uses the database server's\
    \ own tools instead.\n\n**Q4. Six things the reader must be able to answer at the end.**\n1. What\
    \ does MCP standardize, and what does it leave alone? (Context exchange\n   only; not model choice,\
    \ not context management.)\n2. Who are the participants? (Host = the AI application; one client per\
    \ server,\n   each holding a dedicated connection; server = the program serving context,\n   wherever\
    \ it runs.)\n3. What can a server offer? (Actions, readable context, interaction templates:\n   tools,\
    \ resources, prompts.)\n4. How does either side find out what the other supports? (Version and\n \
    \  capabilities in `_meta` on every request; `server/discover` mandatory to\n   implement, optional\
    \ to send, answer usually cacheable.)\n5. Why does the transport not change the protocol? (Same messages\
    \ over stdio\n   locally or HTTP remotely; connection, framing and auth live in the outer\n   layer.)\n\
    6. What follows from statelessness? (Every request self-contained; change\n   notifications opt-in\
    \ and best effort, so clients still poll.)\n\nRunning example fixed: **VS Code plus the database server.**\
    \ Every section\nreturns to it.\n\n## 2. Assessment of the prompt contract\n\n**Clear and load-bearing.**\n\
    - \"The mental model appears within the first 150 words.\" The single most useful\n  instruction.\
    \ It forced the structure: the problem paragraph had to be short\n  and the who-owns-what passage\
    \ had to lead. It lands at word 62 here.\n- \"Never mirror the source's own table of contents,\" with\
    \ a worked example of a\n  good heading. Concrete enough to act on. I checked my headings against\
    \ the\n  source's contents (Scope, Participants, Layers, Data layer, Transport layer,\n  Statelessness\
    \ and discovery, Primitives, Notifications, Example) and none\n  survives; layers and transports are\
    \ folded into the walkthrough, where they\n  answer a question the scene has already raised.\n- \"\
    No enumeration of method names... a method name appears only where the reader\n  needs to recognize\
    \ it in the wild, inside a sentence.\" Sharp and testable. Two\n  survive (`server/discover`, `_meta`),\
    \ both inside sentences, neither as a\n  section subject. The source's JSON-RPC blocks, roughly half\
    \ its length, drop\n  out.\n- \"One running example throughout. A second example only to draw a contrast\
    \ the\n  first cannot, and only once.\" This is what kills the duplicate-example\n  failure, because\
    \ it makes the writer name the example before drafting.\n- \"Concept first, term second, in the same\
    \ sentence.\" Easy to apply and it\n  visibly changes the prose.\n- The anti-exemplar section. Naming\
    \ the failure and its symptoms was more useful\n  than any positive instruction.\n\n**Vague, unhelpful\
    \ or missing.**\n- Procedure question 1 assumes a source with a history. This one has none. The\n\
    \  prompt offers no fallback, so it pushes the writer toward inventing a\n  before-state that hard\
    \ rule 5 then forbids. Two rules collide and the\n  collision is invisible until you are drafting.\
    \ It needs a clause: if the source\n  does not describe the prior state, state the problem structurally\
    \ and do not\n  reconstruct history.\n- Length is stated in three disagreeing ways: my brief said\
    \ 700 to 1,100, the\n  prompt says roughly 800 to 1,100 body words, and both say seven A5 pages hard\n\
    \  maximum. Word counts do not map cleanly onto pagination and the writer cannot\n  run the renderer.\
    \ My first draft came in at 1,220 and had to be cut on a rule\n  I could not verify.\n- Step 3 prescribes\
    \ five sections in a fixed order, which is close to a template\n  and sits awkwardly beside the ban\
    \ on mirroring a table of contents. It is a\n  good order, but a piece that follows it literally has\
    \ a predictable shape. I\n  merged parts of (c) and (d) and put the transport material inside the\n\
    \  walkthrough; the prompt does not say whether that is allowed.\n- \"Every claim must be traceable\
    \ to the source\" is right but silent on obvious\n  inferences. I dropped several useful sentences\
    \ the source implies but never\n  states, for instance that a server written once works under any\
    \ host.\n- Nothing is said about deprecated features. A newcomer meets sampling and\n  logging only\
    \ as tombstones. I gave them two clauses because the deprecation\n  shows where the seam is, but that\
    \ was my call.\n- The frontmatter block shows `source_id` singular with a note about\n  `source_ids`,\
    \ while the live `edition.yaml` row for this article uses the\n  plural with one entry. A writer copying\
    \ the prompt literally produces\n  frontmatter that does not match the manifest. I followed the prompt.\n\
    - The prompt does not say whether the piece may name the source (\"the\n  specification calls these...\"\
    ). In `original_synthesis` this reads as\n  attribution rather than the narrator scaffolding banned\
    \ by tic 6, but it is a\n  judgment call the contract should make for the writer.\n- The six comprehension\
    \ answers are generated by the writer and then never used\n  as a checklist against the finished draft,\
    \ even though the novice judge writes\n  its own six. Making the writer verify the draft against its\
    \ own six would\n  close that loop.\n\n**Invented because the prompt did not say:** the number of\
    \ sections and their\nboundaries; that the boundary section could absorb the deprecations; that the\n\
    closing line should stand alone; and the decision to leave the source's weather\ntool out entirely.\
    \ I also dropped a sentence listing what ships under the MCP\nname (specification, SDKs, Inspector,\
    \ reference servers) purely to make budget,\nwhich is orientation a novice would have valued.\n\n\
    Manuscript body: 1,099 words including headings, 1,065 of prose. The first\ndraft was 1,220 and had\
    \ to be cut by hand against a limit I cannot measure.\n\n## 3. After reading the shipped version\n\
    \nRead only after the draft above was finished. It is 1,042 words to my 1,099, so\nlength is not the\
    \ difference; what the words do is.\n\n**Concrete differences.**\n- Headings. Shipped: \"Host, client,\
    \ server\", \"Two layers\", \"The three server\n  primitives\", \"A request from discovery to action\"\
    , \"Practical uses\", \"Client\n  features and notifications\", \"The useful boundary\". Four of the\
    \ seven are the\n  source's own section names or near-paraphrases, and \"Host, client, server\" is\n\
    \  the source's bullet list promoted to a heading. Mine are five claims about the\n  world, none naming\
    \ a spec section.\n- Where the teaching sits. The shipped piece does state the boundary in its\n \
    \ first paragraph, which is better than the diagnosis suggested, but the\n  ownership model itself\
    \ (\"The host owns intelligence and orchestration. Each\n  client owns one protocol relationship.\
    \ Each server owns a bounded set of\n  context and actions\") is the final section, 91 words. Mine\
    \ opens on it, at\n  word 62, and the rest of the piece spends it.\n- Method and identifier names.\
    \ Shipped: `tools/call`, `tools/list`,\n  `resources/list`, `prompts/list`, `server/discover`, `_meta`,\
    \ plus invented\n  identifiers `query_database`, `diagnose_slow_query`, `weather_current`,\n  `location`,\
    \ `units` and a literal argument object. One sentence enumerates\n  three list methods in a row. Mine\
    \ names two, both inside sentences.\n- Examples. Shipped uses four: VS Code with the filesystem and\
    \ Sentry servers, a\n  database server, a weather tool, and then a \"Practical uses\" section that\n\
    \  repeats the first two almost verbatim (\"A coding host such as Visual Studio\n  Code can connect\
    \ to a local filesystem server and a remote Sentry server. Each\n  connection gets its own MCP client\"\
    \ against the earlier \"Suppose Visual Studio\n  Code connects to a local filesystem server and a\
    \ remote Sentry server... The\n  connections remain separate\"). The stdio-versus-Sentry contrast\
    \ also appears\n  twice. Mine has one example, with the filesystem server as a single beat and\n \
    \ Sentry as a single contrast.\n- Accuracy against the source. The shipped piece invents tool and\
    \ prompt names\n  the source never gives, adds \"The server validates the input\", and opens its\n\
    \  walkthrough with \"First, the client asks the server what protocol versions and\n  capabilities\
    \ it supports through `server/discover`\", which contradicts the\n  source's statement that calling\
    \ discovery is optional. It omits statelessness\n  as a named idea, the best-effort caveat on notifications,\
    \ the advice to keep\n  polling, cacheability, and the deprecations.\n- Ending. Shipped closes on\
    \ \"Tool builders can publish stable typed primitives\n  while AI applications compete on how well\
    \ they use them\", which restates the\n  separation argument rather than landing. It also opens its\
    \ last section on\n  \"MCP is often described as a connector standard. The architecture is more\n\
    \  precise than that\", a cousin of the banned antithesis without being the banned\n  form itself.\
    \ Mine closes on statelessness and does not summarize.\n- Mode. The shipped article is `faithful_synthesis`\
    \ labelled FAITHFUL SYNTHESIS,\n  with the protocol project itself as author. The new prompt makes\
    \ the piece\n  `original_synthesis` under an editor byline. That change is upstream of every\n  other\
    \ difference: a faithful synthesis of a specification is close to\n  obligated to walk the specification,\
    \ which is most of why the shipped piece\n  reads as a spec dump.\n\n**Did the new prompt prevent\
    \ the four documented failures?**\n1. Headings mirroring the specification: prevented. The rule is\
    \ explicit, comes\n   with a worked example, and the anti-exemplar names the offending headings.\n\
    2. Reciting method names: prevented, and this is the sharpest rule in the\n   contract because it\
    \ says exactly where a method name may appear. It would\n   also have caught the invented `query_database`\
    \ and `diagnose_slow_query`,\n   which are a fidelity problem the rule catches as a side effect.\n\
