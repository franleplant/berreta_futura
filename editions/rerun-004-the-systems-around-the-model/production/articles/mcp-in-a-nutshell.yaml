    \ earlier, not in the deprecation paragraph. The\nelicitation paragraph now ends \"Collecting input\
    \ is the client's own offer back,\nand the specification calls it elicitation.\" That single word\
    \ \"offer\" opens a\nclient-side menu the reader can then be told has more on it. The deprecation\n\
    paragraph opens \"Collecting input is not the only offer a client makes\", names\nboth, and keeps\
    \ the client as the grammatical subject of both: the client\n**lends** the host's model, the client\
    \ **takes** log lines. Lending presupposes\nowning, so the sentence now reinforces the mental model\
    \ instead of breaking it.\n\n**Do not reverse those subjects back to the server.** \"A server can\
    \ borrow the\nhost's model\" is the same sentence semantically and it is the one that broke the\n\
    piece.\n\n**Keep the three deprecation signals separate**, inherited from round 1 and still\nload-bearing:\
    \ (a) \"The 2026-07-28 version deprecated both of those\"; (b)\n\"Deprecated is all it did. Both methods\
