        earns its length. The bare sentence could be read as a promise about the rest

        of the article as easily as about the rest of the campaign, and the clause

        settles that on the first pass: what follows is time, not text. The cost is a

        real one and worth naming. This was a short hinge sentence between the 136-key

        secret object and the two credentials it yielded, and splitting subject from

        verb takes some of the snap out of the pivot. It is still twelve words, the

