    \ `reference://`* → \"which addresses data by file and numeric offset\" (source: \"an\n     fsspec\
    \ reference:// spec whose numeric offset field\"). This is the minimum the source\n     licenses.\
    \ I wrote and then deleted a fuller gloss naming byte ranges and record layout:\n     accurate, not\
    \ in the extraction, and this piece's fidelity score is the thing most worth\n     protecting.\n \
    \  - *Jinja2 template* → \"a Jinja2 template expression where the offset number belonged\", and\n\
    \     the next sentence says the renderer evaluated it. The wrongness is carried by the\n     mismatch,\
    \ which the reader can now see, instead of by the word \"wrongly\".\n   The paragraph also split in\
    \ two at \"made it act on what was already local\", because the\n   glosses pushed it past the length\
    \ where a reader can hold both vectors at once. The split\n   is at the pivot the source itself uses.\n\
    4. **[minor] repeated_cadence, the totalizing \"Every/Everything X\".** Five down to two, and the\n\
    \   two are seven paragraphs apart. \"everything below ran from it\" stays because it is the\n   source's\
    \ own clause and the second half of the surviving semicolon. \"Everything that follows\n   descends\
    \ from that read.\" stays because it is the hinge and is now the first thing in the\n   piece to use\
    \ the shape since Initial access, so it reads as emphasis rather than habit.\n   The other three:\
    \ \"Everything it ran in that pod came back out through...\" became \"The pod\n   sent its output\
    \ back through...\" (the pod is the actor, and the read-back step is now\n   explicit); \"Every escalation\
    \ that mattered happened on day three\" became \"Day three carried\n   every escalation that mattered\"\
    , which keeps the scope word but not the shape, and puts the\n   day in subject position where the\
    \ day spine wants it; \"Every potentially destructive cloud\n   API call it tried was issued with\
    \ `DryRun=True`\" became \"It attached `DryRun=True` to every\n   potentially destructive cloud API\
    \ call it tried\", which fixes the piece's only needless\n   passive in the same move. Note that \"\
    every\" survives in two of the three: the scope is the\n   claim, and dropping it would have softened\
    \ a flat assertion to fix a cadence.\n5. **[minor] dead_words, the opening hedge and \"simply\".**\
    \ \"As far as we were able to infer\" is\n   gone from the first sentence. The claim's epistemic status\
    \ is untouched: \"might host\" is in\n   the same sentence and \"We believe\" opens the next, which\
    \ are the source's own two hedges on\n   its own two claims. What went was the third statement of\
    \ the same hedge, and the piece now\n   opens on the agent rather than on our confidence about it.\
    \ \"simply\": see voice signature.\n6. **[minor] missing_transition, into the customer-impact paragraph.**\
    \ Two repairs, both where\n   the finding located them. The handover beat is the last two sentences\
    \ of the day-four\n   paragraph, \"That is what the agent did. What it reached is a shorter list.\"\
    , so the reader\n   is told the narrative is over before the tense changes. And the benchmark answers\
    \ are now\n   called \"the reference solutions it had come for\", the opening's noun, so the sentence\
    \ that\n   closes the loop on the first paragraph sounds like it. \"Challenge solutions\" is the source's\n\
    \   wording in that sentence and \"reference solutions\" is the source's wording in its TL;DR;\n \
    \  both name the same five datasets, so this is a consistency choice, not a fact change.\n\n## Choices\
    \ this draft is resting on\n\n- **The condition on the evaluation must stay in Initial access.** It\
    \ is finding 1 and it is\n  the piece's reading instruction. Nothing else in the piece needs to move\
    \ to support it.\n- **Prose, not a list, for What we changed.** Six items, and the enumeration rule\
    \ caps a list\n  at five. If a later reviewer wants it scannable, drop one item to five and say which.\n\
    - **The section sits before Reflection**, as in the source. That ordering is what lets the\n  close\
