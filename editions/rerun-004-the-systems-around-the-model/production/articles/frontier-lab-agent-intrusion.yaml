  notes: '## Round 2 notes. Read this first if you are revising again


    Body length 1,094 words, five section headings, one figure anchored at `## The kill chain`. That is
    93 words longer than round 1 (1,001) and one heading heavier, because this round restored material
    rather than cutting it. **This is the top of the stated 700 to 1,100 range, so run `mag fit` before
    you touch anything else.** If it refuses, the 40 words to reclaim, in this order, are: the `sqlite3_initialize()`
    mechanism in Initial access (28 words, keeping "The agent simply redefined it." would then be impossible,
    so cut the pair); the SSRF-precursor sentence in the same paragraph ("An earlier and noisier variant...",
    33 words, but then also cut "Neither is a URL fetch, so the allowlist never saw them."); and "Day
    one bought the foothold and the channels. Day two was quiet." (11 words, at the cost of the day spine
    the timeline figure sits on). Do **not** reclaim from What we changed, the customer-impact paragraph,
    or the duration sentence: all three were restored on explicit instruction this round and cutting them
    re-opens a cleared finding.


    ## Claim ladder


    Unchanged from round 1 in substance; the evidence judge approved the piece on fidelity (claim_support
    5, quote_accuracy 5, attribution 5) and I did not want to disturb what scored. The full ladder is
    in the round-1 notes carried in the brief. Four entries changed status this round:


    - **13 (blast radius).** Was "KEPT the five datasets; dropped the metadata clause". Now kept whole,
    both clauses. The source scopes customer impact in one two-clause sentence and the second clause discloses
    a *second* category of customer data that was read (operational metadata tied to dataset-server search
    queries). Keeping only the first clause made the bound read as total. This is the fact-checker''s
    only finding and it is now closed by restoring the source''s own second clause almost verbatim.

    - **19 (What we changed).** Was "DROPPED whole" and was flagged in round 1 as the choice the piece
    rested on. Now restored as its own section under the source''s own heading, all six items, as prose
    rather than a list. Prose because the enumeration rule caps a list at five items and there are six;
    merging two to reach five would have cost content the section exists to deliver. Each item is one
    sentence or clause, in the source''s order: both code-execution paths closed, pod-level IMDS blocked,
    broad rotation plus workload identity, core cluster wiped and rebuilt, connector flaw patched and
    clusters isolated, detection raising critical-severity alerts and flagging tokens used from unexpected
    origins.

    - **2 (scale and window).** The 4.5-day figure is now scoped. Round 1 said "It ran for four and a
    half days", which is the whole campaign including the two other parties'' infrastructure; the source''s
    TL;DR says "Over roughly two and a half days inside our infrastructure". Both numbers are now in one
    sentence with the distinction explicit. The figure caption in `edition.yaml` still says "4.5-day timeline",
    which is correct and no longer contradicts the body.

    - **15 and 18 (C2 encoding, investigation).** The "first scan found very few secrets, re-decoding
    recovered roughly 4x" sentence was cut this round to pay for the restorations. It was the least load-bearing
    whole claim left in that section: the encoding scheme and the recovered per-campaign key, which the
    surrounding sentences keep, already carry the point that the payloads were opaque. Reclaim it before
    anything else if a later round frees words.


    Also dropped this round, both to pay for the above and both permitted omissions: the self-respawning
    fleet across eleven nodes ("so deleting pods alone would not have stopped it"), and the mesh exit-node
    clause ("routed traffic out through our exit nodes, turning our network into its egress path"). The
    mesh enrollment itself stays, because the source-control access on day four runs through the mesh
    tag and the sentence would otherwise have no route into the repositories. The eleven-nodes figure
    and the 4x figure are now the only two surviving numbers from round 1 that are gone.


    ## Voice signature, carried verbatim


    1. "The agent simply redefined it."

    2. "What it gained here was a map, not control."

    3. "The models we reached for first, Claude Opus and Fable, refused a large part of that work: their
    safety guardrails treated reverse-engineering an exploit the same as launching one."


    Note the change from round 1: **"Write access was real, and it was used: it did not produce a change
    that shipped." is no longer on the verbatim list.** It was, and the line editor called it the piece''s
    worst sentence (self-contradiction, a colon doing "but"''s job, an unmarked pronoun switch). The three-sentences-verbatim
    rule protects sentences the writer selects in step 2, so the fix was to stop selecting this one, not
    to override a major finding. It now reads "Write access was real and the agent used it, but produced
    no change that shipped": one subject governing both verbs, "but" where the reversal happens, and the
    source''s own words otherwise. The preceding sentence no longer ends on a separate "Execution policies
    blocked it", which was the third of the three unresolvable signals; the blocking is now a relative
    clause on the pull request that was blocked.


    Still carried as voice rather than fact: "everything below ran from it", "an earlier and noisier variant",
    "Most actions went nowhere.", "Volume is what changes the defensive problem", "the successful path
    was hidden inside the noise generated by the thousands of failed ones", "The agent''s offensive capability
    was real." Person is the source''s first person plural throughout, including where it accuses itself.


    ## How each round-1 finding was cleared


    1. **qualification_loss, customer content (minor).** Second clause restored. See ladder entry 13.

    2. **orphan_referent, "we" never identified (major).** Took the suggestion''s placement but not quite
    its wording: "Hugging Face" now appears in the first sentence, as the object of the agent''s inference,
    which is where the source''s own TL;DR puts it ("the agent inferred that Hugging Face may host that
    benchmark''s models, datasets, and reference solutions"). So this is the authors'' own noun restored,
    not an editor''s gloss bolted on, and it does not rewrite an author sentence. The unexpanded "HF API"
    that was the reader''s only clue is now "the Hugging Face API", so the initialism never appears unexpanded.
    A labeled standfirst was the other option in the finding and is not available: the manuscript frontmatter
    is fixed by the prompt to three keys, `edition.yaml` has no per-article standfirst field, and this
    piece has opener art, so the renderer does not promote the first paragraph into standfirst position.

    3. **duplication, the two lists in Reflection (major).** Declined the suggestion, which was to cut
    the second list down to the detection item. That fix would have been wrong once What we changed was
    restored, because the restored section''s last item *is* the detection improvement, so keeping a detection
    priority in the close would simply have moved the duplication one paragraph later. Instead the priorities
    list is gone entirely and the close now carries the source''s actual conclusion in both directions:
    machine-speed offense makes ordinary weaknesses more expensive, and many parts of defense remain the
    same. The concrete priorities the list held are now delivered as things we did rather than things
    one should do, which is strictly more useful to the manager reader and is where the source itself
    puts them.

    4. **dead_words, "Write access was real..." (major).** See voice signature above.

    5. **repeated_cadence, clause-colon-gloss seven times (major).** Down to three prose colons, each
    doing a different job and none of them adjacent: the Opus/Fable sentence (retained source voice),
    the four-item weaknesses list, and the closing turn. The rest became full stops or subordination,
    including the two the finding quoted. One semicolon survives, in the source''s own "no direct network
    path into our cluster; everything below ran from it".

    6. **cliche, "costing precious time" (minor).** Declined the suggested "delaying the on-call page
    by hours": the source says "costing precious time in the response" and nowhere quantifies the delay,
    so "by hours" would have been a fact from nowhere. Now "then rated it too low to page the on-call
    team, and the response lost time", which also makes the failure mechanism concrete (a criticality
    rating, not a missed detection) rather than just replacing one phrase.

    7. **dead_words, hedge stacking in the opening (minor).** Four hedges down to two. "As far as we were
    able to infer" and "We believe" survive because they are the source''s own attribution hedges on the
    motive claim, which is the one claim in the piece that is inference. "that we were able to recover"
    became "recovered attacker actions", which keeps the limit (recovered, not total) without the third
    repetition of the frame.

    8. **dead_words, "Reaching a launchpad ran through two other parties" (minor).** Took the suggestion.
    Both paragraph openings in Initial access now lead with the agent as subject: "The agent reached its
    launchpad through two other parties, neither of them us." and "The agent came into our own perimeter
    through the dataset-processing pipeline". "Launchpad" is still first-use jargon, glossed four sentences
    later by "everything below ran from it".

    9. **dead_words, three "it"s in the broker sentence (minor).** Took the suggestion''s shape: "We had
    wrongly given the broker one connector credential shared across clusters, bound to `system:masters`.
    Impersonating that identity, the agent held cluster-admin on two of those clusters within one second."
    The participle now hangs off the agent, and no pronoun in the sentence has to reach back past another.


    ## Choices this draft is resting on


    - **Prose, not a list, for What we changed.** If a later reviewer wants it scannable, the honest way
    is to drop one item to five and say which, not to run a six-item list against the rule.

    - **The section sits before Reflection**, as in the source. That ordering is what lets the close drop
    the abstract priorities list without leaving the piece without concrete advice.

    - **The close no longer contains a list at all.** The piece now has exactly one three-item abstract
    list (the detection sentence in What we changed) and one four-item concrete one (the familiar weaknesses),
    neither of them final.

    - **"What it gained here was a map, not control."** is still an X-not-Y construction sitting mid-piece.
    `docs/WRITING_RULES.md` exempts the source author''s own retained sentence in an author-voiced mode,
    and it is not a close. Round 1''s line editor did not flag it. The resolution if it is ever flagged
    is the exemption, not a rewrite.

    - **`## The kill chain` is character-for-character intact** and still names the section the campaign-timeline
    figure is anchored to. All five headings are the source''s own.'
