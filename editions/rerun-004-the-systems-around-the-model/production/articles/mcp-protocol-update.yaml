    own section under the source''s own heading.


    What is in it now, in the order it runs: the alignment claim; `iss` validation with the mix-up rationale
    and the future-version expectation; credential binding to the `issuer` plus re-registration on migration;
    the refresh-token, step-up scope and `.well-known` clarifications in one sentence; and `application_type`
    last. All six authorization SEPs from the source are now represented.


    Two deliberate choices inside it:


    - **Source order was broken once.** `application_type` is last, not second, because it is the most
    concretely developer-visible fix in the section and the section needed a landing that was not a list
    of clarifications. Reverting it to source order costs nothing but the ending.

