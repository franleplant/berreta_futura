  notes: '## Round 2 notes. Read these before the round 1 notes below them.


    The round 1 claim ladder and voice signature are unchanged and are reproduced at the bottom; they
    are still the map of this piece. What follows is only what round 2 changed and why, because every
    change was made to clear a finding and a round 3 reviser needs to know which sentences are now load-bearing
    for a *review* reason rather than an argument reason.


    ### The shape changed in one place: Authorization is a section again


    Round 1 folded the whole authorization category into two clauses of "What you have to change now"
    and cut five of the six authorization SEPs. That was a defensible budget call and it survived the
    fact-check, but it lost a category the source''s own dek names as one of six headline changes, so
    a reader finished the piece not knowing that authorization moved at all. Round 2 gives it back its
    own section under the source''s own heading.


    What is in it now, in the order it runs: the alignment claim; `iss` validation with the mix-up rationale
    and the future-version expectation; credential binding to the `issuer` plus re-registration on migration;
    the refresh-token, step-up scope and `.well-known` clarifications in one sentence; and `application_type`
    last. All six authorization SEPs from the source are now represented.


    Two deliberate choices inside it:


    - **Source order was broken once.** `application_type` is last, not second, because it is the most
    concretely developer-visible fix in the section and the section needed a landing that was not a list
    of clarifications. Reverting it to source order costs nothing but the ending.

    - **The `iss` future expectation stays hedged exactly.** "In a future version, clients will be expected
    to reject responses that omit `iss`" and "should begin supplying it now" are the whole claim strength
    of that sentence. This is not a requirement of this release. Do not tighten it.


    Cost: roughly 90 words. The piece is still inside the prompt''s 700 to 1,100 band. If a future round
    needs the space back, take it from the `.well-known`/step-up/refresh-token sentence first, then from
    the credential-binding sentence, and leave `iss` and `application_type` alone.


    ### Finding 1, repeated_cadence, is the finding this draft is built around


    The line editor was right and the diagnosis was exact: three consecutive sections ran the same engine
    (announce a count, list two items, close on a sentence-initial "And"), so the back half read as one
    paragraph shape run four times. Every instance was the synthesis''s own arrangement, not the authors''
    wording, so all of it was repairable without touching a source sentence. What was removed:


    - "Three smaller changes make the resulting traffic easier to operate." Cut. This was carried in round
    1 as a voice sentence, and losing it is a real cost, but it is the clearest instance of the count
    engine and the section reads fine opening cold on the `Mcp-Method` requirement. If a round 3 wants
    it back, it can only come back if no other section announces a count.

    - "And the `traceparent`..." Now runs as the third sentence of a three-sentence section with no announced
    count and no "And".

    - "Three governance SEPs are designed so that..." Now "The governance work in it is designed so that...".
    The count is gone; the claim is not.

    - "And a Standards Track SEP can no longer reach Final status..." Now opens on its own subject.

    - "And the error code for a missing resource changes..." Now its own paragraph opening on "The error
    code".


    **No sentence in this manuscript begins with "And". Check that before shipping any round 3 edit.**
    Two of the three removals were counts, and re-adding any count anywhere reopens this finding, because
    the surviving triads (the heading "Routable, cacheable, traceable", the three-item deprecation list,
    "Active, Deprecated, and Removed") are all the source''s own and cannot go.


    Section openings now run: a concrete header requirement; a history sentence; an alignment claim; a
    deprecation announcement with a list; the authors'' verbatim "This release contains breaking changes."
    Section endings run: a span tree; a migration obligation; a rejected localhost redirect URI; an imperative;
    a hedged expectation. That spread is the fix. Preserve the spread, not the specific sentences.


    ### Finding 2, duplication, lede versus first section


    Cut the trailing clause "and the sticky routing and shared session stores that horizontal deployments
    needed are no longer required at the protocol layer". The opener already spends sticky sessions and
    the shared session store; the section now ends on "any MCP request can land on any server instance",
