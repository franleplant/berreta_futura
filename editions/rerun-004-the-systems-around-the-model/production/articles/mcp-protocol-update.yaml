  notes: "## The sentence\n\nThe release notes present twenty-odd changes at one level; this piece sorts\
    \ them\ninto the one that forces you to rewrite code you already shipped (the\nexperimental Tasks\
    \ API), the two one-line client edits (`-32002`, `iss`), and the\nthree deprecations you can leave\
    \ alone for at least a year, and then says what\nthe whole break is being traded for.\n\nChecked against\
    \ the finished draft: the Tasks migration is the section heading,\nthe two small edits are named with\
    \ the literals a reader would grep for, and the\n\"no such year\" line is the piece's turn. It holds.\n\
    \n## The two absences\n\n1. **MCP Apps (SEP-1865)** in full. Sandboxed iframes, prefetchable UI\n\
    \   templates, the shared audit and consent path. It is real and it obliges\n   nobody: no shipped\
    \ code breaks if you never read it. It was the largest single\n   omission and the easiest to defend.\n\
    2. **\"Server-to-client requests, restructured\"** in full. SEP-2260 (server\n   requests only while\
    \ processing a client request) and SEP-2322\n   (`InputRequiredResult`, `requestState`, the client\
    \ re-issuing the original\n   call). This one was a genuine loss and the closest call in the draft:\
    \ it is\n   the clearest illustration of what statelessness *costs* a server author. It\n   went because\
    \ the cost story is already carried by the handles paragraph, which\n   costs the reader a design\
    \ decision rather than an SDK upgrade, and because the\n   elicitation rework is delivered to almost\
    \ every reader by their SDK. If a\n   later round has words to spare, this is the first thing to buy\
    \ back, and buy\n   it back as prose in the \"Stateless protocol, stateful applications\" section,\n\
    \   not as a new heading.\n\nAlso gone, below the two: the extensions framework's machinery (reverse-DNS\
    \ IDs,\n`ext-*` repos, delegated maintainers, the Extensions Track, the `extensions`\ncapability map),\
    \ the full JSON Schema 2020-12 lifting (composition, conditionals,\n`$ref`/`$defs`, unrestricted output\
    \ schemas, the no-auto-dereference rule), W3C\nTrace Context / SEP-414, the credential-binding and\
    \ re-registration rules\n(SEP-2352), refresh tokens (SEP-2207), scope accumulation (SEP-2350), the\n\
    `.well-known` suffix (SEP-2351), the \"Looking Ahead\" thank-yous, and the\nissue-tracker/Discord\
    \ chrome.\n\n## Claim ladder\n\n**Central claim.** `2026-07-28` makes MCP stateless at the protocol\
    \ layer, which\nis a breaking change taken once, and the governance shipped beside it (a feature\n\
    lifecycle with a twelve-month floor, extensions as the place capabilities\nstabilize, a conformance-gated\
    \ Standards Track) is meant to make it the last\nbreak of that kind.\n\nSupporting, with evidence\
    \ attached:\n\n1. Handshake and session removed (SEP-2575, SEP-2567); version/client\n   info/capabilities\
    \ move to `_meta`; `server/discover` added. Evidence: any\n   request lands on any instance, so no\
    \ sticky routing and no shared session\n   store. **Kept, opener.**\n2. Operational payoff: round-robin\
    \ LB, route on `Mcp-Method`/`Mcp-Name`\n   (SEP-2243, servers reject header/body disagreement), cache\
    \ `tools/list` for\n   `ttlMs` with `cacheScope` (SEP-2549, modeled on `Cache-Control`). **Kept,\n\
    \   paragraph 2.** This is the `stripped_utility` insurance: it is where all the\n   typeable surface\
    \ lives.\n3. Application state survives via explicit handles (`basket_id`, `browser_id`).\n   Author's\
    \ judgment: often more powerful than session state, because the model\n   can compose, reason about\
    \ and hand off handles. **Kept whole.**\n4. Server→client requests restructured. **Cut, absence 2.**\n\
    5. Extensions formalized (SEP-2133). **Cut to a clause** (\"ship and stabilize as\n   an extension\"\
    ) in the last section.\n6. MCP Apps. **Cut, absence 1.**\n7. Tasks moves from experimental core to\
    \ extension; `tasks/list` removed;\n   migration required. **Kept and promoted to the piece's spine.**\n\
    8. Authorization: `iss`/RFC 9207 mix-up mitigation, `application_type` in DCR.\n   **Kept, two sentences\
    \ each.** Four other auth SEPs cut.\n9. Roots/Sampling/Logging deprecated (SEP-2577), annotation-only,\
    \ a year of\n   versions, removal needs its own SEP. **Kept, replacement table cut.**\n10. JSON Schema\
    \ 2020-12 (SEP-2106). **Cut.** The `-32002` → `-32602` change\n    (SEP-2164) that sits beside it\
    \ in the source **kept**, because it is one of\n    only two edits the source itself phrases as an\
    \ imperative to the reader.\n11. Governance: lifecycle, extensions, conformance gate (SEP-2484). **Kept\
    \ as\n    one sentence**, minus the twelve-month restatement, which paragraph 6\n    already carries.\n\
    12. Timeline: RC locked May 21, final July 28, ten weeks, Tier 1 SDKs. **Kept.**\n\nQualifications\
    \ carried verbatim or near it: \"In practice, we've found\",\n\"It's often a more powerful one\",\
    \ \"within a year\", \"will require a separate SEP\",\n\"should begin supplying it now if they don't\
    \ already\", \"before, if ever\",\n\"We don't intend for that to be the norm\", \"Our expectation\
    \ is that\". None was\ntraded for length.\n\n## Voice signature\n\n1. \"In practice, we've found this\
    \ pattern (the model threading an identifier\n   from one tool call to the next) to be more than just\
    \ a workable substitute for\n   session state. It's often a more powerful one.\"\n2. \"This release\
    \ contains breaking changes. We don't intend for that to be the\n   norm.\"\n3. \"If your client matches\
    \ on the literal `-32002` value, update it.\"\n\nAll three survive. (1) is the sentence the previous\
    \ draft broke: it had \"we've\nfound that pattern often a more powerful substitute for session state\"\
    , which\nlost the copula and also flattened the author's two-step, workable-then-powerful,\ninto one\
    \ adjective. It is restored to the source's own two sentences. Do not\nre-compress it.\n\n## What\
    \ the shape is resting on\n\n- **Order.** Source order is stateless / stateful apps / server-to-client\
    \ /\n  routable / extensions / MCP Apps / Tasks / authorization / deprecations / JSON\n  Schema /\
    \ evolution / timeline. Here it is: what changed and what it buys you\n  (opener) → what it costs\
    \ you to keep state (handles) → what you must change\n  (Tasks, then the error code) → what you may\
    \ leave alone for a year\n  (deprecations) → the one security item → what the break buys. Tasks moves\
    \ from\n  seventh to the spine. The deprecation paragraph is deliberately parked under\n  the Tasks\
    \ heading rather than given its own, so that \"The experimental Tasks\n  API got no such year\" has\
    \ something to land against.\n- **The one inference.** That last line joins two source facts (deprecated\n\
    \  features keep working for a year of spec versions; anyone on the experimental\n  Tasks API must\
    \ migrate now) and states neither more strongly than the source\n  does. It is the piece's only added\
    \ conclusion and it is the whole reason the\n  piece is not a changelog. If an `evidence` finding\
    \ challenges it, do not delete\n  it: reduce it to the juxtaposition (\"Tasks was never Active under\
    \ that policy\")\n  before losing the turn.\n- **Headings.** All four name a consequence or an instruction,\
    \ none is a source\n  section title with the verbs changed. \"Extensions become first-class\" and\n\
    \  \"Authorization hardening\", both named as failures in `docs/WRITING_RULES.md`,\n  are gone: the\
    \ second is now \"Mix-up attacks and localhost redirects\", which\n  names the attack, per the rule\
    \ v repair.\n- **Passives made active on purpose.** \"Roots, Sampling, and Logging are\n  deprecated\"\
    \ and \"`tasks/list` is removed\" became \"We deprecated\" and \"We\n  removed\". The source establishes\
    \ the first person four times, and the byline is\n  the two lead maintainers, so the actor is known\
    \ and is the subject. First\n  person first appears at \"we've found\" in the handles paragraph, before\
    \ either.\n- **Code blocks.** All four fenced blocks in the extraction are dropped whole.\n  Validation\
    \ matches fences character for character against the source's own\n  lines, and the extraction's blocks\
    \ are line-broken by the PDF conversion, with\n  the third truncated mid-string (`\"version\":` with\
    \ nothing after it). None could\n  be reproduced faithfully, so none was reproduced.\n- **Sibling\
    \ piece.** `mcp-in-a-nutshell` in this issue already explains the\n  protocol, already says MCP is\
    \ stateless, already names `server/discover`, and\n  already covers the Sampling and Logging deprecations\
    \ and their replacements.\n  Nothing here re-explains the protocol, and the deprecation replacement\
    \ table\n  was cut partly because two thirds of it is in the sibling. Roots and the\n  twelve-month\
    \ guarantee are new here.\n- **Length.** 691 body words against a 2,046-word extraction, 34%. The\
    \ previous\n  draft was 1,094, 53%, and grew 27% over the one before it. The opening\n  paragraph\
    \ measures 6 of 9 typeset lines at 403 characters, checked with\n  `mag fit --opener`, so there is\
    \ room to grow it if a later round needs to move\n  a sentence up."
