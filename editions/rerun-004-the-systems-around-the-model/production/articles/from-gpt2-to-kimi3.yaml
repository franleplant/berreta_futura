  notes: "## Budget: measured, not estimated\n\n1,089 body words. I copied the repo to a scratch directory,\
    \ wrote this manuscript into\n`editions/rerun-004-.../articles/from-gpt2-to-kimi3.md` *in the copy*,\
    \ and ran `mag fit`\nagainst it: **p19-p24, 6/7 pages, OK**, whole edition still `fit: every page\
    \ budget holds`.\nNothing was written into the real repo except this reply.\n\nDo this before you\
    \ cut anything. Round 1's notes agonised over 996 vs 1,000 words and cut\nthe Schlag quotation to\
    \ get there; the actual constraint had almost a full page of slack.\nThe prompt's \"roughly 700 to\
    \ 1,100\" is not the binding number, pagination is, and this\npiece paginates short because it carries\
    \ no code blocks. The recipe:\n\n    cp -R <repo> /tmp/scratch/repo\n    # write the manuscript into\
    \ the copy's articles/ path\n    PYTHONPATH=/tmp/scratch/repo/src <repo>/.venv/bin/python -m magazine\
    \ fit \\\n        rerun-004-the-systems-around-the-model --language en\n\n`fit` also proves the two\
    \ pinned figure anchors resolved. A renamed heading fails there,\nso a green `fit` is the anchor check\
    \ as well as the budget check.\n\n## Step 1: claim ladder\n\n**Central claim.** The jump from GPT-2\
    \ to KimiK3 is not scale alone: each architectural\nstep changes what the model stores, how it updates\
    \ that state, or how it retrieves what a\nfixed-size state cannot preserve, because a fixed-capacity\
    \ associative memory needs an\neviction policy and learned selection supplies it.\n\n**Supporting\
    \ claims, in argument order, with evidence.**\n\n1. Scale contrast: 22,580 GPT-2 models fit inside\
    \ KimiK3; 124M against 2.8T; 2019 to 2026.\n2. GPT-2 is decoder-only and computes representations\
    \ for every position while decoding\n   consumes one. Without a cache the projections are recomputed\
    \ each step.\n3. The KV cache fixes that, retains N-1 tokens' vectors, grows O(N), and can become\
    \ a\n   memory-bandwidth bottleneck.\n4. Linear attention folds the growing K/V set into a fixed D×D\
    \ state, because a feature\n   map applied separately to q and k makes the product re-associable.\n\
    5. The author's correction to the linear-attention paper's O(N²)-per-step framing, plus\n   his own\
    \ defence of it: full N×N matrices, no FlashAttention, no KV cache in reference\n   implementations\
    \ at the time.\n6. Linear attention trades fidelity: the feature map is a less expressive approximation\
    \ of\n   the softmax kernel, with the loss depending on architecture and workload.\n7. A finite cache\
    \ interferes. Token i-1 gets no slot; the additive update is both the\n   efficiency and the interference;\
    \ N >> D is where it shows.\n8. DeltaNet restores recoverability: read at the current key, subtract,\
    \ scale, write back.\n9. **Chunking parallelizes purely additive linear attention, and explicitly\
    \ does not carry\n   over to the delta rule.** Every state is needed to compute what must be subtracted,\
    \ so\n   the authors reparameterize into a first-order linear recurrence, and only that form\n   lets\
    \ a chunk compute all C deltas at once.\n10. Gated DeltaNet adds general forgetting: the delta rule\
    \ forgets only where it has a\n    replacement; Mamba-2 decays then adds at full strength; uniform\
    \ decay ignores varying\n    importance; alpha=1 is pure delta, alpha=0 clears memory.\n11. Kimi Linear\
    \ adds per-channel gating. Its headline result is *the authors' own\n    presentation*: better quality\
    \ and up to 6x decode throughput, under controlled\n    comparisons, as a drop-in replacement.\n12.\
    \ KimiK3 = Kimi Linear plus scale, latent MoE, and AttnRes. 23 four-layer macrocycles,\n    3 KDA\
    \ + 1 MLA; 898 experts, 2 shared, 16 of 896 routed; equal-weighted residual sum\n    gives no selective\
    \ access and destabilizes training; AttnRes weights each term by a\n    query-key dot product; every\
    \ 12 layers, eight blocks, ~2% latency, 1.25x compute.\n13. Conclusion: AttnRes and MLA attack one\
    \ limit from two directions (context vs depth);\n    fixed-capacity memory needs an eviction policy;\
    \ learned selection supplies it;\n    attention is the most effective selective-read mechanism.\n\n\
    **Hedges kept, none hardened.** \"can reduce fidelity\" / \"depends on the architecture and\nworkload\"\
    ; \"the cheapest in pure FLOP terms but not necessarily in wall-clock time\"; \"about\nseven hours\"\
    ; \"drew attention for one central claim\" and \"The authors presented it as\" and\n\"up to 6x\";\
    \ \"At first glance ... appear modest\"; \"roughly 2%\"; \"can destabilize training\";\n\"must inevitably\
    \ discard information\"; \"does not directly apply\"; \"without some\nmathematical re-parameterization\"\
    .\n\n## Step 2: voice signature (verbatim, do not paraphrase)\n\n1. \"The paper's O(N²) framing threw\
    \ me off.\" + \"That's what Flash Attention fixes... then\n   I saw that it was released in 2020.\"\
    \n2. \"It took me about seven hours to develop a working understanding of it.\"\n3. \"Inside a block\
    \ I do real attention (the masked QKᵀ times V), and across blocks I fold\n   everything into the state\
    \ and read it back with one matmul.\"\n\nAlso carried: \"Twenty-two thousand five hundred and eighty.\"\
    , \"But is it just... scale?\",\n\"There is a trade-off.\", \"Scaling laws remain relevant, but capacity\
    \ must be added in the\nright place and in a form the system can use.\", and the closing eviction-policy\
    \ pair.\nPerson is preserved both ways: \"I\" for the author's own struggle, \"we\" for author and\n\
    reader walking the architecture.\n\n## How each round-1 finding was cleared\n\n1. **[major] qualification_loss,\
    \ chunking answers the delta problem.** This was the real\n   defect and it was made in round 1's\
    \ claim ladder, not in its prose: item 9 read\n   \"DeltaNet can be parallelized by chunking\", which\
    \ is the source's *additive* result\n   promoted into the delta section. The manuscript could not\
    \ be honest while the ladder\n   was wrong. Rewritten as two paragraphs that keep the order the source\
    \ uses: chunking\n   works for purely additive linear attention (with C=N / C=1 as its identities,\
    \ which is\n   where the source states them), then a flat paragraph saying it does **not** directly\n\
    \   apply to the delta updates, why (every state is needed to compute the subtraction), and\n   what\
    \ the authors do instead. The reparameterized recurrence is named as a first-order\n   linear recurrence;\
    \ \"generalized Householder transition matrices\" is dropped as jargon\n   that buys nothing at this\
    \ length, and the load-bearing part, that a rewrite was\n   *necessary*, survives. Do not re-merge\
    \ these two paragraphs.\n2. **[major] attribution_error.** \"The authors presented it as\" restored\
    \ as its own\n   sentence, and the appositive weld undone. The 6x, the quality claim and \"drop-in\"\
    \ now\n   all sit inside the attributed sentence.\n3. **[minor] qualification_loss, FlashAttention\
    \ era.** The defending sentence is restored\n   after the correction. Trimmed \"reference autoregressive\
    \ implementations\" to \"reference\n   implementations\" only.\n4. **[major] duplication, 22,580 twice.**\
    \ \"We scaled up by a factor of 22,580 in seven\n   years.\" is cut. The opener is now three sentences,\
    \ 29 words. Round 1's note claimed the\n   opener had to reach 40 words for the illustrated opener\
    \ page: that is not true, there is\n   no minimum in `weasyprint_adapter._illustrated_opener_*`, only\
    \ an overflow guard, and\n   29 words paginates fine. The weak line round 1 added to pad it (\"Here\
    \ is how much, or\n   how little, actually changed\") is gone with it.\n5. **[major] orphan_referent.**\
    \ Fixed by supplying context, not by deleting the \"I\". A\n   labeled `**Editor's note.**` sits as\
    \ paragraph two, exactly the pattern\n   `factory-systems-problem.md` already ships in this edition,\
    \ and it names the worklog,\n   its date, and the papers in order. That gives \"the paper\" an antecedent\
    \ in the\n   linear-attention section, gives \"the authors\" one in the delta-parallelization\n  \
    \ paragraph, and stages the reading so \"then I saw that it was released in 2020\" is a\n   beat in\
    \ a story the reader is now inside. Every fact in the note is in the extraction\n   (\"In this worklog,\
    \ I'll walk through\", \"3:22 PM · Jul 27, 2026\", \"Eloquently put by\n   Schlag's paper (Fast Weight\
    \ Programmers)\", the source's own section titles). It names\n   no paper the source does not name;\
    \ the linear-attention paper has no title in the\n   extraction, so it is called \"linear attention\"\
    \ and nothing more. The reviewer's\n   suggested line, \"Kimi's own writeup frames the cost as O(N²)\"\
