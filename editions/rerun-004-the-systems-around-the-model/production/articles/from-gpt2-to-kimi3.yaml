  notes: '## Step 1: claim ladder


    **Central claim.** The jump from GPT-2 to KimiK3 is not scale alone: each architectural step changes
    what the model stores, how it updates that state, or how it retrieves information a fixed-size state
    cannot preserve, because a fixed-capacity associative memory needs an eviction policy and learned
    selection supplies it.


    **Supporting claims, in argument order, with their evidence.**


    1. Scale contrast. 22,580 GPT-2 models fit inside KimiK3; 124M parameters (about 50k tokens, 12 blocks,
    12 heads, embedding dim 768) against 2.8T; a factor of 22,580 in seven years, 2019 to 2026.

    2. GPT-2 is decoder-only; the LM head maps the final hidden-state matrix to vocabulary logits; only
    the final position''s logits are used per decode step. Evidence: the source''s stated inefficiency,
    that representations are computed for every position and consumed for one.

    3. The KV cache removes the recomputation. Evidence: it retains vectors for the previous N-1 tokens,
    grows O(N), can become a memory-bandwidth bottleneck, and each decode step does two ND reads and two
    1D writes to HBM.

    4. Linear attention folds the growing K/V set into a fixed D×D state. Evidence: softmax applies its
    nonlinearity after q·k, coupling every query to every key; a feature map such as ELU+1 applied to
    q and k separately makes the product re-associable.

    5. Author''s correction to the linear-attention paper: the O(N²)-per-step framing is wrong, Flash
    Attention fixes that, released 2020. Evidence/context: at the time training materialized the full
    N×N matrix, FlashAttention did not exist, and reference autoregressive implementations often recomputed
    history without a KV cache.

    6. Linear attention trades fidelity. Evidence: the feature map is a less expressive approximation
    of the softmax kernel.

    7. A finite cache interferes. Evidence: token i-1 gets no slot of its own, it is added to the same
    D by D matrix; the additive update is simultaneously the efficiency gain and the interference source;
    the N >> D regime that makes linear attention attractive exposes the limit; Schlag''s Fast Weight
    Programmers quote.

    8. DeltaNet restores recoverability. Evidence: read the cache at the current key, subtract, scale
    by the key, write back; Q is a learned pointer, Wq and Wk read the same residual stream.

    9. DeltaNet can be parallelized by chunking. Evidence: first-order linear recurrence with generalized
    Householder transition matrices; chunks of size C; within-block real attention plus across-block state
    folding; C=N recovers O(N²) attention, C=1 is regular linear attention.

    10. Gated DeltaNet adds general forgetting. Evidence: the delta rule can only forget where it has
    a replacement; Mamba-2 decays the previous cache then adds the new at full strength; uniform decay
    ignores varying importance; alpha=1 is pure delta, alpha=0 clears memory.

    11. Kimi Linear adds fine-grained gating. Evidence: per-channel decay instead of one scalar; MLA interleaving;
    MoE replacing the MLP; the claim of beating full attention under controlled comparisons with up to
    6x decode throughput.

    12. KimiK3 is Kimi Linear plus scale and four smaller changes, of which AttnRes is the substantive
    one. Evidence: 23 four-layer macrocycles, 3 KDA + 1 MLA; equal-weighted residual sum gives no selective
    access and destabilizes training via ever-larger layer outputs; AttnRes weights each term by a query-key
    dot product; block boundaries every 12 layers, eight blocks, roughly 2% latency, 1.25x compute advantage.

    13. Conclusion: AttnRes and MLA attack the same limit from different directions (context vs depth);
    a fixed-capacity memory needs an eviction policy; learned selection is necessary; attention is the
    most effective selective-read mechanism.


    **Qualifications, hedges and admissions (all load-bearing, none hardened).**

    - "how much, or how little, has actually changed" (kept in the opener).

    - "the practical accuracy loss depends on the architecture and workload" (kept).

    - "C=1 is the cheapest option in pure FLOP terms, but not necessarily in wall-clock time" (kept).

    - "It took me about seven hours" (kept).

    - "Kimi Linear drew attention for one central claim" and "The authors presented it as" (kept: attribution
    to the paper''s authors, not the source author''s own endorsement).

    - "At first glance, the changes from Kimi Linear appear modest" (kept).

    - "roughly 2%" (kept as "roughly").

    - "may benefit from different weightings", "can destabilize training", "must inevitably discard information"
    (kept).

    - Dropped hedges: "possibly the most important part of the block_attn_res function" (its subject,
    the code, is gone).


    ## Step 2: voice signature (carried verbatim)


    1. "The paper''s O(N²) framing threw me off." plus "That''s what Flash Attention fixes... then I saw
    that it was released in 2020."

    2. "It took me about seven hours to develop a working understanding of it."

    3. "Inside a block I do real attention (the masked QKᵀ times V), and across blocks I fold everything
    into the state and read it back with one matmul."


    Also carried verbatim for voice: "Twenty-two thousand five hundred and eighty.", "But is it just...
    scale?", "We scaled up by a factor of 22,580 in seven years.", "There is a trade-off.", "Old information
    is removed and new information is written in its place.", "Scaling laws remain relevant, but capacity
    must be added in the right place and in a form the system can use.", and the whole closing pair beginning
    "A fixed-capacity associative memory needs an eviction policy".


    Person is preserved throughout: the source alternates "I" for the author''s own struggle and "we"
    for the reader-and-author walking the architecture. Both survive ("we want to store", "we scaled up",
    "I do real attention").


    ## Step 3: shape and cuts


    **Cut order applied, in the prompt''s order.**


    The first draft came in at 1,317 body words against a 1,000-word ceiling. Everything below was removed
    in four passes, in the prompt''s order, and the passes stopped the moment the piece fit (996 words).


    1. *Second and third examples of a point already carried.* Dropped the three-step decomposition of
    attention (non-negative scores, divide by the sum, weighted average of values) because the trade-off
    paragraph already carries "less expressive feature map"; dropped the "read back with the same key"
    worked example (k @ (k.T @ v) = squared norm of k times v) because the delta-rule paragraph already
    states what the read returns; dropped the second sequential-prefill loop, which restates the first.
    **Dropped the Schlag quotation** ("endlessly adding new associations to a memory of finite size ...
    inevitably will reach a limit"), which was the third statement of interference-at-capacity inside
    one paragraph. This was the most painful cut and the first thing to restore if the budget ever loosens:
    it is the only outside voice in the source and the author flags it as "eloquently put".

    2. *Supporting evidence before the claim.* Dropped the FLOP algebra (2Ld² fixed, 2LCd growing, 2L²d
    at C=L) but kept its conclusion, that C=N is standard attention and C=1 is linear attention; dropped
    C often being 64 or 128 and the UMMA reference; dropped the "generalized Householder transition matrices"
    formulation and the reparameterized recurrence S_t = S_{t-1}(I − β_t k_t k_tᵀ) + β_t v_t k_tᵀ, keeping
    only the chunking they enable; dropped the AttnRes formulas; dropped the 898/2 shared/896/16 expert
    counts and the near-3x-slower unfused SiTU path with its offsetting latent-space FLOP halving; dropped
    the GPT-2 config numbers (50304 vocab, 12/12/768) and the language-model-head walkthrough, because
    the argument is unchanged by them and the opener already carries 124M; dropped the FlashAttention-era
    context (full N×N matrices, no KV cache in reference implementations) that explains why the linear-attention
    paper framed cost as it did, keeping the author''s correction itself; dropped "two ND reads and two
    1D writes to HBM", keeping the memory-bandwidth bottleneck it evidences.

    3. *Whole claims, least load-bearing first.* Dropped "Q is also a learned pointer" with the Wq/Wk
    residual-stream explanation. Dropped gated MLA''s mechanism (element-wise multiplication with a gate
    projected from the input), the conventional-MoE router explanation, MLA query LoRA and output gating
    as separate topics, and the shared-expert down/up projection; all four are named in the K3 change
    list but never explained, and the source itself defers MLA and MoE to "later sections". Dropped beta
    as a named per-token write strength, keeping its effect in prose. Dropped the mention of MLA-interleaving
    and MoE from the **Kimi Linear** paragraph specifically, because the Kimi K3 paragraph states both
    and the piece must not say anything twice. Dropped the @chloey3k credit and all X chrome, reply counts,
    and view counts.

    4. *Qualifications and the author''s conclusions.* Nothing cut here. Every hedge listed in step 1
    survives, and both closing paragraphs of the source survive, merged into one. One near-miss to watch:
    an intermediate revision dropped "Scaling laws remain relevant, but" to save four words, which would
    have been a pass-4 cut made during pass 3. It was restored and the words found elsewhere.


    **Code.** Every fenced block was dropped whole. The extraction is pdftotext output and every Python
    block is truncated at the right margin (`q, k, v = self.c_attn(x).split(self.n_embd, dim=2)` runs
    off, `float(''-i`, `# re-asse`, `k.size`). The prompt allows only character-for-character reproduction
    or a whole drop, and character-for-character here means shipping visibly broken code. Dropping all
    of it also freed most of the budget, which is what made a 900-word version of a very long source possible.
    A future reviser wanting code must re-extract from the PDF, not from `extracted.md`.


    **Enumerations.** Three lists in the source. The three attention steps became prose and then were
    cut (fate: conclusion alone). The three Kimi Linear changes became prose inside the Kimi Linear paragraph,
    because they are moves in the argument, not things to scan. The six-item KimiK3 change list stayed
    a list only in the sense of an inline series inside a sentence, trimmed to five items and used to
    set up AttnRes as the one the piece then explains.


    **Numbers kept and why.** 22,580 / 124M / 2.8T: the thesis contrast, kept exactly. N-1, O(N), two
    ND reads and two 1D writes: the cache''s cost, which is the reason for everything after it. 6x decode
    throughput: the size of Kimi Linear''s claim, which is the claim. 23 macrocycles, 3+1 layers, every
    12 layers, eight blocks: the shape of K3, and the 12/8 pair is the reason AttnRes is affordable. 2%
    latency and 1.25x compute: the AttnRes trade, useless without both halves. Everything else went.


    **Structure decision.** The source is chronological and so is this, because the argument is chronological:
    each system fixes a limit named in the previous paragraph. The through-line I held to is the cache.
    GPT-2 creates it, linear attention bounds it, DeltaNet edits it, Gated DeltaNet clears it, Kimi Linear
    makes clearing per-channel, and AttnRes runs the same selection along depth instead of along context.
    Every section transition is a limitation, never a topic change. If a reviser needs to cut further,
    the Gated DeltaNet / Kimi Linear section merges most cleanly, since both are "the decay got finer".


    **Choices this piece rests on.** (a) The opener is the source''s own opener, nearly verbatim, with
    the 124M/2.8T figures pulled forward so the GPT-2 section need not restate them. The author repeats
    22,580 twice (spelled, then in digits) and I kept the repetition because it is his. If a reviser restores
    the parameter count later in the piece, the opener''s arithmetic becomes a duplicate. (b) "Here is
    how much, or how little, actually changed" is the weakest line in the manuscript. It is the author''s
    phrase, but it edges toward the banned self-announcing opener, and it is there partly because the
    paragraph had to reach 40 words for the illustrated opener page. If someone finds a fourth concrete
    sentence, use it. (c) The four figure-free numbers the piece rests on are 6x decode throughput, 2%
    latency, 1.25x compute, and eight AttnRes blocks; a fact-checker will find all four in the extraction,
    but 6x and 2% carry "up to" and "roughly" and must keep them. (d) Section headings use the source''s
    own words (Gated Delta Net, KDA/Kimi Linear, Kimi K3), merged where two source sections argue one
    thing; the two figure-anchored headings were given. (e) "The last of those reaches the residual stream"
    is my connective into AttnRes. It is a pointer, not a judgment, but it is the sentence a fact-checker
    is most likely to query, and "AttnRes changes the residual stream" is the flat fallback.


    ## Honest comparison against the shipped version


    Read after this draft was finished. Shipped: 844 body words, 37-word opener, six sections. Mine: 996
    body words, 49-word opener, four sections.


    **Where the shipped version is plainly better.**


    1. *The opener.* "That is how many 124-million-parameter GPT-2 models fit inside a 2.8-trillion-parameter
    KimiK3" is one clean sentence that carries both figures as adjectives and never has to repeat the
    number. Mine needs three sentences and says 22,580 twice. The audit is right, and I could not beat
    it without copying it.

    2. *Sentence economy.* Almost every shipped sentence is short and does one thing. Mine has two 45-word
    sentences (the interference paragraph and the AttnRes residual sentence) that a line editor will flag.

    3. *Room.* At 844 words it explains the MoE (898 experts, two shared, latent space) and gated MLA,
    which I cut. A reader finishes the shipped piece knowing more about KimiK3''s feed-forward path.


    **Where this draft is better, and it is not close.**


    1. *Voice.* The shipped piece contains zero instances of I, me, my, we, or our. The source is a first-person
    worklog by someone who says a paper''s framing threw him off and that one section cost him seven hours.
    None of that survives; every sentence in the shipped piece could have been written by anyone about
    anything. That is a direct failure of the prompt''s voice rule and of `docs/WRITING_RULES.md` ("Every
    piece carries the voice of whoever is credited on it"), and it is why the piece reads so smooth: the
    awkward, human parts are gone, which the prompt names as the definition of a failed synthesis.

    2. *Added framing.* The shipped piece asserts at least five things the author never says: the roadmap
    sentence "This progression follows the pressure created by sequence length, memory bandwidth, recurrent
    state, selective retrieval, and sparse capacity"; "This is more than an optimization"; "The important
    shift is division of labor"; "It is a hybrid architecture rather than a declaration that one mechanism
    replaces every other one"; and the closing "the more interesting story is how its components divide
    the work that one uniform transformer block once tried to do alone". Division of labor is the shipped
    piece''s own thesis, not the author''s.

    3. *The author''s conclusion is missing.* The source ends on a general claim: a fixed-capacity associative
    memory needs an eviction policy, learned selection is necessary, attention is the most effective selective-read
    mechanism. The shipped version replaces it with the division-of-labor thesis. Under the cut order,
    the author''s conclusions go last and almost never; here they went first.

    4. *Hedges stripped.* Gone: "up to 6x higher decode throughput", "under controlled comparisons", "the
    practical accuracy loss depends on the architecture and workload", "roughly 2%", "at first glance
    the changes appear modest". The entire Kimi Linear claim, that it outperformed full attention, is
    absent; the shipped Kimi Linear section describes the architecture and never states its result. And
    C=1/C=N, which the source gives as exact identities ("recovers", "gives"), are softened to "resembles"
    and "approaches".

    5. *One fidelity inversion.* The shipped line "Full softmax attention also compares every query with
    every key, so long contexts remain expensive even when generation is cached" reinstates roughly the
    per-step cost framing that the author explicitly corrects and calls not true. The correction is absent
    and the corrected claim is present.

    6. *Banned tics.* Three antithesis constructions ("The progression from GPT-2 to KimiK3 is not a straight
    replacement of attention", "It does not make the recurrence free", "rather than a declaration that..."),
    plus "## What changed", which the audit called an earned recap and which rule 2 calls a closing that
    restates what the reader just read. It is one clause per preceding section.


    **Verdict.** As an explainer written by the magazine, the shipped version is the better-made object,
    and its opener is better than mine. As a faithful synthesis, which is what the label promises and
    what a fact-checker will grade, it is not close: the shipped piece drops the author, his conclusion,
    and his hedges, and substitutes a thesis he did not offer. I would ship mine and steal nothing from
    the shipped version except the lesson that its opener carries two figures in one sentence and mine
    does not.


