  notes: "## Read this first\n\nThree things will bite the next reviser, and none of them is visible from\
    \ the findings.\n\n1. **This publication cannot render footnotes.** `src/magazine/publication_document.py`\
    \ builds its parser as `MarkdownIt(\"commonmark\")` with no plugins, so `[^1]` markers print as literal\
    \ text and the definitions come out as paragraphs beginning `[^1]:`. A round was spent discovering\
    \ this; the markers are now refused by a deterministic gate and Huntley's `[n]` annotations are resolved\
    \ inline for good. **Do not reintroduce footnote syntax in any form.** The only devices available\
    \ are parentheses, a run-in after a colon, or a paragraph of their own, which is what the manuscript\
    \ uses.\n2. **The one remaining editor's note is the only place in the piece that describes the piece.**\
    \ Any change to how the `[n]` annotations are handled has to change that note in the same edit. A\
    \ previous round left the note describing apparatus that had already been removed, and that was a\
    \ major finding.\n3. **The fact-checker's evidence base is the three `extracted.md` files and nothing\
    \ else.** Everything true that lives in `record.yaml` is, for this contract, unverifiable. See \"\
    The date and the order\" below before you write a word about when or in what sequence these posts\
    \ appeared.\n\n## What round 3 changed\n\nSix findings. The whole delta is one note rewritten and\
    \ one note deleted. **Not one character of Huntley's text changed**, and not one heading changed:\
    \ the three headings cleared findings 4 and 5 last round and were untouched this round. Editor-authored\
    \ text is now 37 words in one note, label included, plus 17 words of headings.\n\n### Findings 1 and\
    \ 2, the date and the posting order (blocking, major)\n\nBoth clauses are gone. The note now reads:\n\
    \n> **Editor's note.** Three separate posts by Huntley, printed here as one piece. The numbered side-notes\
    \ he hung on his own sentences are folded into them, except the longest, which is set as a paragraph\
    \ of its own.\n\nEvery clause is checkable against something a judge holds: three pinned sources,\
    \ three posts; \"printed here as one piece\" is self-evident on the page; the disposition of the annotations\
    \ is checkable against the manuscript itself.\n\n**The date and the order.** They are not wrong, they\
    \ are out of contract. `library/sources/<id>/record.yaml` carries `publication_date: 2026-07-29` for\
    \ all three, and the X status ids (2082525589416923314, 2082526705160478906, 2082576563439312982)\
    \ are monotonic in time, so the print order is the posting order and the same 1-2-3 as `source_ids`\
    \ in `edition.yaml`. My predecessor established this properly and printed the date because \"the date\
    \ is a field a checker can read\". **That reasoning is the defect.** The checker cannot read it: the\
    \ pinned evidence for a `faithful_edit` fact-check is `extracted.md`, and the three captures contain\
    \ no timestamp, no month and no year. A researched claim the evidence base cannot reach is indistinguishable,\
    \ to the judge and therefore to the reader, from an invented one.\n\nSo: **do not put the date or\
    \ the posting order back into the note, however well you have sourced it.** If a future round wants\
    \ them printed, the fix is upstream — pin `record.yaml` into the evidence sent to the fact-checker,\
    \ or quote the date from a source that carries it — not a better-worded note. The information is preserved\
    \ here, in scratch, precisely so nobody has to rediscover it and nobody is tempted to print it.\n\n\
    The prompt's hard rule \"keep each post's text intact and in a declared order\" is still honoured:\
    \ the declaration is the `source_ids` list in the frontmatter, which is in print order and is machine-checkable.\
    \ The note no longer claims that order is chronological, because the note cannot.\n\n### Finding 3,\
    \ the bridge that reached a conclusion the source never draws (major)\n\nDeleted, not rewritten. The\
    \ note said \"The third post takes that systems-engineering claim to one system: the service bus.\"\
    \ The service-bus capture never mentions systems engineering, factories, or the post before it; the\
    \ connection is the magazine's. It also smuggled the ordering claim back in through \"The third\"\
    .\n\n**There is no rewrite of this note that survives.** Anything that links post 3 to post 2 asserts\
    \ a link the third capture does not make; anything that says \"third\" re-asserts the order. A hedge\
    \ (\"appears to take\", \"reads as\") is the editor speculating inside a labeled note that the reader\
    \ takes as established, which is the same defect wearing a coat. The two posts sit next to each other\
    \ and adjacency is allowed to suggest what the magazine may not assert. Post 2 has a heading and no\
    \ note in front of it for the same reason, and post 3 now matches it.\n\n### Finding 4, the two ordinal\
    \ series (major)\n\nCleared by the same deletion. The line editor's diagnosis was exact: \"as it seems\
    \ the first hot take landed\" is Huntley's own repair of the old dangling ordinal — the lede is plainly\
    \ a hot take, so the reader maps \"the first hot take\" onto \"they are selling bullshit\" and carries\
    \ on — and what broke it was the new note teaching the reader to count *posts* three lines above he\
    \ asks them to count *hot takes*. Removing the note removes the second series. **That clause of Huntley's\
    \ is load-bearing; it is also his, so it was never at risk from an editor, but note here that it is\
    \ doing the work an editor must not do again.**\n\nI declined the suggested line (\"In his third post\
    \ of the day, and his second hot take, ...\"). It reconciles the two counts, but it reinstates the\
    \ ordinal, the day, and the post-to-post link — three cleared findings to clear one.\n\nThe surviving\
    \ note says \"Three separate posts\" (a cardinal, in the first thing the reader meets) and never counts\
    \ them off. The line editor's finding pinned the orphan on the new note, not on this one, which sits\
    \ two pages earlier and was in the failing draft unchanged.\n\n### Finding 5, the invisible seam (minor)\n\
    \n\"which stands as that post's closing paragraph\" is gone. The manuscript marks no boundary between\
    \ post 1 and post 2, so the reader could not find the paragraph the note pointed at. It now says \"\
    which is set as a paragraph of its own\", which describes something the reader can see on the page\
    \ without knowing where any post ends.\n\nI also widened \"he hung on the first post\" to \"he hung\
    \ on his own sentences\". The old wording was inaccurate: post 3 carries a `[1]` annotation (\"lots\
    \ of bad memories here...\") that is folded the same way, which the round 2 fact-checker noticed in\
    \ passing without filing it. Full disposition of all four, for verification:\n\n| source marker |\
    \ sits at | disposition |\n|---|---|---|\n| post 1 `[1]` \"almost lights out.\" | \"software factories\"\
    \ | parenthetical at the marker; trailing full stop dropped |\n| post 1 `[2]` the stack list | \"\
    non-agent topics\" | run-in after a colon replacing the full stop |\n| post 1 `[3]` the homelab exhortation\
    \ | \"innovators\" | own paragraph, last in the section (the longest, 60 words) |\n| post 3 `[1]`\
    \ \"lots of bad memories here...\" | \"wcf\" | parenthetical at the marker |\n\n`[3]` is the one that\
    \ did not go to its marker: 60 words of second-person career advice cannot sit as a parenthetical\
    \ inside \"the innovators are toying around\". It is also physically last in the capture, so leaving\
    \ it last is the least movement available.\n\n### Finding 6, \"service bus\" unglossed (minor, deliberately\
    \ not cleared)\n\n**Declined, and this is the call most likely to be reversed by someone who has not\
    \ read the precedent.** The suggested gloss is \"the layer that routes work between services and is\
    \ supposed to behave the same way every time\". Nothing in the three captures says a service bus routes\
    \ work between services. The captures say service busses are \"a solved problem\" with \"deep prior\
    \ art\", name four implementations, and say don't make one non-deterministic. A gloss is a claim,\
    \ and an editor-supplied definition inside a labeled note is exactly the shape of defect this piece\
    \ was penalised for one round ago: **the n8n gloss (\"the visual workflow-automation tool\") was struck\
    \ as an invented claim by this same evidence judge, for this same reason, in the round before last.**\
    \ Trading a minor jargon finding for a repeat of a cleared evidence finding is a bad trade, and the\
    \ note that would have carried the gloss is the note findings 3 and 4 required me to delete.\n\nThe\
    \ route to a glossed service bus is a fourth source that defines one, not an editor who knows what\
    \ it is. Same standing answer as n8n: an unglossed proper noun costs the reader a moment; an invented\
    \ descriptor costs the magazine its label.\n\n### Finding 8 from round 2, the collapsing conditional\
    \ (still not cleared, on purpose)\n\nLeft exactly as Huntley wrote it, including the full stop that\
    \ severs \"they are selling bullshit\" from its protasis. Restating the warning because it is the\
    \ most likely thing to get \"fixed\" by accident: **changing that full stop to a comma would repair\
    \ the grammar and would also be the single most defensible-looking rewrite in the piece, which is\
    \ what makes it dangerous.** It is not an extraction error; the capture is a verbatim DOM export and\
    \ his posts read this way. Do not fix it without asking him; if house style ever forces it, the change\
    \ is one character and it must be disclosed.\n\n## The delta against the captures\n\nUnchanged from\
    \ last round, because no author text was touched. Every word of all three posts is on the page, in\
    \ source order, with no transitions written in his voice. The entire difference between the manuscript's\
    \ author text and the captures is punctuation at the two annotations set as parentheses and the one\
    \ set as a run-in:\n\n- opening parenthesis before \"almost\", and the full stop after \"lights out\"\
    \ dropped (a parenthetical inside a sentence cannot carry one);\n- full stop after \"non-agent topics\"\
    \ became a colon, so the stack list runs in;\n- opening parenthesis before \"lots\", and the full\
    \ stop after \"generally on point\" dropped, same reason as the first.\n\nThe check that proves it:\
    \ diff the manuscript's author text against the three `extracted.md` files as whitespace-token multisets\
    \ with the `[n]` markers and the frontmatter removed. **363 tokens each side**, and the only tokens\
    \ that differ are `(almost` / `almost`, `out)` / `out.`, `topics:` / `topics.`, `(lots` / `lots`,\
    \ `point)` / `point.` Rerun it after any edit to the author text; it is ten lines of Python and it\
    \ is the only cheap proof this mode is still being honoured.\n\nKept deliberately:\n\n- **Lowercase\
    \ throughout the author's text.** All three posts are all-lowercase. The heading and the note are\
    \ sentence case, which makes editorial apparatus separable from author text at a glance.\n- **`@dotnet`\
    \ and `@temporalio` as handles.** A line editor once called them platform residue and they are, but\
    \ they are how he names .NET and Temporal. Swapping them changes his wording and should be logged\
    \ as a wording change if house style demands it.\n- **Verbatim:** \"they are selling bullshit\", \"\
    the spooky land of enterprise\", \"ugh. blog post time.\", \"the entire damn stack\", \"rn\", \"ie.\"\
    , \"wanna\", \"<10\", \"who's-who\", the \"!\" in \"(ie. they are likely startups created in last\
    \ six months!)\", \"not great tech impl\", and the spaced slash in \"theory / education\".\n- **Curly\
    \ apostrophes (U+2019)** exactly as in the extractions, so a word-for-word diff stays clean.\n- **No\
    \ chrome to remove.** All three extractions are clean DOM transcriptions.\n- **No U+2014 anywhere**\
    \ (banned tic 7), no antithesis close, no summarising final paragraph, no narrator scaffolding in\
    \ the note.\n\nWhy the editor's word count is the point of this piece's whole history: the shipped\
    \ edition-004 version was a paraphrase wearing the `FAITHFUL EDIT` label, and its most-praised line,\
    \ \"WCF gives me bad memories,\" was written by an editor in Huntley's person; the source says \"\
    lots of bad memories here\" inside an annotation. It passed review because it sounded like him. **If\
    \ a later reviser finds a fluent connective sentence in Huntley's voice anywhere in this piece, someone\
    \ put it there and it is not his.**\n\n## Length and fit\n\nManuscript body is 417 words: 363 of Huntley,\
    \ 37 words of editor's note, 17 words of headings. The opener paragraph measures **7 of 7 typeset\
    \ lines, 479 characters** — it fits, with no slack:\n\n    printf '%s' \"<paragraph>\" | \\\n    \
    \  uv run --locked mag fit rerun-004-the-systems-around-the-model --opener factory-systems-problem\n\
    \nIt is post 1's first three sentences, breaking at the full stop after \"they are selling bullshit.\"\
    \ **It is at the ceiling, so if anything upstream changes the title, the byline or the credit block,\
    \ remeasure before assuming it still passes**; the only legal shortening is to break the opener one\
    \ sentence earlier, at \"practices and pieces.\", which splits a paragraph of his.\n\n`faithful_edit`\
    \ cannot fill a 7-page slot from 363 words of source, and the brief's page budget is not an instruction\
    \ to write more. The routes are (1) capture more Huntley on this subject — in particular the blog\
    \ post promised by \"ugh. blog post time.\" and whatever the first hot take turns out to be — then\
    \ run `faithful_synthesis`; (2) an `original_editorial` that quotes these three and does the developing\
    \ in the magazine's voice; or (3) ship at ~417 words and give the pages to something else. Recommendation\
    \ is (1) if capture is possible, (3) if not. Never padding.\n\nRoute (1) is also the only real fix\
    \ for the silences this round enforced. The three canonical URLs are near-consecutive status ids on\
    \ one account on one afternoon: anything on `x.com/GeoffreyHuntley` between 2082525589416923314 and\
    \ 2082576563439312982 is a candidate for the first hot take, and anything after 2082576563439312982\
    \ is a candidate for the promised blog post.\n\n## Prompt and docs gaps worth fixing upstream\n\n\
    1. **The evidence base for a `faithful_edit` fact-check should include `record.yaml`, or the prompt\
    \ should tell the writer it does not.** Two rounds have now been spent on a writer correctly researching\
    \ publication metadata and then printing something the judge structurally cannot verify. That is the\
    \ single highest-value fix on this list.\n2. `faithful-edit.md` says both \"never reorder the argument\"\
    \ and \"keep each post's text intact and in a declared order\". Across posts these pull opposite ways.\
    \ It should say: within-post order is frozen; across-post order is publication order when it is recoverable\
    \ *and verifiable*, and otherwise the editor's, declared in the frontmatter rather than asserted to\
    \ the reader.\n3. The prompt has a page ceiling and no floor. Add: if the combined captures cannot\
    \ fill the assigned budget, the piece is under-sourced, and the remedy is more sources or a different\
    \ mode, never padding.\n4. `docs/DESIGN_SYSTEM.md` should state outright that the opener paragraph\
    \ has no word window. A plausible-sounding 40-60 word rule was invented in an earlier round and moved\
    \ the whole article into the wrong order before anyone checked it.\n5. `docs/DESIGN_SYSTEM.md` should\
    \ also record that the renderer's markdown is `MarkdownIt(\"commonmark\")`, so footnotes, strikethrough\
    \ and tables are unavailable to every article.\n6. Nothing in the prompts tells a writer that an editor's\
    \ note describing the manuscript's apparatus has to be revalidated whenever the apparatus changes,\
    \ and nothing tells a writer that a gloss is a claim. Both produced findings in this piece's history;\
    \ both are one line each in the working-notes section."
