  notes: '## Read this first


    Two things in this piece will bite the next reviser, and both are invisible from the findings:


    1. **This publication cannot render footnotes.** `src/magazine/publication_document.py` builds its
    parser as `MarkdownIt("commonmark")` with no plugins, so `[^1]` markers print as literal text and
    the definitions come out as paragraphs beginning `[^1]:`. A round has already been spent discovering
    this, the markers are now refused by a deterministic gate, and Huntley''s `[n]` annotations are resolved
    inline for good. **Do not reintroduce footnote syntax in any form.** If a later round wants the annotations
    visibly separated from his sentences again, the only available devices are parentheses, a run-in after
    a colon, or a paragraph of their own, which is exactly what is in the manuscript above.

    2. **The last round''s first editor''s note described apparatus that no longer existed.** It told
    the reader the side-notes were "set at the words they mark", which was true of the draft written *before*
    the footnotes were resolved inline, and nobody updated the note when the thing it described was removed.
    That is finding 3, and it is the cheapest kind of defect to reintroduce: the note is the only place
    in the piece that describes the piece, so **any change to how the `[n]` annotations are handled has
    to change that note in the same edit.**


    ## What round 3 changed


    Six findings, five of them on editor-authored text and one (finding 8) explicitly left alone. Huntley''s
    prose was clean and stays untouched. The whole delta this round is two notes, three headings, and
    where the first note sits.


    ### Finding 1, the invented antecedent (major)


    Deleted, not rewritten. The old note said the "second" in "second hot take" counts from an earlier
    post the captures do not identify. Nothing in the three captures identifies the first hot take, so
    that sentence turned silence into a positive claim about the world, and it pointed the reader away
    from two same-day posts by the same author printed on the page above it.


    The tempting repair is to name post 2 as the first hot take. **Do not.** It is plausible (the status
    ids put post 1 at 17:56 and post 2 at 18:00 UTC, post 3 at 21:18, so both precede it) but it is not
    established, and swapping an unprovable negative for an unprovable positive is the same defect with
    the sign flipped. Nor is a hedge the answer: "possibly one of the posts above" is still the editor
    speculating in a labeled note the reader will read as established.


    So the piece now says only what is established, and it says it once, in the first note: three posts,
    one day, printed in the order he posted them. A reader who meets "second hot take" two pages later
    has the two predecessors in hand and can draw their own line. **The referent is not orphaned; it is
    unasserted.** If a later reviser is told it reads as an orphan, the fix is more capture, not more
    note.


    **Where the order comes from, since a fact-checker reading only `extracted.md` will not find it.**
    It is in `library/sources/<id>/record.yaml`, fields `publication_date` and `canonical_url`:


    | post | `publication_date` | status id |

    |---|---|---|

    | software-factories-are-super-real-but-the-factor-ab8ad3ab | 2026-07-29 | 2082525589416923314 |

    | factories-are-not-a-token-or-llm-problem-ba5fabbf | 2026-07-29 | 2082526705160478906 |

    | do-not-make-the-service-bus-non-deterministic-3a92442c | 2026-07-29 | 2082576563439312982 |


    X status ids are monotonic in time, so the ids alone fix the order, and it is the same 1-2-3 as the
    `source_ids` list in `edition.yaml`. Decoded as snowflakes (`(id >> 22) + 1288834974657` ms) they
    give the clock times quoted above. **The date is printed in the note; the clock times are not**, because
    the date is a field a checker can read and the times are a derivation a checker would have to trust.


    ### Finding 2, the n8n gloss (minor)


    "the visual workflow-automation tool" is gone. No capture says what n8n is; the third post names it
    once and sets it against service busses, and that is all the pinned material supports. A previous
    round added the gloss to clear an older finding that n8n went unexplained, which is how an unsourced
    descriptor ends up inside a labeled editor addition where a reader takes it as established.


    Both of those findings cannot be satisfied at once from these three captures, and evidence beats comfort:
    **an unglossed proper noun costs the reader a moment, an invented descriptor costs the magazine its
    label.** If someone wants n8n explained, the route is a fourth source that explains it, not an editor
    who knows what it is.


    ### Finding 3, the side-notes that were not there (major)


    The note now describes what the manuscript actually does: the annotations are folded into the sentences
    they mark, except the longest, which stands as post 1''s closing paragraph. Verify against the manuscript,
    all four:


    | source marker | sits at | disposition in the manuscript |

    |---|---|---|

    | post 1 `[1]` "almost lights out." | "software factories", first two words | parenthetical at the
    marker; trailing full stop dropped |

    | post 1 `[2]` the stack list | "non-agent topics" | run-in after a colon replacing the full stop
    |

    | post 1 `[3]` the homelab exhortation | "innovators" | own paragraph, last in the section |

    | post 3 `[1]` "lots of bad memories here..." | "wcf" | parenthetical at the marker |


    I declined the reviewer''s suggested line ("The numbered side-notes he hung on the first are dropped,
    except the longest"). Nothing was dropped; every word of all four annotations is on the page. Telling
    a reader they were dropped would be a second false statement about the apparatus, cleared finding
    and all. "Folded into the sentences they mark" is accurate for three of the four and for the exception
    the note names its exception.


    `[3]` is the one that did not go to its marker. It is 60 words of second-person career advice and
    cannot sit as a parenthetical inside "the innovators are toying around". It is also physically last
    in the capture, so leaving it last is the least movement available.


    ### Findings 4 and 5, headings that repeat the line beneath them (major, both)


    All three headings are new. The rule I applied: **a heading here may not reuse a phrase from the sentence
    under it, and may not reuse the post''s closing line at all.** The old scheme broke both, and the
    second break was the worse one, because the piece''s last sentence had already been read as a heading
    four paragraphs earlier.


    | section | heading | what is directly beneath | overlap |

    |---|---|---|---|

    | post 1, continued | The stack under the factory | "it isn’t cracked but it’s a puzzle that’s being
    solved daily." | none |

    | post 2 | Where the problem lives | "i must stress that factories is not a token or llm problem."
    | none |

    | post 3 | Steal from what already works | "second hot take, as it seems the first hot take landed."
    | none |


    I declined both suggested headings. "A systems and culture problem" for post 2 is the post''s own
    second sentence ("it’s a systems engineering and corporate culture problem") moved up two lines, which
    is finding 5 again one sentence later. "Steal from the service buses that already work" for post 3
    is good, but "service bus" is the subject of the closing sentence and of the paragraph beneath, so
    I kept the verb he uses ("if you wanna steal ideas") and dropped the noun.


    "The stack under the factory" is the one to argue with if anyone wants to. It is the most interpretive
    of the three: he never says the non-agent topics sit *under* the factory, though he does say building
    the factory entails solving them. It survived because every less interpretive candidate reused a word
    from the section ("practices and pieces", "abstractions", "best practices", "non-agent", "homelab",
    "the entire damn stack"), and reusing one is the defect this round is clearing.


    ### Finding 6, the bridge that did not parse (major)


    The old note put a colon after "one system" and then listed two things. It also explained "second
    hot take" before the reader had met it, and carried the invented antecedent from finding 1. It is
    now one sentence, one thing after the colon, no forward reference: "The third post takes that systems-engineering
    claim to one system: the service bus."


    **The consistent scheme the finding asked for**, and the thing to preserve if these notes ever grow:
    an editor''s note sits immediately before the heading of the section it introduces, never after it,
    and it is about provenance or structure only. Note 1 introduces the set (three posts, one day, an
    order, what happened to the annotations). Note 2 introduces the change of altitude from the general
    claim to one system. A section that needs no bridge gets no note, which is why post 2 has a heading
    and no note in front of it.


    That also relocates note 1. It used to sit after post 1''s three paragraphs, so it explained a structure
    the reader had already half-read (finding 7). It now sits directly under the opener paragraph, which
    is the first thing on the page after the illustrated opener, so the apparatus is explained before
    it is used.


    ### Finding 7, the unheaded first post (minor)


    Post 1 now carries a heading like the other two. It cannot go first, because the mode requires the
    body to open on a paragraph so the illustrated opener can set it, so the heading sits after the opener
    paragraph and the note, and covers the remainder of post 1. The reader''s sequence is now: cold open
    in his voice, one note that explains the apparatus, then three headed sections.


    ### Finding 8, the collapsing conditional (minor, deliberately not cleared)


    Left exactly as Huntley wrote it, including the full stop that severs "they are selling bullshit"
    from its protasis. The finding itself declines to propose wording and says it is worth a query to
    him rather than a silent repair. Restating my predecessor''s warning because it is the most likely
    thing to get "fixed" by accident: **changing that full stop to a comma would repair the grammar and
    would also be the single most defensible-looking rewrite in the piece, which is what makes it dangerous.**
    It is not an extraction error; the capture is a verbatim DOM export and his posts read this way. Do
    not fix it in a later pass without asking him. If house style ever forces it, the change is one character
    and it must be disclosed.


    ## The delta against the captures


    Every word of all three posts is on the page, in source order, with no transitions written in his
    voice. The entire difference between the manuscript''s author text and the captures is punctuation
    at the two annotations set as parentheses and the one set as a run-in:


    - opening parenthesis before "almost", and the full stop after "lights out" dropped (a parenthetical
    inside a sentence cannot carry one);

    - full stop after "non-agent topics" became a colon, so the stack list runs in;

    - opening parenthesis before "lots", and the full stop after "generally on point" dropped, same reason
    as the first.


    I diffed the manuscript''s author text against the three `extracted.md` files as whitespace-token
    multisets with the `[n]` markers and the record frontmatter removed: **363 tokens each side**, and
    the only tokens that differ are `(almost` / `almost`, `out)` / `out.`, `topics:` / `topics.`, `(lots`
    / `lots`, `point)` / `point.` Rerun that diff after any edit to the author text; it takes ten lines
    of Python and it is the only cheap proof this mode is still being honoured.


    Editor-authored text is 57 words in two labeled notes plus 17 words of headings, and none of it is
    about factories, service buses, or what Huntley thinks. **That count is the point of this piece''s
    whole history.** The shipped edition-004 version was a paraphrase wearing the `FAITHFUL EDIT` label,
    and its most-praised line, "WCF gives me bad memories," was written by an editor in Huntley''s person;
    the source says "lots of bad memories here" inside an annotation. It passed review because it sounded
    like him. If a later reviser finds a fluent connective sentence in Huntley''s voice anywhere in this
    piece, someone put it there and it is not his.


    Kept deliberately:


    - **Lowercase throughout the author''s text.** All three posts are all-lowercase. Headings and notes
    are sentence case, which makes editorial apparatus separable from author text at a glance.

    - **`@dotnet` and `@temporalio` as handles.** A line editor once called them platform residue and
    they are, but they are how he names .NET and Temporal. Swapping them changes his wording, and if house
    style demands the swap it should be logged as a wording change.

    - **Verbatim:** "they are selling bullshit", "the spooky land of enterprise", "ugh. blog post time.",
    "the entire damn stack", "rn", "ie.", "wanna", "<10", "who’s-who", the "!" in "(ie. they are likely
    startups created in last six months!)", "not great tech impl", and the spaced slash in "theory / education".

    - **Curly apostrophes (U+2019)** exactly as in the extractions, so a word-for-word diff stays clean.

    - **No chrome to remove.** All three extractions are clean DOM transcriptions: no nav, no subscribe
    prompts, no social furniture.

    - **No U+2014 anywhere** (banned tic 7), no antithesis close, no summarising final paragraph, and
    no narrator scaffolding in either note; both notes take the post as their subject, not the author
    as a narrator.


    ## Length, and the standing recommendation


    Manuscript body is 437 words: 363 of Huntley across three posts, 57 words of editor''s notes, and
    17 words of headings. The opener paragraph is 479 characters against a 553-character budget, and it
    is post 1''s first three sentences, breaking at the full stop after "they are selling bullshit." That
    is the ceiling this mode has for these captures, and the brief''s 7-page budget is far above it.


    `faithful_edit` cannot fill a 7-page slot from 363 words of source. The routes are (1) capture more
    Huntley on this subject, in particular the blog post promised by "ugh. blog post time." and whatever
    the first hot take turns out to be, then run `faithful_synthesis`; (2) an `original_editorial` that
    quotes these three and does the developing in the magazine''s voice; or (3) ship at ~440 words and
    give the pages to something else. Recommendation is (1) if capture is possible, (3) if not. Never
    padding.


    Route (1) also happens to be the only real fix for finding 1. The three canonical URLs are near-consecutive
    status ids on one account on one afternoon: anything on `x.com/GeoffreyHuntley` between 2082525589416923314
    and 2082576563439312982 is a candidate for the first hot take, and anything after 2082576563439312982
    is a candidate for the promised blog post. If a capture lands, the first editor''s note can name the
    antecedent and the note stops being an exercise in saying less.


    ## Prompt and docs gaps worth fixing upstream


    1. `faithful-edit.md` says both "never reorder the argument" and "keep each post''s text intact and
    in a declared order." Across posts these pull opposite ways. It should say: within-post order is frozen;
    across-post order is publication order when it is recoverable, and only the editor''s choice when
    it is not.

    2. The prompt should say where publication order lives: `library/sources/<id>/record.yaml`, fields
    `publication_date` and `canonical_url`. A writer working only from `extracted.md` will keep concluding
    the dates do not exist.

    3. The prompt has a page ceiling and no floor. Add: if the combined captures cannot fill the assigned
    budget, the piece is under-sourced, and the remedy is more sources or a different mode, never padding.

    4. `docs/DESIGN_SYSTEM.md` should state outright that the opener paragraph has no word window. A plausible-sounding
    40-60 word rule was invented in an earlier round and moved the whole article into the wrong order
    before anyone checked it. There is no floor and no ceiling; what the doc actually says is "Empty paper
    below a short intro is intentional."

    5. `docs/DESIGN_SYSTEM.md` should also record that the renderer''s markdown is `MarkdownIt("commonmark")`,
    so footnotes, strikethrough and tables are unavailable to every article. Right now the only way to
    find out is to ship broken markup, and this piece nearly did.

    6. Nothing in the prompts tells a writer that an editor''s note describing the manuscript''s apparatus
    has to be revalidated whenever the apparatus changes. That is what produced finding 3, and it is a
    one-line addition to the working-notes section: if you change how source annotations are handled,
    reread every note that mentions them.'
