  notes: "## What changed, in one line\n\nThe predecessor's reading order was wrong and the two editor's\
    \ notes were built\non top of the wrongness. The order is recoverable from the repo, it is 1-2-3,\n\
    and once it is 1-2-3 most of the apparatus stops being needed.\n\n## The order: it is in `library/sources/`,\
    \ and the last draft asserted it was not\n\nMy predecessor's note said \"The captures carry no dates,\
    \ so the order they were\nwritten in cannot be recovered here.\" That is false and it is checkable\
    \ in two\nplaces per source. Read `library/sources/<id>/record.yaml`:\n\n| post | `publication_date`\
    \ | `canonical_url` status id |\n|---|---|---|\n| software-factories-are-super-real-but-the-factor-ab8ad3ab\
    \ | 2026-07-29 | 2082525589416923314 |\n| factories-are-not-a-token-or-llm-problem-ba5fabbf | 2026-07-29\
    \ | 2082526705160478906 |\n| do-not-make-the-service-bus-non-deterministic-3a92442c | 2026-07-29 |\
    \ 2082576563439312982 |\n\nX status ids are monotonic in time, so the ids alone fix the order. Decoded\
    \ as\nsnowflakes (`(id >> 22) + 1288834974657` ms) they also give the clock: 17:56:06,\n18:00:32 and\
    \ 21:18:39 UTC on 29 July 2026. Software-factories first, the\ntoken/llm post four minutes later,\
    \ the service-bus post three hours and twenty\nminutes after that.\n\nSo the true order is exactly\
    \ the placeholder's `source_ids` order, 1-2-3. The\nlast draft ran 2-1-3. I did not \"declare a reading\
    \ order,\" I printed the real\none and said so. The note now claims a date and an order, both sourced\
    \ from\n`record.yaml`, and claims nothing about what cannot be known.\n\n**A fact-checker reading\
    \ only the three `extracted.md` files will not find the\ndate.** It is in `record.yaml`, not the extraction.\
    \ That is deliberate and it is\nwhere to look.\n\nThree things fell out of restoring the real order,\
    \ all of them free:\n\n1. **The opener QR now matches the opener paragraph.** `DESIGN_SYSTEM.md`:\
    \ \"The\n   QR resolves to the canonical URL of the article's first source.\" First source\n   is\
    \ post 1, and post 1 is now the paragraph printed above it. The predecessor\n   flagged this mismatch\
    \ and could not fix it without breaking their order.\n2. **Finding 5 (the piece opens on \"ugh. blog\
