  notes: "## The headline finding: the mode does not fit the assignment\n\nThe three extractions contain\
    \ about 340 words of author text in total (roughly\n190 + 45 + 105). `faithful_edit` forbids paraphrase,\
    \ forbids invented\ntransitions, and says \"write as little new prose as possible.\" So the ceiling\n\
    for this piece in this mode is about 340 words of Huntley plus a labeled note\nor two. The brief's\
    \ ~1,100-word budget cannot be reached without writing 750\nwords that no source supports. I did not\
    \ write them. The manuscript is ~460\nwords.\n\nThis is the honest answer to the \"three into one\"\
    \ problem: **the shipped 305\nwords was not thin because the editor was lazy. It was thin because\
    \ the mode\ncaps it there.** The previous version's real defects were structural (five\nheadings over\
    \ 340 words, an orphan referent, a two-sentence section, a\nconclusion promised by a heading and then\
    \ dropped), and those are fixable\ninside the mode. Length is not.\n\nIf the edition needs a developed\
    \ 1,100-word article on this subject, the\noptions are:\n\n1. `faithful_synthesis` or `selected_extracts`\
    \ with more Huntley sources.\n   These three posts are stubs; post 2 literally ends \"blog post time,\"\
    \n   meaning the argument was going to be written somewhere else. Find that blog\n   post and the\
    \ \"first hot take\" post, capture them, and the piece becomes a\n   real feature in a faithful mode.\n\
    2. An `original_editorial` or magazine-voiced piece that uses these three as\n   quoted material and\
    \ does the developing itself. That is the only route to\n   1,100 words that does not require inventing\
    \ Huntley's sentences.\n3. Ship it at ~460 words as a short faithful edit and give the page budget\
    \ to\n   something else.\n\nMy recommendation is (1) if capture is possible, (3) if it is not. Do\
    \ not ask\n`faithful_edit` to fill a page it has no text for.\n\n## Root cause of the shipped version,\
    \ read only after drafting\n\nI opened `editions/004-the-systems-around-the-model/articles/factory-systems-problem.md`\n\
    after the draft above was finished. Every defect in the brief is there, and\nthere is a larger one\
    \ underneath them that the brief does not name: **the\nshipped piece is not a faithful edit at all.\
    \ It is a paraphrase wearing the\n`FAITHFUL EDIT` label.** Almost no sentence survives intact. \"\
    software\nfactories are super real\" became \"Software factories are real\". \"circa <10\npeople in\
    \ the who's-who\" became \"the roughly ten people\". \"sandboxing,\nmonorepo\" became \"sandboxes,\
    \ monorepos\". \"ugh. blog post time.\" is gone\nentirely, and so is the \"(but it is a piece of the\
    \ puzzle)\" qualification.\nTwo handles were turned into invented `x.com` links.\n\nMost tellingly,\
    \ \"WCF gives me bad memories\" is a *manufactured author-voiced\nsentence*. The source says \"lots\
    \ of bad memories here\" inside an annotation.\nThat line was praised as proof the edit kept Huntley's\
    \ voice. Huntley never\nwrote it. An editor wrote it in his person, which is the exact thing the mode\n\
    forbids, and it passed review because it sounded right.\n\nThat reframes the other findings. The dropped\
    \ conclusion under the heading\n\"Keep the service bus deterministic\" was not an oversight: the heading\
    \ also\n*inverts* the author's imperative from \"don't make it non-deterministic\" into\na positive\
    \ instruction, which is a rewrite, and once you are rewriting, the\nsentence the heading was named\
    \ after stops feeling load-bearing. The orphaned\n\"Second hot take.\" survived for the mirror-image\
    \ reason: it was the one place\nthe paraphrase stayed literal.\n\nSo the lesson for the next reviser\
    \ is narrower than \"develop it more.\" It is:\nin this mode, if you find yourself with room to spare,\
    \ the temptation is to\nparaphrase into fluency and add connective sentences in the author's person.\n\
    Both are how this piece failed. The remedy is fewer editor words, not better\nones.\n\n## The three-source\
    \ seam\n\nReading order chosen: post 2 (\"factories are not a token or llm problem\"),\nthen post\
    \ 1 (\"software factories are super real\"), then post 3 (\"do not make\nthe service bus non-deterministic\"\
    ). Frontmatter `source_ids` is left in the\nplaceholder's order and untouched, per the brief.\n\n\
    Why that order, and no author-voiced transitions anywhere:\n\n- Post 2 is 44 words, which is the only\
    \ block in the whole corpus that lands\n  inside the 40-60 word opener window at a real sentence boundary.\
    \ Post 1's\n  sentence boundaries give 28 words or 76 words and nothing between, so post 1\n  cannot\
    \ open the piece without either a mid-sentence break (not allowed) or a\n  failed opener page. This\
    \ constraint, not taste, picked the order.\n- The order also happens to read as thesis then evidence\
    \ then instance: post 2\n  states the claim (systems engineering and corporate culture, not tokens),\n\
    \  post 1 gives the market and the non-agent stack, post 3 is one concrete\n  system the claim applies\
    \ to. Nothing was added to make that happen; the\n  seam is carried entirely by sequence and by two\
    \ labeled notes.\n- Post 2 gets no heading. It is the opener paragraph, so it cannot be a\n  heading,\
    \ and giving a 44-word post its own `##` section is exactly the\n  \"two-sentence section\" defect\
    \ from last time. Two headings total, both of\n  them the author's own words.\n\nRisk this rests on:\
    \ reordering. `faithful-edit.md` says \"never reorder the\nargument\" (within a source, which I did\
    \ not do) and separately says combined\nposts run \"in a declared order,\" which only means anything\
    \ if the editor picks\none. I picked one and declared it in the first editor's note. If a reviewer\n\
    reads the reorder rule as covering across-post order too, the fallback is\norder 1-2-3, and then the\
    \ opener constraint breaks and someone has to choose\nwhich hard rule loses. Flagging it rather than\
    \ hiding it.\n\n## Orphan referents found, and what I did with each\n\n1. **\"second hot take, as\
    \ it seems the first hot take landed\"** (post 3, first\n   sentence). The first hot take is not in\
    \ any of the three extractions. This\n   is the one the last version stranded. I kept Huntley's sentence\
    \ intact and\n   supplied the antecedent with a labeled editor's note placed *before* the\n   sentence,\
    \ so the reader has it before they hit the dangling reference. I\n   did not cut the marker, because\
    \ cutting it would delete the author's words,\n   and I did not guess that post 1 is the first hot\
    \ take, because nothing in\n   the captures says so. It is plausible and unverifiable, so it stays\
    \ out.\n2. **\"ugh. blog post time.\"** (post 2, last sentence). Forward-looking, so not\n   an orphan\
    \ on its own. But putting post 2 first creates the implicature that\n   the two sections that follow\
    \ *are* the promised blog post. My reorder made\n   this problem, so the first editor's note closes\
    \ it: \"The longer post\n   promised above is not one of the three.\"\n3. **\"i must stress that...\"\
    ** (post 2, first words). Soft referent: he is\n   stressing against something said earlier, off-capture.\
    \ It reads as plain\n   emphasis without an antecedent, so I left it alone. Noting it so the next\n\
    \   reviser does not think it was missed.\n4. **The bracketed numerals** `[1] [2] [3]` in post 1 and\
    \ `[1]` in post 3 are\n   not orphans, they are the author's own annotation markers with their text\n\
    \   trailing at the end of each capture. Handled as footnotes, below.\n\n## Footnotes: a real bug\
    \ fixed from the placeholder\n\nThe placeholder at\n`editions/rerun-004-the-systems-around-the-model/articles/factory-systems-problem.md`\n\
    renders post 1's note [1] **twice**: once as body text (\"almost lights\nout.[^1]\" glued to the end\
    \ of the last sentence) and once as the footnote\ndefinition. In the capture, `[1]` is a marker sitting\
    \ immediately before\n\"software factories\" in the very first words, and \"almost lights out.\" is\
    \ its\nnote text. I moved the marker onto `software factories[^1]` and left the text\nonly in the\
    \ definition. Same for `innovators[^3]` and `non-agent topics.[^2]`,\nwhose placement the placeholder\
    \ already had right.\n\nNumbering: I kept Huntley's own numbers rather than renumbering to order of\n\
    appearance (which would be 1, 3, 2). Post 3's note is `[1]` in its own\ncapture; it becomes `[^4]`\
    \ here only because footnote labels are\ndocument-scoped and `[^1]` was taken. That renumber is the\
    \ single unavoidable\nchange to a source numeral in the piece.\n\n## Each source's own conclusion,\
    \ confirmed present\n\n- Post 1: \"the best practices right now are to build abstractions/pieces\n\
    \  needed which entails solving non-agent topics.\" Present, closing its\n  section. Its stronger\
    \ exhortation, \"highest roi you can have right now is\n  learning the entire damn stack, automating\
    \ it and showing it at your next\n  interview/doing a recorded talk at a meetup,\" lives in note [3]\
    \ in the\n  capture and therefore lives in footnote [^3] here. It is verbatim and\n  complete, but\
    \ it *is* in a footnote. If a reviewer wants it in the body,\n  that is a defensible promotion, but\
    \ it would be the editor deciding the\n  author's structure. I left it where he put it.\n- Post 2:\
    \ \"it's a systems engineering and corporate culture problem.\" Present,\n  in the opener paragraph,\
    \ along with the qualification \"(but it is a piece of\n  the puzzle)\" which is easy to drop and\
    \ which I kept.\n- Post 3: \"don't make the entire service bus non-deterministic.\" Present, as\n\
    \  the last sentence of the article, matching the heading named after it. This\n  is the exact fact-checker\
    \ finding from last time and it is now the line the\n  piece ends on.\n\nNothing was cut from any\
    \ of the three captures. There was no web chrome to\nremove: all three extractions are clean DOM transcriptions\
    \ of the post text\nwith no nav, no subscribe prompts, no social furniture.\n\n## Voice decisions\n\
    \n- **Lowercase kept throughout the author's text.** All three posts are\n  all-lowercase. Sentence-casing\
    \ them is defensible as \"normalize typography\n  for print,\" but it would smooth the most visible\
    \ feature of the voice across\n  every line, and the placeholder in the repo keeps lowercase too.\
    \ My own\n  headings and notes use sentence case, which has the useful side effect of\n  making editorial\
    \ apparatus visually distinct from author text at a glance.\n  If house style later demands sentence\
    \ case in print, change it in one pass\n  and say so.\n- Kept: \"they are selling bullshit\", \"the\
    \ spooky land of enterprise\", \"ugh.\n  blog post time.\", \"the entire damn stack\", \"rn\", \"\
    ie.\", \"wanna\", \"<10\",\n  \"who's-who\", the `!` in \"(ie. they are likely startups created in\
    \ last six\n  months!)\", and the ungrammatical dangling `if` clause before \"they are\n  selling\
    \ bullshit.\" That last one is a run-on the author left in; it is not\n  an extraction error and I\
    \ did not repair it.\n- Kept `@dotnet` and `@temporalio` as handles. They are the author's chosen\n\
    \  way of naming .NET and Temporal, and turning them into product names would\n  be rewriting. Arguably\
    \ they are \"social furniture\" and a line editor may\n  disagree; if so, `.NET` and `Temporal` are\
    \ the swap, and it changes wording.\n- The only sentences I wrote are the two editor's notes (~75\
    \ words total).\n  Both are labeled in bold. Neither uses a banned tic; I checked them against\n \
    \ `docs/WRITING_RULES.md`, which per the mode governs only these two notes and\n  the two headings,\
    \ never Huntley's lines.\n\n## Layout compliance\n\n- Opening paragraph: 44 words, inside the 40-60\
    \ window. It is post 2 whole, so\n  it cannot drift if someone re-edits around it.\n- First body block\
    \ is a paragraph. No H1. Two `##` headings. No figures\n  anchored, so heading wording was free and\
    \ I used the author's own.\n- Note that the opener QR resolves to the *first* `source_ids` entry,\
    \ which is\n  post 1, while the opener paragraph is post 2. Frontmatter order is frozen by\n  the\
