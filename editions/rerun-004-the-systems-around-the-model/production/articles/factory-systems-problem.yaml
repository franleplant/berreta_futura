    \ blog post. In real order the promise points forward at the moment it\n   is made, and the reader\
    \ needs no help.\n\n### The opener word window does not exist\n\nThe predecessor picked order 2-1-3\
    \ because of a claimed 40-60 word opener\nwindow, which post 2 alone satisfied. I went looking for\
    \ that rule. It is not in\n`docs/DESIGN_SYSTEM.md`, not in `docs/WRITING_RULES.md`, not in\n`docs/EDITORIAL_POLICY.md`,\
    \ and not in the brief. What `DESIGN_SYSTEM.md`\nactually says is \"The opener ends after the introductory\
    \ paragraph; the\nremaining article begins on the next print page. Empty paper below a short intro\n\
    is intentional.\" There is no floor and no ceiling. **The single constraint that\nproduced the wrong\
    \ order was invented.** If a future writer meets that number\nagain, it needs a citation before it\
    \ moves anything.\n\nMy opener is 80 words: post 1's first three sentences, breaking at the full stop\n\
    after \"they are selling bullshit.\"\n\n## The seam (finding 4, major)\n\nTwo moves, and the reorder\
    \ does most of the work.\n\n1. **Post 2 now physically sits in the seam.** Last time, \"solving non-agent\n\
    \   topics\" butted straight into \"second hot take ... n8n was a silly idea\" with\n   nothing between\
    \ them but a note about an absence. Now the token/llm post is\n   between them, and it is the general\
    \ claim that both neighbours are instances\n   of: post 1 is the market and the stack, post 2 is the\
    \ claim, post 3 is the\n   claim on one system. I did not arrange that. It is the order he wrote them\
