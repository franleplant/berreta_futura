  notes: "## What changed, in one line\n\nThe predecessor's reading order was wrong and the two editor's\
    \ notes were built\non top of the wrongness. The order is recoverable from the repo, it is 1-2-3,\n\
    and once it is 1-2-3 most of the apparatus stops being needed.\n\n## The order: it is in `library/sources/`,\
    \ and the last draft asserted it was not\n\nMy predecessor's note said \"The captures carry no dates,\
    \ so the order they were\nwritten in cannot be recovered here.\" That is false and it is checkable\
    \ in two\nplaces per source. Read `library/sources/<id>/record.yaml`:\n\n| post | `publication_date`\
    \ | `canonical_url` status id |\n|---|---|---|\n| software-factories-are-super-real-but-the-factor-ab8ad3ab\
    \ | 2026-07-29 | 2082525589416923314 |\n| factories-are-not-a-token-or-llm-problem-ba5fabbf | 2026-07-29\
    \ | 2082526705160478906 |\n| do-not-make-the-service-bus-non-deterministic-3a92442c | 2026-07-29 |\
    \ 2082576563439312982 |\n\nX status ids are monotonic in time, so the ids alone fix the order. Decoded\
    \ as\nsnowflakes (`(id >> 22) + 1288834974657` ms) they also give the clock: 17:56:06,\n18:00:32 and\
    \ 21:18:39 UTC on 29 July 2026. Software-factories first, the\ntoken/llm post four minutes later,\
    \ the service-bus post three hours and twenty\nminutes after that.\n\nSo the true order is exactly\
    \ the placeholder's `source_ids` order, 1-2-3. The\nlast draft ran 2-1-3. I did not \"declare a reading\
    \ order,\" I printed the real\none and said so. The note now claims a date and an order, both sourced\
    \ from\n`record.yaml`, and claims nothing about what cannot be known.\n\n**A fact-checker reading\
    \ only the three `extracted.md` files will not find the\ndate.** It is in `record.yaml`, not the extraction.\
    \ That is deliberate and it is\nwhere to look.\n\nThree things fell out of restoring the real order,\
    \ all of them free:\n\n1. **The opener QR now matches the opener paragraph.** `DESIGN_SYSTEM.md`:\
    \ \"The\n   QR resolves to the canonical URL of the article's first source.\" First source\n   is\
    \ post 1, and post 1 is now the paragraph printed above it. The predecessor\n   flagged this mismatch\
    \ and could not fix it without breaking their order.\n2. **Finding 5 (the piece opens on \"ugh. blog\
    \ post time.\") is gone by\n   construction**, not by patching. The piece now opens cold on \"software\n\
    \   factories ... are super real but we need to be realistic\" and lands its first\n   page on \"\
    they are selling bullshit.\" \"blog post time\" is now mid-article,\n   where a promise of more writing\
    \ is just a promise of more writing.\n3. **Finding 2 is gone.** The claim \"The longer post promised\
    \ above is not one of\n   the three\" is deleted, not hedged. It was only ever needed because the\
    \ reorder\n   put post 2 first and created the implicature that posts 1 and 3 were the\n   promised\
    \ blog post. In real order the promise points forward at the moment it\n   is made, and the reader\
    \ needs no help.\n\n### The opener word window does not exist\n\nThe predecessor picked order 2-1-3\
    \ because of a claimed 40-60 word opener\nwindow, which post 2 alone satisfied. I went looking for\
    \ that rule. It is not in\n`docs/DESIGN_SYSTEM.md`, not in `docs/WRITING_RULES.md`, not in\n`docs/EDITORIAL_POLICY.md`,\
    \ and not in the brief. What `DESIGN_SYSTEM.md`\nactually says is \"The opener ends after the introductory\
    \ paragraph; the\nremaining article begins on the next print page. Empty paper below a short intro\n\
    is intentional.\" There is no floor and no ceiling. **The single constraint that\nproduced the wrong\
    \ order was invented.** If a future writer meets that number\nagain, it needs a citation before it\
    \ moves anything.\n\nMy opener is 80 words: post 1's first three sentences, breaking at the full stop\n\
    after \"they are selling bullshit.\"\n\n## The seam (finding 4, major)\n\nTwo moves, and the reorder\
    \ does most of the work.\n\n1. **Post 2 now physically sits in the seam.** Last time, \"solving non-agent\n\
    \   topics\" butted straight into \"second hot take ... n8n was a silly idea\" with\n   nothing between\
    \ them but a note about an absence. Now the token/llm post is\n   between them, and it is the general\
    \ claim that both neighbours are instances\n   of: post 1 is the market and the stack, post 2 is the\
    \ claim, post 3 is the\n   claim on one system. I did not arrange that. It is the order he wrote them\
    \ in.\n2. **The note in the seam bridges instead of apologising.** It now names the\n   change of\
    \ altitude (\"that systems-engineering claim worked out on one system\")\n   and points at the antecedent\
    \ inside post 2, which is the sentence immediately\n   above it. It also sits *before* the heading\
    \ rather than after, so it reads as\n   a transition out of one post and into the next, and the reader\
    \ has \"second\n   hot take\" explained before they hit it rather than after.\n\nThe same 34 words\
    \ also clear two other findings, which is why the note earns its\nplace:\n\n- **Finding 7 (n8n unglossed).**\
    \ \"the visual workflow-automation tool n8n\"\n  supplies what the piece never said. It is in an editor's\
    \ note rather than a\n  square-bracket insertion in Huntley's sentence, because the mode says additions\n\
    \  must be \"visibly labeled to the reader as an 'Editor's note'\" and brackets are\n  not that.\n\
    - **Finding 1 (invented negative).** \"Its 'second' counts from an earlier post\n  the captures do\
    \ not identify\" states an absence in the evidence. The old note\n  stated an absence in the world,\
    \ which is the thing the fact-checker caught.\n  Note that with the real order in hand, post 1 (17:56)\
    \ and post 2 (18:00) both\n  precede post 3 (21:18) by hours, so the first hot take *could* be one\
    \ of them.\n  Asserting it is not would now be actively wrong, not merely unsupported. I give\n  the\
    \ reader the date and the order and let them draw their own line.\n\n## Footnotes: the renderer cannot\
    \ render them\n\nThe placeholder and the last draft both used `[^1]`-style markdown footnotes.\n`src/magazine/publication_document.py`\
    \ builds its parser as\n`MarkdownIt(\"commonmark\")` with no plugins. CommonMark has no footnote\n\
    extension, so every one of those markers renders **as literal text**:\n\"software factories[^1] are\
    \ super real\", and the definitions come out as\nparagraphs beginning \"[^1]:\". No other article\
    \ in any edition uses footnote\nsyntax, which is why nobody has hit this. This piece would have shipped\
    \ with\nvisible markup.\n\nSo the apparatus had to go regardless of finding 6. Huntley's bracketed\n\
    numerals are X-style trailing annotations, not footnotes: a `[n]` marker in the\nbody and the note\
    \ text appended after the post. I resolved each marker to its\nown position:\n\n| source | marker\
    \ sits at | disposition |\n|---|---|---|\n| post 1 `[1]` \"almost lights out.\" | \"software factories\"\
    , first two words | parenthetical at the marker; trailing full stop dropped |\n| post 1 `[2]` the\
    \ stack list | \"non-agent topics\" | run-in after a colon replacing the full stop |\n| post 1 `[3]`\
    \ the homelab exhortation | \"innovators\" | own paragraph, last in the section |\n| post 3 `[1]`\
    \ \"lots of bad memories here...\" | \"wcf\" | parenthetical at the marker |\n\nEvery word survives.\
    \ Three punctuation marks changed, and they are the entire\ndelta between the manuscript's author\
    \ text and the captures:\n\n- full stop after \"almost lights out\" dropped (a parenthetical inside\
    \ a sentence\n  cannot carry one);\n- full stop after \"non-agent topics\" became a colon, so the\
    \ stack list runs in;\n- full stop after \"generally on point\" dropped, same reason as the first.\n\
    \nI diffed the manuscript's author text against the three `extracted.md` files as\nword multisets\
    \ with the `[n]` markers removed: 363 tokens each side, and those\nthree tokens are the only ones\
    \ that differ. Nothing else moved.\n\n`[3]` is the one that did not go to its marker. It is 60 words\
    \ of second-person\nadvice and it cannot be a parenthetical inside \"the innovators are toying\naround\"\
    . It is also physically last in the capture, so ending the section on it\nis the *least* movement\
    \ available, and it closes on \"learning the entire damn\nstack, automating it and showing it at your\
    \ next interview/doing a recorded talk\nat a meetup,\" which is a better section close than the abstraction\
    \ sentence was.\nThe editor's note discloses the exception in one clause so a checker diffing\nagainst\
    \ the capture knows it was a decision.\n\n**Finding 6 is cleared as a side effect.** The stack list,\
    \ the only thing in\nsection one a reader can act on, is now in the body sentence it modifies instead\n\
    of at the foot of the page. That was the line editor's advisory and it turned out\nto be forced anyway.\n\
    \n## Findings I did not clear, and why\n\n**Finding 8 (dead_words, the collapsing conditional).**\
    \ Left exactly as Huntley\nwrote it, including the full stop that severs \"they are selling bullshit\"\
    \ from\nits protasis. The finding itself says \"Author's own sentence in a faithful edit,\nso this\
    \ caps at minor and I am not proposing wording ... Worth a query to Huntley\nrather than a silent\
    \ repair.\" I agree, and I want to be louder than my\npredecessor was: changing that full stop to\
    \ a comma would repair the grammar and\nwould also be the single most defensible-looking rewrite in\
    \ the piece, which is\nwhat makes it dangerous. It is not an extraction error; the DOM export is\n\
    verbatim and X posts of his read this way. **Do not fix it in a later pass\nwithout asking him.**\
    \ If house style ever forces it, the change is one character\nand it must be disclosed.\n\n**Finding\
    \ 3 (heading dropped \"entire\")** is cleared: the heading is now \"Don't\nmake the entire service\
    \ bus non-deterministic,\" his full imperative. The point\nof \"entire\" is the sentence before it,\
    \ \"have a job invoke an agent as a\nprocess\": the agent is allowed to be non-deterministic, the\
    \ bus around it is\nnot. Dropping the word turned advice about where to put the non-determinism into\n\
    a blanket ban.\n\n## The thing my predecessor got right and I kept\n\nTheir root-cause note is the\
    \ most useful document in this folder and it should\nsurvive into any later round. The shipped edition-004\
    \ version of this piece was\na paraphrase wearing the `FAITHFUL EDIT` label, and its most-praised\
    \ line, \"WCF\ngives me bad memories,\" was **written by an editor in Huntley's person**. The\nsource\
    \ says \"lots of bad memories here\" inside an annotation. That sentence\npassed review because it\
    \ sounded like him.\n\nThat is the failure mode of this mode, and it is why I kept the editor count\
    \ so\nlow. Every sentence I wrote is in one of the two bolded notes, 73 words total,\nand both are\
    \ about provenance and structure, never about factories, service\nbuses, or what Huntley thinks. If\
    \ a later reviser finds a fluent connective\nsentence in Huntley's voice anywhere in this piece, someone\
    \ put it there and it\nis not his.\n\nAlso kept from the last round, deliberately:\n\n- **Lowercase\
    \ throughout the author's text.** All three posts are all-lowercase.\n  My headings and notes are\
    \ sentence case, which makes editorial apparatus\n  visually separable from author text at a glance.\n\
    - **`@dotnet` and `@temporalio` as handles.** The line editor called them\n  \"platform residue on\
    \ the page\" and they are, but they are how he names .NET\n  and Temporal. Swapping them changes his\
    \ wording. If house style demands the\n  swap, it is a wording change and should be logged as one.\n\
    - **Kept verbatim:** \"they are selling bullshit\", \"the spooky land of\n  enterprise\", \"ugh. blog\
    \ post time.\", \"the entire damn stack\", \"rn\", \"ie.\",\n  \"wanna\", \"<10\", \"who's-who\",\
    \ the \"!\" in \"(ie. they are likely startups created\n  in last six months!)\", \"not great tech\
    \ impl\", and the spaced slash in \"theory /\n  education\".\n- **No chrome to remove.** All three\
    \ extractions are clean DOM transcriptions:\n  no nav, no subscribe prompts, no social furniture.\n\
    - **Curly apostrophes (U+2019)** as in the extractions, byte-identical, so a\n  word-for-word diff\
    \ is clean.\n- **No U+2014 anywhere** (banned tic 7). No antithesis close, no summarising\n  final\
    \ paragraph, no narrator scaffolding (\"Huntley applies\", \"the author\n  argues\") in either note;\
    \ both notes take the post as their subject, not the\n  author as a narrator.\n\n## Length, and the\
    \ standing recommendation\n\nManuscript body is 453 words: 363 of Huntley across three posts, 73 words\
    \ of\neditor's notes, and the two headings. That is the ceiling this mode has for\nthese captures,\
    \ and the brief's 7-page budget is far above it. My predecessor's\nanalysis stands and I am restating\
    \ it so it does not get lost:\n\n`faithful_edit` cannot fill a 7-page slot from 363 words of source.\
    \ The routes\nare (1) capture more Huntley on this subject, in particular the blog post\npromised\
    \ by \"ugh. blog post time.\" and the first hot take that post 3 counts\nfrom, then run `faithful_synthesis`;\
    \ (2) an `original_editorial` that quotes\nthese three and does the developing in the magazine's voice;\
    \ or (3) ship at ~470\nwords and give the pages to something else. Recommendation is (1) if capture\
    \ is\npossible, (3) if not. Never (padding).\n\nNote that (1) got easier: the three canonical URLs\
    \ are consecutive-ish status\nids on one account on one afternoon. Anything between 2082525589416923314\
    \ and\n2082576563439312982 on `x.com/GeoffreyHuntley` is a candidate for the first hot\ntake, and\
    \ anything after is a candidate for the blog post announcement.\n\n## Prompt gaps worth fixing upstream\n\
    \n1. `faithful-edit.md` says both \"never reorder the argument\" and \"keep each\n   post's text intact\
    \ and in a declared order.\" Across posts these pull opposite\n   ways. It should say: within-post\
    \ order is frozen; across-post order is the\n   publication order when it is recoverable, and only\
