    \ that differ. Nothing else moved.\n\n`[3]` is the one that did not go to its marker. It is 60 words\
    \ of second-person\nadvice and it cannot be a parenthetical inside \"the innovators are toying\naround\"\
    . It is also physically last in the capture, so ending the section on it\nis the *least* movement\
    \ available, and it closes on \"learning the entire damn\nstack, automating it and showing it at your\
    \ next interview/doing a recorded talk\nat a meetup,\" which is a better section close than the abstraction\
    \ sentence was.\nThe editor's note discloses the exception in one clause so a checker diffing\nagainst\
    \ the capture knows it was a decision.\n\n**Finding 6 is cleared as a side effect.** The stack list,\
    \ the only thing in\nsection one a reader can act on, is now in the body sentence it modifies instead\n\
    of at the foot of the page. That was the line editor's advisory and it turned out\nto be forced anyway.\n\
    \n## Findings I did not clear, and why\n\n**Finding 8 (dead_words, the collapsing conditional).**\
