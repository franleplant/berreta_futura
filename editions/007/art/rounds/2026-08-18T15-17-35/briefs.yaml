- id: cover-exactly-one-key
  purpose: cover
  prompt: 'One-sentence reading of this edition: a durable system''s whole promise is that exactly one holder is current, and the moment a new one is admitted the old one stops working. Proposition, argued by the image: admission is single-file, and the key that just lost its turn is already dead metal in the air. Bold abstract-graphic editorial poster plate, print-flat and high contrast. How the plate sits in the cover frame: it is a square plate placed on a warm off-white magazine page below a black masthead with a red-orange accent and beside a red-orange spine band, so the plate keeps a hard-edged near-black silhouette against that white page and picks the masthead''s vermilion up in the key. Ink set: a generous pale bone ground, a near-black mass, vermilion, deep oxblood for shadow, and exactly one luminous accent of hot chrome yellow. Composition, five large forms and no more: a colossal near-black vault door filling most of the square, seen straight on, its face a confident flat fill; a single small keyhole in it from which hot chrome-yellow light escapes as the image''s one luminous event; one vermilion key suspended mid-air just short of the keyhole, caught in arrested motion; a second key, bent and inert, falling away below in oxblood silhouette; one long hard-edged oxblood shadow thrown across the bone ground. Print-flat color: hard edges, confident fills, shading only to give the door its weight. Square artwork, at least 1000 by 1000 pixels, important detail kept away from the extreme edges, readable and unmistakable at thumbnail size. Ignore any interior art direction palette; this is cover ink discipline. Avoid: all typography, mastheads, titles, issue numbers, captions, logos, numerals, pseudo-writing, watermarks; swarms, confetti, particle clouds, grids or arrays of repeated small elements, scattered debris; mid-tone grounds, photographic gray, dusk haze, textured wallpaper grounds; muddying gradients, pigment-wash softness, all-over grain; characters, faces, scenes, or narrative staging; circuit motifs, network graphs, neon cyberpunk, AI-futurist cliches; anatomical or material incoherence at the key and lock intersections.'
- id: cover-missing-tread
  purpose: cover
  prompt: 'One-sentence reading of this edition: durable execution means the work keeps climbing even when the step it needs is not there yet, because the missing step is remade and set into place under the climber''s foot. Proposition, argued by the image: the staircase is repairing itself mid-ascent. Bold abstract-graphic editorial poster plate, print-flat and high contrast. How the plate sits in the cover frame: it is a square plate on a warm off-white page under a black masthead with a red-orange accent and beside a red-orange spine band, so the plate runs a confident-dark ground for a lantern-slide effect inside the white page and answers the masthead with vermilion at the figure. Ink set: a deep navy-black ground, bone white, cobalt, vermilion, and exactly one luminous accent of hot chrome yellow. Composition, five large forms and no more: a massive bone-white staircase cut in hard flat treads rising steeply from the lower left and leaving the frame at the upper right; one tread missing, leaving a clean black gap that reads instantly as the image''s wound; a single slab of tread hovering into that gap, glowing hot chrome yellow, the one luminous event; one tiny vermilion human figure, emblem scale, standing on the tread just below the gap for scale shock; one long cobalt shadow raking down the stair face. Strong tension from precarious balance and arrested motion. Print-flat color: hard edges, confident fills, controlled shading only on the stair mass. Square artwork, at least 1000 by 1000 pixels, important detail away from the extreme edges, unmistakable at thumbnail size. Ignore any interior art direction palette; this is cover ink discipline. Avoid: all typography, mastheads, titles, numerals, captions, logos, pseudo-writing, watermarks; swarms, confetti, particle clouds, grids or arrays of repeated small elements, scattered debris; mid-tone or muddy grounds, textured wallpaper grounds; muddying gradients, pigment-wash softness, all-over grain; characters with faces, scenes, or narrative staging beyond the single emblem figure; circuit motifs, network graphs, neon cyberpunk, AI-futurist cliches; incoherent perspective or floating geometry at the stair intersections.'
- id: cover-loop-and-hammer
  purpose: cover
  prompt: 'One-sentence reading of this edition: a loop that refuses to call the work done keeps sending the same piece around to be struck again until it finally holds. Proposition, argued by the image: the circuit is a forge, and the work is still hot on its next pass. Bold abstract-graphic editorial poster plate, print-flat and high contrast. How the plate sits in the cover frame: it is a square plate on a warm off-white page beneath a black masthead with a red-orange accent and beside a red-orange spine band, so the plate holds a deep oxblood-black ground for a lantern-slide effect against the white page and repeats the masthead''s red-orange in the tool. Ink set: a deep oxblood-black ground, bone white, cobalt, vermilion, and exactly one luminous accent of white-hot chrome yellow. Composition, five large forms and no more: one enormous bone-white band looped into a single closed circuit that twists once, drawn as a broad flat ribbon filling the square; a small molten bead riding that ribbon, white-hot chrome yellow and the image''s single luminous event; a heavy vermilion hammer head poised above one point of the ribbon in arrested motion, its handle leaving the frame; a hard cobalt shadow of the hammer cast onto the ribbon''s flat face; one short bright spark struck at the ribbon''s surface. Print-flat color: hard edges, confident fills, shading only to turn the ribbon in space. Square artwork, at least 1000 by 1000 pixels, important detail away from the extreme edges, one-beat legibility at thumbnail size. Ignore any interior art direction palette; this is cover ink discipline. Avoid: all typography, mastheads, titles, numerals, captions, logos, pseudo-writing, watermarks; swarms, confetti, particle clouds, showers of sparks, grids or arrays of repeated small elements, scattered debris; mid-tone grounds, photographic gray, textured wallpaper grounds; muddying gradients, pigment-wash softness, all-over grain; characters, faces, scenes, narrative staging; circuit motifs, network graphs, neon cyberpunk, AI-futurist cliches; physically incoherent contact between hammer, spark, and ribbon.'
- id: opener-workflows
  purpose: opener
  article_id: cloudflare-workflows-in-a-nutshell
  prompt: |-
    Original family-friendly children's science-comedy manga illustration with simple charcoal contours, rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone, quiet print grain, and one playful visual idea. Draw only the recurring cast, exactly as their canonical descriptions specify: Pedro, Maro, and Flopaz, and nobody else. Scene, one idea: a step that has to be tried again before the work can go on. A shallow stream in a garden, crossed by a rising line of broad flat stepping stones that climbs toward a low stone wall. Pedro is halfway up, carrying a full brick-coral watering can in both hands, weight on his back foot, leaning away from the next stone because it has tipped under him; his expression is startled but game. Maro crouches beside that stone with both mitten hands under its edge, bracing it level, face tilted up at Pedro. Flopaz stands one stone lower, calm and observant, holding a small glass hourglass out where Pedro can see it, marking the wait before he tries the step again. Water rings spread where the stone dipped. Palette: scene-led gentle historical magazine color at low to medium saturation, softened cyan and cobalt in the stream, muted green banks and reeds, brick coral on the can, dusty lavender in the shaded stones, small warm-ochre accents on the wall, warm off-white breathing room, charcoal ink contours. The setting chooses the background; never a uniform yellow paper field. Constraints: entirely wordless editorial storytelling; one single scene, no panels; square composition with the essential action centred so it survives a square opener crop and stays legible at A5 size; strong silhouettes, print-friendly contrast, at least three distinct non-neutral colors, slight pigment variation, subtle paper tooth, quiet print grain. Avoid: any recognizable franchise character, Doraemon or Nobita likenesses, blue robotic cats, franchise gadgets, copied costumes or faces; extra humans, extra robots, or robot-faced background appliances; uniform yellow, mustard, beige, sepia, cream-paper, or bright cyan backgrounds; decorative montages, contact sheets, filler patterns; dense technical realism, steampunk clutter, heavy crosshatching; modern glossy anime rendering, painterly concept art, neon cyberpunk, photorealism; pseudo-writing, interface glyphs, numerals, captions, labels, or speech balloons.

    Recurring cast — draw exactly as specified, never redesign: Pedro, a school-age boy: black tousled hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions, or extra limbs. Flopaz, a school-age girl, Pedro's height: chestnut-brown hair in one low side ponytail with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top; white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails, never a hat, never glasses.
  subject: A step that gives way under Pedro is braced level by Maro while Flopaz times the pause before he tries it again, the shape of a workflow step that retries.
  composition: Square, low three-quarter view up the stepping-stone line, Pedro off-balance at centre with Maro under the tipped stone and Flopaz a step below.
  alt_text: Pedro carries a watering can up stepping stones across a stream; Maro braces a tipping stone while Flopaz holds up an hourglass beside him.
  credit: Illustration generated for this edition in the Story-Led Boy and Robot art direction.
  cast_references:
  - art-directions/references/story-led-boy-and-robot-cast.png
