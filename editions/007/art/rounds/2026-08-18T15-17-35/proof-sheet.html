<details><summary>prompt</summary><pre>One-sentence reading of this edition: a durable system's whole promise is that exactly one holder is current, and the moment a new one is admitted the old one stops working. Proposition, argued by the image: admission is single-file, and the key that just lost its turn is already dead metal in the air. Bold abstract-graphic editorial poster plate, print-flat and high contrast. How the plate sits in the cover frame: it is a square plate placed on a warm off-white magazine page below a black masthead with a red-orange accent and beside a red-orange spine band, so the plate keeps a hard-edged near-black silhouette against that white page and picks the masthead's vermilion up in the key. Ink set: a generous pale bone ground, a near-black mass, vermilion, deep oxblood for shadow, and exactly one luminous accent of hot chrome yellow. Composition, five large forms and no more: a colossal near-black vault door filling most of the square, seen straight on, its face a confident flat fill; a single small keyhole in it from which hot chrome-yellow light escapes as the image's one luminous event; one vermilion key suspended mid-air just short of the keyhole, caught in arrested motion; a second key, bent and inert, falling away below in oxblood silhouette; one long hard-edged oxblood shadow thrown across the bone ground. Print-flat color: hard edges, confident fills, shading only to give the door its weight. Square artwork, at least 1000 by 1000 pixels, important detail kept away from the extreme edges, readable and unmistakable at thumbnail size. Ignore any interior art direction palette; this is cover ink discipline. Avoid: all typography, mastheads, titles, issue numbers, captions, logos, numerals, pseudo-writing, watermarks; swarms, confetti, particle clouds, grids or arrays of repeated small elements, scattered debris; mid-tone grounds, photographic gray, dusk haze, textured wallpaper grounds; muddying gradients, pigment-wash softness, all-over grain; characters, faces, scenes, or narrative staging; circuit motifs, network graphs, neon cyberpunk, AI-futurist cliches; anatomical or material incoherence at the key and lock intersections.</pre></details>
</figure>

l-over grain; characters with faces, scenes, or narrative staging beyond the single emblem figure; circuit motifs, network graphs, neon cyberpunk, AI-futurist cliches; incoherent perspective or floating geometry at the stair intersections.</pre></details>

<details><summary>prompt</summary><pre>Original family-friendly children's science-comedy manga illustration with simple charcoal contours, rounded readable expressions, economical watercolor washes, minimal hatching, restrained halftone, quiet print grain, and one playful visual idea. Draw only the recurring cast, exactly as their canonical descriptions specify: Pedro, Maro, and Flopaz, and nobody else. Scene, one idea: a step that has to be tried again before the work can go on. A shallow stream in a garden, crossed by a rising line of broad flat stepping stones that climbs toward a low stone wall. Pedro is halfway up, carrying a full brick-coral watering can in both hands, weight on his back foot, leaning away from the next stone because it has tipped under him; his expression is startled but game. Maro crouches beside that stone with both mitten hands under its edge, bracing it level, face tilted up at Pedro. Flopaz stands one stone lower, calm and observant, holding a small glass hourglass out where Pedro can see it, marking the wait before he tries the step again. Water rings spread where the stone dipped. Palette: scene-led gentle historical magazine color at low to medium saturation, softened cyan and cobalt in the stream, muted green banks and reeds, brick coral on the can, dusty lavender in the shaded stones, small warm-ochre accents on the wall, warm off-white breathing room, charcoal ink contours. The setting chooses the background; never a uniform yellow paper field. Constraints: entirely wordless editorial storytelling; one single scene, no panels; square composition with the essential action centred so it survives a square opener crop and stays legible at A5 size; strong silhouettes, print-friendly contrast, at least three distinct non-neutral colors, slight pigment variation, subtle paper tooth, quiet print grain. Avoid: any recognizable franchise character, Doraemon or Nobita likenesses, blue robotic cats, franchise gadgets, copied costumes or faces; extra humans, extra robots, or robot-faced background appliances; uniform yellow, mustard, beige, sepia, cream-paper, or bright cyan backgrounds; decorative montages, contact sheets, filler patterns; dense technical realism, steampunk clutter, heavy crosshatching; modern glossy anime rendering, painterly concept art, neon cyberpunk, photorealism; pseudo-writing, interface glyphs, numerals, captions, labels, or speech balloons.

Recurring cast — draw exactly as specified, never redesign: Pedro, a school-age boy: black tousled hair, big round glasses, teal crew-neck top, khaki shorts, red sneakers. Always this outfit. Never a hat, never another hairstyle. Maro, a small helper robot, waist-high to Pedro: off-white rounded rectangular body; black face screen with two friendly curved white eyes; cobalt side panels, shoulder joints, mitten hands, and rounded feet; one short antenna with a cobalt ball tip; coral tool pouch at the waist. Never a single eye, a visor face, tank treads, wheels, tin-toy styling, humanoid proportions, or extra limbs. Flopaz, a school-age girl, Pedro's height: chestnut-brown hair in one low side ponytail with straight bangs; soft rose-pink pinafore dress with side pockets over a white short-sleeve top; white socks, muted-green flat shoes. Calm and observant. Always this outfit. Never twin pigtails, never a hat, never glasses.</pre></details>
