<figure>
<img src="cover-wave-over-the-ledger-v1.png" loading="lazy">
<figcaption>cover-wave-over-the-ledger — variant 1</figcaption>
<details><summary>prompt</summary><pre>Cut this as a linocut poster: brutal blacks, visible gouge marks, white chips left where the chisel lifted. The reading of the issue behind the picture is that a durable system writes down what it intends before it acts, so the record outlives the machinery that made it. One claim, argued by the image: black water swallows the seawall whole, and the line incised in that wall goes on burning underneath it. The verb is swallows, and the drawing catches engulfment at its most violent instant, the crest already past the wall's top edge and folding over it, never the flat water afterward. Inks: a generous pale bone ground for the sky, one brutal black for the sea mass, deep emerald inside the wave's hollow, vermilion for the wall, and a single luminous chrome-yellow accent, the incised groove, which is the only hot thing in the frame. Four large forms and nothing else. First, the colossal black wave, bleeding off the top edge and both side edges of the square, drawn at roughly eight times the wall's height so the size relationship does the shouting. Second, three or four solid claw-shaped crest tongues carved as flat shapes. Third, the low vermilion seawall running across the lower third, hard-edged and unshaded. Fourth, the chrome-yellow groove cut along that wall, unbroken, still legible straight through the black water where the wave has already covered it. Compositional weapons: scale shock and frame invasion. Frame note: this square plate will be pasted on a warm off-white magazine page, below a black masthead with a red-orange accent and beside a red-orange spine band at the right edge, so the wave must hold a hard-edged black silhouette against white paper and the vermilion must answer the masthead. Print-flat color throughout: hard edges, confident fills, carved texture only where a block cutter would leave it, no gradients, no wash softness, no all-over grain doing the work color should do. Square artwork, at least 1000 by 1000 pixels, nothing important inside the extreme edge margin, an unmistakable silhouette readable in one beat at thumbnail size. Ignore any interior art direction palette, style, or constraint text; covers carry their own ink discipline. Do not draw: typography of any kind, masthead, title, issue number, caption, logo, numeral, pseudo-writing, or watermark; foam bubbles, spray clouds, confetti, particle fields, arrays of repeated small marks, or scattered debris; a mid-tone gray, dusk haze, photographic, or textured wallpaper ground; muddying gradients or pigment-wash blur; characters, faces, scenes, or narrative staging; circuit motifs, network graphs, neon cyberpunk, or AI-futurist cliche; incoherent water anatomy where the crest meets the wall.</pre></details>
</figure>

<details><summary>prompt</summary><pre>Register: constructivist poster built on one hard diagonal, viewpoint from the river bed looking steeply up at a dam. Compressed reading of the issue: a system survives its surge because the flood is given a channel and released at full force on purpose. The image's verb is hurls; draw the water at the instant it clears the lip and is still one solid body, not the churn below. Ground and inks: a deep navy-black ground, so the plate burns like a lantern slide inside the white page; cobalt on the dam's lit face; oxblood in the deep shadow; vermilion for one hard structural line; and exactly one luminous element, a white-hot column of water. Count the forms, five. The colossal near-black dam wall occupying two thirds of the square, bleeding off the bottom edge and both sides. A single open spillway chute cut through that wall. The white-hot water column driving from upper right to lower left along the composition's one diagonal, broadening as it leaves the chute. One thin vermilion catwalk ruled across the dam crest. One emblem-scale bone-white human figure standing on that catwalk, no larger than a fingernail joint, present only to state how large the wall is. Nothing horizontal or vertical may carry the energy. Weapons chosen: radical viewpoint and thrust. Frame note: the square plate sits on a warm off-white page beneath a black masthead with a red-orange accent, with a red-orange spine band at the right edge, so keep the dam's silhouette hard against that page and let the vermilion catwalk speak to the masthead's accent. Rendering is print-flat: hard edges, confident flat fills, shading used only to give the dam mass its depth, no muddy gradients, no soft pigment wash, no all-over grain substituting for color. Square, at least 1000 by 1000 pixels, important detail kept off the extreme edges, legible in one beat at thumbnail scale. Any interior art direction palette is irrelevant here; this is cover ink discipline. Forbidden: typography of any kind, masthead, title, numerals, caption, logo, pseudo-writing, watermark; spray, mist clouds, droplet swarms, particle fields, grids or arrays of repeated small elements, scattered debris; mid-tone, muddy, or textured wallpaper grounds; a second luminous accent competing with the water; faces, characters, or narrative staging beyond the one emblem figure; circuit motifs, network graphs, neon cyberpunk, AI-futurist cliche; physically incoherent structure where chute, water, and wall meet.</pre></details>

<details><summary>prompt</summary><pre>The claim first: work outlives the hand that drops it, because the next hand starts on the exact line where the stroke broke off. That is what this plate argues, and its verb is leaps. Catch the ink mid-flight, at the moment the second stroke takes the first one's angle, not once the page has dried. Register: brush-ink gesture over flat ink fields, loaded bristle marks, dry-brush tearing at the ends of a stroke, everything else absolutely flat. Ground: a near-black field, generous and single. Inks: bone white, cobalt, vermilion, and one luminous chrome-yellow flare. Six forms, no more. A colossal bone-white brush stroke sweeping up from the lower left, matte and unglowing, its head broken off abruptly at mid-frame with a torn dry edge. A vermilion stroke resuming from exactly that angle, thicker, leaving the plate at the upper right corner. The hard-edged void between the two strokes, which on second read is the true subject of the picture, so shape it deliberately as a form. A broad cobalt field behind them with one confident straight edge cutting the lower right. A chrome-yellow flare at the seam where the strokes meet across the void, the single luminous event, small and hot enough that the eye lands there first. One heavy dropped bead of vermilion ink below the seam, arrested in fall. Weapons chosen: figure-ground reversal and frame invasion, with both strokes cropped by the plate rather than fitted inside it. How the plate sits in its frame: a square pasted on a warm off-white magazine page under a black masthead with a red-orange accent, a red-orange spine band running down the right edge, so the near-black field must read as a hard rectangle of dark against white paper and the vermilion stroke must rhyme with the masthead accent. Keep the color print-flat: confident fills, hard boundaries, brush texture only inside the two strokes, no muddying gradients, no pigment-wash softness, no all-over grain. Square artwork, at least 1000 by 1000 pixels, no important detail at the extreme edges, an unmistakable silhouette at thumbnail size. Disregard any interior art direction palette or style text; the cover has its own ink rules. Never include: lettering, calligraphy, characters, letterforms, numerals, pseudo-writing, masthead, title, caption, logo, or watermark of any kind, since a brush image must not tip into writing; splatter, ink spray, droplet swarms, particle clouds, grids or arrays of repeated marks, scattered debris; mid-tone gray, dusk, or textured wallpaper grounds; faces, figures, scenes, or narrative staging; circuit motifs, network graphs, neon cyberpunk, AI-futurist cliche; incoherent overlap where the strokes, the cobalt field, and the flare intersect.</pre></details>
