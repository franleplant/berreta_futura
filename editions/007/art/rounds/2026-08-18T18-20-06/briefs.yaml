briefs:
- id: cover-slab-split
  purpose: cover
  prompt: |
    Two-plate risograph poster with deliberate misregistration. The second plate lands
    about two millimetres off the first, so every form carries a doubled edge where the
    inks refuse to line up, and the paper tooth breathes through the flat fills.

    One-sentence reading of this edition: work that was buried and interrupted comes back
    up through whatever got laid on top of it.

    The claim this plate argues: the slab loses.

    The verb is SPLITS. Draw the fracture at the instant it opens, shards still rising and
    turning in the air, the broken edges raw. Never the aftermath, never a tidy weed in a
    tidy crack.

    Ink set, named exactly: a generous cobalt ground, saturated enough to stay
    unmistakably cobalt on uncoated paper; near-black for the slab; bone white for the
    shoot; vermilion for the root mass; and exactly ONE luminous accent, a hot chrome-yellow
    shoot tip, the only glowing thing anywhere on the plate.

    Five forms, counted:
    1. A colossal near-black paving slab crossing the full width of the square, bleeding off
       both side edges, its top plane seen almost edge-on so it reads as one hard black bar.
    2. The fracture torn through it, a single jagged hard-edged opening, no hairline
       secondary cracks.
    3. Three big slab shards arrested in mid-lift, each roughly the size of a door, tipping
       outward, cropped by the frame where they leave it.
    4. One bone-white shoot as thick as a ship's mast driving up through the break and
       leaving the plate at the top edge.
    5. A vermilion root mass below the ground line, drawn as one solid confident shape along
       a flat cross-section band at the bottom, never a tangle of small threads.

    The chrome-yellow tip sits where the shoot clears the slab, small, incandescent, the
    first thing the eye lands on.

    Weapons chosen: scale shock, stated as a size relationship, the shoot is a mast and the
    slab is a barn door laid flat; and radical viewpoint, a dead-on macro from ground level
    and slightly beneath the slab's top plane, never eye level at middle distance.

    How the plate sits in the cover frame: it is a square plate pasted on a warm off-white
    magazine page, black masthead with a red-orange accent above it, red-orange spine band
    down the right edge, so the cobalt field must cut a hard-edged rectangle against that
    white paper and the vermilion root must answer the masthead across the layout.

    Print-flat colour throughout: hard edges, confident opaque fills, misregistration halos
    only where the two plates overlap, shading used nowhere. Square artwork, at least 1000 by
    1000 pixels, nothing important at the extreme edges, an unmistakable silhouette readable
    in one beat at thumbnail size.

    Ignore any interior art direction palette, style, cast, or constraint text; the cover
    carries its own ink discipline and no recurring characters.

    Do not draw: typography of any kind, masthead, title, issue number, caption, logo,
    numerals, pseudo-writing, or watermark; gravel, grit, soil crumbs, confetti, particle
    clouds, grids or arrays of repeated small elements, scattered debris; leaves, flowers,
    tendrils, or botanical prettiness on the shoot; a mid-tone, gray, hazy, photographic, or
    textured wallpaper ground; a black or near-black ground; a second luminous accent
    competing with the shoot tip; people, faces, hands, characters, scenes, or narrative
    staging; circuit motifs, network graphs, neon cyberpunk, or AI-futurist cliche;
    photorealism, glossy rendering, or all-over grain doing the work colour should do.
- id: cover-keystone-drop
  purpose: cover
  prompt: |
    MEDIUM. Large-format colour photography, one frame, shot on location at a full-scale
    limestone arch under construction. Real stone, real oak, real sun. No illustration, no
    render.

    THE READING. Nothing holds until the last piece is in, and the frame that carried the
    work that far is already falling away beneath it.

    THE CLAIM. The arch is about to take its own weight.

    THE VERB. DROPS. Shutter caught with the keystone still a hand's width above its seat,
    the oak centering below broken loose and swinging out, timbers past the point of no
    return. Not a finished arch. Not a construction site at rest.

    VIEWPOINT. Worm's-eye, camera on the ground directly beneath the crown, lens tipped
    steeply up, the arch towering and converging. Nothing at eye level, nothing at middle
    distance.

    LIGHT. Hard low sun raking in from the left, cutting the stone's chisel tooth into
    relief. Exactly ONE luminous element in the frame: the sun striking the keystone's freshly
    cut underside as a single hot white plane. Everything else sits below it in value.

    PALETTE. A saturated cobalt sky as the ground of the picture, deep but unmistakably a
    blue in print, never a black or a mid-tone gray haze. Bone-white quarry limestone. Honey
    and umber oak. One vermilion rigging strap cinched around the keystone.

    FIVE FORMS.
    1. The colossal limestone arch, filling most of the square, cropped hard by the left
       edge, the right edge and the bottom edge, so its springing points are never shown.
    2. The empty wedge-shaped void at the crown, which on second read is the true subject, so
       compose it deliberately as a clean shape of cobalt sky cut into the stone.
    3. The keystone itself, oversized in the frame, close enough that saw marks and grain are
       unmistakable, hanging in the air with the vermilion strap round its waist.
    4. The oak centering frame collapsing away below, one big splintered timber swinging out
       of the arch's shadow.
    5. A single chain running up from the strap and leaving the plate at the top edge.

    WEAPONS. Frame invasion, since arch, timber and chain are all cropped by the plate rather
    than fitted inside it; and figure-ground reversal, since the cobalt void at the crown
    carries the picture.

    THE FRAME IT LIVES IN. This square plate will be laid on a warm off-white magazine page
    beneath a black masthead with a red-orange accent, a red-orange spine band running down
    the right edge, so the arch must hold a hard-edged high-contrast silhouette against that
    white paper and the vermilion strap must rhyme with the masthead accent.

    CRAFT. Material conviction is the whole job: believable stone mass, honest shadow density,
    real specular glint on iron hardware, splintered oak that could actually have snapped,
    shallow depth of field with the keystone sharp. Print the contrast hard so the plate does
    not go gray on paper.

    Square artwork, at least 1000 by 1000 pixels, no important detail at the extreme edges,
    a silhouette that still reads at thumbnail size.

    Ignore any interior art direction palette, style, cast, or constraint text; the cover has
    its own rules and no recurring characters.

    NEVER INCLUDE: lettering, mason's marks, carved inscriptions, numerals, signage,
    pseudo-writing, masthead, title, caption, logo, or watermark; dust clouds, mortar spray,
    sparks, lens flare, particle fields, or scattered debris; a mid-tone gray, overcast, hazy
    or textured wallpaper sky; a black or near-black ground; a second bright accent competing
    with the sunlit keystone face; people, faces, hands, or narrative staging; ruins,
    heritage nostalgia dressing, ivy, or styled props; circuit motifs, network graphs, neon
    cyberpunk, or AI-futurist cliche; masonry that could not physically stand or hang.
- id: cover-tortoise-lamp-violet
  purpose: cover
  prompt: |
    Gouache and ink poster painting on heavy rag board: opaque flat fields, silhouettes cut
    as hard as if with a blade, visible brushwork only inside the shell plates.

    The improbable idea, stated plainly: a tortoise the size of a barn is walking through a
    grass fire with a small lit house strapped to its back, and the lamp inside that house
    has not gone out.

    One-sentence reading of the edition behind it: a system you run yourself carries its own
    light and does not stop for the weather.

    The verb is SHOULDERS. Catch the animal at the instant its head and leading shell edge
    push past the flame line, grass bending back from the rim, fire folding around it. Not
    before the fire, not safely through it.

    Ink set, named exactly: one generous saturated violet field for the whole sky, violet
    that stays unmistakably violet in print and never slides toward black or a smoky
    mid-tone; near-black used only as a FORM ink, for the animal and one cast shadow; oxblood
    for the shell's plate divisions and the straps; vermilion for the fire; bone white for
    the house. Exactly ONE luminous accent: the single lit window of that little house, warm
    chrome-yellow and burning, the only glow anywhere in the picture. The flames are painted
    as FLAT vermilion shapes with no halo, no bloom and no glow, so nothing competes with the
    window.

    Darkness in this plate lives in the animal, never behind it. The night is carried by the
    violet field and by the black bulk standing against it.

    Five forms, counted:
    1. The colossal tortoise in near-black, occupying the lower two thirds of the square and
       bleeding off the left edge, the right edge and the bottom edge, so the plate crops it
       confidently and its full length is never shown.
    2. The shell, its plates drawn as a few big oxblood-edged facets, painterly within, hard
       at the outline.
    3. The small bone-white house riding that shell, a plain gabled block, no bigger against
       the animal than a matchbox against a barn door, held by two oxblood straps.
    4. The single luminous window in that house, the picture's whole event, found by the eye
       in one beat.
    5. A low continuous wall of vermilion flame running across the horizon behind and around
       the animal, drawn as one bold shape with a few broad tongues, never a field of small
       flickers.

    One hard near-black shadow is thrown forward across the grass from the fire line.

    Weapons chosen: scale shock, stated as a size relationship, the house is a matchbox on a
    barn; and frame invasion, the animal cropped on three edges.

    How the plate sits in the cover frame: a square plate pasted on a warm off-white magazine
    page, black masthead with a red-orange accent above, red-orange spine band at the right
    edge, so the animal must hold a hard near-black silhouette against the violet field while
    the vermilion fire picks up the masthead's accent across the page.

    Rendering: print-flat and high contrast, confident opaque fills, hard boundaries, gouache
    facture allowed only within the shell, controlled shading only where the animal needs
    weight. No muddying gradients, no wash blur, no all-over grain. Judge the anatomy
    strictly: real reptile mass and gait, believable contact where straps meet shell and
    where feet meet ground, the house sitting with honest weight.

    Square artwork, at least 1000 by 1000 pixels, important detail kept away from the extreme
    edges, an unmistakable silhouette at thumbnail size. This is a graphic emblem, not an
    illustrated storybook scene: no companions, no onlookers, no plot.

    Ignore any interior art direction palette, style, cast, or constraint text; the cover has
    its own ink discipline and no recurring characters.

    Do not draw: typography of any kind, masthead, title, numerals, caption, signage, logo,
    pseudo-writing, or watermark; embers, sparks, smoke plumes, ash swarms, particle clouds,
    grids or arrays of repeated small elements, scattered debris; a black, near-black,
    mid-tone, gray, smoky, or textured wallpaper ground; a second glowing element beside the
    window; human figures, faces, animal cuteness, cartoon eyes, or anthropomorphic
    expression; fantasy world-turtle ornament, howdahs, towers, cities on the back, or
    mystical iconography; circuit motifs, network graphs, neon cyberpunk, AI-futurist cliche,
    or photorealism.
