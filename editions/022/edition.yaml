- id: choosing-quepaxa-an-unusual-consensus-algorithm
  title: Choosing QuePaxa, an unusual consensus algorithm
  short_title: Choosing QuePaxa
  display_emphasis: QuePaxa
  opener_variant: stepped_title
  author: João Pedro Leite, Bob Halley, James Larisch
  author_note: Engineers at Cloudflare.
  content_mode: article
  source_ids:
  - choosing-quepaxa-an-unusual-consensus-algorithm-e4c8a7e8
  manuscript: editions/022/articles/choosing-quepaxa-an-unusual-consensus-algorithm.md
  # figures: the first three source images, captioned from their alt text, the rest commented out; three at most. layout is one of
  # evidence_band, evidence_band_prose, adaptive_band, compact_band, column_plate, landscape_plate, full_band, rotated_plate;
  # render enlarges small-text figures itself unless the row sets fit: keep, and tone: auto|keep|invert controls dark-image inversion.
  figures:
  - id: figure-1
    source_id: choosing-quepaxa-an-unusual-consensus-algorithm-e4c8a7e8
    path: media/001.png
    caption: In the Prepare phase, a proposer sends a ballot numbered “1” to three acceptors.
    alt_text: In the Prepare phase, a proposer sends a ballot numbered “1” to three acceptors. The three acceptors reply. Then, in the Accept phase, the proposer broadcasts its proposal to the three acceptors. The acceptors have not received any other ballot, and so they accept the proposal. They reply to the proposer with this information, and the proposer decides.
    anchor: Why leaders fail at global scale
    layout: evidence_band
  - id: figure-2
    source_id: choosing-quepaxa-an-unusual-consensus-algorithm-e4c8a7e8
    path: media/002.png
    caption: 'There are two proposers: one red, and one blue.'
    alt_text: 'There are two proposers: one red, and one blue. In the Prepare phase, the blue proposer sends a ballot numbered “1” to three acceptors. The three acceptors reply. Then, the red proposer, in its own Prepare phase, sends a ballot numbered “2” to the three acceptors, before the blue proposer can send its proposal in the Accept phase. Because the red proposer reached the three acceptors with a higher ballot number, the blue proposer’s proposal was rejected. The blue proposer then sends a new ballot numbered “3” to all three acceptors. The blue ballots arrive before the red proposer can send its proposal to the acceptors, and so the acceptors reject the red proposer’s proposal. This then continues forever.'
    anchor: Why leaders fail at global scale
    layout: evidence_band
  - id: figure-3
