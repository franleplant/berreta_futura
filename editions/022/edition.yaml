  #   caption: A flowchart shows how QuePaxa’s phases progress.
  #   alt_text: 'A flowchart shows how QuePaxa’s phases progress. The flowchart is vertically aligned. There are four major steps in the flowchart, each one representing a phase in the QuePaxa protocol. The flowchart starts with a block titled “Phase 0 (Propose & Adopt)”, which has two arrows: one to the right, pointing at block labelled “Decide”, via an arrow labelled “Leader Fast Path”, and another arrow labelled “Majority Replies” pointing down at a block titled “Phase 1 (Spread)”. The Phase 1 block has a single arrow labelled “Majority Replies”  pointing below to the next phase block “Phase 2 (Check & Decide)”. The Phase 2 block has an arrow labelled “Proposal has Max Priority” pointing to the right, to a block titled “Decide”, and another arrow labelled “Majority Replies” pointing down to the final Phase block: “Phase 3 (Carry Forward)”. The Phase 3 block has a single arrow labelled “New Round” pointing back up to the Phase 0 block.'
  #   anchor: How QuePaxa works under the hood
  #   layout: evidence_band
  # - id: figure-9
  #   source_id: choosing-quepaxa-an-unusual-consensus-algorithm-e4c8a7e8
  #   path: media/009.png
  #   caption: The image shows a message passing diagram, where time progresses from left to right.
  #   alt_text: 'The image shows a message passing diagram, where time progresses from left to right. There are five lanes. At the leftmost side of the diagram, there are, ordered vertically: a blue server with a crown, labelled “Leader”, with a blue ribbon attached to it, and an infinity sign at the center of the ribbon; three violet servers with a pen and paper, each labelled “Recorder”; a red server (with no crown), with a red ribbon attached to it, and a 1 at the center of the ribbon. The blue leader and the red proposer both broadcast their current proposal to every recorder. The recorders record and reply with the first proposal they receive. The leader reaches the first and second recorder first, while the red proposer reaches the third recorder first. The leader receives a majority (2) of replies each carrying the leader’s proposal. The leader sees that all proposals in the majority are its own and decides. The red proposer receives a majority (2) of the recorder’s replies, from the second and third recorders, who replied with the leader’s proposal and the red proposer’s proposal, respectively. The red proposer adopts the leader’s proposal, since it is the one with maximum priority in the majority it received.'
  #   anchor: How QuePaxa works under the hood
  #   layout: evidence_band
  # - id: figure-10
  #   source_id: choosing-quepaxa-an-unusual-consensus-algorithm-e4c8a7e8
  #   path: media/010.png
  #   caption: Diagram with three recorders.
  #   alt_text: Diagram with three recorders. Two of them have recorded the leader’s proposal, while the other has recorded the red proposer’s proposal. The diagram shows how any groupings of two recorders must share one recorder by adding a semi-transparent Venn diagram on top of the recorders.
  #   anchor: How QuePaxa works under the hood
  #   layout: evidence_band
  # - id: figure-11
  #   source_id: choosing-quepaxa-an-unusual-consensus-algorithm-e4c8a7e8
  #   path: media/011.png
  #   caption: The blue leader proposer and the red proposer both broadcast their current proposal to every recorder.
  #   alt_text: The blue leader proposer and the red proposer both broadcast their current proposal to every recorder. The recorders record and reply with the first proposal they receive. The leader reaches the first recorder first, while the red proposer reaches the second and third recorders first. The leader receives a majority (2) of replies, containing its own maximum priority proposal and the red proposer’s proposal with priority 1. The leader adopts the proposal with the greatest priority which is its own. The red proposer receives a majority (2) of the recorder’s replies, from the second and third recorders, both containing the red proposer’s proposal. The red proposer adopts its own proposal, since it is the one with maximum priority in the majority it received. The reply from the third recorder arrives late, not in the majority, so it isn’t considered for adoption.
  #   anchor: How QuePaxa works under the hood
  #   layout: evidence_band
  # - id: figure-12
  #   source_id: choosing-quepaxa-an-unusual-consensus-algorithm-e4c8a7e8
  #   path: media/012.png
  #   caption: The blue leader proposer and the red proposer both broadcast their current proposal to every recorder.
  #   alt_text: The blue leader proposer and the red proposer both broadcast their current proposal to every recorder. The leader’s message to the third recorder is lost and never reaches the recorder. The first and second recorder each receive the leader’s proposal, with maximum priority, and the red proposer’s proposal, with priority 1. The third recorder only receives the red proposer’s proposal. Each recorder records the proposal with highest priority for the next phase. The first and second recorder record the leader’s proposal, while the third recorder records the red proposer’s proposal.
  #   anchor: How QuePaxa works under the hood
  #   layout: evidence_band
  # - id: figure-13
  #   source_id: choosing-quepaxa-an-unusual-consensus-algorithm-e4c8a7e8
  #   path: media/013.png
  #   caption: The blue leader and the red proposer both broadcast their current proposal to every recorder.
  #   alt_text: The blue leader and the red proposer both broadcast their current proposal to every recorder. The first two recorders recorded the leader’s proposal with maximum priority in the previous phase, while the third and final recorder recorded the red proposer’s proposal, with priority 1. Each recorder replies to the proposers with the proposal that the recorder has adopted. The leader receives a majority (2) of replies from the recorders, each carrying its proposal. Of that majority, the proposal with the maximum priority is its own, so it decides it. The red proposer receives a majority (2) of replies from the recorders, one carrying the red proposer’s proposal, and another carrying the leader’s proposal. Of those two, the proposer's own proposal does not have the greater priority, so the red proposer cannot decide, and progresses to the next phase.
  #   anchor: How QuePaxa works under the hood
  #   layout: evidence_band
  # - id: figure-14
  #   source_id: choosing-quepaxa-an-unusual-consensus-algorithm-e4c8a7e8
  #   path: media/014.png
  #   caption: The red proposer fetches the recorded proposals at each recorder, all of which are the leader proposal with maximum priority.
  #   alt_text: The red proposer fetches the recorded proposals at each recorder, all of which are the leader proposal with maximum priority. When the proposer receives a majority (2) of the replies, it adopts the proposal with the maximum value, which is the leader’s proposal.
  #   anchor: How QuePaxa works under the hood
  #   layout: evidence_band
  # - id: figure-15
  #   source_id: choosing-quepaxa-an-unusual-consensus-algorithm-e4c8a7e8
  #   path: media/015.png
  #   caption: Two graphs, labelled “RELATIVE DECISION RATE” and “SHARE OF DECISIONS BY PHASE”, both ranging from 0% to 100% on the y-axis, and from 14:58 to 15:09 UTC on the x-axis.
  #   alt_text: 'Two graphs, labelled “RELATIVE DECISION RATE” and “SHARE OF DECISIONS BY PHASE”, both ranging from 0% to 100% on the y-axis, and from 14:58 to 15:09 UTC on the x-axis. The decision-share graph is split among two phases: Phase 0 (1 round trip) and Phase 2 (3 round trips). A red arrow points to a vertical dashed line, aligned at 15:00:32, labelled “leader failure”, and another arrow points to another vertical dashed line at 15:01:25, labelled “leader replaced”. Between those two dashed lines, the relative decision rate falls from 100% to around 65%. During that same time, the share of decisions changes first, from 100% in Phase 0 to around 95%, then drastically falls to 0%, with 100% of decisions happening in Phase 2. After the leader is replaced at 15:01:25, the decision rate climbs back up to 100%, and the decision rate similarly recovers to 100% in Phase 0.'
