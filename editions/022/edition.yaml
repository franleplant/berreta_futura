    caption: Diagram of the event inbox.
    alt_text: Diagram of the event inbox. A handler (an HTTP endpoint) writes each event to the inbox, a database table that tracks status and drops duplicates, and wakes the worker. The worker reads what’s pending, starts the run, waits for it to finish, and marks the events done.
    anchor: Event inbox
    layout: evidence_band
  - id: figure-3
    source_id: building-always-on-agents-2fce942b
    path: media/003.png
    caption: Diagram of timers.
    alt_text: Diagram of timers. A run sets a timer in a database table, either a follow-up set by the agent or a schedule set by the user. A scheduler finds what’s due and adds an event to the event inbox, which starts the next run.
    anchor: Timers
