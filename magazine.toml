[publication]
name = "Berreta Futura"

[intake]
# `mag capture` adds new sources to this edition's plan.yaml unless --edition
# says otherwise; capturing into a new edition makes it the intake edition.
edition = "013"

[render]
# English prose hyphenates (Typst patterns); no prose block ends more than two
# consecutive lines on a hyphen. Absent means true.
hyphenate_english = true

[site]
# `mag site` publishes these editions, newest first, each from its newest
# git-tracked complete run. download links come from editions/<id>/publish.yaml,
# which `mag publish` writes after uploading to the issue's GitHub Release
# in `repo`.
base_url = "https://berreta.franleplant.com"
editions = ["013", "012", "011", "010", "009", "008", "007", "006"]
repo = "franleplant/berreta_futura"
