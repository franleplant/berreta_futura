[publication]
name = "Berreta Futura"
language = "en"
languages = ["en", "es"]
distribution = "private"
default_profile = "a5"

[paths]
sources = "library/sources"
editions = "editions"
output = "output"
release_state = "library/release-state.yaml"

[editorial]
default_content_mode = "faithful_edit"
substantive_edits_require_approval = true
editorial_additions_must_be_labeled = true

[render]
# Which renderer typesets the A5 reader, read by mag's Rust dispatch and
# overridable per run with `mag render --engine`. "weasyprint" (the default when
# this key is absent) is the HTML/CSS path; "typst" is the native engine being
# built in meta/plans/typst-parity-and-rust-migration.md and currently refuses
# loudly. Anything else fails at load.
engine = "weasyprint"
# Design direction of the reportlab engine. Read only when that engine is
# selected; the weasyprint engine has one design and names it itself.
design = "monument"
trim = "A5"
home_sheet = "A4"
body_font = "SourceSerif4-SmText"
heading_font = "SourceSerif4-Display-Semibold"
# Dead: nothing reads the two below. The live body metrics are 10 / 13 in
# render.py and in assets/weasyprint-a5.css. Do not mistake them for `engine`.
body_size = 9.55
leading = 12.55

[runner]
# Which coding-agent CLI the produce phase executes. Read only by
# src/magazine/runner.py; build, package and release never invoke a model.
#
# Text may be either backend. "codex" (the default when this key is absent)
# runs `codex exec` with the prompt on stdin; "claude" runs `claude -p`.
# Anything else fails at load.
text_backend = "codex"
# Images are NOT a choice. Illustration work always runs through `codex exec`;
# this key exists only so writing anything else here is a loud refusal rather
# than a line the compiler ignores while running Codex anyway.
image_backend = "codex"
# Wall-clock ceiling for one model invocation, in seconds.
timeout_seconds = 900
# `codex exec --sandbox`: read-only, workspace-write, or danger-full-access.
# Produce work writes drafts and art into the tree, so workspace-write.
codex_sandbox = "workspace-write"
# Absent model keys mean "whatever the CLI itself defaults to". Set text_model
# and/or image_model to pin one. codex_binary / claude_binary override which
# executable runs without changing which backend it is -- for installs that are
# not on a service's PATH.
